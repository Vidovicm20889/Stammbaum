// SPRACH-DROPDOWN (Flaggen-Menü)
// ============================================================
function initSprachDropdown() {
  const dropdown = document.getElementById('sprach-dropdown');
  const toggle   = document.getElementById('sprach-toggle');
  const menu     = document.getElementById('sprach-menu');

  // Menü-Einträge aufbauen
  menu.innerHTML = SPRACHEN.map(s =>
    `<li role="option" data-lang="${s.code}">
       <span class="flagge">${FLAGGEN[s.flag]}</span>${s.name}
     </li>`
  ).join('');

  function schliesse() {
    dropdown.classList.remove('offen');
    toggle.setAttribute('aria-expanded', 'false');
  }

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const offen = dropdown.classList.toggle('offen');
    toggle.setAttribute('aria-expanded', offen ? 'true' : 'false');
  });

  menu.querySelectorAll('li').forEach(li => {
    li.addEventListener('click', () => {
      wechselSprache(li.dataset.lang);
      schliesse();
    });
  });

  // Klick außerhalb schließt das Menü
  document.addEventListener('click', (e) => {
    if (!dropdown.contains(e.target)) schliesse();
  });
}

// ============================================================
// INITIALISIERUNG
// ============================================================
// ============================================================
// SUCHBARE DROPDOWNS — wiederverwendbar für ALLE <select>
// Reichert jedes <select> mit Suchfeld (Teilstring, ab 2 Zeichen,
// case-insensitive, Echtzeit) an. Das native <select> bleibt die
// Wahrheit: value/onchange/IDs funktionieren unverändert weiter.
// Ein einziges, geteiltes Panel (kein Leak bei dynamischen Listen).
// ============================================================
let ssPanel, ssSearch, ssList, ssAktivSelect = null, ssRaf = null;

function ssInitPanel() {
  if (ssPanel) return;
  ssPanel = document.createElement('div');
  ssPanel.className = 'ss-panel';
  ssPanel.style.display = 'none';
  ssPanel.innerHTML = '<input type="text" class="ss-search" autocomplete="off"><ul class="ss-list"></ul>';
  document.body.appendChild(ssPanel);
  ssSearch = ssPanel.querySelector('.ss-search');
  ssList   = ssPanel.querySelector('.ss-list');
  ssSearch.addEventListener('input', () => ssRender(ssSearch.value));
  ssSearch.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') ssSchliesse();
    else if (e.key === 'Enter') { e.preventDefault(); const f = ssList.querySelector('.ss-opt'); if (f) ssWaehle(f.dataset.val); }
  });
  // Touch-sichere Auswahl: Tap selektiert, Scrollen nicht (siehe tippAuswahl).
  tippAuswahl(ssList, '.ss-opt', li => ssWaehle(li.dataset.val));
}

// Such-Normalisierung: Kyrillisch -> Latein, klein, UND diakritik-insensitiv
// (ć č š ž đ -> c c s z d) — analog zum Backend merge_norm. So findet die Eingabe
// "Knezevic" auch das Label "Knežević" (und kyrillisch "Кнежевић").
function ssFold(s) {
  return srCyr2Lat(String(s || '')).toLowerCase()
    .replace(/[čć]/g, 'c').replace(/š/g, 's').replace(/ž/g, 'z').replace(/đ/g, 'd');
}

// Liste füllen: <2 Zeichen = alle; sonst Teilstring (case-, schrift- UND
// diakritik-insensitiv über ssFold, damit z. B. "Knezevic" -> "Knežević" matcht).
function ssRender(filter) {
  if (!ssAktivSelect) return;
  const f = ssFold((filter || '').trim());
  const opts = Array.from(ssAktivSelect.options);
  const vis = f.length < 2 ? opts : opts.filter(o => ssFold(o.textContent || '').includes(f));
  if (vis.length === 0) {
    ssList.innerHTML = '<li class="ss-empty">' + escapeHtml(t('ss_keine')) + '</li>';
    return;
  }
  ssList.innerHTML = vis.map(o =>
    '<li class="ss-opt' + (o.value === ssAktivSelect.value ? ' ss-selected' : '') +
    '" data-val="' + escapeHtml(o.value) + '">' + escapeHtml(o.textContent) + '</li>'
  ).join('');
}

function ssIstTouch() {
  return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
}

function ssPositioniere(select) {
  const vv = window.visualViewport;
  // TOUCH/MOBILE: stabiles Sheet, am OBEREN Rand des SICHTBAREN Bereichs verankert.
  // Folgt bewusst NICHT dem Feld und springt NICHT, wenn die Tastatur aufgeht — die
  // Tastatur liegt unten, das Sheet oben (über der Tastatur), die Höhe schrumpft mit
  // visualViewport.height. Löst: halb verdeckter Screen / Hochklapp-Chaos, Suchfeld
  // nicht antippbar, Panel schließt beim Tippen (Overlap mit dem Steuerelement).
  if (ssIstTouch()) {
    const rand = 10;
    const vw   = (vv && vv.width)  || window.innerWidth;
    const vh   = (vv && vv.height) || window.innerHeight;
    const offX = (vv && vv.offsetLeft) || 0;
    const offY = (vv && vv.offsetTop)  || 0;
    const breite = Math.min(440, vw - 2 * rand);
    ssPanel.classList.add('ss-sheet');
    ssPanel.style.width     = breite + 'px';
    ssPanel.style.maxHeight = Math.max(160, vh - 2 * rand) + 'px';
    ssPanel.style.left      = (offX + (vw - breite) / 2) + 'px';
    ssPanel.style.top       = (offY + rand) + 'px';
    return;
  }
  ssPanel.classList.remove('ss-sheet');
  const r  = select._ssControl.getBoundingClientRect();
  // Sichtbare Höhe bevorzugen (visualViewport berücksichtigt mobile Tastatur/Zoom).
  const vh = (vv && vv.height) || window.innerHeight;
  const rand = 8;                                   // Sicherheitsabstand zum Bildschirmrand
  const platzUnten = vh - r.bottom - rand;
  const platzOben  = r.top - rand;
  // Standard: NACH UNTEN (direkt unter dem Feld). Nur nach oben, wenn unten zu eng
  // ist UND oben spürbar mehr Platz hat — nicht schon bei knapp < 280px.
  const nachUnten = platzUnten >= 160 || platzUnten >= platzOben;
  // Panelhöhe an den verfügbaren Platz anpassen, statt es weit weg ans Bildschirm-
  // ende zu klemmen (sonst löst sich die Liste vom Feld). Max. 280px (siehe CSS).
  const hoehe = Math.max(120, Math.min(280, nachUnten ? platzUnten : platzOben));
  ssPanel.style.maxHeight = hoehe + 'px';
  const ph = Math.min(ssPanel.offsetHeight, hoehe);  // tatsächliche Höhe nach maxHeight
  ssPanel.style.left  = r.left + 'px';
  ssPanel.style.width = r.width + 'px';
  // Beim Hochklappen an die FELD-Oberkante andocken (Panel-Unterkante = r.top - 2),
  // damit kein Spalt entsteht; nach unten direkt an die Feld-Unterkante.
  ssPanel.style.top   = (nachUnten ? r.bottom + 2 : Math.max(rand, r.top - ph - 2)) + 'px';
}

function ssOeffne(select) {
  ssSchliesse();
  ssAktivSelect = select;
  ssSearch.value = '';
  ssSearch.placeholder = t('ss_suche');
  ssRender('');
  ssPanel.style.visibility = 'hidden';   // erst messen, dann sichtbar -> kein Flackern
  ssPanel.style.display = 'flex';
  ssPositioniere(select);
  ssPanel.style.visibility = '';
  select._ssControl.classList.add('ss-open');
  // Auto-Fokus auf Touch SYNCHRON im selben User-Gesture (sonst öffnet iOS die
  // Tastatur nicht) und ohne Page-Scroll (preventScroll) — das Sheet sitzt stabil
  // oben über der Tastatur, verdeckt die Liste also nicht mehr.
  if (ssIstTouch()) { try { ssSearch.focus({ preventScroll: true }); } catch (_) { ssSearch.focus(); } }
  else setTimeout(() => ssSearch.focus(), 30);
  ssRaf = requestAnimationFrame(ssSichtbarkeitsWaechter);   // schließt Panel, wenn Overlay/Menü zugeht
}

// Solange das Panel offen ist: wird das Steuerelement ausgeblendet (Overlay/Menü
// geschlossen — egal wie: ×, Backdrop, Escape, programmatisch), Panel mitschließen.
// offsetParent === null => Element oder ein Vorfahre ist display:none.
function ssSichtbarkeitsWaechter() {
  if (!ssAktivSelect) return;
  const c = ssAktivSelect._ssControl;
  if (!c || c.offsetParent === null) { ssSchliesse(); return; }
  ssRaf = requestAnimationFrame(ssSichtbarkeitsWaechter);
}

function ssSchliesse() {
  if (!ssAktivSelect) return;
  if (ssRaf) { cancelAnimationFrame(ssRaf); ssRaf = null; }
  ssPanel.style.display = 'none';
  if (ssAktivSelect._ssControl) ssAktivSelect._ssControl.classList.remove('ss-open');
  ssAktivSelect = null;
}

function ssWaehle(val) {
  const s = ssAktivSelect;
  if (!s) return;
  s.value = val;                                   // intercepted -> Label-Sync
  ssSchliesse();
  s.dispatchEvent(new Event('change', { bubbles: true }));   // bestehende onchange-Handler auslösen
}

function ssSyncLabel(select) {
  if (!select._ssControl) return;
  const o = select.options[select.selectedIndex];
  select._ssControl.querySelector('.ss-control-text').textContent = o ? o.textContent : '';
}

function macheSelectSuchbar(select) {
  if (select._ssControl || select.classList.contains('no-search')) return;
  // Steuerelement, das das native <select> ersetzt (kopiert dessen Klassen -> gleiches Aussehen)
  const control = document.createElement('div');
  control.className = (select.className ? select.className + ' ' : '') + 'ss-control';
  control.tabIndex = 0;
  control.setAttribute('role', 'button');
  control.innerHTML = '<span class="ss-control-text"></span><span class="ss-caret">▾</span>';
  select.parentNode.insertBefore(control, select.nextSibling);
  select.classList.add('ss-native');
  select._ssControl = control;

  // value-Interception: Label bleibt auch bei programmatischer Wertänderung synchron
  const desc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  Object.defineProperty(select, 'value', {
    configurable: true,
    get() { return desc.get.call(this); },
    set(v) { desc.set.call(this, v); ssSyncLabel(this); }
  });

  const toggle = (e) => {
    e.preventDefault(); e.stopPropagation();
    if (select.disabled) return;
    if (ssAktivSelect === select) ssSchliesse(); else ssOeffne(select);
  };
  control.addEventListener('click', toggle);
  control.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') toggle(e); });

  // Native Sichtbarkeit/disabled auf das Steuerelement spiegeln
  const spiegele = () => {
    control.style.display = (select.style.display === 'none') ? 'none' : '';
    control.classList.toggle('ss-disabled', select.disabled);
  };
  spiegele();

  // Reagiere auf: dynamische Optionen, style/disabled-Änderungen
  new MutationObserver(() => {
    ssSyncLabel(select);
    spiegele();
    if (ssAktivSelect === select) ssRender(ssSearch.value);
  }).observe(select, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'disabled'] });

  ssSyncLabel(select);
}

function macheAlleSelectsSuchbar(root) {
  (root || document).querySelectorAll('select:not(.ss-native):not(.no-search)').forEach(macheSelectSuchbar);
}

// Touch-sichere Auswahl in (scrollbaren) Listen: selektiert NUR bei einem echten
// Tap (kaum Bewegung), nicht beim Scroll-Wischen; feuert auf pointerup, also VOR
// dem verzögerten Ghost-Click und vor Tastatur-Reflow. Funktioniert auch mit Maus.
function tippAuswahl(container, selector, handler) {
  let sx = 0, sy = 0, item = null, moved = false;
  container.addEventListener('pointerdown', (e) => {
    item = e.target.closest(selector); sx = e.clientX; sy = e.clientY; moved = false;
  });
  container.addEventListener('pointermove', (e) => {
    if (item && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) moved = true;
  });
  container.addEventListener('pointerup', (e) => {
    const ziel = e.target.closest(selector);
    if (item && ziel === item && !moved) { e.preventDefault(); handler(item); }
    item = null;
  });
  container.addEventListener('pointercancel', () => { item = null; });   // Scroll-Übernahme -> kein Select
}

function initSuchbareSelects() {
  ssInitPanel();
  macheAlleSelectsSuchbar(document);
  // Schließen bei Tipp/Klick außerhalb. WICHTIG: pointerdown statt click — feuert
  // sofort am echten Punkt, vor Tastatur-Reflow/Scroll/Ghost-Click (Android-Bug).
  document.addEventListener('pointerdown', (e) => {
    if (ssAktivSelect && !ssPanel.contains(e.target) &&
        e.target !== ssAktivSelect._ssControl && !ssAktivSelect._ssControl.contains(e.target)) ssSchliesse();
  });
  // Resize/Scroll NICHT schließen (mobile Tastatur löst Resize aus!) -> nur neu positionieren,
  // damit das Panel am Steuerelement „klebt".
  window.addEventListener('resize', () => { if (ssAktivSelect) ssPositioniere(ssAktivSelect); });
  window.addEventListener('scroll', (e) => { if (ssAktivSelect && !ssPanel.contains(e.target)) ssPositioniere(ssAktivSelect); }, true);
}

// ============================================================
// DATUMSFELDER — einheitlicher Vanilla-Kalender (Date Picker)
// Eingabe per Kalender ODER manuell. Speicherung kanonisch als ISO
// (YYYY-MM-DD) in stammbaum_daten (date-Spalte bleibt NULL). Anzeige
// sprachabhängig: Eingabe-Kurzformat + benutzerfreundliches Langformat.
// Nicht-parsebare Altwerte (Jahr, "um 1850", Bereiche) bleiben Freitext.
// ============================================================
const KALENDER = {
  de: { monate: ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],
        wochentage: ['Mo','Di','Mi','Do','Fr','Sa','So'], wochenStart: 1, heute: 'Heute', loeschen: 'Löschen' },
  sr: { monate: ['јануар','фебруар','март','април','мај','јун','јул','август','септембар','октобар','новембар','децембар'],
        wochentage: ['Пон','Уто','Сре','Чет','Пет','Суб','Нед'], wochenStart: 1, heute: 'Данас', loeschen: 'Обриши' },
  hr: { monate: ['siječanj','veljača','ožujak','travanj','svibanj','lipanj','srpanj','kolovoz','rujan','listopad','studeni','prosinac'],
        wochentage: ['Pon','Uto','Sri','Čet','Pet','Sub','Ned'], wochenStart: 1, heute: 'Danas', loeschen: 'Obriši' },
  ba: { monate: ['januar','februar','mart','april','maj','juni','juli','august','septembar','oktobar','novembar','decembar'],
        wochentage: ['Pon','Uto','Sri','Čet','Pet','Sub','Ned'], wochenStart: 1, heute: 'Danas', loeschen: 'Obriši' },
  en: { monate: ['January','February','March','April','May','June','July','August','September','October','November','December'],
        wochentage: ['Su','Mo','Tu','We','Th','Fr','Sa'], wochenStart: 0, heute: 'Today', loeschen: 'Clear' }
};
const DATUM_PH = { de: 'TT.MM.JJJJ', sr: 'DD.MM.GGGG', hr: 'DD.MM.GGGG', ba: 'DD.MM.GGGG', en: 'MM/DD/YYYY' };

function dpZahl(n) { return String(n).padStart(2, '0'); }
function isoVon(j, m, t) { return j + '-' + dpZahl(m) + '-' + dpZahl(t); }
function istIsoDatum(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); }
function dpGueltig(j, m, t) {
  if (m < 1 || m > 12 || t < 1 || t > 31) return null;
  const d = new Date(j, m - 1, t);
  if (d.getFullYear() !== j || d.getMonth() !== m - 1 || d.getDate() !== t) return null;  // 31.02. etc. abfangen
  return isoVon(j, m, t);
}
// Beliebigen Text -> ISO 'YYYY-MM-DD' oder null (= Freitext/ungefähr, bleibt erhalten)
function parseDatumZuIso(text) {
  const s = (text || '').trim(); if (!s) return null; let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))  return dpGueltig(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/))) return dpGueltig(+m[3], +m[2], +m[1]);  // TT.MM.JJJJ
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return dpGueltig(+m[3], +m[1], +m[2]);  // MM/DD/YYYY
  return null;
}
function isoZuKurz(iso, lang) {
  const m = (iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return iso || '';
  return (lang === 'en') ? (m[2] + '/' + m[3] + '/' + m[1]) : (m[3] + '.' + m[2] + '.' + m[1]);
}
function isoZuLang(iso, lang) {
  const m = (iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return iso || '';
  const kal = KALENDER[lang] || KALENDER.de;
  const tag = +m[3], monat = kal.monate[+m[2] - 1], jahr = m[1];
  return (lang === 'en') ? (monat + ' ' + tag + ', ' + jahr) : (tag + '. ' + monat + ' ' + jahr);
}
// Gespeicherten Wert benutzerfreundlich anzeigen (parsebar -> Langformat; sonst verbatim)
function formatDatumLang(value) {
  const iso = istIsoDatum(value) ? value : parseDatumZuIso(value);
  return iso ? isoZuLang(iso, aktuelleSprache) : (value || '');
}
// Kanonischer Speicherwert eines Feldes: ISO falls parsebar, sonst Freitext
function datumWert(input) {
  if (!input) return '';
  const iso = parseDatumZuIso(input.value);
  return iso || input.value.trim();
}
// Feld setzen (ISO oder Freitext) -> Kurzformat anzeigen + iso merken
function datumSetzen(input, value) {
  if (!input) return;
  if (!value) { input.value = ''; delete input.dataset.iso; return; }
  const iso = istIsoDatum(value) ? value : parseDatumZuIso(value);
  if (iso) { input.dataset.iso = iso; input.value = isoZuKurz(iso, aktuelleSprache); }
  else     { delete input.dataset.iso; input.value = value; }
}

let dpPanel, dpAktivInput = null, dpJahr, dpMonat, dpRaf = null;

function dpInitPanel() {
  if (dpPanel) return;
  dpPanel = document.createElement('div');
  dpPanel.className = 'dp-panel'; dpPanel.style.display = 'none';
  dpPanel.innerHTML =
    '<div class="dp-head">' +
      '<button type="button" class="dp-nav" data-step="-12">«</button>' +
      '<button type="button" class="dp-nav" data-step="-1">‹</button>' +
      '<span class="dp-title"></span>' +
      '<button type="button" class="dp-nav" data-step="1">›</button>' +
      '<button type="button" class="dp-nav" data-step="12">»</button>' +
    '</div>' +
    '<div class="dp-weekdays"></div><div class="dp-grid"></div>' +
    '<div class="dp-foot"><button type="button" class="dp-today"></button><button type="button" class="dp-clear"></button></div>';
  document.body.appendChild(dpPanel);
  dpPanel.querySelectorAll('.dp-nav').forEach(b =>
    b.addEventListener('click', e => { e.preventDefault(); dpVerschiebe(+b.dataset.step); }));
  dpPanel.querySelector('.dp-grid').addEventListener('click', e => {
    const d = e.target.closest('.dp-day[data-iso]'); if (d) dpWaehle(d.dataset.iso);
  });
  dpPanel.querySelector('.dp-today').addEventListener('click', e => {
    e.preventDefault(); const n = new Date(); dpWaehle(isoVon(n.getFullYear(), n.getMonth() + 1, n.getDate()));
  });
  dpPanel.querySelector('.dp-clear').addEventListener('click', e => {
    e.preventDefault();
    if (dpAktivInput) { const i = dpAktivInput; datumSetzen(i, ''); dpSchliesse(); i.dispatchEvent(new Event('input', { bubbles: true })); }
  });
}

function dpVerschiebe(monate) {
  let m = dpMonat + monate;
  dpJahr += Math.floor(m / 12);
  dpMonat = ((m % 12) + 12) % 12;
  dpRender();
}

function dpRender() {
  if (!dpPanel) return;
  const kal = KALENDER[aktuelleSprache] || KALENDER.de;
  dpPanel.querySelector('.dp-title').textContent = kal.monate[dpMonat] + ' ' + dpJahr;
  dpPanel.querySelector('.dp-weekdays').innerHTML = kal.wochentage.map(d => '<span>' + escapeHtml(d) + '</span>').join('');
  dpPanel.querySelector('.dp-today').textContent = kal.heute;
  dpPanel.querySelector('.dp-clear').textContent = kal.loeschen;
  const start = kal.wochenStart;                                       // 1=Mo, 0=So
  let offset = (new Date(dpJahr, dpMonat, 1).getDay() - start + 7) % 7;
  const tage = new Date(dpJahr, dpMonat + 1, 0).getDate();
  const n = new Date(); const heuteIso = isoVon(n.getFullYear(), n.getMonth() + 1, n.getDate());
  const selIso = dpAktivInput && dpAktivInput.dataset.iso;
  let html = '';
  for (let i = 0; i < offset; i++) html += '<button type="button" class="dp-day dp-leer" disabled></button>';
  for (let d = 1; d <= tage; d++) {
    const iso = isoVon(dpJahr, dpMonat + 1, d);
    const cls = 'dp-day' + (iso === heuteIso ? ' dp-heute' : '') + (iso === selIso ? ' dp-sel' : '');
    html += '<button type="button" class="' + cls + '" data-iso="' + iso + '">' + d + '</button>';
  }
  dpPanel.querySelector('.dp-grid').innerHTML = html;
}

function dpPositioniere(ref) {
  const r = ref.getBoundingClientRect();
  // Sichtbare Höhe bevorzugen (visualViewport berücksichtigt mobile Tastatur/Zoom).
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const ph = dpPanel.offsetHeight, pw = dpPanel.offsetWidth;
  const rand = 8;
  const platzUnten = vh - r.bottom - rand;
  const platzOben  = r.top - rand;
  // Standard: NACH UNTEN (direkt unter dem Feld). Nach oben nur, wenn unten nicht
  // passt UND oben mehr Platz hat (Kalender hat feste Höhe, daher kein Shrink).
  const nachUnten = platzUnten >= ph || platzUnten >= platzOben;
  let left = r.left;
  if (left + pw > window.innerWidth - rand) left = Math.max(rand, window.innerWidth - pw - rand);
  dpPanel.style.left = left + 'px';
  // Beim Hochklappen Panel-Unterkante an die Feld-Oberkante andocken (kein Spalt).
  dpPanel.style.top  = (nachUnten ? r.bottom + 2 : Math.max(rand, r.top - ph - 2)) + 'px';
}

function dpOeffne(input) {
  dpInitPanel();
  dpSchliesse();
  dpAktivInput = input;
  const iso = input.dataset.iso || parseDatumZuIso(input.value);
  const base = iso ? new Date(iso + 'T00:00:00') : new Date();
  dpJahr = base.getFullYear(); dpMonat = base.getMonth();
  dpRender();
  dpPanel.style.visibility = 'hidden'; dpPanel.style.display = 'block';
  dpPositioniere(input._dpWrap || input);
  dpPanel.style.visibility = '';
  dpRaf = requestAnimationFrame(dpSichtbarkeitsWaechter);
}

// Schließt das Panel, sobald das Feld ausgeblendet wird (Overlay/Menü zu) — wie ss.
function dpSichtbarkeitsWaechter() {
  if (!dpAktivInput) return;
  const ref = dpAktivInput._dpWrap || dpAktivInput;
  if (!ref || ref.offsetParent === null) { dpSchliesse(); return; }
  dpRaf = requestAnimationFrame(dpSichtbarkeitsWaechter);
}

function dpSchliesse() {
  if (!dpAktivInput) return;
  if (dpRaf) { cancelAnimationFrame(dpRaf); dpRaf = null; }
  if (dpPanel) dpPanel.style.display = 'none';
  dpAktivInput = null;
}

function dpWaehle(iso) {
  const inp = dpAktivInput; if (!inp) return;
  datumSetzen(inp, iso);
  dpSchliesse();
  inp.dispatchEvent(new Event('input', { bubbles: true }));
  inp.dispatchEvent(new Event('change', { bubbles: true }));
}

function macheDatumsfeld(input) {
  if (input._dpReady) return;
  input._dpReady = true;
  input.setAttribute('autocomplete', 'off');
  const wrap = document.createElement('span'); wrap.className = 'dp-wrap';
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'dp-btn'; btn.setAttribute('aria-label', 'Kalender'); btn.textContent = '📅';
  wrap.appendChild(btn);
  input._dpWrap = wrap;
  input.placeholder = DATUM_PH[aktuelleSprache] || DATUM_PH.de;
  if (input.value) datumSetzen(input, input.value);   // evtl. vorbefüllten Wert normalisieren
  btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); (dpAktivInput === input) ? dpSchliesse() : dpOeffne(input); });
  input.addEventListener('blur', () => { const iso = parseDatumZuIso(input.value); if (iso) datumSetzen(input, iso); else delete input.dataset.iso; });
}

function macheAlleDatumsfelder(root) {
  (root || document).querySelectorAll('input.dp-input').forEach(el => { if (!el._dpReady) macheDatumsfeld(el); });
}

// Sprachwechsel: Platzhalter + Kurzformat-Anzeige anpassen, offenen Kalender neu rendern
function aktualisiereDatumsfelder() {
  document.querySelectorAll('input.dp-input').forEach(inp => {
    if (!inp._dpReady) return;
    inp.placeholder = DATUM_PH[aktuelleSprache] || DATUM_PH.de;
    if (inp.dataset.iso) inp.value = isoZuKurz(inp.dataset.iso, aktuelleSprache);
  });
  if (dpAktivInput) dpRender();
}

// ============================================================
// SESSION- & VERSIONS-MANAGEMENT
// - Auto-Logout nach 30 Min Inaktivität (mit Warnung 1 Min vorher)
// - Nach Auto-Logout + erneutem Login: harter Reload -> neueste Version
// - Versionsprüfung erkennt neue Deployments -> Update-Banner
// - Harter Reload via Cache-Busting (?v=timestamp): Single-File auf GitHub Pages
//   hat keine separat gehashten Assets; der Query-Param umgeht den HTML-Cache.
// ============================================================
const APP_VERSION = (document.querySelector('meta[name="app-version"]') || {}).content || '';

function hardReload() {
  const basis = location.href.replace(/[?#].*$/, '');   // bestehende Query/Hash entfernen
  location.replace(basis + '?v=' + Date.now());          // frischer Param -> umgeht HTML-Cache
}

// ---- Inaktivitäts-Überwachung ----
const SESSION_INAKTIV_MS = 30 * 60 * 1000;
const SESSION_WARN_MS    = 60 * 1000;            // 1 Minute vor Logout warnen
let sessIdleTimer = null, sessWarnTimer = null, sessLetzteAktivitaet = 0;

function resetInaktivTimer() {
  clearTimeout(sessIdleTimer); clearTimeout(sessWarnTimer);
  versteckeSessionWarnung();
  if (!aktuellerUser) return;                    // nur für eingeloggte Nutzer
  sessWarnTimer = setTimeout(zeigeSessionWarnung, SESSION_INAKTIV_MS - SESSION_WARN_MS);
  sessIdleTimer = setTimeout(sessionAutoLogout, SESSION_INAKTIV_MS);
}
function sessAktivitaet() {
  if (!aktuellerUser) return;
  const now = Date.now();
  if (now - sessLetzteAktivitaet < 2000) return;  // throttle (mousemove/scroll feuern oft)
  sessLetzteAktivitaet = now;
  resetInaktivTimer();
}
function zeigeSessionWarnung() {

function sessionVerlaengern() { versteckeSessionWarnung(); resetInaktivTimer(); }
async function sessionAutoLogout() {
  versteckeSessionWarnung();
  clearTimeout(sessIdleTimer); clearTimeout(sessWarnTimer);
  sessionStorage.setItem('reloadNachLogin', '1');   // nächster Login -> harter Reload (neueste Version)
  // scope:'local': NUR diese (inaktive) Session abmelden. Default 'global' würde alle
  // Sessions des Kontos serverseitig widerrufen -> eine andere, GERADE AKTIVE Session
  // (zweiter Tab/Handy) flöge mitten in der Arbeit ohne Warnung raus (SIGNED_OUT).
  try { await sbClient.auth.signOut({ scope: 'local' }); } catch (e) {}   // -> onAuthStateChange -> loescheUser
  zeigeHinweis(t('session_abgemeldet'));
}
function initSessionUeberwachung() {
  ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(ev =>
    document.addEventListener(ev, sessAktivitaet, { passive: true, capture: true }));
  // Bei Rückkehr in den Tab: Hintergrund-Tabs drosseln Timer -> reale verstrichene
  // Zeit prüfen und ggf. sofort abmelden (statt auf den evtl. „eingefrorenen" Timer zu warten).
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !aktuellerUser) return;
    if (sessLetzteAktivitaet && Date.now() - sessLetzteAktivitaet >= SESSION_INAKTIV_MS) sessionAutoLogout();
    else sessAktivitaet();
  });
}

// ---- Versionsprüfung (neues Deployment erkennen) ----
let updateGemeldet = false, letzteVersionsPruefung = 0;
async function pruefeNeueVersion() {
  if (updateGemeldet) return;
  const now = Date.now();
  if (now - letzteVersionsPruefung < 5 * 60 * 1000) return;   // höchstens alle 5 Min
  letzteVersionsPruefung = now;
  try {
    // Range: nur die ersten KB (app-version-Meta steht oben im <head>); no-store = nie aus Cache.
    const res = await fetch(location.pathname + '?vc=' + now, { cache: 'no-store', headers: { 'Range': 'bytes=0-4095' } });
    if (!res.ok && res.status !== 206) return;
    const text = await res.text();
    const m = text.match(/<meta name="app-version" content="([^"]+)">/);
    const serverVersion = m ? m[1] : '';
    if (serverVersion && APP_VERSION && serverVersion !== APP_VERSION) {
      updateGemeldet = true;
      const b = document.getElementById('update-banner');
      if (b) b.style.display = 'flex';
    }
  } catch (e) { /* offline / Fehler -> ignorieren */ }
}
function initVersionsPruefung() {
  setTimeout(pruefeNeueVersion, 60 * 1000);            // ~1 Min nach Start
  setInterval(pruefeNeueVersion, 20 * 60 * 1000);      // alle 20 Min
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pruefeNeueVersion(); });
}

  document.addEventListener('pointerdown', (e) => {
    const menu = document.getElementById('nav-menu');

        !(dpAktivInput._dpWrap && dpAktivInput._dpWrap.contains(e.target))) dpSchliesse();
  });
  // Resize/Scroll NICHT schließen (mobile Tastatur = Resize) -> Kalender neu positionieren
  window.addEventListener('resize', () => { if (dpAktivInput) dpPositioniere(dpAktivInput._dpWrap || dpAktivInput); });
  window.addEventListener('scroll', (e) => { if (dpAktivInput && !dpPanel.contains(e.target)) dpPositioniere(dpAktivInput._dpWrap || dpAktivInput); }, true);
  // Tab wird wieder sichtbar -> Obavještenja sofort aktualisieren (nicht erst beim nächsten Poll-Tick)

  // Tab wieder sichtbar -> während verstecktem Tab eingetroffene Live-Sync-Änderungen nachholen

  // Tab wieder sichtbar -> während verstecktem Tab eingetroffene Benachrichtigungen nachholen

  });
  // Live-Indikator-Panel schließen bei Tipp außerhalb (pointerdown = touch-sicher, kein Ghost-Click)

  // entfernen, damit ein späterer Reload die Liste nicht erneut aufpoppt.
  try {
    const params = new URLSearchParams(location.search);
    if (params.get('obav') === '1') {
      deepLinkObav = true;
      params.delete('obav');

    // Deep-Link aus der Event-Einladungs-Mail: ?event=<id> -> nach Login Event öffnen.
    if (params.get('event')) {
      deepLinkEvent = params.get('event');
      params.delete('event');
    }
    if (params.toString() !== new URLSearchParams(location.search).toString()) {
      const q = params.toString();
      history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
    }
  } catch (e) { /* URL nicht parsebar -> ignorieren */ }

  initBaum();
  bindeEmailLiveCheck(document);   // globale E-Mail-Live-Validierung (alle E-Mail-Felder)
  wechselSprache(aktuelleSprache, false);   // nur anwenden, NICHT speichern (sonst Willkommen-Overlay nur einmal)

  if (!spracheWarGespeichert) zeigeWillkommenSprache();

// Nachname des aktuell angezeigten Stammbaums (folgt dem Fokus, z.B. Petrović).
function aktualisiereKopf(rootId) {
  const h1    = document.querySelector('header h1');
  const sub   = document.querySelector('.untertitel');
  const stats = document.getElementById('header-stats');

  if (!aktuellerUser) {
    if (h1)    h1.textContent  = nm(t('kopf_neutral'));
    if (sub)   sub.textContent = t('kopf_neutral_sub');
    if (stats) stats.style.display = 'none';
    return;
  }

  // Eingeloggt, aber KEIN zugänglicher Stammbaum (Leer-Zustand): neutraler Kopf ohne
  // (veralteten) Baumnamen und ohne Personen-/Familienzahl. aktuelleDaten hält nach dem
  // Löschen noch die alten Daten -> Name/Zahlen sonst falsch.
  if (Object.keys(stammbaeumeListe || {}).length === 0) {
    if (h1)    h1.textContent  = nm(t('kopf_neutral'));
    if (sub)   sub.textContent = t('kopf_neutral_sub');
    if (stats) stats.style.display = 'none';
    return;
  }

  if (sub)   sub.textContent = t('untertitel');
  if (stats) stats.style.display = '';

  // Name: gewählter Stammbaum (Multi-Tree); sonst Nachname der Wurzel
  let name;
  if (aktuellerStammbaumId && stammbaeumeListe[aktuellerStammbaumId]) {
    name = stammbaeumeListe[aktuellerStammbaumId];
  } else {
    const wurzel = (rootId && aktuelleDaten.persons[rootId]) ? rootId
                 : (fokusPersonId && aktuelleDaten.persons[fokusPersonId]) ? fokusPersonId
                 : (aktuelleDaten.persons['I500009'] ? 'I500009'
                    : Object.keys(aktuelleDaten.persons)[0]);
    const wp = aktuelleDaten.persons[wurzel];
    name = (wp && wp.surname) ? wp.surname : t('kopf_neutral');
  }
  if (h1) {
    let txt = nm(String(name).toLocaleUpperCase('de'));
    const zus = aktuellerStammbaumId && stammbaeumeZusatz[aktuellerStammbaumId];
    if (zus) txt += ' (' + nm(zus) + ')';   // Zusatz zur Unterscheidung gleichnamiger Bäume
    h1.textContent = txt;

  // Zahlen: Personen im aktuellen Baum (sonst Gesamt)

      const n = Object.values(aktuelleDaten.persons).filter(p => p._tree === aktuellerStammbaumId).length;
      stats.textContent = t('stats_baum', { p: n });

//                     seine Eingabe nicht mehr sieht — siehe Mobile-Bug). Stattdessen
//                     nur ein dezenter Treffer-Hinweis in der Baum-Info.
function suchImBaum(suche, interaktiv) {
  if (!suche) {
    fokusPersonId = null;
    zeichneBaum(aktuelleWurzel(), 12, 0);
    return;
  }

  // Diakritik-/schrift-insensitiv (ssFold) + gespiegelte Karten (gleiche identitaet_id)
  // als EINE Person entdoppeln.
  const sq = ssFold(suche);
  const treffer = entdoppeltePersonen(Object.values(aktuelleDaten.persons).filter(p =>
    ssFold(p.name || '').includes(sq)
  ));

  if (treffer.length === 0) {
    document.getElementById('baum-info').innerHTML =
      `<strong style="color:var(--akzent-hell)">${t('keine_treffer')}</strong>`;
    return;
  }

  if (treffer.length === 1) {
    zentriereAufPerson(treffer[0].id);
    return;
  }

  if (interaktiv) {
    zeigAuswahlDialog(treffer);
  } else {
    // Mehrere Treffer beim Tippen: Feld bleibt sichtbar, Hinweis statt Modal.
    document.getElementById('baum-info').innerHTML =
      `<strong style="color:var(--akzent-hell)">${escapeHtml(t('suche_mehrere', { n: treffer.length }))}</strong>`;
  }
}

// ============================================================
// PERSONALISIERTE STANDARD-/AUSSCHNITTS-ANSICHT (große Bäume)
// Alle Daten liegen weiter komplett im Speicher (RLS-begrenzt) — wir RENDERN
// nur einen relevanten Ausschnitt (kein DB-Lazy-Loading, stack-konform).
// v1-Grenze (bewusst, wie der übrige Renderer): der Baum zeigt EINE aufsteigende
// Blutlinie (ein Elternteil je Ebene als Wurzel-Strang); der andere Elternteil
// erscheint nur als Partnerkarte. Großeltern/Urgroßeltern + Halbgeschwister sind
// daher nur entlang des gerenderten Strangs sichtbar (Single-Root-d3-Baum).
// ============================================================

// Identitäts-Zwillinge (gleiche reale Person über Bäume, identitaet_id)
function _ansTwins(id) {
  const p = aktuelleDaten.persons[id];
  if (!p || !p._ident) return [id];
  return Object.values(aktuelleDaten.persons).filter(q => q._ident === p._ident).map(q => q.id);
}
function _ansEltern(id) {
  const out = new Set();
  _ansTwins(id).forEach(t => {
    const p = aktuelleDaten.persons[t]; if (!p) return;
    (p.families_child || []).forEach(fid => {
      const f = aktuelleDaten.families[fid]; if (!f) return;
      if (f.husband) out.add(f.husband);
      if (f.wife)    out.add(f.wife);
    });
  });
  return out;
}
function _ansKinder(id) {
  const out = new Set();
  _ansTwins(id).forEach(t => {
    const p = aktuelleDaten.persons[t]; if (!p) return;
    (p.families_spouse || []).forEach(fid => {
      const f = aktuelleDaten.families[fid]; if (!f) return;
      (f.children || []).forEach(c => out.add(c));
    });
  });
  return out;
}
function _ansPartner(id) {
  const out = new Set(); const me = new Set(_ansTwins(id));
  _ansTwins(id).forEach(t => {
    const p = aktuelleDaten.persons[t]; if (!p) return;
    (p.families_spouse || []).forEach(fid => {
      const f = aktuelleDaten.families[fid]; if (!f) return;
      if (f.husband && !me.has(f.husband)) out.add(f.husband);
      if (f.wife    && !me.has(f.wife))    out.add(f.wife);
    });
  });
  return out;
}
// Vollgeschwister UND Halbgeschwister (Kinder irgendeines Elternteils, ohne sich selbst)
function _ansGeschwister(id) {
  const out = new Set(); const me = new Set(_ansTwins(id));
  _ansEltern(id).forEach(par => _ansKinder(par).forEach(c => { if (!me.has(c)) out.add(c); }));
  return out;
}
// Ext-ID der MIT MEINEM KONTO verknüpften Karte im AKTUELL geöffneten Baum
// (inkl. Identitäts-Zwilling, der im aktuellen Baum liegt).
function meineKarteImBaum() {
  if (!aktuellerUser || !aktuellerStammbaumId || !aktuelleDaten || !aktuelleDaten.persons) return null;
  const uid = aktuellerUser.id;
  let treffer = null;
  Object.values(aktuelleDaten.persons).forEach(p => {
    if (treffer || p._userId !== uid) return;
    if (p._tree === aktuellerStammbaumId) { treffer = p.id; return; }
    // verknüpfte Karte liegt in anderem Baum -> Zwilling im aktuellen Baum?
    _ansTwins(p.id).forEach(t => {
      const q = aktuelleDaten.persons[t];
      if (!treffer && q && q._tree === aktuellerStammbaumId) treffer = t;
    });
  });
  return treffer;
}

// Alle Nachkommen einer Person (rekursiv) + deren Partner über add() einsammeln.
// (Die Start-Person selbst wird NICHT hinzugefügt — das macht der Aufrufer.)
function _ansAlleNachkommen(startId, add) {
  const stack = [startId], seen = new Set();
  while (stack.length) {
    const x = stack.pop(); if (seen.has(x)) continue; seen.add(x);
    _ansPartner(x).forEach(add);
    _ansKinder(x).forEach(c => { add(c); stack.push(c); });
  }
}

// Set der anzuzeigenden Personen (ext-IDs inkl. aller Zwillinge) aus Kategorien.
// kat: { eltern, partner, geschwister, kinder, grosseltern, urgrosseltern, cousins, nachkommen }
function verwandtschaftsSet(focusId, kat) {
  const S = new Set();
  if (!aktuelleDaten.persons[focusId]) return S;
  const add = id => { if (id) _ansTwins(id).forEach(t => S.add(t)); };
  add(focusId);
  const eltern = _ansEltern(focusId);
  // Eltern sind die Verbindungs-Wurzel für Geschwister/Cousins -> immer mitnehmen,
  // sobald eine dieser Kategorien aktiv ist.
  const brauchtEltern = kat.eltern || kat.geschwister || kat.cousins;
  if (brauchtEltern) eltern.forEach(add);
  if (kat.partner)     _ansPartner(focusId).forEach(add);
  if (kat.geschwister) _ansGeschwister(focusId).forEach(add);
  if (kat.kinder)      _ansKinder(focusId).forEach(add);
  // Familien der Geschwister: deren Ehepartner + Kinder (Neffen/Nichten).
  // (Werden als Nachkommen der Eltern-Render-Wurzel automatisch gezeichnet.)
  if (kat.geschwister_familie) {
    _ansGeschwister(focusId).forEach(g => {
      add(g);
      _ansPartner(g).forEach(add);
      _ansKinder(g).forEach(add);
    });
  }

  const grosseltern = new Set();
  eltern.forEach(p => _ansEltern(p).forEach(g => grosseltern.add(g)));
  if (kat.grosseltern || kat.urgrosseltern || kat.cousins) {
    eltern.forEach(add); grosseltern.forEach(add);
  }
  if (kat.urgrosseltern) grosseltern.forEach(g => _ansEltern(g).forEach(add));
  if (kat.cousins) {
    // "Rođaci": ALLE Seitenlinien. Die Cousins-Tiefe folgt der höchsten gewählten
    // Ahnen-Ebene: mit Urgroßeltern -> alle Nachkommen der Urgroßeltern (Cousins 2. Grades,
    // d.h. alle, die unter prababa/pradeda hängen); sonst alle Nachkommen der Großeltern
    // (Cousins 1. Grades). Eigene Geschwister/Eltern/Kinder bleiben wie gehabt enthalten.
    const urgross = new Set();
    grosseltern.forEach(g => _ansEltern(g).forEach(u => urgross.add(u)));
    const wurzeln = (kat.urgrosseltern && urgross.size) ? urgross
                  : (grosseltern.size ? grosseltern : new Set(eltern));
    wurzeln.forEach(a => { add(a); _ansAlleNachkommen(a, add); });
  }
  if (kat.nachkommen) {
    const stack = [focusId], seen = new Set();
    while (stack.length) {
      const x = stack.pop(); if (seen.has(x)) continue; seen.add(x);
      _ansKinder(x).forEach(c => { add(c); stack.push(c); });
    }
  }
  return S;
}

// Oberste im Set enthaltene Vorfahren-Karte entlang des aufsteigenden Strangs
// (bevorzugt Elternteil im aktuellen Baum) -> Wurzel für den Single-Root-Renderer.
function _renderWurzelImSet(focusId, S) {
  let cur = focusId, guard = 0;
  while (guard++ < 40) {
    const elt = [..._ansEltern(cur)].filter(e => S.has(e) && aktuelleDaten.persons[e]);
    if (!elt.length) break;
    const sameTree = elt.find(e => aktuelleDaten.persons[e]._tree === aktuellerStammbaumId);
    cur = sameTree || elt[0];
  }
  return cur;
}

// Standardansicht: eigene Person + Eltern + (Voll-/Halb-)Geschwister + Kinder + Partner.
// Rückgabe false, wenn keine eigene Karte im Baum -> Aufrufer macht Fallback.
function zeigeStandardAnsicht(behalteZoom) {
  const meId = meineKarteImBaum();
  if (!meId) return false;
  const S = verwandtschaftsSet(meId, {
    eltern: true, partner: true, geschwister: true, kinder: true,
    geschwister_familie: true   // Geschwister inkl. Ehepartner + Kinder (Neffen/Nichten)
  });
  ansichtModus = 'standard';
  ansichtFokusId = meId;
  ansichtKat = null;
  fokusPersonId = null;
  const root = _renderWurzelImSet(meId, S);
  zeichneBaum(root, 12, 0, { erlaubt: S, fokusId: meId });
  aktualisiereBaumHinweis();   // Generationen-Hinweis je nach Modus ein-/ausblenden
  return true;
}

// Erweiterte Ansicht um die eigene Person (Kategorien aus dem Overlay).
function zeigeErweitertAnsicht(kat, behalteZoom) {
  const meId = meineKarteImBaum();
  if (!meId) return false;
  // Standardumfang ist immer Basis; Overlay-Kategorien erweitern additiv.
  const voll = Object.assign({
    eltern: true, partner: true, geschwister: true, kinder: true,
    geschwister_familie: true
  }, kat || {});
  const S = verwandtschaftsSet(meId, voll);
  ansichtModus = 'erweitert';
  ansichtFokusId = meId;
  ansichtKat = kat || {};
  fokusPersonId = null;
  const root = _renderWurzelImSet(meId, S);
  // Explizite Erweiterung -> Blutlinien-Kappung AUS (sonst verschwänden aufgeklappte
  // Nachkommen/Cousins, die der Nutzer bewusst sehen will).
  zeichneBaum(root, 12, 0, { erlaubt: S, fokusId: meId, uebergangCut: false });
  aktualisiereBaumHinweis();   // Generationen-Hinweis je nach Modus ein-/ausblenden
  return true;
}

// Familienzweig ab einer beliebigen Person: N Generationen nach unten UND M nach oben
// (jeweils 0 = unbegrenzt). genAuf>0/unbegrenzt blendet die Vorfahren-Linie(n) mit ein.
function zeigeZweigAbPerson(personId, gen, genAuf, behalteZoom) {
  if (!aktuelleDaten.persons[personId]) return false;
  ansichtModus = 'zweig';
  ansichtFokusId = personId;
  ansichtGen = gen;
  ansichtGenAuf = (genAuf === undefined ? ansichtGenAuf : genAuf);
  ansichtKat = null;
  fokusPersonId = null;
  const tiefe    = (!gen || gen < 0) ? 99 : gen;
  const tiefeAuf = (!ansichtGenAuf || ansichtGenAuf < 0) ? 99 : ansichtGenAuf;
  // BAUMÜBERGREIFEND: Der klassische Single-Root-Renderer ist baum-begrenzt (sameTree) und
  // würde z. B. eine im Vidović-Baum liegende Karte ohne ihre Skulić-Eltern zeigen. Der
  // „Familienzweig ab Person" rendert daher IMMER über die fokus-zentrierte Verwandtschafts-
  // Logik (kanonisch über identitaet_id, alle Bäume) — Vorfahren naviše + Nachkommen naniže
  // + Geschwister der Person.
  zeichneGraph2(personId, tiefe, tiefeAuf, { fokusId: personId, upN: tiefeAuf, downN: tiefe });
  aktualisiereBaumHinweis();   // Generationen-Hinweis (nur Standardansicht) aus-/einblenden
  return true;
}

// Aktuelle Ansicht (Modus + Parameter) neu rendern — nach Edit/Realtime-Reload.
function rendereAktuelleAnsicht() {
  switch (ansichtModus) {
    case 'standard':  if (zeigeStandardAnsicht(true)) return; break;
    case 'erweitert': if (zeigeErweitertAnsicht(ansichtKat, true)) return; break;
    case 'zweig':
      if (ansichtFokusId && aktuelleDaten.persons[ansichtFokusId]) { zeigeZweigAbPerson(ansichtFokusId, ansichtGen, ansichtGenAuf, true); return; }
      break;
    case 'voll': zeichneBaum(aktuelleWurzel(), 12, 0); aktualisiereBaumHinweis(); return;
  }
  // Fallback: frühere Such-/Fokuslogik
  if (fokusPersonId && aktuelleDaten.persons[fokusPersonId]) zeichneBaum(fokusPersonId, 2, 2);
  else zeichneBaum(aktuelleWurzel(), 12, 0);
}

// Rücksprung aus einem Zweig: Standardansicht, sonst Vollbaum.
function zeigeStandardOderVoll() {

// Entdoppelt eine Personen-Trefferliste: Karten mit gleicher identitaet_id sind DIESELBE
// reale Person (über Bäume gespiegelt) und erscheinen nur EINMAL. Funktioniert für IN-MEMORY-
// Personen (Felder _ident/_uuid/_tree) UND für RPC-Treffer (identitaet_id/id/baum, z. B.
// personen_suche). Repräsentant = bevorzugt die Karte im aktuell geöffneten Baum (konsistentes
// Label), sonst die erste. Karten ohne identitaet_id bleiben einzeln. Reihenfolge bleibt erhalten.
function entdoppeltePersonen(liste) {
  const map = new Map();
  (liste || []).forEach(p => {
    if (!p) return;
    const ident = p._ident || p.identitaet_id || null;
    const uid   = p._uuid || p.id;
    const tree  = p._tree || p.baum || null;
    const key = ident ? ('i:' + ident) : ('u:' + uid);
    const ex = map.get(key);
    if (!ex) { map.set(key, p); return; }
    const exTree = ex._tree || ex.baum || null;
    if (exTree !== aktuellerStammbaumId && tree === aktuellerStammbaumId) map.set(key, p);
  });
  return [...map.values()];
}

function ansichtPersonLabel(p) {
  const j = (p.birth_date && /\d{4}/.test(p.birth_date)) ? ' * ' + p.birth_date.match(/\d{4}/)[0] : '';
  const baum = (p._tree && stammbaeumeListe[p._tree]) ? ' — ' + baumLabel(p._tree) : '';
  return nm(p.name || p.id) + j + baum;
}

function oeffneAnsichtModal() {

  document.getElementById('ansicht-keine-karte').style.display = hatKarte ? 'none' : '';

  let vorwahl = ['erweitert', 'zweig', 'voll'].includes(ansichtModus) ? ansichtModus

  document.getElementById('ans-kat-nachkommen').checked    = !!(ansichtKat && ansichtKat.nachkommen);
  // Generationen-Selects auf die gespeicherten Werte (Default unbegrenzt = '0')
  const genEl = document.getElementById('ansicht-gen'); if (genEl) genEl.value = String(ansichtGen || 0);
  const genAufEl = document.getElementById('ansicht-gen-auf'); if (genAufEl) genAufEl.value = String(ansichtGenAuf || 0);
  // Zuletzt gewählte Zweig-Person vorbelegen (Feld gefüllt, Trefferliste zu)
  const sf = document.getElementById('ansicht-suche');
  if (ansichtModus === 'zweig' && ansichtFokusId && aktuelleDaten.persons[ansichtFokusId]) {
    ansichtPickSel = ansichtFokusId;
    if (sf) sf.value = nm(aktuelleDaten.persons[ansichtFokusId].name || ansichtFokusId);
  } else if (sf) { sf.value = ''; }

  const m = document.getElementById('ansicht-modal');

    m._ansTip = true;
    tippAuswahl(document.getElementById('ansicht-pick-list'), '.ansicht-pick-item[data-id]',
      el => ansichtPickWaehle(el.dataset.id));
  }
  if (typeof macheAlleSelectsSuchbar === 'function') macheAlleSelectsSuchbar(m);
}

function ansichtModusWahl() {
  const val = (document.querySelector('input[name="ansicht-modus"]:checked') || {}).value;
  document.getElementById('ansicht-unter-erweitert').classList.toggle('offen', val === 'erweitert');
  document.getElementById('ansicht-unter-zweig').classList.toggle('offen', val === 'zweig');

function ansichtPickSuche() {
  // Schrift- UND diakritik-insensitiv (ssFold = Kyrillisch→Latein + ć č š ž đ → c c s z d,
  // analog zur Logik der suchbaren Dropdowns / Backend merge_norm): „Sladana" findet „Slađana".
  const q = ssFold(document.getElementById('ansicht-suche').value.trim());
  const list = document.getElementById('ansicht-pick-list');
  if (q.length < 2) { list.innerHTML = ''; return; }
  // Lokale Suche über ALLE geladenen (RLS-sichtbaren) Personen = aktueller + verknüpfte Bäume.
  const roh = Object.values(aktuelleDaten.persons).filter(p => {
    const name = ssFold(p.name || '');
    const bd   = (p.birth_date || '').toLowerCase();
    return name.includes(q) || bd.includes(q);
  });
  // Gespiegelte Karten (gleiche identitaet_id) = EINE reale Person -> nur 1x anzeigen.
  const treffer = entdoppeltePersonen(roh).slice(0, 40);
  if (!treffer.length) {
    list.innerHTML = `<div class="ansicht-pick-item" style="cursor:default;color:#8a7a5a">${t('keine_treffer')}</div>`;
    return;
  }
  list.innerHTML = treffer.map(p =>
    `<div class="ansicht-pick-item${ansichtPickSel === p.id ? ' gewaehlt' : ''}" data-id="${p.id}">${escapeHtml(ansichtPersonLabel(p))}</div>`
  ).join('');
}

function ansichtPickWaehle(id) {
  ansichtPickSel = id;
  // Gewählte Person ins Suchfeld übernehmen und die Trefferliste (Dropdown) schließen.
  const p = aktuelleDaten.persons[id];
  const sf = document.getElementById('ansicht-suche');
  if (p && sf) sf.value = nm(p.name || p.id);
  const list = document.getElementById('ansicht-pick-list');
  if (list) list.innerHTML = '';
}

function ansichtAnwenden() {
  const val = (document.querySelector('input[name="ansicht-modus"]:checked') || {}).value;
  document.getElementById('suche').value = '';

  if (val === 'voll') {
    ansichtModus = 'voll'; fokusPersonId = null; ansichtFokusId = null;
    zeichneBaum(aktuelleWurzel(), 12, 0);
    aktualisiereBaumHinweis();   // Generationen-Hinweis ausblenden (Vollansicht)
    schliesseAnsichtModal();
    return;
  }

  if (val === 'zweig') {
    if (!ansichtPickSel || !aktuelleDaten.persons[ansichtPickSel]) {
      // Keine Person gewählt -> Hinweis im Picker, Modal bleibt offen.
      document.getElementById('ansicht-pick-list').innerHTML =
        `<div class="ansicht-pick-item" style="cursor:default;color:var(--akzent)">${t('ansicht_bitte_person')}</div>`;
      document.getElementById('ansicht-suche').focus();
      return;
    }
    const gen    = parseInt(document.getElementById('ansicht-gen').value, 10);
    const genAuf = parseInt(document.getElementById('ansicht-gen-auf').value, 10);
    zeigeZweigAbPerson(ansichtPickSel, gen, genAuf);
    schliesseAnsichtModal();
    return;
  }

  // erweitert
  const kat = {
    grosseltern:   document.getElementById('ans-kat-grosseltern').checked,
    urgrosseltern: document.getElementById('ans-kat-urgrosseltern').checked,
    cousins:       document.getElementById('ans-kat-cousins').checked,
    nachkommen:    document.getElementById('ans-kat-nachkommen').checked
  };
  if (!zeigeErweitertAnsicht(kat)) {
    document.getElementById('ansicht-keine-karte').style.display = '';
    return;
  }
  schliesseAnsichtModal();
}

  const m = document.getElementById('ansicht-modal');

  if (document.getElementById('ansicht-suche').value.trim().length >= 2) ansichtPickSuche();
  if (typeof macheAlleSelectsSuchbar === 'function') macheAlleSelectsSuchbar(m);
}

// KARTEN-ANSICHT
// ============================================================
function zeigeKarten() {
  const suche = document.getElementById('suche').value.trim().toLowerCase();
  const grid = document.getElementById('personen-grid');

  // Identitäts-Zwillinge entdoppeln: dieselbe reale Person ist über mehrere Bäume
  // gespiegelt (identitaet_id) und liegt als mehrere Karten in aktuelleDaten.persons
  // (eigene externe_id je Baum). Pro Gruppe nur EINE Karte zeigen und dabei die des
  // AKTUELLEN Baums bevorzugen (analog zur sameTree-Entdopplung im Diagramm).
  const reprNachIdent = {};
  Object.values(aktuelleDaten.persons).forEach(p => {
    if (!p._ident) return;
    const bisher = reprNachIdent[p._ident];
    if (!bisher) { reprNachIdent[p._ident] = p; return; }
    // aktuelle-Baum-Karte gewinnt; sonst bleibt die zuerst gesehene
    if (aktuellerStammbaumId && p._tree === aktuellerStammbaumId && bisher._tree !== aktuellerStammbaumId) {
      reprNachIdent[p._ident] = p;
    }
  });

  const gefiltert = Object.values(aktuelleDaten.persons).filter(p => {
    // Zwilling, der NICHT der gewählte Repräsentant ist -> überspringen
    if (p._ident && reprNachIdent[p._ident] !== p) return false;
    if (!suche) return true;
    // Echtzeit-Filter: Vorname, Nachname, vollständiger Name + Geburtsname (Mädchenname)
    const heu = [p.name, p.given, p.surname, p.ehename].filter(Boolean).join(' ').toLowerCase();
    return heu.includes(suche);
  }).sort((a,b) => {
    const ja = parseInt(a.birth_date) || 9999;
    const jb = parseInt(b.birth_date) || 9999;
    if (ja !== jb) return ja - jb;
    return a.name.localeCompare(b.name);
  });
  
  if (gefiltert.length === 0) {
    grid.innerHTML = `<div class="keine-treffer">${t('keine_treffer')}</div>`;
    return;
  }
  
  grid.innerHTML = '';
  gefiltert.forEach(p => {
    const karte = document.createElement('div');
    karte.className = 'person' + (p.deceased ? ' verstorben' : '');
    karte.onclick = () => zeigeDetails(p.id);
    
    const initialen = nm(((p.given[0] || '') + (p.surname[0] || '')).toUpperCase()) || '?';
    const avatarKlasse = p.sex === 'M' ? 'male' : (p.sex === 'F' ? 'female' : 'unknown');
    // Profilbild (falls hochgeladen) über den Initialen; bei Ladefehler bleibt das Initial.
    const fotoUrl = p.foto || p.avatar || p.bild || '';
    const avatarImg = fotoUrl
      ? `<img src="${escapeHtml(fotoUrl)}" alt="" loading="lazy" onerror="this.remove()">`
      : '';

    let lebensdaten = '';
    if (p.birth_date || p.death_date) {
      lebensdaten = `* ${formatDatumLang(p.birth_date) || '?'}`;
      if (p.deceased || p.death_date) lebensdaten += ` † ${formatDatumLang(p.death_date) || '?'}`;
    }
    
    karte.innerHTML = `
      <div class="avatar ${avatarKlasse}">${initialen}${avatarImg}</div>
      <h3>${escapeHtml(nm(p.given || '?'))}</h3>
      <p class="nachname">${escapeHtml(nm(p.surname || ''))}${p.ehename ? ` <span class="maiden-name">(${escapeHtml(nm(p.ehename))})</span>` : ''}</p>
      ${lebensdaten ? `<div class="daten">${lebensdaten}</div>` : ''}
      ${p.birth_place ? `<div class="daten">📍 ${escapeHtml(uebersetzeOrt(p.birth_place))}</div>` : ''}
    `;
    grid.appendChild(karte);
  });
}
