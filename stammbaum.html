<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="app-version" content="8.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidović — Porodično stablo</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f5ede0; --bg-soft: #ede0cc; --bg-card: #fffaf0;
  --paper: #fffaf0; --paper-soft: #f0e6d3;
  --ink: #2c2418; --akzent: #722f37; --akzent-hell: #9e4050;
  --gold: #9c7c3c; --gold-hell: #b8943f;
  --linie: #c4a882; --male: #3d6080; --female: #8b3d5a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Georgia','Times New Roman',serif;
  background: var(--bg); color: var(--ink); min-height: 100vh;
  padding-top: 58px;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(114,47,55,0.07) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(156,124,60,0.06) 0%, transparent 50%);
}
header {
  text-align: center; padding: 50px 20px 30px;
  border-bottom: 1px solid var(--linie);
}
header h1 {
  font-size: clamp(36px, 6vw, 64px);
  letter-spacing: 8px; font-weight: normal;
  color: var(--akzent); margin-bottom: 10px;
}
header .untertitel { font-style: italic; opacity: 0.7; letter-spacing: 2px; }
header .stats { margin-top: 20px; font-size: 13px; opacity: 0.6; letter-spacing: 2px; }

/* Fixe Navigationsleiste oben */
.top-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: var(--bg); border-bottom: 2px solid var(--linie);
  display: flex; align-items: center; justify-content: center;
  padding: 8px 20px;
  box-shadow: 0 2px 8px rgba(44,36,24,0.08);
}
.nav-controls {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  justify-content: center;
}
/* Sprach-Dropdown mit Flaggen */
.sprach-dropdown { position: relative; }
.sprach-toggle {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-soft); color: var(--ink);
  border: 1px solid var(--linie); padding: 7px 12px; cursor: pointer;
  font-family: inherit; font-size: 12px;
  letter-spacing: 1px; text-transform: uppercase;
  transition: border-color 0.2s;
}
.sprach-toggle:hover { border-color: var(--gold); }
.sprach-toggle .pfeil { font-size: 9px; opacity: 0.6; transition: transform 0.2s; }
.sprach-dropdown.offen .sprach-toggle .pfeil { transform: rotate(180deg); }
.flagge {
  width: 22px; height: 15px; flex: 0 0 auto;
  border: 1px solid rgba(44,36,24,0.25); border-radius: 2px;
  overflow: hidden; display: inline-block; line-height: 0;
}
.flagge svg { width: 100%; height: 100%; display: block; }
.sprach-menu {
  position: absolute; top: calc(100% + 4px); right: 0; z-index: 60;
  min-width: 160px; list-style: none;
  background: var(--paper); border: 1px solid var(--linie);
  box-shadow: 0 4px 14px rgba(44,36,24,0.18);
  display: none;
}
.sprach-dropdown.offen .sprach-menu { display: block; }
.sprach-menu li {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; cursor: pointer; font-size: 13px;
  letter-spacing: 0.5px; transition: background 0.15s;
}
.sprach-menu li:hover { background: var(--paper-soft); }
.sprach-menu li.aktiv { background: var(--akzent); color: var(--paper); }
.sprach-menu li.aktiv .flagge { border-color: rgba(255,255,255,0.4); }

.tab-gruppe {
  display: flex; background: var(--bg-soft);
  padding: 4px; border: 1px solid var(--linie);
}
.tab {
  background: transparent; color: var(--ink);
  border: none; padding: 10px 20px; cursor: pointer;
  font-family: inherit; font-size: 13px;
  letter-spacing: 2px; text-transform: uppercase;
  transition: all 0.3s;
}
.tab.aktiv { background: var(--akzent); color: var(--paper); }
.tab:hover:not(.aktiv) { color: var(--akzent); }

.suche, .filter, .upload-btn {
  background: var(--paper); color: var(--ink);
  border: 1px solid var(--linie);
  padding: 10px 15px; font-family: inherit; font-size: 14px;
}
.suche { min-width: 220px; }
.suche:focus, .filter:focus { outline: none; border-color: var(--gold); }
.upload-btn { cursor: pointer; letter-spacing: 1px; }
.upload-btn:hover { background: var(--akzent); border-color: var(--akzent); color: var(--paper); }
#gedcom-input { display: none; }

/* Menü-Dropdown (bündelt Sprache, Auth, GEDCOM) – einheitliche Optik */
.nav-menu { position: relative; }
.nav-menu-toggle {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-soft); color: var(--ink);
  border: 1px solid var(--linie); padding: 10px 16px; cursor: pointer;
  font-family: inherit; font-size: 16px; line-height: 1; transition: border-color 0.2s;
}
.nav-menu-toggle:hover { border-color: var(--gold); }
.nav-menu-toggle .pfeil { font-size: 9px; opacity: 0.6; transition: transform 0.2s; }
.nav-menu.offen .nav-menu-toggle .pfeil { transform: rotate(180deg); }
.nav-menu-panel {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 60;
  min-width: 240px; background: var(--paper);
  border: 1px solid var(--linie); box-shadow: 0 8px 22px rgba(44,36,24,0.2);
  padding: 14px; display: none; flex-direction: column; gap: 12px;
}
.nav-menu.offen .nav-menu-panel { display: flex; }
.nav-menu-panel .sprach-dropdown,
.nav-menu-panel .sprach-toggle { width: 100%; }
.nav-menu-panel .sprach-toggle { justify-content: space-between; }
.nav-menu-panel .sprach-menu { left: 0; right: 0; }
.nav-menu-panel .auth-bereich { flex-direction: column; align-items: stretch; gap: 10px; }
.nav-menu-panel .anmelden-btn,
.nav-menu-panel .account-btn,
.nav-menu-panel .upload-btn { width: 100%; text-align: center; box-sizing: border-box; }
.nav-menu-panel .user-badge { flex-wrap: wrap; justify-content: center; }
.nav-menu-panel .admin-bereich { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.admin-titel {
  font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--akzent); border-top: 1px solid var(--linie);
  padding-top: 10px; margin-top: 2px; font-weight: bold;
}
.account-btn.admin-bald { opacity: 0.4; cursor: not-allowed; border-style: dashed; }
.account-btn.admin-danger { border-color: #9b2226; color: #9b2226; }
.account-btn.admin-danger:hover { background: #9b2226; color: #fff; }

#ansicht-karten { display: none; max-width: 1400px; margin: 30px auto; padding: 0 20px; }
#ansicht-shorts { display: none; max-width: 1400px; margin: 30px auto; padding: 0 20px; }
#login-hinweis { display: none; max-width: 600px; margin: 90px auto; padding: 0 20px; text-align: center; }
.login-hinweis-box h2 { font-size: 26px; color: var(--akzent); margin-bottom: 14px; letter-spacing: 1px; }
.login-hinweis-box p { color: var(--text-dim); margin-bottom: 26px; line-height: 1.6; font-size: 15px; }
.login-hinweis-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.login-hinweis-btn {
  background: var(--akzent); color: var(--paper); border: none;
  padding: 13px 34px; cursor: pointer; font-family: inherit; font-size: 14px;
  letter-spacing: 2px; text-transform: uppercase; transition: all 0.2s;
}
.login-hinweis-btn:hover { background: var(--akzent-hell); }
.login-hinweis-btn.sekundaer {
  background: transparent; color: var(--gold); border: 1px solid var(--gold);
}
.login-hinweis-btn.sekundaer:hover { background: var(--gold); color: var(--paper); }
.shorts-header { margin-bottom: 24px; }
.shorts-header h2 { font-size: clamp(28px, 4vw, 36px); color: var(--akzent); margin-bottom: 8px; }
.shorts-header p { color: #5e4b35; font-size: 14px; max-width: 760px; line-height: 1.6; }
.shorts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 24px;
}
.short-card {
  background: var(--paper); color: var(--ink);
  padding: 20px; border: 1px solid var(--linie);
  box-shadow: 0 2px 12px rgba(44,36,24,0.10);
  border-radius: 18px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
}
.short-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(44,36,24,0.16);
}
.short-card .thumb {
  background: linear-gradient(135deg, rgba(156,124,60,0.95), rgba(114,47,55,0.95));
  color: #fff; display: flex; align-items: center; justify-content: center;
  aspect-ratio: 16 / 9; border-radius: 14px; margin-bottom: 16px;
  font-size: 28px; font-weight: 700;
}
.short-card h3 { font-size: 18px; margin-bottom: 8px; }
.short-card p { font-size: 13px; line-height: 1.65; color: #5e4b35; min-height: 48px; }
.short-card .meta { margin-top: 14px; font-size: 12px; color: #7a6a50; letter-spacing: 0.6px; }
.person {
  background: var(--paper); color: var(--ink); padding: 18px;
  box-shadow: 0 2px 12px rgba(44,36,24,0.10), 0 0 0 1px rgba(156,124,60,0.3);
  transition: transform 0.25s, box-shadow 0.25s;
  cursor: pointer; position: relative;
}
.person:hover {
  transform: translateY(-4px) rotate(-0.5deg);
  box-shadow: 0 8px 24px rgba(44,36,24,0.15), 0 0 0 1px rgba(114,47,55,0.4);
}
.person.verstorben::before {
  content: '✝'; position: absolute; top: 8px; right: 12px;
  color: var(--akzent); font-size: 18px;
}
.person .avatar {
  width: 100%; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 56px; color: var(--paper);
  margin-bottom: 12px; font-family: serif; overflow: hidden;
}
.person .avatar.male { background: linear-gradient(135deg, var(--male), #2a4a65); }
.person .avatar.female { background: linear-gradient(135deg, var(--female), #6b2840); }
.person .avatar.unknown { background: linear-gradient(135deg, var(--gold), var(--akzent)); }
.person .avatar img { width: 100%; height: 100%; object-fit: cover; }
.person h3 { font-size: 17px; margin-bottom: 3px; }
.person .nachname { color: var(--akzent); font-style: italic; font-size: 13px; }
.person .nachname .maiden-name { font-size: 0.82em; opacity: 0.7; }
.person .daten {
  margin-top: 10px; font-size: 12px; color: #666;
  border-top: 1px solid #ddd; padding-top: 8px;
  font-family: 'Courier New', monospace;
}

#ansicht-baum { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
#baum-container {
  /* cover = füllt den Container vollständig; center 25% = Fokus auf die Krone */
  background: url('Hintergrundbilder/Bild4.jpg') center 25% / cover no-repeat, var(--bg-soft);
  border: 1px solid var(--linie);
  height: 90vh; min-height: 600px; overflow: hidden; position: relative;
}
/* Gradient-Overlay: Krone kaum überlagert, Stamm/Boden etwas mehr → Personen lesbar */
#baum-bg {
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(20, 15, 5, 0.08)  0%,
    rgba(20, 15, 5, 0.15) 40%,
    rgba(20, 15, 5, 0.35) 75%,
    rgba(20, 15, 5, 0.55) 100%
  );
  pointer-events: none; z-index: 0;
}
#baum-svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: default; z-index: 1; }

.baum-info {
  position: absolute; top: 15px; left: 15px;
  background: rgba(255,250,240,0.96); padding: 12px 18px;
  border: 1px solid var(--linie); font-size: 13px;
  max-width: 320px; z-index: 5;
  box-shadow: 0 2px 10px rgba(44,36,24,0.10);
}
.baum-info strong { color: var(--akzent); }
.baum-zurueck-btn {
  display: block; margin-top: 12px;
  background: none; border: 1px solid var(--akzent);
  color: var(--akzent); cursor: pointer;
  font-family: inherit; font-size: 12px;
  padding: 5px 10px; letter-spacing: 1px;
  transition: all 0.2s;
}
.baum-zurueck-btn:hover { background: var(--akzent); border-color: var(--akzent); color: var(--paper); }
.baum-hinweis { text-align: center; margin-top: 15px; font-size: 13px; opacity: 0.6; font-style: italic; }
.baum-tree-hinweis {
  max-width: 920px; margin: 12px auto 0; padding: 10px 14px 10px 18px;
  background: var(--gold-hell); border: 1px solid var(--gold); border-radius: 10px;
  color: var(--ink); font-size: 14px; line-height: 1.4;
  display: flex; align-items: center; gap: 12px; justify-content: center;
}
.baum-tree-hinweis-x {
  background: none; border: none; font-size: 20px; line-height: 1;
  cursor: pointer; color: var(--akzent); flex: 0 0 auto;
}
.baum-tree-hinweis-x:hover { color: var(--akzent-hell); }

.knoten rect { stroke-width: 1.8; cursor: pointer; transition: stroke 0.2s; }
.knoten.male rect   { fill: rgba(221,234,243,0.92); stroke: #4a7fa8; }
.knoten.female rect { fill: rgba(243,221,229,0.92); stroke: #9e4060; }
.knoten.unknown rect { fill: rgba(255,250,240,0.92); stroke: var(--gold); }
.knoten.fokus rect  { stroke: #fff; stroke-width: 3; }
.knoten:hover rect  { stroke: #fff; stroke-width: 2.5; }
.knoten.blutlinie rect { stroke: #c8a840; stroke-width: 3; }
/* Schatten damit Boxen sich vom Hintergrundbild abheben */
.knoten { filter: drop-shadow(0 2px 5px rgba(0,0,0,0.55)); }
.knoten text { font-family: 'Georgia', serif; fill: #1a1008; pointer-events: none; }
.knoten .name-text  { font-size: 13px; font-weight: bold; }
.knoten .maiden-text { font-size: 10px; font-weight: normal; font-style: italic; fill: #6a5630; }
.knoten .daten-text { font-size: 11px; fill: #3a2a10; }
/* Verbindungslinien: warm-weißes Leuchten – gut sichtbar auf Grün/Gold */
.verbindung { fill: none; stroke: rgba(255,248,220,0.88); stroke-width: 2.5; }
/* Ehelinien: Gold passend zum Sonnenuntergang im Bild */
.ehe-linie { stroke: #d4a030; stroke-width: 2.5; stroke-dasharray: 6 3; }

.modal {
  display: none; position: fixed; inset: 0;
  background: rgba(44,36,24,0.75); z-index: 100;
  justify-content: center; align-items: center; padding: 20px;
}
.modal.aktiv { display: flex; }
.modal-inhalt {
  background: var(--paper); color: var(--ink);
  max-width: 550px; width: 100%; padding: 40px;
  position: relative; max-height: 90vh; overflow-y: auto;
}
.modal-schliessen {
  position: absolute; top: 12px; right: 18px;
  background: none; border: none; font-size: 28px;
  cursor: pointer; color: var(--ink);
}
/* Podešavanje porodice (Familieneinstellungen) */
.fe-inhalt { max-width: 600px; }
.fe-readonly-hinweis {
  background: var(--gold-hell); border: 1px solid var(--gold);
  padding: 10px 12px; margin: 8px 0 4px; font-size: 13px; color: var(--ink);
}
.fe-actions { display: flex; gap: 10px; margin-top: 14px; }
.fe-actions .login-submit { flex: 1; margin-top: 0; }
.fe-abbrechen { background: var(--paper-soft); color: var(--ink); border: 1px solid var(--linie); }
.fe-wahl-liste { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.fe-wahl-liste button {
  width: 100%; text-align: left; padding: 12px 14px; font-family: inherit;
  background: var(--paper-soft); border: 1px solid var(--linie);
  cursor: pointer; font-size: 15px; color: var(--ink);
}
.fe-wahl-liste button:hover { background: var(--gold-hell); border-color: var(--gold); }
.fe-media { display: flex; flex-direction: column; gap: 6px; }
.fe-media-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fe-media-preview { width: 72px; height: 72px; object-fit: cover; border: 1px solid var(--linie); border-radius: 4px; }
.fe-media-del { background: none; border: 1px solid var(--linie); cursor: pointer; padding: 6px 10px; font-size: 13px; color: var(--ink); }
.fe-file { font-size: 13px; max-width: 100%; }
/* Familien-Owner (Super-Admin) */
.fe-owner-info { background: var(--gold-hell); border: 1px solid var(--gold); border-radius: 6px; padding: 10px 12px; margin: 4px 0 8px; }
.fe-owner-zeile { font-size: 14px; margin: 3px 0; color: var(--ink); }
.fe-owner-zeile strong { color: #555; display: inline-block; min-width: 150px; }
.fe-owner-hinweis { font-size: 13px; color: #8a7a5a; margin: 0 0 10px; line-height: 1.45; }
.fe-owner-btn { margin-top: 0; }
.ow-such-zeile { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.ow-such-zeile .email-feld { flex: 1; min-width: 180px; }
.ow-such-btn { margin-top: 0; flex-shrink: 0; white-space: nowrap; }
.ow-ergebnis { margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
.ow-treffer { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  border: 1px solid var(--linie); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
.ow-treffer .ow-treffer-tag { font-size: 12px; color: #8a7a5a; }
.ow-treffer button { background: none; border: 1px solid var(--akzent); color: var(--akzent);
  border-radius: 5px; padding: 5px 12px; cursor: pointer; font-family: inherit; font-size: 13px; }
.ow-treffer button:hover { background: var(--akzent); color: #fff; }
.ow-auswahl { background: var(--gold-hell); border: 1px solid var(--gold); border-radius: 6px;
  padding: 10px 12px; margin: 8px 0; font-size: 14px; color: var(--ink); }
.ow-auswahl strong { color: var(--akzent); }
/* Registrierung: Wahl beitreten vs. eigenen Stammbaum */
.reg-wahl { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0; }
.reg-wahl-opt { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; }
.reg-wahl-hinweis { font-size: 13px; color: var(--ink); background: var(--gold-hell);
  border: 1px solid var(--gold); padding: 9px 11px; margin: 0 0 12px; line-height: 1.45; }
/* Globale E-Mail-Validierung: Fehlerzustand */
.login-feld.input-fehler { border-color: #b33 !important; background: #fdeaea; }
.feld-fehler-text { color: #b33; font-size: 12px; margin-top: 4px; display: block; }
.modal h2 { color: var(--akzent); margin-bottom: 6px; font-size: 28px; }
.modal .sub-name { font-style: italic; color: #888; margin-bottom: 20px; }
.modal .info-zeile { margin: 8px 0; padding: 8px 0; border-bottom: 1px solid #ddd; font-size: 14px; }
.modal .info-zeile strong { display: inline-block; min-width: 130px; color: #555; }
.modal .beziehungen { margin-top: 20px; padding-top: 20px; border-top: 2px solid var(--akzent); }
.modal .beziehungen h3 { color: var(--akzent); margin-bottom: 12px; font-size: 16px; letter-spacing: 2px; }
.modal .verwandter {
  display: inline-block; padding: 6px 12px; margin: 4px 6px 4px 0;
  background: var(--paper-soft); border: 1px solid var(--linie);
  cursor: pointer; font-size: 13px; transition: background 0.2s;
}
.modal .verwandter:hover { background: var(--gold-hell); }
.modal .baum-zeigen {
  margin-top: 25px; background: var(--akzent); color: var(--paper);
  border: none; padding: 12px 24px; cursor: pointer;
  font-family: inherit; letter-spacing: 2px;
  text-transform: uppercase; font-size: 13px;
}
.modal .baum-zeigen:hover { background: var(--akzent-hell); }
.modal .baum-zeigen.button-disabled {
  background: var(--linie); color: var(--text-dim); cursor: not-allowed; opacity: 0.6;
}
.modal .baum-zeigen.button-disabled:hover { background: var(--linie); }
.media-delete-btn {
  position: absolute; top: 8px; right: 8px; background: var(--akzent);
  color: var(--paper); border: none; width: 28px; height: 28px;
  border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1;
  transition: background 0.2s; z-index: 10;
}
.media-delete-btn:hover { background: #c41e3a; }
.event-media-item {
  position: relative; display: inline-block;
}
.slideshow-nav {
  display: flex; justify-content: center; gap: 20px; align-items: center;
  margin: 20px 0; flex-wrap: wrap;
}
.slideshow-nav button {
  background: var(--akzent); color: var(--paper); border: none;
  padding: 10px 16px; cursor: pointer; font-family: inherit;
  border-radius: 4px; transition: background 0.2s;
}
.slideshow-nav button:hover:not(:disabled) { background: var(--akzent-hell); }
.slideshow-nav button:disabled {
  background: var(--linie); color: var(--text-dim); cursor: not-allowed;
  opacity: 0.6;
}
.slideshow-nav span {
  color: var(--text-dim); font-size: 14px; min-width: 80px; text-align: center;
}
.event-editor {
  display: grid; gap: 18px;
}
.event-editor input[type="text"] {
  width: 100%; padding: 16px 14px; min-height: 48px;
  border: 1px solid var(--linie); font-family: inherit; font-size: 15px;
  background: var(--paper); color: var(--ink);
}
.event-editor textarea {
  width: 100%; min-height: 140px; padding: 14px;
  border: 1px solid var(--linie); font-family: inherit;
  background: var(--paper); color: var(--ink);
  resize: vertical;
}
.event-upload-row {
  display: grid; gap: 14px;
}
.event-section {
  margin-top: 18px;
  padding: 14px 0 0 0;
  border-top: 1px solid rgba(255,255,255,0.12);
}
.event-section-line {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 12px;
}
.event-section-label {
  font-weight: 700; letter-spacing: 0.03em;
  color: #5e4b35;
}
.event-section-content {
  display: grid; gap: 10px;
}
.event-upload-row label {
  display: block; font-size: 13px; color: #5e4b35;
}
.event-upload-row input[type=file] {
  margin-top: 8px; width: 100%;
}
.event-detail-actions,
.event-editor-actions {
  display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px;
}
.event-media-folder {
  display: grid; gap: 10px; margin-top: 10px;
  padding: 12px; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
}
/* Ab mehr als 2 Dateien: Höhe begrenzen + dezenter Scrollbalken,
   damit das Overlay bei vielen Medien nicht zu groß wird. */
.event-media-folder--scroll {
  max-height: 230px; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--akzent) transparent;
}
.event-media-folder--scroll::-webkit-scrollbar { width: 8px; }
.event-media-folder--scroll::-webkit-scrollbar-thumb {
  background: var(--akzent); border-radius: 8px;
}
.event-media-folder--scroll::-webkit-scrollbar-track { background: transparent; }
/* Eigener Bestätigungs-Dialog (ersetzt das Browser-confirm) */
.confirm-overlay {
  position: fixed; inset: 0; z-index: 4000;
  display: flex; align-items: center; justify-content: center;
  background: rgba(30, 20, 12, 0.55); padding: 20px;
}
.confirm-box {
  background: var(--paper); color: var(--ink);
  border: 1px solid var(--gold-hell); border-radius: 16px;
  max-width: 380px; width: 100%; padding: 28px 26px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.35); text-align: center;
}
.confirm-text {
  font-size: 16px; line-height: 1.4; margin: 0 0 22px;
}
.confirm-actions {
  display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
}
.confirm-actions button {
  font-family: inherit; font-size: 13px; letter-spacing: 1.5px;
  text-transform: uppercase; padding: 11px 22px; border-radius: 8px;
  cursor: pointer; border: none;
}
.confirm-ja {
  background: var(--akzent); color: var(--paper);
}
.confirm-ja:hover { background: var(--akzent-hell); }
.confirm-nein {
  background: transparent; color: var(--ink); border: 1px solid var(--linie) !important;
}
.confirm-nein:hover { background: var(--gold-hell); }
.event-media-item {
  display: block; background: var(--paper-soft); border: 1px solid var(--linie);
  border-radius: 14px; overflow: hidden;
}
.event-media-item a {
  display: flex; align-items: center; gap: 14px; padding: 12px;
  color: inherit; text-decoration: none;
}
.baum-zeigen:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  background: rgba(138, 95, 49, 0.35);
}
.event-media-thumb {
  width: 72px; height: 72px; border-radius: 14px; object-fit: cover;
  flex-shrink: 0; background: rgba(0,0,0,0.12);
}
.video-thumb {
  display: grid; place-items: center; font-size: 24px;
}
.event-media-info {
  flex: 1; font-size: 13px; line-height: 1.3; color: #7a6a50;
}
.event-admin-hint {
  margin-top: 14px; font-size: 13px; color: #7a6a50; font-style: italic;
}
.event-status {
  margin-top: 10px; font-size: 13px; color: var(--akzent);
}
.event-media-empty { padding: 10px 2px; font-size: 13px; color: #8a7a5a; font-style: italic; }

/* ---- Kostenübersicht / Troškovi događaja ---- */
.kosten-section { margin-top: 18px; }
.kosten-section h3 {
  color: var(--akzent); font-size: 15px; letter-spacing: 1px; margin-bottom: 10px;
  border-bottom: 1px solid var(--linie); padding-bottom: 6px;
}
.kosten-chip {
  display: inline-flex; align-items: center; gap: 6px; background: var(--paper-soft);
  border: 1px solid var(--linie); border-radius: 20px; padding: 5px 12px; margin: 0 6px 6px 0; font-size: 13px;
}
.kosten-chip button { background: none; border: none; color: var(--akzent); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
.kosten-tabelle { width: 100%; border-collapse: collapse; font-size: 13px; }
.kosten-tabelle th, .kosten-tabelle td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--linie); vertical-align: top; }
.kosten-tabelle th { color: var(--gold); font-weight: bold; font-size: 12px; letter-spacing: .5px; }
.kosten-tabelle .num { text-align: right; white-space: nowrap; }
.kosten-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.kosten-form .voll { grid-column: 1 / -1; }
.kosten-summe-zeile { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
.kosten-summe-zeile.gross { font-size: 16px; font-weight: bold; color: var(--akzent); border-top: 1px solid var(--linie); margin-top: 6px; padding-top: 8px; }
.kosten-saldo-plus { color: #2e7d32; }
.kosten-saldo-minus { color: #9b2226; }
.kosten-ausgleich-zeile { padding: 5px 0; font-size: 13px; border-bottom: 1px dashed var(--linie); }
.kosten-waehrung-block { margin-top: 14px; }

/* ---- Obavještenja / Benachrichtigungen ---- */
.obav-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: #9b2226; color: #fff; font-size: 11px; font-weight: bold; line-height: 1;
  vertical-align: middle; margin-left: 6px;
}
.nav-menu-toggle { position: relative; }
.nav-menu-toggle .obav-badge { position: absolute; top: -5px; right: -6px; margin: 0; }
.obav-karte {
  background: var(--paper-soft); border: 1px solid var(--linie); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 12px; transition: opacity .2s;
}
.obav-karte .obav-name { color: var(--akzent); font-weight: bold; font-size: 16px; margin-bottom: 6px; }
.obav-neu-badge {
  display: inline-block; vertical-align: middle; margin-left: 8px;
  background: #2e7d32; color: #fff; font-size: 10px; font-weight: bold;
  letter-spacing: .5px; padding: 2px 7px; border-radius: 9px;
}
/* Live eingetroffene Benachrichtigung: einmaliges Hervorheben (Slide/Fade-in) */
.obav-karte.obav-neu-anim { animation: obavNeuRein .6s ease; }
@keyframes obavNeuRein {
  0%   { opacity: 0; transform: translateY(-8px); box-shadow: 0 0 0 2px var(--gold); background: var(--gold-hell); }
  60%  { box-shadow: 0 0 0 2px var(--gold); }
  100% { opacity: 1; transform: none; box-shadow: none; }
}
.obav-karte .obav-meta { font-size: 13px; color: #5e4b35; line-height: 1.7; }
.obav-karte .obav-meta strong { color: #8a7a5a; font-weight: normal; }
.obav-karte .obav-aktionen { display: flex; gap: 10px; margin-top: 12px; }

/* ---- Update-Banner (neue Version verfügbar) ---- */
#update-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9000;
  display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
  background: var(--akzent); color: var(--paper); padding: 10px 16px;
  font-size: 14px; letter-spacing: .5px; box-shadow: 0 3px 12px rgba(44,36,24,0.4);
}
#update-banner button {
  background: var(--gold-hell); color: var(--ink); border: none; border-radius: 8px;
  padding: 7px 16px; font-family: inherit; font-size: 13px; font-weight: bold;
  letter-spacing: .5px; cursor: pointer;
}
#update-banner button:hover { background: var(--paper); }

@media print {
  body * { visibility: hidden !important; }
  #kosten-modal, #kosten-modal * { visibility: visible !important; }
  #kosten-modal { position: absolute !important; inset: 0 !important; display: block !important; background: #fff !important; overflow: visible !important; padding: 0 !important; }
  #kosten-modal .modal-inhalt { box-shadow: none !important; max-width: 100% !important; max-height: none !important; overflow: visible !important; border: none !important; margin: 0 !important; }
  .kosten-print-hide, #kosten-modal .modal-schliessen { display: none !important; }
}
.modal .zurueck-btn {
  background: none; border: none; color: var(--akzent);
  cursor: pointer; font-family: inherit; font-size: 13px;
  padding: 0 0 14px 0; letter-spacing: 1px; display: block;
}
.modal .zurueck-btn:hover { color: var(--akzent-hell); }

.keine-treffer { text-align: center; padding: 60px 20px; opacity: 0.5; font-style: italic; grid-column: 1 / -1; }

footer {
  text-align: center; padding: 40px 20px;
  opacity: 0.5; font-size: 13px; font-style: italic;
  border-top: 1px solid var(--linie); margin-top: 60px;
}

@media (max-width: 600px) {
  body { padding-top: 0; }
  .top-nav { position: static; padding: 8px 12px; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .nav-controls { gap: 6px; }
  .sprach-menu { right: auto; left: 0; }
  header { padding-top: 20px; }
}

/* Auth-Bereich (Teil der Navigation) */
.auth-bereich {
  display: flex; gap: 8px; align-items: center;
}
.anmelden-btn {
  background: var(--akzent); color: var(--paper);
  border: none; padding: 8px 16px; cursor: pointer;
  font-family: inherit; font-size: 12px;
  letter-spacing: 1px; text-transform: uppercase;
  transition: background 0.2s;
}
.anmelden-btn:hover { background: var(--akzent-hell); }
.user-badge {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px;
}
.user-email { color: var(--ink); opacity: 0.8; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-rolle {
  background: var(--gold); color: var(--paper);
  padding: 3px 8px; font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase;
}
.abmelden-btn {
  background: none; border: 1px solid var(--linie);
  color: var(--ink); padding: 5px 10px; cursor: pointer;
  font-family: inherit; font-size: 11px; letter-spacing: 1px;
  transition: all 0.2s;
}
.abmelden-btn:hover { border-color: var(--akzent); color: var(--akzent); }
.account-btn {
  background: none; border: 1px solid var(--gold);
  color: var(--gold); padding: 8px 16px; cursor: pointer;
  font-family: inherit; font-size: 12px; letter-spacing: 1px;
  text-transform: uppercase; transition: all 0.2s;
}
.account-btn:hover { background: var(--gold); color: var(--paper); }

/* Registrierungs-Modal */
.reg-gruppe-titel {
  margin: 22px 0 4px; font-size: 13px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--akzent); font-weight: bold;
  border-bottom: 1px solid var(--linie); padding-bottom: 6px;
}
.reg-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px;
}
.reg-grid .login-label { margin-top: 8px; }
.reg-feld-voll { grid-column: 1 / -1; }
.reg-erfolg {
  color: #2e7d32; font-size: 14px; margin-top: 12px; line-height: 1.4;
}
.reg-match-info {
  font-size: 14px; line-height: 1.45; color: var(--ink);
  background: var(--paper-soft); border: 1px solid var(--gold);
  border-radius: 8px; padding: 10px 12px; margin: 6px 0 2px;
}
.login-feld:disabled { background: #efe9dc; color: #9a8d72; cursor: not-allowed; }
.reg-autocomplete {
  position: absolute; left: 0; right: 0; top: 100%; z-index: 50;
  background: var(--paper); border: 1px solid var(--linie); border-top: none;
  max-height: 200px; overflow-y: auto; display: none;
  box-shadow: 0 8px 20px rgba(0,0,0,0.18);
}
.reg-autocomplete.aktiv { display: block; }
.reg-autocomplete-item {
  padding: 10px 12px; cursor: pointer; font-size: 14px;
  border-bottom: 1px solid var(--linie); color: var(--ink);
}
.reg-autocomplete-item:hover { background: var(--gold-hell); }
.reg-autocomplete-item .meta { font-size: 12px; color: #8a7a5a; display: block; }
.reg-autocomplete-leer { padding: 10px 12px; font-size: 13px; color: #8a7a5a; }
.reg-toggle { display: flex; gap: 26px; margin-bottom: 10px; }
.reg-toggle label { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 14px; color: var(--ink); }
@media (max-width: 480px) {
  .reg-grid { grid-template-columns: 1fr; }
}

/* Suchbare Dropdowns (ersetzen native <select>) */
.ss-native { display: none !important; }
/* Doppelte Klasse = höhere Spezifität als .login-feld/.filter (gewinnt für display),
   aber inline style.display='none' kann das Steuerelement weiterhin ausblenden. */
.ss-control.ss-control {
  display: inline-flex; align-items: center; justify-content: space-between;
  gap: 8px; cursor: pointer; box-sizing: border-box;
}
.ss-control.ss-disabled { opacity: 0.5; cursor: not-allowed; }
.ss-control .ss-control-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ss-control .ss-caret { flex: 0 0 auto; font-size: 11px; color: var(--gold); }
.ss-control.ss-open { outline: none; border-color: var(--gold); }
.ss-panel {
  position: fixed; z-index: 5000; background: var(--paper);
  border: 1px solid var(--gold); box-shadow: 0 10px 26px rgba(44,36,24,0.28);
  max-height: 280px; display: flex; flex-direction: column; overflow: hidden;
}
.ss-panel .ss-search {
  border: none; border-bottom: 1px solid var(--linie); padding: 10px 12px;
  font-family: inherit; font-size: 14px; background: var(--paper); color: var(--ink); outline: none;
}
.ss-list {
  list-style: none; margin: 0; padding: 4px 0; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--gold) transparent;
}
.ss-list::-webkit-scrollbar { width: 8px; }
.ss-list::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 8px; }
.ss-opt { padding: 9px 12px; cursor: pointer; font-size: 14px; color: var(--ink); }
.ss-opt:hover { background: var(--gold-hell); }
.ss-opt.ss-selected { font-weight: bold; color: var(--akzent); }
.ss-empty { padding: 12px; color: #8a7a5a; font-size: 13px; text-align: center; }

/* ---- Datumsfelder mit Vanilla-Kalender (Date Picker) ---- */
.dp-wrap { position: relative; display: block; }
.dp-wrap > input.dp-input { width: 100%; box-sizing: border-box; padding-right: 38px; }
.dp-btn {
  position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; font-size: 16px; line-height: 1;
  padding: 4px; color: var(--gold); opacity: .85;
}
.dp-btn:hover { opacity: 1; }
.dp-panel {
  position: fixed; z-index: 5100; width: 280px; max-width: calc(100vw - 16px);
  background: var(--paper); border: 1px solid var(--gold);
  box-shadow: 0 10px 26px rgba(44,36,24,0.28); padding: 10px; box-sizing: border-box;
}
.dp-head { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.dp-title { flex: 1; text-align: center; font-weight: bold; color: var(--akzent); font-size: 15px; letter-spacing: .5px; }
.dp-nav {
  background: none; border: 1px solid var(--linie); color: var(--akzent);
  width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 14px;
  line-height: 1; flex: 0 0 auto; font-family: inherit;
}
.dp-nav:hover { background: var(--gold-hell); border-color: var(--gold); }
.dp-weekdays, .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.dp-weekdays span { text-align: center; font-size: 11px; color: var(--gold); padding: 4px 0; font-weight: bold; }
.dp-day {
  aspect-ratio: 1 / 1; border: none; background: none; cursor: pointer; border-radius: 6px;
  font-size: 13px; color: var(--ink); font-family: inherit;
  display: flex; align-items: center; justify-content: center;
}
.dp-day:hover:not(:disabled) { background: var(--gold-hell); }
.dp-day.dp-leer { visibility: hidden; cursor: default; }
.dp-day.dp-heute { border: 1px solid var(--gold); }
.dp-day.dp-sel { background: var(--akzent); color: var(--paper); font-weight: bold; }
.dp-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
.dp-foot button {
  flex: 1; background: none; border: 1px solid var(--akzent); color: var(--akzent);
  padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; letter-spacing: .5px;
}
.dp-foot button:hover { background: var(--akzent); color: var(--paper); }

/* Login-Modal eigene Stile */
.login-feld {
  display: block; width: 100%; padding: 10px;
  border: 1px solid var(--linie); font-family: inherit;
  font-size: 14px; background: var(--paper); color: var(--ink);
  margin-top: 4px;
}
.login-feld:focus { outline: none; border-color: var(--gold); }
.login-label { font-size: 13px; color: #555; display: block; margin-top: 14px; }
.login-submit {
  margin-top: 20px; width: 100%; padding: 13px;
  background: var(--akzent); color: var(--paper);
  border: none; font-family: inherit; font-size: 14px;
  letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  transition: background 0.2s;
}
.login-submit:hover { background: var(--akzent-hell); }
.login-link-btn {
  display: block; margin: 12px auto 0; background: none; border: none;
  color: var(--akzent); font-family: inherit; font-size: 13px;
  text-decoration: underline; cursor: pointer;
}
.login-link-btn:hover { color: var(--akzent-hell); }
/* Mitglieder-Verwaltung */
.mv-familie-gruppe h3 {
  font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--akzent); border-bottom: 1px solid var(--linie);
  padding-bottom: 5px; margin: 14px 0 8px;
}
/* Ab >5 Mitgliedern: fester Bereich mit eigenem Scrollbalken (nur Liste scrollt) */
#mv-liste {
  max-height: 320px; overflow-y: auto; margin-bottom: 6px;
  scrollbar-width: thin; scrollbar-color: var(--akzent) transparent;
}
#mv-liste::-webkit-scrollbar { width: 8px; }
#mv-liste::-webkit-scrollbar-thumb { background: var(--akzent); border-radius: 8px; }
.mv-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 0; border-bottom: 1px solid var(--linie);
}
.mv-row .mv-email { flex: 1; min-width: 150px; font-size: 14px; color: var(--ink); word-break: break-all; }
.mv-row .mv-rolle-text { font-size: 13px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
.mv-row select { padding: 6px 8px; border: 1px solid var(--linie); font-family: inherit; font-size: 13px; background: var(--paper); color: var(--ink); }
.mv-del { background: none; border: 1px solid var(--linie); color: #9b2226; padding: 6px 10px; cursor: pointer; font-size: 12px; }
.mv-del:hover { background: #9b2226; color: #fff; }
.mv-legende { font-size: 12px; color: #8a7a5a; margin: -4px 0 12px; line-height: 1.4; }
/* Bäume verbinden / Dubletten-Merge */
.merge-btn-zeile { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.merge-btn-zeile .login-submit { margin-top: 0; }
.merge-btn-inline { flex: 1 1 auto; }
.mg-kandidat { border: 1px solid var(--linie); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.mg-kandidat.fix { border-color: var(--akzent); background: rgba(176,141,87,0.08); }
.mg-kandidat label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.mg-kandidat-body { display: block; }
.mg-kandidat .mg-grund { display: block; font-size: 12px; color: var(--akzent); font-weight: bold; margin-bottom: 5px; }
.mg-person { padding: 2px 0; }
.mg-person .mg-namen { font-weight: bold; }
.mg-person .mg-meta { display: block; font-size: 12px; color: #8a7a5a; margin-top: 1px; line-height: 1.4; }
.mg-vs { display: block; text-align: center; color: var(--akzent); font-weight: bold; margin: 2px 0; }
.mg-kandidat .mg-meta { font-size: 12px; color: #8a7a5a; margin-top: 3px; line-height: 1.4; }
.mg-konflikt { border: 1px solid var(--linie); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.mg-konflikt .mg-feld { font-weight: bold; color: var(--akzent); margin-bottom: 6px; }
.mg-konflikt .mg-opt { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; flex-wrap: wrap; }
.mg-konflikt .mg-opt input[type="text"] { flex: 1 1 140px; }
.mg-auto-row { font-size: 13px; color: #6a7a55; padding: 3px 0; }
.mg-auto-row b { color: var(--akzent); }
.mg-survivor-opt { display: inline-flex; gap: 6px; align-items: center; margin-right: 16px; cursor: pointer; }
/* Gleiche Person über Bäume */
.gp-zwilling { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.gp-loesen { background: none; border: 1px solid #9b2226; color: #9b2226; border-radius: 6px; cursor: pointer; font-size: 12px; line-height: 1; padding: 2px 6px; }
.gp-loesen:hover { background: #9b2226; color: #fff; }
.gp-kand { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
.sec-add-btn { background: none; border: 1px solid var(--akzent); color: var(--akzent); border-radius: 50%; width: 22px; height: 22px; line-height: 1; cursor: pointer; font-size: 14px; padding: 0; vertical-align: middle; margin-left: 6px; }
.sec-add-btn:hover { background: var(--akzent); color: #fff; }
/* Willkommen-Sprachauswahl */
.willkommen-sprachen { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.willkommen-btn { display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-family: inherit; font-size: 15px; cursor: pointer; background: rgba(176,141,87,0.08); border: 1px solid var(--linie); border-radius: 8px; color: inherit; text-align: left; }
.willkommen-btn:hover { background: var(--akzent); color: #fff; }
.willkommen-btn .flagge { width: 28px; height: 18px; display: inline-flex; border-radius: 2px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.15); }
.willkommen-btn .flagge svg { width: 100%; height: 100%; display: block; }
.mv-familie-aktiv {

.pa-add-btn, .pa-del-btn {

.pa-del-btn { border: 1px solid #9b2226; color: #9b2226; }

.pa-kontext { font-size: 13px; color: var(--gold); margin: -6px 0 10px; }

<script>
// ============================================================
// SUPABASE AUTH
// ============================================================
const SUPABASE_URL  = 'https://tybvzhifvufgvlgjpmyl.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5YnZ6aGlmdnVmZ3ZsZ2pwbXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDIyMDQsImV4cCI6MjA5NTgxODIwNH0.VL1Z5bZN4t73ArS-uKLC1tAkt1yhQqflKJZ7XU5vA5Y';
const sbClient      = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let aktuellerUser  = null;
let aktuelleRolle  = null;

async function ladeAuth() {
  const { data: { session } } = await sbClient.auth.getSession();
  if (session) await setzeUser(session.user);

  // WICHTIG: Im onAuthStateChange-Callback KEINE weiteren Supabase-Aufrufe
  // synchron/await ausführen — der Callback hält die interne Auth-Sperre.
  // setzeUser()/ladeBaumDaten() rufen sbClient.from(...) auf und würden auf
  // denselben Lock warten -> Deadlock (jeder weitere Request hängt bis F5).
  // Daher: Arbeit per setTimeout aus dem Callback herauslösen (Lock ist dann frei),
  // und nur reagieren, wenn sich der User tatsächlich ändert (nicht bei jedem
  // TOKEN_REFRESHED, das sonst Baum/Overlay mitten in einer Aktion neu lädt).
  sbClient.auth.onAuthStateChange((_event, session) => {
    const neueUserId = session?.user?.id || null;
    setTimeout(() => {
      if (neueUserId) {
        if (!aktuellerUser || aktuellerUser.id !== neueUserId) setzeUser(session.user);
      } else if (aktuellerUser) {
        loescheUser();
      }
    }, 0);
  });
}

// Rang einer Rolle: je höher, desto mehr Rechte. Wird genutzt, um bei
// mehreren Mitgliedschaften (verschiedene Familien) die höchste zu wählen.
const ROLLEN_RANG = {
  super_admin: 4,
  familien_owner: 3,
  familien_admin: 2,
  familien_mitglied: 1
};

async function setzeUser(user) {
  // Login nach Auto-Logout (Inaktivität) -> harter Reload, damit die neueste
  // App-Version geladen wird (kein veralteter Cache). Flag wird einmalig verbraucht.
  if (sessionStorage.getItem('reloadNachLogin')) {
    sessionStorage.removeItem('reloadNachLogin');
    hardReload();
    return;
  }
  aktuellerUser = user;

  // Alle Mitgliedschaften des Users laden (User kann in mehreren Familien sein).
  // KEIN .limit(1) — sonst würde bei mehreren Familien evtl. die falsche
  // (niedrigere) Rolle gewählt. Wir suchen explizit die höchste Rolle.
  const { data, error } = await sbClient
    .from('mitgliedschaften')
    .select('familie_id, rolle')
    .eq('user_id', user.id);

  if (error) {
    console.warn('Fehler beim Laden der Rolle:', error);
  }

  // Aus allen geladenen Zeilen die Rolle mit dem höchsten Rang bestimmen
  // + Rolle je Familie merken (für Standard-Stammbaum-Priorität Owner>Admin).
  let rawRolle = null;
  let besterRang = 0;
  meineRollenProFamilie = {};
  (data || []).forEach(row => {
    if (!row.rolle) return;
    const norm = normalizeRolle(row.rolle);
    const rang = ROLLEN_RANG[norm] || 0;
    if (rang >= besterRang) {
      besterRang = rang;
      rawRolle   = row.rolle;
    }
    if (row.familie_id) {
      const vorhanden = meineRollenProFamilie[row.familie_id];
      if (!vorhanden || (ROLLEN_RANG[norm] || 0) > (ROLLEN_RANG[vorhanden] || 0)) {
        meineRollenProFamilie[row.familie_id] = norm;
      }
    }
  });

  // Fallback NUR für lokale Entwicklung (localhost/127.0.0.1/file://).
  // In Produktion (GitHub Pages) darf der localStorage-Wert NIEMALS die echte
  // DB-Rolle überschreiben — sonst würde jeder User mit leerer DB-Antwort
  // fälschlicherweise als 'super_admin' (o.ä.) angezeigt werden.
  const istLokal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
  if (!rawRolle && istLokal) {
    const debugRolle = localStorage.getItem('debug_rolle');
    if (debugRolle) {
      console.log('Debug-Modus (lokal): Nutze localStorage rolle:', debugRolle);
      rawRolle = debugRolle;
    }
  }

  // In Produktion: Wenn die DB 0 Zeilen lieferte, ist das ein echtes Problem
  // (meist RLS blockiert das Lesen der eigenen Mitgliedschaft) — sichtbar machen.
  if (!rawRolle && !istLokal && (data || []).length === 0) {
    console.warn('Keine Mitgliedschaft für eingeloggten User gelesen — ' +
      'vermutlich RLS-Policy "mitgliedschaften_select". User bleibt ohne Rolle (nur Lesezugriff).');
  }

  aktuelleRolle = rawRolle ? normalizeRolle(rawRolle) : null;
  console.log('aktuelleRolle gesetzt zu:', aktuelleRolle,
    '(raw:', rawRolle, ', Mitgliedschaften:', (data || []).length, ')');

  aktualisiereAuthUI();
  sessLetzteAktivitaet = Date.now();   // Startzeitpunkt für die Inaktivitäts-Messung
  resetInaktivTimer();                 // Inaktivitäts-Überwachung für den eingeloggten Nutzer starten

  // Phase A2: Sobald Session + Rolle stehen, Baum aus Supabase laden (Fallback bleibt FAMILY_DATA)
  // awaiten, damit Aufrufer (z.B. erstelleStammbaum) danach mit aktueller Baumliste arbeiten können.
  await ladeBaumDaten();
}

function normalizeRolle(rolle) {
  return rolle.toString().trim().toLowerCase().replace(/[\s-]+/g, '_');
}

// Zentrale Admin-Prüfung: nur super_admin und familien_admin dürfen bearbeiten/hochladen
function istAdmin() {
  return ['super_admin', 'familien_owner', 'familien_admin'].includes(normalizeRolle(aktuelleRolle || ''));
}
// Nur der Super-Admin (Betrieb/Wartung) — für GUI-Funktionen, die normalen Nutzern verborgen bleiben.
function istSuperAdmin() {
  return normalizeRolle(aktuelleRolle || '') === 'super_admin';
}

// DEBUG: Hilfsfunction zum Setzen der Debug-Rolle (nur für lokales Testen)
function setDebugRolle(rolle) {
  if (rolle) {
    localStorage.setItem('debug_rolle', rolle);
    console.log('Debug-Rolle gesetzt auf:', rolle, '- Seite neu laden zum Aktivieren');
  } else {
    localStorage.removeItem('debug_rolle');
    console.log('Debug-Rolle gelöscht');
  }
}

function getDebugRolle() {
  return localStorage.getItem('debug_rolle') || 'keine';
}

function loescheUser() {
  aktuellerUser = null;
  aktuelleRolle = null;
  meineRollenProFamilie = {};
  startBaumGewaehlt = false;   // nächster Login bestimmt den Start-Stammbaum neu
  stopObavPolling();     // Live-Updates beenden (ausgeloggt)
  aktualisiereAuthUI();
  resetInaktivTimer();   // Inaktivitäts-Timer + Warnung stoppen (ausgeloggt)
}

function aktualisiereAuthUI() {
  const anmeldenBtn = document.getElementById('anmelden-btn');
  const badge       = document.getElementById('user-badge');
  const emailEl     = document.getElementById('user-email');
  const rolleEl     = document.getElementById('user-rolle');
  const uploadLabel = document.querySelector('label[for="gedcom-input"]');
  const shortsTab   = document.getElementById('tab-shorts');   // Events-Tab
  const accountBtn  = document.getElementById('account-btn');   // "Account anlegen" in der Leiste
  const adminBereich = document.getElementById('admin-bereich'); // "Admin-Einstellungen"
  const navMenu      = document.getElementById('nav-menu');       // ⚙ Einstellungs-Dropdown (nur Admins)

  if (aktuellerUser) {
    anmeldenBtn.style.display = 'none';
    badge.style.display       = 'flex';
    emailEl.textContent       = aktuellerUser.email;
    rolleEl.textContent       = aktuelleRolle ? t('rolle_' + aktuelleRolle) : '';
    // Upload nur für Admins sichtbar
    if (uploadLabel) uploadLabel.style.display = istAdmin() ? '' : 'none';
    if (shortsTab)   shortsTab.style.display = '';   // Events nur eingeloggt sichtbar
    if (accountBtn)  accountBtn.style.display = 'none';   // eingeloggt: kein "Account anlegen"
    const rolleNorm = normalizeRolle(aktuelleRolle || '');
    const istAdm = istAdmin();
    const istOwnerOderSuper = ['familien_owner','super_admin'].includes(rolleNorm);
    // tree-los = eingeloggt, aber (noch) keine Rolle/Familie -> darf einen Baum anlegen
    const treeLos = !!aktuellerUser && rolleNorm === '';
    // Panel für Admins ODER tree-lose User (zum Neu-Anlegen) zeigen
    if (adminBereich) adminBereich.style.display = (istAdm || treeLos) ? '' : 'none';
    const mvBtn  = document.getElementById('menu-mv-btn');
    const addBtn = document.getElementById('menu-add-btn');
    const baumDelBtn = document.getElementById('baum-loeschen-btn');
    const baumNeuBtn = document.getElementById('baum-anlegen-btn');
    if (mvBtn)  mvBtn.style.display  = istAdm ? '' : 'none';   // Verwalten: nur Admins
    if (addBtn) addBtn.style.display = istAdm ? '' : 'none';   // Hinzufügen: nur Admins
    if (baumDelBtn) baumDelBtn.style.display = istOwnerOderSuper ? '' : 'none';        // Löschen: Owner/Super
    if (baumNeuBtn) baumNeuBtn.style.display = (istOwnerOderSuper || treeLos) ? '' : 'none'; // Anlegen: Owner/Super/tree-los
    // Podešavanje porodice: sichtbar für Owner/Admin/Super (bearbeiten) UND Mitglieder (nur lesen),
    // nicht für tree-lose Nutzer (haben keine Familie). Server entscheidet über Bearbeitbarkeit.
    const istMitglied = rolleNorm === 'familien_mitglied';
    const porodicaBereich = document.getElementById('porodica-bereich');
    if (porodicaBereich) porodicaBereich.style.display = (istAdm || istMitglied) ? '' : 'none';
    // Das ⚙-Dropdown: Admins, tree-lose Owner (Neu-Anlegen) ODER Mitglieder (Podešavanje porodice lesen)
    const zeigeMenu = istAdm || treeLos || istMitglied;
    if (navMenu) { navMenu.style.display = zeigeMenu ? '' : 'none'; if (!zeigeMenu) navMenu.classList.remove('offen'); }
    // Obavještenja: nur Admins -> Button zeigen + offene Anfragen (Badge) laden
    const obavBtn = document.getElementById('menu-obav-btn');
    if (obavBtn) obavBtn.style.display = istAdm ? '' : 'none';
    // Bäume verbinden / Dubletten-Merge: ausschließlich Super-Admin (für normale Nutzer unsichtbar)
    const mergeBtn = document.getElementById('menu-merge-btn');
    if (mergeBtn) mergeBtn.style.display = istSuperAdmin() ? '' : 'none';
    const gpBtn = document.getElementById('menu-gp-btn');
    if (gpBtn) gpBtn.style.display = istSuperAdmin() ? '' : 'none';
    const berBtn = document.getElementById('menu-bereinigung-btn');
    if (berBtn) berBtn.style.display = istSuperAdmin() ? '' : 'none';
    if (istAdm) {
      // Deep-Link aus der Benachrichtigungs-Mail (?obav=1): nach dem Laden der
      // offenen Anfragen die Obavještenja-Liste automatisch öffnen (einmalig).
      ladeOffeneAnfragen().then(() => {
        if (deepLinkObav) { deepLinkObav = false; zeigeObavModal(); }
      });
      startObavPolling();   // Live-Updates ohne Reload
    } else { offeneAnfragenCache = []; renderObavBadges(); stopObavPolling(); }
  } else {
    anmeldenBtn.style.display = '';
    badge.style.display       = 'none';
    if (uploadLabel) uploadLabel.style.display = 'none';
    if (shortsTab)   shortsTab.style.display = 'none';
    if (accountBtn)  accountBtn.style.display = '';   // ausgeloggt: "Account anlegen" sichtbar
    if (adminBereich) adminBereich.style.display = 'none';
    if (navMenu) { navMenu.style.display = 'none'; navMenu.classList.remove('offen'); }
    offeneAnfragenCache = []; renderObavBadges();   // Badges leeren (ausgeloggt)
    // Falls der ausgeloggte User gerade auf der Events-Ansicht war -> zurück auf Baum
    if (typeof aktuelleAnsicht !== 'undefined' && aktuelleAnsicht === 'shorts') aktuelleAnsicht = 'baum';
  }
  aktualisiereInhaltSichtbarkeit();
}

// Stammbaum/Daten sind privat: ohne Login nur ein Anmelde-Hinweis, sonst die Ansichten.
function aktualisiereInhaltSichtbarkeit() {
  const eingeloggt = !!aktuellerUser;
  aktualisiereKopf();   // Titel/Zahlen passend zum Login-Status
  const hinweis    = document.getElementById('login-hinweis');
  const tabGruppe  = document.querySelector('.tab-gruppe');
  const suche      = document.getElementById('suche');
  const filter     = document.getElementById('filter-nachname');
  const treeSel    = document.getElementById('tree-select');

  if (eingeloggt) {
    if (hinweis)   hinweis.style.display   = 'none';
    if (tabGruppe) tabGruppe.style.display = '';
    if (suche)     suche.style.display     = '';
    if (filter)    filter.style.display    = '';
    if (treeSel)   treeSel.style.display   = treeSel.options.length ? '' : 'none';
    wechselAnsicht(aktuelleAnsicht || 'baum');   // aktuelle Ansicht wieder einblenden
  } else {
    ['ansicht-karten','ansicht-shorts','ansicht-baum'].forEach(id => {
      const el = document.getElementById(id); if (el) el.style.display = 'none';
    });
    if (tabGruppe) tabGruppe.style.display = 'none';
    if (suche)     suche.style.display     = 'none';
    if (filter)    filter.style.display    = 'none';
    if (treeSel)   treeSel.style.display   = 'none';
    if (hinweis)   hinweis.style.display   = 'block';
  }
}

// MITGLIEDER-VERWALTUNG (Admins)
// ============================================================
let mvFamilien = {};
let mvAlle = [];
let mvNameZuId = {};
// Familienauswahl im Verwaltungs-Overlay (getrennt von der Add-Modal-Auswahl)
let mvVerwaltFamilien = {};   // familie_id -> name
let mvVerwaltNameZuId = {};   // name(lower) -> familie_id
let mvVerwaltFamilie = null;  // aktuell gewählte Familie
function zeigeMvFehler(msg) {
  document.getElementById('mv-info').style.display = 'none';
  const el = document.getElementById('mv-fehler');
  el.textContent = msg; el.style.display = 'block';
}
async function zeigeMitglieder() {
  if (!istAdmin()) return;
  const menu = document.getElementById('nav-menu'); if (menu) menu.classList.remove('offen');
  document.getElementById('mv-fehler').style.display = 'none';
  document.getElementById('mv-info').style.display = 'none';
  document.getElementById('mv-suche').value = '';
  mvVerwaltFamilie = null;   // bei jedem Öffnen Auswahl zurücksetzen
  document.getElementById('mitglieder-modal').classList.add('aktiv');
  await ladeMitglieder();
}
function schliesseMitglieder() {
  document.getElementById('mitglieder-modal').classList.remove('aktiv');
}
async function ladeMitglieder() {
  const liste = document.getElementById('mv-liste');
  liste.innerHTML = '…';
  // Familienliste UND Mitglieder parallel laden. Die Familienliste kommt aus der
  // berechtigungsbasierten RPC verwaltbare_familien (super_admin = ALLE Familien;
  // owner/admin = eigene) — NICHT mehr aus den Mitglieder-Zeilen abgeleitet, damit
  // auch Familien OHNE (sichtbare) Mitglieder im Dropdown erscheinen.
  const [rFam, rMit] = await Promise.all([
    sbClient.rpc('verwaltbare_familien'),
    sbClient.rpc('mitglieder_verwaltbar')
  ]);
  if (rMit.error) { liste.innerHTML = `<p class="login-fehler" style="display:block">${escapeHtml(rMit.error.message)}</p>`; mvAlle = []; return; }
  mvAlle = rMit.data || [];

  mvVerwaltFamilien = {};
  if (!rFam.error && rFam.data) {
    rFam.data.forEach(f => { if (f.familie_id) mvVerwaltFamilien[f.familie_id] = f.familie_name; });
  } else {
    // Fallback (RPC noch nicht eingespielt): wie früher aus den Mitgliedern ableiten.
    if (rFam.error) console.warn('verwaltbare_familien:', rFam.error.message);
    mvAlle.forEach(m => { if (m.familie_id) mvVerwaltFamilien[m.familie_id] = m.familie_name; });
  }
  mvVerwaltNameZuId = {};
  const eintraege = Object.entries(mvVerwaltFamilien)
    .sort((a, b) => nm(a[1] || '').localeCompare(nm(b[1] || '')));
  // <select>-Optionen (value = familie_id) -> bekommt automatisch dieselbe
  // suchbare Dropdown-Funktion wie alle anderen Selects der App.
  const mvSel = document.getElementById('mv-familie-filter');
  mvSel.innerHTML = eintraege.map(([fid, name]) =>
    `<option value="${escapeHtml(fid)}">${escapeHtml(nm(name))}</option>`).join('');

  // Auswahl bestimmen: bestehende behalten -> sonst bei genau 1 Familie automatisch
  if (mvVerwaltFamilie && !mvVerwaltFamilien[mvVerwaltFamilie]) mvVerwaltFamilie = null;
  if (!mvVerwaltFamilie && eintraege.length === 1) mvVerwaltFamilie = eintraege[0][0];

  // Dropdown nur zeigen, wenn es etwas zu wählen gibt (>1 Familie)
  document.getElementById('mv-familie-wrap').style.display = (eintraege.length > 1) ? '' : 'none';
  mvSel.value = mvVerwaltFamilie || '';
  macheAlleSelectsSuchbar(document.getElementById('mitglieder-modal'));

  renderMitglieder();
}

// Familie im Such-Dropdown wählen -> Liste neu filtern (value = familie_id)
function mvWaehleFamilie() {
  mvVerwaltFamilie = document.getElementById('mv-familie-filter').value || null;
  renderMitglieder();
}

// Mitgliederliste rendern — ausschließlich die gewählte Familie, ohne super_admin.
function renderMitglieder() {
  const liste   = document.getElementById('mv-liste');
  const aktivEl = document.getElementById('mv-familie-aktiv');
  const filter  = (document.getElementById('mv-suche').value || '').toLowerCase();

  // Keine Familie gewählt -> Hinweis (bei mehreren Familien)
  if (!mvVerwaltFamilie) {
    aktivEl.textContent = '';
    liste.innerHTML = `<p style="color:#8a7a5a">${t('mv_familie_waehlen')}</p>`;
    return;
  }

  aktivEl.textContent = t('mv_familie_aktiv', { name: nm(mvVerwaltFamilien[mvVerwaltFamilie] || '') });

  // Nur Mitglieder DIESER Familie, Super-Admin ausgeblendet
  const inFam = mvAlle.filter(m => m.familie_id === mvVerwaltFamilie && m.rolle !== 'super_admin');
  const gefiltert = inFam.filter(m =>
    !filter
    || (m.email || '').toLowerCase().includes(filter)
    || (m.name  || '').toLowerCase().includes(filter)
    || t('rolle_' + m.rolle).toLowerCase().includes(filter)
  );
  if (gefiltert.length === 0) {
    liste.innerHTML = `<p style="color:#8a7a5a">${t('mv_keine_in_familie')}</p>`;
    return;
  }
  liste.innerHTML = gefiltert.map(m => {
    // Owner ist geschützt: keine Rollenänderung/Deaktivierung/Entfernung über die GUI.
    const istOwner = m.rolle === 'familien_owner';
    return `
    <div class="mv-row${m.aktiv ? '' : ' inaktiv'}" id="mv-row-${m.user_id}">
      <span class="mv-email">${m.name ? `<strong>${escapeHtml(m.name)}</strong> · ` : ''}${escapeHtml(m.email)}${m.aktiv ? '' : ` <span class="mv-status">${escapeHtml(t('mv_inaktiv'))}</span>`}</span>
      ${istOwner ? `<span class="mv-rolle-text">${escapeHtml(t('rolle_familien_owner'))}</span>` : `
      <select onchange="aendereRolle('${m.mitgliedschaft_id}', this.value)">
        <option value="familien_mitglied" ${m.rolle === 'familien_mitglied' ? 'selected' : ''}>${escapeHtml(t('rolle_familien_mitglied'))}</option>
        <option value="familien_admin" ${m.rolle === 'familien_admin' ? 'selected' : ''}>${escapeHtml(t('rolle_familien_admin'))}</option>
      </select>
      <button class="mv-toggle" type="button" title="${escapeHtml(t('mv_verknuepfung'))}" onclick="mvVerknuepfungStart('${m.user_id}','${m.familie_id}')">🔗</button>
      <button class="mv-toggle" onclick="toggleAktiv('${m.mitgliedschaft_id}', ${m.aktiv ? 'false' : 'true'})">${escapeHtml(m.aktiv ? t('mv_deaktivieren') : t('mv_aktivieren'))}</button>
      <button class="mv-del" onclick="entferneMitglied('${m.mitgliedschaft_id}','${escapeHtml(m.email)}')">${escapeHtml(t('mv_entfernen'))}</button>`}
    </div>`;
  }).join('');
  macheAlleSelectsSuchbar(liste);   // neu erzeugte Rollen-Selects suchbar machen
}

// Verknüpfung Konto <-> Namenskarte ändern/entfernen (Inline-Editor in der Zeile)
async function mvVerknuepfungStart(userId, familieId) {
  const row = document.getElementById('mv-row-' + userId); if (!row) return;
  row.innerHTML = `<span class="mv-email">…</span>`;
  const [pRes, vRes] = await Promise.all([
    sbClient.rpc('personen_fuer_verknuepfung', { p_familie: familieId }),
    sbClient.rpc('verknuepfte_person', { p_user: userId })
  ]);
  const personen = pRes.error ? [] : (pRes.data || []);
  const aktuell  = vRes.error ? null : vRes.data;
  const opts = personen.map(p =>
    `<option value="${escapeHtml(p.id)}" ${p.id === aktuell ? 'selected' : ''}>${escapeHtml(nm(p.name))}</option>`).join('');
  row.innerHTML = `
    <label class="login-label" style="margin:0;flex:1;min-width:160px"><span>${escapeHtml(t('obav_person_label'))}</span>
      <select id="mv-verkn-sel-${userId}" class="login-feld">
        <option value="">${escapeHtml(t('obav_ohne_person'))}</option>${opts}</select></label>
    <button class="mv-toggle" type="button" onclick="mvVerknuepfungSpeichern('${userId}')">${escapeHtml(t('event_save'))}</button>
    <button class="mv-del" type="button" onclick="mvVerknuepfungEntfernen('${userId}')">${escapeHtml(t('mv_verkn_entfernen'))}</button>
    <button class="mv-toggle" type="button" onclick="renderMitglieder()">${escapeHtml(t('event_cancel'))}</button>`;
  macheAlleSelectsSuchbar(row);
}
async function mvVerknuepfungSpeichern(userId) {
  const sel = document.getElementById('mv-verkn-sel-' + userId);
  const personId = sel ? (sel.value || null) : null;
  const res = personId
    ? await sbClient.rpc('person_user_verknuepfen', { p_person: personId, p_user: userId })
    : await sbClient.rpc('person_user_loesen', { p_user: userId });
  if (res.error) { zeigeMvFehler(res.error.message); return; }
  zeigeMvInfo(t('mv_aktualisiert'));
  await ladeMitglieder();
}
async function mvVerknuepfungEntfernen(userId) {
  const res = await sbClient.rpc('person_user_loesen', { p_user: userId });
  if (res.error) { zeigeMvFehler(res.error.message); return; }
  zeigeMvInfo(t('mv_aktualisiert'));
  await ladeMitglieder();
}

// Schreiboperationen laufen über SECURITY-DEFINER-RPCs (verlässlich trotz RLS).
// Jede Aktion wird verifiziert: nur bei bestätigtem Erfolg wird die Liste neu geladen.
async function toggleAktiv(mid, neu) {
  const { data, error } = await sbClient.rpc('mitglied_aktiv_setzen', { p_mid: mid, p_aktiv: neu });
  if (error || data !== true) { zeigeMvFehler(error ? error.message : t('mv_fehlgeschlagen')); return; }
  zeigeMvInfo(t('mv_aktualisiert'));
  await ladeMitglieder();
}
async function aendereRolle(mid, rolle) {
  const { data, error } = await sbClient.rpc('mitglied_rolle_setzen', { p_mid: mid, p_rolle: rolle });
  if (error || data !== true) {
    zeigeMvFehler(error ? error.message : t('mv_fehlgeschlagen'));
    await ladeMitglieder();   // Dropdown auf den echten DB-Stand zurücksetzen
    return;
  }
  zeigeMvInfo(t('mv_rolle_gespeichert'));
  await ladeMitglieder();
}
async function entferneMitglied(mid, email) {
  const ok = await zeigeBestaetigung(t('mv_entfernen_frage') + '\n\n' + email);
  if (!ok) return;
  const { data, error } = await sbClient.rpc('mitglied_entfernen', { p_mid: mid });
  if (error || data !== true) { zeigeMvFehler(error ? error.message : t('mv_fehlgeschlagen')); return; }
  zeigeMvInfo(t('mv_entfernt'));
  await ladeMitglieder();
}

  const wrap = document.getElementById('ma-familie-wrap');

// Legt einen neuen Benutzer an (falls nötig), verknüpft Rolle + Familie und
// verschickt eine Einladungs-Mail mit Registrierungslink (Edge Function).
async function fuegeMitgliedEinladen() {
  const email    = document.getElementById('ma-email').value.trim();
  const rolle    = document.getElementById('ma-rolle').value;
  const fehlerEl = document.getElementById('ma-fehler');
  const infoEl   = document.getElementById('ma-info');
  const button   = document.getElementById('ma-submit');
  fehlerEl.style.display = 'none'; infoEl.style.display = 'none';

  // Familie aus dem <select> (value = familie_id; bei nur einer automatisch)
  let familie_id;
  if (Object.keys(mvFamilien).length <= 1) familie_id = Object.keys(mvFamilien)[0];
  else familie_id = document.getElementById('ma-familie-input').value || null;
  if (!email || !familie_id) { fehlerEl.textContent = t('reg_pflicht'); fehlerEl.style.display = 'block'; return; }
  if (!isValidEmail(email)) {
    markiereEmailFehler(document.getElementById('ma-email'), true);
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('ma-email').focus(); return;
  }

  const altText = button.textContent;
  button.disabled = true; button.textContent = t('reg_senden_laeuft');

  let error = null;
  try {
    const res = await sbClient.functions.invoke('mitglied-einladen', {
      body: { email, rolle, familie_id, sprache: aktuelleSprache },
    });
    error = res.error || (res.data && res.data.error) || null;
  } catch (e) { error = e; }

  button.disabled = false; button.textContent = altText;

  if (error) {
    const msg = error.message || String(error);
    fehlerEl.textContent = /23505|bereits|already/i.test(msg) ? t('mv_bereits') : msg;
    fehlerEl.style.display = 'block'; return;
  }
  document.getElementById('ma-email').value = '';
  infoEl.textContent = t('ma_erfolg'); infoEl.style.display = 'block';
}

// ============================================================
// OBAVJEŠTENJA / BENACHRICHTIGUNGEN — offene Zugangsanfragen (Admins)
// Liste via RPC offene_anfragen; Akzeptieren/Ablehnen via Edge Function
// anfrage-bearbeiten (Rechteprüfung + Mail + Protokoll). Badge = Anzahl.
// ============================================================
let offeneAnfragenCache = [];
let vknAnfragenCache = [];   // offene Verknüpfungs-Anträge (für den Ziel-Familie-Admin)
let deepLinkObav = false;    // ?obav=1 aus der Benachrichtigungs-Mail -> Liste nach Login öffnen

async function ladeOffeneAnfragen() {
  if (!aktuellerUser || !istAdmin()) { offeneAnfragenCache = []; vknAnfragenCache = []; renderObavBadges(); return; }
  const [r1, r2] = await Promise.all([
    sbClient.rpc('offene_anfragen'),
    sbClient.rpc('verknuepfungs_anfragen_offen')
  ]);
  if (r1.error) console.warn('offene_anfragen:', r1.error.message);
  if (r2.error) console.warn('verknuepfungs_anfragen_offen:', r2.error.message);
  offeneAnfragenCache = r1.error ? [] : (r1.data || []);
  vknAnfragenCache    = r2.error ? [] : (r2.data || []);
  renderObavBadges();
}

function renderObavBadges() {
  const n = offeneAnfragenCache.length + vknAnfragenCache.length;
  ['obav-badge-toggle', 'obav-badge-btn'].forEach(id => {
    const b = document.getElementById(id);
    if (b) { b.textContent = n; b.style.display = n > 0 ? '' : 'none'; }
  });
}

// ---- Live-Updates für Obavještenja (Polling, kein Reload nötig) ---------------
// Pollt im Hintergrund ~alle 12 s, solange ein Admin eingeloggt und der Tab
// sichtbar ist. Neue Einträge erscheinen sofort in Badge + Liste und werden
// einmalig hervorgehoben (obav-neu-anim). Mehrere Tabs pollen unabhängig ->
// konsistent; Netzunterbruch wird beim nächsten Tick automatisch nachgeholt.
let obavPollTimer = null;
let obavNeuIds = new Set();   // Element-ids frisch eingetroffener Einträge -> Highlight

async function obavLivePoll() {
  if (!aktuellerUser || !istAdmin()) return;
  // IDs VOR dem Nachladen merken, um wirklich NEU hinzugekommene zu erkennen.
  const alt = new Set([
    ...offeneAnfragenCache.map(a => 'obav-' + a.id),
    ...vknAnfragenCache.map(v => 'obav-vkn-' + v.id)
  ]);
  await ladeOffeneAnfragen();   // aktualisiert Cache + Badge live
  [...offeneAnfragenCache.map(a => 'obav-' + a.id),
   ...vknAnfragenCache.map(v => 'obav-vkn-' + v.id)]
    .filter(id => !alt.has(id))
    .forEach(id => obavNeuIds.add(id));
  // Liste nur neu zeichnen, wenn das Overlay gerade offen ist
  if (document.getElementById('obav-modal')?.classList.contains('aktiv')) renderObavListe();
}

function startObavPolling() {
  stopObavPolling();
  if (!aktuellerUser || !istAdmin()) return;
  obavPollTimer = setInterval(() => {
    if (document.visibilityState === 'visible') obavLivePoll();
  }, 12000);
}
function stopObavPolling() {
  if (obavPollTimer) { clearInterval(obavPollTimer); obavPollTimer = null; }
}

function zeigeObavModal() {
  const menu = document.getElementById('nav-menu'); if (menu) menu.classList.remove('offen');
  renderObavListe();
  document.getElementById('obav-modal').classList.add('aktiv');
  ladeOffeneAnfragen().then(renderObavListe);   // frisch nachladen
}
function schliesseObavModal() { document.getElementById('obav-modal').classList.remove('aktiv'); }

function renderObavListe() {
  const box = document.getElementById('obav-liste'); if (!box) return;
  if (!offeneAnfragenCache.length && !vknAnfragenCache.length) {
    box.innerHTML = `<div class="event-media-empty">${escapeHtml(t('obav_keine'))}</div>`; return;
  }
  const regHtml = offeneAnfragenCache.map(a => {
    const name = ((a.vorname || '') + ' ' + (a.nachname || '')).trim() || a.email;
    const neu = obavNeuIds.has('obav-' + a.id) ? ' obav-neu-anim' : '';
    return `<div class="obav-karte${neu}" id="obav-${a.id}">
      <div class="obav-name">${escapeHtml(nm(name))}<span class="obav-neu-badge">${escapeHtml(t('obav_neu_badge'))}</span></div>
      <div class="obav-meta">
        ${a.geburtsdatum ? `<div><strong>${escapeHtml(t('reg_geburtsdatum'))}:</strong> ${escapeHtml(formatDatumLang(a.geburtsdatum))}</div>` : ''}
        <div><strong>${escapeHtml(t('reg_email'))}:</strong> ${escapeHtml(a.email)}</div>
        ${a.familie_name ? `<div><strong>${escapeHtml(t('mv_familie_label'))}</strong> ${escapeHtml(nm(a.familie_name))}</div>` : ''}
        <div><strong>${escapeHtml(t('obav_datum'))}:</strong> ${escapeHtml(formatDatumLang((a.created_at || '').slice(0, 10)))}</div>
      </div>
      <div class="obav-aktionen">
        <button class="mv-toggle" type="button" onclick="obavAkzeptierenStart('${a.id}','${a.familie_id}')">${escapeHtml(t('obav_akzeptieren'))}</button>
        <button class="mv-del" type="button" onclick="anfrageEntscheiden('${a.id}','ablehnen')">${escapeHtml(t('obav_ablehnen'))}</button>
      </div>
    </div>`;
  }).join('');
  box.innerHTML = regHtml + vknAnfragenCache.map(vknKarteHtml).join('');
  obavNeuIds.clear();   // Highlight ist einmalig pro Eintreffen
}

// Eine Verknüpfungs-Antrag-Karte (Vorschau für den Ziel-Familie-Admin)
function vknKarteHtml(v) {
  const bez = v.bez_typ ? t('bzt_' + v.bez_typ) : '';

async function vknEntscheiden(id, aktion) {
  if (aktion === 'abgelehnt') { const ok = await zeigeBestaetigung(t('vkn_ablehnen_frage')); if (!ok) return; }
  const karte = document.getElementById('obav-vkn-' + id);
  if (karte) { karte.style.opacity = '0.5'; karte.style.pointerEvents = 'none'; }
  const { error } = await sbClient.rpc('verknuepfung_entscheiden', { p_id: id, p_aktion: aktion });
  if (error) {
    if (karte) { karte.style.opacity = ''; karte.style.pointerEvents = ''; }
    await zeigeHinweis(t('reg_fehler') + error.message); return;
  }
  vknAnfragenCache = vknAnfragenCache.filter(v => v.id !== id);
  renderObavBadges(); renderObavListe();
  if (aktion === 'genehmigt' && typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  await zeigeHinweis(t(aktion === 'genehmigt' ? 'vkn_genehmigt' : 'vkn_abgelehnt'));
}

let dubKontext = null;   // { modus, kontext, typ, zweiter, proceed, onLinked }

function schliesseDublettenModal() { document.getElementById('dubletten-modal').classList.remove('aktiv'); }

function zeigeDublettenDialog(matches, kontext) {
  dubKontext = kontext;
  const fehler = document.getElementById('dub-fehler'); fehler.style.display = 'none'; fehler.textContent = '';
  const box = document.getElementById('dub-liste');
  box.innerHTML = (matches || []).map(m => {
    const wo = m.sichtbar
      ? `${escapeHtml(nm(m.name || ''))}${m.baum ? ` — ${escapeHtml(t('merge_info_baum'))}: ${escapeHtml(nm(m.baum))}` : ''}`
      : `${escapeHtml(nm(m.name || ''))} — ${escapeHtml(t('dub_fremde_familie'))}`;
    return `<div class="mg-kandidat">
      <div class="mg-person"><span class="mg-namen">${wo}</span></div>
      <button class="mv-toggle" type="button" onclick="dubVerknuepfen('${m.match_id}')">${escapeHtml(t('dub_verknuepfen'))}</button>
    </div>`;
  }).join('');

}

function dubTrotzdem() {
  const k = dubKontext; dubKontext = null;
  schliesseDublettenModal();
  if (k && typeof k.proceed === 'function') k.proceed();
}

async function dubVerknuepfen(matchId) {
  const k = dubKontext; if (!k) return;
  const fehler = document.getElementById('dub-fehler'); fehler.style.display = 'none';
  const { data, error } = await sbClient.rpc('verknuepfung_anfragen', {
    p_modus: k.modus, p_kontext: k.kontext, p_ziel: matchId, p_typ: k.typ || null, p_zweiter: k.zweiter || null
  });
  if (error) { fehler.textContent = t('reg_fehler') + error.message; fehler.style.display = 'block'; return; }
  dubKontext = null;
  schliesseDublettenModal();
  if (data === 'sofort' && typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  if (k && typeof k.onLinked === 'function') await k.onLinked();
  await zeigeHinweis(t(data === 'sofort' ? 'vkn_sofort' : 'vkn_angefragt'));
}

async function obavNeueKarteBestaetigen(id) {
  const vor  = (document.getElementById('nk-vorname-' + id)?.value || '').trim();
  const nach = (document.getElementById('nk-nachname-' + id)?.value || '').trim();

  if (karte) { karte.style.opacity = '0.5'; karte.style.pointerEvents = 'none'; }
  const { data, error } = await sbClient.functions.invoke('anfrage-bearbeiten', { body: { id, aktion, person_id: personId } });

    if (karte) { karte.style.opacity = ''; karte.style.pointerEvents = ''; }

}

// Stammbaum löschen — nur Owner/Super. Bei mehreren eigenen Bäumen: Auswahl;
// bei genau einem: deutliche Warnung. Danach zweite Sicherheitsabfrage.
let bdBaeume = [];
async function loescheStammbaum() {
  if (!istAdmin()) return;
  const menu = document.getElementById('nav-menu'); if (menu) menu.classList.remove('offen');

  const { data, error } = await sbClient.rpc('meine_owner_baeume');
  if (error) { await zeigeHinweis(t('reg_fehler') + error.message); return; }
  bdBaeume = data || [];
  if (bdBaeume.length === 0) { await zeigeHinweis(t('bd_keine')); return; }

  const einzeln = bdBaeume.length === 1;
  const sel  = document.getElementById('bd-auswahl');
  sel.innerHTML = bdBaeume.map(b =>
    `<option value="${b.stammbaum_id}">${escapeHtml(nm(b.stammbaum_name || '?'))} (${b.personen ?? 0})</option>`
  ).join('');
  document.getElementById('bd-auswahl-wrap').style.display = einzeln ? 'none' : '';
  document.getElementById('bd-warnung').textContent = einzeln ? t('bd_warnung_einzeln') : t('bd_warnung_mehrere');
  document.getElementById('baum-del-modal').classList.add('aktiv');
}

function schliesseBaumDel() {
  document.getElementById('baum-del-modal').classList.remove('aktiv');
}

// Zweite Sicherheitsabfrage, dann löschen.
async function bestaetigeBaumLoeschen() {
  const sel = document.getElementById('bd-auswahl');
  const treeId = sel.value || (bdBaeume[0] && bdBaeume[0].stammbaum_id);
  if (!treeId) return;
  const b = bdBaeume.find(x => x.stammbaum_id === treeId);
  const name = nm((b && b.stammbaum_name) || '?');

  const ok = await zeigeBestaetigung(t('bd_sicher', { name }));
  if (!ok) return;

  // Event-ids dieses Baums VORHER holen (DB-Zeilen fallen gleich per CASCADE weg),
  // damit wir danach deren Storage-Medien aufräumen können.
  let baumEventIds = [];
  try {
    const { data: evs } = await sbClient.rpc('events_fuer_stammbaum', { p_tree: treeId });
    baumEventIds = (evs || []).map(e => e.id);
  } catch (e) { console.warn('Event-ids für Storage-Aufräumen nicht ermittelbar:', e); }

  const { data, error } = await sbClient.rpc('stammbaum_loeschen', { p_tree: treeId });
  if (error) { await zeigeHinweis(t('reg_fehler') + error.message); return; }

  // Storage-Medien aller Events des gelöschten Baums entfernen (keine Waisen)
  for (const eid of baumEventIds) await loescheEventMedien(eid);

  schliesseBaumDel();
  aktuellerStammbaumId = null;
  await setzeUser(aktuellerUser);   // Rolle + Baum + Menü neu laden (ggf. jetzt tree-los)
  await zeigeHinweis(t('baum_geloescht'));
}

  else befuelleStammbaumAuswahl();
  setTimeout(() => schliesseBaumNeu(), 900);
}

// ============================================================
// E-MAIL-VALIDIERUNG (global) — EINE zentrale Regel für ALLE E-Mail-Felder.
// Frontend-Guard; das Backend (Edge Functions / RPC ist_gueltige_email) prüft erneut.
// ------------------------------------------------------------
function isValidEmail(email) {
  const e = (email || '').trim();
  if (!e || /\s/.test(e)) return false;                  // keine Leerzeichen
  if ((e.match(/@/g) || []).length !== 1) return false;  // genau ein @
  if (e.includes('..')) return false;                    // keine doppelten Punkte
  // lokaler Teil @ Domain mit mind. einem Punkt + TLD, keine ungültigen Zeichen
  return /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(e);
}

// Feld optisch markieren + Hinweis darunter (oder entfernen)
function markiereEmailFehler(input, zeige) {
  if (!input) return;
  input.classList.toggle('input-fehler', !!zeige);
  const eltern = input.closest('label') || input.parentNode;
  let hint = eltern.querySelector('.feld-fehler-text.email-hint');
  if (zeige) {
    if (!hint) { hint = document.createElement('span'); hint.className = 'feld-fehler-text email-hint'; eltern.appendChild(hint); }
    hint.textContent = t('email_ungueltig');
  } else if (hint) { hint.remove(); }
}

// Ein E-Mail-Feld prüfen. pflicht=true -> leer ist Fehler; sonst ist leer ok (optionales Feld).
function pruefeEmailFeld(input, pflicht) {
  if (!input) return true;
  const val = (input.value || '').trim();
  if (!val) { markiereEmailFehler(input, !!pflicht); return !pflicht; }
  const ok = isValidEmail(val);
  markiereEmailFehler(input, !ok);
  return ok;
}

// Live-Validierung an alle E-Mail-Felder hängen (blur prüft, Tippen entschärft den Fehler)
function bindeEmailLiveCheck(root) {
  (root || document).querySelectorAll('input[type="email"], input.email-feld').forEach(inp => {
    if (inp._emailBound) return; inp._emailBound = true;
    inp.addEventListener('blur',  () => { if (inp.value.trim()) pruefeEmailFeld(inp, false); });
    inp.addEventListener('input', () => { if (inp.classList.contains('input-fehler')) markiereEmailFehler(inp, false); });
  });
}

  if (!aktuellerUser) return;
  const menu = document.getElementById('nav-menu'); if (menu) menu.classList.remove('offen');
