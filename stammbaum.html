async function uploadEventMedia(eventId, file) {
  if (!file || !aktuellerUser) return { url: null, error: 'Keine Datei oder nicht authentifiziert.' };
  try {
    const bucket = 'events';
    const path = `${eventId}/${Date.now()}_${file.name}`;
    dbg('Upload starten:', { bucket, path, fileType: file.type, fileSize: file.size });
    
    const { data, error } = await sbClient.storage.from(bucket).upload(path, file, {
      cacheControl: '3600',
      upsert: false,
    });
    
    if (error) {
      console.error('Upload-Fehler:', error);
      return { url: null, error: error.message || 'Upload-Fehler' };
    }
    
    dbg('Upload erfolgreich:', data);
    dbg('Full upload response:', JSON.stringify(data));

    // Use the path returned by the upload response when available —
    // the client may normalize or alter the filename. Fall back to our
    // constructed `path` when upload response doesn't include it.
    let uploadedPath = (data && (data.path || data.Key || data.KeyName || data.name)) || path;

    // If the returned path accidentally contains the bucket name prefix,
    // strip it (e.g. "events/..." when we already pass the bucket separately).
    if (uploadedPath && uploadedPath.startsWith(bucket + '/')) {
      uploadedPath = uploadedPath.slice(bucket.length + 1);
      dbg('Stripped bucket prefix from uploadedPath, now:', uploadedPath);
    }

    dbg('Using path for signed URL:', uploadedPath);

    // Debug: list objects in the target folder to verify the object exists
    try {
      const { data: listData, error: listErr } = await sbClient.storage.from(bucket).list(eventId, { limit: 100 });
      dbg('List objects in folder', eventId, listData, listErr);
    } catch (listEx) {
      console.warn('List-exception:', listEx);
    }

    // Debug: get public URL (works for public buckets) to compare
    try {
      const publicRes = sbClient.storage.from(bucket).getPublicUrl(uploadedPath);
      dbg('Public URL result:', publicRes);
    } catch (pubEx) {
      console.warn('PublicUrl-exception:', pubEx);
    }

    // Try to create a signed URL first
    const { data: urlData, error: signError } = await sbClient.storage.from(bucket).createSignedUrl(uploadedPath, 60 * 60 * 24);
    if (!signError && urlData?.signedUrl) {
      dbg('Signed URL generiert:', urlData.signedUrl);
      return { url: urlData.signedUrl, error: null, storagePath: uploadedPath };
    }

    console.warn('Signed URL-Fehler:', signError);

    // Fallback 1: if the bucket is public, getPublicUrl will return a usable URL
    try {
      const publicRes = sbClient.storage.from(bucket).getPublicUrl(uploadedPath);
      if (publicRes && publicRes.data && publicRes.data.publicUrl) {
        dbg('Public URL result:', publicRes.data.publicUrl);
        return { url: publicRes.data.publicUrl, error: null, storagePath: uploadedPath };
      }
    } catch (pubEx) {
      console.warn('PublicUrl-exception:', pubEx);
    }

    // Fallback 2: try to download the object (requires auth) and create a blob URL
    try {
      const { data: downloadData, error: downloadError } = await sbClient.storage.from(bucket).download(uploadedPath);
      if (!downloadError && downloadData) {
        const blobUrl = URL.createObjectURL(downloadData);
        dbg('Erzeugt blob-URL für Anzeige');
        return { url: blobUrl, error: null, storagePath: uploadedPath, isBlob: true };
      } else {
        console.warn('Download-Fehler:', downloadError);
      }
    } catch (downloadEx) {
      console.warn('Download-exception:', downloadEx);
    }

    return { url: null, error: signError?.message || 'URL-Fehler', storagePath: uploadedPath };
  } catch (err) {
    console.error('Upload-Exception:', err);
    return { url: null, error: err.message || 'Unbekannter Fehler' };
  }
}

// Medien werden direkt aus dem geteilten Supabase-Storage gelesen, damit sie
// für ALLE eingeloggten User sichtbar sind (vorher nur im lokalen localStorage).
const EVENTS_BUCKET = 'events';

// Cache der zuletzt gerenderten Medienliste je Event – damit Löschen per Index
// den richtigen Storage-Pfad findet.
let letzteMedienListe = {};

async function renderEventMedia(eventId) {
  const { data: files, error } = await sbClient.storage
    .from(EVENTS_BUCKET)
    .list(eventId, { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });

  if (error) {
    console.warn('Medien-Liste konnte nicht geladen werden:', error);
    letzteMedienListe[eventId] = [];
    return [];
  }

  // Platzhalter-Objekte (leere Ordner) herausfiltern
  const realFiles = (files || []).filter(f => f.name && f.name !== '.emptyFolderPlaceholder');
  if (realFiles.length === 0) {
    letzteMedienListe[eventId] = [];
    return [];
  }

  const paths = realFiles.map(f => `${eventId}/${f.name}`);

  // Signierte URLs für alle Dateien in EINEM Aufruf (gültig 24h, bei jedem Öffnen neu erzeugt)
  const { data: signed, error: signErr } = await sbClient.storage
    .from(EVENTS_BUCKET)
    .createSignedUrls(paths, 60 * 60 * 24);
  if (signErr) console.warn('Signed-URL-Fehler:', signErr);

  const media = realFiles.map((f, i) => {
    const mimetype = (f.metadata && f.metadata.mimetype) || '';
    const type = mimetype || (/\.(mp4|webm|mov|m4v|ogg)$/i.test(f.name) ? 'video/mp4'
                  : /\.pdf$/i.test(f.name) ? 'application/pdf' : 'image/*');
    return {
      url:  signed && signed[i] ? signed[i].signedUrl : '',
      name: f.name.replace(/^\d+_/, ''),   // Zeitstempel-Präfix für die Anzeige entfernen
      type,
      path: `${eventId}/${f.name}`
    };
  });

  letzteMedienListe[eventId] = media;
  return media;
}

// Alle Medien eines Events aus dem Storage entfernen — beim Löschen aufrufen,
// damit keine verwaisten Dateien zurückbleiben (Integritätsregel CLAUDE.md).
async function loescheEventMedien(eventId) {
  if (!eventId) return;
  try {
    const { data: files, error } = await sbClient.storage.from(EVENTS_BUCKET).list(eventId, { limit: 100 });
    if (error) { console.warn('Medien-Liste (Löschen):', error); return; }
    const pfade = (files || [])
      .filter(f => f.name && f.name !== '.emptyFolderPlaceholder')
      .map(f => `${eventId}/${f.name}`);
    if (pfade.length) {
      const { error: rmErr } = await sbClient.storage.from(EVENTS_BUCKET).remove(pfade);
      if (rmErr) console.warn('Medien-Löschen:', rmErr);
    }
  } catch (e) { console.warn('Medien-Aufräumen fehlgeschlagen:', e); }
}

// Eigener Bestätigungs-Dialog statt Browser-confirm. Liefert ein Promise<boolean>.
function zeigeBestaetigung(text, opts) {
  opts = opts || {};
  const jaText   = opts.jaText   || t('ja');
  const neinText = opts.neinText || t('nein');
  const jaClass  = opts.gefahr ? 'confirm-ja confirm-gefahr' : 'confirm-ja';
  // Mehrzeilige Warnungen (\n) sollen als Absätze sichtbar bleiben.
  const textStyle = opts.gefahr ? ' style="white-space:pre-line;text-align:left"' : '';
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-text"${textStyle}>${escapeHtml(text)}</p>
        <div class="confirm-actions">
          <button type="button" class="${jaClass}">${escapeHtml(jaText)}</button>
          <button type="button" class="confirm-nein">${escapeHtml(neinText)}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const fertig = (wert) => { overlay.remove(); resolve(wert); };
    overlay.querySelector('.confirm-ja').addEventListener('click', () => fertig(true));
    overlay.querySelector('.confirm-nein').addEventListener('click', () => fertig(false));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) fertig(false); });
  });
}

// Ereignis-Bereich: lädt die Events des aktiven Baums (events_fuer_mich → eventsCache)
// und rendert BEIDE Ansichten aus DERSELBEN Quelle — Liste (Verwaltung) und Zeitstrahl
// (rein lesend). eventsCache wird hier EINMAL geladen; der Zeitstrahl liest daraus mit
// (kein separater RPC-Aufruf) und ergänzt clientseitige Lebensdaten aus aktuelleDaten.
let eventsCache = [];
async function zeigeShorts() {
  const grid = document.getElementById('shorts-grid');
  const btn  = document.getElementById('event-neu-btn');
  const darfBearbeiten = istAdmin();
  evApplyModusUI();   // Liste/Zeitstrahl-Wrapper + Umschalter-Status setzen
  // „Neues Event" nur im Liste-/Verwaltungsmodus (Admin + Baum)
  if (btn) btn.style.display = (darfBearbeiten && aktuellerStammbaumId && evModus === 'liste') ? '' : 'none';

  if (!aktuellerStammbaumId) {
    grid.innerHTML = `<div class="keine-treffer">${t('event_kein_baum')}</div>`;
    eventsCache = []; zsFuelleFilter(); zsRender(); return;
  }

  grid.innerHTML = `<div class="keine-treffer">…</div>`;
  const { data, error } = await sbClient.rpc('events_fuer_mich', { p_tree: aktuellerStammbaumId });
  if (error) {
    grid.innerHTML = `<div class="keine-treffer">${escapeHtml(error.message)}</div>`;
    eventsCache = []; zsFuelleFilter(); zsRender(); return;
  }
  eventsCache = data || [];

  // ----- Ansicht A: Liste/Verwaltung (unverändert) -----
  // Namenssuche ist im Ereignis-Bereich bewusst deaktiviert (Suchfeld ausgegraut) →
  // hier kein Filter, immer alle Events des Baums anzeigen.
  const liste = eventsCache;
  if (liste.length === 0) {
    grid.innerHTML = `<div class="keine-treffer">${t(eventsCache.length ? 'keine_treffer' : 'event_keine')}</div>`;
  } else {
    grid.innerHTML = liste.map(ev => `
      <div class="short-card" style="cursor:pointer" onclick="zeigeEventDetail('${ev.id}')">
        <div class="thumb">🗓</div>
        <h3>${escapeHtml(ev.titel)}</h3>
        ${(ev.datum || ev.ort) ? `<p>${escapeHtml([formatDatumLang(ev.datum), uebersetzeOrt(ev.ort)].filter(Boolean).join(' · '))}</p>` : ''}
        ${ev.typ ? `<div class="meta">${escapeHtml(t('evt_' + ev.typ))}</div>` : ''}
        ${ev.organisator ? `<div class="meta" style="margin-top:6px;font-size:12px;color:#8a7a5a">${escapeHtml(t('event_organizer'))} ${escapeHtml(nm(ev.organisator))}</div>` : ''}
        ${ev.beschreibung ? `<div class="meta" style="margin-top:10px;font-size:13px;color:#5e4b35;line-height:1.5">${escapeHtml(ev.beschreibung)}</div>` : ''}
        <div class="event-aktionen" style="margin-top:14px">
          <button class="mv-toggle" type="button" onclick="event.stopPropagation(); oeffneKosten('${ev.id}')">${escapeHtml(t('kosten_titel'))}</button>
          ${darfBearbeiten ? `<button class="mv-toggle" type="button" onclick="event.stopPropagation(); zeigeEventBearbeiten('${ev.id}')">${escapeHtml(t('event_edit'))}</button>
          <button class="mv-del" type="button" onclick="event.stopPropagation(); loescheEvent('${ev.id}')">${escapeHtml(t('event_loeschen_btn'))}</button>` : ''}
        </div>
      </div>`).join('');
  }

  // ----- Ansicht B: Zeitstrahl (teilt eventsCache; Lebensdaten aus aktuelleDaten) -----
  zsFuelleFilter();   // Filter-Optionen (Personen/Jahrzehnte) aus den frischen Daten
  zsRender();         // Achse zeichnen (auch wenn versteckt -> nach Modus-Wechsel sofort da)

  // ----- Ansicht C: Karte (teilt eventsCache; nur wenn aktiv neu zeichnen) -----
  karteFuelleFilter();
  if (evModus === 'karte') karteRender();
}

// ============================================================
// EREIGNIS-BEREICH — ANSICHT B: ZEITSTRAHL (rein lesend)
// Teilt die Datenquelle der Liste (eventsCache aus events_fuer_mich) und ergänzt
// clientseitig abgeleitete LEBENSDATEN aus aktuelleDaten (Geburt/Tod/Heirat).
// KEINE neue Tabelle/RPC/Library. Scope = aktiver Baum (wie die Event-Liste).
// v1-GRENZEN (bewusst): nur Marker mit PARSEBAREM ISO-Datum erscheinen; Heiraten nur,
// wenn ein Heiratsdatum (hochzeit_standesamt/-kirchlich) vorhanden ist; keine
// baumübergreifende Chronik (nur p._tree === aktuellerStammbaumId).
// ============================================================
let evModus = 'liste';   // 'liste' = Verwaltung (Event-Karten) | 'zeit' = Zeitstrahl (lesend)

// Icon je Marker-Art bzw. Event-Typ (Fallback: Kalender).
const ZS_TYP_ICON = {
  geburt: '👶', heirat: '💍', tod: '🕯️',
  taufe: '⛪', hochzeit: '💍', jubilaeum: '🎉', treffen: '🤝', '': '🗓️'
};

// Beliebiges Datum -> ISO oder null (NUR datierte Marker erscheinen auf der Achse;
// nicht-parsebare Freitext-Altwerte werden bewusst übersprungen).
function zsIso(v) { return istIsoDatum(v) ? v : parseDatumZuIso(v); }
function zsJahrAusIso(iso) { return iso ? +iso.slice(0, 4) : null; }
// Anzeigename einer Modell-Person (sr -> Kyrillisch via nm()).
function zsName(p) { return p ? nm(p.name || ((p.given || '') + ' ' + (p.surname || '')).trim()) : ''; }

// Umschalter Liste/Zeitstrahl (segmented control) ----------------------------
function evApplyModusUI() {
  const lWrap = document.getElementById('ev-liste-wrap');
  const zWrap = document.getElementById('ev-zeit-wrap');
  const kWrap = document.getElementById('ev-karte-wrap');
  if (lWrap) lWrap.style.display = (evModus === 'liste') ? '' : 'none';
  if (zWrap) zWrap.style.display = (evModus === 'zeit')  ? '' : 'none';
  if (kWrap) kWrap.style.display = (evModus === 'karte') ? '' : 'none';
  document.querySelectorAll('#ev-modus .ev-modus-btn').forEach(b =>
    b.classList.toggle('aktiv', b.dataset.evModus === evModus));
}
function evSetModus(m) {
  if (m !== 'liste' && m !== 'zeit' && m !== 'karte') return;
  evModus = m;
  evApplyModusUI();
  const btn = document.getElementById('event-neu-btn');
  if (btn) btn.style.display = (istAdmin() && aktuellerStammbaumId && evModus === 'liste') ? '' : 'none';
  if (m === 'zeit')  { zsFuelleFilter(); zsRender(); }
  if (m === 'karte') { karteFuelleFilter(); karteRender(); }
}

// Marker aus BEIDEN Quellen bauen (nur aktiver Baum, nur parsebare ISO-Daten).
function zsBaueMarker() {
  const marker = [];

  // Quelle 1: organisierte Events (eventsCache der Liste; aktiver Baum)
  (eventsCache || []).forEach(ev => {
    if (ev.stammbaum_id && ev.stammbaum_id !== aktuellerStammbaumId) return;   // Scope aktiver Baum
    const iso = zsIso(ev.datum);
    if (!iso) return;
    marker.push({ kat: 'event', art: 'event', iso, eventId: ev.id,
                  titel: ev.titel || '', ort: ev.ort || '', typ: ev.typ || '',
                  organisator: ev.organisator || '' });
  });

  // Quelle 2: abgeleitete Lebensdaten aus den geladenen Personen des aktiven Baums
  const ps   = (aktuelleDaten && aktuelleDaten.persons)  || {};
  const fams = (aktuelleDaten && aktuelleDaten.families) || {};
  const ehePaare = new Set();
  Object.values(ps).forEach(p => {
    if (!p || p._tree !== aktuellerStammbaumId || p.platzhalter) return;
    const gIso = zsIso(p.birth_date);
    if (gIso) marker.push({ kat: 'leben', art: 'geburt', iso: gIso, personId: p.id, name: zsName(p) });
    if (p.deceased || p.death_date) {
      const dIso = zsIso(p.death_date);
      if (dIso) marker.push({ kat: 'leben', art: 'tod', iso: dIso, personId: p.id, name: zsName(p) });
    }
    // Heirat: Datum liegt auf der PERSON (hochzeit_standesamt/-kirchlich), NICHT an der
    // Beziehung. Je Paar nur EIN Marker (Dedupe über sortierten Paar-Schlüssel).
    (p.families_spouse || []).forEach(fid => {
      const fam = fams[fid]; if (!fam) return;
      const partnerId = (fam.husband === p.id) ? fam.wife : (fam.wife === p.id ? fam.husband : null);
      const key = [p.id, partnerId || ''].sort().join('__');
      if (ehePaare.has(key)) return;
      const partner = partnerId ? ps[partnerId] : null;
      const hIso = zsIso(p.hochzeit_standesamt) || zsIso(p.hochzeit_kirchlich)
                || (partner && (zsIso(partner.hochzeit_standesamt) || zsIso(partner.hochzeit_kirchlich)));
      if (!hIso) return;                       // Heirat nur mit verfügbarem Datum
      ehePaare.add(key);
      marker.push({ kat: 'leben', art: 'heirat', iso: hIso, personId: p.id,
                    partnerId: partnerId || null, name: zsName(p), partnerName: zsName(partner) });
    });
  });

  return marker;
}

// Personen mit ≥1 Lebensmarker -> Personen-Filter (= „Lebenslauf einer Person").
function zsPersonenListe(marker) {
  const seen = new Map();
  (marker || []).forEach(mk => {
    if (mk.kat !== 'leben') return;
    if (mk.personId  && !seen.has(mk.personId))  seen.set(mk.personId,  mk.name || '');
    if (mk.partnerId && !seen.has(mk.partnerId)) seen.set(mk.partnerId, mk.partnerName || '');
  });
  return [...seen.entries()].map(([id, name]) => ({ id, name }))
    .sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' }));
}

// Filter-Dropdowns (Person / Art / Jahrzehnt) — Auswahl bleibt erhalten, wenn gültig.
function zsFuelleFilter() {
  const marker   = zsBaueMarker();
  const personen = zsPersonenListe(marker);

  const fp = document.getElementById('zs-f-person');
  if (fp) {
    const alt = fp.value;
    fp.innerHTML = `<option value="">${escapeHtml(t('zs_alle'))}</option>` +
      personen.map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join('');
    fp.value = personen.some(p => p.id === alt) ? alt : '';
  }

  const fa = document.getElementById('zs-f-art');
  if (fa) {
    const alt = fa.value;
    const arten = [['', t('zs_alle')], ['event', t('zs_art_event')],
                   ['geburt', t('zs_art_geburt')], ['heirat', t('zs_art_heirat')], ['tod', t('zs_art_tod')]];
    fa.innerHTML = arten.map(([v, lab]) => `<option value="${v}">${escapeHtml(lab)}</option>`).join('');
    fa.value = arten.some(a => a[0] === alt) ? alt : '';
  }

  const fd = document.getElementById('zs-f-dekade');
  if (fd) {
    const alt = fd.value;
    const dekaden = [...new Set(marker.map(mk => zsJahrAusIso(mk.iso)).filter(j => j != null)
                                       .map(j => Math.floor(j / 10) * 10))].sort((a, b) => a - b);
    fd.innerHTML = `<option value="">${escapeHtml(t('zs_alle'))}</option>` +
      dekaden.map(d => `<option value="${d}">${d}–${d + 9}</option>`).join('');
    fd.value = dekaden.some(d => String(d) === alt) ? alt : '';
  }
}

// Klick-Ziele: Event -> bestehendes Event-Detail (Kosten/Teilnehmer/Medien);
// Lebensmarker -> Personenkarte (#modal). Beide rein lesend aus dieser Ansicht.
function zsOeffneEvent(eventId) { if (typeof zeigeEventDetail === 'function') zeigeEventDetail(eventId); }
function zsOeffnePerson(personId) { if (personId && aktuelleDaten.persons && aktuelleDaten.persons[personId]) zeigeDetails(personId); }

// Achse rendern (gefiltert, chronologisch, nach Jahr gruppiert).
function zsRender() {
  const liste = document.getElementById('zs-timeline');
  const kopf  = document.getElementById('zs-bio-kopf');
  if (!liste) return;
  if (kopf) { kopf.style.display = 'none'; kopf.innerHTML = ''; }

  if (!aktuellerStammbaumId) { liste.innerHTML = `<div class="keine-treffer">${t('event_kein_baum')}</div>`; return; }

  let marker = zsBaueMarker();
  if (marker.length === 0) { liste.innerHTML = `<div class="keine-treffer">${t('zs_keine')}</div>`; return; }

  const fPerson = (document.getElementById('zs-f-person') || {}).value || '';
  const fArt    = (document.getElementById('zs-f-art')    || {}).value || '';
  const fDekade = (document.getElementById('zs-f-dekade') || {}).value || '';

  // Person gewählt = „Lebenslauf": nur Marker dieser Person (organisierte Events haben
  // keinen Personenbezug und fallen damit heraus -> Fokus auf das Leben der Person).
  if (fPerson) {
    marker = marker.filter(mk => mk.personId === fPerson || mk.partnerId === fPerson);
    const pName = zsName(aktuelleDaten.persons[fPerson]);
    if (kopf) {
      kopf.style.display = '';
      kopf.innerHTML = `<span class="zs-bio-name">${escapeHtml(t('zs_bio_titel', { name: pName }))}</span>` +
        `<span class="zs-bio-zahl">${escapeHtml(t('zs_bio_anzahl', { n: marker.length }))}</span>`;
    }
  }
  if (fArt)    marker = marker.filter(mk => mk.art === fArt);
  if (fDekade) marker = marker.filter(mk => Math.floor(zsJahrAusIso(mk.iso) / 10) * 10 === +fDekade);

  if (marker.length === 0) { liste.innerHTML = `<div class="keine-treffer">${t('keine_treffer')}</div>`; return; }

  marker.sort((a, b) => a.iso.localeCompare(b.iso));   // chronologisch (älteste zuerst)

  // nach Jahr gruppieren
  let html = '', jahr = null;
  marker.forEach(mk => {
    const j = zsJahrAusIso(mk.iso);
    if (j !== jahr) { jahr = j; html += `<div class="zs-jahr">${j}</div>`; }
    html += zsMarkerHtml(mk);
  });
  liste.innerHTML = html;
}

function zsMarkerHtml(mk) {
  const icon = ZS_TYP_ICON[mk.art === 'event' ? (mk.typ || '') : mk.art] || ZS_TYP_ICON[''];
  const datumTxt = formatDatumLang(mk.iso);

  if (mk.kat === 'event') {
    const typLb  = mk.typ ? t('evt_' + mk.typ) : t('evt_sonstiges');
    const ortTxt = uebersetzeOrt(mk.ort);
    return `
      <div class="zs-item">
        <div class="zs-marker"><span class="zs-icon zs-icon--event">${icon}</span></div>
        <div class="zs-card zs-card--event" role="button" tabindex="0" onclick="zsOeffneEvent('${mk.eventId}')">
          <div class="zs-card-head">
            <span class="zs-datum">${escapeHtml(datumTxt)}</span>
            <span class="zs-badge zs-badge--event">${escapeHtml(t('zs_event_badge'))}</span>
            <span class="zs-typ">${escapeHtml(typLb)}</span>
          </div>
          <h3 class="zs-card-titel">${escapeHtml(mk.titel)}</h3>
          ${ortTxt ? `<div class="zs-meta">📍 ${escapeHtml(ortTxt)}</div>` : ''}
          ${mk.organisator ? `<div class="zs-meta">${escapeHtml(t('event_organizer'))} ${escapeHtml(nm(mk.organisator))}</div>` : ''}
        </div>
      </div>`;
  }

  // Lebensmarker (Geburt/Tod/Heirat) — rein lesend, öffnet die Personenkarte.
  const typLb = (mk.art === 'geburt') ? t('evt_geburt') : (mk.art === 'tod') ? t('evt_tod') : t('evt_hochzeit');
  const titel = (mk.art === 'heirat')
    ? `${escapeHtml(mk.name)}${mk.partnerName ? ' &amp; ' + escapeHtml(mk.partnerName) : ''}`
    : escapeHtml(mk.name);
  return `
    <div class="zs-item">
      <div class="zs-marker"><span class="zs-icon">${icon}</span></div>
      <div class="zs-card zs-card--leben" role="button" tabindex="0" onclick="zsOeffnePerson('${mk.personId}')">
        <div class="zs-card-head">
          <span class="zs-datum">${escapeHtml(datumTxt)}</span>
          <span class="zs-typ">${escapeHtml(typLb)}</span>
        </div>
        <h3 class="zs-card-titel">${titel}</h3>
      </div>
    </div>`;
}

// ============================================================
// EREIGNIS-BEREICH — ANSICHT C: KARTE (rein lesend; Leaflet/OpenStreetMap)
// Teilt eventsCache (events_fuer_mich). lat/lng + bezugsperson_id liegen am Event
// (keine neue Tabelle/RPC). Marker sind CSS-DivIcons (kein externes Bild -> CSP-schonend).
// Modus 'alle' = alle verorteten Events des aktiven Baums; Modus 'person' =
// Migrationspfad EINER Bezugsperson (ihre verorteten Events chronologisch, Polyline,
// Start grün/Ende rot). Scope = aktiver Baum (wie Liste/Zeitstrahl).
// ============================================================
let karteModus = 'alle';          // 'alle' | 'person'
let karteMap = null;              // Leaflet-Map (lazy, erst wenn sichtbar)
let karteLayer = null;            // FeatureGroup (wird je Render geleert)
let karteInitFehler = false;      // Leaflet nicht geladen?

// Verortete Events des aktiven Baums (lat/lng gesetzt).
function karteEvents() {
  return (eventsCache || []).filter(ev =>
    (!ev.stammbaum_id || ev.stammbaum_id === aktuellerStammbaumId) &&
    typeof ev.latitude === 'number' && typeof ev.longitude === 'number' &&
    isFinite(ev.latitude) && isFinite(ev.longitude));
}

// Bezugspersonen mit ≥1 verortetem Event -> Personen-Filter (Migrationspfad).
function kartePersonen() {
  const seen = new Map();
  karteEvents().forEach(ev => {
    if (!ev.bezugsperson_id || seen.has(ev.bezugsperson_id)) return;
    const p = Object.values(aktuelleDaten.persons || {})
      .find(pp => pp && String(pp._uuid) === String(ev.bezugsperson_id));
    seen.set(ev.bezugsperson_id, p ? zsName(p) : '');
  });
  return [...seen.entries()].map(([id, name]) => ({ id, name }))
    .sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' }));
}

function karteSetModus(m) {
  if (m !== 'alle' && m !== 'person') return;
  karteModus = m;
  document.querySelectorAll('#karte-modus .karte-modus-btn').forEach(b =>
    b.classList.toggle('aktiv', b.dataset.karteModus === m));
  const pw = document.getElementById('karte-person-wrap');
  if (pw) pw.style.display = (m === 'person') ? '' : 'none';
  karteRender();
}

function karteFuelleFilter() {
  const fp = document.getElementById('karte-f-person');
  if (!fp) return;
  const personen = kartePersonen();
  const alt = fp.value;
  fp.innerHTML = `<option value="">${escapeHtml(t('karte_person_waehlen'))}</option>` +
    personen.map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name || t('zs_alle'))}</option>`).join('');
  fp.value = personen.some(p => String(p.id) === String(alt)) ? alt : '';
}

// Leaflet-Map lazy aufbauen (Container muss sichtbar + gemessen sein).
function karteInit() {
  if (karteMap || karteInitFehler) return karteMap;
  if (typeof L === 'undefined') { karteInitFehler = true; return null; }
  const el = document.getElementById('event-karte');
  if (!el) return null;
  karteMap = L.map(el, { scrollWheelZoom: true }).setView([44.0, 18.0], 5);   // Balkan-Default
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(karteMap);
  karteLayer = L.featureGroup().addTo(karteMap);
  return karteMap;
}

// DivIcon (CSS-Pin) — keine externen Marker-Bilder (CSP-schonend).
function karteIcon(cls, label) {
  return L.divIcon({ className: 'karte-pin-wrap',
    html: `<span class="karte-pin ${cls}">${label != null ? label : ''}</span>`,
    iconSize: [28, 28], iconAnchor: [14, 28], popupAnchor: [0, -26] });
}

function kartePopupHtml(ev) {
  const typLb = ev.typ ? t('evt_' + ev.typ) : t('evt_sonstiges');
  const zeilen = [
    `<strong>${escapeHtml(ev.titel || '')}</strong>`,
    ev.datum ? `${escapeHtml(t('event_datum'))}: ${escapeHtml(formatDatumLang(ev.datum))}` : '',
    `${escapeHtml(t('event_typ'))}: ${escapeHtml(typLb)}`,
    ev.ort ? `${escapeHtml(t('event_ort'))}: ${escapeHtml(uebersetzeOrt(ev.ort))}` : ''
  ].filter(Boolean).join('<br>');
  return `<div class="karte-popup">${zeilen}
    <button class="karte-popup-btn" type="button" onclick="zeigeEventDetail('${ev.id}')">${escapeHtml(t('karte_details'))}</button></div>`;
}

function karteLeer(msg) {
  const leer = document.getElementById('karte-leer');
  if (leer) { leer.style.display = ''; leer.textContent = msg; }
  if (karteLayer) karteLayer.clearLayers();
  const leg = document.getElementById('karte-legende');
  if (leg) leg.style.display = 'none';
}
function karteLeerAus() { const leer = document.getElementById('karte-leer'); if (leer) leer.style.display = 'none'; }
function karteFit() {
  if (!karteMap || !karteLayer) return;
  const b = karteLayer.getBounds();
  if (b && b.isValid()) karteMap.fitBounds(b, { padding: [40, 40], maxZoom: 13 });
}

function karteRender() {
  const map = karteInit();
  if (!map) { karteLeer(t('karte_nicht_geladen')); return; }
  setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 60);   // 0-Höhe beim ersten Anzeigen
  karteLayer.clearLayers();
  const leg = document.getElementById('karte-legende');
  if (leg) leg.style.display = 'none';

  if (!aktuellerStammbaumId) { karteLeer(t('event_kein_baum')); return; }

  if (karteModus === 'person') {
    const fp  = document.getElementById('karte-f-person');
    const pid = fp ? fp.value : '';
    if (!pid) { karteLeer(t('karte_person_hinweis')); return; }
    let evs = karteEvents().filter(ev => String(ev.bezugsperson_id) === String(pid) && zsIso(ev.datum));
    evs.sort((a, b) => zsIso(a.datum).localeCompare(zsIso(b.datum)));   // chronologisch
    if (evs.length === 0) { karteLeer(t('karte_keine_person_orte')); return; }
    karteLeerAus();
    const punkte = [];
    evs.forEach((ev, i) => {
      const ll = [ev.latitude, ev.longitude];
      punkte.push(ll);
      const cls = (i === 0) ? 'start' : (i === evs.length - 1 ? 'ende' : 'pfad');
      L.marker(ll, { icon: karteIcon(cls, String(i + 1)) })
        .bindPopup(kartePopupHtml(ev)).addTo(karteLayer);
    });
    if (punkte.length > 1)
      L.polyline(punkte, { color: '#9c7c3c', weight: 3, opacity: 0.85, dashArray: '6 6' }).addTo(karteLayer);
    if (leg && evs.length > 1) leg.style.display = '';
    karteFit();
    return;
  }

  // Modus 'alle': alle verorteten Events
  const evs = karteEvents();
  if (evs.length === 0) { karteLeer(t('karte_keine_orte')); return; }
  karteLeerAus();
  evs.forEach(ev => {
    L.marker([ev.latitude, ev.longitude], { icon: karteIcon('event', '📍') })
      .bindPopup(kartePopupHtml(ev)).addTo(karteLayer);
  });
  karteFit();
}

// ============================================================
// GEOCODING-EDITOR (Event-Modal): Nominatim-Ortssuche + Klick-Karte
// Setzt lat/lng am Event. Rate-Limit-schonend (debounced, min. ~1.1s zwischen
// Anfragen). Fallback: Position direkt auf der Karte anklicken.
// ============================================================
let geoEditMap = null, geoEditMarker = null, geoSucheTimer = null, geoLetzteSuche = 0;

function geoEditInit() {
  if (typeof L === 'undefined') return null;
  const el = document.getElementById('ev-geo-map');
  if (!el) return null;
  if (geoEditMap) { setTimeout(() => { try { geoEditMap.invalidateSize(); } catch (e) {} }, 60); return geoEditMap; }
  geoEditMap = L.map(el, { scrollWheelZoom: false }).setView([44.0, 18.0], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(geoEditMap);
  geoEditMap.on('click', e => geoSetze(e.latlng.lat, e.latlng.lng, false));   // manuell setzen
  setTimeout(() => { try { geoEditMap.invalidateSize(); } catch (e) {} }, 60);
  return geoEditMap;
}

// Editor-Karte beim Öffnen des Event-Modals vorbereiten (Container ist dann sichtbar).
function geoEditOeffnen(lat, lng) {
  const suche = document.getElementById('ev-geo-suche');
  const tref  = document.getElementById('ev-geo-treffer');
  if (suche) suche.value = '';
  if (tref)  tref.innerHTML = '';
  const map = geoEditInit();
  if (geoEditMarker && map) { map.removeLayer(geoEditMarker); geoEditMarker = null; }
  const hatKoord = lat != null && lng != null && lat !== '' && lng !== '' && !isNaN(+lat) && !isNaN(+lng);
  if (hatKoord) {
    geoSetze(+lat, +lng, true);
  } else {
    document.getElementById('ev-lat').value = '';
    document.getElementById('ev-lng').value = '';
    if (map) map.setView([44.0, 18.0], 5);
    geoStatusAktualisieren();
  }
}

// Marker + Felder setzen; recenter optional (true bei Treffer-Wahl, false bei Klick).
function geoSetze(lat, lng, recenter) {
  lat = +(+lat).toFixed(6); lng = +(+lng).toFixed(6);
  document.getElementById('ev-lat').value = lat;
  document.getElementById('ev-lng').value = lng;
  const map = geoEditInit();
  if (map) {
    if (geoEditMarker) geoEditMarker.setLatLng([lat, lng]);
    else geoEditMarker = L.marker([lat, lng], { icon: karteIcon('event', '📍') }).addTo(map);
    if (recenter) map.setView([lat, lng], Math.max(map.getZoom() || 5, 11));
  }
  geoStatusAktualisieren();
}

function geoEntfernen() {
  document.getElementById('ev-lat').value = '';
  document.getElementById('ev-lng').value = '';
  if (geoEditMap && geoEditMarker) { geoEditMap.removeLayer(geoEditMarker); geoEditMarker = null; }
  geoStatusAktualisieren();
}

function geoStatusAktualisieren() {
  const lat = document.getElementById('ev-lat').value;
  const lng = document.getElementById('ev-lng').value;
  const st  = document.getElementById('ev-geo-status');
  const clr = document.getElementById('ev-geo-clear');
  if (lat && lng) {
    if (st)  st.textContent = t('geo_gesetzt') + ': ' + (+lat).toFixed(4) + ', ' + (+lng).toFixed(4);
    if (clr) clr.style.display = '';
  } else {
    if (st)  st.textContent = t('geo_kein_koord');
    if (clr) clr.style.display = 'none';
  }
}

function geoSucheDebounce() {
  clearTimeout(geoSucheTimer);
  geoSucheTimer = setTimeout(geoSucheAusfuehren, 700);   // Tippen abwarten (Nominatim schonen)
}

async function geoSucheAusfuehren() {
  clearTimeout(geoSucheTimer);
  const inp = document.getElementById('ev-geo-suche');
  const box = document.getElementById('ev-geo-treffer');
  if (!inp || !box) return;
  const q = inp.value.trim();
  if (q.length < 3) { box.innerHTML = ''; return; }
  // Nominatim-Policy: höchstens ~1 Anfrage/Sekunde -> Mindestabstand erzwingen.
  const seit = Date.now() - geoLetzteSuche;
  if (seit < 1100) { geoSucheTimer = setTimeout(geoSucheAusfuehren, 1100 - seit); return; }
  geoLetzteSuche = Date.now();
  box.innerHTML = `<div class="geo-treffer-info">${escapeHtml(t('geo_suchen_laeuft'))}</div>`;
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language='
      + encodeURIComponent(aktuelleSprache || 'de') + '&q=' + encodeURIComponent(q);
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const daten = await res.json();
    if (!Array.isArray(daten) || daten.length === 0) {
      box.innerHTML = `<div class="geo-treffer-info">${escapeHtml(t('geo_keine_treffer'))}</div>`;
      return;
    }
    box.innerHTML = daten.map(d =>
      `<button type="button" class="geo-treffer-item" data-name="${escapeHtml(d.display_name)}"
         onclick="geoTrefferWahl(${(+d.lat)}, ${(+d.lon)}, this)">${escapeHtml(d.display_name)}</button>`).join('');
  } catch (e) {
    box.innerHTML = `<div class="geo-treffer-info">${escapeHtml(t('geo_keine_treffer'))}</div>`;
  }
}

function geoTrefferWahl(lat, lng, btn) {
  geoSetze(lat, lng, true);
  const box = document.getElementById('ev-geo-treffer');
  if (box) box.innerHTML = '';
  // Wenn das Ort-Feld leer ist: Kurzform des Treffer-Namens übernehmen (Komfort).
  const ortEl = document.getElementById('ev-ort');
  if (ortEl && !ortEl.value.trim() && btn && btn.dataset.name)
    ortEl.value = btn.dataset.name.split(',').slice(0, 2).join(', ').replace(/\s+/g, ' ').trim();
}

// Bezugsperson-Dropdown (Personen des aktiven Baums) füllen; Wert = personen.id (DB-UUID).
function bezugspersonOptionen(selUuid) {
  const sel = document.getElementById('ev-bezugsperson');
  if (!sel) return;
  const personen = Object.values(aktuelleDaten.persons || {})
    .filter(p => p && p._tree === aktuellerStammbaumId && !p.platzhalter && p._uuid)
    .map(p => ({ uuid: p._uuid, name: zsName(p) }))
    .sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' }));
  sel.innerHTML = `<option value="">${escapeHtml(t('ev_bezugsperson_keine'))}</option>` +
    personen.map(p => `<option value="${escapeHtml(p.uuid)}">${escapeHtml(p.name)}</option>`).join('');
  sel.value = (selUuid && personen.some(p => String(p.uuid) === String(selUuid))) ? selUuid : '';
}

// ---- Event anlegen/bearbeiten/löschen (pro Stammbaum) ----
function zeigeEventNeu() {
  if (!istAdmin() || !aktuellerStammbaumId) return;
  document.getElementById('ev-id').value = '';
  ['ev-titel','ev-ort','ev-beschreibung','ev-organisator'].forEach(id => document.getElementById(id).value = '');
  datumSetzen(document.getElementById('ev-datum'), '');   // Datumsfeld + iso zurücksetzen
  document.getElementById('ev-typ').value = '';
  document.getElementById('ev-media-input').value = '';
  document.getElementById('ev-media-liste').innerHTML = '';   // Medien erst nach dem Speichern (Event braucht eine id)
  document.getElementById('ev-media-status').textContent = '';
  document.getElementById('ev-fehler').style.display = 'none';
  document.getElementById('ev-erfolg').style.display = 'none';
  document.getElementById('event-modal-titel').textContent = t('event_neu');
  // Geokoordinaten + Bezugsperson zurücksetzen
  document.getElementById('ev-lat').value = '';
  document.getElementById('ev-lng').value = '';

  // Teilnehmer/Sichtbarkeit erst nach dem ersten Speichern (Event braucht eine id)

function zeigeEventBearbeiten(eventId) {
  if (!istAdmin()) return;
  const ev = (eventsCache || []).find(e => e.id === eventId);
  if (!ev) return;
  document.getElementById('ev-id').value          = ev.id;
  document.getElementById('ev-titel').value        = ev.titel || '';
  datumSetzen(document.getElementById('ev-datum'), ev.datum || '');
  document.getElementById('ev-ort').value          = ev.ort || '';
  document.getElementById('ev-typ').value          = ev.typ || '';
  document.getElementById('ev-organisator').value  = ev.organisator || '';
  document.getElementById('ev-beschreibung').value = ev.beschreibung || '';
  document.getElementById('ev-media-input').value = '';
  document.getElementById('ev-media-status').textContent = '';
  ladeEventMedienListe(ev.id);                      // vorhandene Medien (Storage) anzeigen + löschbar
  // Geokoordinaten + Bezugsperson vorbelegen
  const hatGeo = typeof ev.latitude === 'number' && typeof ev.longitude === 'number';
  document.getElementById('ev-lat').value = hatGeo ? ev.latitude : '';
  document.getElementById('ev-lng').value = hatGeo ? ev.longitude : '';
  bezugspersonOptionen(ev.bezugsperson_id || '');
  document.getElementById('ev-fehler').style.display = 'none';
  document.getElementById('ev-erfolg').style.display = 'none';
  document.getElementById('event-modal-titel').textContent = t('event_bearbeiten');
  // Teilnehmer/Sichtbarkeit verwalten (Event hat eine id)
  document.getElementById('ev-teilnehmer-section').style.display = '';
  document.getElementById('ev-teilnehmer-status').textContent = '';
  document.getElementById('event-modal').classList.add('aktiv');
  setTimeout(() => geoEditOeffnen(hatGeo ? ev.latitude : '', hatGeo ? ev.longitude : ''), 80);
}

// Medienliste eines Events (DB) in die Edit-Maske rendern — nutzt die geteilten
// Storage-Funktionen (renderEventMedia/buildEventMediaHtml), mit Löschen-Button.
async function ladeEventMedienListe(eventId) {
  const box = document.getElementById('ev-media-liste');
  if (!box) return;
  if (!eventId) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="event-media-empty">…</div>`;
  const media = await renderEventMedia(eventId);
  box.innerHTML = media.length
    ? buildEventMediaHtml(media, eventId, true, false)   // löschbar, aber nicht klickbar (z-index)
    : `<div class="event-media-empty">${t('event_no_media')}</div>`;
}

function schliesseEventModal() {

}

// ============================================================
// TEILNEHMERVERWALTUNG / EVENT-SICHTBARKEIT (Phase 1)
// Wer darf das Event sehen? Standard = alle (unbeschränkt). Serverseitig in
// supabase_event_eingeladene.sql geprüft (darf_event_sehen). Echten Zugriff
// haben nur Personen mit verknüpftem Konto; Personen ohne Konto sind wählbar,
// bleiben aber wirkungslos. Benachrichtigungen folgen in Phase 2.
// ============================================================
let etnKandidaten = [];          // [{user_id, email, vorname, nachname, rolle, eingeladen}]
let etnAuswahl    = new Set();   // user_id -> ausgewählt
let etnSucheTimer = null;
let etnLimit      = 150;         // Render-Obergrenze (Performance) + "Mehr laden"

async function oeffneEventTeilnehmer() {
  const eventId = document.getElementById('ev-id').value;
  if (!eventId || !istAdmin()) return;
  document.getElementById('etn-event-id').value = eventId;
  document.getElementById('etn-suche').value = '';
  document.getElementById('etn-fehler').style.display = 'none';
  document.getElementById('etn-erfolg').style.display = 'none';
  etnLimit = 150;
  etnKandidaten = [];
  etnAuswahl = new Set();
  document.getElementById('etn-liste').innerHTML =
    `<div class="etn-empty">${escapeHtml(t('etn_laedt'))}</div>`;
  document.getElementById('etn-mehr-wrap').innerHTML = '';
  document.getElementById('etn-status').textContent = '';
  etnBindeListe();
  document.getElementById('event-teilnehmer-modal').classList.add('aktiv');

  // Kandidaten (Verbund) + aktuellen Einlade-Stand laden
  const [{ data: kand, error: kErr }, { data: stand, error: sErr }] = await Promise.all([
    sbClient.rpc('event_teilnehmer_kandidaten', { p_event: eventId }),
    sbClient.rpc('event_eingeladene_daten',     { p_event: eventId })
  ]);
  if (kErr || sErr) {
    document.getElementById('etn-liste').innerHTML =
      `<div class="etn-empty">${escapeHtml(t('reg_fehler') + ((kErr||sErr).message))}</div>`;
    return;
  }
  etnKandidaten = (kand || []).map(p => ({
    user_id: p.user_id, email: p.email || '', vorname: p.vorname || '', nachname: p.nachname || '',
    rolle: p.rolle || '', eingeladen: !!p.eingeladen
  }));

  // Invite-basiert: vorausgewählt sind die bereits eingeladenen Konten
  // (bei einem neuen Event: keine -> der Admin muss mind. eine Person wählen).
  const ids = new Set(((stand && stand.user_ids) || []).map(String));
  etnKandidaten.forEach(p => { if (ids.has(String(p.user_id))) etnAuswahl.add(p.user_id); });
  renderEtnListe();
}

function schliesseEventTeilnehmer() {
  document.getElementById('event-teilnehmer-modal').classList.remove('aktiv');
}

function etnSucheDebounce() {
  clearTimeout(etnSucheTimer);
  etnSucheTimer = setTimeout(() => { etnLimit = 150; renderEtnListe(); }, 300);
}

// Diakritik-/schrift-insensitiver Filter (nutzt ssFold aus den suchbaren Dropdowns).
function etnGefiltert() {
  const f = ssFold((document.getElementById('etn-suche').value || '').trim());
  if (f.length < 1) return etnKandidaten;
  return etnKandidaten.filter(p => ssFold(p.vorname + ' ' + p.nachname + ' ' + p.email).includes(f));
}

function renderEtnListe() {
  const liste = document.getElementById('etn-liste');
  const gefiltert = etnGefiltert();
  const total = etnKandidaten.length;
  const sel   = etnAuswahl.size;

  // Statuszeile: X von Y; bei "alle" der Hinweis, dass jeder sieht.
  const statusEl = document.getElementById('etn-status');
  statusEl.textContent = t('etn_status', { sel, total });

  if (gefiltert.length === 0) {
    liste.innerHTML = `<div class="etn-empty">${escapeHtml(t('etn_kein_treffer'))}</div>`;
    document.getElementById('etn-mehr-wrap').innerHTML = '';
    return;
  }

  const sichtbar = gefiltert.slice(0, etnLimit);
  liste.innerHTML = sichtbar.map(p => {
    const an = etnAuswahl.has(p.user_id);
    const voll = (p.vorname + ' ' + p.nachname).trim();
    const name = escapeHtml(voll ? nm(voll) : (p.email || '?'));
    const meta = voll ? escapeHtml(p.email || '') : '';   // E-Mail als Zweitzeile, wenn ein Name da ist
    const badge = p.rolle ? `<span class="etn-konto-badge">${escapeHtml(t('rolle_' + p.rolle))}</span>` : '';
    return `<div class="etn-row${an ? ' etn-an' : ''}" data-id="${escapeHtml(String(p.user_id))}">
      <span class="etn-check">${an ? '✓' : ''}</span>
      <span class="etn-info"><span class="etn-name">${name}</span>${meta ? `<div class="etn-meta">${meta}</div>` : ''}</span>
      ${badge}
    </div>`;
  }).join('');

  // "Mehr laden", falls die gefilterte Liste die Obergrenze übersteigt (Performance).
  const mehrWrap = document.getElementById('etn-mehr-wrap');
  if (gefiltert.length > etnLimit) {
    mehrWrap.innerHTML =
      `<button type="button" class="etn-mehr-btn" onclick="etnMehrLaden()">${escapeHtml(t('etn_mehr'))} (${gefiltert.length - etnLimit})</button>`;
  } else {
    mehrWrap.innerHTML = '';
  }
}

function etnMehrLaden() { etnLimit += 300; renderEtnListe(); }

// Touch-sichere Auswahl: Tap auf eine Zeile schaltet die Auswahl um (Wischen
// scrollt). tippAuswahl feuert auf pointerup -> vor Ghost-Click/Reflow. Einmalig
// per Delegation an den Container gebunden (überlebt innerHTML-Neuaufbau der Zeilen).
let etnListeGebunden = false;
function etnBindeListe() {
  if (etnListeGebunden) return;
  const container = document.getElementById('etn-liste');
  if (!container) return;
  tippAuswahl(container, '.etn-row', row => {
    const id = row.dataset.id; if (!id) return;
    if (etnAuswahl.has(id)) etnAuswahl.delete(id); else etnAuswahl.add(id);
    renderEtnListe();
  });
  etnListeGebunden = true;
}

function etnAlleWaehlen(an) {
  etnAuswahl = new Set(an ? etnKandidaten.map(p => p.user_id) : []);
  renderEtnListe();
}

function etnInvertieren() {
  const neu = new Set();
  etnKandidaten.forEach(p => { if (!etnAuswahl.has(p.user_id)) neu.add(p.user_id); });
  etnAuswahl = neu;
  renderEtnListe();
}

async function speichereEventTeilnehmer() {
  const eventId = document.getElementById('etn-event-id').value;
  if (!eventId || !istAdmin()) return;
  const fehlerEl = document.getElementById('etn-fehler');
  const erfolgEl = document.getElementById('etn-erfolg');
  const button   = document.getElementById('etn-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';

  // Einladungsbasiert: die Auswahl IST die Einladungsliste -> mindestens eine Person.
  const total = etnKandidaten.length;
  const ids = [...etnAuswahl];
  if (ids.length === 0) { fehlerEl.textContent = t('etn_min_eine'); fehlerEl.style.display = 'block'; return; }

  const alt = button.textContent; button.disabled = true; button.textContent = t('reg_senden_laeuft');
  const { data, error } = await sbClient.rpc('event_eingeladene_setzen', {
    p_event: eventId, p_eingeschraenkt: true, p_user_ids: ids
  });
  if (error) { button.disabled = false; button.textContent = alt; fehlerEl.textContent = t('reg_fehler') + error.message; fehlerEl.style.display = 'block'; return; }

  // Phase 2: NUR neu hinzugefügte Personen benachrichtigen (Delta = data.neu).
  // event_einladung_benachrichtige legt In-App-Benachrichtigungen an und liefert die
  // E-Mail-Empfänger (nur Personen mit verknüpftem Konto, ohne mich selbst).
  const neu = (data && data.neu) || [];
  if (Array.isArray(neu) && neu.length) {
    button.textContent = t('etn_benachrichtige');
    try {
      const { data: bn } = await sbClient.rpc('event_einladung_benachrichtige', { p_event: eventId, p_user_ids: neu });
      const empf = (bn && bn.empfaenger) || [];
      if (empf.length) {
        // E-Mail-Versand best-effort über die Edge Function (blockiert Speichern nicht).
        sbClient.functions.invoke('event-einladung-senden', { body: { event_id: eventId, empfaenger: empf } })
          .catch(e => console.warn('Einladungs-Mail:', e));
      }
    } catch (e) { console.warn('Benachrichtigung:', e); }
  }

  button.disabled = false; button.textContent = alt;

  // Kurzstatus im Event-Modal spiegeln
  const evStatus = document.getElementById('ev-teilnehmer-status');
  if (evStatus) evStatus.textContent = t('etn_status', { sel: ids.length, total });

  erfolgEl.textContent = t('etn_gespeichert'); erfolgEl.style.display = 'block';
  await zeigeShorts();   // Sichtbarkeit kann sich geändert haben -> Liste aktualisieren
  setTimeout(() => schliesseEventTeilnehmer(), 800);
}

// ============================================================
// BENACHRICHTIGUNGEN (Phase 2) — In-App-Liste im Profil + Ungelesen-Indikator
// Eigene Zeilen via RLS (auth.uid()=user_id). Erzeugt werden sie serverseitig
// (event_einladung_benachrichtige). Direktlink öffnet das zugehörige Event.
// ============================================================
let meineBenachrichtigungen = [];

async function ladeBenachrichtigungen() {
  if (!aktuellerUser || !sbClient) { meineBenachrichtigungen = []; aktualisiereBenachrBadge(); return; }
  const { data, error } = await sbClient
    .from('benachrichtigungen')
    .select('id, typ, titel, text, event_id, ref_person, gelesen, created_at')

async function benachrOeffne(el) {
  const id = el.dataset.id;
  const eventId = el.dataset.event;
  // Als gelesen markieren (eigene Zeile, RLS)
  const b = meineBenachrichtigungen.find(x => String(x.id) === String(id));
  if (b && !b.gelesen) {
    b.gelesen = true;
    aktualisiereBenachrBadge();
    el.classList.remove('ungelesen'); el.classList.add('gelesen');
    sbClient.from('benachrichtigungen').update({ gelesen: true }).eq('id', id)
      .then(({ error }) => { if (error) console.warn('gelesen:', error); });
  }
  // Direktlink: Event öffnen. Events werden PRO Stammbaum geladen -> erst zum Baum
  // des Events wechseln (falls nötig), dessen Events laden, dann Detail öffnen.
  if (eventId) {
    schliesseProfil();
    let treeId = null;
    try {
      const r = await sbClient.rpc('event_ziel_baum', { p_event: eventId });
      treeId = r && r.data ? r.data : null;   // null = kein Zugriff / Event weg
    } catch (e) { console.warn('event_ziel_baum:', e); }
    if (treeId && String(treeId) !== String(aktuellerStammbaumId) && typeof waehleStammbaum === 'function') {
      waehleStammbaum(treeId);   // Baum wechseln (setzt aktuellerStammbaumId + Dropdown)
    }
    wechselAnsicht('shorts');
    if (typeof zeigeShorts === 'function') await zeigeShorts();   // Events des Zielbaums laden
    const da = (eventsCache || []).some(e => String(e.id) === String(eventId));
    if (da && typeof zeigeEventDetail === 'function') zeigeEventDetail(eventId);
    else if (typeof zeigeHinweis === 'function') zeigeHinweis(t('benachr_event_weg'));
    return;
  }
  // Anlass-Erinnerung (Stufe B): best-effort die Personenkarte öffnen, falls die
  // referenzierte Person im aktuell geladenen Modell liegt (über die DB-UUID -> _uuid).
  const refPerson = el.dataset.person;
  if (refPerson && aktuelleDaten && aktuelleDaten.persons) {
    const treffer = Object.values(aktuelleDaten.persons).find(p => p && String(p._uuid) === String(refPerson));
    if (treffer) { schliesseProfil();
      if (document.getElementById('obav-modal')?.classList.contains('aktiv')) schliesseObavModal();
      if (typeof zeigeDetails === 'function') zeigeDetails(treffer.id);
    }
  }
}

// ============================================================
// ANSTEHENDE ANLÄSSE — Geburtstage & Gedenktage (Stufe A, rein clientseitig)
// Wertet birth_date/death_date der Personen des AKTIVEN Baums (aktuelleDaten) aus
// und zeigt Anlässe der nächsten 30 Tage. KEIN Backend: neu berechnet bei
// Baumwechsel/Reload/Sprachwechsel. Klick öffnet die Personenkarte. Fügt sich ins
// Benachrichtigungs-Muster ein (gleiche .benachr-liste-Optik): eigener Widget-Button
// im Baum + Sektion im zentralen Obavještenja-Modal. Stufe B (E-Mail via pg_cron +
// Edge Function) ist separat skizziert (supabase_benachrichtigungen_anlaesse.sql).
// ============================================================
const ANL_FENSTER_TAGE = 30;
let anlaesseCache = [];

// Nächstes Vorkommen von Monat+Tag eines ISO-Datums ab heute, falls <= Fenster.
// Liefert { tage, jahre } oder null (Freitext/ungefähre Altwerte werden übersprungen,
// da Monat/Tag fehlen). 29.02. rollt in Nicht-Schaltjahren automatisch auf den 01.03.
function naechsterJahrestag(value, heute, fenster) {
  const iso = istIsoDatum(value) ? value : parseDatumZuIso(value);
  if (!iso) return null;
  const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return null;
  const jahr0 = +m[1], monat = +m[2], tag = +m[3];
  let ziel = new Date(heute.getFullYear(), monat - 1, tag); ziel.setHours(0, 0, 0, 0);
  if (ziel < heute) ziel = new Date(heute.getFullYear() + 1, monat - 1, tag);
  const tage = Math.round((ziel - heute) / 86400000);
  if (tage < 0 || tage > fenster) return null;
  return { tage, jahre: ziel.getFullYear() - jahr0 };
}

// Anlässe des aktiven Baums: lebende Personen -> Geburtstag, verstorbene -> Gedenktag
// (Todestag). Über Spiegelkarten (identitaet_id) und Platzhalter-Eltern entdoppelt/gefiltert.
function berechneAnlaesse() {
  const out = [];
  const persons = (aktuelleDaten && aktuelleDaten.persons) || null;
  if (!persons) return out;
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const seen = new Set();
  Object.values(persons).forEach(p => {
    if (!p || p.platzhalter) return;
    const grp = p._ident ? 'grp:' + p._ident : 'id:' + p.id;
    const name = p.name || ((p.given || '') + ' ' + (p.surname || '')).trim();
    const verstorben = !!(p.deceased || p.death_date);
    if (!verstorben) {
      const r = naechsterJahrestag(p.birth_date, heute, ANL_FENSTER_TAGE);
      if (r && !seen.has(grp + '|gb')) { seen.add(grp + '|gb');
        out.push({ personId: p.id, typ: 'geburtstag', tage: r.tage, zahl: r.jahre, name }); }
    } else {
      const r = naechsterJahrestag(p.death_date, heute, ANL_FENSTER_TAGE);
      if (r && !seen.has(grp + '|gt')) { seen.add(grp + '|gt');
        out.push({ personId: p.id, typ: 'gedenktag', tage: r.tage, zahl: r.jahre, name }); }
    }
  });
  out.sort((a, b) => a.tage - b.tage);
  return out;
}

// ============================================================
// LOSE KARTEN — Personen des aktiven Baums, die im Diagramm NICHT erreichbar sind
// (gar keine Beziehung ODER falsch verknüpfte „Insel"). Der Single-Root-Renderer
// (baueBaumDaten) zeichnet nur die zusammenhängende Kanten-Komponente der Wurzel; solche
// Personen sind sonst unsichtbar (Vorfall Tadić/Jovanović). Diese Leiste macht sie unten
// am Baum sichtbar, bis ein Admin sie verknüpft. REIN render-/speicherseitig (kein Backend);
// spiegelt die ungerichtete Komponenten-Logik von baum_integritaet_pruefen
// (supabase_baum_integritaet.sql). Nur für Admins (nur sie können verbinden) + aktiver Baum.
// Setzt den Inaktivitäts-Timer NICHT zurück (rein lesend).
// ============================================================
let loseCache = [];
function berechneLoseKarten() {
  if (!aktuellerUser || !aktuellerStammbaumId || !istAdmin()) return [];
  const treeId  = aktuellerStammbaumId;
  const persons = aktuelleDaten.persons || {};

  // 1) Identitätsgruppen (gleiche reale Person über Bäume, identitaet_id)
  const identGruppen = {};
  Object.values(persons).forEach(p => {
    if (p && p._ident) (identGruppen[p._ident] = identGruppen[p._ident] || []).push(p.id);
  });
  // 2) Repräsentant einer BELIEBIGEN Karte IM aktiven Baum (sich selbst, falls im Baum;
  //    sonst ein identitaet_id-Zwilling im Baum) -> baumübergreifende Kanten zählen als Brücke.
  const rep = (ext) => {
    const p = persons[ext];
    if (!p) return null;
    if (p._tree === treeId) return ext;
    if (p._ident) {
      const twin = (identGruppen[p._ident] || []).find(t => persons[t] && persons[t]._tree === treeId);
      if (twin) return twin;
    }
    return null;
  };
  // 3) In-Tree-Personen + ungerichtete Nachbarschaft (Partner + Eltern↔Kind) auf Repräsentanten
  const intree = Object.values(persons).filter(p => p._tree === treeId).map(p => p.id);
  if (!intree.length) return [];
  const adj = {};
  intree.forEach(id => { adj[id] = new Set(); });
  const verbinde = (a, b) => {
    const ra = rep(a), rb = rep(b);
    if (!ra || !rb || ra === rb) return;
    (adj[ra] = adj[ra] || new Set()).add(rb);
    (adj[rb] = adj[rb] || new Set()).add(ra);
  };
  Object.values(aktuelleDaten.families || {}).forEach(fam => {
    if (fam.husband && fam.wife) verbinde(fam.husband, fam.wife);
    (fam.children || []).forEach(cid => {
      if (fam.husband) verbinde(fam.husband, cid);
      if (fam.wife)    verbinde(fam.wife, cid);
    });
  });
  // 4) Zusammenhangskomponenten; Haupt-Komponente = die der Render-Wurzel (Fallback: größte)
  const compOf = {}; const groesse = {}; let compN = 0;
  intree.forEach(seed => {
    if (compOf[seed] != null) return;
    const c = compN++; let g = 0; const stack = [seed]; compOf[seed] = c;
    while (stack.length) {
      const x = stack.pop(); g++;
      (adj[x] || []).forEach(y => { if (compOf[y] == null) { compOf[y] = c; stack.push(y); } });
    }
    groesse[c] = g;
  });
  const wurzel    = (typeof aktuelleWurzel === 'function') ? aktuelleWurzel() : null;
  const wurzelRep = wurzel ? rep(wurzel) : null;
  let mainComp = (wurzelRep != null && compOf[wurzelRep] != null) ? compOf[wurzelRep] : null;
  if (mainComp == null) {           // keine Wurzel im Baum -> größte Komponente gilt als Hauptbaum
    let best = -1;
    Object.keys(groesse).forEach(c => { if (groesse[c] > best) { best = groesse[c]; mainComp = +c; } });
  }
  // 5) Alles außerhalb der Haupt-Komponente = lose/Insel; Platzhalter („Unbekannt") nicht zeigen
  const lose = [];
  intree.forEach(id => {
    if (compOf[id] === mainComp) return;
    const p = persons[id];
    if (!p || p.platzhalter) return;
    lose.push(p);
  });
  lose.sort((a, b) => nm(a.name || a.given || '').localeCompare(nm(b.name || b.given || '')));
  return lose;
}

// Leiste neu berechnen + zeigen/verstecken (Muster aktualisiereAnlaesse). Chips von links
// nach rechts; wird eine Person verknüpft, fällt sie beim nächsten Reload aus der Liste und
// die übrigen rutschen automatisch nach links (Flex-Reflow).
function aktualisiereLoseKarten() {
  loseCache = berechneLoseKarten();
  const leiste    = document.getElementById('lose-leiste');
  const track     = document.getElementById('lose-track');
  const container = document.getElementById('baum-container');
  const sichtbar  = loseCache.length > 0;
  if (leiste)    leiste.style.display = sichtbar ? '' : 'none';
  if (container) container.classList.toggle('lose-aktiv', sichtbar);
  if (!track) return;
  if (!sichtbar) { track.innerHTML = ''; return; }
  track.innerHTML = loseCache.map(p => {
    const initialen = nm((((p.given || '')[0] || '') + ((p.surname || '')[0] || '')).toUpperCase()) || '?';
    const klasse    = p.sex === 'M' ? 'male' : (p.sex === 'F' ? 'female' : 'unknown');
    const fotoUrl   = p.foto || p.avatar || p.bild || '';
    const img       = fotoUrl ? `<img src="${escapeHtml(fotoUrl)}" alt="" loading="lazy" onerror="this.remove()">` : '';
    const name      = (nm(p.given || '') + ' ' + nm(p.surname || '')).trim() || nm(p.name || '?');
    return `<button type="button" class="lose-chip" onclick="loseOeffne('${escapeHtml(p.id)}')" title="${escapeHtml(name)}">
        <span class="lose-avatar ${klasse}">${escapeHtml(initialen)}${img}</span>
        <span class="lose-name">${escapeHtml(name)}</span>
      </button>`;
  }).join('');
}

// ---- Erinnerungs-Einstellungen (Stufe B: E-Mail-Schalter je Familie) ---------
// UI im Profil-Overlay (ein globaler Schalter pro Anlass-Typ). Die Tabelle ist je
// (familie_id, user_id) -> wir spiegeln die Wahl auf ALLE Familien-Mitgliedschaften
// des Nutzers (Upsert je familie_id). RLS erlaubt nur die EIGENEN Zeilen.
async function ladeAnlassEinstellungen() {
  const gebEl = document.getElementById('anl-pref-geb');
  const gedEl = document.getElementById('anl-pref-ged');
  if (!gebEl || !gedEl || !sbClient || !aktuellerUser) return;
  const vorEl = document.getElementById('anl-pref-vorlauf');
  // Default: beides an + 3 Tage Vorlauf (entspricht DB-Default), bis Zeilen geladen sind.
  gebEl.checked = true; gedEl.checked = true; if (vorEl) vorEl.value = '3';
  try {
    const { data, error } = await sbClient
      .from('benachrichtigungs_einstellungen')
      .select('email_geburtstage, email_gedenktage, vorlauf_tage')
      .eq('user_id', aktuellerUser.id);
    if (error) { console.warn('Erinnerungs-Einstellungen laden:', error); return; }
    if (data && data.length) {
      // „An", wenn IRGENDEINE Familien-Zeile aktiviert ist (global-tolerant).
      gebEl.checked = data.some(r => r.email_geburtstage);
      gedEl.checked = data.some(r => r.email_gedenktage);
      // Vorlauf: kleinster gesetzter Wert (frühestmögliche Erinnerung gewinnt).
      if (vorEl) { const vs = data.map(r => r.vorlauf_tage).filter(v => v != null);
        if (vs.length) vorEl.value = String(Math.min(...vs)); }
    }
  } catch (e) { console.warn('Erinnerungs-Einstellungen:', e); }
}

async function speichereAnlassEinstellungen() {
  const gebEl = document.getElementById('anl-pref-geb');
  const gedEl = document.getElementById('anl-pref-ged');
  const erfolg = document.getElementById('anl-pref-erfolg');
  const btn = document.getElementById('anl-pref-save');
  if (!gebEl || !gedEl || !sbClient || !aktuellerUser) return;
  const familien = Object.keys(meineRollenProFamilie || {});
  if (!familien.length) { if (erfolg) { erfolg.textContent = t('anl_pref_keine_familie'); erfolg.style.display = 'block'; } return; }
  const vorEl = document.getElementById('anl-pref-vorlauf');
  let vorlauf = vorEl ? parseInt(vorEl.value, 10) : 3;
  if (!Number.isFinite(vorlauf)) vorlauf = 3;
  vorlauf = Math.max(0, Math.min(30, vorlauf));   // auf 0..30 begrenzen (DB-CHECK)
  if (vorEl) vorEl.value = String(vorlauf);
  const rows = familien.map(fid => ({
    familie_id: fid, user_id: aktuellerUser.id,
    email_geburtstage: gebEl.checked, email_gedenktage: gedEl.checked, vorlauf_tage: vorlauf
  }));
  const alt = btn ? btn.textContent : ''; if (btn) { btn.disabled = true; btn.textContent = t('reg_senden_laeuft'); }
  const { error } = await sbClient
    .from('benachrichtigungs_einstellungen')
    .upsert(rows, { onConflict: 'familie_id,user_id' });
  if (btn) { btn.disabled = false; btn.textContent = alt || t('anl_pref_speichern'); }
  if (error) { console.warn('Erinnerungs-Einstellungen speichern:', error);
    if (erfolg) { erfolg.textContent = t('reg_fehler') + error.message; erfolg.style.display = 'block'; } return; }
  if (erfolg) { erfolg.textContent = t('anl_pref_gespeichert'); erfolg.style.display = 'block';
    setTimeout(() => { erfolg.style.display = 'none'; }, 2500); }
}

async function speichereEvent() {
  if (!istAdmin() || !aktuellerStammbaumId) return;
  const v = id => document.getElementById(id).value.trim();
  const fehlerEl = document.getElementById('ev-fehler');
  const erfolgEl = document.getElementById('ev-erfolg');
  const button   = document.getElementById('ev-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';
  feldFehlerReset('event-modal');
  const titel = v('ev-titel');
  if (!titel) return feldFehler('ev-titel', t('feld_pflicht'));

  const id = document.getElementById('ev-id').value || null;
  // Geokoordinaten (optional) + Bezugsperson (optional, DB-UUID) auslesen
  const latRaw = document.getElementById('ev-lat').value;
  const lngRaw = document.getElementById('ev-lng').value;
  const pLat = (latRaw !== '' && !isNaN(+latRaw)) ? +latRaw : null;
  const pLng = (lngRaw !== '' && !isNaN(+lngRaw)) ? +lngRaw : null;
  const pBezug = document.getElementById('ev-bezugsperson').value || null;
  const alt = button.textContent; button.disabled = true; button.textContent = t('reg_senden_laeuft');
  const { data: gespeicherteId, error } = await sbClient.rpc('event_speichern', {
    p_id: id, p_tree: aktuellerStammbaumId, p_titel: titel,
    p_beschreibung: v('ev-beschreibung') || null, p_datum: datumWert(document.getElementById('ev-datum')) || null,
    p_ort: v('ev-ort') || null, p_typ: document.getElementById('ev-typ').value || null,
    p_sprache: aktuelleSprache, p_organisator: v('ev-organisator') || null,
    p_latitude: pLat, p_longitude: pLng, p_bezugsperson: pBezug
  });
  if (error) {
    button.disabled = false; button.textContent = alt;
    fehlerEl.textContent = t('reg_fehler') + error.message; fehlerEl.style.display = 'block'; return;
  }

  // Nach dem Speichern existiert eine id -> Teilnehmer/Sichtbarkeit verfügbar machen.
  if (gespeicherteId) {
    document.getElementById('ev-id').value = gespeicherteId;
    document.getElementById('ev-teilnehmer-section').style.display = '';
  }

  // Ausgewählte Medien in den geteilten Storage hochladen (Event-id = Ordner)
  const eventIdFuerMedien = id || gespeicherteId;
  const input = document.getElementById('ev-media-input');
  if (eventIdFuerMedien && input && input.files && input.files.length) {
    const statusEl = document.getElementById('ev-media-status');
    statusEl.textContent = t('event_uploading');
    let medienFehler = null;
    for (const file of [...input.files]) {
      const res = await uploadEventMedia(eventIdFuerMedien, file);
      if (res && res.error) { medienFehler = res.error; break; }
    }
    input.value = '';
    statusEl.textContent = medienFehler ? (t('event_uploading') + ' ' + medienFehler) : '';
    if (!medienFehler) await ladeEventMedienListe(eventIdFuerMedien);
  }

  button.disabled = false; button.textContent = alt;
  erfolgEl.textContent = t('event_gespeichert'); erfolgEl.style.display = 'block';
  await zeigeShorts();                       // Liste sofort aktualisieren
  // Neues Event: Einladung ist Pflicht (mind. 1 Person) -> Schritt direkt öffnen.
  if (!id && gespeicherteId) {
    schliesseEventModal();
    oeffneEventTeilnehmer();
  } else {
    setTimeout(() => schliesseEventModal(), 900);
  }
}

// KOSTENÜBERSICHT / TROŠKOVI DOGAĐAJA (pro Event)
// Teilnehmer + Ausgaben in DB (event_teilnehmer/event_kosten via RPCs).
// Berechnung pro Währung GETRENNT, Cent-genau (Restcent verteilt -> Summe 0).
// "Bezahlt pro Person" = Summe der Ausgaben, die diese Person bezahlt hat.
// ============================================================
let kostenEventId = null;
let kostenDaten = { teilnehmer: [], kosten: [] };
let kostenEditId = null;

async function ladeKostenDaten() {

  if (error) { kostenDaten = { teilnehmer: [], kosten: [] }; console.warn('Kostendaten:', error); return; }

function formatGeld(cents, waehrung) {
  return (cents / 100).toFixed(2) + ' ' + (waehrung || 'EUR');
}

// Berechnung je Währung: Gesamt, Anteil/Person (Cent-genau verteilt), Salden, Ausgleich.
function berechneKosten() {
  const tn = kostenDaten.teilnehmer, ks = kostenDaten.kosten;
  const n = tn.length;
  const waehrungen = {};
  ks.forEach(k => {
    const w = k.waehrung || 'EUR';
    if (!waehrungen[w]) waehrungen[w] = { total: 0, paid: {} };
    const cents = Math.round((Number(k.betrag) || 0) * 100);
    waehrungen[w].total += cents;
    if (k.payer_id) waehrungen[w].paid[k.payer_id] = (waehrungen[w].paid[k.payer_id] || 0) + cents;
  });
  const ergebnis = [];
  Object.keys(waehrungen).sort().forEach(w => {
    const total = waehrungen[w].total, paid = waehrungen[w].paid;
    const base = n > 0 ? Math.floor(total / n) : 0;
    const rem  = n > 0 ? total - base * n : 0;   // Restcent gleichmäßig verteilen -> exakte 0-Summe
    const salden = tn.map((tp, i) => {
      const anteil  = base + (i < rem ? 1 : 0);
      const bezahlt = paid[tp.id] || 0;
      return { id: tp.id, name: tp.name, bezahlt, anteil, saldo: bezahlt - anteil };
    });
    ergebnis.push({ waehrung: w, total, proPerson: base, salden, ausgleich: berechneAusgleich(salden) });
  });
  return ergebnis;
}

// Greedy-Ausgleich (minimiert Überweisungen), arbeitet in Cent.
function berechneAusgleich(salden) {
  const glaeubiger = salden.filter(s => s.saldo > 0).map(s => ({ name: s.name, rest: s.saldo })).sort((a, b) => b.rest - a.rest);
  const schuldner  = salden.filter(s => s.saldo < 0).map(s => ({ name: s.name, rest: -s.saldo })).sort((a, b) => b.rest - a.rest);
  const transfers = [];
  let i = 0, j = 0;
  while (i < schuldner.length && j < glaeubiger.length) {
    const betrag = Math.min(schuldner[i].rest, glaeubiger[j].rest);
    if (betrag > 0) transfers.push({ von: schuldner[i].name, an: glaeubiger[j].name, betrag });
    schuldner[i].rest -= betrag; glaeubiger[j].rest -= betrag;
    if (schuldner[i].rest === 0) i++;
    if (glaeubiger[j].rest === 0) j++;
  }
  return transfers;
}

// Kostenübersicht als echtes PDF erzeugen (statt window.print – auf Mobil unzuverlässig:
// iOS/Android drucken die Bildschirm-GUI statt die @media-print-Ansicht).
// Glyph-treu (Diakritika č/ć/đ/ž/š + Kyrillisch) über den projektüblichen Weg:
// eigenes Inline-SVG -> Raster (Canvas) -> jsPDF (kein Core-Font-Limit), seitenweise A4.
// Fällt nur zurück auf window.print, wenn jsPDF fehlt.
let kostenPdfLaeuft = false;
async function druckeKosten() {
  if (kostenPdfLaeuft) return;
  const Ctor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : (window.jsPDF || null);
  if (!Ctor) {                       // Fallback: alter Druckweg
    document.body.classList.add('print-kosten');
    const auf = () => { document.body.classList.remove('print-kosten'); window.removeEventListener('afterprint', auf); };
    window.addEventListener('afterprint', auf); setTimeout(auf, 2000);
    window.print(); return;
  }
  kostenPdfLaeuft = true;
  const btn = document.querySelector('[onclick="druckeKosten()"]');
  const btnAlt = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    await kostenPdfErzeugen();
  } catch (e) {
    console.warn('Kosten-PDF:', e);
    await zeigeHinweis(t('reg_fehler') + (e && e.message ? e.message : e));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = btnAlt; }
    kostenPdfLaeuft = false;
  }
}

async function kostenPdfErzeugen() {
  const ev = (eventsCache || []).find(e => e.id === kostenEventId);
  const titel = ev ? (ev.titel || '') : '';
  const tn = kostenDaten.teilnehmer, ks = kostenDaten.kosten;
  const tnName = id => { const x = tn.find(p => p.id === id); return x ? nm(x.name) : '—'; };

  // --- SVG-Layout (logische px) ---
  const W = 760, P = 40, innerW = W - 2 * P;
  const FAM = "Georgia, 'Times New Roman', serif";
  const mess = document.createElement('canvas').getContext('2d');
  const fontStr = (size, weight) => `${weight === 'bold' ? 'bold ' : ''}${size}px ${FAM}`;
  const breite = (s, size, weight) => { mess.font = fontStr(size, weight); return mess.measureText(String(s)).width; };
  const umbrich = (s, maxW, size, weight) => {
    const woerter = String(s == null ? '' : s).split(/\s+/).filter(Boolean);
    const lines = []; let cur = '';
    woerter.forEach(w => {
      const test = cur ? cur + ' ' + w : w;
      if (breite(test, size, weight) <= maxW) { cur = test; return; }
      if (cur) { lines.push(cur); cur = ''; }
      if (breite(w, size, weight) <= maxW) { cur = w; return; }
      let chunk = '';                                   // einzelnes überlanges Wort hart brechen
      for (const ch of w) { if (breite(chunk + ch, size, weight) <= maxW) chunk += ch; else { lines.push(chunk); chunk = ch; } }
      cur = chunk;
    });
    if (cur) lines.push(cur);
    return lines.length ? lines : [''];
  };

  // SVG-Knoten direkt erzeugen (pdfEl + textContent) -> kein XML-Escaping-Risiko, wie der Baum-Export.
  const svg = document.createElementNS(PDF_SVG_NS, 'svg');
  svg.setAttribute('xmlns', PDF_SVG_NS);
  let y = 0;
  const rect = (x, yy, w, h, fill) => pdfEl('rect', { x, y: yy, width: w, height: h, fill }, svg);
  const line = (x1, x2, yy, col) => pdfEl('line', { x1, y1: yy, x2, y2: yy, stroke: col || '#9c7c3c', 'stroke-width': 1 }, svg);
  const text = (x, yy, s, o = {}) => {
    const e = pdfEl('text', { x, y: yy, 'font-family': FAM, 'font-size': o.size || 13, 'font-weight': o.weight || 'normal', fill: o.color || '#2a2a2a', 'text-anchor': o.anchor || 'start' }, svg);
    e.textContent = String(s == null ? '' : s);
  };
  const sektion = label => {
    y += 18;
    text(P, y + 14, label, { size: 15, weight: 'bold', color: '#722f37' });
    y += 22; line(P, W - P, y, '#9c7c3c'); y += 16;
  };

  // Hintergrund (volle Höhe wird unten nachgetragen, sobald y feststeht)
  const bg = pdfEl('rect', { x: 0, y: 0, width: W, height: 0, fill: '#ffffff' }, svg);
  svg.insertBefore(bg, svg.firstChild);

  // Kopf (akzentrot)
  const titelZeilen = umbrich(titel || t('kosten_titel'), innerW, 20, 'bold').slice(0, 2);
  const kopfH = 34 + titelZeilen.length * 26;
  rect(0, 0, W, kopfH, '#722f37');
  let ty = 30;
  titelZeilen.forEach(z => { text(P, ty, z, { size: 20, weight: 'bold', color: '#ffffff' }); ty += 26; });
  text(P, ty, t('kosten_titel'), { size: 12, color: '#f0d9b5' });
  y = kopfH + 8;

  // Teilnehmer
  sektion(`${t('kosten_teilnehmer')} (${tn.length})`);
  const namen = tn.length ? tn.map(p => nm(p.name)).join(' · ') : t('kosten_keine_teilnehmer');
  umbrich(namen, innerW, 13, 'normal').forEach(z => { text(P, y + 12, z, { size: 13 }); y += 19; });

  // Ausgaben
  sektion(`${t('kosten_ausgaben')} (${ks.length})`);
  const cBez = P, wBez = innerW * 0.50;
  const cBetrag = P + innerW * 0.70;      // rechtsbündig
  const cPayer = P + innerW * 0.72, wPayer = innerW * 0.28;
  if (ks.length) {
    text(cBez, y + 12, t('kosten_bezeichnung'), { size: 12, weight: 'bold', color: '#722f37' });
    text(cBetrag, y + 12, t('kosten_betrag'), { size: 12, weight: 'bold', color: '#722f37', anchor: 'end' });
    text(cPayer, y + 12, t('kosten_bezahlt_von'), { size: 12, weight: 'bold', color: '#722f37' });
    y += 18; line(P, W - P, y, '#d8c9a0'); y += 6;
    ks.forEach(k => {
      const bezZ = umbrich(k.bezeichnung, wBez, 13, 'normal');
      const payZ = umbrich(k.payer_id ? tnName(k.payer_id) : '—', wPayer, 13, 'normal');
      const zeilen = Math.max(bezZ.length, payZ.length);
      const startY = y;
      bezZ.forEach((z, i) => text(cBez, startY + 12 + i * 17, z, { size: 13 }));
      payZ.forEach((z, i) => text(cPayer, startY + 12 + i * 17, z, { size: 13 }));
      text(cBetrag, startY + 12, formatGeld(Math.round((Number(k.betrag) || 0) * 100), k.waehrung), { size: 13, anchor: 'end' });
      y = startY + zeilen * 17;
      if (k.beschreibung) { umbrich(k.beschreibung, wBez, 11, 'normal').forEach(z => { text(cBez, y + 11, z, { size: 11, color: '#8a7a5a' }); y += 15; }); }
      y += 6; line(P, W - P, y, '#eee4cf'); y += 6;
    });
  } else {
    text(P, y + 12, t('kosten_keine_ausgaben'), { size: 13, color: '#8a7a5a' }); y += 22;
  }

  // Zusammenfassung
  sektion(t('kosten_zusammenfassung'));
  const summe = berechneKosten();
  if (!summe.length || tn.length === 0) {
    text(P, y + 12, tn.length === 0 ? t('kosten_keine_teilnehmer') : t('kosten_keine_ausgaben'), { size: 13, color: '#8a7a5a' }); y += 22;
  } else {
    summe.forEach(blk => {
      text(P, y + 13, t('kosten_summe'), { size: 14, weight: 'bold' });
      text(W - P, y + 13, formatGeld(blk.total, blk.waehrung), { size: 14, weight: 'bold', anchor: 'end' }); y += 22;
      text(P, y + 12, t('kosten_pro_person'), { size: 13 });
      text(W - P, y + 12, formatGeld(blk.proPerson, blk.waehrung), { size: 13, anchor: 'end' }); y += 22;
      // Salden-Tabelle
      const sP = P, sR1 = P + innerW * 0.55, sR2 = P + innerW * 0.76, sR3 = W - P;
      text(sP, y + 12, t('kosten_person'), { size: 12, weight: 'bold', color: '#722f37' });
      text(sR1, y + 12, t('kosten_bezahlt'), { size: 12, weight: 'bold', color: '#722f37', anchor: 'end' });
      text(sR2, y + 12, t('kosten_anteil'), { size: 12, weight: 'bold', color: '#722f37', anchor: 'end' });
      text(sR3, y + 12, t('kosten_saldo'), { size: 12, weight: 'bold', color: '#722f37', anchor: 'end' });
      y += 18; line(P, W - P, y, '#d8c9a0'); y += 4;
      blk.salden.forEach(s => {
        const col = s.saldo > 0 ? '#2e7d32' : (s.saldo < 0 ? '#b3261e' : '#2a2a2a');
        const vz = s.saldo > 0 ? '+' : '';
        text(sP, y + 13, nm(s.name), { size: 13 });
        text(sR1, y + 13, formatGeld(s.bezahlt, blk.waehrung), { size: 13, anchor: 'end' });
        text(sR2, y + 13, formatGeld(s.anteil, blk.waehrung), { size: 13, anchor: 'end' });
        text(sR3, y + 13, vz + formatGeld(s.saldo, blk.waehrung), { size: 13, anchor: 'end', color: col });
        y += 19;
      });
      y += 8;
      text(P, y + 12, t('kosten_ausgleich'), { size: 13, weight: 'bold', color: '#9c7c3c' }); y += 20;
      if (blk.ausgleich.length) {
        blk.ausgleich.forEach(tr => {
          umbrich(`${nm(tr.von)}  ${t('kosten_zahlt')}  ${nm(tr.an)}:  ${formatGeld(tr.betrag, blk.waehrung)}`, innerW, 13, 'normal')
            .forEach(z => { text(P, y + 12, z, { size: 13 }); y += 18; });
        });
      } else {
        text(P, y + 12, t('kosten_ausgeglichen'), { size: 13, color: '#8a7a5a' }); y += 18;
      }
      y += 12;
    });
  }
  const totalH = y + P;

  // SVG finalisieren + rastern
  bg.setAttribute('height', totalH);
  svg.setAttribute('width', W); svg.setAttribute('height', totalH);
  svg.setAttribute('viewBox', `0 0 ${W} ${totalH}`);
  const canvas = await pdfSvgZuCanvas(svg, 2);

  // In A4-Hochformat seitenweise schneiden (volle Breite, vertikal blättern)
  const doc = new ((window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : window.jsPDF)({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const rand = 10, seitW = 210, seitH = 297;
  const inhW = seitW - 2 * rand, inhH = seitH - 2 * rand;
  const mmProPx = inhW / canvas.width;                    // Skalierung Bildbreite -> Inhaltsbreite
  const seitePx = Math.floor(inhH / mmProPx);             // wie viele Canvas-px pro Seite
  let srcY = 0, erste = true;
  while (srcY < canvas.height) {
    const sliceH = Math.min(seitePx, canvas.height - srcY);
    const tmp = document.createElement('canvas');
    tmp.width = canvas.width; tmp.height = sliceH;
    const tctx = tmp.getContext('2d');
    tctx.fillStyle = '#ffffff'; tctx.fillRect(0, 0, tmp.width, tmp.height);
    tctx.drawImage(canvas, 0, srcY, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
    if (!erste) doc.addPage();
    doc.addImage(tmp.toDataURL('image/png'), 'PNG', rand, rand, inhW, sliceH * mmProPx);
    erste = false; srcY += sliceH;
  }

  const base = (titel || 'troskovi').normalize('NFKD').replace(/[^\w\-]+/g, '_').replace(/^_+|_+$/g, '') || 'troskovi';
  pdfDownloadBlob(doc.output('blob'), 'Troskovi_' + base + '.pdf');
}
