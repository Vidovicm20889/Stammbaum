// ============================================================
// STAMMBAUM (d3.js)
// ============================================================
let baumSvg, baumG, zoom, fitTransform = null;
// Welt-Bounding-Box des aktuell gezeichneten Baums ([[xMin,yMin],[xMax,yMax]]) für die
// Pan-Begrenzung; in zeichneBaum gesetzt. Mind. so viele Pixel des Baums bleiben sichtbar:
let baumPanGrenze = null;
const PAN_MIN_SICHTBAR = 90;   // ≈ eine halbe Personenkarte

function initBaum() {
  baumSvg = d3.select('#baum-svg');
  baumG = baumSvg.append('g');

  zoom = d3.zoom()
    .scaleExtent([0.05, 3.0])
    // Viewport = aktuelle Container-Größe (Funktion -> passt sich Resize/Drehung automatisch an)
    .extent(() => {
      const c = document.getElementById('baum-container').getBoundingClientRect();
      return [[0, 0], [c.width, c.height]];
    })
    // Pan-Begrenzung: der Baum darf NIE vollständig aus dem Sichtbereich geschoben
    // werden. baumPanGrenze (in zeichneBaum gesetzt) ist die Bounding-Box aller Karten
    // in Welt-Koordinaten; wir erzwingen, dass davon immer mind. PAN_MIN_SICHTBAR Pixel
    // im Viewport bleiben. Identisch für Desktop & Touch, bei JEDEM Zoom-Level. Greift NUR
    // bei interaktiven Gesten (programmatische Fit-/Zentrier-Transforms bleiben unangetastet).
    .constrain((transform, extent, translateExtent) => {
      const te = baumPanGrenze;
      if (!te) return transform;
      const M = PAN_MIN_SICHTBAR;
      const sx0 = transform.applyX(te[0][0]), sx1 = transform.applyX(te[1][0]);
      const sy0 = transform.applyY(te[0][1]), sy1 = transform.applyY(te[1][1]);
      const ex0 = extent[0][0], ey0 = extent[0][1], ex1 = extent[1][0], ey1 = extent[1][1];
      let dx = 0, dy = 0;
      if (sx1 < ex0 + M) dx = (ex0 + M) - sx1;        // Baum zu weit links  -> nach rechts
      else if (sx0 > ex1 - M) dx = (ex1 - M) - sx0;   // Baum zu weit rechts -> nach links
      if (sy1 < ey0 + M) dy = (ey0 + M) - sy1;        // Baum zu weit oben   -> nach unten
      else if (sy0 > ey1 - M) dy = (ey1 - M) - sy0;   // Baum zu weit unten  -> nach oben
      return (dx || dy) ? transform.translate(dx / transform.k, dy / transform.k) : transform;
    })
    .on('zoom', e => {
      baumG.attr('transform', e.transform);
      // Boxfeste Schrift (passt sich NICHT mehr per 1/k an -> kein Überlauf). Beim Rauszoomen
      // werden die Datumszeilen ausgeblendet (sonst zu klein/unleserlich -> reinzoomen).
      const k = e.transform.k;
      baumG.selectAll('.daten-text').style('display', k < 0.3 ? 'none' : null);
    });
  baumSvg.call(zoom);

  // Doppelklick → zurück zur Fit-Ansicht
  baumSvg.on('dblclick.zoom', null);
  baumSvg.on('dblclick', function() {
    if (fitTransform) {
      baumSvg.transition().duration(500).call(zoom.transform, fitTransform);
    }
  });
}

// „Stammbaum zentrieren"-Button + Fallback: Zoom auf Fit zurücksetzen, Baum mittig auf
// die Blutlinie/Hauptperson ausrichten. Falls (noch) keine Fit-Transform existiert
// (z. B. ungültiger Zustand), wird der Baum frisch gezeichnet.
// „Stammbaum zentrieren": stellt die persönliche Standardansicht wieder her
// (Fokus eigene Karte, Standardzoom, temporär erweiterte Bereiche eingeklappt).
// Ohne eigene Karte: bisheriges Verhalten (Zoom/Pan auf Fit zurücksetzen).
function zentriereBaumAnsicht() {
  if (meineKarteImBaum()) {
    document.getElementById('suche').value = '';
    if (zeigeStandardAnsicht()) return;   // zeichnet neu inkl. Standardzoom (fitTransform)
  }
  if (fitTransform && baumSvg && zoom) {
    baumSvg.transition().duration(500).call(zoom.transform, fitTransform);
  } else {
    zeichneBaumNeu();
  }
}

function zeichneBaum(rootPersonId, tiefeUnten = 2, tiefeOben = 2, opts = {}) {
  // GRAPH-RENDERER (Phase-2 Option C): vollwertiges, graph-basiertes Rendering hinter
  // Feature-Flag. Behebt das Single-Root-Anzeigeproblem (eingeheiratete Personen, beide
  // Elternzweige, Voll-/Halbgeschwister, mehrere Ehen, verbund-verknüpfte Familien werden
  // nicht mehr unterdrückt). Bei AUS = bisheriger Single-Root-Renderer (paralleler Vergleich).
  if (graphRendererAn()) return zeichneGraph(rootPersonId, tiefeUnten, tiefeOben, opts);

  baumG.selectAll('*').remove();

  const wurzel = baueBaumDaten(rootPersonId, tiefeUnten, tiefeOben, opts);
  if (!wurzel) return;
  // Hervorhebung: in Ausschnitts-Ansichten ist die fokussierte Person (z. B. die
  // eigene Karte) markiert, nicht die Render-Wurzel.
  const fokusKarte = opts.fokusId || rootPersonId;

  // Kopf an den aktuell angezeigten Stammbaum anpassen (#4: z.B. Petrović)
  aktualisiereKopf(rootPersonId);
  
  const containerB = document.getElementById('baum-container').getBoundingClientRect();
  const breite = containerB.width;
  const hoehe = containerB.height;
  
  // Reingold-Tilford via d3.tree().
  // nodeSize[0]=370: Pärchen-Breite (2×152 + Versatz ≈ 310) + Puffer → kein Überlapp.
  // nodeSize[1]=170: vertikaler Abstand passend zur höheren Karte (76px).
  const treeLayout = d3.tree()
    .nodeSize([370, 170])
    .separation((a, b) => a.parent === b.parent ? 1.0 : 1.4);
  const wurzelNode = d3.hierarchy(wurzel);
  treeLayout(wurzelNode);

  // y-Koordinaten negieren → Baum wächst von unten nach oben
  wurzelNode.each(d => { d.y = -d.y; });

  // Kollisions-Check (Konsolen-Warnung bei Überlapp, sollte nicht vorkommen)
  kollisionsPrüfung(wurzelNode);

  // Orthogonale T-Verbindungen (kein Bezier, kein Diagonalen)
  zeichneVerbindungen(wurzelNode);

  // ── Knoten: Hauptperson + Partner ──────────────────────────────
  const knoten = baumG.selectAll('.knoten-gruppe')
    .data(wurzelNode.descendants())
    .enter().append('g')
    .attr('class', d => 'knoten-gruppe' + (d.data.person.id === fokusKarte ? ' fokus' : ''))
    .attr('transform', d => `translate(${d.x},${d.y})`);

  knoten.each(function(d) {
    const g = d3.select(this);
    const p = d.data.person;
    const istBl = !!d.data.blutlinie;

    if (d.data.marriages && d.data.marriages.length >= 2) {
      const wife1 = d.data.marriages[0].partner;
      const wife2 = d.data.marriages[1].partner;
      if (wife1) g.append('line').attr('class', 'ehe-linie')
        .attr('x1', -6).attr('y1', 0).attr('x2', -156).attr('y2', 0);
      if (wife2) g.append('line').attr('class', 'ehe-linie')
        .attr('x1', 6).attr('y1', 0).attr('x2', 156).attr('y2', 0);
      zeichneKnotenBox(g, p, 0, p.id === fokusKarte, istBl);
      if (wife1) zeichneKnotenBox(g, wife1, -162, false, false);
      if (wife2) zeichneKnotenBox(g, wife2, 162, false, false);
    } else {
      const partners = d.data.partners;
      const N = partners.length;
      const offset = i => -81 * N + 162 * i;
      for (let i = 0; i < N; i++) {
        g.append('line').attr('class', 'ehe-linie')
          .attr('x1', offset(i) + 76).attr('y1', 0)
          .attr('x2', offset(i + 1) - 76).attr('y2', 0);
      }
      zeichneKnotenBox(g, p, offset(0), p.id === fokusKarte, istBl);
      partners.forEach((partner, i) => {
        zeichneKnotenBox(g, partner, offset(i + 1), false, false);
      });
    }

    // Übergangspunkt (Blutlinien-Kappung): kleines klickbares Badge „→ {Baum}" unter der
    // Karte — Fortsetzung der Blutlinie im Ziel-Baum (Klick = dorthin wechseln). Übergangs-
    // knoten haben nie Partner, die Hauptkarte liegt daher immer bei x=0.
    if (d.data.uebergang) {
      const bnm = nm(d.data.uebergangBaum || '');
      const badge = g.append('g')
        .attr('class', 'uebergang-badge')
        .attr('transform', 'translate(0,52)')
        .style('cursor', 'pointer')
        .on('click', (ev) => {
          if (ev) ev.stopPropagation();
          if (d.data.uebergangBaumId) waehleStammbaum(d.data.uebergangBaumId);
        });
      badge.append('title').text(t('bl_uebergang_titel', { baum: bnm }));
      badge.append('text').attr('class', 'uebergang-text')
        .attr('text-anchor', 'middle').attr('y', 0)
        .text(t('bl_uebergang', { baum: bnm }));
    }
  });

  // Bounding Box: halbe Kartenbreite (76) + max. Partner-Versatz (81) ≈ 157 -> Puffer 170
  const allX = wurzelNode.descendants().map(d => d.x);
  const allY = wurzelNode.descendants().map(d => d.y);
  const tXMin = Math.min(...allX) - 170;
  const tXMax = Math.max(...allX) + 170;
  const tYMin = Math.min(...allY) - 42;
  const tYMax = Math.max(...allY) + 42;
  const tW = tXMax - tXMin, tH = tYMax - tYMin;

  // Auto-Fit: den GESAMTEN Baum mittig und so groß wie möglich einpassen.
  // (Früher wurde x=0/Blutlinie zwangsweise in die Bildmitte gelegt und pro Hälfte
  //  skaliert — das führte bei asymmetrischen/breiten Bäumen zu Linksversatz und
  //  unnötig kleinen Karten. Jetzt: volle Breite/Höhe nutzen + auf die geometrische
  //  Baummitte zentrieren. Bei symmetrischen Blutlinien-Bäumen bleibt x=0 mittig.)
  const pad = 0.03;
  const fitW = breite * (1 - 2 * pad);
  const fitT = hoehe * pad, fitH = hoehe * (1 - 2 * pad);

  const skala = Math.min(fitW / tW, fitH / tH, 2.5);
  const cx = (tXMin + tXMax) / 2;                               // geometrische Baummitte
  const tx = breite / 2 - cx * skala;                           // Baummitte → Bildmitte
  const ty = fitT + (fitH - tH * skala) / 2 - tYMin * skala;

  // Zoom-Bereich: minZoom = Fit-Ansicht (90%), maxZoom = 4.0 (mehr Lese-Headroom bei großen Bäumen)
  zoom.scaleExtent([skala * 0.9, 4.0]);

  // Pan-Begrenzung aktivieren: Welt-Bounding-Box des Baums (siehe constrain in initBaum).
  // So bleibt bei jeder Verschiebung mind. eine Karte sichtbar — der Baum kann nicht
  // komplett aus dem Bild geschoben werden. Wird bei jedem Neuzeichnen aktualisiert
  // (Personen hinzu/entfernt/verschoben => neue Box).
  baumPanGrenze = [[tXMin, tYMin], [tXMax, tYMax]];

  fitTransform = d3.zoomIdentity.translate(tx, ty).scale(skala);
  baumSvg.call(zoom.transform, fitTransform);

  // Datumszeilen nur ab gewisser Zoomstufe (Schrift selbst ist boxfest, siehe CSS).
  baumG.selectAll('.daten-text').style('display', skala < 0.3 ? 'none' : null);

  aktualisiereBaumInfo();
}

// Orthogonale T-Verbindungen: Eltern → Sammellinie → Kinder (kein Bezier, keine Diagonalen).
function zeichneVerbindungen(wurzelNode) {
  const HH = 38; // halbe Kartenhöhe (Box 76px)

  // Links nach (Eltern-ID + FamilienIndex) gruppieren
  const gruppen = new Map();
  wurzelNode.links().forEach(link => {
    const src = link.source;
    const famIdx = link.target.data.familyIndex ?? 0;
    const key = src.data.person.id + '_' + famIdx;
    if (!gruppen.has(key)) gruppen.set(key, { src, famIdx, targets: [] });
    gruppen.get(key).targets.push(link.target);
  });

  gruppen.forEach(({ src, famIdx, targets }) => {
    // Abstiegspunkt: Mitte der Heiratslinie des Elternpaares
    const istMehrehe = !!(src.data.marriages && src.data.marriages.length >= 2);
    const descentX = istMehrehe ? src.x + (famIdx === 0 ? -81 : 81) : src.x;

    const srcBottom = src.y + HH;
    const childTop  = targets[0].y - HH;
    const midY      = (srcBottom + childTop) / 2;

    const xs       = targets.map(t => t.x);
    const collXMin = Math.min(descentX, ...xs);
    const collXMax = Math.max(descentX, ...xs);

    // 1. Vertikale Linie: Elternteil → Sammelpunkt
    baumG.append('line').attr('class', 'verbindung')
      .attr('x1', descentX).attr('y1', srcBottom)
      .attr('x2', descentX).attr('y2', midY);
    // 2. Horizontale Sammellinie bei midY
    baumG.append('line').attr('class', 'verbindung')
      .attr('x1', collXMin).attr('y1', midY)
      .attr('x2', collXMax).attr('y2', midY);
    // 3. Vertikale Stubs zu jedem Kind
    targets.forEach(t => {
      baumG.append('line').attr('class', 'verbindung')
        .attr('x1', t.x).attr('y1', midY)
        .attr('x2', t.x).attr('y2', childTop);
    });
  });
}

// Kollisions-Check: Warnung wenn zwei Knotengruppen in derselben Generation überlappen.
function kollisionsPrüfung(wurzelNode) {
  const CW = 157; // halber Paar-Fußabdruck (Person ±76 + Partner-Versatz 81)
  const MIN_GAP = 20;

  const genMap = new Map();
  wurzelNode.each(d => {
    const gy = Math.round(d.y / 10) * 10;
    if (!genMap.has(gy)) genMap.set(gy, []);
    genMap.get(gy).push(d);
  });

  genMap.forEach((nodes, gy) => {
    nodes.sort((a, b) => a.x - b.x);
    for (let i = 0; i < nodes.length - 1; i++) {
      const a = nodes[i], b = nodes[i + 1];
      const gap = (b.x - CW) - (a.x + CW);
      if (gap < MIN_GAP) {
        console.warn(`Überlapp y≈${gy}: ${a.data.person.given} ↔ ${b.data.person.given}, Abstand=${gap.toFixed(0)}px`);
      }
    }
  });
}

// Mehrreihige Anordnung: >4 Kinder → 2 Zeilen, >8 → 3 Zeilen.
// ROW = 100 > (130 − 2×30 = 70) → kein Kartenüberlapp mit Enkeln der Parallelzeile.
// Enthält eine Gruppe ein Blutlinien-Kind, wird diese Gruppe so positioniert,
// dass das Blutlinien-Kind exakt unter dem Elternteil liegt (x = node.x).
function applyMehrZeilen(node) {
  if (!node.children || node.children.length <= 4) {
    if (node.children) node.children.forEach(applyMehrZeilen);
    return;
  }
  const N = node.children.length;
  const rows = N > 8 ? 3 : 2;
  const COL = 280;
  const ROW = 100;

  const xs = node.children.map(c => c.x);
  const centerX = (Math.min(...xs) + Math.max(...xs)) / 2;
  const baseY = node.children[0].y;

  const groups = Array.from({length: rows}, () => []);
  node.children.forEach((child, i) => {
    groups[Math.min(rows - 1, Math.floor(i * rows / N))].push(child);
  });

  groups.forEach((group, ri) => {
    const n = group.length;
    const rowY = baseY - ri * ROW;
    // Blutlinien-Kind in dieser Gruppe? → es wird auf x = node.x gesetzt
    const blIdx = group.findIndex(c => c.data.blutlinie);
    const startX = blIdx >= 0
      ? node.x - blIdx * COL          // Blutlinien-Kind genau unter Elternteil
      : centerX - (n - 1) * COL / 2;  // sonst zentriert
    group.forEach((child, j) => {
      const dx = startX + j * COL - child.x;
      const dy = rowY - child.y;
      child.each(d => { d.x += dx; d.y += dy; });
    });
  });

  node.children.forEach(applyMehrZeilen);
}

// Zeichnet eine Personen-Box an xOffset relativ zum Gruppen-Ursprung.
function zeichneKnotenBox(g, p, xOffset, istFokus, istBlutlinie) {
  const sex = p.sex;
  const klasse = sex === 'M' ? 'male' : (sex === 'F' ? 'female' : 'unknown');
  const extra = (istFokus ? ' fokus' : '') + (istBlutlinie ? ' blutlinie' : '');

  const box = g.append('g')
    .attr('class', 'knoten ' + klasse + extra)
    .attr('transform', `translate(${xOffset},0)`)
    .style('cursor', 'pointer')
    .on('click', () => zeigeDetails(p.id));

  // Karte: 130×60 px
  // Karte: 152×76 px (Mitte = 0,0)
  box.append('rect')
    .attr('x', -76).attr('y', -38)
    .attr('width', 152).attr('height', 76)
    .attr('rx', 6);

  // Zeilen aufbauen: Vorname (umbruchfähig), Nachname (umbruchfähig), Mädchenname (eigene
  // Zeile, kursiv), Geburts-/Sterbedatum. Boxfeste Schrift -> sinnvolle Umbrüche statt "…".
  const zeilen = [];
  umbrucheNamen(nm(p.given || '?'), 17).forEach(l => zeilen.push({ t: l, c: 'name-text' }));
  const sn = nm(p.surname || '');
  if (sn) umbrucheNamen(sn, 18).forEach(l => zeilen.push({ t: l, c: 'name-text' }));
  const mn = nm((p.ehename || '').trim());   // Mädchenname (Djevojačko prezime), optional
  if (mn) zeilen.push({ t: '(' + (mn.length > 16 ? mn.substring(0, 15) + '…' : mn) + ')', c: 'maiden-text' });
  if (p.birth_date || p.death_date) {
    let dat = p.birth_date ? '* ' + formatDatumLang(p.birth_date) : '';
    if (p.deceased || p.death_date) dat += (dat ? '  ' : '') + '† ' + (formatDatumLang(p.death_date) || '?');
    zeilen.push({ t: dat, c: 'daten-text' });
  }
  const LH = 15;
  const startY = -((zeilen.length - 1) * LH) / 2;
  zeilen.forEach((z, i) => {
    box.append('text').attr('class', z.c)
      .attr('text-anchor', 'middle').attr('y', startY + i * LH + 4)
      .text(z.t);
  });
}

// Namen sinnvoll umbrechen (an Leerzeichen), max. 2 Zeilen, sonst hart kürzen.
function umbrucheNamen(s, max) {
  s = (s || '').trim();
  if (!s) return [''];
  if (s.length <= max) return [s];
  const woerter = s.split(/\s+/);
  const zeilen = [];
  let akt = '';
  for (const w of woerter) {
    const kand = akt ? akt + ' ' + w : w;
    if (!akt || kand.length <= max) akt = kand;
    else { zeilen.push(akt); akt = w; }
  }
  if (akt) zeilen.push(akt);
  if (zeilen.length > 2) zeilen.length = 2;
  return zeilen.map(l => l.length > max + 1 ? l.substring(0, max) + '…' : l);
}

// Blutlinie: Tanasije → Simo → Marko (direkte Abstammungslinie)
const BLUTLINIE_IDS = new Set(['I500009', 'I500007', 'I500003']);
const BLUTLINIE_KINDER = { 'I500009': 'I500007', 'I500007': 'I500003' };

function baueBaumDaten(rootId, tiefeNachUnten = 2, tiefeNachOben = 2, opts = {}) {
  if (!aktuelleDaten.persons[rootId]) return null;

  // Ausschnitts-Ansicht: nur Personen aus dem erlaubten Set zeichnen (Set enthält
  // ext-IDs inkl. aller Identitäts-Zwillinge). Ohne Set -> volles Verhalten wie bisher.
  const ERLAUBT = opts.erlaubt || null;
  const inErlaubt = (id) => !ERLAUBT || ERLAUBT.has(id);

  // Multi-Tree (B2): auf den gewählten Stammbaum begrenzen. Ohne Auswahl (oder
  // ohne _tree-Daten) verhält es sich wie früher (alles verbunden).
  const treeId = aktuellerStammbaumId;
  const sameTree = (id) => {
    if (!treeId) return true;
    const p = aktuelleDaten.persons[id];
    return !!(p && p._tree === treeId);
  };

  // Gleiche reale Person über Bäume (identitaet_id): alle Karten einer Gruppe sammeln,
  // damit ihre Beziehungen (Ehepartner + Kinder) baumübergreifend zusammengeführt werden.
  const identGruppen = {};
  Object.values(aktuelleDaten.persons).forEach(q => {
    if (q._ident) (identGruppen[q._ident] = identGruppen[q._ident] || []).push(q.id);
  });
  const twinExtIds = (id) => {
    const p = aktuelleDaten.persons[id];
    if (!p || !p._ident) return [id];
    return identGruppen[p._ident] || [id];
  };
  // Kanonische Identität: verknüpfte Karten = EINE Person; sonst die Karte selbst.
  const kanonId = (id) => {
    const p = aktuelleDaten.persons[id];
    return (p && p._ident) ? ('grp:' + p._ident) : (id || '');
  };
  // Kind-Schlüssel innerhalb derselben Ehe: verknüpft -> Gruppe; sonst VORNAME.
  // (Kinder desselben Paares mit gleichem Vornamen = dieselbe Person — unabhängig von
  //  abweichendem Nachnamen (Mädchen-/Ehename) oder Datumsformat.)
  const childKey = (id) => {
    const p = aktuelleDaten.persons[id];
    if (p && p._ident) return 'grp:' + p._ident;
    if (!p) return 'x:' + id;
    return 'gn:' + (p.given || '').trim().toLowerCase();
  };

  // Blutlinien-Kappung (Spec „ein Stammbaum = eine Blutlinie", Variante B, ab v11):
  // Blutlinie + Ehepartner + die ERSTE ausgeheiratete Generation (mit Partner UND Kindern)
  // werden voll gezeigt; erst die ZWEITE auswärtige Generation in Folge (Kinder einer bereits
  // auswärtigen Person), für deren Nachnamen im Verbund ein eigener Baum existiert, wird als
  // BLATT + „→{Baum}"-Badge gekappt → keine doppelte Blutlinie. Strukturell (zählt auswärtige
  // Generationen), daher unabhängig von der Spiegelungs-Pflege (identitaet_id) → konsistent
  // über Geschwister. „Auswärtig" = weder Nachname NOCH Mädchenname (ehename) == Baumname
  // (der Mädchenname-Check verhindert, dass eine eingeheiratete Blutlinien-Frau — z. B. née
  // „Vidović" — fälschlich als auswärts zählt und ihre Kinder zu früh gekappt werden).
  // Existiert KEIN Ziel-Baum (Import/Option-3 „ohne Verknüpfung"/Altbestand), wird NICHT
  // gekappt — sonst verschwänden Nachkommen nirgends. Abschaltbar über opts.uebergangCut===false.
  const cutAn = !!treeId && opts.uebergangCut !== false;
  // Klammer-Zusätze im Baumnamen (z. B. „Pisarević (Desa)", „Stojanović (Nebojša)") gehören NICHT
  // zur Blutlinie — sie unterscheiden nur gleichnamige Bäume. Für die Blutlinien-Erkennung daher den
  // REINEN Nachnamen verwenden; sonst zählt selbst eine geborene Trägerin (née == Baumname, z. B. Ana
  // née Pisarević) als auswärts und wird samt Partner/Kindern fälschlich gekappt. Bewusst NUR hier —
  // zweigNachnameNorm/zielBaumFuer bleiben strikt (Voll-Name), damit gleichnamige Bäume weiterhin
  // unterscheidbar bleiben (CLAUDE.md v11.2: zwei Familien dürfen denselben Nachnamen tragen).
  const treeNameN = treeId ? zweigNachnameNorm((stammbaeumeListe[treeId] || '').replace(/\s*\([^)]*\)\s*/g, ' ')) : '';
  const istBlutName = (p) => {
    if (!p) return false;
    if (zweigNachnameNorm(p.surname || '') === treeNameN) return true;
    if (zweigNachnameNorm(p.ehename || '') === treeNameN) return true;   // ehename = Mädchenname (née)
    // Fallback (robust gegen leere Mädchennamen): der Geburtsname folgt dem Vater — trägt der
    // Vater (husband der Geburtsfamilie) den Baumnamen, ist die Person in die Blutlinie geboren.
    for (const famId of (p.families_child || [])) {
      const fam = aktuelleDaten.families[famId];
      const vater = (fam && fam.husband) ? aktuelleDaten.persons[fam.husband] : null;
      if (vater && zweigNachnameNorm(vater.surname || '') === treeNameN) return true;
    }
    return false;
  };
  const zielBaumFuer = (snNorm) => {
    if (!snNorm || snNorm === treeNameN) return null;
    for (const tid in stammbaeumeListe) {
      if (tid === treeId) continue;
      if (zweigNachnameNorm(stammbaeumeListe[tid]) === snNorm) return { baumId: tid, baum: stammbaeumeListe[tid] || '' };
    }
    return null;
  };

  function findeWurzel(personId, tiefe) {
    if (tiefe <= 0) return personId;
    const p = aktuelleDaten.persons[personId];
    if (!p || !p.families_child.length) return personId;
    const fam = aktuelleDaten.families[p.families_child[0]];
    if (!fam) return personId;
    // Elternteil im selben Baum bevorzugen; gibt es keinen -> hier ist die Wurzel
    let elternId = null;
    if (fam.husband && sameTree(fam.husband)) elternId = fam.husband;
    else if (fam.wife && sameTree(fam.wife)) elternId = fam.wife;
    if (!elternId || !aktuelleDaten.persons[elternId]) return personId;
    return findeWurzel(elternId, tiefe - 1);
  }

  const wurzelId = findeWurzel(rootId, tiefeNachOben);
  const besucht = new Set();

  function baueKnoten(personId, tiefe, gebrueckt, elternAuswaerts) {
    if (besucht.has(personId)) return null;
    const twins = twinExtIds(personId);
    twins.forEach(tid => besucht.add(tid));   // Person + alle Zwillinge gelten als verarbeitet
    const p = aktuelleDaten.persons[personId];
    if (!p) return null;

    // Auswärts-Tiefe für die Blutlinien-Kappung (Variante B): ist diese Person UND ihr
    // Elternteil bereits auswärtig (2. Generation in Folge) und existiert ein Ziel-Baum ihres
    // Nachnamens → nur die Karte als Blatt zeigen (KEINE Partner/Nachkommen), Badge „→{Baum}".
    const selbstAuswaerts = cutAn && !istBlutName(p);
    if (selbstAuswaerts && elternAuswaerts) {
      const ziel = zielBaumFuer(zweigNachnameNorm(p.surname || ''));
      if (ziel) {
        return { person: p, partners: [], marriages: null, familyIndex: null, children: [],
          blutlinie: BLUTLINIE_IDS.has(personId),
          uebergang: true, uebergangBaum: ziel.baum, uebergangBaumId: ziel.baumId };
      }
    }
    const myTwins = new Set(twins);
    const twinsGeordnet = [personId, ...twins.filter(t => t !== personId)];

    // Ehe-Familien ALLER Zwillingskarten sammeln, nach PARTNER (Identität ODER Vorname)
    // gruppieren und Kinder GLOBAL entdoppeln -> die verknüpfte Person hat in JEDEM Baum
    // exakt dieselben Kinder (auch wenn pro Baum nur Teile erfasst sind).
    const partnerSchluessel = (pid) => {
      const pp = aktuelleDaten.persons[pid];
      if (!pp) return null;
      return pp._ident ? ('grp:' + pp._ident) : ('gn:' + (pp.given || '').trim().toLowerCase());
    };
    const eheMap = new Map();                    // partnerKey -> { partnerId, partner, kinderIds, bruecke }
    const ohnePartner = { kinderIds: [], bruecke: false };
    const globalKinder = new Map();   // childKey -> { cid, ziel }: bevorzugt die Karte des aktuellen Baums
    let hauptKey = null;
    // Hat diese reale Person (irgendeine Zwillingskarte) eine Karte im AKTUELLEN Baum?
    // Dann ist sie ein echter Mitglieds-Elternteil dieses Baums -> ALLE ihre Kinder müssen
    // hier auftauchen, auch wenn die Kind-Karte in einem anderen Baum liegt (Anforderung:
    // "Kinder müssen in jedem Baum auftauchen, in dem auch Eltern angelegt sind"). Deckt den
    // Fall ab, dass der Elternteil NICHT per identitaet_id verzwillingt ist, sondern seine
    // einzige Karte direkt baumübergreifende Eltern-Kanten zu den Kindern hat (z. B. Mirjana
    // [Vidović] ↔ Kinder im Dušanić-Baum).
    const nodeImBaum = twinsGeordnet.some(t => sameTree(t));
    twinsGeordnet.forEach(tid => {
      const tp = aktuelleDaten.persons[tid];
      if (!tp) return;
      const famBruecke = gebrueckt || nodeImBaum || tid !== personId || !sameTree(tid);
      (tp.families_spouse || []).forEach(famId => {
        const fam = aktuelleDaten.families[famId];
        if (!fam) return;
        const partnerId = myTwins.has(fam.husband) ? fam.wife : fam.husband;
        const pk = (partnerId && aktuelleDaten.persons[partnerId]) ? partnerSchluessel(partnerId) : null;
        let ziel;
        if (pk) {
          let e = eheMap.get(pk);
          if (!e) {
            // Partnerkarte in Ausschnitts-Ansicht nur zeigen, wenn im erlaubten Set
            // (die Ehe/Kinder bleiben unabhängig davon erhalten -> Halbgeschwister).
            const partner = (!besucht.has(partnerId) && inErlaubt(partnerId)) ? aktuelleDaten.persons[partnerId] : null;
            e = { partnerId, partner, kinderIds: [], bruecke: famBruecke };
            eheMap.set(pk, e);
            if (hauptKey === null) hauptKey = pk;
          } else { e.bruecke = e.bruecke || famBruecke; }
          ziel = e;
        } else {
          ohnePartner.bruecke = ohnePartner.bruecke || famBruecke;
          ziel = ohnePartner;
        }
        (fam.children || []).forEach(cid => {
          const ck = childKey(cid);
          const vorhanden = globalKinder.get(ck);
          if (vorhanden) {
            // Dieselbe reale Person kann in mehreren Bäumen je eine Karte haben (gleiche
            // identitaet_id ODER – ohne Verknüpfung – gleicher Vorname unter denselben Eltern).
            // Bevorzuge die Karte des AKTUELLEN Baums, sonst fällt das Kind durch den
            // sameTree-Filter (zeigeKind) und verschwindet, obwohl es hier eine Karte hat.
            if (!sameTree(vorhanden.cid) && sameTree(cid)) {
              const arr = vorhanden.ziel.kinderIds;
              const i = arr.indexOf(vorhanden.cid);
              if (i >= 0) arr.splice(i, 1);
              ziel.kinderIds.push(cid);
              globalKinder.set(ck, { cid, ziel });
            }
            return;                               // global entdoppeln (überall dieselben Kinder)
          }
          globalKinder.set(ck, { cid, ziel });
          ziel.kinderIds.push(cid);
        });
      });
    });
    // Kinder ohne erkennbaren Partner an die Hauptehe hängen
    if (ohnePartner.kinderIds.length) {
      if (hauptKey) {
        const h = eheMap.get(hauptKey);
        h.kinderIds.push(...ohnePartner.kinderIds);
        h.bruecke = h.bruecke || ohnePartner.bruecke;
      } else {
        eheMap.set('__np__', { partnerId: null, partner: null, kinderIds: ohnePartner.kinderIds, bruecke: ohnePartner.bruecke });
      }
    }
    const familien = [...eheMap.values()];
    familien.forEach(f => { if (f.partner) besucht.add(f.partnerId); });

    const partners = familien.map(f => f.partner).filter(Boolean);
    const marriages = familien.length >= 2 ? familien.map(f => ({ partner: f.partner })) : null;
    const blutlinie = BLUTLINIE_IDS.has(personId);

    const knoten = { person: p, partners, marriages, familyIndex: null, children: [], blutlinie };

    if (tiefe <= 0) return knoten;

    // Kind zeigen, wenn es im aktuellen Baum liegt ODER über eine Verknüpfungs-Brücke kommt
    // — und (bei Ausschnitts-Ansicht) im erlaubten Set liegt.
    const zeigeKind = (cid, bruecke) => (bruecke || sameTree(cid)) && inErlaubt(cid);

    if (familien.length >= 2) {
      familien.forEach((fam, famIdx) => {
        fam.kinderIds.forEach(cid => {
          if (!zeigeKind(cid, fam.bruecke)) return;
          const kindKnoten = baueKnoten(cid, tiefe - 1, fam.bruecke, selbstAuswaerts);
          if (kindKnoten) { kindKnoten.familyIndex = famIdx; knoten.children.push(kindKnoten); }
        });
      });
    } else {
      familien.forEach(fam => fam.kinderIds.forEach(cid => {
        if (!zeigeKind(cid, fam.bruecke)) return;
        const kindKnoten = baueKnoten(cid, tiefe - 1, fam.bruecke, selbstAuswaerts);
        if (kindKnoten) knoten.children.push(kindKnoten);
      }));
    }

    // Blutlinien-Kind in die Mitte stellen → Reingold-Tilford zentriert es unter dem Elternteil
    const blChild = BLUTLINIE_KINDER[personId];
    if (blChild && knoten.children.length > 1) {
      const blIdx = knoten.children.findIndex(c => c.person.id === blChild);
      if (blIdx >= 0) {
        const centerIdx = Math.floor(knoten.children.length / 2);
        const [bl] = knoten.children.splice(blIdx, 1);
        knoten.children.splice(centerIdx, 0, bl);
      }
    }

    return knoten;
  }

  return baueKnoten(wurzelId, tiefeNachOben + tiefeNachUnten, false, false);
}

// ============================================================
// GRAPH-RENDERER (Phase 2, Option C "Hybrid") — ab v12.6
// ------------------------------------------------------------
// Echtes graph-basiertes Rendering statt Single-Root-d3.tree. Jede Person ist ein
// Knoten (kanonisch über identitaet_id entdoppelt); Kanten = Eltern→Kind + Partner↔Partner.
// Generationen werden per Längster-Pfad-Relaxation vergeben (Vorfahren UND Nachkommen, beide
// Elternzweige, mehrere Ehen). Horizontale Anordnung per Barycenter-Kreuzungsminimierung +
// Median-Ausrichtung + Paar-Gruppierung. KEIN Knoten fällt heraus, nur weil ihm eine Kante zur
// Auto-Wurzel fehlt: die Vollansicht zeigt die GANZE zusammenhängende Komponente; Bäume bleiben
// als Berechtigungs-/Einstiegsgrenze erhalten (RLS unverändert, rein render-seitige Zusammen-
// führung des Verbunds). Reuse: zeichneKnotenBox, Zoom/Fit, _ans*-Helfer, verwandtschaftsSet.
// Feature-Flag RENDERER_GRAPH (localStorage 'vidovic_renderer_graph') — Default unten.
// ============================================================
// HART DEAKTIVIERT (ab v12.7, Nutzerwunsch): Der Graph-Renderer stellte den Baum falsch dar
// und ist abgeschaltet. graphRendererAn() liefert IMMER false → es wird ausschließlich der
// klassische Single-Root-Renderer (zeichneBaum) verwendet; der UI-Schalter ist entfernt und
// der Graph-Fokus-Button blendet sich aus. Der Graph-Code bleibt vorerst als ruhender,
// unerreichbarer Code stehen (vollständiges Löschen ist ein optionaler Folgeschritt).
const RENDERER_GRAPH_DEFAULT = false;
function graphRendererAn() {
  return false;
}
function setGraphRenderer(an) {
  try { localStorage.setItem('vidovic_renderer_graph', an ? '1' : '0'); } catch (e) {}
}

// Graph-Layout-Konstanten (kompatibel zur Karten-Geometrie: Box 152×76)
const RG_CARD_HW = 76;     // halbe Kartenbreite
const RG_ROWH    = 185;    // vertikaler Generationsabstand
const RG_GAP_PAAR = 168;   // Mitte-zu-Mitte für ein Ehepaar (≈ 152 + kleiner Spalt)
const RG_GAP_GESCH = 212;  // Mitte-zu-Mitte für nicht-verpartnerte Nachbarn in einer Reihe

// 1) Graph-Modell aus aktuelleDaten (Knoten kanonisch, Unions je Elternpaar) ----------
function baueGraphModell() {
  const canonOf = (id) => {
    const p = aktuelleDaten.persons[id];
    return (p && p._ident) ? ('grp:' + p._ident) : id;
  };
  const nodes = new Map();   // canon -> { canon, rep, person, exts:[], trees:Set }
  function ensure(id) {
    const c = canonOf(id);
    const p = aktuelleDaten.persons[id];
    if (!p) return null;
    let n = nodes.get(c);
    if (!n) { n = { canon: c, rep: id, person: p, exts: [], trees: new Set() }; nodes.set(c, n); }
    n.exts.push(id);
    if (p._tree) n.trees.add(p._tree);
    // Anzeige bevorzugt die Karte des AKTUELL geöffneten Baums (konsistente Heimat-Optik)
    if (p._tree === aktuellerStammbaumId) { n.rep = id; n.person = p; }
    return n;
  }
  Object.keys(aktuelleDaten.persons).forEach(ensure);

  // Unions je Elternpaar (Schlüssel = sortierte kanonische Eltern). Familien sind in
  // ladeBaumAusSupabase bereits nach Eltern-Set zusammengeführt; hier zusätzlich über
  // Zwillinge kanonisch entdoppelt -> dieselbe reale Ehe = EINE Union.
  const unionMap = new Map();
  Object.values(aktuelleDaten.families).forEach(fam => {
    const par = [];
    if (fam.husband) par.push(fam.husband);
    if (fam.wife) par.push(fam.wife);
    const pc = [...new Set(par.map(canonOf).filter(c => nodes.has(c)))];
    const key = pc.length ? pc.slice().sort().join('&') : ('solo:' + fam.id);
    let u = unionMap.get(key);
    if (!u) { u = { key, parents: new Set(pc), children: new Set() }; unionMap.set(key, u); }
    (fam.children || []).forEach(cid => { const cc = canonOf(cid); if (nodes.has(cc) && !u.parents.has(cc)) u.children.add(cc); });
  });
  const unions = [...unionMap.values()];

  // Relationsindizes (canon -> Set canon)
  const parents = new Map(), children = new Map(), partners = new Map();
  nodes.forEach((_, c) => { parents.set(c, new Set()); children.set(c, new Set()); partners.set(c, new Set()); });
  unions.forEach(u => {
    const ps = [...u.parents], cs = [...u.children];
    for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) { partners.get(ps[i]).add(ps[j]); partners.get(ps[j]).add(ps[i]); }
    ps.forEach(p => cs.forEach(c => { children.get(p).add(c); parents.get(c).add(p); }));
  });

  return { nodes, unions, parents, children, partners, canonOf };
}

// 2) Sichtbarkeits-Set bestimmen (kanonische Knoten) -----------------------------------
function graphKomponente(model, startCanons) {
  const seen = new Set(), stack = [...startCanons];
  while (stack.length) {
    const x = stack.pop(); if (seen.has(x)) continue; seen.add(x);
    [...(model.parents.get(x) || []), ...(model.children.get(x) || []), ...(model.partners.get(x) || [])]
      .forEach(y => { if (!seen.has(y)) stack.push(y); });
  }
  return seen;
}
function graphRadius(model, start, runter, hoch) {
  const vis = new Set([start]);
  let frontier = [start];
  for (let d = 0; d < hoch; d++) {
    const nf = [];
    frontier.forEach(c => (model.parents.get(c) || []).forEach(p => { if (!vis.has(p)) { vis.add(p); nf.push(p); } }));
    frontier = nf;
  }
  frontier = [start];
  for (let d = 0; d < runter; d++) {
    const nf = [];
    frontier.forEach(c => (model.children.get(c) || []).forEach(k => { if (!vis.has(k)) { vis.add(k); nf.push(k); } }));
    frontier = nf;
  }
  // Partner aller Sichtbaren + Geschwister (Kinder eingeschlossener Eltern) -> Halbgeschwister
  [...vis].forEach(c => (model.partners.get(c) || []).forEach(p => vis.add(p)));
  [...vis].forEach(c => (model.parents.get(c) || []).forEach(par => (model.children.get(par) || []).forEach(s => vis.add(s))));
  return vis;
}
function graphNachkommen(model, start, runter) {
  const vis = new Set([start]);
  let frontier = [start];
  const max = (!runter || runter < 0) ? 99 : runter;
  for (let d = 0; d < max; d++) {
    const nf = [];
    frontier.forEach(c => (model.children.get(c) || []).forEach(k => { if (!vis.has(k)) { vis.add(k); nf.push(k); } }));
    if (!nf.length) break;
    frontier = nf;
  }
  [...vis].forEach(c => (model.partners.get(c) || []).forEach(p => vis.add(p)));
  return vis;
}
function graphSichtbar(model, fokusCanon, tiefeUnten, tiefeOben, opts) {
  if (opts.erlaubt) {
    const set = new Set();
    opts.erlaubt.forEach(ext => { const c = model.canonOf(ext); if (model.nodes.has(c)) set.add(c); });
    if (set.size) return set;
  }
  if (opts.nurNachkommen) return graphNachkommen(model, fokusCanon, tiefeUnten);
  if (tiefeOben === 0 && tiefeUnten >= 12) return graphKomponente(model, [fokusCanon]);  // Vollansicht = ganze Komponente
  return graphRadius(model, fokusCanon, tiefeUnten, tiefeOben);
}

// 3) Generationen-Ränge (Längster-Pfad-Relaxation; Partner gleichgezogen) --------------
function graphRaenge(model, visible) {
  const rank = new Map();
  visible.forEach(c => rank.set(c, 0));
  const cap = visible.size + 4;
  for (let iter = 0; iter < cap; iter++) {
    let changed = false;
    model.unions.forEach(u => {
      const ps = [...u.parents].filter(c => visible.has(c));
      if (!ps.length) return;
      const cs = [...u.children].filter(c => visible.has(c));
      const pr = Math.max(...ps.map(c => rank.get(c)));
      ps.forEach(c => { if (rank.get(c) < pr) { rank.set(c, pr); changed = true; } });   // Partner gleichziehen
      cs.forEach(c => { if (rank.get(c) < pr + 1) { rank.set(c, pr + 1); changed = true; } });
    });
    if (!changed) break;
  }
  return rank;
}

// 4) Horizontale Anordnung (Barycenter-Kreuzungsminimierung + Median-Ausrichtung) -------
function graphLayout(model, visible, rank) {
  const layers = new Map();
  visible.forEach(c => { const r = rank.get(c); if (!layers.has(r)) layers.set(r, []); layers.get(r).push(c); });
  const rs = [...layers.keys()].sort((a, b) => a - b);

  const parentsOf = new Map(), childrenOf = new Map(), partnersOf = new Map();
  visible.forEach(c => {
    parentsOf.set(c, [...(model.parents.get(c) || [])].filter(x => visible.has(x)));
    childrenOf.set(c, [...(model.children.get(c) || [])].filter(x => visible.has(x)));
    partnersOf.set(c, new Set([...(model.partners.get(c) || [])].filter(x => visible.has(x) && rank.get(x) === rank.get(c))));
  });

  // Stabile Startreihenfolge: je Reihe nach (Eltern-Index, Name)
  const pos = new Map();
  const reindex = () => rs.forEach(r => layers.get(r).forEach((c, i) => pos.set(c, i)));
  rs.forEach(r => layers.get(r).sort((a, b) => {
    const na = (model.nodes.get(a).person.name || ''), nb = (model.nodes.get(b).person.name || '');
    return na.localeCompare(nb);
  }));
  reindex();

  const bary = (c, nbMap) => { const ns = nbMap.get(c) || []; if (!ns.length) return pos.get(c); let s = 0; ns.forEach(n => s += pos.get(n)); return s / ns.length; };
  for (let sweep = 0; sweep < 8; sweep++) {
    const down = sweep % 2 === 0;
    (down ? rs : rs.slice().reverse()).forEach(r => {
      const nbMap = down ? parentsOf : childrenOf;
      const arr = layers.get(r);
      const b = new Map(arr.map(c => [c, bary(c, nbMap)]));
      arr.sort((x, y) => b.get(x) - b.get(y));
      reindex();
    });
  }

  // Paare in jeder Reihe nebeneinander gruppieren (Reihenfolge sonst beibehalten)
  rs.forEach(r => {
    const arr = layers.get(r), placed = new Set(), out = [];
    arr.forEach(c => {
      if (placed.has(c)) return;
      out.push(c); placed.add(c);
      partnersOf.get(c).forEach(pt => { if (!placed.has(pt) && arr.includes(pt)) { out.push(pt); placed.add(pt); } });
    });
    layers.set(r, out);
  });
  reindex();

  // X initial sequentiell mit variablem Abstand (Paare enger)
  const X = new Map(), Y = new Map();
  const gapFn = (a, b) => partnersOf.get(a).has(b) ? RG_GAP_PAAR : RG_GAP_GESCH;
  const spreize = (arr) => { for (let i = 1; i < arr.length; i++) { const need = X.get(arr[i - 1]) + gapFn(arr[i - 1], arr[i]); if (!X.has(arr[i]) || X.get(arr[i]) < need) X.set(arr[i], need); } };
  rs.forEach(r => { const arr = layers.get(r); X.set(arr[0], 0); spreize(arr); arr.forEach(c => Y.set(c, -r * RG_ROWH)); });

  // Median-Ausrichtung: Kinder unter Eltern-Mittel / Eltern über Kinder-Mittel, je mit Überlapp-Auflösung
  const mittel = (ids) => { let s = 0; ids.forEach(i => s += X.get(i)); return s / ids.length; };
  for (let pass = 0; pass < 10; pass++) {
    rs.forEach(r => {                                  // top->down: Kinder zentrieren
      layers.get(r).forEach(c => { const ps = parentsOf.get(c); if (ps.length) X.set(c, mittel(ps)); });
      spreize(layers.get(r));
    });
    rs.slice().reverse().forEach(r => {                // bottom->up: Eltern über Kinder zentrieren
      layers.get(r).forEach(c => { const cs = childrenOf.get(c); if (cs.length) X.set(c, mittel(cs)); });
      spreize(layers.get(r));
    });
  }

  return { X, Y };
}

// 5) Zeichnen ---------------------------------------------------------------------------
function zeichneGraphKanten(model, visible, X, Y) {
  const HH = 38;   // halbe Kartenhöhe
  model.unions.forEach(u => {
    const ps = [...u.parents].filter(c => visible.has(c) && X.has(c)).sort((a, b) => X.get(a) - X.get(b));
    const cs = [...u.children].filter(c => visible.has(c) && X.has(c));
    // Ehe-Linie(n) zwischen benachbarten Partnern derselben Reihe
    for (let i = 0; i < ps.length - 1; i++) {
      if (Y.get(ps[i]) !== Y.get(ps[i + 1])) continue;
      baumG.append('line').attr('class', 'ehe-linie')
        .attr('x1', X.get(ps[i]) + RG_CARD_HW).attr('y1', Y.get(ps[i]))
        .attr('x2', X.get(ps[i + 1]) - RG_CARD_HW).attr('y2', Y.get(ps[i + 1]));
    }
    if (!cs.length || !ps.length) return;
    // Abstiegspunkt = Mitte des Elternpaars; T-Verbindung zu den Kindern (orthogonal)
    const midX = ps.reduce((s, c) => s + X.get(c), 0) / ps.length;
    const parentY = Math.max(...ps.map(c => Y.get(c)));   // gleiche Reihe -> identisch
    const parentTop = parentY - HH;
    const childBottom = Math.min(...cs.map(c => Y.get(c))) + HH;
    const midY = (parentTop + childBottom) / 2;
    const xs = cs.map(c => X.get(c));
    baumG.append('line').attr('class', 'verbindung')
      .attr('x1', midX).attr('y1', parentTop).attr('x2', midX).attr('y2', midY);
    baumG.append('line').attr('class', 'verbindung')
      .attr('x1', Math.min(midX, ...xs)).attr('y1', midY).attr('x2', Math.max(midX, ...xs)).attr('y2', midY);
    cs.forEach(c => baumG.append('line').attr('class', 'verbindung')
      .attr('x1', X.get(c)).attr('y1', midY).attr('x2', X.get(c)).attr('y2', Y.get(c) + HH));
  });
}

function zeichneGraph(rootPersonId, tiefeUnten = 2, tiefeOben = 2, opts = {}) {
  baumG.selectAll('*').remove();
  if (!aktuelleDaten.persons[rootPersonId]) return;

  const model = baueGraphModell();
  const fokusExt = opts.fokusId || rootPersonId;
  const fokusCanon = model.canonOf(fokusExt);
  if (!model.nodes.has(fokusCanon)) return;

  const visible = graphSichtbar(model, fokusCanon, tiefeUnten, tiefeOben, opts);
  if (!visible.size) return;
  const rank = graphRaenge(model, visible);
  const { X, Y } = graphLayout(model, visible, rank);

  aktualisiereKopf(rootPersonId);

  // Kanten zuerst (liegen unter den Karten)
  zeichneGraphKanten(model, visible, X, Y);

  // Knoten: je kanonische Person eine Box (reuse zeichneKnotenBox an x=0 in eigener Gruppe)
  visible.forEach(c => {
    if (!X.has(c)) return;
    const n = model.nodes.get(c);
    const istFokus = (c === fokusCanon);
    const g = baumG.append('g')
      .attr('class', 'knoten-gruppe' + (istFokus ? ' fokus' : ''))
      .attr('transform', `translate(${X.get(c)},${Y.get(c)})`);
    zeichneKnotenBox(g, n.person, 0, istFokus, BLUTLINIE_IDS.has(n.rep));
  });

  // ── Auto-Fit (identisch zur Single-Root-Variante) ──────────────────────────────
  const containerB = document.getElementById('baum-container').getBoundingClientRect();
  const breite = containerB.width, hoehe = containerB.height;
  const allX = [], allY = [];
  visible.forEach(c => { if (X.has(c)) { allX.push(X.get(c)); allY.push(Y.get(c)); } });
  if (!allX.length) return;
  const tXMin = Math.min(...allX) - 170, tXMax = Math.max(...allX) + 170;
  const tYMin = Math.min(...allY) - 42,  tYMax = Math.max(...allY) + 42;
  const tW = tXMax - tXMin, tH = tYMax - tYMin;
  const pad = 0.03;
  const fitW = breite * (1 - 2 * pad), fitT = hoehe * pad, fitH = hoehe * (1 - 2 * pad);
  const skala = Math.min(fitW / tW, fitH / tH, 2.5);
  const cx = (tXMin + tXMax) / 2;
  const tx = breite / 2 - cx * skala;
  const ty = fitT + (fitH - tH * skala) / 2 - tYMin * skala;
  zoom.scaleExtent([skala * 0.9, 4.0]);
  baumPanGrenze = [[tXMin, tYMin], [tXMax, tYMax]];
  fitTransform = d3.zoomIdentity.translate(tx, ty).scale(skala);
  baumSvg.call(zoom.transform, fitTransform);
  baumG.selectAll('.daten-text').style('display', skala < 0.3 ? 'none' : null);

  aktualisiereBaumInfo();
}

// „Diese Person fokussieren" (Graph-Renderer): angeklickte Person wird Zentrum, großzügige
// Nachbarschaft (4 Generationen hoch/runter) inkl. beider Elternzweige. „Zurück" über
// zentriereBaumAnsicht / zeigVollenBaum.
function graphFokusAufPerson(personId) {
  if (!graphRendererAn() || !aktuelleDaten.persons[personId]) return;
  schliesseModal();
  const p = aktuelleDaten.persons[personId];
  if (p && p._tree && p._tree !== aktuellerStammbaumId) {
    aktuellerStammbaumId = p._tree;
    const sel = document.getElementById('tree-select'); if (sel) sel.value = p._tree;
  }

  ansichtModus = null;
  document.getElementById('suche').value = '';

  aktualisiereBaumHinweis();
}

// ============================================================
// VERWANDTSCHAFTS-ANSICHT (MyHeritage-Stil, Eigenbau auf d3) — ab v12.7 (BETA, opt-in)
// ------------------------------------------------------------
// Fokus-zentriert: gewählte Person in der Mitte, VORFAHREN als Paar-Pyramide nach OBEN
// (beide Elternzweige), NACHKOMMEN als Paar-Baum nach UNTEN. Paare sind eine Einheit
// (nebeneinander + Verbindungsknoten); Kinder hängen am Paar. So wird sichtbar, wie zwei
// Familien über eine eingeheiratete Person verknüpft sind (z. B. Mara: ihre Geburtsfamilie
// oben, ihr Ehemann + Kinder unten). Reuse: baueGraphModell (kanonische Knoten über
// identitaet_id → eine reale Person = EIN Knoten), graphRadius (fokus-zentrierte Auswahl),
// zeichneKnotenBox (Karten), d3.tree (zwei getrennte Tidy-Layouts, an der Fokusperson
// zusammengesetzt). Eingesetzt vom Modus „Familienzweig ab Person" (zeigeZweigAbPerson) —
// nur diese Logik kann baumübergreifend (alle identitaet_id-Bäume) zeichnen.
const G2_ROWH = 178;   // Generationsabstand
const G2_PAAR = 162;   // Partner-Versatz (eine Karte + kleiner Spalt)
const G2_HH = 38, G2_HW = 76;   // halbe Kartenhöhe/-breite

function zeichneGraph2(rootPersonId, tiefeUnten = 4, tiefeOben = 4, opts = {}) {
  baumG.selectAll('*').remove();
  if (!aktuelleDaten.persons[rootPersonId]) return;

  const model = baueGraphModell();

  // Fokus-Wahl (fokus-zentrierte „MyHeritage"-Navigation): explizit gewählte Person >
  // eigene Karte im Baum > tiefster Nachkomme der Wurzel. Letzteres sorgt für einen
  // sinnvollen EINSTIEG: vom Wurzel-Ahn aus gäbe es 0 Vorfahren (→ nur eine Linie); von
  // einem jungen Nachkommen aus fächern die Vorfahren BEIDE Elternzweige auf — so werden
  // eingeheiratete Personen samt ihrer Herkunftsfamilie sichtbar (z. B. Mara → Petrović).
  let focus;
  if (opts.fokusId && model.nodes.has(model.canonOf(opts.fokusId))) {
    focus = model.canonOf(opts.fokusId);
  } else {
    const meine = (typeof meineKarteImBaum === 'function') ? meineKarteImBaum() : null;
    if (meine && model.nodes.has(model.canonOf(meine))) {
      focus = model.canonOf(meine);
    } else {
      let cur = model.canonOf(rootPersonId), guard = 0;
      while (guard++ < 60) {
        const kids = [...(model.children.get(cur) || [])];
        if (!kids.length) break;
        cur = kids[0];   // entlang der ersten Kindlinie bis zu einem Blatt absteigen
      }
      focus = cur;
    }
  }
  if (!model.nodes.has(focus)) return;

  // Tiefen: aus opts (z. B. „Familienzweig ab Person" mit naniže/naviše), sonst großzügiger
  // Default für die fokus-zentrierte Navigation. 99 = praktisch unbegrenzt.
  const upN = (opts.upN != null) ? opts.upN : 5;
  const downN = (opts.downN != null) ? opts.downN : 5;
  const visible = graphRadius(model, focus, downN, upN);

  const personOf  = c => model.nodes.get(c).person;
  const vis       = c => visible.has(c);
  const parentsOf = c => [...(model.parents.get(c) || [])].filter(vis);
  const childrenOf= c => [...(model.children.get(c) || [])].filter(vis);
  const partnersOf= c => [...(model.partners.get(c) || [])].filter(vis);

  // ── NACHKOMMEN-Hierarchie (Fokus nach unten): Person + Partner(seitlich), Kinder darunter ──
  const seen = new Set([focus]);
  function descNode(c, depth) {
    const partner = partnersOf(c).filter(p => !seen.has(p));
    partner.forEach(p => seen.add(p));
    const node = { canon: c, partners: partner, children: [] };
    if (depth < downN) {
      childrenOf(c).forEach(k => { if (!seen.has(k)) { seen.add(k); node.children.push(descNode(k, depth + 1)); } });
    }
    return node;
  }
  const descRoot = descNode(focus, 0);

  // ── VORFAHREN-Hierarchie (Fokus nach oben): Kind -> Eltern (rekursiv) ──
  const seenA = new Set([focus]);
  function ancNode(c, depth) {
    const node = { canon: c, children: [] };
    if (depth < upN) {
      parentsOf(c).forEach(p => { if (!seenA.has(p)) { seenA.add(p); node.children.push(ancNode(p, depth + 1)); } });
    }
    return node;
  }
  const ancRoot = ancNode(focus, 0);

  // ── Tidy-Layout je Richtung (d3.tree); beide an der Fokusperson (0,0) ausgerichtet ──
  const dh = d3.hierarchy(descRoot, d => d.children);
  d3.tree().nodeSize([370, G2_ROWH]).separation((a, b) => a.parent === b.parent ? 1.0 : 1.35)(dh);
  const dShift = -dh.x;
  dh.each(d => { d.x += dShift; });   // y: 0,178,356… nach unten

  const ah = d3.hierarchy(ancRoot, d => d.children);
  // nodeSize[0]=162 → die zwei Eltern eines Kindes (gleicher Parent in der Hierarchie) stehen
  // als Paar ENG (≈ Partner-Versatz); verschiedene Elternpaare großzügig getrennt (separation).
  d3.tree().nodeSize([162, G2_ROWH]).separation((a, b) => a.parent === b.parent ? 1.0 : 2.2)(ah);
  const aShift = -ah.x;
  ah.each(a => { a.x += aShift; a.y = -a.y; });   // y nach oben spiegeln; Wurzel(Fokus) bei 0

  const pts = [];
  const joint = (x, y) => baumG.append('rect').attr('class', 'paar-knoten')
    .attr('x', x - 4).attr('y', y - 4).attr('width', 8).attr('height', 8)
    .attr('transform', `rotate(45 ${x} ${y})`);

  // ── Kanten zuerst (unter den Karten) ──
  // Nachkommen: Ehe-Linie Person↔Partner + T-Verbindung zu Kindern (Abstieg an der Person)
  dh.each(d => {
    const px = d.x, py = d.y;
    (d.data.partners || []).forEach((pt, i) => {
      const ox = px + G2_PAAR * (i + 1);
      baumG.append('line').attr('class', 'ehe-linie')
        .attr('x1', px + G2_HW).attr('y1', py).attr('x2', ox - G2_HW).attr('y2', py);
      joint((px + G2_HW + ox - G2_HW) / 2, py);
    });
    if (d.children && d.children.length) {
      const childTop = Math.min(...d.children.map(c => c.y)) - G2_HH;
      const midY = (py + G2_HH + childTop) / 2;
      const xs = d.children.map(c => c.x);
      baumG.append('line').attr('class', 'verbindung').attr('x1', px).attr('y1', py + G2_HH).attr('x2', px).attr('y2', midY);
      baumG.append('line').attr('class', 'verbindung').attr('x1', Math.min(px, ...xs)).attr('y1', midY).attr('x2', Math.max(px, ...xs)).attr('y2', midY);
      d.children.forEach(c => baumG.append('line').attr('class', 'verbindung').attr('x1', c.x).attr('y1', midY).attr('x2', c.x).attr('y2', c.y - G2_HH));
    }
  });
  // Vorfahren: Elternpaar (a.children) als Paar oben, Abstieg zur Kind-Person a
  ah.each(a => {
    if (!a.children || !a.children.length) return;
    const par = a.children;
    const py = par[0].y;
    const xs = par.map(p => p.x).sort((m, n) => m - n);
    if (par.length >= 2) {
      baumG.append('line').attr('class', 'ehe-linie').attr('x1', xs[0] + G2_HW).attr('y1', py).attr('x2', xs[xs.length - 1] - G2_HW).attr('y2', py);
      joint((xs[0] + xs[xs.length - 1]) / 2, py);
    }
    const mid = par.reduce((s, p) => s + p.x, 0) / par.length;
    const parentBottom = py + G2_HH;
    const childTop = a.y - G2_HH;
    const midY = (parentBottom + childTop) / 2;
    baumG.append('line').attr('class', 'verbindung').attr('x1', mid).attr('y1', parentBottom).attr('x2', mid).attr('y2', midY);
    baumG.append('line').attr('class', 'verbindung').attr('x1', Math.min(mid, a.x)).attr('y1', midY).attr('x2', Math.max(mid, a.x)).attr('y2', midY);
    baumG.append('line').attr('class', 'verbindung').attr('x1', a.x).attr('y1', midY).attr('x2', a.x).attr('y2', childTop);
  });

  // ── Geschwister der Fokusperson (gleiche Eltern): auf Fokus-Höhe neben dem Fokus zeigen ──
  const sibs = [];
  if (ah.children && ah.children.length) {
    const elternNodes = ah.children;                 // Eltern-Karten der Fokusperson (oben)
    const gezeichnet = new Set([focus]);
    dh.each(d => { gezeichnet.add(d.data.canon); (d.data.partners || []).forEach(p => gezeichnet.add(p)); });
    const sibCanons = [];
    elternNodes.forEach(pn => childrenOf(pn.data.canon).forEach(k => {
      if (!gezeichnet.has(k)) { gezeichnet.add(k); sibCanons.push(k); }
    }));
    if (sibCanons.length) {
      // Geschwister außerhalb der Nachkommen-Spanne des Fokus platzieren (kein Karten-Überlapp)
      let minX = 0, maxX = 0;
      dh.each(d => { minX = Math.min(minX, d.x); maxX = Math.max(maxX, d.x + G2_PAAR * ((d.data.partners || []).length)); });
      let lx = minX, rx = maxX;
      sibCanons.forEach((s, i) => {
        let x;
        if (i % 2 === 0) { lx -= 212; x = lx; } else { rx += 212; x = rx; }
        sibs.push({ canon: s, x, y: 0 });
      });
      // Abstieg vom Eltern-Paar zu jedem Geschwister (gleiche Sammelhöhe wie zum Fokus)
      const pm = elternNodes.reduce((s, c) => s + c.x, 0) / elternNodes.length;
      const py = elternNodes[0].y;
      const midY = (py + G2_HH + (0 - G2_HH)) / 2;
      sibs.forEach(sb => {
        baumG.append('line').attr('class', 'verbindung').attr('x1', Math.min(pm, sb.x)).attr('y1', midY).attr('x2', Math.max(pm, sb.x)).attr('y2', midY);
        baumG.append('line').attr('class', 'verbindung').attr('x1', sb.x).attr('y1', midY).attr('x2', sb.x).attr('y2', sb.y - G2_HH);
      });
    }
  }

  // ── Karten ──
  const drawCard = (canon, x, y) => {
    const g = baumG.append('g').attr('class', 'knoten-gruppe' + (canon === focus ? ' fokus' : ''))
      .attr('transform', `translate(${x},${y})`);
    zeichneKnotenBox(g, personOf(canon), 0, canon === focus, BLUTLINIE_IDS.has(model.nodes.get(canon).rep));
    pts.push({ x, y });
  };
  dh.each(d => {
    drawCard(d.data.canon, d.x, d.y);
    (d.data.partners || []).forEach((pt, i) => drawCard(pt, d.x + G2_PAAR * (i + 1), d.y));
  });
  ah.each(a => { if (a.data.canon !== focus) drawCard(a.data.canon, a.x, a.y); });
  sibs.forEach(sb => drawCard(sb.canon, sb.x, sb.y));

  aktualisiereKopf(rootPersonId);

  // ── Auto-Fit (wie Single-Root/Graph) ──
  if (!pts.length) return;
  const containerB = document.getElementById('baum-container').getBoundingClientRect();
  const breite = containerB.width, hoehe = containerB.height;
  const allX = pts.map(p => p.x), allY = pts.map(p => p.y);
  const tXMin = Math.min(...allX) - 170, tXMax = Math.max(...allX) + 170;
  const tYMin = Math.min(...allY) - 50,  tYMax = Math.max(...allY) + 50;
  const tW = tXMax - tXMin, tH = tYMax - tYMin;
  const pad = 0.03;
  const fitW = breite * (1 - 2 * pad), fitT = hoehe * pad, fitH = hoehe * (1 - 2 * pad);
  const skala = Math.min(fitW / tW, fitH / tH, 2.5);
  const cx = (tXMin + tXMax) / 2;
  const tx = breite / 2 - cx * skala;
  const ty = fitT + (fitH - tH * skala) / 2 - tYMin * skala;
  zoom.scaleExtent([skala * 0.9, 4.0]);
  baumPanGrenze = [[tXMin, tYMin], [tXMax, tYMax]];
  fitTransform = d3.zoomIdentity.translate(tx, ty).scale(skala);
  baumSvg.call(zoom.transform, fitTransform);
  baumG.selectAll('.daten-text').style('display', skala < 0.3 ? 'none' : null);
  aktualisiereBaumInfo();
}

function handleGedcomUpload(event) {
  const datei = event.target.files[0];
  if (!datei) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {

    } catch (err) {
      alert(t('upload_fehler') + err.message);
    }
  };

function parseGedcom(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const persons = {};
  const families = {};
  let curId = null, curType = null, curSub = null;
  
  for (const line of lines) {
    const parts = line.split(' ');
    const level = parts[0];
    
    if (level === '0') {
      const m = line.match(/^0\s+@(\w+)@\s+(\w+)/);
      if (m) {
        curId = m[1]; curType = m[2]; curSub = null;
        if (curType === 'INDI') {
          persons[curId] = {
            id: curId, name: '', given: '', surname: '', sex: '',
            birth_date: '', birth_place: '', death_date: '', death_place: '',
            deceased: false, families_spouse: [], families_child: []
          };
        } else if (curType === 'FAM') {
          families[curId] = {
            id: curId, husband: null, wife: null, children: [],
            marriage_date: '', marriage_place: ''
          };
        }
      } else { curId = null; curType = null; }
    } else if (!curId) {
      continue;
    } else if (level === '1') {
      const tag = parts[1];
      const value = parts.slice(2).join(' ');
      curSub = tag;
      if (curType === 'INDI') {
        const p = persons[curId];
        if (tag === 'NAME') {
          const m = value.match(/(.*?)\/(.*?)\//);
          if (m) {
            p.given = m[1].trim(); p.surname = m[2].trim();
            p.name = `${p.given} ${p.surname}`.trim();
          } else { p.name = value.trim(); }
        } else if (tag === 'SEX') { p.sex = value.trim(); }
        else if (tag === 'DEAT') { p.deceased = true; }
        else if (tag === 'FAMS') { const m = value.match(/@(\w+)@/); if (m) p.families_spouse.push(m[1]); }
        else if (tag === 'FAMC') { const m = value.match(/@(\w+)@/); if (m) p.families_child.push(m[1]); }
      } else if (curType === 'FAM') {
        const f = families[curId];
        if (tag === 'HUSB') { const m = value.match(/@(\w+)@/); if (m) f.husband = m[1]; }
        else if (tag === 'WIFE') { const m = value.match(/@(\w+)@/); if (m) f.wife = m[1]; }
        else if (tag === 'CHIL') { const m = value.match(/@(\w+)@/); if (m) f.children.push(m[1]); }
      }
    } else if (level === '2') {
      const tag = parts[1];
      const value = parts.slice(2).join(' ');
      if (curType === 'INDI') {
        const p = persons[curId];
        if (curSub === 'BIRT') {
          if (tag === 'DATE') p.birth_date = value.trim();
          else if (tag === 'PLAC') p.birth_place = value.trim();
        } else if (curSub === 'DEAT') {
          if (tag === 'DATE') p.death_date = value.trim();
          else if (tag === 'PLAC') p.death_place = value.trim();
        }
      } else if (curType === 'FAM' && curSub === 'MARR') {
        const f = families[curId];
        if (tag === 'DATE') f.marriage_date = value.trim();
        else if (tag === 'PLAC') f.marriage_place = value.trim();
      }
    }
  }
  return { persons, families };
}

const PDF_PAPIER_MM = { A4:[210,297], A3:[297,420], A2:[420,594], A1:[594,841], A0:[841,1189] };
const PDF_SVG_NS = 'http://www.w3.org/2000/svg';
const PDF_TREE_FARBEN = ['#c8a840','#5a9bd4','#7bb274','#d98b5f','#b07cc6','#d46a8a','#54b3b0','#c0b04a'];
let pdfBusy = false;

function pdfTiefen(opts) {
  let oben;
  const genVor = Math.max(0, parseInt(opts.genVor, 10) || 0);
  switch (opts.umfang) {
    case 'person': oben = 0; break;
    case 'eltern': oben = 1; break;
    case 'grosseltern': oben = 2; break;
    case 'urgrosseltern': oben = 3; break;
    case 'xgen': oben = Math.max(0, parseInt(opts.genZurueck, 10) || 0); break;
    default: oben = 999;
  }
  let unten = (opts.umfang === 'alles') ? 999 : genVor;
  if (opts.layout === 'ahnen') unten = 0;
  if (opts.layout === 'nachkommen') { oben = 0; unten = (opts.umfang === 'alles') ? 999 : (genVor || 999); }
  return { oben, unten };
}
// Modell bauen (reuse baueBaumDaten). Für „verknüpfte Bäume" wird der Baumfilter
// temporär aufgehoben -> die ganze über Verknüpfungen verbundene Menge.
function pdfBaueModell(opts) {
  if (!opts.wurzel || !aktuelleDaten.persons[opts.wurzel]) return null;
  const { oben, unten } = pdfTiefen(opts);
  const saved = aktuellerStammbaumId;
  try {
    if (opts.verknuepft) aktuellerStammbaumId = null;
    return baueBaumDaten(opts.wurzel, unten, oben);
  } finally { aktuellerStammbaumId = saved; }
}
// Personenfilter (bottom-up; verbindende, nicht passende Knoten werden gedimmt statt entfernt).
function pdfPasst(p, opts) {
  const verstorben = !!(p.deceased || p.death_date);
  if (opts.status === 'lebend' && verstorben) return false;
  if (opts.status === 'verstorben' && !verstorben) return false;
  if (opts.unbestaetigt && !(p.birth_date || p.death_date)) return false;
  if (opts.privat && (p.privat === true || p.privat === 'ja' || p._privat === true)) return false;
  return true;
}
function pdfFiltere(node, opts) {
  if (!node) return null;
  const behalten = [];
  (node.children || []).forEach(c => { const k = pdfFiltere(c, opts); if (k) behalten.push(k); });
  node.children = behalten;
  const selbstOk = pdfPasst(node.person, opts);
  if (selbstOk || behalten.length) { node._dim = !selbstOk; return node; }
  return null;
}
function pdfModellZahlen(node) {
  const pers = new Set(), trees = new Set(); let maxD = 0;
  (function walk(n, d) {
    if (!n) return;
    pers.add(n.person.id); if (n.person._tree) trees.add(n.person._tree);
    (n.partners || []).forEach(p => { pers.add(p.id); if (p._tree) trees.add(p._tree); });
    maxD = Math.max(maxD, d);
    (n.children || []).forEach(c => walk(c, d + 1));
  })(node, 0);
  return { personen: pers.size, baeume: trees.size, gens: maxD + 1 };
}
function pdfAutoPapier(n) { if (n > 500) return 'A0'; if (n > 250) return 'A1'; if (n > 100) return 'A2'; if (n > 25) return 'A3'; return 'A4'; }

function pdfBerechneEmpfehlung() {
