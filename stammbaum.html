<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidović — Porodično stablo</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f5ede0; --bg-soft: #ede0cc; --bg-card: #fffaf0;
  --paper: #fffaf0; --paper-soft: #f0e6d3;
  --ink: #2c2418; --akzent: #722f37; --akzent-hell: #9e4050;
  --gold: #9c7c3c; --gold-hell: #b8943f;
  --linie: #c4a882; --male: #3d6080; --female: #8b3d5a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Georgia','Times New Roman',serif;
  background: var(--bg); color: var(--ink); min-height: 100vh;
  padding-top: 58px;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(114,47,55,0.07) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(156,124,60,0.06) 0%, transparent 50%);
}
header {
  text-align: center; padding: 50px 20px 30px;
  border-bottom: 1px solid var(--linie);
}
header h1 {
  font-size: clamp(36px, 6vw, 64px);
  letter-spacing: 8px; font-weight: normal;
  color: var(--akzent); margin-bottom: 10px;
}
header .untertitel { font-style: italic; opacity: 0.7; letter-spacing: 2px; }
header .stats { margin-top: 20px; font-size: 13px; opacity: 0.6; letter-spacing: 2px; }

/* Fixe Navigationsleiste oben */
.top-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: var(--bg); border-bottom: 2px solid var(--linie);
  display: flex; align-items: center; justify-content: center;
  padding: 8px 20px;
  box-shadow: 0 2px 8px rgba(44,36,24,0.08);
}
.nav-controls {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  justify-content: center;
}
/* Sprach-Dropdown mit Flaggen */
.sprach-dropdown { position: relative; }
.sprach-toggle {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-soft); color: var(--ink);
  border: 1px solid var(--linie); padding: 7px 12px; cursor: pointer;
  font-family: inherit; font-size: 12px;
  letter-spacing: 1px; text-transform: uppercase;
  transition: border-color 0.2s;
}
.sprach-toggle:hover { border-color: var(--gold); }
.sprach-toggle .pfeil { font-size: 9px; opacity: 0.6; transition: transform 0.2s; }
.sprach-dropdown.offen .sprach-toggle .pfeil { transform: rotate(180deg); }
.flagge {
  width: 22px; height: 15px; flex: 0 0 auto;
  border: 1px solid rgba(44,36,24,0.25); border-radius: 2px;
  overflow: hidden; display: inline-block; line-height: 0;
}
.flagge svg { width: 100%; height: 100%; display: block; }
.sprach-menu {
  position: absolute; top: calc(100% + 4px); right: 0; z-index: 60;
  min-width: 160px; list-style: none;
  background: var(--paper); border: 1px solid var(--linie);
  box-shadow: 0 4px 14px rgba(44,36,24,0.18);
  display: none;
}
.sprach-dropdown.offen .sprach-menu { display: block; }
.sprach-menu li {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; cursor: pointer; font-size: 13px;
  letter-spacing: 0.5px; transition: background 0.15s;
}
.sprach-menu li:hover { background: var(--paper-soft); }
.sprach-menu li.aktiv { background: var(--akzent); color: var(--paper); }
.sprach-menu li.aktiv .flagge { border-color: rgba(255,255,255,0.4); }

.tab-gruppe {
  display: flex; background: var(--bg-soft);
  padding: 4px; border: 1px solid var(--linie);
}
.tab {
  background: transparent; color: var(--ink);
  border: none; padding: 10px 20px; cursor: pointer;
  font-family: inherit; font-size: 13px;
  letter-spacing: 2px; text-transform: uppercase;
  transition: all 0.3s;
}
.tab.aktiv { background: var(--akzent); color: var(--paper); }
.tab:hover:not(.aktiv) { color: var(--akzent); }

.suche, .filter, .upload-btn {
  background: var(--paper); color: var(--ink);
  border: 1px solid var(--linie);
  padding: 10px 15px; font-family: inherit; font-size: 14px;
}
.suche { min-width: 220px; }
.suche:focus, .filter:focus { outline: none; border-color: var(--gold); }
.upload-btn { cursor: pointer; letter-spacing: 1px; }
.upload-btn:hover { background: var(--akzent); border-color: var(--akzent); color: var(--paper); }
#gedcom-input { display: none; }

#ansicht-karten { display: none; max-width: 1400px; margin: 30px auto; padding: 0 20px; }
#ansicht-shorts { display: none; max-width: 1400px; margin: 30px auto; padding: 0 20px; }
.shorts-header { margin-bottom: 24px; }
.shorts-header h2 { font-size: clamp(28px, 4vw, 36px); color: var(--akzent); margin-bottom: 8px; }
.shorts-header p { color: #5e4b35; font-size: 14px; max-width: 760px; line-height: 1.6; }
.shorts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 24px;
}
.short-card {
  background: var(--paper); color: var(--ink);
  padding: 20px; border: 1px solid var(--linie);
  box-shadow: 0 2px 12px rgba(44,36,24,0.10);
  border-radius: 18px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
}
.short-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(44,36,24,0.16);
}
.short-card .thumb {
  background: linear-gradient(135deg, rgba(156,124,60,0.95), rgba(114,47,55,0.95));
  color: #fff; display: flex; align-items: center; justify-content: center;
  aspect-ratio: 16 / 9; border-radius: 14px; margin-bottom: 16px;
  font-size: 28px; font-weight: 700;
}
.short-card h3 { font-size: 18px; margin-bottom: 8px; }
.short-card p { font-size: 13px; line-height: 1.65; color: #5e4b35; min-height: 48px; }
.short-card .meta { margin-top: 14px; font-size: 12px; color: #7a6a50; letter-spacing: 0.6px; }
.person {
  background: var(--paper); color: var(--ink); padding: 18px;
  box-shadow: 0 2px 12px rgba(44,36,24,0.10), 0 0 0 1px rgba(156,124,60,0.3);
  transition: transform 0.25s, box-shadow 0.25s;
  cursor: pointer; position: relative;
}
.person:hover {
  transform: translateY(-4px) rotate(-0.5deg);
  box-shadow: 0 8px 24px rgba(44,36,24,0.15), 0 0 0 1px rgba(114,47,55,0.4);
}
.person.verstorben::before {
  content: '✝'; position: absolute; top: 8px; right: 12px;
  color: var(--akzent); font-size: 18px;
}
.person .avatar {
  width: 100%; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 56px; color: var(--paper);
  margin-bottom: 12px; font-family: serif; overflow: hidden;
}
.person .avatar.male { background: linear-gradient(135deg, var(--male), #2a4a65); }
.person .avatar.female { background: linear-gradient(135deg, var(--female), #6b2840); }
.person .avatar.unknown { background: linear-gradient(135deg, var(--gold), var(--akzent)); }
.person .avatar img { width: 100%; height: 100%; object-fit: cover; }
.person h3 { font-size: 17px; margin-bottom: 3px; }
.person .nachname { color: var(--akzent); font-style: italic; font-size: 13px; }
.person .daten {
  margin-top: 10px; font-size: 12px; color: #666;
  border-top: 1px solid #ddd; padding-top: 8px;
  font-family: 'Courier New', monospace;
}

#ansicht-baum { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
#baum-container {
  /* cover = füllt den Container vollständig; center 25% = Fokus auf die Krone */
  background: url('Hintergrundbilder/Bild4.jpg') center 25% / cover no-repeat, var(--bg-soft);
  border: 1px solid var(--linie);
  height: 90vh; min-height: 600px; overflow: hidden; position: relative;
}
/* Gradient-Overlay: Krone kaum überlagert, Stamm/Boden etwas mehr → Personen lesbar */
#baum-bg {
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(20, 15, 5, 0.08)  0%,
    rgba(20, 15, 5, 0.15) 40%,
    rgba(20, 15, 5, 0.35) 75%,
    rgba(20, 15, 5, 0.55) 100%
  );
  pointer-events: none; z-index: 0;
}
#baum-svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: default; z-index: 1; }

.baum-info {
  position: absolute; top: 15px; left: 15px;
  background: rgba(255,250,240,0.96); padding: 12px 18px;
  border: 1px solid var(--linie); font-size: 13px;
  max-width: 320px; z-index: 5;
  box-shadow: 0 2px 10px rgba(44,36,24,0.10);
}
.baum-info strong { color: var(--akzent); }
.baum-zurueck-btn {
  display: block; margin-top: 12px;
  background: none; border: 1px solid var(--akzent);
  color: var(--akzent); cursor: pointer;
  font-family: inherit; font-size: 12px;
  padding: 5px 10px; letter-spacing: 1px;
  transition: all 0.2s;
}
.baum-zurueck-btn:hover { background: var(--akzent); border-color: var(--akzent); color: var(--paper); }
.baum-hinweis { text-align: center; margin-top: 15px; font-size: 13px; opacity: 0.6; font-style: italic; }

.knoten rect { stroke-width: 1.8; cursor: pointer; transition: stroke 0.2s; }
.knoten.male rect   { fill: rgba(221,234,243,0.92); stroke: #4a7fa8; }
.knoten.female rect { fill: rgba(243,221,229,0.92); stroke: #9e4060; }
.knoten.unknown rect { fill: rgba(255,250,240,0.92); stroke: var(--gold); }
.knoten.fokus rect  { stroke: #fff; stroke-width: 3; }
.knoten:hover rect  { stroke: #fff; stroke-width: 2.5; }
.knoten.blutlinie rect { stroke: #c8a840; stroke-width: 3; }
/* Schatten damit Boxen sich vom Hintergrundbild abheben */
.knoten { filter: drop-shadow(0 2px 5px rgba(0,0,0,0.55)); }
.knoten text { font-family: 'Georgia', serif; fill: #1a1008; pointer-events: none; }
.knoten .name-text  { font-size: 16px; font-weight: bold; }
.knoten .daten-text { font-size: 12px; fill: #3a2a10; }
/* Verbindungslinien: warm-weißes Leuchten – gut sichtbar auf Grün/Gold */
.verbindung { fill: none; stroke: rgba(255,248,220,0.88); stroke-width: 2.5; }
/* Ehelinien: Gold passend zum Sonnenuntergang im Bild */
.ehe-linie { stroke: #d4a030; stroke-width: 2.5; stroke-dasharray: 6 3; }

.modal {
  display: none; position: fixed; inset: 0;
  background: rgba(44,36,24,0.75); z-index: 100;
  justify-content: center; align-items: center; padding: 20px;
}
.modal.aktiv { display: flex; }
.modal-inhalt {
  background: var(--paper); color: var(--ink);
  max-width: 550px; width: 100%; padding: 40px;
  position: relative; max-height: 90vh; overflow-y: auto;
}
.modal-schliessen {
  position: absolute; top: 12px; right: 18px;
  background: none; border: none; font-size: 28px;
  cursor: pointer; color: var(--ink);
}
.modal h2 { color: var(--akzent); margin-bottom: 6px; font-size: 28px; }
.modal .sub-name { font-style: italic; color: #888; margin-bottom: 20px; }
.modal .info-zeile { margin: 8px 0; padding: 8px 0; border-bottom: 1px solid #ddd; font-size: 14px; }
.modal .info-zeile strong { display: inline-block; min-width: 130px; color: #555; }
.modal .beziehungen { margin-top: 20px; padding-top: 20px; border-top: 2px solid var(--akzent); }
.modal .beziehungen h3 { color: var(--akzent); margin-bottom: 12px; font-size: 16px; letter-spacing: 2px; }
.modal .verwandter {
  display: inline-block; padding: 6px 12px; margin: 4px 6px 4px 0;
  background: var(--paper-soft); border: 1px solid var(--linie);
  cursor: pointer; font-size: 13px; transition: background 0.2s;
}
.modal .verwandter:hover { background: var(--gold-hell); }
.modal .baum-zeigen {
  margin-top: 25px; background: var(--akzent); color: var(--paper);
  border: none; padding: 12px 24px; cursor: pointer;
  font-family: inherit; letter-spacing: 2px;
  text-transform: uppercase; font-size: 13px;
}
.modal .baum-zeigen:hover { background: var(--akzent-hell); }
.event-editor {
  display: grid; gap: 18px;
}
.event-editor textarea {
  width: 100%; min-height: 140px; padding: 14px;
  border: 1px solid var(--linie); font-family: inherit;
  background: var(--paper); color: var(--ink);
  resize: vertical;
}
.event-upload-row {
  display: grid; gap: 14px;
}
.event-upload-row label {
  display: block; font-size: 13px; color: #5e4b35;
}
.event-upload-row input[type=file] {
  margin-top: 8px; width: 100%;
}
.event-media-preview {
  display: grid; gap: 12px; margin-top: 6px;
}
.event-media-preview img,
.event-media-preview video {
  width: 100%; max-height: 260px; border-radius: 14px;
  object-fit: cover;
}
.event-admin-hint {
  margin-top: 14px; font-size: 13px; color: #7a6a50; font-style: italic;
}
.event-status {
  margin-top: 10px; font-size: 13px; color: var(--akzent);
}
.modal .zurueck-btn {
  background: none; border: none; color: var(--akzent);
  cursor: pointer; font-family: inherit; font-size: 13px;
  padding: 0 0 14px 0; letter-spacing: 1px; display: block;
}
.modal .zurueck-btn:hover { color: var(--akzent-hell); }

.keine-treffer { text-align: center; padding: 60px 20px; opacity: 0.5; font-style: italic; grid-column: 1 / -1; }

footer {
  text-align: center; padding: 40px 20px;
  opacity: 0.5; font-size: 13px; font-style: italic;
  border-top: 1px solid var(--linie); margin-top: 60px;
}

@media (max-width: 600px) {
  body { padding-top: 0; }
  .top-nav { position: static; padding: 8px 12px; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .nav-controls { gap: 6px; }
  .sprach-menu { right: auto; left: 0; }
  header { padding-top: 20px; }
}

/* Auth-Bereich (Teil der Navigation) */
.auth-bereich {
  display: flex; gap: 8px; align-items: center;
}
.anmelden-btn {
  background: var(--akzent); color: var(--paper);
  border: none; padding: 8px 16px; cursor: pointer;
  font-family: inherit; font-size: 12px;
  letter-spacing: 1px; text-transform: uppercase;
  transition: background 0.2s;
}
.anmelden-btn:hover { background: var(--akzent-hell); }
.user-badge {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px;
}
.user-email { color: var(--ink); opacity: 0.8; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-rolle {
  background: var(--gold); color: var(--paper);
  padding: 3px 8px; font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase;
}
.abmelden-btn {
  background: none; border: 1px solid var(--linie);
  color: var(--ink); padding: 5px 10px; cursor: pointer;
  font-family: inherit; font-size: 11px; letter-spacing: 1px;
  transition: all 0.2s;
}
.abmelden-btn:hover { border-color: var(--akzent); color: var(--akzent); }

/* Login-Modal eigene Stile */
.login-feld {
  display: block; width: 100%; padding: 10px;
  border: 1px solid var(--linie); font-family: inherit;
  font-size: 14px; background: var(--paper); color: var(--ink);
  margin-top: 4px;
}
.login-feld:focus { outline: none; border-color: var(--gold); }
.login-label { font-size: 13px; color: #555; display: block; margin-top: 14px; }
.login-submit {
  margin-top: 20px; width: 100%; padding: 13px;
  background: var(--akzent); color: var(--paper);
  border: none; font-family: inherit; font-size: 14px;
  letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  transition: background 0.2s;
}
.login-submit:hover { background: var(--akzent-hell); }
.login-fehler {
  color: var(--akzent); font-size: 13px;
  margin-top: 10px; display: none;
}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-controls">
    <div class="tab-gruppe">
      <button class="tab" data-ansicht="karten" data-i18n="tab_karten"></button>
      <button class="tab" data-ansicht="shorts" data-i18n="tab_shorts"></button>
      <button class="tab aktiv" data-ansicht="baum" data-i18n="tab_baum"></button>
    </div>
    <input type="text" class="suche" id="suche" data-i18n-placeholder="suche_placeholder">
    <select class="filter" id="filter-nachname"></select>

    <!-- Sprach-Dropdown mit Flaggen -->
    <div class="sprach-dropdown" id="sprach-dropdown">
      <button class="sprach-toggle" id="sprach-toggle" aria-haspopup="listbox" aria-expanded="false">
        <span class="flagge" id="aktive-flagge"></span>
        <span id="aktive-sprache"></span>
        <span class="pfeil">▾</span>
      </button>
      <ul class="sprach-menu" id="sprach-menu" role="listbox"></ul>
    </div>

    <!-- Anmelden / Benutzer -->
    <div class="auth-bereich" id="auth-bereich">
      <button class="anmelden-btn" id="anmelden-btn" data-i18n="anmelden" onclick="zeigeLoginModal()"></button>
      <div class="user-badge" id="user-badge" style="display:none">
        <span class="user-email" id="user-email"></span>
        <span class="user-rolle" id="user-rolle"></span>
        <button class="abmelden-btn" data-i18n="abmelden" onclick="abmelden()"></button>
      </div>
    </div>

    <label class="upload-btn" for="gedcom-input" data-i18n="upload_btn"></label>
    <input type="file" id="gedcom-input" accept=".ged">
  </div>
</nav>

<header>
  <h1>VIDOVIĆ</h1>
  <p class="untertitel" data-i18n="untertitel"></p>
  <p class="stats" id="header-stats"></p>
</header>

<section id="ansicht-karten">
  <div class="personen" id="personen-grid"></div>
</section>

<section id="ansicht-shorts">
  <div class="shorts-header">
    <h2 data-i18n="shorts_titel"></h2>
    <p class="shorts-hinweis" data-i18n="shorts_hinweis"></p>
  </div>
  <div class="shorts-grid" id="shorts-grid"></div>
</section>

<section id="ansicht-baum">
  <div id="baum-container">
    <div id="baum-bg"></div>
    <div class="baum-info" id="baum-info"></div>
    <svg id="baum-svg"></svg>
  </div>
  <p class="baum-hinweis" data-i18n="baum_hinweis"></p>
</section>

<!-- Login Modal -->
<div class="modal" id="login-modal" onclick="if(event.target===this)schliesseLoginModal()">
  <div class="modal-inhalt" style="max-width:420px" onclick="event.stopPropagation()">
    <button class="modal-schliessen" onclick="schliesseLoginModal()">×</button>
    <h2 data-i18n="anmelden"></h2>
    <p class="sub-name">Stammbaum Vidović</p>
    <div id="login-fehler" class="login-fehler"></div>
    <label class="login-label"><span data-i18n="login_email"></span>
      <input type="email" id="login-email" class="login-feld" placeholder="name@beispiel.de" onkeydown="if(event.key==='Enter')anmelden()">
    </label>
    <label class="login-label"><span data-i18n="login_passwort"></span>
      <input type="password" id="login-passwort" class="login-feld" placeholder="••••••••" onkeydown="if(event.key==='Enter')anmelden()">
    </label>
    <button class="login-submit" data-i18n="anmelden" onclick="anmelden()"></button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-inhalt" onclick="event.stopPropagation()">
    <button class="modal-schliessen" onclick="schliesseModal()">×</button>
    <div id="modal-text"></div>
  </div>
</div>

<footer>
  <p data-i18n="footer"></p>
</footer>

<script>
// ============================================================
// SUPABASE AUTH
// ============================================================
const SUPABASE_URL  = 'https://tybvzhifvufgvlgjpmyl.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5YnZ6aGlmdnVmZ3ZsZ2pwbXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDIyMDQsImV4cCI6MjA5NTgxODIwNH0.VL1Z5bZN4t73ArS-uKLC1tAkt1yhQqflKJZ7XU5vA5Y';
const sbClient      = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let aktuellerUser  = null;
let aktuelleRolle  = null;

async function ladeAuth() {
  const { data: { session } } = await sbClient.auth.getSession();
  if (session) await setzeUser(session.user);

  sbClient.auth.onAuthStateChange(async (_event, session) => {
    if (session) await setzeUser(session.user);
    else          loescheUser();
  });
}

async function setzeUser(user) {
  aktuellerUser = user;
  const { data } = await sbClient
    .from('mitgliedschaften')
    .select('rolle')
    .eq('user_id', user.id)
    .limit(1)
    .maybeSingle();
  aktuelleRolle = data?.rolle || null;
  aktualisiereAuthUI();
}

function loescheUser() {
  aktuellerUser = null;
  aktuelleRolle = null;
  aktualisiereAuthUI();
}

function aktualisiereAuthUI() {
  const anmeldenBtn = document.getElementById('anmelden-btn');
  const badge       = document.getElementById('user-badge');
  const emailEl     = document.getElementById('user-email');
  const rolleEl     = document.getElementById('user-rolle');
  const uploadLabel = document.querySelector('label[for="gedcom-input"]');

  if (aktuellerUser) {
    anmeldenBtn.style.display = 'none';
    badge.style.display       = 'flex';
    emailEl.textContent       = aktuellerUser.email;
    rolleEl.textContent       = aktuelleRolle ? t('rolle_' + aktuelleRolle) : '';
    // Upload nur für Admins sichtbar
    if (uploadLabel) uploadLabel.style.display =
      ['super_admin','familien_admin'].includes(aktuelleRolle) ? '' : 'none';
  } else {
    anmeldenBtn.style.display = '';
    badge.style.display       = 'none';
    if (uploadLabel) uploadLabel.style.display = 'none';
  }
}

async function anmelden() {
  const email    = document.getElementById('login-email').value.trim();
  const passwort = document.getElementById('login-passwort').value;
  const fehlerEl = document.getElementById('login-fehler');
  fehlerEl.style.display = 'none';

  if (!email || !passwort) {
    fehlerEl.textContent   = t('login_pflicht');
    fehlerEl.style.display = 'block';
    return;
  }

  const { error } = await sbClient.auth.signInWithPassword({ email, password: passwort });
  if (error) {
    fehlerEl.textContent   = t('login_fehler_prefix') + error.message;
    fehlerEl.style.display = 'block';
  } else {
    schliesseLoginModal();
  }
}

async function abmelden() {
  await sbClient.auth.signOut();
}

function zeigeLoginModal() {
  document.getElementById('login-modal').classList.add('aktiv');
  setTimeout(() => document.getElementById('login-email').focus(), 50);
}

function schliesseLoginModal() {
  document.getElementById('login-modal').classList.remove('aktiv');
  document.getElementById('login-fehler').style.display = 'none';
  document.getElementById('login-email').value    = '';
  document.getElementById('login-passwort').value = '';
}

let aktuelleSprache = TEXTE[localStorage.getItem('vidovic_lang')] ? localStorage.getItem('vidovic_lang') : 'sr';
let aktuelleDaten = FAMILY_DATA;
let fokusPersonId = null;
let aktuelleAnsicht = 'baum';
let modalVerlauf = [];
let aktuelleModalPersonId = null;

function t(key, vars = {}) {
  let text = TEXTE[aktuelleSprache][key] || TEXTE.de[key] || key;
  Object.entries(vars).forEach(([k, v]) => {
    text = text.replace(`{${k}}`, v);
  });
  return text;
}

// ============================================================
// NAMEN-TRANSLITERATION — Serbische Lateinschrift → Kyrillisch
// Wird auf Personennamen + Überschrift angewendet, wenn "Српски"
// gewählt ist (Personendaten sind in Latein gespeichert).
// ============================================================
const SR_DIGRAFEN = [['Dž','Џ'],['DŽ','Џ'],['dž','џ'],['Lj','Љ'],['LJ','Љ'],['lj','љ'],['Nj','Њ'],['NJ','Њ'],['nj','њ']];
const SR_BUCHSTABEN = {
  'A':'А','B':'Б','C':'Ц','Č':'Ч','Ć':'Ћ','D':'Д','Đ':'Ђ','E':'Е','F':'Ф','G':'Г',
  'H':'Х','I':'И','J':'Ј','K':'К','L':'Л','M':'М','N':'Н','O':'О','P':'П','R':'Р',
  'S':'С','Š':'Ш','T':'Т','U':'У','V':'В','Z':'З','Ž':'Ж',
  'a':'а','b':'б','c':'ц','č':'ч','ć':'ћ','d':'д','đ':'ђ','e':'е','f':'ф','g':'г',
  'h':'х','i':'и','j':'ј','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','r':'р',
  's':'с','š':'ш','t':'т','u':'у','v':'в','z':'з','ž':'ж'
};
function srLat2Cyr(text) {
  if (!text) return text;
  let out = text;
  SR_DIGRAFEN.forEach(([lat, cyr]) => { out = out.split(lat).join(cyr); });
  let result = '';
  for (const ch of out) result += (SR_BUCHSTABEN[ch] !== undefined ? SR_BUCHSTABEN[ch] : ch);
  return result;
}
// Anzeigename: bei Auswahl "Српски" kyrillisch, sonst unverändert
function nm(text) {
  return aktuelleSprache === 'sr' ? srLat2Cyr(text) : text;
}

function wechselSprache(lang) {
  aktuelleSprache = lang;
  localStorage.setItem('vidovic_lang', lang);
  document.documentElement.lang = lang;
  
  // Sprach-Dropdown aktualisieren (aktiver Eintrag + Anzeige im Toggle)
  const sprachInfo = SPRACHEN.find(s => s.code === lang);
  if (sprachInfo) {
    document.getElementById('aktive-flagge').innerHTML = FLAGGEN[sprachInfo.flag];
    document.getElementById('aktive-sprache').textContent = sprachInfo.label;
  }
  document.querySelectorAll('#sprach-menu li').forEach(li => {
    li.classList.toggle('aktiv', li.dataset.lang === lang);
  });

  // Alle Elemente mit data-i18n übersetzen
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });

  // Überschrift (Familienname) ggf. kyrillisch
  const titelEl = document.querySelector('header h1');
  if (titelEl) titelEl.textContent = nm('VIDOVIĆ');

  // Dynamische Inhalte neu rendern
  aktualisiereStats();
  baueNachnameFilter();
  if (aktuelleAnsicht === 'karten') zeigeKarten();
  else if (aktuelleAnsicht === 'shorts') zeigeShorts();
  else aktualisiereBaumInfo();
  zeichneBaumNeu();
  aktualisiereAuthUI();
}

// Baum im aktuellen Zustand (Suche / Fokus / Vollansicht) neu zeichnen
function zeichneBaumNeu() {
  if (!baumG) return;
  const suche = document.getElementById('suche').value.trim();
  if (suche) suchImBaum(suche);
  else if (fokusPersonId && aktuelleDaten.persons[fokusPersonId]) zeichneBaum(fokusPersonId, 2, 2);
  else zeichneBaum('I500009', 10, 0);
}

// ============================================================
// SPRACH-DROPDOWN (Flaggen-Menü)
// ============================================================
function initSprachDropdown() {
  const dropdown = document.getElementById('sprach-dropdown');
  const toggle   = document.getElementById('sprach-toggle');
  const menu     = document.getElementById('sprach-menu');

  // Menü-Einträge aufbauen
  menu.innerHTML = SPRACHEN.map(s =>
    `<li role="option" data-lang="${s.code}">
       <span class="flagge">${FLAGGEN[s.flag]}</span>${s.name}
     </li>`
  ).join('');

  function schliesse() {
    dropdown.classList.remove('offen');
    toggle.setAttribute('aria-expanded', 'false');
  }

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const offen = dropdown.classList.toggle('offen');
    toggle.setAttribute('aria-expanded', offen ? 'true' : 'false');
  });

  menu.querySelectorAll('li').forEach(li => {
    li.addEventListener('click', () => {
      wechselSprache(li.dataset.lang);
      schliesse();
    });
  });

  // Klick außerhalb schließt das Menü
  document.addEventListener('click', (e) => {
    if (!dropdown.contains(e.target)) schliesse();
  });
}

  document.getElementById('gedcom-input').addEventListener('change', handleGedcomUpload);
  
  initBaum();

function handleSuche() {

function suchImBaum(suche) {
  if (!suche) {
    fokusPersonId = null;
    zeichneBaum('I500009', 10, 0);
    return;
  }

  const treffer = Object.values(aktuelleDaten.persons).filter(p =>
    p.name.toLowerCase().includes(suche.toLowerCase())
  );

  if (treffer.length === 0) {
    document.getElementById('baum-info').innerHTML =
      `<strong style="color:var(--akzent-hell)">${t('keine_treffer')}</strong>`;
    return;
  }

  if (treffer.length === 1) {
    zentriereAufPerson(treffer[0].id);
    return;
  }

  zeigAuswahlDialog(treffer);
}

function zentriereAufPerson(personId) {
  fokusPersonId = personId;
  zeichneBaum(personId, 2, 2);
}

function zeigAuswahlDialog(treffer) {
  const liste = treffer.map(p => {
    const info = [p.birth_date ? '* ' + p.birth_date : '', p.birth_place].filter(Boolean).join(', ');
    return `<span class="verwandter" onclick="waehleAusBaum('${p.id}')">${escapeHtml(nm(p.name))}${info ? ' <small style="color:#888">(' + escapeHtml(info) + ')</small>' : ''}</span>`;
  }).join('');

  document.getElementById('modal-text').innerHTML = `
    <h2>${t('auswahl_titel')}</h2>
    <p class="sub-name">${t('auswahl_hinweis')}</p>
    <div class="beziehungen" style="border-top:none;padding-top:0">${liste}</div>
  `;
  document.getElementById('modal').classList.add('aktiv');
}

function waehleAusBaum(personId) {
  schliesseModal();
  zentriereAufPerson(personId);
}

function aktualisiereBaumInfo() {
  if (fokusPersonId && aktuelleDaten.persons[fokusPersonId]) {
    const p = aktuelleDaten.persons[fokusPersonId];
    document.getElementById('baum-info').innerHTML =
      t('baum_zentriert', {name: escapeHtml(nm(p.name))}) +

  } else {
    document.getElementById('baum-info').innerHTML = t('baum_info_hinweis');
  }
}

function zeigVollenBaum() {
  fokusPersonId = null;
  zeichneBaum('I500009', 10, 0);
}

function baueNachnameFilter() {
  const nachnamen = {};
  Object.values(aktuelleDaten.persons).forEach(p => {
    const n = p.surname || t('filter_unbekannt');
    nachnamen[n] = (nachnamen[n] || 0) + 1;
  });
  const select = document.getElementById('filter-nachname');
  const aktuell = select.value;
  select.innerHTML = `<option value="">${t('filter_alle')}</option>`;
  Object.entries(nachnamen)
    .sort((a,b) => b[1] - a[1])
    .forEach(([n, c]) => {
      const o = document.createElement('option');
      o.value = n;
      o.textContent = `${nm(n)} (${c})`;
      select.appendChild(o);
    });
  if (aktuell) select.value = aktuell;
}

function zeigeKarten() {
  const suche = document.getElementById('suche').value.toLowerCase();
  const nachname = document.getElementById('filter-nachname').value;
  const grid = document.getElementById('personen-grid');
  
  const gefiltert = Object.values(aktuelleDaten.persons).filter(p => {
    if (suche && !p.name.toLowerCase().includes(suche)) return false;
    if (nachname) {
      const pn = p.surname || t('filter_unbekannt');
      if (pn !== nachname) return false;
    }
    return true;
  }).sort((a,b) => {
    const ja = parseInt(a.birth_date) || 9999;
    const jb = parseInt(b.birth_date) || 9999;
    if (ja !== jb) return ja - jb;
    return a.name.localeCompare(b.name);
  });
  
  if (gefiltert.length === 0) {
    grid.innerHTML = `<div class="keine-treffer">${t('keine_treffer')}</div>`;
    return;
  }
  
  grid.innerHTML = '';
  gefiltert.forEach(p => {
    const karte = document.createElement('div');
    karte.className = 'person' + (p.deceased ? ' verstorben' : '');
    karte.onclick = () => zeigeDetails(p.id);
    
    const initialen = nm(((p.given[0] || '') + (p.surname[0] || '')).toUpperCase()) || '?';
    const avatarKlasse = p.sex === 'M' ? 'male' : (p.sex === 'F' ? 'female' : 'unknown');
    
    let lebensdaten = '';
    if (p.birth_date || p.death_date) {
      lebensdaten = `* ${p.birth_date || '?'}`;
      if (p.deceased || p.death_date) lebensdaten += ` † ${p.death_date || '?'}`;
    }
    
    karte.innerHTML = `
      <div class="avatar ${avatarKlasse}">${initialen}</div>
      <h3>${escapeHtml(nm(p.given || '?'))}</h3>
      <p class="nachname">${escapeHtml(nm(p.surname || ''))}</p>
      ${lebensdaten ? `<div class="daten">${lebensdaten}</div>` : ''}
      ${p.birth_place ? `<div class="daten">📍 ${escapeHtml(p.birth_place)}</div>` : ''}
    `;
    grid.appendChild(karte);
  });
}

function getEventConfig(eventId) {
  const events = EVENTS_DATA[aktuelleSprache] || EVENTS_DATA.de;
  const base = events.find(e => e.id === eventId);
  if (!base) return null;

  const saved = JSON.parse(localStorage.getItem(`event_edit_${aktuelleSprache}_${eventId}`) || '{}');
  return { ...base, ...saved };
}

function wertSpeichern(eventId, updates) {
  const key = `event_edit_${aktuelleSprache}_${eventId}`;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  const merged = { ...saved, ...updates };
  localStorage.setItem(key, JSON.stringify(merged));
}

async function uploadEventMedia(eventId, file) {
  if (!file || !aktuellerUser) return { url: null, error: 'No file or unauthenticated.' };
  const bucket = 'events';
  const path = `${eventId}/${Date.now()}_${file.name}`;
  const { data, error } = await sbClient.storage.from(bucket).upload(path, file, {
    cacheControl: '3600',
    upsert: false,
  });
  if (error) {
    console.warn('Upload fehlgeschlagen', error.message);
    return { url: null, error: error.message };
  }
  const { data: urlData, error: signError } = await sbClient.storage.from(bucket).createSignedUrl(path, 60 * 60 * 24);
  if (signError) {
    console.warn('Signed URL fehlgeschlagen', signError.message);
    return { url: null, error: signError.message };
  }
  return { url: urlData?.signedUrl || null, error: null };
}

function renderEventMedia(eventId) {
  const key = `event_media_${aktuelleSprache}_${eventId}`;
  const media = JSON.parse(localStorage.getItem(key) || '[]');
  return media;
}

function addEventMedia(eventId, mediaItem) {
  const key = `event_media_${aktuelleSprache}_${eventId}`;
  const media = JSON.parse(localStorage.getItem(key) || '[]');
  media.unshift(mediaItem);
  localStorage.setItem(key, JSON.stringify(media));
}

function zeigeShorts() {
  const suche = document.getElementById('suche').value.toLowerCase();
  const grid = document.getElementById('shorts-grid');
  const events = EVENTS_DATA[aktuelleSprache] || EVENTS_DATA.de;

  const gefiltert = events.filter(event => {
    const current = getEventConfig(event.id);
    const searchable = [current.title, current.subtitle, current.organizers, current.location, current.details].join(' ').toLowerCase();
    return !suche || searchable.includes(suche);
  });

  if (gefiltert.length === 0) {
    grid.innerHTML = `<div class="keine-treffer">${t('keine_treffer')}</div>`;

  grid.innerHTML = '';
  gefiltert.forEach(event => {

    karte.onclick = () => zeigeShort(event.id);
    karte.innerHTML = `
      <div class="thumb">▶</div>
      <h3>${escapeHtml(nm(item.title))}</h3>
      <p>${escapeHtml(nm(item.location))}</p>
      <div class="meta">${escapeHtml(nm(item.subtitle))}</div>
      <div class="meta" style="margin-top:12px; font-size: 12px; color: #7a6a50;">${escapeHtml(nm(item.organizers))}</div>
    `;

}

function zeigeShort(shortId) {

    ${isAdmin ? `<button class="baum-zeigen" onclick="zeigeEventEditor('${shortId}')">${t('event_edit')}</button>` : ''}

function zeigeEventEditor(eventId) {
  const event = getEventConfig(eventId);
  if (!event) return;
  const media = renderEventMedia(eventId);

  document.getElementById('modal-text').innerHTML = `
    <h2>${escapeHtml(nm(event.title))}</h2>
    <div class="event-editor">
      <label>${t('event_description')}<br>
        <textarea id="event-details-input">${escapeHtml(nm(event.details))}</textarea>
      </label>
      <div class="event-upload-row">
        <label>${t('event_upload_images')}<br><input type="file" id="event-image-input" accept="image/*" multiple></label>
        <label>${t('event_upload_videos')}<br><input type="file" id="event-video-input" accept="video/*" multiple></label>
      </div>
      <div class="event-media-preview">${media.map(m => m.type.startsWith('image/') ? `<img src="${m.url}" alt="${escapeHtml(m.name)}" />` : `<video controls src="${m.url}"></video>`).join('')}</div>
      <div class="event-editor-actions">
        <button class="baum-zeigen" id="event-save-btn">${t('event_save')}</button>
        <button class="zurueck-btn" onclick="zeigeShort('${eventId}')">${t('event_cancel')}</button>
      </div>
      <div class="event-status" id="event-status"></div>
    </div>
  `;
  document.getElementById('modal').classList.add('aktiv');

  document.getElementById('event-save-btn').addEventListener('click', async () => {
    const details = document.getElementById('event-details-input').value.trim();
    wertSpeichern(eventId, { details });
    const imageFiles = document.getElementById('event-image-input').files;
    const videoFiles = document.getElementById('event-video-input').files;
    const status = document.getElementById('event-status');
    const button = document.getElementById('event-save-btn');
    button.disabled = true;
    status.textContent = t('event_uploading');

    const uploads = [...imageFiles, ...videoFiles];
    for (const file of uploads) {
      const result = await uploadEventMedia(eventId, file);
      if (result?.url) {
        addEventMedia(eventId, { url: result.url, name: file.name, type: file.type });
      } else if (result?.error) {
        status.textContent = `${t('event_uploading')} ${result.error}`;
        button.disabled = false;
        return;
      }
    }

    status.textContent = t('event_saved');
    button.disabled = false;
    setTimeout(() => status.textContent = '', 3000);
  });
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function zeigeDetails(personId) {
  if (document.getElementById('modal').classList.contains('aktiv') && aktuelleModalPersonId) {
    modalVerlauf.push(aktuelleModalPersonId);
  }
  aktuelleModalPersonId = personId;
  const p = aktuelleDaten.persons[personId];
  if (!p) return;
  
  const eltern = [];
  p.families_child.forEach(famId => {
    const fam = aktuelleDaten.families[famId];
    if (fam) {
      if (fam.husband && aktuelleDaten.persons[fam.husband]) eltern.push(aktuelleDaten.persons[fam.husband]);
      if (fam.wife && aktuelleDaten.persons[fam.wife]) eltern.push(aktuelleDaten.persons[fam.wife]);
    }
  });
  
  const geschwister = [];
  p.families_child.forEach(famId => {
    const fam = aktuelleDaten.families[famId];
    if (fam) {
      fam.children.forEach(cid => {
        if (cid !== personId && aktuelleDaten.persons[cid]) geschwister.push(aktuelleDaten.persons[cid]);
      });
    }
  });
  
  // Ehen mit je Partner und zugehörigen Kindern
  const eheFamilien = [];
  p.families_spouse.forEach(famId => {
    const fam = aktuelleDaten.families[famId];
    if (fam) {
      const partnerId = fam.husband === personId ? fam.wife : fam.husband;
      const partnerPerson = partnerId ? aktuelleDaten.persons[partnerId] : null;
      const famKinder = fam.children.filter(cid => aktuelleDaten.persons[cid]).map(cid => aktuelleDaten.persons[cid]);
      eheFamilien.push({ partner: partnerPerson, kinder: famKinder });
    }
  });

  const buildVerwandte = (liste) => liste.map(v =>
    `<span class="verwandter" onclick="zeigeDetails('${v.id}')">${escapeHtml(nm(v.name))}</span>`
  ).join('');

  const geschlechtText = p.sex === 'M' ? t('maennlich') : (p.sex === 'F' ? t('weiblich') : t('unbekannt'));

  // Ehe-Block: bei mehreren Ehen pro Ehe gruppiert, sonst flach
  const eheHtml = eheFamilien.length > 1
    ? eheFamilien.map((ef, i) => `
        <div class="beziehungen">
          <h3>${t('partner')} ${i + 1}</h3>
          ${ef.partner ? `<span class="verwandter" onclick="zeigeDetails('${ef.partner.id}')">${escapeHtml(nm(ef.partner.name))}</span>` : ''}
          ${ef.kinder.length ? `<div style="margin-top:8px"><strong style="font-size:12px;color:#777;letter-spacing:1px">${t('kinder')}:</strong><br>${buildVerwandte(ef.kinder)}</div>` : ''}
        </div>`).join('')
    : `${eheFamilien[0]?.partner ? `<div class="beziehungen"><h3>${t('partner')}</h3>${`<span class="verwandter" onclick="zeigeDetails('${eheFamilien[0].partner.id}')">${escapeHtml(nm(eheFamilien[0].partner.name))}</span>`}</div>` : ''}
       ${eheFamilien[0]?.kinder?.length ? `<div class="beziehungen"><h3>${t('kinder')}</h3>${buildVerwandte(eheFamilien[0].kinder)}</div>` : ''}`;

  document.getElementById('modal-text').innerHTML = `
    ${modalVerlauf.length > 0 ? `<button class="zurueck-btn" onclick="geheZurueck()">← ${t('zurueck')}</button>` : ''}
    <h2>${escapeHtml(nm(p.given || '?'))}</h2>
    <p class="sub-name">${escapeHtml(nm(p.surname || ''))}</p>

    ${p.birth_date ? `<div class="info-zeile"><strong>${t('geboren')}</strong> ${escapeHtml(p.birth_date)}</div>` : ''}
    ${p.birth_place ? `<div class="info-zeile"><strong>${t('geburtsort')}</strong> ${escapeHtml(p.birth_place)}</div>` : ''}
    ${p.deceased || p.death_date ? `<div class="info-zeile"><strong>${t('verstorben')}</strong> ${escapeHtml(p.death_date || t('ja'))}</div>` : ''}
    ${p.death_place ? `<div class="info-zeile"><strong>${t('sterbeort')}</strong> ${escapeHtml(p.death_place)}</div>` : ''}
    <div class="info-zeile"><strong>${t('geschlecht')}</strong> ${geschlechtText}</div>

    ${eltern.length ? `<div class="beziehungen"><h3>${t('eltern')}</h3>${buildVerwandte(eltern)}</div>` : ''}
    ${eheHtml}
    ${geschwister.length ? `<div class="beziehungen"><h3>${t('geschwister')}</h3>${buildVerwandte(geschwister)}</div>` : ''}

    <button class="baum-zeigen" onclick="schliesseModalUndZeigeBaum('${p.id}')">${t('baum_zeigen')}</button>
  `;
  document.getElementById('modal').classList.add('aktiv');
}

  document.getElementById('modal').classList.remove('aktiv');
  modalVerlauf = [];
  aktuelleModalPersonId = null;

    aktuelleModalPersonId = null;

function wechselAnsicht(name) {
  aktuelleAnsicht = name;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('aktiv', t.dataset.ansicht === name);
  });
  document.getElementById('ansicht-karten').style.display = name === 'karten' ? 'block' : 'none';
  document.getElementById('ansicht-shorts').style.display = name === 'shorts' ? 'block' : 'none';
  document.getElementById('ansicht-baum').style.display = name === 'baum' ? 'block' : 'none';

  if (name === 'baum') {
    const suche = document.getElementById('suche').value.trim();
    if (suche) {
      suchImBaum(suche);
    } else if (!fokusPersonId) {
      zeichneBaum('I500009', 10, 0);

  } else if (name === 'karten') {
    zeigeKarten();
  } else if (name === 'shorts') {
    zeigeShorts();
  }
}

// ============================================================
// STAMMBAUM (d3.js)
// ============================================================
let baumSvg, baumG, zoom, fitTransform = null;

function initBaum() {
  baumSvg = d3.select('#baum-svg');
  baumG = baumSvg.append('g');

  zoom = d3.zoom()
    .scaleExtent([0.05, 3.0])
    .on('zoom', e => {
      baumG.attr('transform', e.transform);
      // Adaptive Schriftgröße: Mindest 11px auf dem Bildschirm für Namen
      const k = e.transform.k;
      const nfs = Math.max(16, 11 / k);
      const dfs = Math.max(12, 9 / k);
      baumG.selectAll('.name-text').attr('font-size', nfs + 'px');
      baumG.selectAll('.daten-text')
        .attr('font-size', dfs + 'px')
        .style('display', k < 0.35 ? 'none' : null);
    });
  baumSvg.call(zoom);

  // Doppelklick → zurück zur Fit-Ansicht
  baumSvg.on('dblclick.zoom', null);
  baumSvg.on('dblclick', function() {
    if (fitTransform) {
      baumSvg.transition().duration(500).call(zoom.transform, fitTransform);
    }
  });
}

function zeichneBaum(rootPersonId, tiefeUnten = 2, tiefeOben = 2) {
  baumG.selectAll('*').remove();

  const wurzel = baueBaumDaten(rootPersonId, tiefeUnten, tiefeOben);
  if (!wurzel) return;
  
  const containerB = document.getElementById('baum-container').getBoundingClientRect();
  const breite = containerB.width;
  const hoehe = containerB.height;
  
  // Reingold-Tilford via d3.tree().
  // nodeSize[0]=300: Pärchen-Breite 270px + 30px Puffer → garantiert kein Überlapp.
  // separation: Geschwister 1.0, andere Familien 1.5.
  const treeLayout = d3.tree()
    .nodeSize([300, 130])
    .separation((a, b) => a.parent === b.parent ? 1.0 : 1.5);
  const wurzelNode = d3.hierarchy(wurzel);
  treeLayout(wurzelNode);

  // y-Koordinaten negieren → Baum wächst von unten nach oben
  wurzelNode.each(d => { d.y = -d.y; });

  // Kollisions-Check (Konsolen-Warnung bei Überlapp, sollte nicht vorkommen)
  kollisionsPrüfung(wurzelNode);

  // Orthogonale T-Verbindungen (kein Bezier, kein Diagonalen)
  zeichneVerbindungen(wurzelNode);

  // ── Knoten: Hauptperson + Partner ──────────────────────────────
  const knoten = baumG.selectAll('.knoten-gruppe')
    .data(wurzelNode.descendants())
    .enter().append('g')
    .attr('class', d => 'knoten-gruppe' + (d.data.person.id === rootPersonId ? ' fokus' : ''))
    .attr('transform', d => `translate(${d.x},${d.y})`);

  knoten.each(function(d) {
    const g = d3.select(this);
    const p = d.data.person;
    const istBl = !!d.data.blutlinie;

    if (d.data.marriages && d.data.marriages.length >= 2) {
      const wife1 = d.data.marriages[0].partner;
      const wife2 = d.data.marriages[1].partner;
      if (wife1) g.append('line').attr('class', 'ehe-linie')
        .attr('x1', -5).attr('y1', 0).attr('x2', -135).attr('y2', 0);
      if (wife2) g.append('line').attr('class', 'ehe-linie')
        .attr('x1', 5).attr('y1', 0).attr('x2', 135).attr('y2', 0);
      zeichneKnotenBox(g, p, 0, p.id === rootPersonId, istBl);
      if (wife1) zeichneKnotenBox(g, wife1, -140, false, false);
      if (wife2) zeichneKnotenBox(g, wife2, 140, false, false);
    } else {
      const partners = d.data.partners;
      const N = partners.length;
      const offset = i => -70 * N + 140 * i;
      for (let i = 0; i < N; i++) {
        g.append('line').attr('class', 'ehe-linie')
          .attr('x1', offset(i) + 65).attr('y1', 0)
          .attr('x2', offset(i + 1) - 65).attr('y2', 0);
      }
      zeichneKnotenBox(g, p, offset(0), p.id === rootPersonId, istBl);
      partners.forEach((partner, i) => {
        zeichneKnotenBox(g, partner, offset(i + 1), false, false);
      });
    }
  });

  // Bounding Box: halbe Kartenbreite (65) + max. Partner-Versatz (70) = 135
  const allX = wurzelNode.descendants().map(d => d.x);
  const allY = wurzelNode.descendants().map(d => d.y);
  const tXMin = Math.min(...allX) - 145;
  const tXMax = Math.max(...allX) + 145;
  const tYMin = Math.min(...allY) - 30;
  const tYMax = Math.max(...allY) + 30;
  const tW = tXMax - tXMin, tH = tYMax - tYMin;

  // Auto-Fit: Blutlinie (x=0) auf die horizontale Mitte des Containers setzen.
  // Skala so wählen, dass der gesamte Baum in den Container passt.
  const pad = 0.03;
  const padPx = breite * pad;
  const fitT = hoehe * pad, fitH = hoehe * (1 - 2 * pad);

  // Beide Hälften (links / rechts von x=0) müssen in je eine Container-Hälfte passen.
  const hHalf = breite / 2 - padPx;
  const skala_h = Math.min(
    tXMax > 0 ? hHalf / tXMax : 5,
    tXMin < 0 ? hHalf / (-tXMin) : 5
  );
  const skala_v = fitH / tH;
  const skala = Math.min(skala_h, skala_v, 2.5);
  const tx = breite / 2;                                         // x=0 → Bildmitte
  const ty = fitT + (fitH - tH * skala) / 2 - tYMin * skala;

  // Zoom-Bereich: minZoom = Fit-Ansicht (90%), maxZoom = 3.0
  zoom.scaleExtent([skala * 0.9, 3.0]);

  fitTransform = d3.zoomIdentity.translate(tx, ty).scale(skala);
  baumSvg.call(zoom.transform, fitTransform);

  // Initiale Schriftgrößen sofort setzen (ohne auf Zoom-Event zu warten)
  const nfs = Math.max(16, 11 / skala);
  const dfs = Math.max(12, 9 / skala);
  baumG.selectAll('.name-text').attr('font-size', nfs + 'px');
  baumG.selectAll('.daten-text')
    .attr('font-size', dfs + 'px')
    .style('display', skala < 0.35 ? 'none' : null);
  
  aktualisiereBaumInfo();
}

// Orthogonale T-Verbindungen: Eltern → Sammellinie → Kinder (kein Bezier, keine Diagonalen).
function zeichneVerbindungen(wurzelNode) {
  const HH = 30; // halbe Kartenhöhe

  // Links nach (Eltern-ID + FamilienIndex) gruppieren
  const gruppen = new Map();
  wurzelNode.links().forEach(link => {
    const src = link.source;
    const famIdx = link.target.data.familyIndex ?? 0;
    const key = src.data.person.id + '_' + famIdx;
    if (!gruppen.has(key)) gruppen.set(key, { src, famIdx, targets: [] });
    gruppen.get(key).targets.push(link.target);
  });

  gruppen.forEach(({ src, famIdx, targets }) => {
    // Abstiegspunkt: Mitte der Heiratslinie des Elternpaares
    const istMehrehe = !!(src.data.marriages && src.data.marriages.length >= 2);
    const descentX = istMehrehe ? src.x + (famIdx === 0 ? -70 : 70) : src.x;

    const srcBottom = src.y + HH;
    const childTop  = targets[0].y - HH;
    const midY      = (srcBottom + childTop) / 2;

    const xs       = targets.map(t => t.x);
    const collXMin = Math.min(descentX, ...xs);
    const collXMax = Math.max(descentX, ...xs);

    // 1. Vertikale Linie: Elternteil → Sammelpunkt
    baumG.append('line').attr('class', 'verbindung')
      .attr('x1', descentX).attr('y1', srcBottom)
      .attr('x2', descentX).attr('y2', midY);
    // 2. Horizontale Sammellinie bei midY
    baumG.append('line').attr('class', 'verbindung')
      .attr('x1', collXMin).attr('y1', midY)
      .attr('x2', collXMax).attr('y2', midY);
    // 3. Vertikale Stubs zu jedem Kind
    targets.forEach(t => {
      baumG.append('line').attr('class', 'verbindung')
        .attr('x1', t.x).attr('y1', midY)
        .attr('x2', t.x).attr('y2', childTop);
    });
  });
}

// Kollisions-Check: Warnung wenn zwei Knotengruppen in derselben Generation überlappen.
function kollisionsPrüfung(wurzelNode) {
  const CW = 135; // halber Paar-Fußabdruck (Person ±65 + Partner-Versatz 70)
  const MIN_GAP = 20;

  const genMap = new Map();
  wurzelNode.each(d => {
    const gy = Math.round(d.y / 10) * 10;
    if (!genMap.has(gy)) genMap.set(gy, []);
    genMap.get(gy).push(d);
  });

  genMap.forEach((nodes, gy) => {
    nodes.sort((a, b) => a.x - b.x);
    for (let i = 0; i < nodes.length - 1; i++) {
      const a = nodes[i], b = nodes[i + 1];
      const gap = (b.x - CW) - (a.x + CW);
      if (gap < MIN_GAP) {
        console.warn(`Überlapp y≈${gy}: ${a.data.person.given} ↔ ${b.data.person.given}, Abstand=${gap.toFixed(0)}px`);
      }
    }
  });
}

// Mehrreihige Anordnung: >4 Kinder → 2 Zeilen, >8 → 3 Zeilen.
// ROW = 100 > (130 − 2×30 = 70) → kein Kartenüberlapp mit Enkeln der Parallelzeile.
// Enthält eine Gruppe ein Blutlinien-Kind, wird diese Gruppe so positioniert,
// dass das Blutlinien-Kind exakt unter dem Elternteil liegt (x = node.x).
function applyMehrZeilen(node) {
  if (!node.children || node.children.length <= 4) {
    if (node.children) node.children.forEach(applyMehrZeilen);
    return;
  }
  const N = node.children.length;
  const rows = N > 8 ? 3 : 2;
  const COL = 280;
  const ROW = 100;

  const xs = node.children.map(c => c.x);
  const centerX = (Math.min(...xs) + Math.max(...xs)) / 2;
  const baseY = node.children[0].y;

  const groups = Array.from({length: rows}, () => []);
  node.children.forEach((child, i) => {
    groups[Math.min(rows - 1, Math.floor(i * rows / N))].push(child);
  });

  groups.forEach((group, ri) => {
    const n = group.length;
    const rowY = baseY - ri * ROW;
    // Blutlinien-Kind in dieser Gruppe? → es wird auf x = node.x gesetzt
    const blIdx = group.findIndex(c => c.data.blutlinie);
    const startX = blIdx >= 0
      ? node.x - blIdx * COL          // Blutlinien-Kind genau unter Elternteil
      : centerX - (n - 1) * COL / 2;  // sonst zentriert
    group.forEach((child, j) => {
      const dx = startX + j * COL - child.x;
      const dy = rowY - child.y;
      child.each(d => { d.x += dx; d.y += dy; });
    });
  });

  node.children.forEach(applyMehrZeilen);
}

// Zeichnet eine Personen-Box an xOffset relativ zum Gruppen-Ursprung.
function zeichneKnotenBox(g, p, xOffset, istFokus, istBlutlinie) {
  const sex = p.sex;
  const klasse = sex === 'M' ? 'male' : (sex === 'F' ? 'female' : 'unknown');
  const extra = (istFokus ? ' fokus' : '') + (istBlutlinie ? ' blutlinie' : '');

  const box = g.append('g')
    .attr('class', 'knoten ' + klasse + extra)
    .attr('transform', `translate(${xOffset},0)`)
    .style('cursor', 'pointer')
    .on('click', () => zeigeDetails(p.id));

  // Karte: 130×60 px
  box.append('rect')
    .attr('x', -65).attr('y', -30)
    .attr('width', 130).attr('height', 60)
    .attr('rx', 6);

  const gn = nm(p.given || '?');
  box.append('text').attr('class', 'name-text')
    .attr('text-anchor', 'middle').attr('y', -10)
    .text(gn.length > 15 ? gn.substring(0, 13) + '…' : gn);

  const sn = nm(p.surname || '');
  box.append('text').attr('class', 'name-text')
    .attr('text-anchor', 'middle').attr('y', 6)
    .text(sn.length > 15 ? sn.substring(0, 13) + '…' : sn);

  if (p.birth_date || p.death_date) {
    let dat = p.birth_date ? '* ' + p.birth_date : '';
    if (p.deceased || p.death_date) dat += (dat ? '  ' : '') + '† ' + (p.death_date || '?');
    box.append('text').attr('class', 'daten-text')
      .attr('text-anchor', 'middle').attr('y', 22)
      .text(dat);
  }
}

// Blutlinie: Tanasije → Simo → Marko (direkte Abstammungslinie)
const BLUTLINIE_IDS = new Set(['I500009', 'I500007', 'I500003']);
const BLUTLINIE_KINDER = { 'I500009': 'I500007', 'I500007': 'I500003' };

function baueBaumDaten(rootId, tiefeNachUnten = 2, tiefeNachOben = 2) {
  if (!aktuelleDaten.persons[rootId]) return null;

  function findeWurzel(personId, tiefe) {
    if (tiefe <= 0) return personId;
    const p = aktuelleDaten.persons[personId];
    if (!p || !p.families_child.length) return personId;
    const fam = aktuelleDaten.families[p.families_child[0]];
    if (!fam) return personId;
    const elternId = fam.husband || fam.wife;
    if (!elternId || !aktuelleDaten.persons[elternId]) return personId;
    return findeWurzel(elternId, tiefe - 1);
  }

  const wurzelId = findeWurzel(rootId, tiefeNachOben);
  const besucht = new Set();

  function baueKnoten(personId, tiefe) {
    if (besucht.has(personId)) return null;
    besucht.add(personId);
    const p = aktuelleDaten.persons[personId];
    if (!p) return null;

    const familien = [];
    p.families_spouse.forEach(famId => {
      const fam = aktuelleDaten.families[famId];
      if (!fam) return;
      const partnerId = fam.husband === personId ? fam.wife : fam.husband;
      const partner = (partnerId && aktuelleDaten.persons[partnerId] && !besucht.has(partnerId))
        ? aktuelleDaten.persons[partnerId] : null;
      if (partner) besucht.add(partnerId);
      familien.push({ partner, kinderIds: fam.children || [] });
    });

    const partners = familien.map(f => f.partner).filter(Boolean);
    const marriages = familien.length >= 2 ? familien.map(f => ({ partner: f.partner })) : null;
    const blutlinie = BLUTLINIE_IDS.has(personId);

    const knoten = { person: p, partners, marriages, familyIndex: null, children: [], blutlinie };

    if (tiefe <= 0) return knoten;

    if (familien.length >= 2) {
      familien.forEach((fam, famIdx) => {
        fam.kinderIds.forEach(cid => {
          const kindKnoten = baueKnoten(cid, tiefe - 1);
          if (kindKnoten) { kindKnoten.familyIndex = famIdx; knoten.children.push(kindKnoten); }
        });
      });
    } else {
      const kinderIds = new Set();
      familien.forEach(fam => fam.kinderIds.forEach(c => kinderIds.add(c)));
      kinderIds.forEach(cid => {
        const kindKnoten = baueKnoten(cid, tiefe - 1);
        if (kindKnoten) knoten.children.push(kindKnoten);
      });
    }

    // Blutlinien-Kind in die Mitte stellen → Reingold-Tilford zentriert es unter dem Elternteil
    const blChild = BLUTLINIE_KINDER[personId];
    if (blChild && knoten.children.length > 1) {
      const blIdx = knoten.children.findIndex(c => c.person.id === blChild);
      if (blIdx >= 0) {
        const centerIdx = Math.floor(knoten.children.length / 2);
        const [bl] = knoten.children.splice(blIdx, 1);
        knoten.children.splice(centerIdx, 0, bl);
      }
    }

    return knoten;
  }

  return baueKnoten(wurzelId, tiefeNachOben + tiefeNachUnten);
}

function handleGedcomUpload(event) {
  const datei = event.target.files[0];
  if (!datei) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const geparst = parseGedcom(e.target.result);
      aktuelleDaten = geparst;
      fokusPersonId = null;
      baueNachnameFilter();
      aktualisiereStats();
      zeigeKarten();
      const p = Object.keys(geparst.persons).length;
      const f = Object.keys(geparst.families).length;
      alert(t('upload_erfolg', {p, f}));
    } catch (err) {
      alert(t('upload_fehler') + err.message);
    }
  };
  reader.readAsText(datei, 'UTF-8');
}

function parseGedcom(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const persons = {};
  const families = {};
  let curId = null, curType = null, curSub = null;
  
  for (const line of lines) {
    const parts = line.split(' ');
    const level = parts[0];
    
    if (level === '0') {
      const m = line.match(/^0\s+@(\w+)@\s+(\w+)/);
      if (m) {
        curId = m[1]; curType = m[2]; curSub = null;
        if (curType === 'INDI') {
          persons[curId] = {
            id: curId, name: '', given: '', surname: '', sex: '',
            birth_date: '', birth_place: '', death_date: '', death_place: '',
            deceased: false, families_spouse: [], families_child: []
          };
        } else if (curType === 'FAM') {
          families[curId] = {
            id: curId, husband: null, wife: null, children: [],
            marriage_date: '', marriage_place: ''
          };
        }
      } else { curId = null; curType = null; }
    } else if (!curId) {
      continue;
    } else if (level === '1') {
      const tag = parts[1];
      const value = parts.slice(2).join(' ');
      curSub = tag;
      if (curType === 'INDI') {
        const p = persons[curId];
        if (tag === 'NAME') {
          const m = value.match(/(.*?)\/(.*?)\//);
          if (m) {
            p.given = m[1].trim(); p.surname = m[2].trim();
            p.name = `${p.given} ${p.surname}`.trim();
          } else { p.name = value.trim(); }
        } else if (tag === 'SEX') { p.sex = value.trim(); }
        else if (tag === 'DEAT') { p.deceased = true; }
        else if (tag === 'FAMS') { const m = value.match(/@(\w+)@/); if (m) p.families_spouse.push(m[1]); }
        else if (tag === 'FAMC') { const m = value.match(/@(\w+)@/); if (m) p.families_child.push(m[1]); }
      } else if (curType === 'FAM') {
        const f = families[curId];
        if (tag === 'HUSB') { const m = value.match(/@(\w+)@/); if (m) f.husband = m[1]; }
        else if (tag === 'WIFE') { const m = value.match(/@(\w+)@/); if (m) f.wife = m[1]; }
        else if (tag === 'CHIL') { const m = value.match(/@(\w+)@/); if (m) f.children.push(m[1]); }
      }
    } else if (level === '2') {
      const tag = parts[1];
      const value = parts.slice(2).join(' ');
      if (curType === 'INDI') {
        const p = persons[curId];
        if (curSub === 'BIRT') {
          if (tag === 'DATE') p.birth_date = value.trim();
          else if (tag === 'PLAC') p.birth_place = value.trim();
        } else if (curSub === 'DEAT') {
          if (tag === 'DATE') p.death_date = value.trim();
          else if (tag === 'PLAC') p.death_place = value.trim();
        }
      } else if (curType === 'FAM' && curSub === 'MARR') {
        const f = families[curId];
        if (tag === 'DATE') f.marriage_date = value.trim();
        else if (tag === 'PLAC') f.marriage_place = value.trim();
      }
    }
  }
  return { persons, families };
}
