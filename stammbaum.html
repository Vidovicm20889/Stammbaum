// ---- Live-Updates für Obavještenja (Polling, kein Reload nötig) ---------------
// Pollt im Hintergrund ~alle 12 s, solange ein Admin eingeloggt und der Tab
// sichtbar ist. Neue Einträge erscheinen sofort in Badge + Liste und werden
// einmalig hervorgehoben (obav-neu-anim). Mehrere Tabs pollen unabhängig ->
// konsistent; Netzunterbruch wird beim nächsten Tick automatisch nachgeholt.
let obavPollTimer = null;
let obavNeuIds = new Set();   // Element-ids frisch eingetroffener Einträge -> Highlight

async function obavLivePoll() {
  if (!aktuellerUser || !istAdmin()) return;
  // IDs VOR dem Nachladen merken, um wirklich NEU hinzugekommene zu erkennen.
  const alt = new Set([
    ...offeneAnfragenCache.map(a => 'obav-' + a.id),
    ...vknAnfragenCache.map(v => 'obav-vkn-' + v.id)
  ]);
  await ladeOffeneAnfragen();   // aktualisiert Cache + Badge live
  [...offeneAnfragenCache.map(a => 'obav-' + a.id),
   ...vknAnfragenCache.map(v => 'obav-vkn-' + v.id)]
    .filter(id => !alt.has(id))
    .forEach(id => obavNeuIds.add(id));
  // Liste nur neu zeichnen, wenn das Overlay gerade offen ist
  if (document.getElementById('obav-modal')?.classList.contains('aktiv')) renderObavListe();
}

function startObavPolling() {
  stopObavPolling();
  if (!aktuellerUser || !istAdmin()) return;
  obavPollTimer = setInterval(() => {
    if (document.visibilityState === 'visible') obavLivePoll();
  }, 12000);
}
function stopObavPolling() {
  if (obavPollTimer) { clearInterval(obavPollTimer); obavPollTimer = null; }
}

// ---- Live-Sync der Baumdaten (P1, Supabase Realtime) -------------------------
// Abonniert INSERT/UPDATE/DELETE auf personen/beziehungen/stammbaeume und spielt
// Änderungen ohne Reload (kein F5) ein: bei einem Event wird DEBOUNCED der Baum
// neu geladen (ladeBaumDaten behält den offenen Baum + rendert Karten/Beziehungen/
// Dropdown/Statistiken neu). RLS liefert nur sichtbare Zeilen -> Isolation bleibt.
// WICHTIG: Der Realtime-Callback darf den Inaktivitäts-/Auto-Logout-Timer NICHT
// zurücksetzen (kein resetInaktivTimer/sessAktivitaet hier) — sonst kein Auto-Logout.
// Gilt für ALLE eingeloggten Nutzer (auch lesende Mitglieder), nicht nur Admins.
let realtimeChannel = null;
let realtimeReloadTimer = null;
let realtimeReloadLaeuft = false;
let realtimePendingReload = false;

function startRealtimeSync() {
  stopRealtimeSync();
  if (!aktuellerUser) return;
  try {
    const handler = () => realtimeReloadAnstossen();
    realtimeChannel = sbClient
      .channel('stammbaum-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'personen' },    handler)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'beziehungen' },  handler)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'stammbaeume' },  handler)
      .subscribe();
  } catch (e) {
    console.warn('Realtime-Live-Sync nicht verfügbar:', e);
    realtimeChannel = null;
  }
}

function stopRealtimeSync() {
  if (realtimeReloadTimer) { clearTimeout(realtimeReloadTimer); realtimeReloadTimer = null; }
  realtimePendingReload = false;
  if (realtimeChannel) {
    try { sbClient.removeChannel(realtimeChannel); } catch (e) {}
    realtimeChannel = null;
  }
}

// Debounced: erst ~700 ms nach dem LETZTEN Event neu laden (mehrere Änderungen
// einer Aktion = ein Reload). Bei verstecktem Tab aufschieben (visibilitychange holt nach).
function realtimeReloadAnstossen() {
  if (!aktuellerUser) return;
  if (document.visibilityState !== 'visible') { realtimePendingReload = true; return; }
  if (realtimeReloadTimer) clearTimeout(realtimeReloadTimer);
  realtimeReloadTimer = setTimeout(realtimeReloadAusfuehren, 700);
}

async function realtimeReloadAusfuehren() {
  realtimeReloadTimer = null;
  if (!aktuellerUser) return;
  if (realtimeReloadLaeuft) { realtimePendingReload = true; return; }  // kein paralleler Reload
  realtimeReloadLaeuft = true;
  realtimePendingReload = false;
  try {
    if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
    pruefeOverlayAktualitaet();   // P3: offene Personen-Overlays auf Live-Änderungen prüfen
    aktualisiereProfilLeise();    // Profil<->Karte-Sync: eigenes Profil/Badge live nachziehen
  } catch (e) {
    console.warn('Live-Sync-Reload fehlgeschlagen:', e);
  } finally {
    realtimeReloadLaeuft = false;
    if (realtimePendingReload) realtimeReloadAnstossen();   // während Reload kam neues Event
  }
}

// ---- Live-Benachrichtigungen (Realtime) -------------------------------------
// benachrichtigungen hat eine echte RLS-SELECT-Policy (eigene Zeilen) -> Supabase
// Realtime liefert NUR die eigenen Zeilen. Trifft eine neue Benachrichtigung ein
// (z. B. Event-Einladung), wird der Ungelesen-Indikator am Profilsymbol SOFORT
// aktualisiert — ohne Klick/Reload. Wie der Live-Sync: KEIN Zurücksetzen des
// Inaktivitäts-Timers (ladeBenachrichtigungen fasst sessAktivitaet nicht an);
// gilt für ALLE eingeloggten Nutzer. DB: benachrichtigungen muss in der Publication
// supabase_realtime liegen (supabase_benachrichtigungen_realtime.sql).
let benachrChannel     = null;
let benachrReloadTimer = null;
let benachrPending     = false;

function startBenachrSync() {
  stopBenachrSync();
  if (!aktuellerUser) return;
  try {
    benachrChannel = sbClient
      .channel('benachr-sync')
      .on('postgres_changes',
          { event: '*', schema: 'public', table: 'benachrichtigungen', filter: 'user_id=eq.' + aktuellerUser.id },
          () => benachrSyncAnstossen())
      .subscribe();
  } catch (e) {
    console.warn('Benachrichtigungs-Live-Sync nicht verfügbar:', e);
    benachrChannel = null;
  }
}

function stopBenachrSync() {
  if (benachrReloadTimer) { clearTimeout(benachrReloadTimer); benachrReloadTimer = null; }
  benachrPending = false;
  if (benachrChannel) {
    try { sbClient.removeChannel(benachrChannel); } catch (e) {}
    benachrChannel = null;
  }
}

function benachrSyncAnstossen() {
  if (!aktuellerUser) return;
  if (document.visibilityState !== 'visible') { benachrPending = true; return; }   // versteckter Tab: nachholen
  if (benachrReloadTimer) clearTimeout(benachrReloadTimer);
  benachrReloadTimer = setTimeout(() => { benachrReloadTimer = null; ladeBenachrichtigungen(); }, 400);
}

// ---- Live-Indikator (P2, Supabase Realtime Presence) ------------------------
// Zeigt, wer gerade DENSELBEN Stammbaum geöffnet hat. Eigener Channel je Baum
// (presence:tree:<id>) -> beim Baumwechsel wird umgeklinkt. Wie der Live-Sync:
// KEIN Zurücksetzen des Inaktivitäts-Timers; gilt für ALLE eingeloggten Nutzer.
let presenceChannel = null;
let presenceTreeId  = null;
let presenceUsers   = [];   // [{ user_id, name, email }] — eindeutige Nutzer am Baum
// P4 (Soft-Lock, exklusiv): wer bearbeitet gerade welche Person (über Presence-Broadcast).
let presenceLocks   = {};   // externe Personen-ID -> { user_id, name } (NUR fremde Sperren)
let meinLockPerson  = null; // externe ID der Person, die ICH gerade gesperrt habe (im Editor)

// Benutzer-Profil (Konto-Stammdaten + Avatar) des eingeloggten Nutzers (Phase 1).
let meinProfil = null;
// Ausstehende Avatar-Änderung im offenen Profil-Editor:
//   undefined = unverändert | null = beim Speichern löschen | { mainBlob, thumbBlob, previewUrl } = neu
let profilAvatarPending = undefined;
// Platzhalter-Avatar (kein Bild gesetzt) — dezentes goldenes Personen-Icon (SVG, kein Request).
const AVATAR_PLATZHALTER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
  '<rect width="100" height="100" fill="#f6f1e7"/>' +
  '<circle cx="50" cy="38" r="20" fill="#c8a44d"/>' +
  '<path d="M16 92c0-20 16-32 34-32s34 12 34 32z" fill="#c8a44d"/></svg>'
);

// Eigenen Presence-Stand setzen (inkl. evtl. aktiver Bearbeitungssperre). track() ersetzt die
// gesamte Nutzlast -> Standardfelder immer mitsenden.
async function presenceTrack(editing) {
  if (!presenceChannel || !aktuellerUser) return;
  meinLockPerson = editing || null;
  try {
    await presenceChannel.track({
      user_id: aktuellerUser.id,
      name:    nutzerAnzeigeName(),
      email:   aktuellerUser.email || '',
      // Avatar (Thumb) nur teilen, wenn nicht „privat" — Verbund/Familie sind am
      // selben Baum ohnehin im selben Verbund (Isolation bleibt gewahrt).
      avatar:  (meinProfil && meinProfil.avatar_sichtbarkeit !== 'privat')
                 ? (meinProfil.avatar_thumb_url || meinProfil.avatar_url || '') : '',
      editing: meinLockPerson
    });
  } catch (e) {}
}

// Freundlicher Anzeigename: bevorzugt den Profilnamen (Vor-/Nachname), sonst aus der
// E-Mail abgeleitet (vor dem @; Trenner -> Leerzeichen; Wortanfänge groß).
function nutzerAnzeigeName() {
  if (meinProfil && (meinProfil.vorname || meinProfil.nachname)) {
    const n = [meinProfil.vorname, meinProfil.nachname].filter(Boolean).join(' ').trim();
    if (n) return n;
  }
  const mail  = (aktuellerUser && aktuellerUser.email) || '';
  const lokal = mail.split('@')[0] || mail;
  const teile = lokal.split(/[._\-]+/).filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1));
  return teile.join(' ') || mail;
}

// ============================================================
// CHAT (1:1 + Gruppen, verbundweit) — Supabase Realtime (wie Live-Sync der Baumdaten)
// Geltungsbereich = verbund_id (CLAUDE.md). Transport: echte RLS-SELECT-Policies +
// Publication supabase_realtime. Der Realtime-Callback setzt den Inaktivitäts-/
// Auto-Logout-Timer NICHT zurück (eingehende Nachrichten zählen nicht als Aktivität).
// ============================================================
let chatNutzer       = [];     // verbund_nutzer(): [{user_id, anzeigename, avatar_url, familie_name, baum_namen}]
let chatNutzerMap    = {};     // user_id -> Nutzer
let chatListe        = [];     // [{id, typ, name, erstellt_am, teilnehmer:[{user_id,ist_gruppen_admin}], letzteText, letzteZeit, letzteGeloescht, ungelesen}]
let chatById         = {};     // id -> Eintrag aus chatListe
let chatAktivId      = null;   // aktuell geöffneter Chat
let chatNachrichten  = [];     // Nachrichten des offenen Chats
let chatNeuAuswahl   = new Set();
let chatGeladen      = false;  // Nutzerliste schon geladen?
let chatChannel      = null;   // Realtime-Channel
let chatLiveTimer    = null;
let chatLivePending  = false;
let chatTippInit     = false;  // tippAuswahl nur einmal binden

// ---- Lifecycle (analog startRealtimeSync/startPresence) ----------------------
async function startChat() {
  stopChat();
  if (!aktuellerUser || !sbClient) return;
  try {
    await chatLadeNutzer();
    await chatLadeListe();
  } catch (e) { console.warn('Chat-Initialladung:', e); }
  try {
    chatChannel = sbClient.channel('chat-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_nachrichten' }, () => chatLiveAnstossen())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_teilnehmer'  }, () => chatLiveAnstossen())
      .subscribe();
  } catch (e) { console.warn('Chat-Realtime nicht verfügbar:', e); chatChannel = null; }
}
function stopChat() {
  if (chatLiveTimer) { clearTimeout(chatLiveTimer); chatLiveTimer = null; }
  chatLivePending = false;
  if (chatChannel) { try { sbClient.removeChannel(chatChannel); } catch (e) {} chatChannel = null; }
  chatNutzer = []; chatNutzerMap = {}; chatListe = []; chatById = {};
  chatAktivId = null; chatNachrichten = []; chatNeuAuswahl.clear(); chatGeladen = false;
  chatBadgeAktualisieren();
}
// Debounced Live-Reload; bei verstecktem Tab aufschieben (visibilitychange holt nach).
// WICHTIG: KEIN resetInaktivTimer/sessAktivitaet hier (wie Live-Sync/Presence).
function chatLiveAnstossen() {
  if (!aktuellerUser) return;
  if (document.visibilityState !== 'visible') { chatLivePending = true; return; }
  if (chatLiveTimer) clearTimeout(chatLiveTimer);
  chatLiveTimer = setTimeout(chatLiveAusfuehren, 500);
}
async function chatLiveAusfuehren() {
  chatLiveTimer = null;
  if (!aktuellerUser) return;
  try {
    await chatLadeListe();
    if (chatAktivId && document.getElementById('chat-modal').classList.contains('aktiv')) {
      await chatLadeNachrichten(chatAktivId, true);
      // Unterhaltung ist offen & sichtbar (Tab visible, sonst liefe diese Funktion gar nicht):
      // eingehende Nachrichten SOFORT als gelesen markieren, damit das Ungelesen-Badge nicht
      // stehen bleibt (Bug: "1" blieb bis zum erneuten Klick auf die Person). Nur markieren,
      // wenn wirklich Ungelesene da sind — sonst löst das eigene chat_gelesen-UPDATE wieder ein
      // Realtime-Event aus → Endlosschleife. Nach dem Markieren ist ungelesen=0 → Schleife endet.
      const aktiv = chatById[chatAktivId];
      if (aktiv && aktiv.ungelesen > 0) {
        try { await sbClient.rpc('chat_gelesen', { p_chat: chatAktivId }); } catch (e) {}
        await chatLadeListe();   // Liste + Badge nach dem Gelesen-Markieren aktualisieren
      }
    }
  } catch (e) { console.warn('Chat-Live-Reload:', e); }
  finally { if (chatLivePending) { chatLivePending = false; chatLiveAnstossen(); } }
}
// Nachhol-Refresh, wenn der Tab wieder sichtbar wird (kein Timer-Reset).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && chatLivePending && aktuellerUser) {
    chatLivePending = false; chatLiveAnstossen();
  }
});

// ---- Datenladen -------------------------------------------------------------
async function chatLadeNutzer() {
  const { data, error } = await sbClient.rpc('verbund_nutzer');
  if (error) { console.warn('verbund_nutzer:', error.message); return; }
  chatNutzer = data || [];
  chatNutzerMap = {};
  chatNutzer.forEach(u => { chatNutzerMap[u.user_id] = u; });
  chatGeladen = true;
}
async function chatLadeListe() {
  if (!aktuellerUser) return;
  const me = aktuellerUser.id;
  const { data: meine, error: e1 } = await sbClient
    .from('chat_teilnehmer').select('chat_id, zuletzt_gelesen_am').eq('user_id', me);
  if (e1) { console.warn('chat_teilnehmer (eigene):', e1.message); return; }
  const ids = (meine || []).map(r => r.chat_id);
  if (!ids.length) { chatListe = []; chatById = {}; chatRenderListe(); chatBadgeAktualisieren(); return; }
  const gelesenMap = {};
  (meine || []).forEach(r => { gelesenMap[r.chat_id] = r.zuletzt_gelesen_am; });

  const [{ data: chats }, { data: alleT }, { data: msgs }] = await Promise.all([
    sbClient.from('chats').select('id, typ, name, erstellt_am').in('id', ids),
    sbClient.from('chat_teilnehmer').select('chat_id, user_id, ist_gruppen_admin').in('chat_id', ids),
    sbClient.from('chat_nachrichten').select('chat_id, text, erstellt_am, absender_id, geloescht')
      .in('chat_id', ids).order('erstellt_am', { ascending: false }).limit(500)
  ]);

  const teilnByChat = {};
  (alleT || []).forEach(t => { (teilnByChat[t.chat_id] = teilnByChat[t.chat_id] || []).push(t); });

  chatListe = (chats || []).map(c => {
    const gelesen = gelesenMap[c.id];
    const chatMsgs = (msgs || []).filter(m => m.chat_id === c.id);   // bereits desc sortiert
    const letzte = chatMsgs[0] || null;
    const ungelesen = chatMsgs.filter(m =>
      m.absender_id !== me && (!gelesen || new Date(m.erstellt_am) > new Date(gelesen))).length;
    return {
      id: c.id, typ: c.typ, name: c.name, erstellt_am: c.erstellt_am,
      teilnehmer: teilnByChat[c.id] || [],
      letzteText: letzte ? (letzte.geloescht ? '' : letzte.text) : '',
      letzteGeloescht: letzte ? letzte.geloescht : false,
      letzteZeit: letzte ? letzte.erstellt_am : c.erstellt_am,
      ungelesen
    };
  }).sort((a, b) => new Date(b.letzteZeit) - new Date(a.letzteZeit));

  chatById = {}; chatListe.forEach(c => { chatById[c.id] = c; });
  chatRenderListe();
  chatBadgeAktualisieren();
}
async function chatLadeNachrichten(chatId, nurRender) {
  if (!chatId) return;
  const { data, error } = await sbClient.from('chat_nachrichten')
    .select('*').eq('chat_id', chatId).order('erstellt_am', { ascending: true }).limit(500);
  if (error) { console.warn('chat_nachrichten:', error.message); return; }
  chatNachrichten = data || [];
  chatRenderKonversation();
  if (!nurRender) {
    try { await sbClient.rpc('chat_gelesen', { p_chat: chatId }); } catch (e) {}
    chatLadeListe();   // Ungelesen-Badge aktualisieren
  }
}

// ---- Öffnen/Schließen -------------------------------------------------------
async function oeffneChat() {
  if (!aktuellerUser) return;
  document.getElementById('avatar-menu')?.classList.remove('offen');
  document.getElementById('chat-modal').classList.add('aktiv');
  if (!chatTippInit) {
    chatTippInit = true;
    tippAuswahl(document.getElementById('chat-liste'),    '.chat-listitem', el => chatOeffneKonversation(el.dataset.id));
    tippAuswahl(document.getElementById('chat-neu-liste'), '.chat-pers-row', el => chatNeuToggle(el.dataset.uid));
  }
  if (!chatGeladen) { try { await chatLadeNutzer(); } catch (e) {} }
  await chatLadeListe();
  // War beim Wieder-Öffnen noch eine Unterhaltung aktiv: frisch laden UND als gelesen markieren
  // (nurRender=false → chat_gelesen), sonst die leere Spalte zeigen.
  if (chatAktivId) { await chatLadeNachrichten(chatAktivId, false); }
  else { chatZeigeLeer(); }
}
function schliesseChat() {
  document.getElementById('chat-modal').classList.remove('aktiv');
}
function chatZeigeLeer() {
  chatAktivId = null;
  document.getElementById('chat-body').classList.remove('konv-offen');
  const konv = document.getElementById('chat-konv');
  konv.innerHTML = `<div class="chat-konv-leer">${escapeHtml(t('chat_leer'))}</div>`;
  chatRenderListe();
}
function chatZurueck() { chatZeigeLeer(); }

// ---- Anzeige-Helfer ---------------------------------------------------------
function chatNameVon(uid) {
  if (uid === (aktuellerUser && aktuellerUser.id)) return t('chat_du');
  const u = chatNutzerMap[uid];
  return u ? nm(u.anzeigename) : '—';
}
function chatTitelVon(c) {
  if (c.typ === 'gruppe') return c.name || t('chat_gruppe');
  const me = aktuellerUser.id;
  const other = (c.teilnehmer || []).find(p => p.user_id !== me);
  return other ? chatNameVon(other.user_id) : t('chat_titel');
}
function chatAvatarVon(c) {
  if (c.typ === 'direkt') {
    const me = aktuellerUser.id;
    const other = (c.teilnehmer || []).find(p => p.user_id !== me);
    const u = other && chatNutzerMap[other.user_id];
    if (u && u.avatar_url) return u.avatar_url;
  }
  return AVATAR_PLATZHALTER;
}
function chatZeit(iso) {
  if (!iso) return '';
  const d = new Date(iso), jetzt = new Date();
  const loc = { de: 'de-DE', sr: 'sr-RS', hr: 'hr-HR', ba: 'bs-BA', en: 'en-US' }[aktuelleSprache] || 'de-DE';
  const zeit = d.toLocaleTimeString(loc, { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === jetzt.toDateString()) return zeit;
  const gestern = new Date(jetzt); gestern.setDate(jetzt.getDate() - 1);
  if (d.toDateString() === gestern.toDateString()) return t('chat_gestern') + ' ' + zeit;
  const datum = d.toLocaleDateString(loc, { day: '2-digit', month: '2-digit',
    year: d.getFullYear() === jetzt.getFullYear() ? undefined : '2-digit' });
  return datum + ' ' + zeit;
}

// ---- Liste rendern ----------------------------------------------------------
function chatRenderListe() {
  const box = document.getElementById('chat-liste');
  if (!box) return;
  if (!chatListe.length) {
    box.innerHTML = `<div class="chat-leer-hinweis">${escapeHtml(t('chat_keine_chats'))}<br>` +
      `<span style="opacity:.8">${escapeHtml(t('chat_keine_chats_hint'))}</span></div>`;
    return;
  }
  box.innerHTML = chatListe.map(c => {
    const aktiv = c.id === chatAktivId ? ' aktiv' : '';
    const preview = c.letzteGeloescht ? t('chat_geloescht') : (c.letzteText || '');
    const badge = c.ungelesen > 0 ? `<span class="chat-unread">${c.ungelesen}</span>` : '';
    return `<div class="chat-listitem${aktiv}" data-id="${escapeHtml(c.id)}">
      <img class="chat-li-avatar" src="${escapeHtml(chatAvatarVon(c))}" alt="" onerror="this.src='${AVATAR_PLATZHALTER}'">
      <div class="chat-li-haupt">
        <div class="chat-li-name">${escapeHtml(chatTitelVon(c))}</div>
        <div class="chat-li-preview">${escapeHtml(preview)}</div>
      </div>
      <div class="chat-li-meta">
        <span class="chat-li-zeit">${escapeHtml(chatZeit(c.letzteZeit))}</span>
        ${badge}
      </div>
    </div>`;
  }).join('');
}

// ---- Konversation -----------------------------------------------------------
async function chatOeffneKonversation(chatId) {
  chatAktivId = chatId;
  document.getElementById('chat-body').classList.add('konv-offen');
  await chatLadeNachrichten(chatId);
  chatRenderListe();
}
function chatRenderKonversation() {
  const c = chatById[chatAktivId];
  if (!c) return;
  const konv = document.getElementById('chat-konv');
  const me = aktuellerUser.id;
  let sub;
  if (c.typ === 'gruppe') {
    sub = t('chat_mitglieder', { n: (c.teilnehmer || []).length });
  } else {
    const other = (c.teilnehmer || []).find(p => p.user_id !== me);
    const u = other && chatNutzerMap[other.user_id];
    sub = u ? [u.familie_name, u.baum_namen].filter(Boolean).join(' · ') : '';
  }
  const infoBtn = c.typ === 'gruppe'
    ? `<button class="chat-konv-menu-btn" onclick="chatInfoOeffnen()" title="${escapeHtml(t('chat_info'))}">ⓘ</button>` : '';

  // Nachrichten-Bubbles mit Tagestrennern
  let html = '', letzterTag = '';
  (chatNachrichten || []).forEach(m => {
    const tag = new Date(m.erstellt_am).toDateString();
    if (tag !== letzterTag) {
      letzterTag = tag;
      html += `<div class="chat-tagtrenner">${escapeHtml(chatTagLabel(m.erstellt_am))}</div>`;
    }
    const eigen = m.absender_id === me;
    const klass = 'chat-msg ' + (eigen ? 'eigen' : 'fremd') + (m.geloescht ? ' geloescht' : '');
    const absName = (!eigen && c.typ === 'gruppe')
      ? `<div class="chat-msg-absender">${escapeHtml(chatNameVon(m.absender_id))}</div>` : '';
    const text = m.geloescht ? t('chat_geloescht') : (m.text || '');
    const fuss = escapeHtml(chatZeit(m.erstellt_am)) + (m.bearbeitet_am && !m.geloescht ? ' · ' + escapeHtml(t('chat_bearbeitet')) : '');
    const aktionen = (eigen && !m.geloescht)
      ? `<div class="chat-msg-aktionen">
           <button onclick="chatMsgBearbeiten('${escapeHtml(m.id)}')">${escapeHtml(t('chat_bearbeiten'))}</button>
           <button onclick="chatMsgLoeschen('${escapeHtml(m.id)}')">${escapeHtml(t('chat_loeschen'))}</button>
         </div>` : '';
    html += `<div class="${klass}" data-id="${escapeHtml(m.id)}">
      ${absName}<div class="chat-msg-text">${escapeHtml(text)}</div>
      <div class="chat-msg-fuss">${fuss}</div>${aktionen}</div>`;
  });

  konv.innerHTML = `
    <div class="chat-konv-head">
      <button class="chat-zurueck-btn" onclick="chatZurueck()" aria-label="${escapeHtml(t('chat_zurueck'))}">←</button>
      <div class="chat-konv-info">
        <div class="chat-konv-titel">${escapeHtml(chatTitelVon(c))}</div>
        <div class="chat-konv-sub">${escapeHtml(sub)}</div>
      </div>
      ${infoBtn}
    </div>
    <div class="chat-nachrichten" id="chat-nachrichten">${html}</div>
    <div class="chat-eingabe-zeile">
      <textarea class="chat-eingabe" id="chat-eingabe" rows="1"
        placeholder="${escapeHtml(t('chat_nachricht_ph'))}" oninput="chatEingabeWachsen(this)"
        onkeydown="chatEingabeTaste(event)"></textarea>
      <button class="chat-send-btn" onclick="chatSenden()" aria-label="${escapeHtml(t('chat_senden'))}">➤</button>
    </div>`;
  const liste = document.getElementById('chat-nachrichten');
  if (liste) liste.scrollTop = liste.scrollHeight;
}
function chatTagLabel(iso) {
  const d = new Date(iso), jetzt = new Date();
  if (d.toDateString() === jetzt.toDateString()) return t('chat_heute');
  const gestern = new Date(jetzt); gestern.setDate(jetzt.getDate() - 1);
  if (d.toDateString() === gestern.toDateString()) return t('chat_gestern');
  const loc = { de: 'de-DE', sr: 'sr-RS', hr: 'hr-HR', ba: 'bs-BA', en: 'en-US' }[aktuelleSprache] || 'de-DE';
  return d.toLocaleDateString(loc, { day: '2-digit', month: 'long', year: 'numeric' });
}
function chatEingabeWachsen(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function chatEingabeTaste(e) {
  // Desktop: Enter sendet, Shift+Enter = neue Zeile. Mobil: Enter = neue Zeile.
  if (e.key === 'Enter' && !e.shiftKey && !window.matchMedia('(max-width:480px)').matches) {
    e.preventDefault(); chatSenden();
  }
}
async function chatSenden() {
  const feld = document.getElementById('chat-eingabe');
  if (!feld || !chatAktivId) return;
  const text = feld.value.trim();
  if (!text) return;
  feld.value = ''; chatEingabeWachsen(feld);
  try {
    const { error } = await sbClient.rpc('chat_nachricht_senden', { p_chat: chatAktivId, p_text: text });
    if (error) throw error;
    await chatLadeNachrichten(chatAktivId);
    await chatLadeListe();
  } catch (e) {
    console.warn('chat_nachricht_senden:', e.message || e);
    feld.value = text;   // bei Fehler Eingabe nicht verlieren
    zeigeHinweis(t('chat_fehler'));
  }
}

// ---- Nachricht bearbeiten / löschen (RLS: nur eigener Absender) --------------
function chatMsgBearbeiten(id) {
  const m = (chatNachrichten || []).find(x => x.id === id);
  if (!m) return;
  const bubble = document.querySelector(`.chat-msg[data-id="${id}"]`);
  if (!bubble) return;

    <textarea class="chat-msg-editfeld" id="chat-edit-${id}" rows="2">${escapeHtml(m.text || '')}</textarea>
    <div class="chat-msg-aktionen">
      <button onclick="chatMsgSpeichern('${escapeHtml(id)}')">${escapeHtml(t('chat_speichern'))}</button>
      <button onclick="chatRenderKonversation()">${escapeHtml(t('chat_abbrechen'))}</button>
    </div>`;
  const ta = document.getElementById('chat-edit-' + id);
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
async function chatMsgSpeichern(id) {
  const ta = document.getElementById('chat-edit-' + id);

    await chatLadeListe();
  } catch (e) {
    console.warn('Nachricht löschen:', e.message || e);

}

function chatNeuSchliessen() { document.getElementById('chat-neu-modal').classList.remove('aktiv'); }
function chatNeuFilter() { chatNeuRender(); }
function chatNeuToggle(uid) {

function chatNeuRender() {
  const such = (document.getElementById('chat-neu-suche').value || '').trim().toLowerCase();

  document.getElementById('chat-neu-gruppe-wrap').style.display = chatNeuAuswahl.size > 1 ? '' : 'none';
}
async function chatNeuErstellen() {
  feldFehlerReset('chat-neu-modal');
  const auswahl = Array.from(chatNeuAuswahl);
  if (!auswahl.length) return feldFehler('chat-neu-suche', t('chat_mind_eine'));
  try {
    let chatId;
    if (auswahl.length === 1) {
      const { data, error } = await sbClient.rpc('direkt_chat_finden_oder_anlegen', { p_user2: auswahl[0] });
      if (error) throw error;
      chatId = data;
    } else {
      const name = document.getElementById('chat-neu-gruppenname').value.trim();
      if (!name) return feldFehler('chat-neu-gruppenname', t('chat_gruppe_name_pflicht'));
      const { data, error } = await sbClient.rpc('gruppen_chat_anlegen', { p_name: name, p_user_ids: auswahl });
      if (error) throw error;
      chatId = data;
    }
    chatNeuSchliessen();
    await chatLadeListe();
    await chatOeffneKonversation(chatId);
  } catch (e) {
    console.warn('Chat anlegen:', e.message || e);
    zeigeHinweis(t('chat_fehler'));
  }
}

// ============================================================
// PROFILEINSTELLUNGEN (Phase 1): Konto-Stammdaten, Avatar, Passwort
// ============================================================

// Profil des eingeloggten Nutzers laden (eigene Zeile via RLS). Aktualisiert danach
// Badge/Presence und wendet eine gespeicherte Profil-Sprache an. Aufruf im Login-Flow.
async function ladeMeinProfil() {
  meinProfil = null;
  if (!aktuellerUser) { aktualisiereBadgeProfil(); return; }
  try {
    const { data, error } = await sbClient
      .from('profile').select('*').eq('user_id', aktuellerUser.id).maybeSingle();
    if (error) console.warn('Profil laden:', error.message);
    meinProfil = data || null;
  } catch (e) { console.warn('Profil laden (Ausnahme):', e); }

  // Gespeicherte Profil-Sprache anwenden (Profil steuert die App-Sprache), wenn gültig.
  const ps = meinProfil && meinProfil.sprache;
  if (ps && TEXTE[ps] && ps !== aktuelleSprache) wechselSprache(ps, true);

  aktualisiereBadgeProfil();
  if (presenceChannel) presenceTrack(meinLockPerson);   // Name/Avatar in Presence auffrischen
}

// Leise Profil-Auffrischung (Profil<->Karte-Sync): nach einem Live-Sync-Reload das eigene
// Profil neu laden, damit Badge/Presence sofort die (z. B. von einem Admin) geänderten
// Stammdaten zeigen. Bewusst OHNE Sprachumschaltung und OHNE die offenen Eingabefelder zu
// überschreiben (kein Verlust laufender Eingaben). Verändert den Inaktivitäts-Timer NICHT.
async function aktualisiereProfilLeise() {
  if (!aktuellerUser) return;
  try {
    const { data } = await sbClient.from('profile').select('*').eq('user_id', aktuellerUser.id).maybeSingle();
    if (!data) return;
    meinProfil = data;
    aktualisiereBadgeProfil();
    if (presenceChannel) presenceTrack(meinLockPerson);
    if (document.getElementById('profil-modal')?.classList.contains('aktiv')) {
      await ladeMeinePersonStatus();
      renderMeinePersonBereich();
    }
  } catch (e) { /* Live-Refresh ist best-effort */ }
}

// Avatar-URL fürs eigene Badge/Presence (Thumb bevorzugt). '' = kein Bild.
function meinAvatarUrl() {
  if (!meinProfil) return '';
  return meinProfil.avatar_thumb_url || meinProfil.avatar_url || '';
}

// Benutzer-Leiste (Avatar + Name) ohne Reload aktualisieren.
function aktualisiereBadgeProfil() {
  const img  = document.getElementById('user-avatar');
  const name = document.getElementById('user-name');
  const mail = document.getElementById('user-email');
  const btn  = document.getElementById('profil-icon-btn');
  const url  = meinAvatarUrl();
  const hatName = !!(meinProfil && (meinProfil.vorname || meinProfil.nachname));
  const profilName = hatName ? [meinProfil.vorname, meinProfil.nachname].filter(Boolean).join(' ').trim() : '';
  // Avatar/Icon: immer rund sichtbar (eigenes Bild ODER dezenter Platzhalter).
  if (img) img.src = (aktuellerUser && url) ? url : AVATAR_PLATZHALTER;
  // Name nur bei vorhandenem Profilnamen (Vor-/Nachname).
  if (name) {
    name.textContent   = (aktuellerUser && hatName) ? profilName : '';
    name.style.display = (aktuellerUser && hatName) ? '' : 'none';
  }
  // E-Mail nur zeigen, wenn WEDER Vor- NOCH Nachname gesetzt ist.
  if (mail) {
    mail.textContent   = (aktuellerUser && !hatName) ? (aktuellerUser.email || '') : '';
    mail.style.display = (aktuellerUser && !hatName) ? '' : 'none';
  }
  // Tooltip „Profileinstellungen" (lokalisiert; bei Sprachwechsel via aktualisiereAuthUI erneut gesetzt).
  if (btn) { const tt = t('prof_menu'); btn.title = tt; btn.setAttribute('aria-label', tt); }
}

function profilFehler(msg) {
  const f = document.getElementById('prof-fehler');
  if (f) { f.textContent = msg; f.style.display = 'block'; }
}

// Profil-Overlay öffnen, alle Felder mit den aktuellen Werten vorbelegen.
async function oeffneProfil() {
  if (!aktuellerUser) return;
  const menu = document.getElementById('nav-menu'); if (menu) menu.classList.remove('offen');
  ['prof-fehler','prof-erfolg','prof-pw-fehler','prof-pw-erfolg'].forEach(id => {
    const el = document.getElementById(id); if (el) el.style.display = 'none';
  });
  // evtl. alte ausstehende Vorschau verwerfen
  if (profilAvatarPending && profilAvatarPending.previewUrl) { try { URL.revokeObjectURL(profilAvatarPending.previewUrl); } catch (e) {} }
  profilAvatarPending = undefined;

  const p = meinProfil || {};
  document.getElementById('prof-vorname').value  = p.vorname  || '';
  document.getElementById('prof-nachname').value = p.nachname || '';
  document.getElementById('prof-email').value    = aktuellerUser.email || '';
  document.getElementById('prof-telefon').value  = p.telefon  || '';
  // Synchronisierte Stammdaten (Profil <-> verknüpfte Karte)
  document.getElementById('prof-geburtsname').value = p.geburtsname || '';
  document.getElementById('prof-geschlecht').value  = p.geschlecht  || '';
  datumSetzen(document.getElementById('prof-geburtsdatum'), p.geburtsdatum || '');
  document.getElementById('prof-biografie').value   = p.biografie   || '';
  // Datenschutz/Passwort/Sicherheit sind in eigene Overlays (Avatar-Menü) ausgelagert.
  // Benachrichtigungen (Obavještenja) ebenfalls -> hier nur den Ungelesen-Indikator frisch halten.
  ladeBenachrichtigungen();

  // Live-Aktualisierung des Profilkopfs beim Tippen
  document.getElementById('prof-vorname').oninput  = renderProfilKopf;
  document.getElementById('prof-nachname').oninput = renderProfilKopf;

  fuelleProfilSprache(p.sprache || aktuelleSprache);
  fuelleProfilZeitzone(p.zeitzone || '');
  const landSel = document.getElementById('prof-land');
  if (landSel) { fuelleEinLandSelect(landSel); setLandSelectValue(landSel, p.land || ''); }

  renderProfilKopf();
  setProfilAvatarVorschau(meinAvatarUrl());
  renderMeinePersonBereich();   // "Meine Person im Stammbaum" (lädt Status bei Bedarf)
  ladeAnlassEinstellungen();    // Erinnerungs-Schalter (Geburtstage/Gedenktage) laden

  document.getElementById('profil-modal').classList.add('aktiv');
  macheAlleSelectsSuchbar(document.getElementById('profil-modal'));
  if (typeof macheAlleDatumsfelder === 'function') macheAlleDatumsfelder(document.getElementById('profil-modal'));
}

// Befüllt die mit der Karte synchronisierten Stammdaten-Felder im offenen Profil-Modal
// aus meinProfil (nach Verknüpfung "Karte gewinnt" / nach Anlegen). Bewusst nur diese
// Felder + Kopf/Avatar — ohne das ganze Modal neu zu öffnen.
function fuelleProfilStammdaten() {
  const p = meinProfil || {};
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ''; };
  set('prof-vorname',     p.vorname);
  set('prof-nachname',    p.nachname);
  set('prof-geburtsname', p.geburtsname);
  set('prof-geschlecht',  p.geschlecht);
  set('prof-biografie',   p.biografie);
  const gd = document.getElementById('prof-geburtsdatum');
  if (gd && typeof datumSetzen === 'function') datumSetzen(gd, p.geburtsdatum || '');
  if (typeof renderProfilKopf === 'function') renderProfilKopf();
  if (typeof setProfilAvatarVorschau === 'function') setProfilAvatarVorschau(meinAvatarUrl());
}

function schliesseProfil() {
  document.getElementById('profil-modal').classList.remove('aktiv');
  if (profilAvatarPending && profilAvatarPending.previewUrl) { try { URL.revokeObjectURL(profilAvatarPending.previewUrl); } catch (e) {} }
  profilAvatarPending = undefined;
}

// ============================================================
// MEINE PERSON IM STAMMBAUM (Konto <-> Personenkarte, Self-Service)
// Verknüpfung läuft über personen.user_id (kein separates linkedPersonId-Feld).
// RPCs: meine_person_status / meine_person_kandidaten / meine_karte_verknuepfen /
//       meine_karte_erstellen  (Datei supabase_meine_person.sql).
// ============================================================
let meinePersonStatus = null;   // zuletzt geladener Status (meine_person_status)
let mpKandidaten      = [];      // kontolose Karten für den Auswahl-Picker
let mpDupMatch        = null;    // sichtbarer Duplikat-Treffer (Karte) zum Verknüpfen
let mpDupMatches      = [];      // letzte Duplikat-Trefferliste (für Sprachwechsel-Neurender)

// Status laden (verknüpft? wie viele Bäume/Personen sichtbar?). Steuert Hinweis + Profil-Bereich.
async function ladeMeinePersonStatus() {
  meinePersonStatus = null;
  if (!aktuellerUser) return null;
  try {
    const { data, error } = await sbClient.rpc('meine_person_status');
    if (error) { console.warn('meine_person_status:', error.message); return null; }

  } catch (e) { console.warn('meine_person_status (Ausnahme):', e); }
  return meinePersonStatus;
}

// Snooze ("Später erinnern") je Nutzer für 24 h.
function mpSnoozeKey() { return 'mp_snooze_' + ((aktuellerUser && aktuellerUser.id) || '?'); }
function mpIstGesnoozt() {
  try { const t0 = parseInt(localStorage.getItem(mpSnoozeKey()) || '0', 10);
        return !!t0 && (Date.now() - t0) < 24 * 60 * 60 * 1000; } catch (e) { return false; }
}
function mpSnoozeSetzen() { try { localStorage.setItem(mpSnoozeKey(), String(Date.now())); } catch (e) {} }

// Bedingung der "Neuen Regel": Zugriff auf >=1 Baum UND >=1 Karte vorhanden UND selbst NICHT verknüpft.
async function pruefeMeinePersonHinweis() {
  if (!aktuellerUser) return;
  const s = await ladeMeinePersonStatus();
  if (!s) return;
  if (document.getElementById('profil-modal')?.classList.contains('aktiv')) renderMeinePersonBereich();   // falls Profil offen: Bereich auffrischen
  if (s.super_admin) return;                                // Betriebs-/Wartungskonto nicht behelligen
  if (s.verknuepft) return;                                 // bereits zugeordnet -> kein Hinweis
  if (!(s.baum_anzahl > 0 && s.personen_anzahl > 0)) return; // keine Bäume / keine Karten -> kein Hinweis
  if (mpIstGesnoozt()) return;
  zeigeMeinePersonHinweis();
}

function zeigeMeinePersonHinweis() {
  const m = document.getElementById('mp-hinweis-modal'); if (m) m.classList.add('aktiv');
}
function mpHinweisSpaeter() {
  mpSnoozeSetzen();
  const m = document.getElementById('mp-hinweis-modal'); if (m) m.classList.remove('aktiv');
}
function mpHinweisAuswaehlen() {
  const m = document.getElementById('mp-hinweis-modal'); if (m) m.classList.remove('aktiv');
  oeffneMpPick();
}
function mpHinweisErstellen() {
  const m = document.getElementById('mp-hinweis-modal'); if (m) m.classList.remove('aktiv');
  oeffneMpCreate();
}

// Profil-Bereich "Meine Person im Stammbaum" rendern (nutzt zuletzt geladenen Status; lädt bei Bedarf).
async function renderMeinePersonBereich() {
  const box = document.getElementById('mp-bereich');
  if (!box) return;
  box.innerHTML = `<div class="mp-status">${escapeHtml(t('sec_laden'))}</div>`;
  const s = meinePersonStatus || await ladeMeinePersonStatus();
  const hint = document.getElementById('prof-sync-hint');
  if (hint) hint.style.display = (s && s.verknuepft) ? 'block' : 'none';
  if (!s) { box.innerHTML = ''; return; }
  if (s.verknuepft) {
    const name = nm(s.person_name || '?');
    const baum = s.person_baum ? ' (' + t('mp_in_baum', { baum: nm(s.person_baum) }) + ')' : '';
    const fam = s.person_familie ? `<div class="mp-status mp-status-sub">${escapeHtml(t('mp_in_familie', { familie: nm(s.person_familie) }))}</div>` : '';
    box.innerHTML = `<div class="mp-status">${escapeHtml(t('mp_verknuepft', { name: '' }))}` +
      `<span class="mp-name">${escapeHtml(name)}</span>${escapeHtml(baum)}</div>${fam}` +
      `<div class="mp-btn-spalte"><button type="button" class="account-btn mp-btn-dezent" onclick="mpVerknuepfungLoesen()">${escapeHtml(t('mp_loesen'))}</button></div>`;
    return;
  }
  const text = (s.personen_anzahl > 0) ? t('mp_nicht_verknuepft') : t('mp_keine_karten');
  let btns = '<div class="mp-btn-spalte">';
  if (s.personen_anzahl > 0)
    btns += `<button type="button" class="login-submit" onclick="oeffneMpPick()">${escapeHtml(t('mp_btn_auswaehlen'))}</button>`;
  if (s.baum_anzahl > 0)
    btns += `<button type="button" class="account-btn" onclick="oeffneMpCreate()">${escapeHtml(t('mp_btn_erstellen'))}</button>`;
  btns += '</div>';
  box.innerHTML = `<div class="mp-status">${escapeHtml(text)}</div>${btns}`;
}

// ---- Bestehende kontolose Karte auswählen ----
async function oeffneMpPick() {
  if (!aktuellerUser) return;
  const fehler = document.getElementById('mp-pick-fehler'); if (fehler) fehler.style.display = 'none';
  document.getElementById('mp-pick-such').value = '';
  const liste = document.getElementById('mp-pick-liste');
  liste.innerHTML = `<div class="mp-pick-row"><span class="mp-pick-meta">${escapeHtml(t('sec_laden'))}</span></div>`;
  // Touch-sichere Auswahl EINMAL an den (statischen) Container hängen (tippAuswahl: Tap selektiert, Wischen scrollt).
  if (!liste._mpInit) {
    tippAuswahl(liste, '.mp-pick-row', el => { const id = el.getAttribute('data-id'); if (id) mpVerknuepfe(id, false); });
    liste._mpInit = true;
  }
  document.getElementById('mp-pick-modal').classList.add('aktiv');
  try {
    const { data, error } = await sbClient.rpc('meine_person_kandidaten');
    if (error) throw error;
    mpKandidaten = data || [];
  } catch (e) {
    console.warn('meine_person_kandidaten:', e);
    mpKandidaten = [];
    if (fehler) { fehler.textContent = t('mp_link_fehler'); fehler.style.display = 'block'; }
  }
  renderMpPick();
}
function schliesseMpPick() { document.getElementById('mp-pick-modal').classList.remove('aktiv'); }

function renderMpPick() {
  const liste = document.getElementById('mp-pick-liste'); if (!liste) return;
  const q = (document.getElementById('mp-pick-such').value || '').trim().toLowerCase();
  const gefiltert = mpKandidaten.filter(k => {
    if (!q) return true;
    return ((k.name || '') + ' ' + (k.baum || '')).toLowerCase().includes(q);
  });
  if (!gefiltert.length) {
    liste.innerHTML = `<div class="mp-pick-row"><span class="mp-pick-meta">${escapeHtml(t('mp_pick_leer'))}</span></div>`;
    return;
  }
  liste.innerHTML = gefiltert.map(k => {
    const datum = k.geburtsdatum ? (formatDatumLang(k.geburtsdatum) || k.geburtsdatum) : '';
    const meta  = [datum, trefferBaumLabel(k)].filter(Boolean).join(' · ');
    return `<div class="mp-pick-row" data-id="${escapeHtml(k.person_id)}">
      <div><div class="mp-pick-name">${escapeHtml(nm(k.name || '?'))}</div>
        <div class="mp-pick-meta">${escapeHtml(meta)}</div></div>
      <button type="button" class="account-btn">${escapeHtml(t('mp_pick_verknuepfen'))}</button>
    </div>`;
  }).join('');
}

// Self-Link an eine Karte: setzt personen.user_id = auth.uid() (RPC prüft Sichtbarkeit + "1 Nutzer pro Karte").
async function mpVerknuepfe(personId, ausDup) {
  if (!personId) return;
  const fehlerEl = document.getElementById(ausDup ? 'mp-create-fehler' : 'mp-pick-fehler');
  if (fehlerEl) fehlerEl.style.display = 'none';
  try {
    const { data, error } = await sbClient.rpc('meine_karte_verknuepfen', { p_person: personId });
    if (error) throw error;
    if (!data || !data.ok) {
      const msg = (data && data.grund === 'karte_belegt') ? t('mp_link_belegt') : t('mp_link_fehler');
      if (fehlerEl) { fehlerEl.textContent = msg; fehlerEl.style.display = 'block'; }
      return;
    }
    schliesseMpPick(); schliesseMpCreate();
    await ladeMeinePersonStatus();
    // "Karte gewinnt": der DB-Trigger hat die profile-Zeile aus der Karte befüllt ->
    // Profil neu laden und die offenen Stammdaten-Felder/Badge nachziehen.
    await ladeMeinProfil();
    if (document.getElementById('profil-modal')?.classList.contains('aktiv')) {
      renderMeinePersonBereich();
      fuelleProfilStammdaten();
    }
    if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();   // Karte zeigt jetzt 🔗
    zeigeHinweis(t('mp_link_ok'));
  } catch (e) {
    console.warn('meine_karte_verknuepfen:', e);
    if (fehlerEl) { fehlerEl.textContent = t('mp_link_fehler'); fehlerEl.style.display = 'block'; }
  }
}

// Anlegen + automatische Verknüpfung. skipDup=true überspringt die Duplikatsprüfung ("Trotzdem neu erstellen").
async function mpCreateAnlegen(skipDup) {
  if (!aktuellerUser) return;
  const fehlerEl = document.getElementById('mp-create-fehler'); fehlerEl.style.display = 'none';
  feldFehlerReset('mp-create-modal');
  const submit   = document.getElementById('mp-create-submit');

  const vorname  = document.getElementById('mp-create-vorname').value.trim();
  const nachname = document.getElementById('mp-create-nachname').value.trim();
  if (!vorname) return feldFehler('mp-create-vorname', t('feld_pflicht'));
  const emailEl = document.getElementById('mp-create-email');
  if (!pruefeEmailFeld(emailEl, false)) return feldFokus('mp-create-email');

  const baeume = mpZielBaeume();
  const baumId = (baeume.length > 1) ? document.getElementById('mp-create-baum').value : (baeume[0] && baeume[0].id);
  if (!baumId) {
    if (baeume.length > 1) return feldFehler('mp-create-baum', t('mp_erstellen_fehler'));
    fehlerEl.textContent = t('mp_erstellen_fehler'); fehlerEl.style.display = 'block'; return;
  }

  const sex   = document.getElementById('mp-create-geschlecht').value || '';
  const geb   = datumWert(document.getElementById('mp-create-geburtsdatum'));
  const ort   = document.getElementById('mp-create-geburtsort').value.trim();
  const land  = document.getElementById('mp-create-geburtsland').value || '';
  const email = emailEl.value.trim();

  // Duplikatsprüfung (greift nur, wenn alle vier Kriterien gesetzt sind; sonst liefert die RPC nichts).
  if (!skipDup) {
    submit.disabled = true;
    let matches = [];
    try {
      const { data } = await sbClient.rpc('dubletten_check_global', {
        p_vorname: vorname, p_nachname: nachname, p_birth_date: geb, p_land: land, p_exclude_person: null
      });
      matches = data || [];
    } catch (e) { console.warn('dubletten_check_global:', e); }
    submit.disabled = false;
    if (matches.length) { mpZeigeDuplikate(matches); return; }
  }

  const fotoChk = document.getElementById('mp-create-foto');
  const fotoUrl = (fotoChk && fotoChk.checked && meinProfil) ? (meinProfil.avatar_url || meinProfil.avatar_thumb_url || '') : '';

  const stammbaum_daten = {
    given: vorname, surname: nachname, name: (vorname + ' ' + nachname).trim(), sex,
    birth_date: geb, birth_place: ort, geburtsland: land,
    email: email, foto: fotoUrl, avatar: fotoUrl,
    deceased: false, death_date: '',
    angelegt_aus: 'meine-person'
  };

  const alt = submit.textContent; submit.disabled = true; submit.textContent = t('reg_senden_laeuft');
  try {
    const { data, error } = await sbClient.rpc('meine_karte_erstellen', {
      p_baum: baumId, p_vorname: vorname, p_nachname: nachname, p_daten: stammbaum_daten, p_eltern: []
    });
    submit.disabled = false; submit.textContent = alt;
    if (error) throw error;
    if (!data || !data.ok) { fehlerEl.textContent = t('mp_erstellen_fehler'); fehlerEl.style.display = 'block'; return; }
    schliesseMpCreate();
    await ladeMeinePersonStatus();
    // Neue Karte wurde verknüpft -> Profil neu laden + offene Stammdaten-Felder/Badge nachziehen.
    await ladeMeinProfil();
    if (document.getElementById('profil-modal')?.classList.contains('aktiv')) {
      renderMeinePersonBereich();
      fuelleProfilStammdaten();
    }
    if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
    zeigeHinweis(t('mp_erstellt_ok'));
  } catch (e) {
    submit.disabled = false; submit.textContent = alt;
    console.warn('meine_karte_erstellen:', e);
    fehlerEl.textContent = t('mp_erstellen_fehler'); fehlerEl.style.display = 'block';
  }
}

// --- Avatar-Verarbeitung (clientseitig, Canvas — keine externe Library) ---
// Quadratischer, zentrierter Zuschnitt -> Zielgröße -> WEBP (Fallback JPEG).
function avatarBlob(img, size) {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';   // sauberer Zuschnitt
    const min = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = (img.naturalWidth - min) / 2;
    const sy = (img.naturalHeight - min) / 2;
    ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
    canvas.toBlob((b) => {
      if (b) resolve(b);
      else canvas.toBlob(resolve, 'image/jpeg', 0.9);    // sehr alte Browser ohne WEBP
    }, 'image/webp', 0.9);
  });
}
function verarbeiteAvatar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = async () => {
      try {
        const [mainBlob, thumbBlob] = await Promise.all([avatarBlob(img, 1024), avatarBlob(img, 128)]);
        URL.revokeObjectURL(url);
        if (!mainBlob || !thumbBlob) reject(new Error('toBlob null')); else resolve({ mainBlob, thumbBlob });
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild laden fehlgeschlagen')); };
    img.src = url;
  });
}

async function profilAvatarWaehlen(input) {
  document.getElementById('prof-fehler').style.display = 'none';
  const file = input.files && input.files[0];
  input.value = '';   // erlaubt erneutes Wählen derselben Datei
  if (!file) return;
  const erlaubt = ['image/jpeg', 'image/png', 'image/webp'];
  if (!erlaubt.includes(file.type)) { profilFehler(t('prof_err_typ')); return; }
  if (file.size > 8 * 1024 * 1024) { profilFehler(t('prof_err_gross')); return; }
  try {
    const { mainBlob, thumbBlob } = await verarbeiteAvatar(file);
    if (profilAvatarPending && profilAvatarPending.previewUrl) { try { URL.revokeObjectURL(profilAvatarPending.previewUrl); } catch (e) {} }
    const previewUrl = URL.createObjectURL(mainBlob);
    profilAvatarPending = { mainBlob, thumbBlob, previewUrl };
    setProfilAvatarVorschau(previewUrl);
  } catch (e) { console.warn('Avatar-Verarbeitung:', e); profilFehler(t('prof_err_bild')); }
}

function profilAvatarLoeschen() {
  if (profilAvatarPending && profilAvatarPending.previewUrl) { try { URL.revokeObjectURL(profilAvatarPending.previewUrl); } catch (e) {} }
  profilAvatarPending = null;   // beim Speichern entfernen
  setProfilAvatarVorschau('');
}

// Avatar (Haupt + Thumb) in den Bucket 'avatars' (eigener Ordner) laden -> Public-URLs.
async function ladeAvatarHoch(mainBlob, thumbBlob) {
  const uid  = aktuellerUser.id;
  const ext  = (mainBlob.type === 'image/jpeg') ? 'jpg' : 'webp';
  const mainPath  = `${uid}/avatar.${ext}`;
  const thumbPath = `${uid}/thumb.${ext}`;
  const up1 = await sbClient.storage.from('avatars').upload(mainPath, mainBlob, { upsert: true, cacheControl: '3600', contentType: mainBlob.type });
  if (up1.error) throw up1.error;
  const up2 = await sbClient.storage.from('avatars').upload(thumbPath, thumbBlob, { upsert: true, cacheControl: '3600', contentType: thumbBlob.type });
  if (up2.error) throw up2.error;
  const v = '?v=' + Date.now();   // Cache-Buster (gleicher Pfad bei upsert)
  return {
    url:   sbClient.storage.from('avatars').getPublicUrl(mainPath).data.publicUrl + v,
    thumb: sbClient.storage.from('avatars').getPublicUrl(thumbPath).data.publicUrl + v
  };
}
async function loescheAvatarDateien() {
  const uid = aktuellerUser.id;
  const pfade = [`${uid}/avatar.webp`, `${uid}/thumb.webp`, `${uid}/avatar.jpg`, `${uid}/thumb.jpg`];
  try { await sbClient.storage.from('avatars').remove(pfade); } catch (e) { console.warn('Avatar löschen:', e); }
}

  const vorname  = document.getElementById('prof-vorname').value.trim();
  const nachname = document.getElementById('prof-nachname').value.trim();
  const telefon  = document.getElementById('prof-telefon').value.trim();
  const sprache  = document.getElementById('prof-sprache').value || aktuelleSprache;
  const land     = document.getElementById('prof-land').value || '';
  const zeitzone = document.getElementById('prof-zeitzone').value || '';
  // Datenschutz/Sichtbarkeit wird im eigenen Privatnost-Overlay gepflegt -> hier bestehenden
  // Wert beibehalten (nicht aus dem Profil-Modal, das den Schalter nicht mehr enthält).
  const sicht    = (meinProfil && meinProfil.avatar_sichtbarkeit) || 'verbund';
  // Synchronisierte Stammdaten (gehen per DB-Trigger auch in die verknüpfte Karte)
  const geburtsname  = document.getElementById('prof-geburtsname').value.trim();
  const geschlecht   = document.getElementById('prof-geschlecht').value || '';
  const geburtsdatum = datumWert(document.getElementById('prof-geburtsdatum'));
  const biografie    = document.getElementById('prof-biografie').value.trim();

  if (!vorname || !nachname) { profilFehler(t('prof_err_pflicht')); return; }

  const btn = document.getElementById('prof-submit');
  btn.disabled = true; btn.textContent = t('reg_senden_laeuft');
  try {
    // 1) Avatar-Änderung (falls vorgemerkt) anwenden
    let avatarUrl   = meinProfil ? (meinProfil.avatar_url || null) : null;
    let avatarThumb = meinProfil ? (meinProfil.avatar_thumb_url || null) : null;
    if (profilAvatarPending === null) {
      await loescheAvatarDateien(); avatarUrl = null; avatarThumb = null;
    } else if (profilAvatarPending && profilAvatarPending.mainBlob) {
      const res = await ladeAvatarHoch(profilAvatarPending.mainBlob, profilAvatarPending.thumbBlob);
      avatarUrl = res.url; avatarThumb = res.thumb;
    }

    // 2) Profil-Zeile upserten (eigene Zeile, RLS auth.uid() = user_id)
    const zeile = {
      user_id: aktuellerUser.id,
      vorname, nachname, telefon: telefon || null,
      sprache, land: land || null, zeitzone: zeitzone || null,
      avatar_url: avatarUrl, avatar_thumb_url: avatarThumb,
      avatar_sichtbarkeit: sicht,
      geburtsname: geburtsname || null, geschlecht: geschlecht || null,
      geburtsdatum: geburtsdatum || null, biografie: biografie || null
    };
    const { data, error } = await sbClient.from('profile').upsert(zeile, { onConflict: 'user_id' }).select().maybeSingle();
    if (error) throw error;
    meinProfil = data || zeile;
    profilAvatarPending = undefined;

    // 3) Live-Update überall (Badge, Presence, Sprache, Kopf)
    aktualisiereBadgeProfil();
    if (presenceChannel) presenceTrack(meinLockPerson);
    if (sprache && TEXTE[sprache] && sprache !== aktuelleSprache) wechselSprache(sprache, true);
    renderProfilKopf();

    erfolg.textContent = t('prof_gespeichert'); erfolg.style.display = 'block';
    // Nach erfolgreichem Speichern Overlay automatisch schließen (kurze Erfolgs-Anzeige).
    setTimeout(() => schliesseProfil(), 900);
  } catch (e) {
    console.warn('Profil speichern:', e);
    profilFehler((e && e.message) ? e.message : t('prof_err_speichern'));
  } finally {
    btn.disabled = false; btn.textContent = t('prof_speichern');
  }
}

// Datum + Uhrzeit lokalisiert (Sitzungen/Login). Fallback: ISO gekürzt.
function formatDatumZeit(iso) {
  if (!iso) return '—';
  try {
    const loc = (typeof isoLocale === 'function') ? isoLocale(aktuelleSprache) : undefined;
    return new Date(iso).toLocaleString(loc, { dateStyle: 'medium', timeStyle: 'short' });
  } catch (e) { return String(iso).slice(0, 16).replace('T', ' '); }
}

// Aus dem User-Agent ein freundliches „Browser · System" ableiten (best effort).
function geraetLabel(ua) {
  if (!ua) return t('sec_geraet_unbekannt');
  let br = 'Browser', os = '';
  if (/Edg\//.test(ua)) br = 'Edge';
  else if (/OPR\/|Opera/.test(ua)) br = 'Opera';
  else if (/Chrome\//.test(ua)) br = 'Chrome';
  else if (/Firefox\//.test(ua)) br = 'Firefox';
  else if (/Safari\//.test(ua)) br = 'Safari';
  if (/Windows/.test(ua)) os = 'Windows';
  else if (/iPhone|iPad|iOS/.test(ua)) os = 'iOS';
  else if (/Android/.test(ua)) os = 'Android';
  else if (/Mac OS X|Macintosh/.test(ua)) os = 'macOS';
  else if (/Linux/.test(ua)) os = 'Linux';
  return os ? (br + ' · ' + os) : br;
}

function startPresence(treeId) {
  if (presenceTreeId === treeId && presenceChannel) return;   // schon auf diesem Baum aktiv
  stopPresence();
  if (!aktuellerUser || !treeId) { renderPresenceIndikator(); return; }
  presenceTreeId = treeId;
  try {
    presenceChannel = sbClient.channel('presence:tree:' + treeId, {
      config: { presence: { key: aktuellerUser.id } }
    });
    presenceChannel
      .on('presence', { event: 'sync' },  presenceAktualisieren)
      .on('presence', { event: 'join' },  presenceAktualisieren)
      .on('presence', { event: 'leave' }, presenceAktualisieren)
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED' && presenceChannel) {
          await presenceTrack(meinLockPerson);   // beim (Wieder-)Verbinden evtl. aktive Sperre erneut anmelden
        }
      });
  } catch (e) {
    console.warn('Live-Indikator (Presence) nicht verfügbar:', e);
    presenceChannel = null;
  }
}

function stopPresence() {
  if (presenceChannel) {
    try { presenceChannel.untrack(); } catch (e) {}
    try { sbClient.removeChannel(presenceChannel); } catch (e) {}
    presenceChannel = null;
  }
  presenceTreeId = null;
  presenceUsers  = [];
  presenceLocks  = {};
  meinLockPerson = null;
  renderPresenceIndikator();
}

// Presence-State -> eindeutige Nutzerliste + Karte fremder Bearbeitungssperren (P4).
function presenceAktualisieren() {
  const liste = [];
  const gesehen = new Set();
  const locks = {};
  const meId = aktuellerUser ? aktuellerUser.id : null;
  try {
    const state = presenceChannel ? presenceChannel.presenceState() : {};
    Object.values(state).forEach(metas => {
      (metas || []).forEach(m => {
        const uid = m.user_id || m.email || '';
        if (uid && !gesehen.has(uid)) {
          gesehen.add(uid);
          liste.push({ user_id: uid, name: m.name || m.email || '?', email: m.email || '', avatar: m.avatar || '' });
        }
        // Fremde Sperre vormerken (eigene zählt nicht als Blockade für mich selbst)
        if (m.editing && uid !== meId) locks[m.editing] = { user_id: uid, name: m.name || m.email || '?' };
      });
    });
  } catch (e) {}
  presenceUsers = liste;
  presenceLocks = locks;
  renderPresenceIndikator();
  pruefeLockBanner();   // offene Detailkarte: „wird gerade von X bearbeitet" live ein-/ausblenden
}

function renderPresenceIndikator() {

    box.style.display = 'none';

  box.style.display = '';
  txt.textContent = t('presence_aktiv', { n });
  const meId = aktuellerUser.id;
  const zeilen = presenceUsers.slice()

    .map(u => {
      const selbst = u.user_id === meId;
      const name = escapeHtml(nm(u.name || u.email || '?'));
      const sie  = selbst ? `<span class="pp-sie">${escapeHtml(t('presence_sie'))}</span>` : '';

    }).join('');
  panel.innerHTML = `<div class="pp-titel">${escapeHtml(t('presence_titel'))}</div><ul>${zeilen}</ul>`;

// ---- Live-Aktualisierung offener Personen-Overlays (P3) ---------------------
// Wenn ein anderer Nutzer eine Person speichert/löscht, während man ihr Detail-
// oder Bearbeiten-Overlay offen hat: Hinweis-Banner einblenden (im Editor werden
// laufende Eingaben NICHT überschrieben — erst auf Klick „Neueste übernehmen").
// Erkennung über eine stabile Signatur (eigene Felder + Beziehungen via externe IDs;
// FAM-IDs/Positionen bleiben außen vor, da nicht inhaltlich relevant).
let detailWatchId = null, detailWatchSig = null;
let editWatchId   = null, editWatchSig   = null;
let editBaselineUpdated = null;   // P5: Stand (updated_at) der Person beim Öffnen des Editors

function personSignatur(personId) {
  const p = aktuelleDaten.persons[personId];
  if (!p) return null;   // Person existiert nicht mehr (gelöscht)
  const eigen = {};
  Object.keys(p)
    .filter(k => !k.startsWith('_') && k !== 'families_spouse' && k !== 'families_child')
    .sort()
    .forEach(k => { eigen[k] = p[k]; });
  // Beziehungen über STABILE externe IDs (Eltern/Partner/Kinder) — FAM-IDs sind je Reload neu.
  const rel = new Set();
  (p.families_child || []).forEach(fid => {
    const f = aktuelleDaten.families[fid]; if (!f) return;
    [f.husband, f.wife].forEach(x => { if (x && x !== personId) rel.add('E:' + x); });
  });
  (p.families_spouse || []).forEach(fid => {
    const f = aktuelleDaten.families[fid]; if (!f) return;
    const partner = f.husband === personId ? f.wife : f.husband;
    if (partner) rel.add('P:' + partner);
    (f.children || []).forEach(c => rel.add('K:' + c));
  });
  return JSON.stringify(eigen) + '||' + [...rel].sort().join(',');
}

// Nach einem Live-Reload prüfen, ob eine offen angezeigte Person betroffen ist.
function pruefeOverlayAktualitaet() {
  if (document.getElementById('modal')?.classList.contains('aktiv') && detailWatchId) {
    const neu = personSignatur(detailWatchId);
    if (neu === null) syncBannerEinfuegen(document.getElementById('modal-text'), 'sync-hinweis-detail', true,  'detailUebernehmen()');
    else if (neu !== detailWatchSig) syncBannerEinfuegen(document.getElementById('modal-text'), 'sync-hinweis-detail', false, 'detailUebernehmen()');
  }
  if (document.getElementById('person-edit-modal')?.classList.contains('aktiv') && editWatchId) {
    const inhalt = document.querySelector('#person-edit-modal .modal-inhalt');
    const neu = personSignatur(editWatchId);
    if (neu === null) syncBannerEinfuegen(inhalt, 'sync-hinweis-edit', true,  'editUebernehmen()');
    else if (neu !== editWatchSig) syncBannerEinfuegen(inhalt, 'sync-hinweis-edit', false, 'editUebernehmen()');

  const karte = document.getElementById('obav-vkn-' + id);

  const { error } = await sbClient.rpc('verknuepfung_entscheiden', { p_id: id, p_aktion: aktion });

function zeigeDublettenDialog(matches, kontext) {
  dubKontext = kontext;
  const fehler = document.getElementById('dub-fehler'); fehler.style.display = 'none'; fehler.textContent = '';
  const box = document.getElementById('dub-liste');
  box.innerHTML = (matches || []).map(m => {

function dubTrotzdem() {
  const k = dubKontext; dubKontext = null;
  schliesseDublettenModal();
  if (k && typeof k.proceed === 'function') k.proceed();
}

async function dubVerknuepfen(matchId) {
  const k = dubKontext; if (!k) return;
  const fehler = document.getElementById('dub-fehler'); fehler.style.display = 'none';
  const { data, error } = await sbClient.rpc('verknuepfung_anfragen', {
    p_modus: k.modus, p_kontext: k.kontext, p_ziel: matchId, p_typ: k.typ || null, p_zweiter: k.zweiter || null
  });
  if (error) { fehler.textContent = t('reg_fehler') + error.message; fehler.style.display = 'block'; return; }
  dubKontext = null;
  schliesseDublettenModal();
  if (data === 'sofort') {
    // verknüpftes Kind in alle Bäume beider Eltern spiegeln
    if (k.typ === 'kind') { try { await sbClient.rpc('kind_baeume_sync', { p_kind: matchId }); } catch (e) { console.warn('kind_baeume_sync:', e); } }
    if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  }
  if (k && typeof k.onLinked === 'function') await k.onLinked();
  await zeigeHinweis(t(data === 'sofort' ? 'vkn_sofort' : 'vkn_angefragt'));
}

// Stammbaum löschen — nur Owner/Super. Bei mehreren eigenen Bäumen: Auswahl;
// bei genau einem: deutliche Warnung. Danach zweite Sicherheitsabfrage.
let bdBaeume = [];
async function loescheStammbaum() {
  if (!istAdmin()) return;
  const menu = document.getElementById('nav-menu'); if (menu) menu.classList.remove('offen');

  const { data, error } = await sbClient.rpc('meine_owner_baeume');
  if (error) { await zeigeHinweis(t('reg_fehler') + error.message); return; }
  bdBaeume = data || [];
  if (bdBaeume.length === 0) { await zeigeHinweis(t('bd_keine')); return; }

  const einzeln = bdBaeume.length === 1;
  const sel  = document.getElementById('bd-auswahl');
  sel.innerHTML = bdBaeume.map(b =>
    `<option value="${b.stammbaum_id}">${escapeHtml(nm(b.stammbaum_name || '?'))} (${b.personen ?? 0})</option>`
  ).join('');
  document.getElementById('bd-auswahl-wrap').style.display = einzeln ? 'none' : '';
  document.getElementById('bd-warnung').textContent = einzeln ? t('bd_warnung_einzeln') : t('bd_warnung_mehrere');
  document.getElementById('baum-del-modal').classList.add('aktiv');
}

function schliesseBaumDel() {
  document.getElementById('baum-del-modal').classList.remove('aktiv');
}

// Zweite Sicherheitsabfrage, dann löschen.
async function bestaetigeBaumLoeschen() {
  const sel = document.getElementById('bd-auswahl');
  const treeId = sel.value || (bdBaeume[0] && bdBaeume[0].stammbaum_id);
  if (!treeId) return;
  const b = bdBaeume.find(x => x.stammbaum_id === treeId);
  const name = nm((b && b.stammbaum_name) || '?');

  const ok = await zeigeBestaetigung(t('bd_sicher', { name }));
  if (!ok) return;

  // Event-ids dieses Baums VORHER holen (DB-Zeilen fallen gleich per CASCADE weg),
  // damit wir danach deren Storage-Medien aufräumen können.
  let baumEventIds = [];
  try {
    const { data: evs } = await sbClient.rpc('events_fuer_stammbaum', { p_tree: treeId });
    baumEventIds = (evs || []).map(e => e.id);
  } catch (e) { console.warn('Event-ids für Storage-Aufräumen nicht ermittelbar:', e); }

  const { data, error } = await sbClient.rpc('stammbaum_loeschen', { p_tree: treeId });
  if (error) { await zeigeHinweis(t('reg_fehler') + error.message); return; }

  // Storage-Medien aller Events des gelöschten Baums entfernen (keine Waisen)
  for (const eid of baumEventIds) await loescheEventMedien(eid);

  schliesseBaumDel();
  aktuellerStammbaumId = null;
  try { if (localStorage.getItem('vidovic_tree') === treeId) localStorage.removeItem('vidovic_tree'); } catch (e) {}
  await setzeUser(aktuellerUser);   // Rolle + Baum + Menü neu laden (ggf. jetzt tree-los);
                                    // ohne Baum zeigt aktualisiereInhaltSichtbarkeit den Leer-Zustand.
  await zeigeHinweis(t('baum_geloescht'));
}

function schliesseBaumNeu() {
  document.getElementById('baum-neu-modal').classList.remove('aktiv');
}

async function erstelleStammbaum() {
  if (!aktuellerUser) return;
  const fehlerEl = document.getElementById('bn-fehler');
  const erfolgEl = document.getElementById('bn-erfolg');
  const button   = document.getElementById('bn-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';
  feldFehlerReset('baum-neu-modal');
  const v = id => document.getElementById(id).value.trim();
  const name = v('bn-name');
  const zusatz = v('bn-zusatz');
  if (!name) return feldFehler('bn-name', t('feld_pflicht'));
  if (!istGueltigerBaumName(name)) return feldFehler('bn-name', t('name_nur_buchstaben'));

  const altText = button.textContent;
  button.disabled = true; button.textContent = t('reg_senden_laeuft');
  const { data, error } = await sbClient.rpc('stammbaum_anlegen',
    { p_name: name, p_vorname: v('bn-vorname'), p_nachname: v('bn-nachname'), p_zusatz: zusatz || null });
  button.disabled = false; button.textContent = altText;
  if (error) {
    const msg = error.message || '';
    // Dublette: RPC meldet 'stammbaum_name_existiert' -> freundliche Meldung am Namensfeld
    if (/stammbaum_name_existiert/i.test(msg)) return feldFehler('bn-name', t('bn_existiert'));
    fehlerEl.textContent = t('reg_fehler') + msg; fehlerEl.style.display = 'block'; return;
  }

  erfolgEl.textContent = t('bn_erfolg'); erfolgEl.style.display = 'block';
  aktuellerStammbaumId = null;
  await setzeUser(aktuellerUser);   // Rolle (jetzt Owner) + Baumliste/Dropdown frisch (awaited in setzeUser)
  if (data && stammbaeumeListe[data]) waehleStammbaum(data);   // neuen Baum sofort auswählen + Überschrift aktualisieren
  else befuelleStammbaumAuswahl();
  setTimeout(() => schliesseBaumNeu(), 900);
}

// ============================================================
// E-MAIL-VALIDIERUNG (global) — EINE zentrale Regel für ALLE E-Mail-Felder.
// Frontend-Guard; das Backend (Edge Functions / RPC ist_gueltige_email) prüft erneut.
// ------------------------------------------------------------
function isValidEmail(email) {
  const e = (email || '').trim();
  if (!e || /\s/.test(e)) return false;                  // keine Leerzeichen
  if ((e.match(/@/g) || []).length !== 1) return false;  // genau ein @
  if (e.includes('..')) return false;                    // keine doppelten Punkte
  // lokaler Teil @ Domain mit mind. einem Punkt + TLD, keine ungültigen Zeichen
  return /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(e);
}

// Feld optisch markieren + Hinweis darunter (oder entfernen)
function markiereEmailFehler(input, zeige) {
  if (!input) return;
  input.classList.toggle('input-fehler', !!zeige);
  const eltern = input.closest('label') || input.parentNode;
  let hint = eltern.querySelector('.feld-fehler-text.email-hint');
  if (zeige) {
    if (!hint) { hint = document.createElement('span'); hint.className = 'feld-fehler-text email-hint'; eltern.appendChild(hint); }
    hint.textContent = t('email_ungueltig');
  } else if (hint) { hint.remove(); }
}

// Ein E-Mail-Feld prüfen. pflicht=true -> leer ist Fehler; sonst ist leer ok (optionales Feld).
function pruefeEmailFeld(input, pflicht) {
  if (!input) return true;
  const val = (input.value || '').trim();
  if (!val) { markiereEmailFehler(input, !!pflicht); return !pflicht; }
  const ok = isValidEmail(val);
  markiereEmailFehler(input, !ok);
  return ok;
}

// Live-Validierung an alle E-Mail-Felder hängen (blur prüft, Tippen entschärft den Fehler)
function bindeEmailLiveCheck(root) {
  (root || document).querySelectorAll('input[type="email"], input.email-feld').forEach(inp => {
    if (inp._emailBound) return; inp._emailBound = true;
    inp.addEventListener('blur',  () => { if (inp.value.trim()) pruefeEmailFeld(inp, false); });
    inp.addEventListener('input', () => { if (inp.classList.contains('input-fehler')) markiereEmailFehler(inp, false); });
  });
}

// ── App-weite Feld-Fehler (ab v11): Validierungsfehler DIREKT am Feld zeigen (roter Rahmen +
//    Hinweis darunter), das Feld in den sichtbaren Bereich scrollen UND fokussieren — statt den
//    Fehler nur unten im Overlay anzuzeigen (dort leicht zu übersehen). Reuse der bestehenden
//    .input-fehler/.feld-fehler-text-Optik (wie der E-Mail-Check). Gibt IMMER false zurück →
//    praktisch als `return feldFehler('feld-id', t('...'));` in Validierungen.
function feldFehler(input, msg) {
  if (typeof input === 'string') input = document.getElementById(input);
  if (!input) return false;
  const sicht = input._ssControl || input;          // suchbares Select -> sichtbares Steuerelement
  input.classList.add('input-fehler'); sicht.classList.add('input-fehler');
  const host = input.closest('label') || input.parentNode;
  let hint = host && host.querySelector(':scope > .feld-fehler-text:not(.email-hint)');
  if (host && !hint) { hint = document.createElement('span'); hint.className = 'feld-fehler-text'; host.appendChild(hint); }
  if (hint) hint.textContent = msg || '';
  if (!input._fehlerBound) {                         // bei nächster Eingabe Fehler entschärfen
    input._fehlerBound = true;
    const weg = () => feldFehlerWeg(input);
    input.addEventListener('input', weg);
    input.addEventListener('change', weg);
  }
  try { sicht.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
  try { sicht.focus({ preventScroll: true }); } catch (e) { try { sicht.focus(); } catch (e2) {} }
  return false;
}
// Nur ins Feld scrollen + fokussieren (ohne eigenen Hinweis) — z. B. wenn der Hinweis bereits
// anderweitig am Feld steht (E-Mail-Check). Gibt false zurück.
function feldFokus(input) {
  if (typeof input === 'string') input = document.getElementById(input);
  if (!input) return false;
  const sicht = input._ssControl || input;
  try { sicht.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
  try { sicht.focus({ preventScroll: true }); } catch (e) { try { sicht.focus(); } catch (e2) {} }
  return false;
}
// Fehlerzustand eines einzelnen Feldes entfernen (eigener Hinweis, nicht der E-Mail-Hinweis).
function feldFehlerWeg(input) {
  if (typeof input === 'string') input = document.getElementById(input);
  if (!input) return;
  input.classList.remove('input-fehler');
  if (input._ssControl) input._ssControl.classList.remove('input-fehler');
  const host = input.closest('label') || input.parentNode;
  const hint = host && host.querySelector(':scope > .feld-fehler-text:not(.email-hint)');
  if (hint) hint.textContent = '';
}
// Alle Feld-Fehler in einem Container/Overlay zurücksetzen (vor erneuter Validierung).
function feldFehlerReset(container) {
  container = (typeof container === 'string') ? document.getElementById(container) : container;
  if (!container) return;
  container.querySelectorAll('.input-fehler').forEach(i => i.classList.remove('input-fehler'));
  container.querySelectorAll('.feld-fehler-text:not(.email-hint)').forEach(e => e.textContent = '');
}

  if (error) {
    fehlerEl.textContent = feFehlerText(error.message);

let berDiagnose = null;

async function ladeBereinigung() {
  const box = document.getElementById('ber-inhalt'); if (!box) return;
  box.innerHTML = `<div class="event-media-empty">${escapeHtml(t('ber_laden'))}</div>`;
  const { data, error } = await sbClient.rpc('stammbaum_bereinigung_diagnose');
  if (error) {
    box.innerHTML = `<div class="login-fehler" style="display:block">${escapeHtml(t('reg_fehler') + error.message)}</div>`;
    return;
  }
  berDiagnose = data || {};
  renderBereinigung();
}

function renderBereinigung() {
  const box = document.getElementById('ber-inhalt'); if (!box) return;
  const d = berDiagnose || {};
  const z = d.zusammenfassung || {};
  const vorschlaege = Array.isArray(d.gruppen_vorschlag) ? d.gruppen_vorschlag : [];
  const leereFam = Array.isArray(d.familien_ohne_baum) ? d.familien_ohne_baum : [];
  const verwaist = (z.personen_baum_verwaist || 0) + (z.personen_familie_verwaist || 0) + (z.baeume_familie_verwaist || 0);

  // Zusammenfassung (Zähler)
  let html = `<div class="reg-gruppe-titel">${escapeHtml(t('ber_zus_titel'))}</div>
    <div class="obav-meta">
      <div><strong>${escapeHtml(t('ber_zus_personen_ohne_baum'))}:</strong> ${z.personen_ohne_baum || 0}</div>
      <div><strong>${escapeHtml(t('ber_zus_familien_ohne_baum'))}:</strong> ${z.familien_ohne_baum || 0}</div>
      <div><strong>${escapeHtml(t('ber_zus_verwaist'))}:</strong> ${verwaist}</div>
    </div>`;

  // Vorschläge (pro Gruppe ein „Anwenden")
  if (vorschlaege.length) {
    html += `<div class="reg-gruppe-titel" style="margin-top:16px">${escapeHtml(t('ber_vorschlaege_titel'))}</div>`;
    html += vorschlaege.map((g, i) => {
      const aktionLabel = g.vorschlag === 'zuordnen'
        ? t('ber_zuordnen', { baum: nm(g.ziel_baum_name || '') })
        : t('ber_neu_anlegen');
      return `<div class="obav-karte" id="ber-karte-${i}">
        <div class="obav-name">${escapeHtml(nm(g.beispiel_nachname || g.nachname_norm || '—'))}</div>
        <div class="obav-meta">
          <div><strong>${escapeHtml(t('ber_familie'))}:</strong> ${escapeHtml(nm(g.familie_name || '—'))}</div>
          <div><strong>${escapeHtml(t('ber_anzahl'))}:</strong> ${g.anzahl || 0}</div>
          <div><strong>${escapeHtml(t('ber_aktion'))}:</strong> ${escapeHtml(aktionLabel)}</div>
        </div>
        <div class="obav-aktionen">
          <button class="mv-toggle" type="button" onclick="berAnwenden(${i})">${escapeHtml(t('ber_anwenden'))}</button>
        </div>
      </div>`;
    }).join('');
  }

  // Leere Familien (nur Info — separates Thema, keine Auto-Aktion hier)
  if (leereFam.length) {
    html += `<div class="reg-gruppe-titel" style="margin-top:16px">${escapeHtml(t('ber_familien_ohne_baum_titel'))}</div>`;
    html += `<div class="obav-meta">` + leereFam.map(f => {
      const ort = [f.stadt, f.gemeinde, f.land].filter(Boolean).join(', ');
      return `<div>• ${escapeHtml(nm(f.name || '—'))}${ort ? ` <span style="opacity:.7">(${escapeHtml(ort)})</span>` : ''}</div>`;
    }).join('') + `</div>`;
  }

  // Nichts zu tun
  if (!vorschlaege.length && !leereFam.length) {
    html += `<div class="reg-erfolg" style="display:block;margin-top:14px">${escapeHtml(t('ber_keine'))}</div>`;
  }

  html += `<div class="fe-actions" style="margin-top:18px">
    <button class="login-submit fe-abbrechen" type="button" onclick="ladeBereinigung()">${escapeHtml(t('ber_aktualisieren'))}</button>
  </div>`;

  box.innerHTML = html;
}

async function berAnwenden(i) {
  const g = (berDiagnose && berDiagnose.gruppen_vorschlag || [])[i];
  if (!g) return;
  const ok = await zeigeBestaetigung(t('ber_anwenden_frage', {
    anzahl: g.anzahl || 0, nachname: nm(g.beispiel_nachname || '')
  }));
  if (!ok) return;
  const karte = document.getElementById('ber-karte-' + i);
  if (karte) { karte.style.opacity = '0.5'; karte.style.pointerEvents = 'none'; }
  const { data, error } = await sbClient.rpc('bereinigung_anwenden', {
    p_familie_id: g.familie_id, p_nachname: g.nachname_norm, p_ziel_baum_id: g.ziel_baum_id || null
  });
  if (error) {
    if (karte) { karte.style.opacity = ''; karte.style.pointerEvents = ''; }
    await zeigeHinweis(t('reg_fehler') + error.message); return;
  }
  await zeigeHinweis(t('ber_erfolg', { n: (data && data.zugeordnete_personen) || g.anzahl || 0 }));
  // Datenbereinigung als Auslöser: evtl. leer gewordene Bäume aufräumen (Super-Admin-Sweep) + Storage
  try { await sbClient.rpc('auto_leere_baeume_aufraeumen'); } catch (e) {}
  await raeumeVerwaisteMedien();
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();   // Baum-Dropdown/Ansicht aktualisieren
  await ladeBereinigung();   // Diagnose neu laden (Vorschlag verschwindet)
}

// RPC-Fehlercodes -> sprachabhängige Meldung
function owFehlerText(msg) {
  const m = (msg || '').toLowerCase();
  if (m.includes('owner_keine_berechtigung')) return t('ow_keine_berechtigung');
  if (m.includes('owner_unveraendert'))       return t('ow_unveraendert');
  if (m.includes('owner_user_fehlt'))         return t('ow_user_fehlt');
  if (m.includes('owner_keine_familie'))      return t('fe_keine_familie');
  return t('ow_fehler') + (msg || '');
}
