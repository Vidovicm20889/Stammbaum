// ============================================================
// INITIALISIERUNG
// ============================================================
// ============================================================
// SUCHBARE DROPDOWNS — wiederverwendbar für ALLE <select>
// Reichert jedes <select> mit Suchfeld (Teilstring, ab 2 Zeichen,
// case-insensitive, Echtzeit) an. Das native <select> bleibt die
// Wahrheit: value/onchange/IDs funktionieren unverändert weiter.
// Ein einziges, geteiltes Panel (kein Leak bei dynamischen Listen).
// ============================================================
let ssPanel, ssSearch, ssList, ssAktivSelect = null, ssRaf = null;

function ssInitPanel() {
  if (ssPanel) return;
  ssPanel = document.createElement('div');
  ssPanel.className = 'ss-panel';
  ssPanel.style.display = 'none';
  ssPanel.innerHTML = '<input type="text" class="ss-search" autocomplete="off"><ul class="ss-list"></ul>';
  document.body.appendChild(ssPanel);
  ssSearch = ssPanel.querySelector('.ss-search');
  ssList   = ssPanel.querySelector('.ss-list');
  ssSearch.addEventListener('input', () => ssRender(ssSearch.value));
  ssSearch.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') ssSchliesse();
    else if (e.key === 'Enter') { e.preventDefault(); const f = ssList.querySelector('.ss-opt'); if (f) ssWaehle(f.dataset.val); }
  });
  // Touch-sichere Auswahl: Tap selektiert, Scrollen nicht (siehe tippAuswahl).
  tippAuswahl(ssList, '.ss-opt', li => ssWaehle(li.dataset.val));
}

// Liste füllen: <2 Zeichen = alle; sonst Teilstring (case- UND schrift-insensitiv:
// beide Seiten nach Latein wandeln, damit Latein-Eingaben kyrillische Labels finden).
function ssRender(filter) {
  if (!ssAktivSelect) return;
  const f = srCyr2Lat((filter || '').trim()).toLowerCase();
  const opts = Array.from(ssAktivSelect.options);
  const vis = f.length < 2 ? opts : opts.filter(o => srCyr2Lat(o.textContent || '').toLowerCase().includes(f));
  if (vis.length === 0) {
    ssList.innerHTML = '<li class="ss-empty">' + escapeHtml(t('ss_keine')) + '</li>';
    return;
  }
  ssList.innerHTML = vis.map(o =>
    '<li class="ss-opt' + (o.value === ssAktivSelect.value ? ' ss-selected' : '') +
    '" data-val="' + escapeHtml(o.value) + '">' + escapeHtml(o.textContent) + '</li>'
  ).join('');
}

function ssPositioniere(select) {
  const r  = select._ssControl.getBoundingClientRect();
  const ph = ssPanel.offsetHeight;
  const platzUnten = window.innerHeight - r.bottom;
  const obenAuf = platzUnten < ph + 8 && r.top > platzUnten;   // nach oben klappen, wenn unten kein Platz
  ssPanel.style.left  = r.left + 'px';
  ssPanel.style.width = r.width + 'px';
  ssPanel.style.top   = (obenAuf ? Math.max(4, r.top - ph - 2) : r.bottom + 2) + 'px';
}

function ssOeffne(select) {
  ssSchliesse();
  ssAktivSelect = select;
  ssSearch.value = '';
  ssSearch.placeholder = t('ss_suche');
  ssRender('');
  ssPanel.style.visibility = 'hidden';   // erst messen, dann sichtbar -> kein Flackern
  ssPanel.style.display = 'flex';
  ssPositioniere(select);
  ssPanel.style.visibility = '';
  select._ssControl.classList.add('ss-open');
  // Auto-Fokus (Tastatur) nur auf Desktop; auf Touch würde die Tastatur die Liste
  // verdecken + Reflows auslösen — der Nutzer tippt das Suchfeld bei Bedarf selbst an.
  const grob = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (!grob) setTimeout(() => ssSearch.focus(), 30);
  ssRaf = requestAnimationFrame(ssSichtbarkeitsWaechter);   // schließt Panel, wenn Overlay/Menü zugeht
}

// Solange das Panel offen ist: wird das Steuerelement ausgeblendet (Overlay/Menü
// geschlossen — egal wie: ×, Backdrop, Escape, programmatisch), Panel mitschließen.
// offsetParent === null => Element oder ein Vorfahre ist display:none.
function ssSichtbarkeitsWaechter() {
  if (!ssAktivSelect) return;
  const c = ssAktivSelect._ssControl;
  if (!c || c.offsetParent === null) { ssSchliesse(); return; }
  ssRaf = requestAnimationFrame(ssSichtbarkeitsWaechter);
}

function ssSchliesse() {
  if (!ssAktivSelect) return;
  if (ssRaf) { cancelAnimationFrame(ssRaf); ssRaf = null; }
  ssPanel.style.display = 'none';
  if (ssAktivSelect._ssControl) ssAktivSelect._ssControl.classList.remove('ss-open');
  ssAktivSelect = null;
}

function ssWaehle(val) {
  const s = ssAktivSelect;
  if (!s) return;
  s.value = val;                                   // intercepted -> Label-Sync
  ssSchliesse();
  s.dispatchEvent(new Event('change', { bubbles: true }));   // bestehende onchange-Handler auslösen
}

function ssSyncLabel(select) {
  if (!select._ssControl) return;
  const o = select.options[select.selectedIndex];
  select._ssControl.querySelector('.ss-control-text').textContent = o ? o.textContent : '';
}

function macheSelectSuchbar(select) {
  if (select._ssControl || select.classList.contains('no-search')) return;
  // Steuerelement, das das native <select> ersetzt (kopiert dessen Klassen -> gleiches Aussehen)
  const control = document.createElement('div');
  control.className = (select.className ? select.className + ' ' : '') + 'ss-control';
  control.tabIndex = 0;
  control.setAttribute('role', 'button');
  control.innerHTML = '<span class="ss-control-text"></span><span class="ss-caret">▾</span>';
  select.parentNode.insertBefore(control, select.nextSibling);
  select.classList.add('ss-native');
  select._ssControl = control;

  // value-Interception: Label bleibt auch bei programmatischer Wertänderung synchron
  const desc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  Object.defineProperty(select, 'value', {
    configurable: true,
    get() { return desc.get.call(this); },
    set(v) { desc.set.call(this, v); ssSyncLabel(this); }
  });

  const toggle = (e) => {
    e.preventDefault(); e.stopPropagation();
    if (select.disabled) return;
    if (ssAktivSelect === select) ssSchliesse(); else ssOeffne(select);
  };
  control.addEventListener('click', toggle);
  control.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') toggle(e); });

  // Native Sichtbarkeit/disabled auf das Steuerelement spiegeln
  const spiegele = () => {
    control.style.display = (select.style.display === 'none') ? 'none' : '';
    control.classList.toggle('ss-disabled', select.disabled);
  };
  spiegele();

  // Reagiere auf: dynamische Optionen, style/disabled-Änderungen
  new MutationObserver(() => {
    ssSyncLabel(select);
    spiegele();
    if (ssAktivSelect === select) ssRender(ssSearch.value);
  }).observe(select, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'disabled'] });

  ssSyncLabel(select);
}

function macheAlleSelectsSuchbar(root) {
  (root || document).querySelectorAll('select:not(.ss-native):not(.no-search)').forEach(macheSelectSuchbar);
}

// Touch-sichere Auswahl in (scrollbaren) Listen: selektiert NUR bei einem echten
// Tap (kaum Bewegung), nicht beim Scroll-Wischen; feuert auf pointerup, also VOR
// dem verzögerten Ghost-Click und vor Tastatur-Reflow. Funktioniert auch mit Maus.
function tippAuswahl(container, selector, handler) {
  let sx = 0, sy = 0, item = null, moved = false;
  container.addEventListener('pointerdown', (e) => {
    item = e.target.closest(selector); sx = e.clientX; sy = e.clientY; moved = false;
  });
  container.addEventListener('pointermove', (e) => {
    if (item && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) moved = true;
  });
  container.addEventListener('pointerup', (e) => {
    const ziel = e.target.closest(selector);
    if (item && ziel === item && !moved) { e.preventDefault(); handler(item); }
    item = null;
  });
  container.addEventListener('pointercancel', () => { item = null; });   // Scroll-Übernahme -> kein Select
}

function initSuchbareSelects() {
  ssInitPanel();
  macheAlleSelectsSuchbar(document);
  // Schließen bei Tipp/Klick außerhalb. WICHTIG: pointerdown statt click — feuert
  // sofort am echten Punkt, vor Tastatur-Reflow/Scroll/Ghost-Click (Android-Bug).
  document.addEventListener('pointerdown', (e) => {
    if (ssAktivSelect && !ssPanel.contains(e.target) &&
        e.target !== ssAktivSelect._ssControl && !ssAktivSelect._ssControl.contains(e.target)) ssSchliesse();
  });
  // Resize/Scroll NICHT schließen (mobile Tastatur löst Resize aus!) -> nur neu positionieren,
  // damit das Panel am Steuerelement „klebt".
  window.addEventListener('resize', () => { if (ssAktivSelect) ssPositioniere(ssAktivSelect); });
  window.addEventListener('scroll', (e) => { if (ssAktivSelect && !ssPanel.contains(e.target)) ssPositioniere(ssAktivSelect); }, true);
}

// ============================================================
// DATUMSFELDER — einheitlicher Vanilla-Kalender (Date Picker)
// Eingabe per Kalender ODER manuell. Speicherung kanonisch als ISO
// (YYYY-MM-DD) in stammbaum_daten (date-Spalte bleibt NULL). Anzeige
// sprachabhängig: Eingabe-Kurzformat + benutzerfreundliches Langformat.
// Nicht-parsebare Altwerte (Jahr, "um 1850", Bereiche) bleiben Freitext.
// ============================================================
const KALENDER = {
  de: { monate: ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],
        wochentage: ['Mo','Di','Mi','Do','Fr','Sa','So'], wochenStart: 1, heute: 'Heute', loeschen: 'Löschen' },
  sr: { monate: ['јануар','фебруар','март','април','мај','јун','јул','август','септембар','октобар','новембар','децембар'],
        wochentage: ['Пон','Уто','Сре','Чет','Пет','Суб','Нед'], wochenStart: 1, heute: 'Данас', loeschen: 'Обриши' },
  hr: { monate: ['siječanj','veljača','ožujak','travanj','svibanj','lipanj','srpanj','kolovoz','rujan','listopad','studeni','prosinac'],
        wochentage: ['Pon','Uto','Sri','Čet','Pet','Sub','Ned'], wochenStart: 1, heute: 'Danas', loeschen: 'Obriši' },
  ba: { monate: ['januar','februar','mart','april','maj','juni','juli','august','septembar','oktobar','novembar','decembar'],
        wochentage: ['Pon','Uto','Sri','Čet','Pet','Sub','Ned'], wochenStart: 1, heute: 'Danas', loeschen: 'Obriši' },
  en: { monate: ['January','February','March','April','May','June','July','August','September','October','November','December'],
        wochentage: ['Su','Mo','Tu','We','Th','Fr','Sa'], wochenStart: 0, heute: 'Today', loeschen: 'Clear' }
};
const DATUM_PH = { de: 'TT.MM.JJJJ', sr: 'DD.MM.GGGG', hr: 'DD.MM.GGGG', ba: 'DD.MM.GGGG', en: 'MM/DD/YYYY' };

function dpZahl(n) { return String(n).padStart(2, '0'); }
function isoVon(j, m, t) { return j + '-' + dpZahl(m) + '-' + dpZahl(t); }
function istIsoDatum(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); }
function dpGueltig(j, m, t) {
  if (m < 1 || m > 12 || t < 1 || t > 31) return null;
  const d = new Date(j, m - 1, t);
  if (d.getFullYear() !== j || d.getMonth() !== m - 1 || d.getDate() !== t) return null;  // 31.02. etc. abfangen
  return isoVon(j, m, t);
}
// Beliebigen Text -> ISO 'YYYY-MM-DD' oder null (= Freitext/ungefähr, bleibt erhalten)
function parseDatumZuIso(text) {
  const s = (text || '').trim(); if (!s) return null; let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))  return dpGueltig(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/))) return dpGueltig(+m[3], +m[2], +m[1]);  // TT.MM.JJJJ
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return dpGueltig(+m[3], +m[1], +m[2]);  // MM/DD/YYYY
  return null;
}
function isoZuKurz(iso, lang) {
  const m = (iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return iso || '';
  return (lang === 'en') ? (m[2] + '/' + m[3] + '/' + m[1]) : (m[3] + '.' + m[2] + '.' + m[1]);
}
function isoZuLang(iso, lang) {
  const m = (iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return iso || '';
  const kal = KALENDER[lang] || KALENDER.de;
  const tag = +m[3], monat = kal.monate[+m[2] - 1], jahr = m[1];
  return (lang === 'en') ? (monat + ' ' + tag + ', ' + jahr) : (tag + '. ' + monat + ' ' + jahr);
}
// Gespeicherten Wert benutzerfreundlich anzeigen (parsebar -> Langformat; sonst verbatim)
function formatDatumLang(value) {
  const iso = istIsoDatum(value) ? value : parseDatumZuIso(value);
  return iso ? isoZuLang(iso, aktuelleSprache) : (value || '');
}
// Kanonischer Speicherwert eines Feldes: ISO falls parsebar, sonst Freitext
function datumWert(input) {
  if (!input) return '';
  const iso = parseDatumZuIso(input.value);
  return iso || input.value.trim();
}
// Feld setzen (ISO oder Freitext) -> Kurzformat anzeigen + iso merken
function datumSetzen(input, value) {
  if (!input) return;
  if (!value) { input.value = ''; delete input.dataset.iso; return; }
  const iso = istIsoDatum(value) ? value : parseDatumZuIso(value);
  if (iso) { input.dataset.iso = iso; input.value = isoZuKurz(iso, aktuelleSprache); }
  else     { delete input.dataset.iso; input.value = value; }
}

let dpPanel, dpAktivInput = null, dpJahr, dpMonat, dpRaf = null;

function dpInitPanel() {
  if (dpPanel) return;
  dpPanel = document.createElement('div');
  dpPanel.className = 'dp-panel'; dpPanel.style.display = 'none';
  dpPanel.innerHTML =
    '<div class="dp-head">' +
      '<button type="button" class="dp-nav" data-step="-12">«</button>' +
      '<button type="button" class="dp-nav" data-step="-1">‹</button>' +
      '<span class="dp-title"></span>' +
      '<button type="button" class="dp-nav" data-step="1">›</button>' +
      '<button type="button" class="dp-nav" data-step="12">»</button>' +
    '</div>' +
    '<div class="dp-weekdays"></div><div class="dp-grid"></div>' +
    '<div class="dp-foot"><button type="button" class="dp-today"></button><button type="button" class="dp-clear"></button></div>';
  document.body.appendChild(dpPanel);
  dpPanel.querySelectorAll('.dp-nav').forEach(b =>
    b.addEventListener('click', e => { e.preventDefault(); dpVerschiebe(+b.dataset.step); }));
  dpPanel.querySelector('.dp-grid').addEventListener('click', e => {
    const d = e.target.closest('.dp-day[data-iso]'); if (d) dpWaehle(d.dataset.iso);
  });
  dpPanel.querySelector('.dp-today').addEventListener('click', e => {
    e.preventDefault(); const n = new Date(); dpWaehle(isoVon(n.getFullYear(), n.getMonth() + 1, n.getDate()));
  });
  dpPanel.querySelector('.dp-clear').addEventListener('click', e => {
    e.preventDefault();
    if (dpAktivInput) { const i = dpAktivInput; datumSetzen(i, ''); dpSchliesse(); i.dispatchEvent(new Event('input', { bubbles: true })); }
  });
}

function dpVerschiebe(monate) {
  let m = dpMonat + monate;
  dpJahr += Math.floor(m / 12);
  dpMonat = ((m % 12) + 12) % 12;
  dpRender();
}

function dpRender() {
  if (!dpPanel) return;
  const kal = KALENDER[aktuelleSprache] || KALENDER.de;
  dpPanel.querySelector('.dp-title').textContent = kal.monate[dpMonat] + ' ' + dpJahr;
  dpPanel.querySelector('.dp-weekdays').innerHTML = kal.wochentage.map(d => '<span>' + escapeHtml(d) + '</span>').join('');
  dpPanel.querySelector('.dp-today').textContent = kal.heute;
  dpPanel.querySelector('.dp-clear').textContent = kal.loeschen;
  const start = kal.wochenStart;                                       // 1=Mo, 0=So
  let offset = (new Date(dpJahr, dpMonat, 1).getDay() - start + 7) % 7;
  const tage = new Date(dpJahr, dpMonat + 1, 0).getDate();
  const n = new Date(); const heuteIso = isoVon(n.getFullYear(), n.getMonth() + 1, n.getDate());
  const selIso = dpAktivInput && dpAktivInput.dataset.iso;
  let html = '';
  for (let i = 0; i < offset; i++) html += '<button type="button" class="dp-day dp-leer" disabled></button>';
  for (let d = 1; d <= tage; d++) {
    const iso = isoVon(dpJahr, dpMonat + 1, d);
    const cls = 'dp-day' + (iso === heuteIso ? ' dp-heute' : '') + (iso === selIso ? ' dp-sel' : '');
    html += '<button type="button" class="' + cls + '" data-iso="' + iso + '">' + d + '</button>';
  }
  dpPanel.querySelector('.dp-grid').innerHTML = html;
}

function dpPositioniere(ref) {
  const r = ref.getBoundingClientRect();
  const ph = dpPanel.offsetHeight, pw = dpPanel.offsetWidth;
  const platzUnten = window.innerHeight - r.bottom;
  const obenAuf = platzUnten < ph + 8 && r.top > platzUnten;
  let left = r.left;
  if (left + pw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - pw - 8);
  dpPanel.style.left = left + 'px';
  dpPanel.style.top  = (obenAuf ? Math.max(4, r.top - ph - 2) : r.bottom + 2) + 'px';
}

function dpOeffne(input) {
  dpInitPanel();
  dpSchliesse();
  dpAktivInput = input;
  const iso = input.dataset.iso || parseDatumZuIso(input.value);
  const base = iso ? new Date(iso + 'T00:00:00') : new Date();
  dpJahr = base.getFullYear(); dpMonat = base.getMonth();
  dpRender();
  dpPanel.style.visibility = 'hidden'; dpPanel.style.display = 'block';
  dpPositioniere(input._dpWrap || input);
  dpPanel.style.visibility = '';
  dpRaf = requestAnimationFrame(dpSichtbarkeitsWaechter);
}

// Schließt das Panel, sobald das Feld ausgeblendet wird (Overlay/Menü zu) — wie ss.
function dpSichtbarkeitsWaechter() {
  if (!dpAktivInput) return;
  const ref = dpAktivInput._dpWrap || dpAktivInput;
  if (!ref || ref.offsetParent === null) { dpSchliesse(); return; }
  dpRaf = requestAnimationFrame(dpSichtbarkeitsWaechter);
}

function dpSchliesse() {
  if (!dpAktivInput) return;
  if (dpRaf) { cancelAnimationFrame(dpRaf); dpRaf = null; }
  if (dpPanel) dpPanel.style.display = 'none';

}

function dpWaehle(iso) {

function macheDatumsfeld(input) {
  if (input._dpReady) return;
  input._dpReady = true;
  input.setAttribute('autocomplete', 'off');
  const wrap = document.createElement('span'); wrap.className = 'dp-wrap';
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'dp-btn'; btn.setAttribute('aria-label', 'Kalender'); btn.textContent = '📅';
  wrap.appendChild(btn);
  input._dpWrap = wrap;
  input.placeholder = DATUM_PH[aktuelleSprache] || DATUM_PH.de;
  if (input.value) datumSetzen(input, input.value);   // evtl. vorbefüllten Wert normalisieren
  btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); (dpAktivInput === input) ? dpSchliesse() : dpOeffne(input); });
  input.addEventListener('blur', () => { const iso = parseDatumZuIso(input.value); if (iso) datumSetzen(input, iso); else delete input.dataset.iso; });
}

function macheAlleDatumsfelder(root) {
  (root || document).querySelectorAll('input.dp-input').forEach(el => { if (!el._dpReady) macheDatumsfeld(el); });

// ============================================================
// SESSION- & VERSIONS-MANAGEMENT
// - Auto-Logout nach 30 Min Inaktivität (mit Warnung 1 Min vorher)
// - Nach Auto-Logout + erneutem Login: harter Reload -> neueste Version
// - Versionsprüfung erkennt neue Deployments -> Update-Banner
// - Harter Reload via Cache-Busting (?v=timestamp): Single-File auf GitHub Pages
//   hat keine separat gehashten Assets; der Query-Param umgeht den HTML-Cache.
// ============================================================
const APP_VERSION = (document.querySelector('meta[name="app-version"]') || {}).content || '';

function hardReload() {
  const basis = location.href.replace(/[?#].*$/, '');   // bestehende Query/Hash entfernen
  location.replace(basis + '?v=' + Date.now());          // frischer Param -> umgeht HTML-Cache
}

// ---- Inaktivitäts-Überwachung ----
const SESSION_INAKTIV_MS = 30 * 60 * 1000;
const SESSION_WARN_MS    = 60 * 1000;            // 1 Minute vor Logout warnen
let sessIdleTimer = null, sessWarnTimer = null, sessLetzteAktivitaet = 0;

function resetInaktivTimer() {
  clearTimeout(sessIdleTimer); clearTimeout(sessWarnTimer);
  versteckeSessionWarnung();
  if (!aktuellerUser) return;                    // nur für eingeloggte Nutzer
  sessWarnTimer = setTimeout(zeigeSessionWarnung, SESSION_INAKTIV_MS - SESSION_WARN_MS);
  sessIdleTimer = setTimeout(sessionAutoLogout, SESSION_INAKTIV_MS);
}
function sessAktivitaet() {
  if (!aktuellerUser) return;
  const now = Date.now();
  if (now - sessLetzteAktivitaet < 2000) return;  // throttle (mousemove/scroll feuern oft)
  sessLetzteAktivitaet = now;
  resetInaktivTimer();
}
function zeigeSessionWarnung() {
  if (aktuellerUser) document.getElementById('session-warn-modal').classList.add('aktiv');
}
function versteckeSessionWarnung() {
  const m = document.getElementById('session-warn-modal');
  if (m) m.classList.remove('aktiv');
}
function sessionVerlaengern() { versteckeSessionWarnung(); resetInaktivTimer(); }
async function sessionAutoLogout() {
  versteckeSessionWarnung();
  clearTimeout(sessIdleTimer); clearTimeout(sessWarnTimer);
  sessionStorage.setItem('reloadNachLogin', '1');   // nächster Login -> harter Reload (neueste Version)
  try { await sbClient.auth.signOut(); } catch (e) {}   // -> onAuthStateChange -> loescheUser
  zeigeHinweis(t('session_abgemeldet'));
}
function initSessionUeberwachung() {
  ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(ev =>
    document.addEventListener(ev, sessAktivitaet, { passive: true, capture: true }));
  // Bei Rückkehr in den Tab: Hintergrund-Tabs drosseln Timer -> reale verstrichene
  // Zeit prüfen und ggf. sofort abmelden (statt auf den evtl. „eingefrorenen" Timer zu warten).
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !aktuellerUser) return;
    if (sessLetzteAktivitaet && Date.now() - sessLetzteAktivitaet >= SESSION_INAKTIV_MS) sessionAutoLogout();
    else sessAktivitaet();
  });
}

// ---- Versionsprüfung (neues Deployment erkennen) ----
let updateGemeldet = false, letzteVersionsPruefung = 0;
async function pruefeNeueVersion() {
  if (updateGemeldet) return;
  const now = Date.now();
  if (now - letzteVersionsPruefung < 5 * 60 * 1000) return;   // höchstens alle 5 Min
  letzteVersionsPruefung = now;
  try {
    // Range: nur die ersten KB (app-version-Meta steht oben im <head>); no-store = nie aus Cache.
    const res = await fetch(location.pathname + '?vc=' + now, { cache: 'no-store', headers: { 'Range': 'bytes=0-4095' } });
    if (!res.ok && res.status !== 206) return;
    const text = await res.text();
    const m = text.match(/<meta name="app-version" content="([^"]+)">/);
    const serverVersion = m ? m[1] : '';
    if (serverVersion && APP_VERSION && serverVersion !== APP_VERSION) {
      updateGemeldet = true;
      const b = document.getElementById('update-banner');
      if (b) b.style.display = 'flex';
    }
  } catch (e) { /* offline / Fehler -> ignorieren */ }
}
function initVersionsPruefung() {
  setTimeout(pruefeNeueVersion, 60 * 1000);            // ~1 Min nach Start
  setInterval(pruefeNeueVersion, 20 * 60 * 1000);      // alle 20 Min
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pruefeNeueVersion(); });
}

  // sofort am echten Punkt — vor Tastatur-Reflow/Scroll/Ghost-Click auf Android/iOS.
  document.addEventListener('pointerdown', (e) => {
    const menu = document.getElementById('nav-menu');
    if (menu && !menu.contains(e.target)) menu.classList.remove('offen');
    // Kalender schließen bei Tipp außerhalb von Panel und aktivem Datumsfeld
    if (dpAktivInput && dpPanel && !dpPanel.contains(e.target) &&
        !(dpAktivInput._dpWrap && dpAktivInput._dpWrap.contains(e.target))) dpSchliesse();
  });
  // Resize/Scroll NICHT schließen (mobile Tastatur = Resize) -> Kalender neu positionieren
  window.addEventListener('resize', () => { if (dpAktivInput) dpPositioniere(dpAktivInput._dpWrap || dpAktivInput); });
  window.addEventListener('scroll', (e) => { if (dpAktivInput && !dpPanel.contains(e.target)) dpPositioniere(dpAktivInput._dpWrap || dpAktivInput); }, true);
  // Tab wird wieder sichtbar -> Obavještenja sofort aktualisieren (nicht erst beim nächsten Poll-Tick)
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') obavLivePoll(); });

  // Deep-Link aus der Benachrichtigungs-Mail: ?obav=1 merkt vor, dass nach dem
  // Login die Obavještenja-Liste geöffnet werden soll. Param sofort aus der URL
  // entfernen, damit ein späterer Reload die Liste nicht erneut aufpoppt.
  try {
    const params = new URLSearchParams(location.search);
    if (params.get('obav') === '1') {
      deepLinkObav = true;
      params.delete('obav');
      const q = params.toString();
      history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
    }
  } catch (e) { /* URL nicht parsebar -> ignorieren */ }

  initBaum();
  bindeEmailLiveCheck(document);   // globale E-Mail-Live-Validierung (alle E-Mail-Felder)
  wechselSprache(aktuelleSprache, false);   // nur anwenden, NICHT speichern (sonst Willkommen-Overlay nur einmal)
  wechselAnsicht('baum');
  ladeAuth();
  pruefePasswortSetzen();
  aktualisiereInhaltSichtbarkeit();   // Standard: ohne Login kein Baum, nur Hinweis
  // Erstaufruf ohne gespeicherte Sprache: Willkommens-Overlay zur expliziten Sprachwahl.
  if (!spracheWarGespeichert) zeigeWillkommenSprache();
}

function zeigeKarten() {
  const suche = document.getElementById('suche').value.toLowerCase();
  const nachname = document.getElementById('filter-nachname').value;
  const grid = document.getElementById('personen-grid');
  
  const gefiltert = Object.values(aktuelleDaten.persons).filter(p => {
    if (suche && !p.name.toLowerCase().includes(suche)) return false;
    if (nachname) {
      const pn = p.surname || t('filter_unbekannt');
      if (pn !== nachname) return false;
    }
    return true;
  }).sort((a,b) => {
    const ja = parseInt(a.birth_date) || 9999;
    const jb = parseInt(b.birth_date) || 9999;
    if (ja !== jb) return ja - jb;
    return a.name.localeCompare(b.name);
  });
  
  if (gefiltert.length === 0) {
    grid.innerHTML = `<div class="keine-treffer">${t('keine_treffer')}</div>`;
    return;
  }
  
  grid.innerHTML = '';
  gefiltert.forEach(p => {
    const karte = document.createElement('div');
    karte.className = 'person' + (p.deceased ? ' verstorben' : '');
    karte.onclick = () => zeigeDetails(p.id);
    
    const initialen = nm(((p.given[0] || '') + (p.surname[0] || '')).toUpperCase()) || '?';
    const avatarKlasse = p.sex === 'M' ? 'male' : (p.sex === 'F' ? 'female' : 'unknown');
    
    let lebensdaten = '';
    if (p.birth_date || p.death_date) {
      lebensdaten = `* ${formatDatumLang(p.birth_date) || '?'}`;
      if (p.deceased || p.death_date) lebensdaten += ` † ${formatDatumLang(p.death_date) || '?'}`;
    }
    
    karte.innerHTML = `
      <div class="avatar ${avatarKlasse}">${initialen}</div>
      <h3>${escapeHtml(nm(p.given || '?'))}</h3>
      <p class="nachname">${escapeHtml(nm(p.surname || ''))}${p.ehename ? ` <span class="maiden-name">(${escapeHtml(nm(p.ehename))})</span>` : ''}</p>
      ${lebensdaten ? `<div class="daten">${lebensdaten}</div>` : ''}
      ${p.birth_place ? `<div class="daten">📍 ${escapeHtml(uebersetzeOrt(p.birth_place))}</div>` : ''}
    `;
    grid.appendChild(karte);
  });
}

async function uploadEventMedia(eventId, file) {
  if (!file || !aktuellerUser) return { url: null, error: 'Keine Datei oder nicht authentifiziert.' };
  try {
    const bucket = 'events';
    const path = `${eventId}/${Date.now()}_${file.name}`;
    console.log('Upload starten:', { bucket, path, fileType: file.type, fileSize: file.size });
    
    const { data, error } = await sbClient.storage.from(bucket).upload(path, file, {
      cacheControl: '3600',
      upsert: false,
    });
    
    if (error) {
      console.error('Upload-Fehler:', error);
      return { url: null, error: error.message || 'Upload-Fehler' };
    }
    
    console.log('Upload erfolgreich:', data);
    console.log('Full upload response:', JSON.stringify(data));

    // Use the path returned by the upload response when available —
    // the client may normalize or alter the filename. Fall back to our
    // constructed `path` when upload response doesn't include it.
    let uploadedPath = (data && (data.path || data.Key || data.KeyName || data.name)) || path;

    // If the returned path accidentally contains the bucket name prefix,
    // strip it (e.g. "events/..." when we already pass the bucket separately).
    if (uploadedPath && uploadedPath.startsWith(bucket + '/')) {
      uploadedPath = uploadedPath.slice(bucket.length + 1);
      console.log('Stripped bucket prefix from uploadedPath, now:', uploadedPath);
    }

    console.log('Using path for signed URL:', uploadedPath);

    // Debug: list objects in the target folder to verify the object exists
    try {
      const { data: listData, error: listErr } = await sbClient.storage.from(bucket).list(eventId, { limit: 100 });
      console.log('List objects in folder', eventId, listData, listErr);
    } catch (listEx) {
      console.warn('List-exception:', listEx);
    }

    // Debug: get public URL (works for public buckets) to compare
    try {
      const publicRes = sbClient.storage.from(bucket).getPublicUrl(uploadedPath);
      console.log('Public URL result:', publicRes);
    } catch (pubEx) {
      console.warn('PublicUrl-exception:', pubEx);
    }

    // Try to create a signed URL first
    const { data: urlData, error: signError } = await sbClient.storage.from(bucket).createSignedUrl(uploadedPath, 60 * 60 * 24);
    if (!signError && urlData?.signedUrl) {
      console.log('Signed URL generiert:', urlData.signedUrl);
      return { url: urlData.signedUrl, error: null, storagePath: uploadedPath };
    }

    console.warn('Signed URL-Fehler:', signError);

    // Fallback 1: if the bucket is public, getPublicUrl will return a usable URL
    try {
      const publicRes = sbClient.storage.from(bucket).getPublicUrl(uploadedPath);
      if (publicRes && publicRes.data && publicRes.data.publicUrl) {
        console.log('Public URL result:', publicRes.data.publicUrl);
        return { url: publicRes.data.publicUrl, error: null, storagePath: uploadedPath };
      }
    } catch (pubEx) {
      console.warn('PublicUrl-exception:', pubEx);
    }

    // Fallback 2: try to download the object (requires auth) and create a blob URL
    try {
      const { data: downloadData, error: downloadError } = await sbClient.storage.from(bucket).download(uploadedPath);
      if (!downloadError && downloadData) {
        const blobUrl = URL.createObjectURL(downloadData);
        console.log('Erzeugt blob-URL für Anzeige');
        return { url: blobUrl, error: null, storagePath: uploadedPath, isBlob: true };
      } else {
        console.warn('Download-Fehler:', downloadError);
      }
    } catch (downloadEx) {
      console.warn('Download-exception:', downloadEx);
    }

    return { url: null, error: signError?.message || 'URL-Fehler', storagePath: uploadedPath };
  } catch (err) {
    console.error('Upload-Exception:', err);
    return { url: null, error: err.message || 'Unbekannter Fehler' };
  }
}

// Medien werden direkt aus dem geteilten Supabase-Storage gelesen, damit sie
// für ALLE eingeloggten User sichtbar sind (vorher nur im lokalen localStorage).
const EVENTS_BUCKET = 'events';

// Cache der zuletzt gerenderten Medienliste je Event – damit Löschen per Index
// den richtigen Storage-Pfad findet.
let letzteMedienListe = {};

async function renderEventMedia(eventId) {
  const { data: files, error } = await sbClient.storage
    .from(EVENTS_BUCKET)
    .list(eventId, { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });

  if (error) {
    console.warn('Medien-Liste konnte nicht geladen werden:', error);
    letzteMedienListe[eventId] = [];
    return [];
  }

  // Platzhalter-Objekte (leere Ordner) herausfiltern
  const realFiles = (files || []).filter(f => f.name && f.name !== '.emptyFolderPlaceholder');
  if (realFiles.length === 0) {
    letzteMedienListe[eventId] = [];
    return [];
  }

  const paths = realFiles.map(f => `${eventId}/${f.name}`);

  // Signierte URLs für alle Dateien in EINEM Aufruf (gültig 24h, bei jedem Öffnen neu erzeugt)
  const { data: signed, error: signErr } = await sbClient.storage
    .from(EVENTS_BUCKET)
    .createSignedUrls(paths, 60 * 60 * 24);
  if (signErr) console.warn('Signed-URL-Fehler:', signErr);

  const media = realFiles.map((f, i) => {
    const mimetype = (f.metadata && f.metadata.mimetype) || '';
    const type = mimetype || (/\.(mp4|webm|mov|m4v|ogg)$/i.test(f.name) ? 'video/mp4'
                  : /\.pdf$/i.test(f.name) ? 'application/pdf' : 'image/*');
    return {
      url:  signed && signed[i] ? signed[i].signedUrl : '',
      name: f.name.replace(/^\d+_/, ''),   // Zeitstempel-Präfix für die Anzeige entfernen
      type,
      path: `${eventId}/${f.name}`
    };
  });

  letzteMedienListe[eventId] = media;
  return media;
}

// Alle Medien eines Events aus dem Storage entfernen — beim Löschen aufrufen,
// damit keine verwaisten Dateien zurückbleiben (Integritätsregel CLAUDE.md).
async function loescheEventMedien(eventId) {
  if (!eventId) return;
  try {
    const { data: files, error } = await sbClient.storage.from(EVENTS_BUCKET).list(eventId, { limit: 100 });
    if (error) { console.warn('Medien-Liste (Löschen):', error); return; }
    const pfade = (files || [])
      .filter(f => f.name && f.name !== '.emptyFolderPlaceholder')
      .map(f => `${eventId}/${f.name}`);
    if (pfade.length) {
      const { error: rmErr } = await sbClient.storage.from(EVENTS_BUCKET).remove(pfade);
      if (rmErr) console.warn('Medien-Löschen:', rmErr);
    }
  } catch (e) { console.warn('Medien-Aufräumen fehlgeschlagen:', e); }
}

// Eigener Bestätigungs-Dialog statt Browser-confirm. Liefert ein Promise<boolean>.
function zeigeBestaetigung(text) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-text">${escapeHtml(text)}</p>
        <div class="confirm-actions">
          <button type="button" class="confirm-ja">${t('ja')}</button>
          <button type="button" class="confirm-nein">${t('nein')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const fertig = (wert) => { overlay.remove(); resolve(wert); };
    overlay.querySelector('.confirm-ja').addEventListener('click', () => fertig(true));
    overlay.querySelector('.confirm-nein').addEventListener('click', () => fertig(false));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) fertig(false); });
  });
}

  document.getElementById('event-modal').classList.remove('aktiv');
}

async function speichereEvent() {
  if (!istAdmin() || !aktuellerStammbaumId) return;
  const v = id => document.getElementById(id).value.trim();
  const fehlerEl = document.getElementById('ev-fehler');
  const erfolgEl = document.getElementById('ev-erfolg');
  const button   = document.getElementById('ev-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';
  const titel = v('ev-titel');
  if (!titel) { fehlerEl.textContent = t('event_pflicht'); fehlerEl.style.display = 'block'; return; }

  const id = document.getElementById('ev-id').value || null;
  const alt = button.textContent; button.disabled = true; button.textContent = t('reg_senden_laeuft');
  const { data: gespeicherteId, error } = await sbClient.rpc('event_speichern', {
    p_id: id, p_tree: aktuellerStammbaumId, p_titel: titel,
    p_beschreibung: v('ev-beschreibung') || null, p_datum: datumWert(document.getElementById('ev-datum')) || null,
    p_ort: v('ev-ort') || null, p_typ: document.getElementById('ev-typ').value || null,
    p_sprache: aktuelleSprache, p_organisator: v('ev-organisator') || null
  });
  if (error) {
    button.disabled = false; button.textContent = alt;
    fehlerEl.textContent = t('reg_fehler') + error.message; fehlerEl.style.display = 'block'; return;
  }

  // Ausgewählte Medien in den geteilten Storage hochladen (Event-id = Ordner)
  const eventIdFuerMedien = id || gespeicherteId;
  const input = document.getElementById('ev-media-input');
  if (eventIdFuerMedien && input && input.files && input.files.length) {
    const statusEl = document.getElementById('ev-media-status');
    statusEl.textContent = t('event_uploading');
    let medienFehler = null;
    for (const file of [...input.files]) {
      const res = await uploadEventMedia(eventIdFuerMedien, file);
      if (res && res.error) { medienFehler = res.error; break; }
    }
    input.value = '';
    statusEl.textContent = medienFehler ? (t('event_uploading') + ' ' + medienFehler) : '';
    if (!medienFehler) await ladeEventMedienListe(eventIdFuerMedien);
  }

  button.disabled = false; button.textContent = alt;
  erfolgEl.textContent = t('event_gespeichert'); erfolgEl.style.display = 'block';
  await zeigeShorts();                       // Liste sofort aktualisieren
  setTimeout(() => schliesseEventModal(), 900);
}

async function loescheEvent(eventId) {
  if (!istAdmin()) return;
  const ok = await zeigeBestaetigung(t('event_loeschen_frage'));
  if (!ok) return;
  const { error } = await sbClient.rpc('event_loeschen', { p_id: eventId });
  if (error) { await zeigeHinweis(t('reg_fehler') + error.message); return; }
  await loescheEventMedien(eventId);   // zugehörige Storage-Dateien mit entfernen (keine Waisen)
  await zeigeShorts();
  await zeigeHinweis(t('event_geloescht'));

// ============================================================
// KOSTENÜBERSICHT / TROŠKOVI DOGAĐAJA (pro Event)
// Teilnehmer + Ausgaben in DB (event_teilnehmer/event_kosten via RPCs).
// Berechnung pro Währung GETRENNT, Cent-genau (Restcent verteilt -> Summe 0).
// "Bezahlt pro Person" = Summe der Ausgaben, die diese Person bezahlt hat.
// ============================================================
let kostenEventId = null;
let kostenDaten = { teilnehmer: [], kosten: [] };
let kostenEditId = null;

async function oeffneKosten(eventId) {
  kostenEventId = eventId;
  kostenEditId = null;
  const ev = (eventsCache || []).find(e => e.id === eventId);
  document.getElementById('kosten-event-titel').textContent = ev ? (ev.titel || '') : '';
  document.getElementById('kosten-inhalt').innerHTML = `<div class="event-media-empty">…</div>`;

async function ladeKostenDaten() {
  const { data, error } = await sbClient.rpc('event_kosten_daten', { p_event: kostenEventId });
  if (error) { kostenDaten = { teilnehmer: [], kosten: [] }; console.warn('Kostendaten:', error); return; }
  kostenDaten = { teilnehmer: (data && data.teilnehmer) || [], kosten: (data && data.kosten) || [] };
}

function formatGeld(cents, waehrung) {
  return (cents / 100).toFixed(2) + ' ' + (waehrung || 'EUR');
}

// Berechnung je Währung: Gesamt, Anteil/Person (Cent-genau verteilt), Salden, Ausgleich.
function berechneKosten() {
  const tn = kostenDaten.teilnehmer, ks = kostenDaten.kosten;
  const n = tn.length;
  const waehrungen = {};
  ks.forEach(k => {
    const w = k.waehrung || 'EUR';
    if (!waehrungen[w]) waehrungen[w] = { total: 0, paid: {} };
    const cents = Math.round((Number(k.betrag) || 0) * 100);
    waehrungen[w].total += cents;
    if (k.payer_id) waehrungen[w].paid[k.payer_id] = (waehrungen[w].paid[k.payer_id] || 0) + cents;
  });
  const ergebnis = [];
  Object.keys(waehrungen).sort().forEach(w => {
    const total = waehrungen[w].total, paid = waehrungen[w].paid;
    const base = n > 0 ? Math.floor(total / n) : 0;
    const rem  = n > 0 ? total - base * n : 0;   // Restcent gleichmäßig verteilen -> exakte 0-Summe
    const salden = tn.map((tp, i) => {
      const anteil  = base + (i < rem ? 1 : 0);
      const bezahlt = paid[tp.id] || 0;
      return { id: tp.id, name: tp.name, bezahlt, anteil, saldo: bezahlt - anteil };
    });
    ergebnis.push({ waehrung: w, total, proPerson: base, salden, ausgleich: berechneAusgleich(salden) });
  });
  return ergebnis;
}

// Greedy-Ausgleich (minimiert Überweisungen), arbeitet in Cent.
function berechneAusgleich(salden) {
  const glaeubiger = salden.filter(s => s.saldo > 0).map(s => ({ name: s.name, rest: s.saldo })).sort((a, b) => b.rest - a.rest);
  const schuldner  = salden.filter(s => s.saldo < 0).map(s => ({ name: s.name, rest: -s.saldo })).sort((a, b) => b.rest - a.rest);
  const transfers = [];
  let i = 0, j = 0;
  while (i < schuldner.length && j < glaeubiger.length) {
    const betrag = Math.min(schuldner[i].rest, glaeubiger[j].rest);
    if (betrag > 0) transfers.push({ von: schuldner[i].name, an: glaeubiger[j].name, betrag });
    schuldner[i].rest -= betrag; glaeubiger[j].rest -= betrag;
    if (schuldner[i].rest === 0) i++;
    if (glaeubiger[j].rest === 0) j++;
  }
  return transfers;
}

        const vorz = s.saldo > 0 ? '+' : '';
        return `<tr><td>${escapeHtml(nm(s.name))}</td>
          <td class="num">${escapeHtml(formatGeld(s.bezahlt, blk.waehrung))}</td>
          <td class="num">${escapeHtml(formatGeld(s.anteil, blk.waehrung))}</td>
          <td class="num ${cls}">${vorz}${escapeHtml(formatGeld(s.saldo, blk.waehrung))}</td></tr>`;
      }).join('');
      h += `</tbody></table></div>`;
      h += `<div style="margin-top:10px"><strong style="font-size:13px;color:var(--gold)">${escapeHtml(t('kosten_ausgleich'))}</strong>`;
      h += blk.ausgleich.length
        ? blk.ausgleich.map(tr => `<div class="kosten-ausgleich-zeile">${escapeHtml(nm(tr.von))} <strong>${escapeHtml(t('kosten_zahlt'))}</strong> ${escapeHtml(nm(tr.an))}: <strong>${escapeHtml(formatGeld(tr.betrag, blk.waehrung))}</strong></div>`).join('')
        : `<div class="event-media-empty">${escapeHtml(t('kosten_ausgeglichen'))}</div>`;
      h += `</div></div>`;
    });
  }
  h += `</div>`;

  box.innerHTML = h;
  macheAlleSelectsSuchbar(box);   // Selects (Person/Bezahlt von) suchbar machen
  macheAlleDatumsfelder(box);     // Datumsfeld der Ausgabe mit Kalender
}

function buildEventMediaHtml(media, eventId = null, showDelete = false, clickable = true) {
  // Ab mehr als 2 Dateien wird der Container scrollbar (siehe CSS)
  const scrollClass = media.length > 2 ? ' event-media-folder--scroll' : '';
  return `<div class="event-media-folder${scrollClass}">${media.map((m, idx) => {
    const istPdf = m.type === 'application/pdf' || /pdf/i.test(m.type);
    const thumb = m.type.startsWith('image/')
      ? `<img class="event-media-thumb" src="${m.url}" alt="${escapeHtml(m.name)}" />`
      : istPdf ? `<div class="event-media-thumb video-thumb">📄</div>`
      : `<div class="event-media-thumb video-thumb">🎥</div>`;
    const deleteBtn = showDelete && eventId ? `<button class="media-delete-btn" onclick="deleteEventMedia('${eventId}', ${idx})" title="${t('delete')}">×</button>` : '';
    // clickable=false (z.B. in der Edit-Maske über z-index:200) -> keine Slideshow, die sonst dahinter läge
    const istKlick = eventId && clickable;
    const klick = istKlick ? `zeigeMediaSlideshow('${eventId}', ${idx})` : 'return false;';
    return `<div class="event-media-item">${deleteBtn}<a href="javascript:void(0)" onclick="${klick}" style="cursor: ${istKlick ? 'pointer' : 'default'};">${thumb}<div class="event-media-info">${escapeHtml(m.name)}</div></a></div>`;
  }).join('')}</div>`;
}

async function deleteEventMedia(eventId, mediaIndex) {
  const eintrag = (letzteMedienListe[eventId] || [])[mediaIndex];
  if (!eintrag) return;

  const bestaetigt = await zeigeBestaetigung(t('confirm_delete'));
  if (!bestaetigt) return;

  // Datei SOFORT aus dem geteilten Storage löschen – damit für alle User wirksam
  const { error } = await sbClient.storage.from(EVENTS_BUCKET).remove([eintrag.path]);
  if (error) {
    console.error('Löschen fehlgeschlagen:', error);
    return;
  }
  console.log('Datei gelöscht:', eintrag.path);
  // Refresh kontextabhängig: neues Event-Modal offen -> dessen Liste; sonst alter Editor.
  if (document.getElementById('event-modal').classList.contains('aktiv')) {
    ladeEventMedienListe(eventId);
  } else if (document.getElementById('modal').classList.contains('aktiv') &&
             (eventsCache || []).some(e => e.id === eventId)) {
    zeigeEventDetail(eventId);   // Detailansicht eines DB-Events
  } else {
    zeigeEventEditor(eventId);   // altes Event-System
  }
}

async function zeigeMediaSlideshow(eventId, startIndex = 0) {
  const media = await renderEventMedia(eventId);
  if (media.length === 0) return;

  // Titel + Zurück-Ziel je nach Event-Quelle (DB-Event vs. altes statisches Event)
  const dbEv = (eventsCache || []).find(e => e.id === eventId);
  const titel = dbEv ? (dbEv.titel || '') : ((getEventConfig(eventId) || {}).title || '');
  const zurueckCall = dbEv ? `zeigeEventDetail('${eventId}')` : `zeigeShort('${eventId}')`;
  let currentIndex = startIndex;
  
  const updateSlideshow = () => {
    const m = media[currentIndex];
    const isImage = m.type.startsWith('image/');
    const istPdf  = m.type === 'application/pdf' || /pdf/i.test(m.type);
    const content = isImage
      ? `<img src="${m.url}" alt="${escapeHtml(m.name)}" style="max-width: 90vw; max-height: 70vh; object-fit: contain;" />`
      : istPdf
      ? `<iframe src="${m.url}" style="width: 90vw; height: 70vh; border: none; background: #fff;"></iframe>`
      : `<video style="max-width: 90vw; max-height: 70vh;" controls><source src="${m.url}" type="${m.type}">Browser nicht unterstützt</video>`;
    
    const navHtml = media.length > 1 ? `
      <div class="slideshow-nav">
        <button onclick="window.slideshowUpdate(${Math.max(0, currentIndex - 1)})" ${currentIndex === 0 ? 'disabled' : ''}>← ${t('prev') || 'Zurück'}</button>
        <span>${currentIndex + 1} / ${media.length}</span>
        <button onclick="window.slideshowUpdate(${Math.min(media.length - 1, currentIndex + 1)})" ${currentIndex === media.length - 1 ? 'disabled' : ''}>${t('next') || 'Weiter'} →</button>
      </div>
    ` : '';
    
    document.getElementById('modal-text').innerHTML = `
      <h2>${escapeHtml(nm(titel))}</h2>
      <div style="text-align: center; margin: 20px 0;">${content}</div>
      <div style="text-align: center; color: #666; margin: 10px 0;">${escapeHtml(m.name)}</div>
      ${navHtml}
      <div style="text-align: center; margin-top: 20px;">
        <button class="zurueck-btn" onclick="${zurueckCall}">${t('event_cancel')}</button>
      </div>
    `;
  };
  
  window.slideshowUpdate = (newIndex) => {
    if (newIndex >= 0 && newIndex < media.length) {
      currentIndex = newIndex;
      updateSlideshow();
    }
  };
  
  updateSlideshow();
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// DETAIL-FENSTER
// ============================================================
function zeigeDetails(personId) {
  if (document.getElementById('modal').classList.contains('aktiv') && aktuelleModalPersonId) {
    modalVerlauf.push(aktuelleModalPersonId);
  }
  aktuelleModalPersonId = personId;
  const p = aktuelleDaten.persons[personId];
  if (!p) return;
  
  // Gleiche reale Person über Bäume: Beziehungen aller Zwillingskarten zusammenführen,
  // damit die Detail-Karte überall dieselben Eltern/Kinder/Partner zeigt (entdoppelt).
  const gpTwins = p._ident
    ? Object.values(aktuelleDaten.persons).filter(q => q._ident === p._ident)
    : [p];
  const gpTwinIds = new Set(gpTwins.map(q => q.id));
  const persKey  = (q) => q._ident ? 'grp:' + q._ident : 'pn:' + ((q.given || '') + '|' + (q.surname || '') + '|' + (q.birth_date || '')).toLowerCase();
  const vornKey  = (q) => q._ident ? 'grp:' + q._ident : 'gn:' + (q.given || '').trim().toLowerCase();

  const eltern = []; const elternSeen = new Set();
  const geschwister = []; const geschSeen = new Set();
  gpTwins.forEach(tw => (tw.families_child || []).forEach(famId => {
    const fam = aktuelleDaten.families[famId]; if (!fam) return;
    [fam.husband, fam.wife].forEach(pid => {
      const e = pid && aktuelleDaten.persons[pid];
      if (e && !elternSeen.has(persKey(e))) { elternSeen.add(persKey(e)); eltern.push(e); }
    });
    (fam.children || []).forEach(cid => {
      const c = aktuelleDaten.persons[cid];
      if (c && !gpTwinIds.has(cid) && !geschSeen.has(vornKey(c))) { geschSeen.add(vornKey(c)); geschwister.push(c); }
    });
  }));

  // Ehen über alle Zwillinge, nach Partner gruppiert, Kinder GLOBAL entdoppelt
  const eheFamilien = []; const ehePartnerIdx = new Map(); const eheKinderGlobal = new Set();
  const ohnePartnerKinder = []; let hauptIdx = -1;
  gpTwins.forEach(tw => (tw.families_spouse || []).forEach(famId => {
    const fam = aktuelleDaten.families[famId]; if (!fam) return;
    const partnerId = fam.husband === tw.id ? fam.wife : fam.husband;
    const partner = partnerId ? aktuelleDaten.persons[partnerId] : null;
    let bucket;
    if (partner) {
      const pk = vornKey(partner);
      if (!ehePartnerIdx.has(pk)) { eheFamilien.push({ partner, kinder: [] }); ehePartnerIdx.set(pk, eheFamilien.length - 1); if (hauptIdx < 0) hauptIdx = eheFamilien.length - 1; }
      bucket = eheFamilien[ehePartnerIdx.get(pk)].kinder;
    } else bucket = ohnePartnerKinder;
    (fam.children || []).forEach(cid => {
      const c = aktuelleDaten.persons[cid]; if (!c) return;
      if (eheKinderGlobal.has(vornKey(c))) return; eheKinderGlobal.add(vornKey(c));
      bucket.push(c);
    });
  }));
  if (ohnePartnerKinder.length) {
    if (hauptIdx >= 0) eheFamilien[hauptIdx].kinder.push(...ohnePartnerKinder);
    else eheFamilien.push({ partner: null, kinder: ohnePartnerKinder });
  }

  const buildVerwandte = (liste) => liste.map(v =>
    `<span class="verwandter" onclick="zeigeDetails('${v.id}')">${escapeHtml(nm(v.name))}</span>`
  ).join('');

  const geschlechtText = p.sex === 'M' ? t('maennlich') : (p.sex === 'F' ? t('weiblich') : t('unbekannt'));

  // "＋"-Button je Abschnitt (nur Admins) — öffnet Person-hinzufügen mit vorbelegtem Typ.
  const addBtn = (typ) => istAdmin()
    ? `<button class="sec-add-btn" type="button" title="${escapeHtml(t('person_hinzufuegen'))}" onclick="zeigePersonHinzufuegen('${p.id}','${typ}')">＋</button>`
    : '';
  // Abschnitt rendern: bei Admins immer (mit ＋), sonst nur wenn Inhalt vorhanden.
  const sektion = (titelKey, inhalt, typ) => (inhalt || istAdmin())
    ? `<div class="beziehungen"><h3>${t(titelKey)} ${addBtn(typ)}</h3>${inhalt || ''}</div>` : '';

  // Ehe-Block: Partner- + Kinder-Abschnitt je Ehe (mit ＋). Ohne Ehe für Admins leere Abschnitte.
  const eheBloecke = eheFamilien.length ? eheFamilien : (istAdmin() ? [{ partner: null, kinder: [] }] : []);
  const eheHtml = eheBloecke.map((ef, i) => {
    const ptitel = eheFamilien.length > 1 ? `${t('partner')} ${i + 1}` : t('partner');
    const partnerHtml = ef.partner ? `<span class="verwandter" onclick="zeigeDetails('${ef.partner.id}')">${escapeHtml(nm(ef.partner.name))}</span>` : '';
    const kinderHtml = ef.kinder.length ? buildVerwandte(ef.kinder) : '';
    return `<div class="beziehungen"><h3>${ptitel} ${addBtn('partner')}</h3>${partnerHtml}</div>
            <div class="beziehungen"><h3>${t('kinder')} ${addBtn('kind')}</h3>${kinderHtml}</div>`;
  }).join('');

  document.getElementById('modal-text').innerHTML = `
    ${modalVerlauf.length > 0 ? `<button class="zurueck-btn" onclick="geheZurueck()">← ${t('zurueck')}</button>` : ''}
    <h2>${escapeHtml(nm(p.given || '?'))}</h2>
    <p class="sub-name">${escapeHtml(nm(p.surname || ''))}</p>
    ${p.ehename ? `<div class="info-zeile"><strong>${t('pe_ehename')}:</strong> ${escapeHtml(nm(p.ehename))}</div>` : ''}

    ${p.birth_date ? `<div class="info-zeile"><strong>${t('geboren')}</strong> ${escapeHtml(formatDatumLang(p.birth_date))}</div>` : ''}
    ${p.birth_place ? `<div class="info-zeile"><strong>${t('geburtsort')}</strong> ${escapeHtml(uebersetzeOrt(p.birth_place))}</div>` : ''}
    ${p.deceased || p.death_date ? `<div class="info-zeile"><strong>${t('verstorben')}</strong> ${escapeHtml(formatDatumLang(p.death_date) || t('ja'))}</div>` : ''}
    ${p.death_place ? `<div class="info-zeile"><strong>${t('sterbeort')}</strong> ${escapeHtml(uebersetzeOrt(p.death_place))}</div>` : ''}
    <div class="info-zeile"><strong>${t('geschlecht')}</strong> ${geschlechtText}</div>
    ${istAdmin() ? `<div class="info-zeile" style="color:#8a7a5a">${p._hatKonto ? '🔗' : '🔓 ' + escapeHtml(t('kein_konto'))}</div>` : ''}
    ${p.geburtsland ? `<div class="info-zeile"><strong>${t('reg_geburtsland')}:</strong> ${escapeHtml(uebersetzeOrt(p.geburtsland))}</div>` : ''}
    ${p.stadt ? `<div class="info-zeile"><strong>${t('fe_grad')}:</strong> ${escapeHtml(uebersetzeOrt(p.stadt))}</div>` : ''}
    ${p.gemeinde ? `<div class="info-zeile"><strong>${t('fe_opstina')}:</strong> ${escapeHtml(uebersetzeOrt(p.gemeinde))}</div>` : ''}
    ${p.getauft ? `<div class="info-zeile"><strong>${t('reg_getauft')}:</strong> ${escapeHtml(formatDatumLang(p.getauft))}</div>` : ''}

    ${(p.hochzeit_standesamt || p.hochzeit_kirchlich || p.hochzeitsort) ? `<div class="info-zeile"><strong>${t('pe_hochzeit_standesamt')}:</strong> ${escapeHtml([formatDatumLang(p.hochzeit_standesamt), formatDatumLang(p.hochzeit_kirchlich), p.hochzeitsort].filter(Boolean).join(' · '))}</div>` : ''}
    ${p.beruf ? `<div class="info-zeile"><strong>${t('pe_beruf')}:</strong> ${escapeHtml(p.beruf)}</div>` : ''}
    ${p.ausbildung ? `<div class="info-zeile"><strong>${t('pe_ausbildung')}:</strong> ${escapeHtml(p.ausbildung)}</div>` : ''}

    ${(p.email || p.telefon || p.facebook || p.instagram) ? `<div class="info-zeile"><strong>${t('reg_kontakt')}:</strong> ${escapeHtml([p.email, p.telefon, p.facebook, p.instagram].filter(Boolean).join(' · '))}</div>` : ''}
    ${p.beschreibung ? `<div class="info-zeile"><strong>${t('pe_beschreibung')}:</strong> ${escapeHtml(p.beschreibung)}</div>` : ''}

    ${sektion('eltern', buildVerwandte(eltern), 'elternteil')}
    ${sektion('geschwister', buildVerwandte(geschwister), 'geschwister')}

// ============================================================
// GLEICHE PERSON ÜBER BÄUME (logische Verknüpfung)
// Karten mit gleicher _ident = dieselbe reale Person (in mehreren Bäumen).
// ============================================================
// Zwillingskarten (gleiche reale Person, andere Karte) der Person p.
function findeZwillinge(p) {
  if (!p || !p._ident) return [];
  const out = [];
  Object.values(aktuelleDaten.persons).forEach(q => {
    if (q._uuid && q._uuid !== p._uuid && q._ident === p._ident) {
      out.push({ extId: q.id, uuid: q._uuid, name: q.name || q.given || '', treeId: q._tree,
                 treeName: (q._tree && stammbaeumeListe[q._tree]) || '' });
    }
  });
  return out;
}

// Detail-Block: "auch in Baum X" (Navigation) + (Super-Admin) Verknüpfung lösen.
function gpTwinHtml(p) {
  const tw = findeZwillinge(p);
  if (!tw.length) return '';
  const zeilen = tw.map(z =>
    `<div class="gp-zwilling">
       <span class="verwandter" onclick="springeZuBaumPerson('${z.extId}')">${escapeHtml(nm(z.name))}${z.treeName ? ' — ' + escapeHtml(nm(z.treeName)) : ''}</span>
       ${istSuperAdmin() ? `<button class="gp-loesen" type="button" title="${escapeHtml(t('gp_loesen'))}" onclick="personUnlink('${z.uuid}')">✕</button>` : ''}
     </div>`).join('');
  return `<div class="beziehungen"><h3>↔ ${t('gp_auch_in')}</h3>${zeilen}</div>`;
}

// In den Baum der Zwillingskarte springen und sie fokussieren.
function springeZuBaumPerson(extId) {
  const q = aktuelleDaten.persons[extId];
  if (!q) return;
  schliesseModal();
  if (q._tree) {
    aktuellerStammbaumId = q._tree;
    const sel = document.getElementById('tree-select'); if (sel) sel.value = q._tree;
    aktualisiereKopf(); aktualisiereBaumHinweis();
  }
  fokusPersonId = extId;
  const suche = document.getElementById('suche'); if (suche) suche.value = '';
  zeichneBaum(extId, 2, 2);
}

// ----- Overlay "Gleiche Person verknüpfen" (Super-Admin), analog zu "Bäume verbinden" -----
let gpDiff = [];                                            // Feld-Diff der zwei gewählten Karten
let gpPairA = null, gpPairB = null, gpRest = [];           // aktuelles Paar (+ weitere Karten der Gruppe)
const GP_NAME_FELDER = ['name'];   // nur das abgeleitete Feld 'name' ausblenden (wird aus given+surname gebildet)

function zeigeGleichePersonModal() {
  if (!istSuperAdmin()) return;

function schliesseGleichePersonModal() { document.getElementById('gp-modal').classList.remove('aktiv'); }

// Hinweis: noch nicht verknüpfte Dubletten (gleicher Name + Geburtsdatum über Bäume)
let gpDubGruppen = [];
async function gpLadeDubletten() {
  const box = document.getElementById('gp-dubletten'); if (!box) return;
  box.innerHTML = '';
  const a = document.getElementById('gp-baum-a').value;
  const b = document.getElementById('gp-baum-b').value;
  if (!a || !b || a === b) return;   // erst vergleichen, wenn zwei verschiedene Bäume gewählt sind
  const { data, error } = await sbClient.rpc('offene_dubletten', { p_baum_a: a, p_baum_b: b });
  if (error) return;
  gpDubGruppen = data || [];
  if (!gpDubGruppen.length) { box.innerHTML = `<p class="mv-legende">${t('gp_keine_dubletten')}</p>`; return; }
  box.innerHTML = `<div class="reg-gruppe-titel">${t('gp_dub_titel')}</div>` +
    gpDubGruppen.map((g, i) => `<div class="gp-kand">
      <label style="display:flex;gap:8px;align-items:center;flex:1;cursor:pointer">
        <input type="checkbox" class="gp-dub-cb" data-i="${i}">
        <span>${escapeHtml(nm(g.person || ''))}${g.geboren ? ` (* ${escapeHtml(formatDatumLang(g.geboren) || g.geboren)})` : ''} — ${escapeHtml(nm(g.baeume || ''))} · ${g.anzahl}×</span>
      </label>
      <button class="mv-toggle" type="button" onclick="gpLinkGruppe(${i})">${escapeHtml(t('gp_einzeln'))}</button>
    </div>`).join('') +
    `<button class="login-submit" type="button" style="margin-top:10px" onclick="gpVerknuepfeAusgewaehlte()">${escapeHtml(t('gp_alle_verknuepfen'))}</button>`;
}
// Mehrere Gruppen ankreuzen -> mit EINEM Klick alle verknüpfen (Auto-Angleich: vollständigste gewinnt).
async function gpVerknuepfeAusgewaehlte() {
  const cbs = [...document.querySelectorAll('.gp-dub-cb:checked')];
  if (!cbs.length) { await zeigeHinweis(t('merge_keine_auswahl')); return; }
  for (const cb of cbs) {
    const g = gpDubGruppen[+cb.dataset.i];
    if (!g || !g.ids || g.ids.length < 2) continue;
    for (let k = 1; k < g.ids.length; k++) {
      const { error } = await sbClient.rpc('personen_verknuepfen', { p_a: g.ids[0], p_b: g.ids[k], p_aufloesung: {} });
      if (error) { await zeigeHinweis(t('reg_fehler') + error.message); return; }
    }
  }
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  await gpLadeDubletten();
  const erfolg = document.getElementById('gp-modal-erfolg');
  erfolg.textContent = t('gp_verknuepft_weiter'); erfolg.style.display = 'block';
}
// Hinweis-Gruppe -> Konflikt-Abfrage für die ersten zwei Karten (Rest wird mit derselben
// Auflösung angehängt). So wirst du auch bei den Kindern gefragt, welche Daten korrekt sind.
async function gpLinkGruppe(i) {
  const g = gpDubGruppen[i];
  if (!g || !g.ids || g.ids.length < 2) return;
  await gpStartKonflikt(g.ids[0], g.ids[1], g.ids.slice(2));
}
function gpZeigeSchritt(n) {
  document.getElementById('gp-step1').style.display = (n === 1) ? '' : 'none';
  document.getElementById('gp-step2').style.display = (n === 2) ? '' : 'none';
}

// Schritt 1 -> Feld-Diff der zwei Karten laden, Konflikte zeigen (analog Baum zusammenlegen)
// Konflikt-Schritt für ein Paar starten (+ optional weitere Karten der Gruppe = Auto-Angleich danach)
async function gpStartKonflikt(a, b, rest) {
  const fehler = document.getElementById('gp-modal-fehler'); fehler.style.display = 'none';
  document.getElementById('gp-modal-erfolg').style.display = 'none';
  const { data: diff, error } = await sbClient.rpc('personen_feld_diff', { p_a: a, p_b: b });
  if (error) { fehler.textContent = t('reg_fehler') + error.message; fehler.style.display = 'block'; return; }
  gpPairA = a; gpPairB = b; gpRest = rest || [];
  gpDiff = (diff || []).filter(d => !GP_NAME_FELDER.includes(d.feld));   // 'name' ausblenden (abgeleitet)
  gpRenderKonflikte();
  gpRenderAuto();
  gpZeigeSchritt(2);
}
function gpRenderKonflikte() {
  const box = document.getElementById('gp-konflikte');
  const konf = gpDiff.filter(d => d.status === 'konflikt');
  if (!konf.length) { box.innerHTML = `<p class="mv-legende">${t('gp_keine_konflikte')}</p>`; return; }
  let html = `<div class="reg-gruppe-titel">${t('merge_konflikt_titel')}</div>`;
  konf.forEach(d => {
    const f = d.feld;
    html += `<div class="mg-konflikt">
      <div class="mg-feld">${escapeHtml(mgFeldLabel(f))}</div>
      <div class="mg-opt"><label><input type="radio" name="gp-k-${f}" value="a" checked> ${t('merge_wert_a')}: ${escapeHtml(mgWertAnzeige(f, d.wert_a))}</label></div>
      <div class="mg-opt"><label><input type="radio" name="gp-k-${f}" value="b"> ${t('merge_wert_b')}: ${escapeHtml(mgWertAnzeige(f, d.wert_b))}</label></div>
      <div class="mg-opt"><label><input type="radio" name="gp-k-${f}" value="m"> ${t('merge_manuell')}</label>
        <input type="text" class="login-feld gp-man" data-feld="${f}" value="${escapeHtml(d.wert_a || '')}"></div>
    </div>`;
  });
  box.innerHTML = html;
}
function gpRenderAuto() {
  const box = document.getElementById('gp-auto');
  const auto = gpDiff.filter(d => d.status !== 'konflikt');
  if (!auto.length) { box.innerHTML = ''; return; }
  let html = `<div class="reg-gruppe-titel">${t('merge_auto_titel')}</div>`;
  auto.forEach(d => {
    const wert = d.status === 'nur_b' ? d.wert_b : d.wert_a;
    html += `<div class="mg-auto-row"><b>${escapeHtml(mgFeldLabel(d.feld))}:</b> ${escapeHtml(mgWertAnzeige(d.feld, wert))}</div>`;
  });
  box.innerHTML = html;
}

function gpFuelleBaeume() {
  const eintraege = Object.entries(stammbaeumeListe || {})
    .sort((a, b) => nm(a[1] || '').localeCompare(nm(b[1] || '')));
  const opts = '<option value=""></option>' + eintraege.map(([id, name]) =>
    `<option value="${escapeHtml(id)}">${escapeHtml(nm(name))}</option>`).join('');
  ['gp-baum-a', 'gp-baum-b'].forEach(id => { const s = document.getElementById(id); s.innerHTML = opts; s.value = ''; });
  macheAlleSelectsSuchbar(document.getElementById('gp-modal'));
}
// Baum-Auswahl geändert -> Dubletten zwischen den zwei gewählten Bäumen neu laden.
function gpWaehleBaum() { gpLadeDubletten(); }

async function gpModalVerknuepfen() {
  const fehler = document.getElementById('gp-modal-fehler2'); fehler.style.display = 'none';
  const a = gpPairA, b = gpPairB;
  if (!a || !b) { fehler.textContent = t('merge_baeume_waehlen'); fehler.style.display = 'block'; return; }

  // Konfliktauflösung sammeln (gewählter Endwert je Konfliktfeld)
  const aufloesung = {};
  gpDiff.filter(d => d.status === 'konflikt').forEach(d => {
    const f = d.feld;
    const sel = document.querySelector(`input[name="gp-k-${f}"]:checked`);
    const wahl = sel ? sel.value : 'a';
    if (wahl === 'a') aufloesung[f] = d.wert_a || '';
    else if (wahl === 'b') aufloesung[f] = d.wert_b || '';
    else { const man = document.querySelector(`.gp-man[data-feld="${f}"]`); aufloesung[f] = man ? man.value.trim() : ''; }
  });

  const { error } = await sbClient.rpc('personen_verknuepfen', { p_a: a, p_b: b, p_aufloesung: aufloesung });
  if (error) { fehler.textContent = t('reg_fehler') + error.message; fehler.style.display = 'block'; return; }
  // Weitere Karten derselben Gruppe (z. B. >2 Bäume) mit der gewählten Auflösung anhängen
  for (const id of (gpRest || [])) {
    const { error: e2 } = await sbClient.rpc('personen_verknuepfen', { p_a: a, p_b: id, p_aufloesung: aufloesung });
    if (e2) { fehler.textContent = t('reg_fehler') + e2.message; fehler.style.display = 'block'; return; }
  }
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  gpPairA = gpPairB = null; gpRest = [];
  gpZeigeSchritt(1);
  gpFuelleBaeume();    // Suchfelder oben leeren -> direkt weitere Personen verknüpfbar
  gpLadeDubletten();   // Hinweis-Liste aktualisieren
  const erfolg = document.getElementById('gp-modal-erfolg');
  erfolg.textContent = t('gp_verknuepft_weiter'); erfolg.style.display = 'block';
}

// Verknüpfung (von der Karte aus) lösen
async function personUnlink(uuid) {
  if (!uuid) return;
  const ok = await zeigeBestaetigung(t('gp_loesen_frage'));
  if (!ok) return;
  const extId = aktuelleModalPersonId;
  const { error } = await sbClient.rpc('personen_identitaet_aufheben', { p_id: uuid });
  if (error) { await zeigeHinweis(t('reg_fehler') + error.message); return; }
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  await zeigeHinweis(t('gp_geloest'));
  if (extId && aktuelleDaten.persons[extId]) { aktuelleModalPersonId = null; zeigeDetails(extId); }
}

function zeigePersonBearbeiten(personId) {
  if (!istAdmin()) return;
  const p = aktuelleDaten.persons[personId];
  if (!p) return;
  schliesseModal();   // Detail-Fenster schließen, bevor der Editor aufgeht
  const set  = (id, v) => { document.getElementById(id).value = v ?? ''; };
  const setD = (id, v) => datumSetzen(document.getElementById(id), v);   // Datumsfelder
  document.getElementById('pe-id').value = personId;
  document.getElementById('pe-geschlecht').value = p.sex || '';
  document.getElementById('pe-status').value = (p.deceased || p.death_date) ? 'verstorben' : 'lebend';

  set('pe-titel', p.titel);          set('pe-namenszusatz', p.namenszusatz);
  set('pe-ehename', p.ehename);      setD('pe-geburtsdatum', p.birth_date);
  set('pe-geburtsort', p.birth_place); set('pe-geburtsland', p.geburtsland);
  set('pe-stadt', p.stadt);          set('pe-gemeinde', p.gemeinde);
  setD('pe-getauft', p.getauft);
  setD('pe-sterbedatum', p.death_date);
  set('pe-hochzeitsort', p.hochzeitsort);
  setD('pe-hochzeit-standesamt', p.hochzeit_standesamt || p.hochzeitstag);
  setD('pe-hochzeit-kirchlich', p.hochzeit_kirchlich);
  set('pe-beziehung-sonstige', p.beziehung_sonstige);
  document.getElementById('pe-beziehung').value =
    ['unbekannt','verheiratet','verlobt','partner','getrennt','geschieden','verwitwet','sonstige']
      .includes(p.beziehung) ? p.beziehung : 'unbekannt';
  set('pe-email', p.email);          set('pe-telefon', p.telefon);
  set('pe-facebook', p.facebook);    set('pe-instagram', p.instagram);
  set('pe-wohnland', p.wohnort_land); set('pe-wohnstadt', p.wohnort_stadt);
  set('pe-adresse', p.adresse);      set('pe-beruf', p.beruf);
  set('pe-ausbildung', p.ausbildung); set('pe-beschreibung', p.beschreibung);
  document.getElementById('pe-fehler').style.display = 'none';
  document.getElementById('pe-erfolg').style.display = 'none';
  pePruefeFelder();   // bedingte Felder (Sterbedatum / Hochzeit / Sonstige) anzeigen
  document.getElementById('person-edit-modal').classList.add('aktiv');
}

// Bedingte Felder im Editor ein-/ausblenden
function pePruefeFelder() {
  const verstorben = document.getElementById('pe-status').value === 'verstorben';
  document.getElementById('pe-row-sterbedatum').style.display = verstorben ? '' : 'none';
  const bez = document.getElementById('pe-beziehung').value;

}

function schliessePersonEdit() {

}

async function speicherePerson() {
  if (!istAdmin()) return;
  const personId = document.getElementById('pe-id').value;
  const pObj     = aktuelleDaten.persons[personId];
  const fehlerEl = document.getElementById('pe-fehler');
  const erfolgEl = document.getElementById('pe-erfolg');
  const button   = document.getElementById('pe-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';
  if (!pObj || !pObj._uuid) { fehlerEl.textContent = 'Person nicht gefunden.'; fehlerEl.style.display = 'block'; return; }

  const v  = id => document.getElementById(id).value.trim();
  const vd = id => datumWert(document.getElementById(id));   // Datumsfelder -> ISO/Freitext
  // Kontakt-E-Mail (optional) muss gültig sein, falls gesetzt
  if (!pruefeEmailFeld(document.getElementById('pe-email'), false)) {
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('pe-email').focus(); return;
  }
  const altText = button.textContent;
  button.disabled = true; button.textContent = t('reg_senden_laeuft');

  // Pristine stammbaum_daten holen (rekonstruierte FAMx-Felder NICHT zurückschreiben)
  const { data: row, error: lErr } = await sbClient.from('personen')
    .select('stammbaum_daten').eq('id', pObj._uuid).single();
  if (lErr) {
    button.disabled = false; button.textContent = altText;
    fehlerEl.textContent = t('reg_fehler') + lErr.message; fehlerEl.style.display = 'block'; return;
  }
  const sd = row.stammbaum_daten || {};
  const verstorben = document.getElementById('pe-status').value === 'verstorben';
  const neu = {
    ...sd,
    sex: document.getElementById('pe-geschlecht').value || '',
    given: v('pe-vorname'), surname: v('pe-nachname'),
    titel: v('pe-titel'), namenszusatz: v('pe-namenszusatz'), ehename: v('pe-ehename'),
    birth_date: vd('pe-geburtsdatum'), birth_place: v('pe-geburtsort'), geburtsland: v('pe-geburtsland'),
    stadt: v('pe-stadt'), gemeinde: v('pe-gemeinde'),
    getauft: vd('pe-getauft'),
    hochzeitsort: v('pe-hochzeitsort'),
    hochzeit_standesamt: vd('pe-hochzeit-standesamt'),
    hochzeit_kirchlich: vd('pe-hochzeit-kirchlich'),
    hochzeitstag: '',                                    // altes Einzelfeld nicht mehr genutzt
    beziehung: document.getElementById('pe-beziehung').value,
    beziehung_sonstige: v('pe-beziehung-sonstige'),
    email: v('pe-email'), telefon: v('pe-telefon'), facebook: v('pe-facebook'), instagram: v('pe-instagram'),
    wohnort_land: v('pe-wohnland'), wohnort_stadt: v('pe-wohnstadt'), adresse: v('pe-adresse'),
    beruf: v('pe-beruf'), ausbildung: v('pe-ausbildung'), beschreibung: v('pe-beschreibung'),
    deceased: verstorben,
    death_date: verstorben ? vd('pe-sterbedatum') : ''
  };
  neu.name = (neu.given + ' ' + neu.surname).trim();

  const { error: uErr } = await sbClient.from('personen')
    .update({ stammbaum_daten: neu, vorname: neu.given, nachname: neu.surname }).eq('id', pObj._uuid);
  button.disabled = false; button.textContent = altText;
  if (uErr) { fehlerEl.textContent = t('reg_fehler') + uErr.message; fehlerEl.style.display = 'block'; return; }

  // In-memory aktualisieren + neu zeichnen (kein voller Reload, Baumkontext bleibt)
  Object.assign(pObj, {
    sex: neu.sex, given: neu.given, surname: neu.surname, name: neu.name,
    titel: neu.titel, namenszusatz: neu.namenszusatz, ehename: neu.ehename,
    birth_date: neu.birth_date, birth_place: neu.birth_place, geburtsland: neu.geburtsland,
    getauft: neu.getauft, hochzeitsort: neu.hochzeitsort,
    hochzeit_standesamt: neu.hochzeit_standesamt, hochzeit_kirchlich: neu.hochzeit_kirchlich,
    beziehung: neu.beziehung, beziehung_sonstige: neu.beziehung_sonstige,
    email: neu.email, telefon: neu.telefon, facebook: neu.facebook, instagram: neu.instagram,
    wohnort_land: neu.wohnort_land, wohnort_stadt: neu.wohnort_stadt, adresse: neu.adresse,
    beruf: neu.beruf, ausbildung: neu.ausbildung, beschreibung: neu.beschreibung,
    deceased: neu.deceased, death_date: neu.death_date
  });
  zeichneBaumNeu();
  erfolgEl.textContent = t('pe_gespeichert'); erfolgEl.style.display = 'block';

  // Verknüpfte Person (gleiche Person über Bäume): Biografie wurde per DB-Trigger auf alle
  // Zwillinge übertragen -> Baum neu laden, damit die anderen Karten sofort aktualisiert sind.
  if (pObj._ident && typeof ladeBaumDaten === 'function') await ladeBaumDaten();

  // DUBLETTEN-FRÜHERKENNUNG (Bearbeiten): mit den NEUEN Werten prüfen, eigene Karte ausschließen.
  // Treffer -> Verknüpfung (modus 'merge': die zwei Karten zu einer zusammenführen).
  const { data: matches } = await sbClient.rpc('dubletten_check_global', {
    p_vorname: neu.given, p_nachname: neu.surname, p_birth_date: neu.birth_date,
    p_land: neu.geburtsland, p_exclude_person: pObj._uuid
  });
  if (matches && matches.length) {
    zeigeDublettenDialog(matches, {
      modus: 'merge', kontext: pObj._uuid, typ: null, zweiter: null,
      proceed: () => schliessePersonEdit(),
      onLinked: async () => { schliessePersonEdit(); if (typeof ladeBaumDaten === 'function') await ladeBaumDaten(); }
    });
    return;
  }
  setTimeout(() => schliessePersonEdit(), 900);
}

// Baum nach einer Änderung frisch laden und neu zeichnen, Fokus behalten.
async function reloadBaumBehalteFokus(fokusExtId) {
  const daten = await ladeBaumAusSupabase();
  if (daten && Object.keys(daten.persons).length) {
    aktuelleDaten = daten;
    baueNachnameFilter();
    befuelleStammbaumAuswahl();
    aktualisiereStats();
  }
  if (fokusExtId && aktuelleDaten.persons[fokusExtId]) {
    fokusPersonId = fokusExtId;
    zeichneBaum(fokusExtId, 2, 2);
  } else {
    fokusPersonId = null;
    zeichneBaumNeu();
  }
}

async function speichereNeuePerson() {

  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';

  const aktivId = document.getElementById('pa-context-id').value;
  const aktiv   = aktuelleDaten.persons[aktivId];
  if (!aktiv || !aktiv._uuid) { fehlerEl.textContent = t('pa_kein_kontext'); fehlerEl.style.display = 'block'; return; }

  const v  = id => document.getElementById(id).value.trim();
  const vd = id => datumWert(document.getElementById(id));   // Datumsfelder -> ISO/Freitext
  const vorname = v('pa-vorname');
  if (!vorname) { fehlerEl.textContent = t('pa_pflicht'); fehlerEl.style.display = 'block'; return; }
  // Kontakt-E-Mail (optional) muss gültig sein, falls gesetzt
  if (!pruefeEmailFeld(document.getElementById('pa-email'), false)) {
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('pa-email').focus(); return;
  }

  const typ        = document.getElementById('pa-beziehungstyp').value;   // kind | elternteil | partner
  const verstorben = document.getElementById('pa-status').value === 'verstorben';
  const nachname   = v('pa-nachname') || aktiv.surname || '';
  const sex        = document.getElementById('pa-geschlecht').value || '';

  const altText = button.textContent;
  button.disabled = true; button.textContent = t('reg_senden_laeuft');

  // familie_id + stammbaum_id der aktiven Person frisch holen (für Besitz/Baum)
  const { data: kontext, error: kErr } = await sbClient.from('personen')
    .select('familie_id, stammbaum_id').eq('id', aktiv._uuid).single();
  if (kErr || !kontext) {
    button.disabled = false; button.textContent = altText;
    fehlerEl.textContent = t('reg_fehler') + (kErr ? kErr.message : '—'); fehlerEl.style.display = 'block'; return;
  }

  const ehe = document.getElementById('pa-beziehung').value;
  const externeId = 'I' + Date.now();
  const name = (vorname + ' ' + nachname).trim();
  const land = v('pa-geburtsland');
  const geb  = vd('pa-geburtsdatum');
  const stammbaum_daten = {
    id: externeId, given: vorname, surname: nachname, name, sex,
    titel: v('pa-titel'), namenszusatz: v('pa-namenszusatz'), ehename: v('pa-ehename'),
    birth_date: geb, birth_place: v('pa-geburtsort'),
    geburtsland: land, stadt: v('pa-stadt'), gemeinde: v('pa-gemeinde'),
    getauft: vd('pa-getauft'),
    hochzeitsort: v('pa-hochzeitsort'),
    hochzeit_standesamt: vd('pa-hochzeit-standesamt'),
    hochzeit_kirchlich: vd('pa-hochzeit-kirchlich'),
    beziehung: ehe, beziehung_sonstige: v('pa-beziehung-sonstige'),
    email: v('pa-email'), telefon: v('pa-telefon'), facebook: v('pa-facebook'), instagram: v('pa-instagram'),
    wohnort_land: v('pa-wohnland'), wohnort_stadt: v('pa-wohnstadt'), adresse: v('pa-adresse'),
    beruf: v('pa-beruf'), ausbildung: v('pa-ausbildung'), beschreibung: v('pa-beschreibung'),
    deceased: verstorben, death_date: verstorben ? vd('pa-sterbedatum') : '',
    angelegt_aus: 'stammbaum-anlegen'
  };

  // Zweiten Elternteil (bei "Kind") vorab bestimmen — auch für eine evtl. Verknüpfung gebraucht.
  let zweiter = null;
  if (typ === 'kind') {
    if (paSpouses.length === 1) zweiter = paSpouses[0].uuid;
    else if (paSpouses.length >= 2) zweiter = document.getElementById('pa-elternteil2').value || null;
  }

  // Tatsächliches Anlegen (wird ausgeführt, wenn keine Dublette ODER der Nutzer "Trotzdem anlegen" wählt)
  async function doInsert() {
    button.disabled = true; button.textContent = t('reg_senden_laeuft');
    const { data: neu, error: pErr } = await sbClient.from('personen').insert({
      familie_id:   kontext.familie_id,
      stammbaum_id: kontext.stammbaum_id,
      externe_id:   externeId,
      vorname, nachname,
      geburtsdatum: null,           // Rohdatum bleibt in stammbaum_daten (Freitext)
      stammbaum_daten
    }).select('id').single();
    if (pErr) {
      button.disabled = false; button.textContent = altText;
      fehlerEl.textContent = t('reg_fehler') + pErr.message; fehlerEl.style.display = 'block'; return;
    }
    const fid = kontext.familie_id;
    const bezRows = [];
    if (typ === 'elternteil') {
      bezRows.push({ person_a: neu.id, person_b: aktiv._uuid, typ: 'elternteil', familie_id: fid });
    } else if (typ === 'partner') {
      bezRows.push({ person_a: aktiv._uuid, person_b: neu.id, typ: 'ehepartner', familie_id: fid });
    } else if (typ === 'geschwister') {
      // gleiche Eltern wie die aktive Person -> Eltern der aktiven Person als Elternteil setzen
      const elternUuids = [];
      (aktiv.families_child || []).forEach(famId => {
        const fam = aktuelleDaten.families[famId]; if (!fam) return;
        [fam.husband, fam.wife].forEach(pe => {
          const par = pe && aktuelleDaten.persons[pe];
          if (par && par._uuid && !elternUuids.includes(par._uuid)) elternUuids.push(par._uuid);
        });
      });
      elternUuids.forEach(pu => bezRows.push({ person_a: pu, person_b: neu.id, typ: 'elternteil', familie_id: fid }));
    } else { // kind: an BEIDE Eltern hängen
      bezRows.push({ person_a: aktiv._uuid, person_b: neu.id, typ: 'elternteil', familie_id: fid });
      if (zweiter && zweiter !== aktiv._uuid) {
        bezRows.push({ person_a: zweiter, person_b: neu.id, typ: 'elternteil', familie_id: fid });
      }
    }
    if (!bezRows.length) {
      // Geschwister ohne bekannte Eltern: Person bleibt zunächst lose -> Hinweis
      button.disabled = false; button.textContent = altText;
      fehlerEl.textContent = t('pa_geschwister_keine_eltern'); fehlerEl.style.display = 'block';
      await reloadBaumBehalteFokus(aktivId);
      return;
    }
    const { error: bErr } = await sbClient.from('beziehungen').insert(bezRows);
    button.disabled = false; button.textContent = altText;
    if (bErr) { fehlerEl.textContent = t('reg_fehler') + bErr.message; fehlerEl.style.display = 'block'; return; }
    erfolgEl.textContent = t('pa_erfolg'); erfolgEl.style.display = 'block';

    if (typ === 'partner') await pruefeHeiratsZweig(neu.id, aktiv, nachname);
    setTimeout(() => schliessePersonAdd(), 800);
  }

  // DUBLETTEN-FRÜHERKENNUNG: existiert dieselbe Person (Vor/Nach/Geburtsdatum/Geburtsland) bereits?
  const { data: matches } = await sbClient.rpc('dubletten_check_global', {
    p_vorname: vorname, p_nachname: nachname, p_birth_date: geb, p_land: land, p_exclude_person: null
