window.korrigiereNachnamen = korrigiereNachnamen;

// ============================================================
// BÄUME VERBINDEN / DUBLETTEN-MERGE (nur Super-Admin)
// GUI über die RPCs aus supabase_merge_gui.sql:
//   dubletten_scan(baum_a, baum_b) -> Kandidatenpaare
//   personen_feld_diff(a, b)       -> Feldvergleich (nur_a/nur_b/gleich/konflikt)
//   person_merge_aufgeloest(behalten, dublette, aufloesung) -> Merge inkl. Konfliktauflösung
// Bäume bleiben separat; nur die Dublette wird gelöscht (Beziehungen/Konto/Medien bleiben).
// ============================================================
let mgScanPaare = [];      // alle Kandidaten vom Scan
let mgFixPaar   = null;    // das explizit gewählte A/B-Paar (immer oben)
let mgAusgewaehlt = [];    // ausgewählte Paare [{a,b,name_a,name_b}]
let mgIndex = 0;           // aktuelles Paar in Schritt 3
let mgDiff = [];           // aktueller Feld-Diff
let mgSurvivor = 'a';      // welche Karte bleibt: 'a' | 'b'
let mgInfo = {};           // id -> Personen-Kontext (Baum, *Datum, Eltern, Partner, Kinder)
let mgBaumA = null, mgBaumB = null, mgBaumAName = '', mgBaumBName = '';   // gewählte Bäume (für Schritt 4)

// Kanonische Felder -> i18n-Schlüssel (für Labels). Reihenfolge = Anzeige.
const MG_FELDER = {
  given:'reg_vorname', surname:'reg_nachname', sex:'pe_geschlecht', titel:'pe_titel',
  namenszusatz:'pe_namenszusatz', ehename:'pe_ehename', birth_date:'reg_geburtsdatum',
  birth_place:'reg_geburtsort', geburtsland:'reg_geburtsland', getauft:'reg_getauft',
  death_date:'pe_sterbedatum', hochzeitsort:'pe_hochzeitsort',
  hochzeit_standesamt:'pe_hochzeit_standesamt', hochzeit_kirchlich:'pe_hochzeit_kirchlich',
  beziehung:'pe_beziehung', email:'reg_kontakt_email', telefon:'reg_telefon',
  facebook:'reg_facebook', instagram:'reg_instagram', wohnort_land:'pe_wohnland',
  wohnort_stadt:'pe_wohnstadt', adresse:'pe_adresse', beruf:'pe_beruf',
  ausbildung:'pe_ausbildung', beschreibung:'pe_beschreibung'
};
const MG_DATUM = ['birth_date','death_date','getauft','hochzeit_standesamt','hochzeit_kirchlich'];
function mgFeldLabel(f){ return t(MG_FELDER[f] || f).replace(/[:*]\s*$/,'').trim(); }
const MG_LAND = ['geburtsland','wohnort_land','land'];
function mgWertAnzeige(f, wert){
  if (!wert) return '—';
  if (MG_DATUM.includes(f)) return formatDatumLang(wert) || wert;
  if (MG_LAND.includes(f))  return landAnzeige(wert) || wert;
  return wert;
}
function mgRohName(a, b){ return ((a||'') + ' ' + (b||'')).trim(); }

let mgWartungId = null;   // aktiver Wartungs-Lock während des Merges (siehe supabase_stammbaum_auto_leer.sql)
async function zeigeMergeModal(){
  if (!istSuperAdmin()) return;
  const menu = document.getElementById('nav-menu'); if (menu) menu.classList.remove('offen');
  mgScanPaare = []; mgFixPaar = null; mgAusgewaehlt = []; mgIndex = 0; mgDiff = [];
  document.getElementById('merge-erfolg').style.display = 'none';
  ['merge-fehler1','merge-fehler2','merge-fehler3'].forEach(id => {
    const e = document.getElementById(id); e.style.display = 'none'; e.textContent = '';
  });
  mgZeigeSchritt(1);
  document.getElementById('merge-modal').classList.add('aktiv');
  // Wartungs-Lock setzen: solange der Merge läuft, dürfen parallele Personen-
  // Löschungen keine (dann evtl. leeren) Bäume auto-entfernen.
  try {
    const { data } = await sbClient.rpc('wartung_start', { p_art: 'merge', p_global: true, p_notiz: 'Merge-GUI' });
    mgWartungId = data || null;
  } catch (e) { mgWartungId = null; }
  mgFuelleBaeume();   // erst nach dem Einblenden (suchbare Dropdowns korrekt positionieren)
}
function schliesseMergeModal(){
  document.getElementById('merge-modal').classList.remove('aktiv');
  if (mgWartungId) { const id = mgWartungId; mgWartungId = null; sbClient.rpc('wartung_ende', { p_id: id }).catch(() => {}); }
}
function mgZeigeSchritt(n){
  [1,2,3,4].forEach(i => { document.getElementById('merge-step'+i).style.display = (i===n) ? '' : 'none'; });
}
function mgZurueckZu(n){ mgZeigeSchritt(n); }

// Baum-Dropdowns aus der bereits geladenen Baumliste füllen
function mgFuelleBaeume(){
  const eintraege = Object.entries(stammbaeumeListe || {})
    .sort((a, b) => nm(a[1] || '').localeCompare(nm(b[1] || '')));
  const opts = '<option value=""></option>' + eintraege.map(([id, name]) =>
    `<option value="${escapeHtml(id)}">${escapeHtml(nm(name))}</option>`).join('');
  ['mg-baum-a','mg-baum-b'].forEach(id => { const s = document.getElementById(id); s.innerHTML = opts; s.value = ''; });
  ['mg-person-a','mg-person-b'].forEach(id => { const s = document.getElementById(id); s.innerHTML = '<option value=""></option>'; s.value = ''; });
  macheAlleSelectsSuchbar(document.getElementById('merge-modal'));
}

// Personen eines Baums in das zugehörige Personen-Dropdown laden
async function mgWaehleBaum(seite){
  const baumId = document.getElementById('mg-baum-' + seite).value;
  const sel = document.getElementById('mg-person-' + seite);
  sel.innerHTML = '<option value=""></option>'; sel.value = '';
  if (baumId){
    const { data, error } = await sbClient.from('personen')
      .select('id, vorname, nachname, stammbaum_daten').eq('stammbaum_id', baumId);
    if (!error){
      const liste = (data || []).map(p => {
        const bd = (p.stammbaum_daten || {}).birth_date;
        const lab = nm(mgRohName(p.vorname, p.nachname)) + (bd ? ' (* ' + (formatDatumLang(bd) || bd) + ')' : '');
        return { id: p.id, lab };
      }).sort((a, b) => a.lab.localeCompare(b.lab));
      sel.innerHTML = '<option value=""></option>' + liste.map(p =>
        `<option value="${escapeHtml(p.id)}">${escapeHtml(p.lab)}</option>`).join('');
    }
  }
  macheAlleSelectsSuchbar(document.getElementById('merge-modal'));
  sel.value = '';
}

// Schritt 1 -> Scan über beide Bäume
async function mgPruefen(){
  const fehler = document.getElementById('merge-fehler1'); fehler.style.display = 'none';
  const ba = document.getElementById('mg-baum-a').value, bb = document.getElementById('mg-baum-b').value;
  const pa = document.getElementById('mg-person-a').value, pb = document.getElementById('mg-person-b').value;
  if (!ba || !bb || !pa || !pb){ fehler.textContent = t('merge_baeume_waehlen'); fehler.style.display = 'block'; return; }
  if (pa === pb){ fehler.textContent = t('merge_gleiche_karte'); fehler.style.display = 'block'; return; }   // Karte nicht mit sich selbst mergen

  mgBaumA = ba; mgBaumB = bb;
  mgBaumAName = stammbaeumeListe[ba] || ''; mgBaumBName = stammbaeumeListe[bb] || '';

  // Auto-Dublettensuche nur ÜBER ZWEI verschiedene Bäume. Bei Merge INNERHALB eines
  // Baums (gleicher Baum links+rechts) nur das explizit gewählte Paar verwenden
  // (ein Selbst-Scan eines Baums liefert nur Rauschen). person_merge_aufgeloest ist
  // baum-unabhängig; Schritt 4 (Baum-Konsolidierung) erscheint ohnehin nur bei A≠B.
  if (ba !== bb){
    const { data, error } = await sbClient.rpc('dubletten_scan', { p_baum_a: ba, p_baum_b: bb });
    if (error){ fehler.textContent = t('merge_fehler') + error.message; fehler.style.display = 'block'; return; }
    mgScanPaare = data || [];
  } else {
    mgScanPaare = [];
  }

  // Rohnamen des explizit gewählten A/B-Paares holen (für saubere nm()-Anzeige)
  const { data: fixP } = await sbClient.from('personen').select('id, vorname, nachname').in('id', [pa, pb]);
  const rohName = id => { const r = (fixP || []).find(x => x.id === id); return r ? mgRohName(r.vorname, r.nachname) : ''; };
  mgFixPaar = { a: pa, b: pb, name_a: rohName(pa), name_b: rohName(pb) };

  // Personen-Kontext (Baum, Geburtsdatum, Eltern, Partner, Kinder) für alle Beteiligten laden
  const ids = new Set([pa, pb]);
  mgScanPaare.forEach(p => { ids.add(p.id_a); ids.add(p.id_b); });
  await mgLadeInfo([...ids]);

  mgRenderKandidaten();
  mgZeigeSchritt(2);
}

async function mgLadeInfo(ids){
  mgInfo = {};
  if (!ids.length) return;
  const { data } = await sbClient.rpc('merge_person_info', { p_ids: ids });
  (data || []).forEach(r => { mgInfo[r.id] = r; });
}

// Eine Personenzeile mit Kontext (für Kandidatenliste): Baum · *Datum · Eltern · Partner · Kinder
function mgInfoZeile(id, fallbackName){
  const inf = mgInfo[id];
  const name = inf && inf.name ? inf.name : fallbackName;
  const det = [];
  if (inf){
    if (inf.baum)       det.push(`${t('merge_info_baum')}: ${escapeHtml(nm(inf.baum))}`);
    if (inf.geboren)    det.push(`* ${escapeHtml(formatDatumLang(inf.geboren) || inf.geboren)}`);
    if (inf.geburtsort) det.push(escapeHtml(inf.geburtsort));
    if (inf.eltern)     det.push(`${t('merge_info_eltern')}: ${escapeHtml(nm(inf.eltern))}`);
    if (inf.partner)    det.push(`${t('merge_info_partner')}: ${escapeHtml(nm(inf.partner))}`);
    if (inf.kinder)     det.push(`${t('merge_info_kinder')}: ${inf.kinder}`);
  }
  return `<span class="mg-person"><span class="mg-namen">${escapeHtml(nm(name))}</span>` +
    (det.length ? `<span class="mg-meta">${det.join(' · ')}</span>` : '') + `</span>`;
}

function mgRenderKandidaten(){
  const box = document.getElementById('mg-kandidaten');
  let html = mgKandidatHtml(mgFixPaar, true, null);
  const weitere = mgScanPaare.filter(p => !(p.id_a === mgFixPaar.a && p.id_b === mgFixPaar.b));
  if (weitere.length === 0){
    html += `<p class="mv-legende">${t('merge_keine_kandidaten')}</p>`;
  } else {
    weitere.forEach(p => { html += mgKandidatHtml({ a: p.id_a, b: p.id_b, name_a: p.name_a, name_b: p.name_b }, false, p); });
  }
  box.innerHTML = html;
}
function mgKandidatHtml(paar, fix, scan){
  let grund;
  if (scan){
    const gruende = (scan.gruende || []).map(g => t('merge_grund_' + g)).join(', ');
    grund = `${t('merge_score')}: ${scan.score}${gruende ? ' · ' + escapeHtml(gruende) : ''}`;
  } else {
    grund = escapeHtml(t('merge_ab_paar'));
  }
  return `<div class="mg-kandidat${fix ? ' fix' : ''}">
    <label><input type="checkbox" class="mg-cb" data-a="${escapeHtml(paar.a)}" data-b="${escapeHtml(paar.b)}" ${fix ? 'checked' : ''}>
      <span class="mg-kandidat-body">
        <span class="mg-grund">${grund}</span>
        ${mgInfoZeile(paar.a, paar.name_a)}
        <span class="mg-vs">⟷</span>
        ${mgInfoZeile(paar.b, paar.name_b)}
      </span></label>
  </div>`;
}

// Schritt 2 -> ausgewählte Paare übernehmen, Schritt 3 starten
function mgWeiterZuKonflikt(){
  const fehler = document.getElementById('merge-fehler2'); fehler.style.display = 'none';
  const cbs = [...document.querySelectorAll('#mg-kandidaten .mg-cb:checked')];
  if (cbs.length === 0){ fehler.textContent = t('merge_keine_auswahl'); fehler.style.display = 'block'; return; }
  mgAusgewaehlt = cbs.map(cb => {
    const a = cb.dataset.a, b = cb.dataset.b;
    if (mgFixPaar && a === mgFixPaar.a && b === mgFixPaar.b) return { a, b, name_a: mgFixPaar.name_a, name_b: mgFixPaar.name_b };
    const sc = mgScanPaare.find(p => p.id_a === a && p.id_b === b);
    return { a, b, name_a: sc ? sc.name_a : '', name_b: sc ? sc.name_b : '' };
  });
  mgIndex = 0;
  mgZeigeSchritt(3);
  mgRenderPaar();
}

async function mgRenderPaar(){
  const fehler = document.getElementById('merge-fehler3'); fehler.style.display = 'none';
  const paar = mgAusgewaehlt[mgIndex];
  document.getElementById('mg-paar-zaehler').textContent =
    t('merge_paar_von', { n: mgIndex + 1, gesamt: mgAusgewaehlt.length });

  const { data: diff, error } = await sbClient.rpc('personen_feld_diff', { p_a: paar.a, p_b: paar.b });
  if (error){
    // Eine Karte existiert evtl. nicht mehr (durch vorherigen Merge) -> Paar überspringen
    console.warn('Paar übersprungen:', error.message);
    if (mgIndex < mgAusgewaehlt.length - 1){ mgIndex++; return mgRenderPaar(); }
    return mgFertig();
  }
  mgDiff = diff || [];
  const nurA = mgDiff.filter(d => d.status === 'nur_a').length;
  const nurB = mgDiff.filter(d => d.status === 'nur_b').length;
  mgSurvivor = (nurB > nurA) ? 'b' : 'a';   // Default: vollständigere Karte bleibt
  mgRenderSurvivor(paar);
  mgRenderKonflikte();
  mgRenderAuto();
}
function mgSurvLabel(id, fallbackName){
  const inf = mgInfo[id];
  const name = inf && inf.name ? inf.name : fallbackName;
  const baum = inf && inf.baum ? ' (' + nm(inf.baum) + ')' : '';
  return escapeHtml(nm(name) + baum);
}
function mgRenderSurvivor(paar){
  document.getElementById('mg-survivor').innerHTML =
    `<label class="mg-survivor-opt"><input type="radio" name="mg-surv" value="a" ${mgSurvivor==='a'?'checked':''} onchange="mgSetSurvivor('a')"> ${mgSurvLabel(paar.a, paar.name_a)}</label>` +
    `<label class="mg-survivor-opt"><input type="radio" name="mg-surv" value="b" ${mgSurvivor==='b'?'checked':''} onchange="mgSetSurvivor('b')"> ${mgSurvLabel(paar.b, paar.name_b)}</label>`;
}
function mgSetSurvivor(s){ mgSurvivor = s; mgRenderKonflikte(); mgRenderAuto(); }

function mgRenderKonflikte(){
  const box = document.getElementById('mg-konflikte');
  const konf = mgDiff.filter(d => d.status === 'konflikt');
  if (konf.length === 0){ box.innerHTML = ''; return; }
  let html = `<div class="reg-gruppe-titel">${t('merge_konflikt_titel')}</div>`;
  konf.forEach(d => {
    const f = d.feld, def = mgSurvivor;
    html += `<div class="mg-konflikt">
      <div class="mg-feld">${escapeHtml(mgFeldLabel(f))}</div>
      <div class="mg-opt"><label><input type="radio" name="mg-k-${f}" value="a" ${def==='a'?'checked':''}> ${t('merge_wert_a')}: ${escapeHtml(mgWertAnzeige(f, d.wert_a))}</label></div>
      <div class="mg-opt"><label><input type="radio" name="mg-k-${f}" value="b" ${def==='b'?'checked':''}> ${t('merge_wert_b')}: ${escapeHtml(mgWertAnzeige(f, d.wert_b))}</label></div>
      <div class="mg-opt"><label><input type="radio" name="mg-k-${f}" value="m"> ${t('merge_manuell')}</label>
        <input type="text" class="login-feld mg-man" data-feld="${f}" value="${escapeHtml(d['wert_'+def] || '')}"></div>
    </div>`;
  });
  box.innerHTML = html;
}
function mgRenderAuto(){
  const box = document.getElementById('mg-auto');
  const auto = mgDiff.filter(d => d.status !== 'konflikt');
  if (auto.length === 0){ box.innerHTML = ''; return; }
  let html = `<div class="reg-gruppe-titel">${t('merge_auto_titel')}</div>`;
  auto.forEach(d => {
    const f = d.feld;
    const wert = d.status === 'nur_b' ? d.wert_b : d.wert_a;   // gleich/nur_a: A; nur_b: B
    html += `<div class="mg-auto-row"><b>${escapeHtml(mgFeldLabel(f))}:</b> ${escapeHtml(mgWertAnzeige(f, wert))}</div>`;
  });
  box.innerHTML = html;
}

async function mgMergeAktuelles(){
  const fehler = document.getElementById('merge-fehler3'); fehler.style.display = 'none';
  const btn = document.getElementById('mg-merge-btn'); const alt = btn.textContent;
  const paar = mgAusgewaehlt[mgIndex];
  const behalten = mgSurvivor === 'a' ? paar.a : paar.b;
  const dublette = mgSurvivor === 'a' ? paar.b : paar.a;

  // Konfliktauflösung sammeln (für jedes Konfliktfeld den gewählten Endwert)
  const aufloesung = {};
  mgDiff.filter(d => d.status === 'konflikt').forEach(d => {
    const f = d.feld;
    const sel = document.querySelector(`input[name="mg-k-${f}"]:checked`);
    const wahl = sel ? sel.value : mgSurvivor;
    let val;
    if (wahl === 'a') val = d.wert_a;
    else if (wahl === 'b') val = d.wert_b;
    else { const man = document.querySelector(`.mg-man[data-feld="${f}"]`); val = man ? man.value.trim() : ''; }
    aufloesung[f] = val || '';
  });

  btn.disabled = true; btn.textContent = t('merge_laeuft');
  const { error } = await sbClient.rpc('person_merge_aufgeloest',
    { p_behalten: behalten, p_dublette: dublette, p_aufloesung: aufloesung });
  btn.disabled = false; btn.textContent = alt;
  if (error){ fehler.textContent = t('merge_fehler') + error.message; fehler.style.display = 'block'; return; }

  if (mgIndex < mgAusgewaehlt.length - 1){ mgIndex++; mgRenderPaar(); }
  else { await mgFertig(); }
}

async function mgFertig(){
  mgZeigeSchritt(0);   // Schritte 1–3 ausblenden
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  await raeumeVerwaisteMedien();   // ggf. durch Merge leer gewordene Bäume -> Event-Medien abräumen
  // Personen sind zusammengeführt. Optional: die beiden (evtl. doppelten) Stammbäume zu einem machen.
  if (mgBaumA && mgBaumB && mgBaumA !== mgBaumB && stammbaeumeListe[mgBaumA] && stammbaeumeListe[mgBaumB]){
    mgRenderTreeMerge();
    mgZeigeSchritt(4);
  } else {
    mgErfolgUndZu(t('merge_fertig'));
  }
}

// Schritt 4: optionale Baum-Konsolidierung anbieten
function mgRenderTreeMerge(){
  const erfolg = document.getElementById('merge-erfolg');
  erfolg.textContent = t('merge_fertig'); erfolg.style.display = 'block';
  document.getElementById('merge-fehler4').style.display = 'none';
  const a = escapeHtml(nm(mgBaumAName)), b = escapeHtml(nm(mgBaumBName));
  document.getElementById('mg-tree-merge').innerHTML =
    `<button class="login-submit" type="button" style="margin-top:0" onclick="mgTreeMerge('a')">${t('merge_tree_a_bleibt', { a, b })}</button>` +
    `<button class="login-submit" type="button" style="margin-top:0" onclick="mgTreeMerge('b')">${t('merge_tree_b_bleibt', { a, b })}</button>` +
    `<button class="login-hinweis-btn sekundaer" type="button" onclick="mgTreeNein()">${t('merge_tree_nein')}</button>`;
}
async function mgTreeMerge(zielSeite){
  const fehler = document.getElementById('merge-fehler4'); fehler.style.display = 'none';
  const ziel   = zielSeite === 'a' ? mgBaumA : mgBaumB;
  const quelle = zielSeite === 'a' ? mgBaumB : mgBaumA;
  const { error } = await sbClient.rpc('stammbaeume_zusammenfuehren', { p_quelle: quelle, p_ziel: ziel });
  if (error){ fehler.textContent = t('merge_fehler') + error.message; fehler.style.display = 'block'; return; }
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  await raeumeVerwaisteMedien();   // der gelöschte Quell-Baum kann Event-Medien hinterlassen haben
  mgErfolgUndZu(t('merge_tree_fertig'));
}
function mgTreeNein(){ mgErfolgUndZu(t('merge_fertig')); }
function mgErfolgUndZu(msg){
  mgZeigeSchritt(0);
  const erfolg = document.getElementById('merge-erfolg');
  erfolg.textContent = msg; erfolg.style.display = 'block';
  setTimeout(() => schliesseMergeModal(), 1400);
}

async function anmelden() {
  const email    = document.getElementById('login-email').value.trim();
  const passwort = document.getElementById('login-passwort').value;
  const fehlerEl = document.getElementById('login-fehler');
  fehlerEl.style.display = 'none';

  if (!email || !passwort) {
    fehlerEl.textContent   = t('login_pflicht');
    fehlerEl.style.display = 'block';
    return;
  }
  if (!isValidEmail(email)) {
    markiereEmailFehler(document.getElementById('login-email'), true);
    fehlerEl.textContent   = t('email_ungueltig');
    fehlerEl.style.display = 'block';
    document.getElementById('login-email').focus();
    return;
  }

  const { error } = await sbClient.auth.signInWithPassword({ email, password: passwort });
  if (error) {
    fehlerEl.textContent   = t('login_fehler_prefix') + error.message;
    fehlerEl.style.display = 'block';
  } else {
    schliesseLoginModal();
  }
}

async function abmelden() {
  await sbClient.auth.signOut();
}

// Passwort vergessen: Recovery-Mail mit Einmal-Link senden. Der Link führt
// zurück zur App (type=recovery) -> pruefePasswortSetzen öffnet das Passwort-Modal.
async function passwortVergessen() {
  const email    = document.getElementById('login-email').value.trim();
  const fehlerEl = document.getElementById('login-fehler');
  fehlerEl.style.display = 'none';
  if (!email) {
    fehlerEl.textContent = t('pw_email_noetig');
    fehlerEl.style.display = 'block';
    return;
  }
  if (!isValidEmail(email)) {
    markiereEmailFehler(document.getElementById('login-email'), true);
    fehlerEl.textContent = t('email_ungueltig');
    fehlerEl.style.display = 'block';
    return;
  }

    fehlerEl.style.display = 'block';

  schliesseLoginModal();
  await zeigeHinweis(t('pw_reset_gesendet'));
}

// Nach Klick auf den Invite-/Recovery-Link (aus der Zusage-Mail) landet der User
// mit Session + URL-Hash hier. Wir erkennen das und bieten Passwort-Setzen an.
function pruefePasswortSetzen() {
  const hash = window.location.hash || '';
  if (hash.includes('type=invite') || hash.includes('type=recovery')) {
    document.getElementById('setpw-modal').classList.add('aktiv');
    setTimeout(() => document.getElementById('setpw-passwort').focus(), 60);
  }
}

async function setzePasswort() {
  const pw       = document.getElementById('setpw-passwort').value;
  const pw2      = document.getElementById('setpw-passwort2').value;
  const fehlerEl = document.getElementById('setpw-fehler');
  const erfolgEl = document.getElementById('setpw-erfolg');
  const button   = document.querySelector('#setpw-modal .login-submit');
  fehlerEl.style.display = 'none';
  erfolgEl.style.display = 'none';

  // Bug 1: zwei Eingaben, müssen übereinstimmen
  if (!pw || pw.length < 6) {
    fehlerEl.textContent = t('setpw_fehler') + '≥ 6';
    fehlerEl.style.display = 'block'; return;
  }
  if (pw !== pw2) {
    fehlerEl.textContent = t('setpw_ungleich');
    fehlerEl.style.display = 'block'; return;
  }

  // Bug 2: sicherstellen, dass die Session aus dem Invite-/Recovery-Link aktiv ist
  const { data: { session } } = await sbClient.auth.getSession();
  if (!session) {
    fehlerEl.textContent = t('setpw_keine_session');
    fehlerEl.style.display = 'block'; return;
  }

  const altText = button ? button.textContent : '';
  if (button) { button.disabled = true; button.textContent = t('reg_senden_laeuft'); }

  const { error } = await sbClient.auth.updateUser({ password: pw });

  if (button) { button.disabled = false; button.textContent = altText; }

  if (error) {
    fehlerEl.textContent = t('setpw_fehler') + error.message;
    fehlerEl.style.display = 'block'; return;
  }

  // Erfolg: Passwort ist gesetzt und der User ist über diese Session eingeloggt.
  // App-Auth-Status explizit setzen (UI + Baum laden) und Token aus der URL entfernen.
  history.replaceState(null, '', window.location.pathname + window.location.search);
  erfolgEl.textContent = t('setpw_erfolg');
  erfolgEl.style.display = 'block';
  document.getElementById('setpw-passwort').value = '';
  document.getElementById('setpw-passwort2').value = '';
  const { data: { session: s2 } } = await sbClient.auth.getSession();
  if (s2) await setzeUser(s2.user);   // meldet den User in der Oberfläche an
  setTimeout(() => document.getElementById('setpw-modal').classList.remove('aktiv'), 1500);
}

// ---- Hintergrund-Prüfung: existiert dieser Stammbaum schon? -------------------
// Sobald Naziv stabla + Država + Grad/selo + Opština ausgefüllt sind, prüfen wir
// per RPC familie_finden_exakt (striktes 4-Felder-Matching, diakritik-/groß-klein-
// unempfindlich). Treffer -> Zugriffsanfrage (Info + Rolle). Kein Treffer -> der
// normale Erstellungsprozess (Self-Service) läuft beim Absenden.
let regMatchTimer = null;
let regMatchFamilie = null;   // { id, name } bei Treffer, sonst null
function pruefeBaumMatchDebounced() {
  clearTimeout(regMatchTimer);
  regMatchTimer = setTimeout(pruefeBaumMatch, 300);
}

async function pruefeBaumMatch() {
  const v = id => document.getElementById(id).value.trim();
  const name = v('reg-baum-name'), land = v('reg-land'),
        stadt = v('reg-stadt'), gemeinde = v('reg-gemeinde');
  // Erst prüfen, wenn ALLE vier Pflichtfelder gefüllt sind
  if (!name || !land || !stadt || !gemeinde) { aktualisiereRegMatchUI(null); return null; }

  // Orte werden lateinisch gespeichert -> kyrillische Eingaben vor dem Vergleich
  // nach Latein wandeln (Land kommt bereits kanonisch aus dem Dropdown).
  const { data, error } = await sbClient.rpc('familie_finden_exakt', {
    p_name:     srCyr2Lat(name),
    p_land:     land,
    p_stadt:    srCyr2Lat(stadt),
    p_gemeinde: srCyr2Lat(gemeinde)
  });
  if (error) { console.warn('familie_finden_exakt:', error.message); aktualisiereRegMatchUI(null); return null; }
  const hit = (data && data.length) ? data[0] : null;
  aktualisiereRegMatchUI(hit);
  return hit;
}

// UI an den Match-Status anpassen: Treffer zeigt Info + Rollen-Dropdown und
// schaltet den Button auf "Zugang beantragen"; sonst Self-Service-Anlegen.
function aktualisiereRegMatchUI(hit) {
  regMatchFamilie = hit ? { id: hit.id, name: hit.name } : null;
  document.getElementById('reg-familie').value = hit ? hit.id : '';
  const block = document.getElementById('reg-match-block');
  if (block) block.style.display = hit ? '' : 'none';
  if (hit) aktualisiereRegWahl();   // Hinweis + Rollen-Sichtbarkeit gemäß Auswahl
  aktualisiereRegSubmitButton();
}

// Aktuelle Wahl bei vorhandenem Baum: 'beitreten' (Standard) oder 'eigenen'
function regMatchWahl() {
  const sel = document.querySelector('input[name="reg-match-wahl"]:checked');
  return sel ? sel.value : 'beitreten';
}

// Hinweistext + Rollen-Dropdown je nach Wahl umschalten
function aktualisiereRegWahl() {
  const beitreten = regMatchWahl() === 'beitreten';
  const rolleBlock = document.getElementById('reg-rolle-block');
  const hinweis    = document.getElementById('reg-wahl-hinweis');
  if (rolleBlock) rolleBlock.style.display = beitreten ? '' : 'none';
  if (hinweis) hinweis.textContent = t(beitreten ? 'reg_wahl_hinweis_beitreten' : 'reg_wahl_hinweis_eigenen');
  aktualisiereRegSubmitButton();
}

function aktualisiereRegSubmitButton() {
  const btn = document.getElementById('reg-submit');
  if (!btn) return;
  // „Zugang beantragen" nur, wenn ein Baum gefunden wurde UND der User beitreten will;
  // sonst (kein Treffer oder „eigenen") wird ein eigenes Konto/Baum angelegt.
  const beitreten = regMatchFamilie && regMatchWahl() === 'beitreten';
  btn.textContent = beitreten ? t('reg_absenden') : t('reg_konto_anlegen');
}

// Einfacher Hinweis-Dialog (nur OK-Button) – für klare Bestätigungen.
function zeigeHinweis(text) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-text">${escapeHtml(text)}</p>
        <div class="confirm-actions">
          <button type="button" class="confirm-ja">OK</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const fertig = () => { overlay.remove(); resolve(); };
    overlay.querySelector('.confirm-ja').addEventListener('click', fertig);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) fertig(); });
  });
}

// Alle Registrier-Felder leeren (nach erfolgreichem Absenden / beim Öffnen).
function regFelderLeeren() {
  ['reg-email','reg-baum-name','reg-land','reg-stadt','reg-gemeinde','reg-geburtsort','reg-geburtsland',
   'reg-vorname','reg-nachname','reg-geburtsdatum','reg-getauft','reg-verheiratet',
   'reg-telefon','reg-kontakt-email','reg-facebook','reg-instagram']
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  ['reg-geburtsdatum','reg-getauft','reg-verheiratet']
    .forEach(id => datumSetzen(document.getElementById(id), ''));   // Datumsfelder + iso zurücksetzen
  document.getElementById('reg-familie').value = '';
  const wahlBeitreten = document.querySelector('input[name="reg-match-wahl"][value="beitreten"]');
  if (wahlBeitreten) wahlBeitreten.checked = true;   // Standard-Auswahl zurücksetzen
  aktualisiereRegMatchUI(null);   // Match-Block aus, Button = "Konto anlegen"
}

async function sendeRegistrierAnfrage() {
  const fehlerEl = document.getElementById('reg-fehler');
  const erfolgEl = document.getElementById('reg-erfolg');
  const button   = document.getElementById('reg-submit');
  fehlerEl.style.display = 'none';
  erfolgEl.style.display = 'none';

  const val  = id => document.getElementById(id).value.trim();
  const vald = id => datumWert(document.getElementById(id));   // Datumsfelder -> ISO/Freitext

  // Pflichtfelder: E-Mail + die vier Baum-Felder (Naziv/Država/Grad/Opština)
  const email = val('reg-email');
  if (!email || !val('reg-baum-name') || !val('reg-land') || !val('reg-stadt') || !val('reg-gemeinde')) {
    fehlerEl.textContent = t('reg_pflicht');
    fehlerEl.style.display = 'block';
    return;
  }
  // E-Mail-Format (Pflicht-E-Mail) + optionale Kontakt-E-Mail prüfen
  if (!isValidEmail(email)) {
    markiereEmailFehler(document.getElementById('reg-email'), true);
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('reg-email').focus();
    return;
  }
  if (!pruefeEmailFeld(document.getElementById('reg-kontakt-email'), false)) {
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('reg-kontakt-email').focus();
    return;
  }

  // Aktuellen Match-Status sicherstellen (falls der User vor dem Debounce absendet).
  await pruefeBaumMatch();

  // Eigenen Baum anlegen, wenn KEIN Treffer ODER der User sich bewusst dafür
  // entscheidet (Wahl „eigenen") trotz vorhandenem Baum.
  if (!regMatchFamilie || regMatchWahl() === 'eigenen') { await regNeueFamilieAnlegen(); return; }

  // Vorhandener Baum -> Zugriffsanfrage an die Admins (Entscheidung in der App).
  const familie_id = regMatchFamilie.id;
  const rolle      = document.getElementById('reg-rolle').value;
  if (!rolle) { fehlerEl.textContent = t('reg_pflicht'); fehlerEl.style.display = 'block'; return; }

  const altText = button.textContent;
  button.disabled = true;
  button.textContent = t('reg_senden_laeuft');

  // ID clientseitig erzeugen: So brauchen wir KEIN .select() nach dem Insert
  // (das würde ein RETURNING/SELECT auslösen, das anon per RLS nicht lesen darf -> 42501).
  const anfrageId = (crypto.randomUUID ? crypto.randomUUID() : ('' + Date.now() + Math.random()));
  const anfrage = {
    id:             anfrageId,
    email,
    familie_id,
    rolle,
    vorname:        val('reg-vorname')       || null,
    nachname:       val('reg-nachname')      || null,
    geburtsdatum:   vald('reg-geburtsdatum')  || null,
    geburtsort:     val('reg-geburtsort')    || null,
    geburtsland:    val('reg-geburtsland')   || null,   // Geburtsland der Person
    stadt:          val('reg-stadt')         || null,   // Familien-Finder: Stadt
    gemeinde:       val('reg-gemeinde')      || null,   // Familien-Finder: Gemeinde
    getauft_am:     vald('reg-getauft')       || null,
    verheiratet_am: vald('reg-verheiratet')   || null,
    telefon:        val('reg-telefon')       || null,
    kontakt_email:  val('reg-kontakt-email') || null,
    facebook:       val('reg-facebook')      || null,
    instagram:      val('reg-instagram')     || null,
    sprache:        aktuelleSprache,   // E-Mail-Sprache = GUI-Sprache beim Absenden
    status:         'offen'
  };

  const { error } = await sbClient
    .from('registrierungs_anfragen').insert(anfrage);   // KEIN .select() -> return=minimal

  if (error) {
    button.disabled = false;
    button.textContent = altText;
    console.error('Anfrage-Fehler:', error);
    fehlerEl.textContent = t('reg_fehler') + error.message;
    fehlerEl.style.display = 'block';
    return;
  }

  // Admins per E-Mail benachrichtigen (Edge Function). Schlägt der Versand fehl,
  // ist die Anfrage trotzdem gespeichert und für Admins sichtbar -> nicht kritisch.
  try {
    await sbClient.functions.invoke('anfrage-senden', { body: { id: anfrageId } });
  } catch (e) {
    console.warn('Benachrichtigung fehlgeschlagen:', e);
  }

  button.disabled = false;
  button.textContent = altText;

  // Felder leeren, Overlay schließen und eine klare Bestätigung anzeigen,
  // die der User selbst wegklickt (verschwindet nicht von allein).
  regFelderLeeren();
  schliesseRegistrierModal();
  await zeigeHinweis(t('reg_erfolg'));
}

// Kein vorhandener Baum gefunden: neuen, leeren Stammbaum selbst anlegen (ohne
// Admin-Freigabe). Edge Function legt Auth-User + Familie (mit Ortsfeldern fürs
// spätere Matching) + Stammbaum + erste Person + Owner-Mitgliedschaft an und
// verschickt eine Einladungs-Mail zum Passwort-Setzen.
async function regNeueFamilieAnlegen() {
  const fehlerEl = document.getElementById('reg-fehler');
  const erfolgEl = document.getElementById('reg-erfolg');
  const button   = document.getElementById('reg-submit');
  fehlerEl.style.display = 'none';
  erfolgEl.style.display = 'none';

  const val  = id => document.getElementById(id).value.trim();
  const vald = id => datumWert(document.getElementById(id));   // Datumsfelder -> ISO/Freitext
  const email        = val('reg-email');
  const familie_name = val('reg-baum-name');   // Naziv stabla = Name der neuen Familie/des Baums

  if (!email || !familie_name) {
    fehlerEl.textContent = t('reg_pflicht');
    fehlerEl.style.display = 'block';
    return;
  }
  if (!isValidEmail(email)) {
    markiereEmailFehler(document.getElementById('reg-email'), true);
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('reg-email').focus(); return;
  }
  if (!pruefeEmailFeld(document.getElementById('reg-kontakt-email'), false)) {
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('reg-kontakt-email').focus(); return;
  }

  const altText = button.textContent;
  button.disabled = true;
  button.textContent = t('reg_senden_laeuft');

  const payload = {
    email,
    familie_name,
    // Ortsfelder der Familie (Država / Grad-selo / Opština) – lateinisch speichern,
    // damit das spätere strikte Matching (familie_finden_exakt) greift.
    land:     val('reg-land')              || null,
    stadt:    srCyr2Lat(val('reg-stadt'))    || null,
    gemeinde: srCyr2Lat(val('reg-gemeinde')) || null,
    sprache: aktuelleSprache,
    person: {
      vorname:        val('reg-vorname')       || null,
      nachname:       val('reg-nachname')      || familie_name,
      geburtsdatum:   vald('reg-geburtsdatum')  || null,
      geburtsort:     val('reg-geburtsort')    || null,
      geburtsland:    val('reg-geburtsland')   || null,
      getauft_am:     vald('reg-getauft')       || null,
      verheiratet_am: vald('reg-verheiratet')   || null,
      telefon:        val('reg-telefon')       || null,
      kontakt_email:  val('reg-kontakt-email') || null,
      facebook:       val('reg-facebook')      || null,
      instagram:      val('reg-instagram')     || null
    }
  };

  // Direkter fetch statt functions.invoke: so lesen wir den JSON-Body der
  // Function zuverlässig selbst (supabase-js verschluckt bei non-2xx sonst die
  // eigentliche Fehlermeldung im FunctionsHttpError).
  let ok = false, fnCode = null, fnMsg = null;
  try {
    const resp = await fetch(SUPABASE_URL + '/functions/v1/neue-familie-anlegen', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify(payload)
    });
    const body = await resp.json().catch(() => ({}));
    ok = resp.ok && !body.error;
    fnCode = body.code || null;
    fnMsg  = body.error || (!resp.ok ? ('HTTP ' + resp.status) : null);
  } catch (e) {
    fnMsg = e.message || String(e);
  }

  button.disabled = false;
  button.textContent = altText;

  if (!ok) {
    console.error('Neue-Familie-Fehler:', fnCode, fnMsg);
    const low = (fnMsg || '').toLowerCase();
    const emailExists = fnCode === 'email_exists'
      || low.includes('already') || low.includes('registered') || low.includes('exist');
    fehlerEl.textContent = emailExists ? t('reg_email_existiert') : (t('reg_fehler') + (fnMsg || ''));
    fehlerEl.style.display = 'block';
    fehlerEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  regFelderLeeren();
  schliesseRegistrierModal();
  await zeigeHinweis(t('reg_neue_erfolg'));
}

  if (!text) return text;

  SR_DIGRAFEN.forEach(([lat, cyr]) => { out = out.split(lat).join(cyr); });

  const m = {};

    try { _dnCache[loc] = (typeof Intl !== 'undefined' && Intl.DisplayNames) ? new Intl.DisplayNames([loc], { type: 'region' }) : null; }
    catch (e) { _dnCache[loc] = null; }
  }
  return _dnCache[loc];
}
// Lokalisierter Ländername zu einem ISO-Code (Fallback: der Code selbst)
function landName(code, lang) {
  if (!code) return '';
  const dn = landDisplayNames(lang || aktuelleSprache);
  let n = null; try { n = dn ? dn.of(code) : null; } catch (e) { n = null; }
  return n || code;
}
// Reverse-Map: Ländername (alle 5 Sprachen via Intl + Legacy ORT_LEXIKON) -> ISO-Code
const _landNachCode = (() => {
  const m = {};
  const langs = ['de','sr','hr','ba','en'];
  ISO_LAENDER.forEach(code => {
    m[code.toLowerCase()] = code;
    langs.forEach(l => { const n = landName(code, l); if (n && n.toUpperCase() !== code) m[n.toLowerCase()] = code; });
  });
  ORT_LEXIKON.forEach(e => { if (e.iso) langs.forEach(l => { if (e[l]) m[e[l].toLowerCase()] = e.iso; }); });
  return m;
})();
// Beliebiger Wert (Code ODER Klartext in irgendeiner Sprache) -> ISO-Code ('' wenn unbekannt)
function landZuCode(value) {
  const v = (value || '').trim();
  if (!v) return '';
  if (/^[A-Za-z]{2}$/.test(v) && ISO_LAENDER.includes(v.toUpperCase())) return v.toUpperCase();
  return _landNachCode[v.toLowerCase()] || '';
}
// Anzeige eines gespeicherten Länderwerts (Code -> lokalisierter Name; Legacy-Text -> übersetzt)
function landAnzeige(value) {
  const v = (value || '').trim(); if (!v) return '';
  const code = landZuCode(v);
  return code ? landName(code, aktuelleSprache) : uebersetzeOrt(v);
}

// Übersetzt bekannte Orte/Länder in die aktuelle GUI-Sprache (Teil-für-Teil bei
// kommagetrennten Werten); Unbekanntes bleibt im Original.
function uebersetzeOrt(text) {
  if (!text) return text;
  return String(text).split(/\s*,\s*/).map(teil => {
    const e = ortLookup[teil.trim().toLowerCase()];
    return e ? (e[aktuelleSprache] || e.de || teil) : teil;
  }).join(', ');
}

// Befüllt EIN Länder-Dropdown mit ISO-Codes (value=Code, Label=lokalisierter Name,
// alphabetisch). Vorherige Auswahl (Code ODER Legacy-Klartext) bleibt erhalten.
function fuelleEinLandSelect(sel) {
  if (!sel) return;
  const alt = sel.value;
  const opts = ISO_LAENDER
    .map(code => ({ code, label: landName(code, aktuelleSprache) }))
    .sort((a, b) => a.label.localeCompare(b.label, isoLocale(aktuelleSprache)));
  sel.innerHTML = `<option value="">${escapeHtml(t('reg_land_waehlen'))}</option>` +
    opts.map(o => `<option value="${escapeHtml(o.code)}">${escapeHtml(o.label)}</option>`).join('');
  if (alt) setLandSelectValue(sel, alt);
}
// Wert in ein Länder-Select setzen (normalisiert auf ISO-Code; unbekannten
// Freitext als temporäre Option erhalten, damit nichts verloren geht).
function setLandSelectValue(sel, value) {
  if (!sel) return;
  const roh = (value || '').trim();
  const code = landZuCode(roh) || roh;
  if (code && ![...sel.options].some(o => o.value === code)) {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = ISO_LAENDER.includes(code) ? landName(code, aktuelleSprache) : code;
    sel.appendChild(opt);
  }
  sel.value = code || '';
}
function setLandSelect(id, value) { setLandSelectValue(document.getElementById(id), value); }
// Alle Länder-Selects (Klasse .land-select) unter root neu befüllen (Auswahl bleibt).

// ============================================================
// PHASE A2: Baum aus Supabase laden (Fallback: eingebettetes FAMILY_DATA)
// Rekonstruiert aus personen + beziehungen (ehepartner/elternteil) wieder die
// GEDCOM-artige Struktur { persons, families }. Personen-Schlüssel = externe_id
// (z.B. I500009) -> bleibt kompatibel zur bestehenden Render-Logik.
// ============================================================
async function ladeBaumAusSupabase() {
  const [pRes, bRes, sRes] = await Promise.all([
    sbClient.from('personen').select('id, externe_id, stammbaum_daten, pos_x, pos_y, stammbaum_id, user_id, identitaet_id, updated_at'),
    sbClient.from('beziehungen').select('person_a, person_b, typ'),
    sbClient.from('stammbaeume').select('id, name, familie_id')
  ]);
  if (pRes.error || bRes.error) {
    console.warn('Supabase-Baum: Ladefehler, nutze eingebettete Daten.', pRes.error || bRes.error);
    return null;
  }
  // Baumliste merken (id -> name) für Auswahl & Kopf; id -> familie_id für Stammdaten
  stammbaeumeListe = {};
  stammbaumZuFamilie = {};
  (sRes.data || []).forEach(s => {
    stammbaeumeListe[s.id] = s.name;
    if (s.familie_id) stammbaumZuFamilie[s.id] = s.familie_id;
  });
  const rows = pRes.data || [];
  if (rows.length === 0) return null;   // nicht eingeloggt / keine Sichtbarkeit -> Fallback

  const uuid2ext = {};
  const persons  = {};
  rows.forEach(row => {
    const sd  = row.stammbaum_daten || {};
    const ext = row.externe_id || sd.id;
    if (!ext) return;
    uuid2ext[row.id] = ext;
    persons[ext] = {
      ...sd, id: ext, families_spouse: [], families_child: [],
      _uuid: row.id,
      _tree: row.stammbaum_id || null,
      _ident: row.identitaet_id || null,   // gleiche reale Person über Bäume (logische Verknüpfung)
      _hatKonto: !!row.user_id,
      _pos: (row.pos_x != null && row.pos_y != null) ? { x: row.pos_x, y: row.pos_y } : null,
      _updated: row.updated_at || null   // P5: Stand für Optimistic-Locking-Vergleich
    };
  });

  // Beziehungen -> Ehepaare + Eltern-Mengen je Kind
  const ehe = [];
  const elternVon = {};
  (bRes.data || []).forEach(b => {
    const a = uuid2ext[b.person_a], c = uuid2ext[b.person_b];
    if (!a || !c) return;
    if (b.typ === 'ehepartner')      ehe.push([a, c]);
    else if (b.typ === 'elternteil') (elternVon[c] = elternVon[c] || new Set()).add(a);
  });

  // Familien-Einheiten rekonstruieren (Schlüssel = sortierte Eltern-IDs)
  const families = {};
  const keyToFam = {};
  let famN = 1;
  function holeFamilie(parents) {
    const key = parents.slice().sort().join('__');
    if (keyToFam[key]) return keyToFam[key];
    const fid = 'FAM' + (famN++);
    const fam = { id: fid, husband: null, wife: null, children: [] };
    parents.forEach(pid => {
      const sex = (persons[pid] && persons[pid].sex) || '';
      if (sex === 'M' && !fam.husband)      fam.husband = pid;
      else if (sex === 'F' && !fam.wife)    fam.wife = pid;
      else if (!fam.husband)                fam.husband = pid;
      else                                  fam.wife = pid;
    });
    families[fid] = fam;
    keyToFam[key] = fid;
    return fid;
  }
  ehe.forEach(([a, b]) => holeFamilie([a, b]));                 // auch kinderlose Paare
  Object.entries(elternVon).forEach(([child, set]) => {
    const fid = holeFamilie([...set]);
    if (!families[fid].children.includes(child)) families[fid].children.push(child);
  });

  // families_spouse / families_child an den Personen setzen
  Object.values(families).forEach(fam => {
    if (fam.husband && persons[fam.husband]) persons[fam.husband].families_spouse.push(fam.id);
    if (fam.wife    && persons[fam.wife])    persons[fam.wife].families_spouse.push(fam.id);
    fam.children.forEach(cid => { if (persons[cid]) persons[cid].families_child.push(fam.id); });
  });

  return { persons, families };
}

// Lädt die Baumdaten und rendert neu; bei Misserfolg bleibt das eingebettete FAMILY_DATA aktiv.
async function ladeBaumDaten() {
  const daten = await ladeBaumAusSupabase();
  if (!daten || Object.keys(daten.persons).length === 0) {
    console.log('Baum: eingebettete FAMILY_DATA aktiv (Supabase leer/nicht sichtbar).');
    return;
  }
  // Hinweis: KEIN Hardcode-Check auf die Vidović-Wurzel I500009 mehr.
  // Sonst würden Konten ohne diese Wurzel (eigene/andere Stammbäume) fälschlich
  // auf das eingebettete FAMILY_DATA zurückfallen und ihre echten Daten nicht sehen.
  aktuelleDaten = daten;
  console.log('Baum aus Supabase geladen:', Object.keys(daten.persons).length, 'Personen,',
    Object.keys(daten.families).length, 'Familien,', Object.keys(stammbaeumeListe).length, 'Stammbäume.');
  // Multi-Tree (B2): Auswahl befüllen.
  befuelleStammbaumAuswahl();
  // Aktuell geöffneten Stammbaum BEIBEHALTEN (z. B. nach Speichern/Bearbeiten/
  // Hochladen/Löschen). Beim ERSTEN Laden nach Login: Start-Stammbaum nach Priorität
  // (gespeicherter Standard > Owner > Admin; bei mehreren ohne Standard -> Willkommen-Overlay).
  const groessen = stammbaumGroessen();
  const gueltig = id => id && groessen[id];               // Baum existiert + hat Personen
  if (gueltig(aktuellerStammbaumId)) {
    waehleStammbaum(aktuellerStammbaumId);
  } else if (!startBaumGewaehlt) {
    startBaumGewaehlt = true;
    waehleStartStammbaum();
  } else {
    let standard = null;
    try { const s = localStorage.getItem('vidovic_tree'); if (gueltig(s)) standard = s; } catch (e) {}
    if (!standard) standard = groessterStammbaum();
    if (standard) waehleStammbaum(standard);
    else { aktualisiereStats(); zeichneBaumNeu(); }
  }
  if (aktuelleAnsicht === 'karten') zeigeKarten();
  else if (aktuelleAnsicht === 'shorts') zeigeShorts();
}

// Standard-Stammbaum (pro User, lokal dauerhaft gespeichert)
function standardBaumKey() { return aktuellerUser ? 'vidovic_standard_baum_' + aktuellerUser.id : null; }
function getStandardBaum() {
  const k = standardBaumKey(); if (!k) return null;
  const v = localStorage.getItem(k);
  return (v && stammbaeumeListe[v]) ? v : null;   // nur, wenn noch zugänglich
}
function setStandardBaum(id) { const k = standardBaumKey(); if (k && id) localStorage.setItem(k, id); }

// Bäume, für die der User verantwortlich ist (Owner/Admin; Super-Admin zählt wie Owner).
// Nur Bäume mit Personen. -> { owner:[ids], admin:[ids], verantwortlich:[ids] }
function meineVerantwortlichenBaeume() {
  const groessen = stammbaumGroessen();
  const owner = [], admin = [];
  Object.keys(stammbaeumeListe).forEach(id => {
    if (!groessen[id]) return;
    const fam = stammbaumZuFamilie[id];
    const rolle = fam ? meineRollenProFamilie[fam] : null;
    if (rolle === 'familien_owner' || rolle === 'super_admin') owner.push(id);
    else if (rolle === 'familien_admin') admin.push(id);
  });
  return { owner, admin, verantwortlich: [...owner, ...admin] };
}

// Start-Stammbaum nach Login wählen. Priorität:
// gespeicherter Standard > genau 1 Owner-Baum > genau 1 Admin-Baum >
// (mehrere Verantwortlichkeiten -> Willkommen-Overlay) > zuletzt geöffneter > größter.
function waehleStartStammbaum() {
  const saved = getStandardBaum();
  if (saved) { waehleStammbaum(saved); return; }   // explizite Wahl des Users hat Vorrang

  const { owner, admin, verantwortlich } = meineVerantwortlichenBaeume();
  const kandidaten = owner.length ? owner : admin;   // Owner vor Admin

  if (kandidaten.length === 1) { waehleStammbaum(kandidaten[0]); return; }
  if (verantwortlich.length > 1) { zeigeStandardWahl(verantwortlich); return; }

  // Keine (eindeutige) Owner/Admin-Verantwortung -> zuletzt geöffneter / größter Baum
  let standard = null;
  try { const s = localStorage.getItem('vidovic_tree'); if (stammbaeumeListe[s]) standard = s; } catch (e) {}
  if (!standard) standard = groessterStammbaum();
  if (standard) waehleStammbaum(standard);
  else { aktualisiereStats(); zeichneBaumNeu(); }
}

// Willkommen-Overlay: einmalige Wahl des Standard-Stammbaums (mehrere Verantwortlichkeiten)

  waehleStammbaum(ids[0]);   // im Hintergrund schon etwas anzeigen, während der Nutzer wählt
  const sel = document.getElementById('sw-baum');
  if (!sel) return;
  const groessen = stammbaumGroessen();
  sel.innerHTML = ids.map(id =>
    `<option value="${escapeHtml(id)}">${escapeHtml(nm(stammbaeumeListe[id] || '?'))} (${groessen[id] || 0})</option>`).join('');
  sel.value = ids[0];
  document.getElementById('standard-wahl-modal').classList.add('aktiv');
  macheAlleSelectsSuchbar(document.getElementById('standard-wahl-modal'));
}
function schliesseStandardWahl() { document.getElementById('standard-wahl-modal').classList.remove('aktiv'); }
function speichereStandardWahl() {
  const id = document.getElementById('sw-baum').value;

// Personenzahl je Stammbaum
function stammbaumGroessen() {
  const z = {};
  Object.values(aktuelleDaten.persons).forEach(p => { if (p._tree) z[p._tree] = (z[p._tree] || 0) + 1; });
  return z;
}

function groessterStammbaum() {
  const z = stammbaumGroessen();
  let best = null, max = -1;
  Object.entries(z).forEach(([id, n]) => { if (n > max) { max = n; best = id; } });
  return best;
}

// Auswahl-Dropdown mit allen Bäumen (die Personen haben), nach Größe sortiert
function befuelleStammbaumAuswahl() {
  const sel = document.getElementById('tree-select');

  const z = stammbaumGroessen();
  const ids = Object.keys(stammbaeumeListe)
    .filter(id => z[id])
    .sort((a, b) => (z[b] || 0) - (z[a] || 0) || (stammbaeumeListe[a] || '').localeCompare(stammbaeumeListe[b] || ''));
  sel.innerHTML = ids.map(id =>
    `<option value="${id}">${escapeHtml(nm(stammbaeumeListe[id]))} (${z[id]})</option>`
  ).join('');
  sel.style.display = ids.length ? '' : 'none';
}

// Wurzel eines Baums: Person ohne Eltern im selben Baum mit den meisten Nachkommen
function findeStammbaumWurzel(treeId) {
  const imBaum = id => { const p = aktuelleDaten.persons[id]; return p && p._tree === treeId; };
  const personen = Object.values(aktuelleDaten.persons).filter(p => p._tree === treeId);
  if (!personen.length) return null;
  const hatElternImBaum = p => (p.families_child || []).some(fid => {
    const fam = aktuelleDaten.families[fid]; if (!fam) return false;
    return (fam.husband && imBaum(fam.husband)) || (fam.wife && imBaum(fam.wife));
  });
  const kandidaten = personen.filter(p => !hatElternImBaum(p));
  const liste = kandidaten.length ? kandidaten : personen;
  function nachkommen(id, seen) {
    seen = seen || new Set(); if (seen.has(id)) return 0; seen.add(id);
    const p = aktuelleDaten.persons[id]; if (!p) return 0;
    let n = 0;
    (p.families_spouse || []).forEach(fid => {
      const fam = aktuelleDaten.families[fid]; if (!fam) return;
      (fam.children || []).forEach(cid => { if (imBaum(cid)) n += 1 + nachkommen(cid, seen); });
    });
    return n;
  }
  let best = liste[0], max = -1;
  liste.forEach(p => { const n = nachkommen(p.id); if (n > max) { max = n; best = p; } });
  return best.id;
}

// ============================================================
// INITIALISIERUNG
// ============================================================
// ============================================================
// SUCHBARE DROPDOWNS — wiederverwendbar für ALLE <select>
// Reichert jedes <select> mit Suchfeld (Teilstring, ab 2 Zeichen,
// case-insensitive, Echtzeit) an. Das native <select> bleibt die
// Wahrheit: value/onchange/IDs funktionieren unverändert weiter.
// Ein einziges, geteiltes Panel (kein Leak bei dynamischen Listen).
// ============================================================
let ssPanel, ssSearch, ssList, ssAktivSelect = null, ssRaf = null;

function ssInitPanel() {
  if (ssPanel) return;
  ssPanel = document.createElement('div');
  ssPanel.className = 'ss-panel';
  ssPanel.style.display = 'none';
  ssPanel.innerHTML = '<input type="text" class="ss-search" autocomplete="off"><ul class="ss-list"></ul>';
  document.body.appendChild(ssPanel);
  ssSearch = ssPanel.querySelector('.ss-search');
  ssList   = ssPanel.querySelector('.ss-list');
  ssSearch.addEventListener('input', () => ssRender(ssSearch.value));
  ssSearch.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') ssSchliesse();
    else if (e.key === 'Enter') { e.preventDefault(); const f = ssList.querySelector('.ss-opt'); if (f) ssWaehle(f.dataset.val); }
  });
  // Touch-sichere Auswahl: Tap selektiert, Scrollen nicht (siehe tippAuswahl).
  tippAuswahl(ssList, '.ss-opt', li => ssWaehle(li.dataset.val));
}

// Such-Normalisierung: Kyrillisch -> Latein, klein, UND diakritik-insensitiv
// (ć č š ž đ -> c c s z d) — analog zum Backend merge_norm. So findet die Eingabe
// "Knezevic" auch das Label "Knežević" (und kyrillisch "Кнежевић").
function ssFold(s) {
  return srCyr2Lat(String(s || '')).toLowerCase()
    .replace(/[čć]/g, 'c').replace(/š/g, 's').replace(/ž/g, 'z').replace(/đ/g, 'd');
}

// Liste füllen: <2 Zeichen = alle; sonst Teilstring (case-, schrift- UND
// diakritik-insensitiv über ssFold, damit z. B. "Knezevic" -> "Knežević" matcht).
function ssRender(filter) {
  if (!ssAktivSelect) return;
  const f = ssFold((filter || '').trim());
  const opts = Array.from(ssAktivSelect.options);
  const vis = f.length < 2 ? opts : opts.filter(o => ssFold(o.textContent || '').includes(f));
  if (vis.length === 0) {
    ssList.innerHTML = '<li class="ss-empty">' + escapeHtml(t('ss_keine')) + '</li>';
    return;
  }
  ssList.innerHTML = vis.map(o =>
    '<li class="ss-opt' + (o.value === ssAktivSelect.value ? ' ss-selected' : '') +
    '" data-val="' + escapeHtml(o.value) + '">' + escapeHtml(o.textContent) + '</li>'
  ).join('');
}

function ssPositioniere(select) {
  const r  = select._ssControl.getBoundingClientRect();
  const ph = ssPanel.offsetHeight;
  const platzUnten = window.innerHeight - r.bottom;
  const obenAuf = platzUnten < ph + 8 && r.top > platzUnten;   // nach oben klappen, wenn unten kein Platz
  ssPanel.style.left  = r.left + 'px';
  ssPanel.style.width = r.width + 'px';
  ssPanel.style.top   = (obenAuf ? Math.max(4, r.top - ph - 2) : r.bottom + 2) + 'px';
}

function ssOeffne(select) {
  ssSchliesse();
  ssAktivSelect = select;
  ssSearch.value = '';
  ssSearch.placeholder = t('ss_suche');
  ssRender('');
  ssPanel.style.visibility = 'hidden';   // erst messen, dann sichtbar -> kein Flackern
  ssPanel.style.display = 'flex';
  ssPositioniere(select);
  ssPanel.style.visibility = '';
  select._ssControl.classList.add('ss-open');
  // Auto-Fokus (Tastatur) nur auf Desktop; auf Touch würde die Tastatur die Liste
  // verdecken + Reflows auslösen — der Nutzer tippt das Suchfeld bei Bedarf selbst an.
  const grob = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (!grob) setTimeout(() => ssSearch.focus(), 30);
  ssRaf = requestAnimationFrame(ssSichtbarkeitsWaechter);   // schließt Panel, wenn Overlay/Menü zugeht
}

// Solange das Panel offen ist: wird das Steuerelement ausgeblendet (Overlay/Menü
// geschlossen — egal wie: ×, Backdrop, Escape, programmatisch), Panel mitschließen.
// offsetParent === null => Element oder ein Vorfahre ist display:none.
function ssSichtbarkeitsWaechter() {
  if (!ssAktivSelect) return;
  const c = ssAktivSelect._ssControl;
  if (!c || c.offsetParent === null) { ssSchliesse(); return; }
  ssRaf = requestAnimationFrame(ssSichtbarkeitsWaechter);
}

function ssSchliesse() {
  if (!ssAktivSelect) return;
  if (ssRaf) { cancelAnimationFrame(ssRaf); ssRaf = null; }
  ssPanel.style.display = 'none';
  if (ssAktivSelect._ssControl) ssAktivSelect._ssControl.classList.remove('ss-open');
  ssAktivSelect = null;
}

function ssWaehle(val) {
  const s = ssAktivSelect;
  if (!s) return;
  s.value = val;                                   // intercepted -> Label-Sync
  ssSchliesse();
  s.dispatchEvent(new Event('change', { bubbles: true }));   // bestehende onchange-Handler auslösen
}

function ssSyncLabel(select) {
  if (!select._ssControl) return;
  const o = select.options[select.selectedIndex];
  select._ssControl.querySelector('.ss-control-text').textContent = o ? o.textContent : '';
}

function macheSelectSuchbar(select) {
  if (select._ssControl || select.classList.contains('no-search')) return;
  // Steuerelement, das das native <select> ersetzt (kopiert dessen Klassen -> gleiches Aussehen)
  const control = document.createElement('div');
  control.className = (select.className ? select.className + ' ' : '') + 'ss-control';
  control.tabIndex = 0;
  control.setAttribute('role', 'button');
  control.innerHTML = '<span class="ss-control-text"></span><span class="ss-caret">▾</span>';
  select.parentNode.insertBefore(control, select.nextSibling);
  select.classList.add('ss-native');
  select._ssControl = control;

  // value-Interception: Label bleibt auch bei programmatischer Wertänderung synchron
  const desc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  Object.defineProperty(select, 'value', {
    configurable: true,
    get() { return desc.get.call(this); },
    set(v) { desc.set.call(this, v); ssSyncLabel(this); }
  });

  const toggle = (e) => {
    e.preventDefault(); e.stopPropagation();
    if (select.disabled) return;
    if (ssAktivSelect === select) ssSchliesse(); else ssOeffne(select);
  };
  control.addEventListener('click', toggle);
  control.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') toggle(e); });

  // Native Sichtbarkeit/disabled auf das Steuerelement spiegeln
  const spiegele = () => {
    control.style.display = (select.style.display === 'none') ? 'none' : '';
    control.classList.toggle('ss-disabled', select.disabled);
  };
  spiegele();

  // Reagiere auf: dynamische Optionen, style/disabled-Änderungen
  new MutationObserver(() => {
    ssSyncLabel(select);
    spiegele();
    if (ssAktivSelect === select) ssRender(ssSearch.value);
  }).observe(select, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'disabled'] });

  ssSyncLabel(select);
}

function macheAlleSelectsSuchbar(root) {
  (root || document).querySelectorAll('select:not(.ss-native):not(.no-search)').forEach(macheSelectSuchbar);
}

// Touch-sichere Auswahl in (scrollbaren) Listen: selektiert NUR bei einem echten
// Tap (kaum Bewegung), nicht beim Scroll-Wischen; feuert auf pointerup, also VOR
// dem verzögerten Ghost-Click und vor Tastatur-Reflow. Funktioniert auch mit Maus.
function tippAuswahl(container, selector, handler) {
  let sx = 0, sy = 0, item = null, moved = false;
  container.addEventListener('pointerdown', (e) => {
    item = e.target.closest(selector); sx = e.clientX; sy = e.clientY; moved = false;
  });
  container.addEventListener('pointermove', (e) => {
    if (item && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) moved = true;
  });
  container.addEventListener('pointerup', (e) => {
    const ziel = e.target.closest(selector);
    if (item && ziel === item && !moved) { e.preventDefault(); handler(item); }
    item = null;
  });
  container.addEventListener('pointercancel', () => { item = null; });   // Scroll-Übernahme -> kein Select
}

function initSuchbareSelects() {
  ssInitPanel();
  macheAlleSelectsSuchbar(document);
  // Schließen bei Tipp/Klick außerhalb. WICHTIG: pointerdown statt click — feuert
  // sofort am echten Punkt, vor Tastatur-Reflow/Scroll/Ghost-Click (Android-Bug).
  document.addEventListener('pointerdown', (e) => {
    if (ssAktivSelect && !ssPanel.contains(e.target) &&
        e.target !== ssAktivSelect._ssControl && !ssAktivSelect._ssControl.contains(e.target)) ssSchliesse();
  });
  // Resize/Scroll NICHT schließen (mobile Tastatur löst Resize aus!) -> nur neu positionieren,
  // damit das Panel am Steuerelement „klebt".
  window.addEventListener('resize', () => { if (ssAktivSelect) ssPositioniere(ssAktivSelect); });
  window.addEventListener('scroll', (e) => { if (ssAktivSelect && !ssPanel.contains(e.target)) ssPositioniere(ssAktivSelect); }, true);
}

// ============================================================
// DATUMSFELDER — einheitlicher Vanilla-Kalender (Date Picker)
// Eingabe per Kalender ODER manuell. Speicherung kanonisch als ISO
// (YYYY-MM-DD) in stammbaum_daten (date-Spalte bleibt NULL). Anzeige
// sprachabhängig: Eingabe-Kurzformat + benutzerfreundliches Langformat.
// Nicht-parsebare Altwerte (Jahr, "um 1850", Bereiche) bleiben Freitext.
// ============================================================
const KALENDER = {
  de: { monate: ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],
        wochentage: ['Mo','Di','Mi','Do','Fr','Sa','So'], wochenStart: 1, heute: 'Heute', loeschen: 'Löschen' },
  sr: { monate: ['јануар','фебруар','март','април','мај','јун','јул','август','септембар','октобар','новембар','децембар'],
        wochentage: ['Пон','Уто','Сре','Чет','Пет','Суб','Нед'], wochenStart: 1, heute: 'Данас', loeschen: 'Обриши' },
  hr: { monate: ['siječanj','veljača','ožujak','travanj','svibanj','lipanj','srpanj','kolovoz','rujan','listopad','studeni','prosinac'],
        wochentage: ['Pon','Uto','Sri','Čet','Pet','Sub','Ned'], wochenStart: 1, heute: 'Danas', loeschen: 'Obriši' },
  ba: { monate: ['januar','februar','mart','april','maj','juni','juli','august','septembar','oktobar','novembar','decembar'],
        wochentage: ['Pon','Uto','Sri','Čet','Pet','Sub','Ned'], wochenStart: 1, heute: 'Danas', loeschen: 'Obriši' },
  en: { monate: ['January','February','March','April','May','June','July','August','September','October','November','December'],
        wochentage: ['Su','Mo','Tu','We','Th','Fr','Sa'], wochenStart: 0, heute: 'Today', loeschen: 'Clear' }
};
const DATUM_PH = { de: 'TT.MM.JJJJ', sr: 'DD.MM.GGGG', hr: 'DD.MM.GGGG', ba: 'DD.MM.GGGG', en: 'MM/DD/YYYY' };

function dpZahl(n) { return String(n).padStart(2, '0'); }
function isoVon(j, m, t) { return j + '-' + dpZahl(m) + '-' + dpZahl(t); }
function istIsoDatum(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); }
function dpGueltig(j, m, t) {
  if (m < 1 || m > 12 || t < 1 || t > 31) return null;
  const d = new Date(j, m - 1, t);
  if (d.getFullYear() !== j || d.getMonth() !== m - 1 || d.getDate() !== t) return null;  // 31.02. etc. abfangen
  return isoVon(j, m, t);
}
// Beliebigen Text -> ISO 'YYYY-MM-DD' oder null (= Freitext/ungefähr, bleibt erhalten)
function parseDatumZuIso(text) {
  const s = (text || '').trim(); if (!s) return null; let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))  return dpGueltig(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/))) return dpGueltig(+m[3], +m[2], +m[1]);  // TT.MM.JJJJ
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return dpGueltig(+m[3], +m[1], +m[2]);  // MM/DD/YYYY
  return null;
}
function isoZuKurz(iso, lang) {
  const m = (iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return iso || '';
  return (lang === 'en') ? (m[2] + '/' + m[3] + '/' + m[1]) : (m[3] + '.' + m[2] + '.' + m[1]);
}
function isoZuLang(iso, lang) {
  const m = (iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return iso || '';
  const kal = KALENDER[lang] || KALENDER.de;
  const tag = +m[3], monat = kal.monate[+m[2] - 1], jahr = m[1];
  return (lang === 'en') ? (monat + ' ' + tag + ', ' + jahr) : (tag + '. ' + monat + ' ' + jahr);
}
// Gespeicherten Wert benutzerfreundlich anzeigen (parsebar -> Langformat; sonst verbatim)
function formatDatumLang(value) {
  const iso = istIsoDatum(value) ? value : parseDatumZuIso(value);
  return iso ? isoZuLang(iso, aktuelleSprache) : (value || '');
}
// Kanonischer Speicherwert eines Feldes: ISO falls parsebar, sonst Freitext
function datumWert(input) {
  if (!input) return '';
  const iso = parseDatumZuIso(input.value);
  return iso || input.value.trim();
}
// Feld setzen (ISO oder Freitext) -> Kurzformat anzeigen + iso merken
function datumSetzen(input, value) {
  if (!input) return;
  if (!value) { input.value = ''; delete input.dataset.iso; return; }
  const iso = istIsoDatum(value) ? value : parseDatumZuIso(value);
  if (iso) { input.dataset.iso = iso; input.value = isoZuKurz(iso, aktuelleSprache); }
  else     { delete input.dataset.iso; input.value = value; }
}

let dpPanel, dpAktivInput = null, dpJahr, dpMonat, dpRaf = null;

function dpInitPanel() {
  if (dpPanel) return;
  dpPanel = document.createElement('div');
  dpPanel.className = 'dp-panel'; dpPanel.style.display = 'none';
  dpPanel.innerHTML =
    '<div class="dp-head">' +
      '<button type="button" class="dp-nav" data-step="-12">«</button>' +
      '<button type="button" class="dp-nav" data-step="-1">‹</button>' +
      '<span class="dp-title"></span>' +
      '<button type="button" class="dp-nav" data-step="1">›</button>' +
      '<button type="button" class="dp-nav" data-step="12">»</button>' +
    '</div>' +
    '<div class="dp-weekdays"></div><div class="dp-grid"></div>' +
    '<div class="dp-foot"><button type="button" class="dp-today"></button><button type="button" class="dp-clear"></button></div>';
  document.body.appendChild(dpPanel);
  dpPanel.querySelectorAll('.dp-nav').forEach(b =>
    b.addEventListener('click', e => { e.preventDefault(); dpVerschiebe(+b.dataset.step); }));
  dpPanel.querySelector('.dp-grid').addEventListener('click', e => {
    const d = e.target.closest('.dp-day[data-iso]'); if (d) dpWaehle(d.dataset.iso);
  });
  dpPanel.querySelector('.dp-today').addEventListener('click', e => {
    e.preventDefault(); const n = new Date(); dpWaehle(isoVon(n.getFullYear(), n.getMonth() + 1, n.getDate()));
  });
  dpPanel.querySelector('.dp-clear').addEventListener('click', e => {
    e.preventDefault();
    if (dpAktivInput) { const i = dpAktivInput; datumSetzen(i, ''); dpSchliesse(); i.dispatchEvent(new Event('input', { bubbles: true })); }
  });
}

function dpVerschiebe(monate) {
  let m = dpMonat + monate;
  dpJahr += Math.floor(m / 12);
  dpMonat = ((m % 12) + 12) % 12;
  dpRender();
}

function dpRender() {
  if (!dpPanel) return;
  const kal = KALENDER[aktuelleSprache] || KALENDER.de;
  dpPanel.querySelector('.dp-title').textContent = kal.monate[dpMonat] + ' ' + dpJahr;
  dpPanel.querySelector('.dp-weekdays').innerHTML = kal.wochentage.map(d => '<span>' + escapeHtml(d) + '</span>').join('');
  dpPanel.querySelector('.dp-today').textContent = kal.heute;
  dpPanel.querySelector('.dp-clear').textContent = kal.loeschen;
  const start = kal.wochenStart;                                       // 1=Mo, 0=So
  let offset = (new Date(dpJahr, dpMonat, 1).getDay() - start + 7) % 7;
  const tage = new Date(dpJahr, dpMonat + 1, 0).getDate();
  const n = new Date(); const heuteIso = isoVon(n.getFullYear(), n.getMonth() + 1, n.getDate());
  const selIso = dpAktivInput && dpAktivInput.dataset.iso;
  let html = '';
  for (let i = 0; i < offset; i++) html += '<button type="button" class="dp-day dp-leer" disabled></button>';
  for (let d = 1; d <= tage; d++) {
    const iso = isoVon(dpJahr, dpMonat + 1, d);
    const cls = 'dp-day' + (iso === heuteIso ? ' dp-heute' : '') + (iso === selIso ? ' dp-sel' : '');
    html += '<button type="button" class="' + cls + '" data-iso="' + iso + '">' + d + '</button>';
  }
  dpPanel.querySelector('.dp-grid').innerHTML = html;
}

function dpPositioniere(ref) {
  const r = ref.getBoundingClientRect();
  const ph = dpPanel.offsetHeight, pw = dpPanel.offsetWidth;
  const platzUnten = window.innerHeight - r.bottom;
  const obenAuf = platzUnten < ph + 8 && r.top > platzUnten;
  let left = r.left;
  if (left + pw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - pw - 8);
  dpPanel.style.left = left + 'px';
  dpPanel.style.top  = (obenAuf ? Math.max(4, r.top - ph - 2) : r.bottom + 2) + 'px';
}

function dpOeffne(input) {
  dpInitPanel();
  dpSchliesse();
  dpAktivInput = input;
  const iso = input.dataset.iso || parseDatumZuIso(input.value);
  const base = iso ? new Date(iso + 'T00:00:00') : new Date();
  dpJahr = base.getFullYear(); dpMonat = base.getMonth();
  dpRender();
  dpPanel.style.visibility = 'hidden'; dpPanel.style.display = 'block';
  dpPositioniere(input._dpWrap || input);
  dpPanel.style.visibility = '';
  dpRaf = requestAnimationFrame(dpSichtbarkeitsWaechter);
}

// Schließt das Panel, sobald das Feld ausgeblendet wird (Overlay/Menü zu) — wie ss.
function dpSichtbarkeitsWaechter() {
  if (!dpAktivInput) return;
  const ref = dpAktivInput._dpWrap || dpAktivInput;
  if (!ref || ref.offsetParent === null) { dpSchliesse(); return; }
  dpRaf = requestAnimationFrame(dpSichtbarkeitsWaechter);
}

function dpSchliesse() {
  if (!dpAktivInput) return;
  if (dpRaf) { cancelAnimationFrame(dpRaf); dpRaf = null; }
  if (dpPanel) dpPanel.style.display = 'none';
  dpAktivInput = null;
}

function dpWaehle(iso) {
  const inp = dpAktivInput; if (!inp) return;
  datumSetzen(inp, iso);
  dpSchliesse();
  inp.dispatchEvent(new Event('input', { bubbles: true }));
  inp.dispatchEvent(new Event('change', { bubbles: true }));
}

function macheDatumsfeld(input) {
  if (input._dpReady) return;
  input._dpReady = true;
  input.setAttribute('autocomplete', 'off');
  const wrap = document.createElement('span'); wrap.className = 'dp-wrap';
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'dp-btn'; btn.setAttribute('aria-label', 'Kalender'); btn.textContent = '📅';
  wrap.appendChild(btn);
  input._dpWrap = wrap;
  input.placeholder = DATUM_PH[aktuelleSprache] || DATUM_PH.de;
  if (input.value) datumSetzen(input, input.value);   // evtl. vorbefüllten Wert normalisieren
  btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); (dpAktivInput === input) ? dpSchliesse() : dpOeffne(input); });

}

// ============================================================
// SESSION- & VERSIONS-MANAGEMENT
// - Auto-Logout nach 30 Min Inaktivität (mit Warnung 1 Min vorher)
// - Nach Auto-Logout + erneutem Login: harter Reload -> neueste Version
// - Versionsprüfung erkennt neue Deployments -> Update-Banner
// - Harter Reload via Cache-Busting (?v=timestamp): Single-File auf GitHub Pages
//   hat keine separat gehashten Assets; der Query-Param umgeht den HTML-Cache.
// ============================================================
const APP_VERSION = (document.querySelector('meta[name="app-version"]') || {}).content || '';

function hardReload() {
  const basis = location.href.replace(/[?#].*$/, '');   // bestehende Query/Hash entfernen
  location.replace(basis + '?v=' + Date.now());          // frischer Param -> umgeht HTML-Cache
}

// ---- Inaktivitäts-Überwachung ----
const SESSION_INAKTIV_MS = 30 * 60 * 1000;
const SESSION_WARN_MS    = 60 * 1000;            // 1 Minute vor Logout warnen
let sessIdleTimer = null, sessWarnTimer = null, sessLetzteAktivitaet = 0;

function resetInaktivTimer() {
  clearTimeout(sessIdleTimer); clearTimeout(sessWarnTimer);
  versteckeSessionWarnung();
  if (!aktuellerUser) return;                    // nur für eingeloggte Nutzer
  sessWarnTimer = setTimeout(zeigeSessionWarnung, SESSION_INAKTIV_MS - SESSION_WARN_MS);
  sessIdleTimer = setTimeout(sessionAutoLogout, SESSION_INAKTIV_MS);
}
function sessAktivitaet() {
  if (!aktuellerUser) return;
  const now = Date.now();
  if (now - sessLetzteAktivitaet < 2000) return;  // throttle (mousemove/scroll feuern oft)
  sessLetzteAktivitaet = now;
  resetInaktivTimer();
}
function zeigeSessionWarnung() {
  if (aktuellerUser) document.getElementById('session-warn-modal').classList.add('aktiv');
}
function versteckeSessionWarnung() {
  const m = document.getElementById('session-warn-modal');
  if (m) m.classList.remove('aktiv');
}
function sessionVerlaengern() { versteckeSessionWarnung(); resetInaktivTimer(); }
async function sessionAutoLogout() {
  versteckeSessionWarnung();
  clearTimeout(sessIdleTimer); clearTimeout(sessWarnTimer);
  sessionStorage.setItem('reloadNachLogin', '1');   // nächster Login -> harter Reload (neueste Version)
  try { await sbClient.auth.signOut(); } catch (e) {}   // -> onAuthStateChange -> loescheUser
  zeigeHinweis(t('session_abgemeldet'));
}
function initSessionUeberwachung() {
  ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(ev =>
    document.addEventListener(ev, sessAktivitaet, { passive: true, capture: true }));
  // Bei Rückkehr in den Tab: Hintergrund-Tabs drosseln Timer -> reale verstrichene
  // Zeit prüfen und ggf. sofort abmelden (statt auf den evtl. „eingefrorenen" Timer zu warten).
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !aktuellerUser) return;
    if (sessLetzteAktivitaet && Date.now() - sessLetzteAktivitaet >= SESSION_INAKTIV_MS) sessionAutoLogout();
    else sessAktivitaet();
  });
}

// ---- Versionsprüfung (neues Deployment erkennen) ----
let updateGemeldet = false, letzteVersionsPruefung = 0;
async function pruefeNeueVersion() {
  if (updateGemeldet) return;
  const now = Date.now();
  if (now - letzteVersionsPruefung < 5 * 60 * 1000) return;   // höchstens alle 5 Min
  letzteVersionsPruefung = now;
  try {
    // Range: nur die ersten KB (app-version-Meta steht oben im <head>); no-store = nie aus Cache.
    const res = await fetch(location.pathname + '?vc=' + now, { cache: 'no-store', headers: { 'Range': 'bytes=0-4095' } });
    if (!res.ok && res.status !== 206) return;
    const text = await res.text();
    const m = text.match(/<meta name="app-version" content="([^"]+)">/);
    const serverVersion = m ? m[1] : '';
    if (serverVersion && APP_VERSION && serverVersion !== APP_VERSION) {
      updateGemeldet = true;
      const b = document.getElementById('update-banner');
      if (b) b.style.display = 'flex';
    }
  } catch (e) { /* offline / Fehler -> ignorieren */ }
}
function initVersionsPruefung() {
  setTimeout(pruefeNeueVersion, 60 * 1000);            // ~1 Min nach Start
  setInterval(pruefeNeueVersion, 20 * 60 * 1000);      // alle 20 Min
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pruefeNeueVersion(); });
}

function init() {
  initSprachDropdown();

  initSessionUeberwachung();   // Aktivitäts-Tracking (Auto-Logout bei Inaktivität)
  initVersionsPruefung();      // neue Deployments erkennen -> Update-Banner
  macheAlleDatumsfelder(document);   // alle Datumsfelder mit Kalender ausstatten
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => wechselAnsicht(t.dataset.ansicht));
  });
  document.getElementById('suche').addEventListener('input', handleSucheDebounce);
  // Enter / mobile Such-Taste: erst hier (explizite Bestätigung) darf bei mehreren
  // Treffern in der Baum-Ansicht der Auswahl-Dialog öffnen. Blur schließt die
  // Tastatur, damit das gerade geöffnete Modal nicht verdeckt wird.
  document.getElementById('suche').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const wert = document.getElementById('suche').value.trim();
    if (wert && aktuelleAnsicht === 'baum') { e.target.blur(); suchImBaum(wert, true); }
  });
  document.getElementById('gedcom-input').addEventListener('change', handleGedcomUpload);
  // Tipp/Klick außerhalb schließt offene Dropdowns. pointerdown (nicht click!) feuert
  // sofort am echten Punkt — vor Tastatur-Reflow/Scroll/Ghost-Click auf Android/iOS.
  document.addEventListener('pointerdown', (e) => {
    const menu = document.getElementById('nav-menu');
    if (menu && !menu.contains(e.target)) menu.classList.remove('offen');
    // Kalender schließen bei Tipp außerhalb von Panel und aktivem Datumsfeld
    if (dpAktivInput && dpPanel && !dpPanel.contains(e.target) &&
        !(dpAktivInput._dpWrap && dpAktivInput._dpWrap.contains(e.target))) dpSchliesse();
  });
  // Resize/Scroll NICHT schließen (mobile Tastatur = Resize) -> Kalender neu positionieren
  window.addEventListener('resize', () => { if (dpAktivInput) dpPositioniere(dpAktivInput._dpWrap || dpAktivInput); });
  window.addEventListener('scroll', (e) => { if (dpAktivInput && !dpPanel.contains(e.target)) dpPositioniere(dpAktivInput._dpWrap || dpAktivInput); }, true);
  // Tab wird wieder sichtbar -> Obavještenja sofort aktualisieren (nicht erst beim nächsten Poll-Tick)
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') obavLivePoll(); });
  // Tab wieder sichtbar -> während verstecktem Tab eingetroffene Live-Sync-Änderungen nachholen
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && realtimePendingReload) realtimeReloadAnstossen();
  });
  // Tab wieder sichtbar -> während verstecktem Tab eingetroffene Benachrichtigungen nachholen
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && benachrPending) { benachrPending = false; ladeBenachrichtigungen(); }
  });
  // Live-Indikator-Panel schließen bei Tipp außerhalb (pointerdown = touch-sicher, kein Ghost-Click)
  document.addEventListener('pointerdown', (e) => {
    const box = document.getElementById('presence-indikator');
    if (box && box.classList.contains('offen') && !box.contains(e.target)) box.classList.remove('offen');
  });

  // Deep-Link aus der Benachrichtigungs-Mail: ?obav=1 merkt vor, dass nach dem
  // Login die Obavještenja-Liste geöffnet werden soll. Param sofort aus der URL
  // entfernen, damit ein späterer Reload die Liste nicht erneut aufpoppt.
  try {
    const params = new URLSearchParams(location.search);
    if (params.get('obav') === '1') {
      deepLinkObav = true;
      params.delete('obav');
    }
    // Deep-Link aus der Event-Einladungs-Mail: ?event=<id> -> nach Login Event öffnen.
    if (params.get('event')) {
      deepLinkEvent = params.get('event');
      params.delete('event');
    }
    if (params.toString() !== new URLSearchParams(location.search).toString()) {
      const q = params.toString();
      history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
    }
  } catch (e) { /* URL nicht parsebar -> ignorieren */ }

  initBaum();
  bindeEmailLiveCheck(document);   // globale E-Mail-Live-Validierung (alle E-Mail-Felder)
  wechselSprache(aktuelleSprache, false);   // nur anwenden, NICHT speichern (sonst Willkommen-Overlay nur einmal)
  wechselAnsicht('baum');
  ladeAuth();
  pruefePasswortSetzen();
  aktualisiereInhaltSichtbarkeit();   // Standard: ohne Login kein Baum, nur Hinweis
  // Erstaufruf ohne gespeicherte Sprache: Willkommens-Overlay zur expliziten Sprachwahl.
  if (!spracheWarGespeichert) zeigeWillkommenSprache();
}

//                     bei mehreren Treffern darf das Auswahl-Modal öffnen.

//                     öffnen (es würde sonst das Suchfeld verdecken, sodass der Nutzer
//                     seine Eingabe nicht mehr sieht — siehe Mobile-Bug). Stattdessen
//                     nur ein dezenter Treffer-Hinweis in der Baum-Info.
function suchImBaum(suche, interaktiv) {
  if (!suche) {
    fokusPersonId = null;
    zeichneBaum(aktuelleWurzel(), 12, 0);
    return;
  }

  const treffer = Object.values(aktuelleDaten.persons).filter(p =>
    p.name.toLowerCase().includes(suche.toLowerCase())
  );

  if (treffer.length === 0) {
    document.getElementById('baum-info').innerHTML =
      `<strong style="color:var(--akzent-hell)">${t('keine_treffer')}</strong>`;
    return;
  }

  if (treffer.length === 1) {
    zentriereAufPerson(treffer[0].id);
    return;
  }

  if (interaktiv) {
    zeigAuswahlDialog(treffer);
  } else {
    // Mehrere Treffer beim Tippen: Feld bleibt sichtbar, Hinweis statt Modal.
    document.getElementById('baum-info').innerHTML =
      `<strong style="color:var(--akzent-hell)">${escapeHtml(t('suche_mehrere', { n: treffer.length }))}</strong>`;
  }
}
