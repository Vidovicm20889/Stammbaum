async function zeigeEventEditor(eventId) {
  if (!istAdmin()) return;   // nur super_admin / familien_admin
  const event = getEventConfig(eventId);
  if (!event) return;
  const media = await renderEventMedia(eventId);

  document.getElementById('modal-text').innerHTML = `
    <h2>${escapeHtml(nm(event.title))}</h2>
    <div class="event-editor">
      <label>${t('shorts_titel')}<br>
        <input type="text" id="event-subtitle-input" value="${escapeHtml(nm(event.subtitle))}">
      </label>
      <label>${t('event_organizer')}<br>
        <input type="text" id="event-organizers-input" value="${escapeHtml(nm(event.organizers))}">
      </label>
      <div class="event-upload-row">
        <label>${t('event_upload_images')}<br><input type="file" id="event-image-input" accept="image/*" multiple></label>
        <label>${t('event_upload_videos')}<br><input type="file" id="event-video-input" accept="video/*" multiple></label>
      </div>
      <div class="event-media-list">${media.length ? buildEventMediaHtml(media, eventId, true) : `<div class="event-media-empty">${t('event_no_media')}</div>`}</div>
      <div class="event-editor-actions">
        <button class="baum-zeigen" id="event-save-btn">${t('event_save')}</button>
        <button class="zurueck-btn" onclick="zeigeShort('${eventId}')">${t('event_cancel')}</button>
      </div>
      <div class="event-status" id="event-status"></div>
    </div>
  `;
  document.getElementById('modal').classList.add('aktiv');

  document.getElementById('event-save-btn').addEventListener('click', async () => {
    const imageFiles = document.getElementById('event-image-input').files;
    const videoFiles = document.getElementById('event-video-input').files;
    const status = document.getElementById('event-status');
    const button = document.getElementById('event-save-btn');
    button.disabled = true;
    status.textContent = t('event_uploading');

    const uploads = [...imageFiles, ...videoFiles];
    for (const file of uploads) {
      // Datei landet direkt im geteilten Storage – keine lokale Liste mehr nötig
      const result = await uploadEventMedia(eventId, file);
      if (result?.error) {
        status.textContent = `${t('event_uploading')} ${result.error}`;
        button.disabled = false;
        return;
      }
    }

    // Text-Änderungen (Datum/Untertitel + Organisatoren) ebenfalls speichern –
    // sonst gingen sie beim automatischen Schließen verloren.
    wertSpeichern(eventId, {
      subtitle:   document.getElementById('event-subtitle-input').value,
      organizers: document.getElementById('event-organizers-input').value
    });

    status.textContent = t('event_saved');
    button.disabled = false;
    // Kurze Bestätigung zeigen, dann Overlay automatisch schließen
    setTimeout(() => schliesseModal(), 1000);
  });
}

function buildEventMediaHtml(media, eventId = null, showDelete = false, clickable = true) {
  // Ab mehr als 2 Dateien wird der Container scrollbar (siehe CSS)
  const scrollClass = media.length > 2 ? ' event-media-folder--scroll' : '';
  return `<div class="event-media-folder${scrollClass}">${media.map((m, idx) => {
    const istPdf = m.type === 'application/pdf' || /pdf/i.test(m.type);
    const thumb = m.type.startsWith('image/')
      ? `<img class="event-media-thumb" src="${m.url}" alt="${escapeHtml(m.name)}" />`
      : istPdf ? `<div class="event-media-thumb video-thumb">📄</div>`
      : `<div class="event-media-thumb video-thumb">🎥</div>`;
    const deleteBtn = showDelete && eventId ? `<button class="media-delete-btn" onclick="deleteEventMedia('${eventId}', ${idx})" title="${t('delete')}">×</button>` : '';
    // clickable=false (z.B. in der Edit-Maske über z-index:200) -> keine Slideshow, die sonst dahinter läge
    const istKlick = eventId && clickable;
    const klick = istKlick ? `zeigeMediaSlideshow('${eventId}', ${idx})` : 'return false;';
    return `<div class="event-media-item">${deleteBtn}<a href="javascript:void(0)" onclick="${klick}" style="cursor: ${istKlick ? 'pointer' : 'default'};">${thumb}<div class="event-media-info">${escapeHtml(m.name)}</div></a></div>`;
  }).join('')}</div>`;
}

async function deleteEventMedia(eventId, mediaIndex) {
  const eintrag = (letzteMedienListe[eventId] || [])[mediaIndex];
  if (!eintrag) return;

  const bestaetigt = await zeigeBestaetigung(t('confirm_delete'));
  if (!bestaetigt) return;

  // Datei SOFORT aus dem geteilten Storage löschen – damit für alle User wirksam
  const { error } = await sbClient.storage.from(EVENTS_BUCKET).remove([eintrag.path]);
  if (error) {
    console.error('Löschen fehlgeschlagen:', error);
    return;
  }
  console.log('Datei gelöscht:', eintrag.path);
  // Refresh kontextabhängig: neues Event-Modal offen -> dessen Liste; sonst alter Editor.
  if (document.getElementById('event-modal').classList.contains('aktiv')) {
    ladeEventMedienListe(eventId);
  } else if (document.getElementById('modal').classList.contains('aktiv') &&
             (eventsCache || []).some(e => e.id === eventId)) {
    zeigeEventDetail(eventId);   // Detailansicht eines DB-Events
  } else {
    zeigeEventEditor(eventId);   // altes Event-System
  }
}

async function zeigeMediaSlideshow(eventId, startIndex = 0) {
  const media = await renderEventMedia(eventId);
  if (media.length === 0) return;

  // Titel + Zurück-Ziel je nach Event-Quelle (DB-Event vs. altes statisches Event)
  const dbEv = (eventsCache || []).find(e => e.id === eventId);
  const titel = dbEv ? (dbEv.titel || '') : ((getEventConfig(eventId) || {}).title || '');
  const zurueckCall = dbEv ? `zeigeEventDetail('${eventId}')` : `zeigeShort('${eventId}')`;
  let currentIndex = startIndex;
  
  const updateSlideshow = () => {
    const m = media[currentIndex];
    const isImage = m.type.startsWith('image/');
    const istPdf  = m.type === 'application/pdf' || /pdf/i.test(m.type);
    const content = isImage
      ? `<img src="${m.url}" alt="${escapeHtml(m.name)}" style="max-width: 90vw; max-height: 70vh; object-fit: contain;" />`
      : istPdf
      ? `<iframe src="${m.url}" style="width: 90vw; height: 70vh; border: none; background: #fff;"></iframe>`
      : `<video style="max-width: 90vw; max-height: 70vh;" controls><source src="${m.url}" type="${m.type}">Browser nicht unterstützt</video>`;
    
    const navHtml = media.length > 1 ? `
      <div class="slideshow-nav">
        <button onclick="window.slideshowUpdate(${Math.max(0, currentIndex - 1)})" ${currentIndex === 0 ? 'disabled' : ''}>← ${t('prev') || 'Zurück'}</button>
        <span>${currentIndex + 1} / ${media.length}</span>
        <button onclick="window.slideshowUpdate(${Math.min(media.length - 1, currentIndex + 1)})" ${currentIndex === media.length - 1 ? 'disabled' : ''}>${t('next') || 'Weiter'} →</button>
      </div>
    ` : '';
    
    document.getElementById('modal-text').innerHTML = `
      <h2>${escapeHtml(nm(titel))}</h2>
      <div style="text-align: center; margin: 20px 0;">${content}</div>
      <div style="text-align: center; color: #666; margin: 10px 0;">${escapeHtml(m.name)}</div>
      ${navHtml}
      <div style="text-align: center; margin-top: 20px;">
        <button class="zurueck-btn" onclick="${zurueckCall}">${t('event_cancel')}</button>
      </div>
    `;
  };
  
  window.slideshowUpdate = (newIndex) => {
    if (newIndex >= 0 && newIndex < media.length) {
      currentIndex = newIndex;
      updateSlideshow();
    }
  };
  
  updateSlideshow();
}

    const button = document.getElementById('event-upload-btn');

    console.log('Upload-Button geklickt. Dateien:', uploads.length);

      status.textContent = 'Bitte Dateien auswählen.';

  });
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function zeigeDetails(personId) {
  if (document.getElementById('modal').classList.contains('aktiv') && aktuelleModalPersonId) {
    modalVerlauf.push(aktuelleModalPersonId);
  }
  aktuelleModalPersonId = personId;
  const p = aktuelleDaten.persons[personId];
  if (!p) return;
  
  const eltern = [];
  p.families_child.forEach(famId => {
    const fam = aktuelleDaten.families[famId];
    if (fam) {
      if (fam.husband && aktuelleDaten.persons[fam.husband]) eltern.push(aktuelleDaten.persons[fam.husband]);
      if (fam.wife && aktuelleDaten.persons[fam.wife]) eltern.push(aktuelleDaten.persons[fam.wife]);
    }
  });
  
  const geschwister = [];
  p.families_child.forEach(famId => {
    const fam = aktuelleDaten.families[famId];
    if (fam) {
      fam.children.forEach(cid => {
        if (cid !== personId && aktuelleDaten.persons[cid]) geschwister.push(aktuelleDaten.persons[cid]);
      });
    }
  });
  
  // Ehen mit je Partner und zugehörigen Kindern
  const eheFamilien = [];
  p.families_spouse.forEach(famId => {
    const fam = aktuelleDaten.families[famId];
    if (fam) {
      const partnerId = fam.husband === personId ? fam.wife : fam.husband;
      const partnerPerson = partnerId ? aktuelleDaten.persons[partnerId] : null;
      const famKinder = fam.children.filter(cid => aktuelleDaten.persons[cid]).map(cid => aktuelleDaten.persons[cid]);
      eheFamilien.push({ partner: partnerPerson, kinder: famKinder });
    }
  });

  const buildVerwandte = (liste) => liste.map(v =>
    `<span class="verwandter" onclick="zeigeDetails('${v.id}')">${escapeHtml(nm(v.name))}</span>`
  ).join('');

  const geschlechtText = p.sex === 'M' ? t('maennlich') : (p.sex === 'F' ? t('weiblich') : t('unbekannt'));

  // Ehe-Block: bei mehreren Ehen pro Ehe gruppiert, sonst flach
  const eheHtml = eheFamilien.length > 1
    ? eheFamilien.map((ef, i) => `
        <div class="beziehungen">
          <h3>${t('partner')} ${i + 1}</h3>
          ${ef.partner ? `<span class="verwandter" onclick="zeigeDetails('${ef.partner.id}')">${escapeHtml(nm(ef.partner.name))}</span>` : ''}
          ${ef.kinder.length ? `<div style="margin-top:8px"><strong style="font-size:12px;color:#777;letter-spacing:1px">${t('kinder')}:</strong><br>${buildVerwandte(ef.kinder)}</div>` : ''}
        </div>`).join('')
    : `${eheFamilien[0]?.partner ? `<div class="beziehungen"><h3>${t('partner')}</h3>${`<span class="verwandter" onclick="zeigeDetails('${eheFamilien[0].partner.id}')">${escapeHtml(nm(eheFamilien[0].partner.name))}</span>`}</div>` : ''}
       ${eheFamilien[0]?.kinder?.length ? `<div class="beziehungen"><h3>${t('kinder')}</h3>${buildVerwandte(eheFamilien[0].kinder)}</div>` : ''}`;

  document.getElementById('modal-text').innerHTML = `
    ${modalVerlauf.length > 0 ? `<button class="zurueck-btn" onclick="geheZurueck()">← ${t('zurueck')}</button>` : ''}
    <h2>${escapeHtml(nm(p.given || '?'))}</h2>
    <p class="sub-name">${escapeHtml(nm(p.surname || ''))}</p>

    ${p.birth_date ? `<div class="info-zeile"><strong>${t('geboren')}</strong> ${escapeHtml(formatDatumLang(p.birth_date))}</div>` : ''}
    ${p.birth_place ? `<div class="info-zeile"><strong>${t('geburtsort')}</strong> ${escapeHtml(uebersetzeOrt(p.birth_place))}</div>` : ''}
    ${p.deceased || p.death_date ? `<div class="info-zeile"><strong>${t('verstorben')}</strong> ${escapeHtml(formatDatumLang(p.death_date) || t('ja'))}</div>` : ''}
    ${p.death_place ? `<div class="info-zeile"><strong>${t('sterbeort')}</strong> ${escapeHtml(uebersetzeOrt(p.death_place))}</div>` : ''}
    <div class="info-zeile"><strong>${t('geschlecht')}</strong> ${geschlechtText}</div>
    ${p.geburtsland ? `<div class="info-zeile"><strong>${t('reg_geburtsland')}:</strong> ${escapeHtml(uebersetzeOrt(p.geburtsland))}</div>` : ''}
    ${p.getauft ? `<div class="info-zeile"><strong>${t('reg_getauft')}:</strong> ${escapeHtml(formatDatumLang(p.getauft))}</div>` : ''}
    ${(p.beziehung && p.beziehung !== 'unbekannt') ? `<div class="info-zeile"><strong>${t('pe_beziehung')}:</strong> ${escapeHtml(p.beziehung === 'sonstige' ? (p.beziehung_sonstige || t('bz_sonstige')) : t('bz_' + p.beziehung))}</div>` : ''}
    ${(p.hochzeit_standesamt || p.hochzeit_kirchlich || p.hochzeitsort) ? `<div class="info-zeile"><strong>${t('pe_hochzeit_standesamt')}:</strong> ${escapeHtml([formatDatumLang(p.hochzeit_standesamt), formatDatumLang(p.hochzeit_kirchlich), p.hochzeitsort].filter(Boolean).join(' · '))}</div>` : ''}
    ${p.beruf ? `<div class="info-zeile"><strong>${t('pe_beruf')}:</strong> ${escapeHtml(p.beruf)}</div>` : ''}
    ${p.ausbildung ? `<div class="info-zeile"><strong>${t('pe_ausbildung')}:</strong> ${escapeHtml(p.ausbildung)}</div>` : ''}
    ${(p.adresse || p.wohnort_stadt || p.wohnort_land) ? `<div class="info-zeile"><strong>${t('pe_g_wohnen')}:</strong> ${escapeHtml(uebersetzeOrt([p.adresse, p.wohnort_stadt, p.wohnort_land].filter(Boolean).join(', ')))}</div>` : ''}
    ${(p.email || p.telefon || p.facebook || p.instagram) ? `<div class="info-zeile"><strong>${t('reg_kontakt')}:</strong> ${escapeHtml([p.email, p.telefon, p.facebook, p.instagram].filter(Boolean).join(' · '))}</div>` : ''}
    ${p.beschreibung ? `<div class="info-zeile"><strong>${t('pe_beschreibung')}:</strong> ${escapeHtml(p.beschreibung)}</div>` : ''}

    ${eltern.length ? `<div class="beziehungen"><h3>${t('eltern')}</h3>${buildVerwandte(eltern)}</div>` : ''}
    ${eheHtml}
    ${geschwister.length ? `<div class="beziehungen"><h3>${t('geschwister')}</h3>${buildVerwandte(geschwister)}</div>` : ''}

    <button class="baum-zeigen" onclick="schliesseModalUndZeigeBaum('${p.id}')">${t('baum_zeigen')}</button>
    ${istAdmin() ? `<button class="baum-zeigen" style="margin-left:10px" onclick="zeigePersonBearbeiten('${p.id}')">${t('event_edit')}</button>` : ''}
    ${istAdmin() ? `
      <div class="pa-aktionen">
        <button class="pa-add-btn" onclick="zeigePersonHinzufuegen('${p.id}')">＋ ${t('person_hinzufuegen')}</button>
        <button class="pa-del-btn" onclick="loeschePerson('${p.id}')">🗑 ${t('person_loeschen')}</button>
      </div>` : ''}
  `;
  document.getElementById('modal').classList.add('aktiv');
}

function schliesseModal() {
  document.getElementById('modal').classList.remove('aktiv');
  modalVerlauf = [];
  aktuelleModalPersonId = null;
}

function geheZurueck() {
  if (modalVerlauf.length > 0) {
    const vorherige = modalVerlauf.pop();
    aktuelleModalPersonId = null;
    zeigeDetails(vorherige);
  }
}

function zeigePersonBearbeiten(personId) {
  if (!istAdmin()) return;
  const p = aktuelleDaten.persons[personId];
  if (!p) return;
  schliesseModal();   // Detail-Fenster schließen, bevor der Editor aufgeht
  const set  = (id, v) => { document.getElementById(id).value = v ?? ''; };
  const setD = (id, v) => datumSetzen(document.getElementById(id), v);   // Datumsfelder
  document.getElementById('pe-id').value = personId;
  document.getElementById('pe-geschlecht').value = p.sex || '';
  document.getElementById('pe-status').value = (p.deceased || p.death_date) ? 'verstorben' : 'lebend';
  set('pe-vorname', p.given);        set('pe-nachname', p.surname);
  set('pe-titel', p.titel);          set('pe-namenszusatz', p.namenszusatz);
  set('pe-ehename', p.ehename);      setD('pe-geburtsdatum', p.birth_date);
  set('pe-geburtsort', p.birth_place); set('pe-geburtsland', p.geburtsland);
  setD('pe-getauft', p.getauft);
  setD('pe-sterbedatum', p.death_date);
  set('pe-hochzeitsort', p.hochzeitsort);
  setD('pe-hochzeit-standesamt', p.hochzeit_standesamt || p.hochzeitstag);
  setD('pe-hochzeit-kirchlich', p.hochzeit_kirchlich);
  set('pe-beziehung-sonstige', p.beziehung_sonstige);
  document.getElementById('pe-beziehung').value =
    ['unbekannt','verheiratet','verlobt','partner','getrennt','geschieden','verwitwet','sonstige']
      .includes(p.beziehung) ? p.beziehung : 'unbekannt';
  set('pe-email', p.email);          set('pe-telefon', p.telefon);
  set('pe-facebook', p.facebook);    set('pe-instagram', p.instagram);
  set('pe-wohnland', p.wohnort_land); set('pe-wohnstadt', p.wohnort_stadt);
  set('pe-adresse', p.adresse);      set('pe-beruf', p.beruf);
  set('pe-ausbildung', p.ausbildung); set('pe-beschreibung', p.beschreibung);
  document.getElementById('pe-fehler').style.display = 'none';
  document.getElementById('pe-erfolg').style.display = 'none';
  pePruefeFelder();   // bedingte Felder (Sterbedatum / Hochzeit / Sonstige) anzeigen
  document.getElementById('person-edit-modal').classList.add('aktiv');
}

// Bedingte Felder im Editor ein-/ausblenden
function pePruefeFelder() {
  const verstorben = document.getElementById('pe-status').value === 'verstorben';
  document.getElementById('pe-row-sterbedatum').style.display = verstorben ? '' : 'none';
  const bez = document.getElementById('pe-beziehung').value;
  const ehe = bez === 'verheiratet';
  document.getElementById('pe-row-hochzeitsort').style.display = ehe ? '' : 'none';
  document.getElementById('pe-row-standesamt').style.display   = ehe ? '' : 'none';
  document.getElementById('pe-row-kirchlich').style.display    = ehe ? '' : 'none';
  document.getElementById('pe-row-sonstige').style.display     = (bez === 'sonstige') ? '' : 'none';
}

async function speicherePerson() {
  if (!istAdmin()) return;
  const personId = document.getElementById('pe-id').value;
  const pObj     = aktuelleDaten.persons[personId];
  const fehlerEl = document.getElementById('pe-fehler');
  const erfolgEl = document.getElementById('pe-erfolg');
  const button   = document.getElementById('pe-submit');

// Person + zugehörige Beziehungen löschen (mit Bestätigung). Keine verwaisten Beziehungen.
async function loeschePerson(personId) {
  if (!istAdmin()) return;
  const p = aktuelleDaten.persons[personId];
  if (!p || !p._uuid) return;

  const ok = await zeigeBestaetigung(t('pa_loeschen_frage') + '\n\n' + nm(p.name || p.given || '?'));
  if (!ok) return;

  // Fokus-Fallback bestimmen, bevor die Person verschwindet (Partner > Elternteil > Kind > Wurzel)
  let fallback = null;
  (p.families_spouse || []).forEach(fid => {
    const fam = aktuelleDaten.families[fid]; if (!fam) return;
    const partner = fam.husband === personId ? fam.wife : fam.husband;
    if (partner && aktuelleDaten.persons[partner]) fallback = fallback || partner;
    (fam.children || []).forEach(c => { if (aktuelleDaten.persons[c]) fallback = fallback || c; });
  });
  (p.families_child || []).forEach(fid => {
    const fam = aktuelleDaten.families[fid]; if (!fam) return;
    if (fam.husband && aktuelleDaten.persons[fam.husband]) fallback = fallback || fam.husband;
    if (fam.wife && aktuelleDaten.persons[fam.wife]) fallback = fallback || fam.wife;
  });

  // 1) Alle Beziehungen mit dieser Person entfernen (keine verwaisten Kanten)
  const { error: bErr } = await sbClient.from('beziehungen').delete()
    .or(`person_a.eq.${p._uuid},person_b.eq.${p._uuid}`);
  if (bErr) { await zeigeHinweis(t('reg_fehler') + bErr.message); return; }

  // 2) Person selbst löschen
  const { error: pErr } = await sbClient.from('personen').delete().eq('id', p._uuid);
  if (pErr) { await zeigeHinweis(t('reg_fehler') + pErr.message); return; }

  // 3) Detail-Overlay schließen + Baum neu zeichnen
  schliesseModal();
  await reloadBaumBehalteFokus(fallback);
  await zeigeHinweis(t('pa_geloescht'));
}

// ============================================================
// STAMMBAUM (d3.js)
// ============================================================
let baumSvg, baumG, zoom, fitTransform = null;

function initBaum() {
  baumSvg = d3.select('#baum-svg');
  baumG = baumSvg.append('g');

  zoom = d3.zoom()
    .scaleExtent([0.05, 3.0])
    .on('zoom', e => {
      baumG.attr('transform', e.transform);
      // Adaptive Schriftgröße: Mindest 11px auf dem Bildschirm für Namen
      const k = e.transform.k;
      const nfs = Math.max(16, 11 / k);
      const dfs = Math.max(12, 9 / k);
      baumG.selectAll('.name-text').attr('font-size', nfs + 'px');
      baumG.selectAll('.daten-text')
        .attr('font-size', dfs + 'px')
        .style('display', k < 0.35 ? 'none' : null);
    });
  baumSvg.call(zoom);

  // Doppelklick → zurück zur Fit-Ansicht
  baumSvg.on('dblclick.zoom', null);
  baumSvg.on('dblclick', function() {
    if (fitTransform) {
      baumSvg.transition().duration(500).call(zoom.transform, fitTransform);
    }
  });
}

function zeichneBaum(rootPersonId, tiefeUnten = 2, tiefeOben = 2) {
  baumG.selectAll('*').remove();

  const wurzel = baueBaumDaten(rootPersonId, tiefeUnten, tiefeOben);
  if (!wurzel) return;

  // Kopf an den aktuell angezeigten Stammbaum anpassen (#4: z.B. Petrović)
  aktualisiereKopf(rootPersonId);
  
  const containerB = document.getElementById('baum-container').getBoundingClientRect();
  const breite = containerB.width;
  const hoehe = containerB.height;
  
  // Reingold-Tilford via d3.tree().
  // nodeSize[0]=300: Pärchen-Breite 270px + 30px Puffer → garantiert kein Überlapp.
  // separation: Geschwister 1.0, andere Familien 1.5.
  const treeLayout = d3.tree()
    .nodeSize([300, 130])
    .separation((a, b) => a.parent === b.parent ? 1.0 : 1.5);
  const wurzelNode = d3.hierarchy(wurzel);
  treeLayout(wurzelNode);

  // y-Koordinaten negieren → Baum wächst von unten nach oben
  wurzelNode.each(d => { d.y = -d.y; });

  // Kollisions-Check (Konsolen-Warnung bei Überlapp, sollte nicht vorkommen)
  kollisionsPrüfung(wurzelNode);

  // Orthogonale T-Verbindungen (kein Bezier, kein Diagonalen)
  zeichneVerbindungen(wurzelNode);

  // ── Knoten: Hauptperson + Partner ──────────────────────────────
  const knoten = baumG.selectAll('.knoten-gruppe')
    .data(wurzelNode.descendants())
    .enter().append('g')
    .attr('class', d => 'knoten-gruppe' + (d.data.person.id === rootPersonId ? ' fokus' : ''))
    .attr('transform', d => `translate(${d.x},${d.y})`);

  knoten.each(function(d) {
    const g = d3.select(this);
    const p = d.data.person;
    const istBl = !!d.data.blutlinie;

    if (d.data.marriages && d.data.marriages.length >= 2) {
      const wife1 = d.data.marriages[0].partner;
      const wife2 = d.data.marriages[1].partner;
      if (wife1) g.append('line').attr('class', 'ehe-linie')
        .attr('x1', -5).attr('y1', 0).attr('x2', -135).attr('y2', 0);
      if (wife2) g.append('line').attr('class', 'ehe-linie')
        .attr('x1', 5).attr('y1', 0).attr('x2', 135).attr('y2', 0);
      zeichneKnotenBox(g, p, 0, p.id === rootPersonId, istBl);
      if (wife1) zeichneKnotenBox(g, wife1, -140, false, false);
      if (wife2) zeichneKnotenBox(g, wife2, 140, false, false);
    } else {
      const partners = d.data.partners;
      const N = partners.length;
      const offset = i => -70 * N + 140 * i;
      for (let i = 0; i < N; i++) {
        g.append('line').attr('class', 'ehe-linie')
          .attr('x1', offset(i) + 65).attr('y1', 0)
          .attr('x2', offset(i + 1) - 65).attr('y2', 0);
      }
      zeichneKnotenBox(g, p, offset(0), p.id === rootPersonId, istBl);
      partners.forEach((partner, i) => {
        zeichneKnotenBox(g, partner, offset(i + 1), false, false);
      });
    }
  });

  // Bounding Box: halbe Kartenbreite (65) + max. Partner-Versatz (70) = 135
  const allX = wurzelNode.descendants().map(d => d.x);
  const allY = wurzelNode.descendants().map(d => d.y);
  const tXMin = Math.min(...allX) - 145;
  const tXMax = Math.max(...allX) + 145;
  const tYMin = Math.min(...allY) - 30;
  const tYMax = Math.max(...allY) + 30;
  const tW = tXMax - tXMin, tH = tYMax - tYMin;

  // Auto-Fit: Blutlinie (x=0) auf die horizontale Mitte des Containers setzen.
  // Skala so wählen, dass der gesamte Baum in den Container passt.
  const pad = 0.03;
  const padPx = breite * pad;
  const fitT = hoehe * pad, fitH = hoehe * (1 - 2 * pad);

  // Beide Hälften (links / rechts von x=0) müssen in je eine Container-Hälfte passen.
  const hHalf = breite / 2 - padPx;
  const skala_h = Math.min(
    tXMax > 0 ? hHalf / tXMax : 5,
    tXMin < 0 ? hHalf / (-tXMin) : 5
  );
  const skala_v = fitH / tH;
  const skala = Math.min(skala_h, skala_v, 2.5);
  const tx = breite / 2;                                         // x=0 → Bildmitte
  const ty = fitT + (fitH - tH * skala) / 2 - tYMin * skala;

  // Zoom-Bereich: minZoom = Fit-Ansicht (90%), maxZoom = 3.0
  zoom.scaleExtent([skala * 0.9, 3.0]);

  fitTransform = d3.zoomIdentity.translate(tx, ty).scale(skala);
  baumSvg.call(zoom.transform, fitTransform);

  // Initiale Schriftgrößen sofort setzen (ohne auf Zoom-Event zu warten)
  const nfs = Math.max(16, 11 / skala);
  const dfs = Math.max(12, 9 / skala);
  baumG.selectAll('.name-text').attr('font-size', nfs + 'px');
  baumG.selectAll('.daten-text')
    .attr('font-size', dfs + 'px')
    .style('display', skala < 0.35 ? 'none' : null);
  
  aktualisiereBaumInfo();
}

// Orthogonale T-Verbindungen: Eltern → Sammellinie → Kinder (kein Bezier, keine Diagonalen).
function zeichneVerbindungen(wurzelNode) {
  const HH = 30; // halbe Kartenhöhe

  // Links nach (Eltern-ID + FamilienIndex) gruppieren
  const gruppen = new Map();
  wurzelNode.links().forEach(link => {
    const src = link.source;
    const famIdx = link.target.data.familyIndex ?? 0;
    const key = src.data.person.id + '_' + famIdx;
    if (!gruppen.has(key)) gruppen.set(key, { src, famIdx, targets: [] });
    gruppen.get(key).targets.push(link.target);
  });

  gruppen.forEach(({ src, famIdx, targets }) => {
    // Abstiegspunkt: Mitte der Heiratslinie des Elternpaares
    const istMehrehe = !!(src.data.marriages && src.data.marriages.length >= 2);
    const descentX = istMehrehe ? src.x + (famIdx === 0 ? -70 : 70) : src.x;

    const srcBottom = src.y + HH;
    const childTop  = targets[0].y - HH;
    const midY      = (srcBottom + childTop) / 2;

    const xs       = targets.map(t => t.x);
    const collXMin = Math.min(descentX, ...xs);
    const collXMax = Math.max(descentX, ...xs);

    // 1. Vertikale Linie: Elternteil → Sammelpunkt
    baumG.append('line').attr('class', 'verbindung')
      .attr('x1', descentX).attr('y1', srcBottom)
      .attr('x2', descentX).attr('y2', midY);
    // 2. Horizontale Sammellinie bei midY
    baumG.append('line').attr('class', 'verbindung')
      .attr('x1', collXMin).attr('y1', midY)
      .attr('x2', collXMax).attr('y2', midY);
    // 3. Vertikale Stubs zu jedem Kind
    targets.forEach(t => {
      baumG.append('line').attr('class', 'verbindung')
        .attr('x1', t.x).attr('y1', midY)
        .attr('x2', t.x).attr('y2', childTop);
    });
  });
}

// Kollisions-Check: Warnung wenn zwei Knotengruppen in derselben Generation überlappen.
function kollisionsPrüfung(wurzelNode) {
  const CW = 135; // halber Paar-Fußabdruck (Person ±65 + Partner-Versatz 70)
  const MIN_GAP = 20;

  const genMap = new Map();
  wurzelNode.each(d => {
    const gy = Math.round(d.y / 10) * 10;
    if (!genMap.has(gy)) genMap.set(gy, []);
    genMap.get(gy).push(d);
  });

  genMap.forEach((nodes, gy) => {
    nodes.sort((a, b) => a.x - b.x);
    for (let i = 0; i < nodes.length - 1; i++) {
      const a = nodes[i], b = nodes[i + 1];
      const gap = (b.x - CW) - (a.x + CW);
      if (gap < MIN_GAP) {
        console.warn(`Überlapp y≈${gy}: ${a.data.person.given} ↔ ${b.data.person.given}, Abstand=${gap.toFixed(0)}px`);
      }
    }
  });
}

// Mehrreihige Anordnung: >4 Kinder → 2 Zeilen, >8 → 3 Zeilen.
// ROW = 100 > (130 − 2×30 = 70) → kein Kartenüberlapp mit Enkeln der Parallelzeile.
// Enthält eine Gruppe ein Blutlinien-Kind, wird diese Gruppe so positioniert,
// dass das Blutlinien-Kind exakt unter dem Elternteil liegt (x = node.x).
function applyMehrZeilen(node) {
  if (!node.children || node.children.length <= 4) {
    if (node.children) node.children.forEach(applyMehrZeilen);
    return;
  }
  const N = node.children.length;
  const rows = N > 8 ? 3 : 2;
  const COL = 280;
  const ROW = 100;

  const xs = node.children.map(c => c.x);
  const centerX = (Math.min(...xs) + Math.max(...xs)) / 2;
  const baseY = node.children[0].y;

  const groups = Array.from({length: rows}, () => []);
  node.children.forEach((child, i) => {
    groups[Math.min(rows - 1, Math.floor(i * rows / N))].push(child);
  });

  groups.forEach((group, ri) => {
    const n = group.length;
    const rowY = baseY - ri * ROW;
    // Blutlinien-Kind in dieser Gruppe? → es wird auf x = node.x gesetzt
    const blIdx = group.findIndex(c => c.data.blutlinie);
    const startX = blIdx >= 0
      ? node.x - blIdx * COL          // Blutlinien-Kind genau unter Elternteil
      : centerX - (n - 1) * COL / 2;  // sonst zentriert
    group.forEach((child, j) => {
      const dx = startX + j * COL - child.x;
      const dy = rowY - child.y;
      child.each(d => { d.x += dx; d.y += dy; });
    });
  });

  node.children.forEach(applyMehrZeilen);
}

// Zeichnet eine Personen-Box an xOffset relativ zum Gruppen-Ursprung.
function zeichneKnotenBox(g, p, xOffset, istFokus, istBlutlinie) {
  const sex = p.sex;
  const klasse = sex === 'M' ? 'male' : (sex === 'F' ? 'female' : 'unknown');
  const extra = (istFokus ? ' fokus' : '') + (istBlutlinie ? ' blutlinie' : '');

  const box = g.append('g')
    .attr('class', 'knoten ' + klasse + extra)
    .attr('transform', `translate(${xOffset},0)`)
    .style('cursor', 'pointer')
    .on('click', () => zeigeDetails(p.id));

  // Karte: 130×60 px
  box.append('rect')
    .attr('x', -65).attr('y', -30)
    .attr('width', 130).attr('height', 60)
    .attr('rx', 6);

  const gn = nm(p.given || '?');
  box.append('text').attr('class', 'name-text')
    .attr('text-anchor', 'middle').attr('y', -10)
    .text(gn.length > 15 ? gn.substring(0, 13) + '…' : gn);

  const sn = nm(p.surname || '');
  box.append('text').attr('class', 'name-text')
    .attr('text-anchor', 'middle').attr('y', 6)
    .text(sn.length > 15 ? sn.substring(0, 13) + '…' : sn);

  if (p.birth_date || p.death_date) {
    let dat = p.birth_date ? '* ' + formatDatumLang(p.birth_date) : '';
    if (p.deceased || p.death_date) dat += (dat ? '  ' : '') + '† ' + (formatDatumLang(p.death_date) || '?');
    box.append('text').attr('class', 'daten-text')
      .attr('text-anchor', 'middle').attr('y', 22)
      .text(dat);
  }
}

// Blutlinie: Tanasije → Simo → Marko (direkte Abstammungslinie)
const BLUTLINIE_IDS = new Set(['I500009', 'I500007', 'I500003']);
const BLUTLINIE_KINDER = { 'I500009': 'I500007', 'I500007': 'I500003' };

function baueBaumDaten(rootId, tiefeNachUnten = 2, tiefeNachOben = 2) {
  if (!aktuelleDaten.persons[rootId]) return null;

  // Multi-Tree (B2): auf den gewählten Stammbaum begrenzen. Ohne Auswahl (oder
  // ohne _tree-Daten) verhält es sich wie früher (alles verbunden).
  const treeId = aktuellerStammbaumId;
  const sameTree = (id) => {
    if (!treeId) return true;
    const p = aktuelleDaten.persons[id];
    return !!(p && p._tree === treeId);
  };

  function findeWurzel(personId, tiefe) {
    if (tiefe <= 0) return personId;
    const p = aktuelleDaten.persons[personId];
    if (!p || !p.families_child.length) return personId;
    const fam = aktuelleDaten.families[p.families_child[0]];
    if (!fam) return personId;
    // Elternteil im selben Baum bevorzugen; gibt es keinen -> hier ist die Wurzel
    let elternId = null;
    if (fam.husband && sameTree(fam.husband)) elternId = fam.husband;
    else if (fam.wife && sameTree(fam.wife)) elternId = fam.wife;
    if (!elternId || !aktuelleDaten.persons[elternId]) return personId;
    return findeWurzel(elternId, tiefe - 1);
  }

  const wurzelId = findeWurzel(rootId, tiefeNachOben);
  const besucht = new Set();

  function baueKnoten(personId, tiefe) {
    if (besucht.has(personId)) return null;
    besucht.add(personId);
    const p = aktuelleDaten.persons[personId];
    if (!p) return null;

    const familien = [];
    p.families_spouse.forEach(famId => {
      const fam = aktuelleDaten.families[famId];
      if (!fam) return;
      const partnerId = fam.husband === personId ? fam.wife : fam.husband;
      const partner = (partnerId && aktuelleDaten.persons[partnerId] && !besucht.has(partnerId))
        ? aktuelleDaten.persons[partnerId] : null;
      if (partner) besucht.add(partnerId);
      familien.push({ partner, kinderIds: fam.children || [] });
    });

    const partners = familien.map(f => f.partner).filter(Boolean);
    const marriages = familien.length >= 2 ? familien.map(f => ({ partner: f.partner })) : null;
    const blutlinie = BLUTLINIE_IDS.has(personId);

    const knoten = { person: p, partners, marriages, familyIndex: null, children: [], blutlinie };

    if (tiefe <= 0) return knoten;

    if (familien.length >= 2) {
      familien.forEach((fam, famIdx) => {
        fam.kinderIds.forEach(cid => {
          if (!sameTree(cid)) return;   // Kinder anderer Bäume gehören in deren Ansicht
          const kindKnoten = baueKnoten(cid, tiefe - 1);
          if (kindKnoten) { kindKnoten.familyIndex = famIdx; knoten.children.push(kindKnoten); }
        });
      });
    } else {
      const kinderIds = new Set();
      familien.forEach(fam => fam.kinderIds.forEach(c => kinderIds.add(c)));
      kinderIds.forEach(cid => {
        if (!sameTree(cid)) return;
        const kindKnoten = baueKnoten(cid, tiefe - 1);
        if (kindKnoten) knoten.children.push(kindKnoten);
      });
    }

    // Blutlinien-Kind in die Mitte stellen → Reingold-Tilford zentriert es unter dem Elternteil
    const blChild = BLUTLINIE_KINDER[personId];
    if (blChild && knoten.children.length > 1) {
      const blIdx = knoten.children.findIndex(c => c.person.id === blChild);
      if (blIdx >= 0) {
        const centerIdx = Math.floor(knoten.children.length / 2);
        const [bl] = knoten.children.splice(blIdx, 1);
        knoten.children.splice(centerIdx, 0, bl);
      }
    }

    return knoten;
  }

  return baueKnoten(wurzelId, tiefeNachOben + tiefeNachUnten);
}

// GEDCOM-UPLOAD
// ============================================================
function handleGedcomUpload(event) {
  const datei = event.target.files[0];
  if (!datei) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const geparst = parseGedcom(e.target.result);
      aktuelleDaten = geparst;
      fokusPersonId = null;
      baueNachnameFilter();
      aktualisiereStats();
      zeigeKarten();
      const p = Object.keys(geparst.persons).length;
      const f = Object.keys(geparst.families).length;
      alert(t('upload_erfolg', {p, f}));
    } catch (err) {
      alert(t('upload_fehler') + err.message);
    }
  };
  reader.readAsText(datei, 'UTF-8');
}

function parseGedcom(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const persons = {};
  const families = {};
  let curId = null, curType = null, curSub = null;
  
  for (const line of lines) {
    const parts = line.split(' ');
    const level = parts[0];
    
    if (level === '0') {
      const m = line.match(/^0\s+@(\w+)@\s+(\w+)/);
      if (m) {
        curId = m[1]; curType = m[2]; curSub = null;
        if (curType === 'INDI') {
          persons[curId] = {
            id: curId, name: '', given: '', surname: '', sex: '',
            birth_date: '', birth_place: '', death_date: '', death_place: '',
            deceased: false, families_spouse: [], families_child: []
          };
        } else if (curType === 'FAM') {
          families[curId] = {
            id: curId, husband: null, wife: null, children: [],
            marriage_date: '', marriage_place: ''
          };
        }
      } else { curId = null; curType = null; }
    } else if (!curId) {
      continue;
    } else if (level === '1') {
      const tag = parts[1];
      const value = parts.slice(2).join(' ');
      curSub = tag;
      if (curType === 'INDI') {
        const p = persons[curId];
        if (tag === 'NAME') {
          const m = value.match(/(.*?)\/(.*?)\//);
          if (m) {
            p.given = m[1].trim(); p.surname = m[2].trim();
            p.name = `${p.given} ${p.surname}`.trim();
          } else { p.name = value.trim(); }
        } else if (tag === 'SEX') { p.sex = value.trim(); }
        else if (tag === 'DEAT') { p.deceased = true; }
        else if (tag === 'FAMS') { const m = value.match(/@(\w+)@/); if (m) p.families_spouse.push(m[1]); }
        else if (tag === 'FAMC') { const m = value.match(/@(\w+)@/); if (m) p.families_child.push(m[1]); }
      } else if (curType === 'FAM') {
        const f = families[curId];
        if (tag === 'HUSB') { const m = value.match(/@(\w+)@/); if (m) f.husband = m[1]; }
        else if (tag === 'WIFE') { const m = value.match(/@(\w+)@/); if (m) f.wife = m[1]; }
        else if (tag === 'CHIL') { const m = value.match(/@(\w+)@/); if (m) f.children.push(m[1]); }
      }
    } else if (level === '2') {
      const tag = parts[1];
      const value = parts.slice(2).join(' ');
      if (curType === 'INDI') {
        const p = persons[curId];
        if (curSub === 'BIRT') {
          if (tag === 'DATE') p.birth_date = value.trim();
          else if (tag === 'PLAC') p.birth_place = value.trim();
        } else if (curSub === 'DEAT') {
          if (tag === 'DATE') p.death_date = value.trim();
          else if (tag === 'PLAC') p.death_place = value.trim();
        }
      } else if (curType === 'FAM' && curSub === 'MARR') {
        const f = families[curId];
        if (tag === 'DATE') f.marriage_date = value.trim();
        else if (tag === 'PLAC') f.marriage_place = value.trim();
      }
    }
  }
  return { persons, families };
}
