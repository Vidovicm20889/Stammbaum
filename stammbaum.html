// Suchdialog öffnen (bestehende Person als Eltern/Kind/Partner/Geschwister verknüpfen)
function zeigeVerbinden(personId, typ) {
  if (!istAdmin()) return;
  const p = aktuelleDaten.persons[personId]; if (!p || !p._uuid) return;
  schliesseModal();   // immer nur EIN großes Overlay
  vbKontext = { personId, uuid: p._uuid, typ: BEZTYP_GUELTIG.includes(typ) ? typ : 'kind' };
  document.getElementById('vb-kontext').textContent =
    t('vb_kontext', { bez: t('beztyp_' + vbKontext.typ), name: nm(p.name || p.given || '?') });
  ['vb-vorname','vb-nachname','vb-geburt'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('vb-fehler').style.display = 'none';
  document.getElementById('vb-ergebnis').innerHTML = `<p class="mv-legende">${t('vb_min_zeichen')}</p>`;

  // Zweiter Elternteil (nur bei 'kind' + mehreren Ehepartnern) — wie im Anlegen-Overlay
  vbSpouses = [];
  (p.families_spouse || []).forEach(fid => {
    const fam = aktuelleDaten.families[fid]; if (!fam) return;
    const partnerExt = fam.husband === personId ? fam.wife : fam.husband;
    const partner = partnerExt ? aktuelleDaten.persons[partnerExt] : null;
    if (partner && partner._uuid) vbSpouses.push({ uuid: partner._uuid, name: nm(partner.name || partner.given || '?') });
  });
  const sel2 = document.getElementById('vb-elternteil2');
  sel2.innerHTML = `<option value="">${escapeHtml(t('unbekannt'))}</option>` +
    vbSpouses.map(s => `<option value="${s.uuid}">${escapeHtml(s.name)}</option>`).join('');
  if (vbSpouses.length === 1) sel2.value = vbSpouses[0].uuid;
  document.getElementById('vb-row-elternteil2').style.display =
    (vbKontext.typ === 'kind' && vbSpouses.length >= 2) ? '' : 'none';

  document.getElementById('verbinden-modal').classList.add('aktiv');
  macheAlleSelectsSuchbar(document.getElementById('verbinden-modal'));
  setTimeout(() => { const f = document.getElementById('vb-vorname'); if (f) f.focus(); }, 60);
}
function schliesseVerbinden() {
  document.getElementById('verbinden-modal').classList.remove('aktiv');
  if (vbTimer) { clearTimeout(vbTimer); vbTimer = null; }
}

// Live-Suche: Debounce 300 ms, ab 2 Zeichen in mind. einem Feld
function vbSucheDebounce() {
  if (vbTimer) clearTimeout(vbTimer);
  vbTimer = setTimeout(vbSuche, 300);
}
async function vbSuche() {
  const box = document.getElementById('vb-ergebnis'); if (!vbKontext || !box) return;
  const vor  = document.getElementById('vb-vorname').value.trim();
  const nach = document.getElementById('vb-nachname').value.trim();
  const geb  = document.getElementById('vb-geburt').value.trim();
  if (vor.length < 2 && nach.length < 2 && geb.length < 2) {
    box.innerHTML = `<p class="mv-legende">${t('vb_min_zeichen')}</p>`; return;
  }
  box.innerHTML = `<p class="mv-legende">…</p>`;
  const { data, error } = await sbClient.rpc('personen_suche', {
    p_vorname: vor || null, p_nachname: nach || null, p_geburt: geb || null, p_limit: 30, p_offset: 0
  });
  if (!vbKontext) return;   // Modal zwischenzeitlich geschlossen
  if (error) { box.innerHTML = `<p class="login-fehler" style="display:block">${escapeHtml(t('reg_fehler') + error.message)}</p>`; return; }
  const liste = (data || []).filter(r => r.id !== vbKontext.uuid);   // sich selbst ausblenden
  if (!liste.length) { box.innerHTML = `<p class="mv-legende">${t('vb_keine_treffer')}</p>`; return; }
  box.innerHTML = liste.map(vbErgebnisHtml).join('');
}
function vbErgebnisHtml(r) {
  const det = [];
  if (r.birth_date) det.push(`* ${escapeHtml(formatDatumLang(r.birth_date) || r.birth_date)}`);
  if (r.death_date) det.push(`† ${escapeHtml(formatDatumLang(r.death_date) || r.death_date)}`);
  if (r.baum)    det.push(`${escapeHtml(t('merge_info_baum'))}: ${escapeHtml(nm(r.baum))}`);
  if (r.eltern)  det.push(`${escapeHtml(t('merge_info_eltern'))}: ${escapeHtml(nm(r.eltern))}`);
  if (r.partner) det.push(`${escapeHtml(t('merge_info_partner'))}: ${escapeHtml(nm(r.partner))}`);
  return `<div class="mg-kandidat">
    <div class="mg-person"><span class="mg-namen">${escapeHtml(nm(r.name || ''))}${r.identitaet_id ? ' 🔗' : ''}</span>
      <span style="display:block;font-size:12px;opacity:.72;margin-top:2px">${det.join(' · ')}</span></div>
    <button class="mv-toggle" type="button" onclick="vbVerknuepfe('${r.id}')">${escapeHtml(t('vb_verknuepfen'))}</button>
  </div>`;
}
function vbFehlerText(msg) {
  msg = msg || '';
  if (/vkn_selbst/.test(msg))          return t('vkn_selbst');
  if (/vkn_zyklus/.test(msg))          return t('vkn_zyklus');
  if (/vkn_kante_existiert/.test(msg)) return t('vkn_kante_existiert');
  return t('reg_fehler') + msg;
}
// Bestehende Person als gewählten Beziehungstyp verknüpfen (Cycle/Dup prüft die RPC).
async function vbVerknuepfe(zielId) {
  if (!vbKontext) return;
  const fehler = document.getElementById('vb-fehler'); fehler.style.display = 'none';
  let kontext = vbKontext.uuid, typ = vbKontext.typ, zweiter = null;

  if (typ === 'geschwister') {
    // Geschwister = gleiche Eltern: ziel als Kind der Eltern des Kontexts hängen
    const p = aktuelleDaten.persons[vbKontext.personId];
    const elternUuids = [];
    ((p && p.families_child) || []).forEach(fid => {
      const fam = aktuelleDaten.families[fid]; if (!fam) return;
      [fam.husband, fam.wife].forEach(pe => {
        const par = pe && aktuelleDaten.persons[pe];
        if (par && par._uuid && !elternUuids.includes(par._uuid)) elternUuids.push(par._uuid);
      });
    });
    if (!elternUuids.length) { fehler.textContent = t('pa_geschwister_keine_eltern'); fehler.style.display = 'block'; return; }
    kontext = elternUuids[0]; typ = 'kind'; zweiter = elternUuids[1] || null;
  } else if (typ === 'kind' && vbSpouses.length) {
    zweiter = (vbSpouses.length === 1) ? vbSpouses[0].uuid
            : (document.getElementById('vb-elternteil2').value || null);
  }

  const { data, error } = await sbClient.rpc('verknuepfung_anfragen', {
    p_modus: 'beziehung', p_kontext: kontext, p_ziel: zielId, p_typ: typ, p_zweiter: zweiter
  });
  if (error) { fehler.textContent = vbFehlerText(error.message); fehler.style.display = 'block'; return; }
  // Kind in alle Bäume beider Eltern spiegeln (Kind = ziel bei "kind", = kontext bei "elternteil").
  const childId = (typ === 'kind') ? zielId : (typ === 'elternteil') ? kontext : null;
  const fokus = vbKontext.personId;
  schliesseVerbinden();
  if (data === 'sofort') {
    if (childId) { try { await sbClient.rpc('kind_baeume_sync', { p_kind: childId }); } catch (e) { console.warn('kind_baeume_sync:', e); } }
    if (typeof reloadBaumBehalteFokus === 'function') await reloadBaumBehalteFokus(fokus);
  }
  await zeigeHinweis(t(data === 'sofort' ? 'vkn_sofort' : 'vkn_angefragt'));
}

// Aus dem Detail-Overlay heraus: neue Person im Kontext der aktiven Person anlegen.
// vorTyp (optional): Beziehung vorbelegen ('kind'|'elternteil'|'partner'|'geschwister') — änderbar.
function zeigePersonHinzufuegen(personId, vorTyp) {
  if (!istAdmin()) return;
  const p = aktuelleDaten.persons[personId];
  if (!p) return;
  schliesseModal();   // immer nur EIN Overlay aktiv
  // Länder-Dropdowns (Geburtsland / Wohnland) in aktueller Sprache füllen
  // (zentrale Komponente; wie Registrier-/Familieneinstellungen-Modal).
  fuelleLandSelects(document.getElementById('person-add-modal'));
  document.getElementById('pa-context-id').value = personId;
  document.getElementById('pa-kontext').textContent =
    t('pa_kontext', { name: nm(p.name || p.given || '?') });
  // Alle Eingabefelder leeren
  ['pa-vorname','pa-nachname','pa-geburtsdatum','pa-geburtsort','pa-geburtsland','pa-sterbedatum',
   'pa-stadt','pa-gemeinde',
   'pa-titel','pa-namenszusatz','pa-ehename','pa-getauft','pa-hochzeitsort',
   'pa-hochzeit-standesamt','pa-hochzeit-kirchlich','pa-beziehung-sonstige',
   'pa-email','pa-telefon','pa-facebook','pa-instagram',
   'pa-wohnland','pa-wohnstadt','pa-adresse','pa-beruf','pa-ausbildung','pa-beschreibung']
    .forEach(id => document.getElementById(id).value = '');
  ['pa-geburtsdatum','pa-sterbedatum','pa-getauft','pa-hochzeit-standesamt','pa-hochzeit-kirchlich']
    .forEach(id => datumSetzen(document.getElementById(id), ''));   // Datumsfelder + iso zurücksetzen
  document.getElementById('pa-geschlecht').value = '';
  document.getElementById('pa-status').value = 'lebend';
  document.getElementById('pa-beziehung').value = 'unbekannt';
  document.getElementById('pa-beziehungstyp').value =
    ['kind','elternteil','partner','geschwister'].includes(vorTyp) ? vorTyp : 'kind';

  // Ehepartner der aktiven Person ermitteln (für die Eltern-Vorbelegung bei "Kind")
  paSpouses = [];
  (p.families_spouse || []).forEach(fid => {
    const fam = aktuelleDaten.families[fid]; if (!fam) return;
    const partnerExt = fam.husband === personId ? fam.wife : fam.husband;
    const partner = partnerExt ? aktuelleDaten.persons[partnerExt] : null;
    if (partner && partner._uuid) paSpouses.push({ uuid: partner._uuid, name: nm(partner.name || partner.given || '?') });
  });
  // Vater/Mutter VORBELEGEN: Kontextperson nach Geschlecht (F -> Mutter, sonst Vater),
  // eindeutigen Ehepartner in den anderen Slot. Beides bleibt änderbar/entfernbar.
  paVater = null; paMutter = null;
  const ctxRolle = (p.sex || '').toUpperCase() === 'F' ? 'mutter' : 'vater';
  paSetzeElternteil(ctxRolle, p._uuid, nm(p.name || p.given || '?'));
  const andereRolle = ctxRolle === 'vater' ? 'mutter' : 'vater';
  if (paSpouses.length === 1) paSetzeElternteil(andereRolle, paSpouses[0].uuid, paSpouses[0].name);
  else paSetzeElternteil(andereRolle, null, null);

  document.getElementById('pa-fehler').style.display = 'none';
  document.getElementById('pa-erfolg').style.display = 'none';
  paPruefeFelder();
  // Hilfe nur beim ersten Mal automatisch zeigen (dismissible)
  let gesehen = false;
  try { gesehen = localStorage.getItem('hasSeenTreeHelp') === 'true'; } catch (e) {}
  document.getElementById('pa-hilfe').style.display = gesehen ? 'none' : 'block';
  document.getElementById('person-add-modal').classList.add('aktiv');
}

function paPruefeFelder() {
  const verstorben = document.getElementById('pa-status').value === 'verstorben';
  document.getElementById('pa-row-sterbedatum').style.display = verstorben ? '' : 'none';
  // Beziehung (Ehe -> Hochzeitsfelder, Sonstige -> Freitext)
  const bez = document.getElementById('pa-beziehung').value;
  const ehe = bez === 'verheiratet';
  document.getElementById('pa-row-hochzeitsort').style.display = ehe ? '' : 'none';
  document.getElementById('pa-row-standesamt').style.display   = ehe ? '' : 'none';
  document.getElementById('pa-row-kirchlich').style.display    = ehe ? '' : 'none';
  document.getElementById('pa-row-sonstige').style.display     = (bez === 'sonstige') ? '' : 'none';
  // Vater/Mutter-Block nur bei "Kind"
  const typ = document.getElementById('pa-beziehungstyp').value;
  document.getElementById('pa-eltern-block').style.display = (typ === 'kind') ? '' : 'none';
}

// --- Vater/Mutter-Picker (durchsuchbar über aktuellen + verknüpfte Bäume) ---
// rolle = 'vater' | 'mutter'. Setzt/löscht die Auswahl und schaltet zwischen
// Such-Eingabe und gewählter "Chip"-Anzeige um.
function paSetzeElternteil(rolle, uuid, name) {
  const obj = uuid ? { uuid, name } : null;
  if (rolle === 'vater') paVater = obj; else paMutter = obj;
  const chip  = document.getElementById('pa-' + rolle + '-chip');
  const suche = document.getElementById('pa-' + rolle + '-suche');
  const erg   = document.getElementById('pa-' + rolle + '-erg');
  if (!chip || !suche || !erg) return;
  erg.innerHTML = ''; suche.value = '';
  if (obj) {
    document.getElementById('pa-' + rolle + '-name').textContent = name || '';
    chip.style.display = 'flex'; suche.style.display = 'none';
  } else {
    chip.style.display = 'none'; suche.style.display = '';
  }
}
function paEntferneElternteil(rolle) { paSetzeElternteil(rolle, null, null); }
function paElternSucheDebounce(rolle) {
  if (paElternTimer) clearTimeout(paElternTimer);
  paElternTimer = setTimeout(() => paElternSuche(rolle), 300);
}
async function paElternSuche(rolle) {
  const erg = document.getElementById('pa-' + rolle + '-erg');
  const q = document.getElementById('pa-' + rolle + '-suche').value.trim();
  if (q.length < 2) { erg.innerHTML = ''; return; }
  erg.innerHTML = `<div class="pa-elt-opt" style="cursor:default;opacity:.6">…</div>`;
  // personen_suche AND-et Vor-/Nachname -> für eine Box je eine Präfix-Suche und mergen.
  const [r1, r2] = await Promise.all([
    sbClient.rpc('personen_suche', { p_vorname: q, p_nachname: null, p_geburt: null, p_limit: 15, p_offset: 0 }),
    sbClient.rpc('personen_suche', { p_vorname: null, p_nachname: q, p_geburt: null, p_limit: 15, p_offset: 0 })
  ]);
  if (r1.error || r2.error) {
    erg.innerHTML = `<div class="pa-elt-opt" style="cursor:default;color:#b33">${escapeHtml((r1.error || r2.error).message)}</div>`; return;
  }
  const aktivUuid = (aktuelleDaten.persons[document.getElementById('pa-context-id').value] || {})._uuid;
  const andere = (rolle === 'vater' ? paMutter : paVater);
  const seen = new Set(); const liste = [];
  [...(r1.data || []), ...(r2.data || [])].forEach(rw => {
    if (seen.has(rw.id)) return; seen.add(rw.id);
    if (rw.id === aktivUuid) return;                 // Kontext (= Kind-Bezug) nicht als Elternteil
    if (andere && rw.id === andere.uuid) return;     // bereits als anderer Elternteil gewählt
    liste.push(rw);
  });
  if (!liste.length) { erg.innerHTML = `<div class="pa-elt-opt" style="cursor:default;opacity:.6">${escapeHtml(t('vb_keine_treffer'))}</div>`; return; }
  // Namen NICHT durchs onclick-Attribut schleusen (Quote-Injection) -> Lookup über id.
  paElternTreffer = {};
  erg.innerHTML = liste.slice(0, 20).map(rw => {
    paElternTreffer[rw.id] = nm(rw.name || '');
    const det = [];
    if (rw.birth_date) det.push('* ' + escapeHtml(formatDatumLang(rw.birth_date) || rw.birth_date));
    if (rw.baum)       det.push(escapeHtml(nm(rw.baum)));
    return `<div class="pa-elt-opt" onclick="paWaehleErgebnis('${rolle}','${rw.id}')">${escapeHtml(nm(rw.name || ''))}${rw.identitaet_id ? ' 🔗' : ''}<span class="pa-elt-meta">${det.join(' · ')}</span></div>`;
  }).join('');
}
function paWaehleErgebnis(rolle, uuid) { paSetzeElternteil(rolle, uuid, paElternTreffer[uuid] || ''); }

function schliessePersonAdd() {
  document.getElementById('person-add-modal').classList.remove('aktiv');
}

async function speichereNeuePerson() {
  if (!istAdmin()) return;
  const fehlerEl = document.getElementById('pa-fehler');
  const erfolgEl = document.getElementById('pa-erfolg');
  const button   = document.getElementById('pa-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';

  const aktivId = document.getElementById('pa-context-id').value;
  const aktiv   = aktuelleDaten.persons[aktivId];
  if (!aktiv || !aktiv._uuid) { fehlerEl.textContent = t('pa_kein_kontext'); fehlerEl.style.display = 'block'; return; }

  const v  = id => document.getElementById(id).value.trim();
  const vd = id => datumWert(document.getElementById(id));   // Datumsfelder -> ISO/Freitext
  const vorname = v('pa-vorname');
  if (!vorname) { fehlerEl.textContent = t('pa_pflicht'); fehlerEl.style.display = 'block'; return; }
  // Kontakt-E-Mail (optional) muss gültig sein, falls gesetzt
  if (!pruefeEmailFeld(document.getElementById('pa-email'), false)) {
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('pa-email').focus(); return;
  }

  const typ        = document.getElementById('pa-beziehungstyp').value;   // kind | elternteil | partner
  const verstorben = document.getElementById('pa-status').value === 'verstorben';
  const nachname   = v('pa-nachname') || aktiv.surname || '';
  const sex        = document.getElementById('pa-geschlecht').value || '';

  const altText = button.textContent;
  button.disabled = true; button.textContent = t('reg_senden_laeuft');

  // familie_id + stammbaum_id der aktiven Person frisch holen (für Besitz/Baum)
  const { data: kontext, error: kErr } = await sbClient.from('personen')
    .select('familie_id, stammbaum_id').eq('id', aktiv._uuid).single();
  if (kErr || !kontext) {
    button.disabled = false; button.textContent = altText;
    fehlerEl.textContent = t('reg_fehler') + (kErr ? kErr.message : '—'); fehlerEl.style.display = 'block'; return;
  }

  const ehe = document.getElementById('pa-beziehung').value;
  const externeId = 'I' + Date.now();
  const name = (vorname + ' ' + nachname).trim();
  const land = v('pa-geburtsland');
  const geb  = vd('pa-geburtsdatum');
  const stammbaum_daten = {
    id: externeId, given: vorname, surname: nachname, name, sex,
    titel: v('pa-titel'), namenszusatz: v('pa-namenszusatz'), ehename: v('pa-ehename'),
    birth_date: geb, birth_place: v('pa-geburtsort'),
    geburtsland: land, stadt: v('pa-stadt'), gemeinde: v('pa-gemeinde'),
    getauft: vd('pa-getauft'),
    hochzeitsort: v('pa-hochzeitsort'),
    hochzeit_standesamt: vd('pa-hochzeit-standesamt'),
    hochzeit_kirchlich: vd('pa-hochzeit-kirchlich'),
    beziehung: ehe, beziehung_sonstige: v('pa-beziehung-sonstige'),
    email: v('pa-email'), telefon: v('pa-telefon'), facebook: v('pa-facebook'), instagram: v('pa-instagram'),
    wohnort_land: v('pa-wohnland'), wohnort_stadt: v('pa-wohnstadt'), adresse: v('pa-adresse'),
    beruf: v('pa-beruf'), ausbildung: v('pa-ausbildung'), beschreibung: v('pa-beschreibung'),
    deceased: verstorben, death_date: verstorben ? vd('pa-sterbedatum') : '',
    angelegt_aus: 'stammbaum-anlegen'
  };

  // Eltern (bei "Kind") aus den Vater/Mutter-Feldern. Mindestens ein Elternteil nötig;
  // anschließend wird das Kind über kind_baeume_sync in alle Bäume beider Eltern gespiegelt.
  let elternUuids = [];
  if (typ === 'kind') {
    if (paVater) elternUuids.push(paVater.uuid);
    if (paMutter && (!paVater || paMutter.uuid !== paVater.uuid)) elternUuids.push(paMutter.uuid);
    if (!elternUuids.length) {
      button.disabled = false; button.textContent = altText;
      fehlerEl.textContent = t('pa_eltern_pflicht'); fehlerEl.style.display = 'block'; return;
    }
  }

  // Tatsächliches Anlegen (wird ausgeführt, wenn keine Dublette ODER der Nutzer "Trotzdem anlegen" wählt)
  async function doInsert() {
    button.disabled = true; button.textContent = t('reg_senden_laeuft');
    const { data: neu, error: pErr } = await sbClient.from('personen').insert({
      familie_id:   kontext.familie_id,
      stammbaum_id: kontext.stammbaum_id,
      externe_id:   externeId,
      vorname, nachname,
      geburtsdatum: null,           // Rohdatum bleibt in stammbaum_daten (Freitext)
      stammbaum_daten
    }).select('id').single();
    if (pErr) {
      button.disabled = false; button.textContent = altText;
      fehlerEl.textContent = t('reg_fehler') + pErr.message; fehlerEl.style.display = 'block'; return;
    }
    const fid = kontext.familie_id;
    const bezRows = [];
    if (typ === 'elternteil') {
      bezRows.push({ person_a: neu.id, person_b: aktiv._uuid, typ: 'elternteil', familie_id: fid });
    } else if (typ === 'partner') {
      bezRows.push({ person_a: aktiv._uuid, person_b: neu.id, typ: 'ehepartner', familie_id: fid });
    } else if (typ === 'geschwister') {
      // gleiche Eltern wie die aktive Person -> Eltern der aktiven Person als Elternteil setzen
      const geschwisterEltern = [];
      (aktiv.families_child || []).forEach(famId => {
        const fam = aktuelleDaten.families[famId]; if (!fam) return;
        [fam.husband, fam.wife].forEach(pe => {
          const par = pe && aktuelleDaten.persons[pe];
          if (par && par._uuid && !geschwisterEltern.includes(par._uuid)) geschwisterEltern.push(par._uuid);
        });
      });
      geschwisterEltern.forEach(pu => bezRows.push({ person_a: pu, person_b: neu.id, typ: 'elternteil', familie_id: fid }));
    } else { // kind: an die gewählten Eltern (Vater/Mutter) hängen
      elternUuids.forEach(pu => bezRows.push({ person_a: pu, person_b: neu.id, typ: 'elternteil', familie_id: fid }));
    }
    if (!bezRows.length) {
      // Geschwister ohne bekannte Eltern: Person bleibt zunächst lose -> Hinweis
      button.disabled = false; button.textContent = altText;
      fehlerEl.textContent = t('pa_geschwister_keine_eltern'); fehlerEl.style.display = 'block';
      await reloadBaumBehalteFokus(aktivId);
      return;
    }
    const { error: bErr } = await sbClient.from('beziehungen').insert(bezRows);
    button.disabled = false; button.textContent = altText;
    if (bErr) { fehlerEl.textContent = t('reg_fehler') + bErr.message; fehlerEl.style.display = 'block'; return; }
    // Kind in ALLE Bäume beider Eltern spiegeln (Sichtbarkeit). Löschen ist identitätsbewusst
    // (loeschePerson entfernt alle Zwillinge) -> kein „zweimal löschen".
    if (typ === 'kind') {
      try { await sbClient.rpc('kind_baeume_sync', { p_kind: neu.id }); }
      catch (e) { console.warn('kind_baeume_sync:', e); }
    }
    erfolgEl.textContent = t('pa_erfolg'); erfolgEl.style.display = 'block';
    await reloadBaumBehalteFokus(aktivId);
    // Heirat mit NEUEM Nachnamen -> eigenen Zweigbaum anbieten (Vorschlag + Bestätigung)
    if (typ === 'partner') await pruefeHeiratsZweig(neu.id, aktiv, nachname);
    setTimeout(() => schliessePersonAdd(), 800);
  }

  // DUBLETTEN-FRÜHERKENNUNG: existiert dieselbe Person (Vor/Nach/Geburtsdatum/Geburtsland) bereits?
  const { data: matches } = await sbClient.rpc('dubletten_check_global', {
    p_vorname: vorname, p_nachname: nachname, p_birth_date: geb, p_land: land, p_exclude_person: null
  });
  button.disabled = false; button.textContent = altText;
  if (matches && matches.length) {
    zeigeDublettenDialog(matches, {
      modus: 'beziehung',
      kontext: (typ === 'kind') ? (elternUuids[0] || aktiv._uuid) : aktiv._uuid,
      typ,
      zweiter: (typ === 'kind') ? (elternUuids[1] || null) : null,
      proceed: doInsert,
      onLinked: async () => { await reloadBaumBehalteFokus(aktivId); schliessePersonAdd(); }
    });
    return;
  }
  await doInsert();
}

// Nachname diakritik-/groß-klein-unempfindlich normalisieren (Frontend-Vorprüfung;
// die RPC-seitige Prüfung nutzt merge_norm und ist die verbindliche Instanz).
function zweigNachnameNorm(s) {
  return (s || '').toString().trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '');   // Diakritika entfernen
}

// Heirat mit NEUEM Nachnamen erkennen und – nach Bestätigung – einen eigenen
// Stammbaum für diese Linie anlegen (gleiche Familie/gleicher Verbund; Personen
// werden als gleiche Person gespiegelt). Der aktuell geöffnete Baum wird NICHT
// gewechselt (CLAUDE.md), die Baumliste/Dropdown aber aktualisiert.
async function pruefeHeiratsZweig(partnerUuid, ehePerson, partnerNachname) {
  if (!istAdmin()) return;
  const neuName = (partnerNachname || '').trim();
  if (!neuName) return;
  // Gleicher Nachname wie der/die Ehepartner:in -> kein neuer Zweig nötig
  if (zweigNachnameNorm(neuName) === zweigNachnameNorm(ehePerson && ehePerson.surname)) return;
  // Existiert im Verbund (geladene Baumliste) bereits ein Baum dieses Nachnamens? -> nicht anbieten
  const vorhanden = Object.values(stammbaeumeListe || {})
    .some(n => zweigNachnameNorm(n) === zweigNachnameNorm(neuName));
  if (vorhanden) return;

  const ok = await zeigeBestaetigung(t('zweig_frage', { name: nm(neuName) }));
  if (!ok) return;

  const { data, error } = await sbClient.rpc('stammbaum_zweig_aus_heirat', {
    p_wurzel:  partnerUuid,
    p_partner: ehePerson._uuid,
    p_name:    neuName
  });
  if (error) {
    // Verbund hatte den Baum schon (Race) oder anderer Fehler -> klare Meldung
    const msg = error.message && error.message.includes('zweig_existiert')
      ? t('zweig_existiert') : (t('reg_fehler') + (error.message || '—'));
    await zeigeHinweis(msg);
    return;
  }
  // Baumliste/Dropdown frisch ziehen; ladeBaumDaten behält den aktuellen Baum.
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  await zeigeHinweis(t('zweig_erstellt', { name: nm(neuName) }));
}

// Person + zugehörige Beziehungen löschen (mit Bestätigung). Keine verwaisten Beziehungen.
async function loeschePerson(personId) {
  if (!istAdmin()) return;
  const p = aktuelleDaten.persons[personId];
  if (!p || !p._uuid) return;

  // IDENTITÄTSBEWUSST: Alle Karten DERSELBEN realen Person (identitaet_id-Zwillinge über
  // alle Bäume) werden GEMEINSAM gelöscht. So verschwindet die Person nach EINEM Löschen
  // NIRGENDWO mehr (Backend + alle Bäume + GUI) — kein „zweimal löschen" bei Spiegelkarten.
  const alleUuids = p._ident
    ? [...new Set(Object.values(aktuelleDaten.persons)
        .filter(x => x._ident === p._ident && x._uuid).map(x => x._uuid))]
    : [p._uuid];
  const delSet = new Set(alleUuids);

  // Welche Bäume würden durch das Löschen LEER? (Owner-Gate + kontoschonende Auto-Bereinigung)
  const betroffeneBaeume = [...new Set(Object.values(aktuelleDaten.persons)
    .filter(x => delSet.has(x._uuid) && x._tree).map(x => x._tree))];
  const leereBaeume = betroffeneBaeume.filter(tid =>
    Object.values(aktuelleDaten.persons).filter(x => x._tree === tid && !delSet.has(x._uuid)).length === 0);
  const leertBaum = leereBaeume.length > 0;

  if (leertBaum) {
    // Owner-Exklusivrecht: nur familien_owner / super_admin dürfen einen Baum (durch Löschen
    // seiner letzten Person) leeren. Server prüft zusätzlich (RPC).
    const darf = istSuperAdmin() || normalizeRolle(aktuelleRolle || '') === 'familien_owner';
    if (!darf) { await zeigeHinweis(t('auto_leer_nur_owner')); return; }
    const ok = await zeigeBestaetigung(t('auto_leer_warnung'),
      { jaText: t('auto_leer_ja'), neinText: t('abbrechen'), gefahr: true });
    if (!ok) return;
  } else {
    const ok = await zeigeBestaetigung(t('pa_loeschen_frage') + '\n\n' + nm(p.name || p.given || '?'));
    if (!ok) return;
  }

  // Fokus-Fallback bestimmen, bevor die Person verschwindet (nur relevant, wenn kein Baum geleert wird)
  let fallback = null;
  if (!leertBaum) {
    (p.families_spouse || []).forEach(fid => {
      const fam = aktuelleDaten.families[fid]; if (!fam) return;
      const partner = fam.husband === personId ? fam.wife : fam.husband;
      if (partner && aktuelleDaten.persons[partner]) fallback = fallback || partner;
      (fam.children || []).forEach(c => { if (aktuelleDaten.persons[c]) fallback = fallback || c; });
    });
    (p.families_child || []).forEach(fid => {
      const fam = aktuelleDaten.families[fid]; if (!fam) return;
      if (fam.husband && aktuelleDaten.persons[fam.husband]) fallback = fallback || fam.husband;
      if (fam.wife && aktuelleDaten.persons[fam.wife]) fallback = fallback || fam.wife;
    });
  }

  // 1) Alle Beziehungen ALLER betroffenen Karten entfernen (keine verwaisten Kanten)
  let relErr = (await sbClient.from('beziehungen').delete().in('person_a', alleUuids)).error;
  if (!relErr) relErr = (await sbClient.from('beziehungen').delete().in('person_b', alleUuids)).error;
  if (relErr) { await zeigeHinweis(t('reg_fehler') + relErr.message); return; }

  // 2) Die Personen-Karten selbst löschen (alle Zwillinge auf einmal)
  const { error: pErr } = await sbClient.from('personen').delete().in('id', alleUuids);
  if (pErr) { await zeigeHinweis(t('reg_fehler') + pErr.message); return; }

  schliesseModal();

  if (leertBaum) {
    // 3) Leer gewordene Bäume kontoschonend auto-löschen (Sweep räumt ALLE leeren Bäume).
    let dErr = null;
    try { dErr = (await sbClient.rpc('auto_leere_baeume_aufraeumen')).error; }
    catch (e) { dErr = e; }
    if (dErr) {
      // z. B. 'wartung_aktiv' -> Personen sind weg, Baum bleibt (vorübergehend) leer.
      const msg = /wartung_aktiv/i.test(dErr.message || '') ? t('auto_leer_wartung') : (t('reg_fehler') + (dErr.message || ''));
      await reloadBaumBehalteFokus(null);
      await zeigeHinweis(msg);
      return;
    }
    // 4) Storage-Medien gelöschter Events abräumen (DB kann das nicht)
    await raeumeVerwaisteMedien();
    // 5) Navigation nur, wenn der AKTUELL geöffnete Baum geleert wurde
    if (leereBaeume.includes(aktuellerStammbaumId)) await navigiereNachBaumLoeschung(aktuellerStammbaumId);
    else await reloadBaumBehalteFokus(fallback);
    await zeigeHinweis(t('auto_leer_erfolg'));
  } else {
    await reloadBaumBehalteFokus(fallback);
    await zeigeHinweis(t('pa_geloescht'));
  }
}

// Nach einer Baum-Auto-Löschung: frisch laden und sinnvoll navigieren.
// Reihenfolge laut Spec: zuletzt genutzter Baum -> Standard/größter -> sonst "Kreiraj novo stablo".
async function navigiereNachBaumLoeschung(geloeschterTreeId) {
  // Nur weg-navigieren, wenn der AKTUELLE Baum gelöscht wurde; ein anderer geleerter
  // Baum lässt den Nutzer dort, wo er ist (CLAUDE.md: Baum nicht automatisch wechseln).
  if (aktuellerStammbaumId === geloeschterTreeId) aktuellerStammbaumId = null;
  try {
    if (localStorage.getItem('vidovic_tree') === geloeschterTreeId) localStorage.removeItem('vidovic_tree');
  } catch (e) {}
  await setzeUser(aktuellerUser);   // Rollen/Bäume frisch laden; ladeBaumDaten wählt zuletzt>größter
  // Kein zugänglicher Baum mehr -> Anlegen-Overlay anbieten
  if (!aktuellerStammbaumId && Object.keys(stammbaeumeListe || {}).length === 0) {
    zeigeBaumNeu();
  }
}

// Storage-Bucket `events` von Medien gelöschter Bäume befreien (Queue verwaiste_event_medien).
// Postgres kann den Storage nicht löschen -> DB merkt die Event-ids vor, hier wird abgeräumt.
async function raeumeVerwaisteMedien() {
  if (!aktuellerUser) return;
  let offen = [];
  try {
    const { data, error } = await sbClient.rpc('verwaiste_medien_offen');
    if (error) return;
    offen = data || [];
  } catch (e) { return; }
  for (const row of offen) {
    try { await loescheEventMedien(row.event_id); } catch (e) { /* Storage-Fehler ignorieren */ }
    try { await sbClient.rpc('verwaiste_medien_erledigt', { p_id: row.id }); } catch (e) {}
  }
}

function schliesseModalUndZeigeBaum(personId) {
  schliesseModal();
  const p = aktuelleDaten.persons[personId];
  // Multi-Tree: gehört die Person zu einem anderen Baum -> dorthin wechseln
  if (p && p._tree && p._tree !== aktuellerStammbaumId) {
    aktuellerStammbaumId = p._tree;
    const sel = document.getElementById('tree-select');
    if (sel) sel.value = p._tree;
  }
  fokusPersonId = personId;
  document.getElementById('suche').value = '';
  wechselAnsicht('baum');
  zeichneBaum(personId);   // setzt den Kopf passend (aktualisiereKopf)
  aktualisiereBaumHinweis();
}

// ============================================================
function wechselAnsicht(name) {
  aktuelleAnsicht = name;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('aktiv', t.dataset.ansicht === name);
  });
  document.getElementById('ansicht-karten').style.display = name === 'karten' ? 'block' : 'none';
  document.getElementById('ansicht-shorts').style.display = name === 'shorts' ? 'block' : 'none';
  document.getElementById('ansicht-baum').style.display = name === 'baum' ? 'block' : 'none';

  aktualisiereSucheZustand(name);   // Suchfeld kontextabhängig aktivieren/deaktivieren

  if (name === 'baum') {
    const suche = document.getElementById('suche').value.trim();
    if (suche) {
      suchImBaum(suche);
    } else if (!fokusPersonId) {
      zeichneBaum(aktuelleWurzel(), 12, 0);
    }
  } else if (name === 'karten') {
    zeigeKarten();
  } else if (name === 'shorts') {
    zeigeShorts();
  }
}

// ============================================================
// STAMMBAUM (d3.js)
// ============================================================
let baumSvg, baumG, zoom, fitTransform = null;
// Welt-Bounding-Box des aktuell gezeichneten Baums ([[xMin,yMin],[xMax,yMax]]) für die
// Pan-Begrenzung; in zeichneBaum gesetzt. Mind. so viele Pixel des Baums bleiben sichtbar:
let baumPanGrenze = null;
const PAN_MIN_SICHTBAR = 90;   // ≈ eine halbe Personenkarte

function initBaum() {
  baumSvg = d3.select('#baum-svg');
  baumG = baumSvg.append('g');

  zoom = d3.zoom()
    .scaleExtent([0.05, 3.0])
    // Viewport = aktuelle Container-Größe (Funktion -> passt sich Resize/Drehung automatisch an)
    .extent(() => {
      const c = document.getElementById('baum-container').getBoundingClientRect();
      return [[0, 0], [c.width, c.height]];
    })
    // Pan-Begrenzung: der Baum darf NIE vollständig aus dem Sichtbereich geschoben
    // werden. baumPanGrenze (in zeichneBaum gesetzt) ist die Bounding-Box aller Karten
    // in Welt-Koordinaten; wir erzwingen, dass davon immer mind. PAN_MIN_SICHTBAR Pixel
    // im Viewport bleiben. Identisch für Desktop & Touch, bei JEDEM Zoom-Level. Greift NUR
    // bei interaktiven Gesten (programmatische Fit-/Zentrier-Transforms bleiben unangetastet).
    .constrain((transform, extent, translateExtent) => {
      const te = baumPanGrenze;
      if (!te) return transform;
      const M = PAN_MIN_SICHTBAR;
      const sx0 = transform.applyX(te[0][0]), sx1 = transform.applyX(te[1][0]);
      const sy0 = transform.applyY(te[0][1]), sy1 = transform.applyY(te[1][1]);
      const ex0 = extent[0][0], ey0 = extent[0][1], ex1 = extent[1][0], ey1 = extent[1][1];
      let dx = 0, dy = 0;
      if (sx1 < ex0 + M) dx = (ex0 + M) - sx1;        // Baum zu weit links  -> nach rechts
      else if (sx0 > ex1 - M) dx = (ex1 - M) - sx0;   // Baum zu weit rechts -> nach links
      if (sy1 < ey0 + M) dy = (ey0 + M) - sy1;        // Baum zu weit oben   -> nach unten
      else if (sy0 > ey1 - M) dy = (ey1 - M) - sy0;   // Baum zu weit unten  -> nach oben
      return (dx || dy) ? transform.translate(dx / transform.k, dy / transform.k) : transform;
    })
    .on('zoom', e => {
      baumG.attr('transform', e.transform);
      // Boxfeste Schrift (passt sich NICHT mehr per 1/k an -> kein Überlauf). Beim Rauszoomen
      // werden die Datumszeilen ausgeblendet (sonst zu klein/unleserlich -> reinzoomen).
      const k = e.transform.k;
      baumG.selectAll('.daten-text').style('display', k < 0.3 ? 'none' : null);
    });
  baumSvg.call(zoom);

  // Doppelklick → zurück zur Fit-Ansicht
  baumSvg.on('dblclick.zoom', null);
  baumSvg.on('dblclick', function() {
    if (fitTransform) {
      baumSvg.transition().duration(500).call(zoom.transform, fitTransform);
    }
  });
}

// „Stammbaum zentrieren"-Button + Fallback: Zoom auf Fit zurücksetzen, Baum mittig auf
// die Blutlinie/Hauptperson ausrichten. Falls (noch) keine Fit-Transform existiert
// (z. B. ungültiger Zustand), wird der Baum frisch gezeichnet.
function zentriereBaumAnsicht() {
  if (fitTransform && baumSvg && zoom) {
    baumSvg.transition().duration(500).call(zoom.transform, fitTransform);
  } else {
    zeichneBaumNeu();
  }
}

function zeichneBaum(rootPersonId, tiefeUnten = 2, tiefeOben = 2) {
  baumG.selectAll('*').remove();

  const wurzel = baueBaumDaten(rootPersonId, tiefeUnten, tiefeOben);
  if (!wurzel) return;

  // Kopf an den aktuell angezeigten Stammbaum anpassen (#4: z.B. Petrović)
  aktualisiereKopf(rootPersonId);
  
  const containerB = document.getElementById('baum-container').getBoundingClientRect();
  const breite = containerB.width;
  const hoehe = containerB.height;
  
  // Reingold-Tilford via d3.tree().
  // nodeSize[0]=370: Pärchen-Breite (2×152 + Versatz ≈ 310) + Puffer → kein Überlapp.
  // nodeSize[1]=170: vertikaler Abstand passend zur höheren Karte (76px).
  const treeLayout = d3.tree()
    .nodeSize([370, 170])
    .separation((a, b) => a.parent === b.parent ? 1.0 : 1.4);
  const wurzelNode = d3.hierarchy(wurzel);
  treeLayout(wurzelNode);

  // y-Koordinaten negieren → Baum wächst von unten nach oben
  wurzelNode.each(d => { d.y = -d.y; });

  // Kollisions-Check (Konsolen-Warnung bei Überlapp, sollte nicht vorkommen)
  kollisionsPrüfung(wurzelNode);

  // Orthogonale T-Verbindungen (kein Bezier, kein Diagonalen)
  zeichneVerbindungen(wurzelNode);

  // ── Knoten: Hauptperson + Partner ──────────────────────────────
  const knoten = baumG.selectAll('.knoten-gruppe')
    .data(wurzelNode.descendants())
    .enter().append('g')
    .attr('class', d => 'knoten-gruppe' + (d.data.person.id === rootPersonId ? ' fokus' : ''))
    .attr('transform', d => `translate(${d.x},${d.y})`);

  knoten.each(function(d) {
    const g = d3.select(this);
    const p = d.data.person;
    const istBl = !!d.data.blutlinie;

    if (d.data.marriages && d.data.marriages.length >= 2) {
      const wife1 = d.data.marriages[0].partner;
      const wife2 = d.data.marriages[1].partner;
      if (wife1) g.append('line').attr('class', 'ehe-linie')
        .attr('x1', -6).attr('y1', 0).attr('x2', -156).attr('y2', 0);
      if (wife2) g.append('line').attr('class', 'ehe-linie')
        .attr('x1', 6).attr('y1', 0).attr('x2', 156).attr('y2', 0);
      zeichneKnotenBox(g, p, 0, p.id === rootPersonId, istBl);
      if (wife1) zeichneKnotenBox(g, wife1, -162, false, false);
      if (wife2) zeichneKnotenBox(g, wife2, 162, false, false);
    } else {
      const partners = d.data.partners;
      const N = partners.length;
      const offset = i => -81 * N + 162 * i;
      for (let i = 0; i < N; i++) {
        g.append('line').attr('class', 'ehe-linie')
          .attr('x1', offset(i) + 76).attr('y1', 0)
          .attr('x2', offset(i + 1) - 76).attr('y2', 0);
      }
      zeichneKnotenBox(g, p, offset(0), p.id === rootPersonId, istBl);
      partners.forEach((partner, i) => {
        zeichneKnotenBox(g, partner, offset(i + 1), false, false);
      });
    }
  });

  // Bounding Box: halbe Kartenbreite (76) + max. Partner-Versatz (81) ≈ 157 -> Puffer 170
  const allX = wurzelNode.descendants().map(d => d.x);
  const allY = wurzelNode.descendants().map(d => d.y);
  const tXMin = Math.min(...allX) - 170;
  const tXMax = Math.max(...allX) + 170;
  const tYMin = Math.min(...allY) - 42;
  const tYMax = Math.max(...allY) + 42;
  const tW = tXMax - tXMin, tH = tYMax - tYMin;

  // Auto-Fit: Blutlinie (x=0) auf die horizontale Mitte des Containers setzen.
  // Skala so wählen, dass der gesamte Baum in den Container passt.
  const pad = 0.03;
  const padPx = breite * pad;
  const fitT = hoehe * pad, fitH = hoehe * (1 - 2 * pad);

  // Beide Hälften (links / rechts von x=0) müssen in je eine Container-Hälfte passen.
  const hHalf = breite / 2 - padPx;
  const skala_h = Math.min(
    tXMax > 0 ? hHalf / tXMax : 5,
    tXMin < 0 ? hHalf / (-tXMin) : 5
  );
  const skala_v = fitH / tH;
  const skala = Math.min(skala_h, skala_v, 2.5);
  const tx = breite / 2;                                         // x=0 → Bildmitte
  const ty = fitT + (fitH - tH * skala) / 2 - tYMin * skala;

  // Zoom-Bereich: minZoom = Fit-Ansicht (90%), maxZoom = 3.0
  zoom.scaleExtent([skala * 0.9, 3.0]);

  // Pan-Begrenzung aktivieren: Welt-Bounding-Box des Baums (siehe constrain in initBaum).
  // So bleibt bei jeder Verschiebung mind. eine Karte sichtbar — der Baum kann nicht
  // komplett aus dem Bild geschoben werden. Wird bei jedem Neuzeichnen aktualisiert
  // (Personen hinzu/entfernt/verschoben => neue Box).
  baumPanGrenze = [[tXMin, tYMin], [tXMax, tYMax]];

  fitTransform = d3.zoomIdentity.translate(tx, ty).scale(skala);
  baumSvg.call(zoom.transform, fitTransform);

  // Datumszeilen nur ab gewisser Zoomstufe (Schrift selbst ist boxfest, siehe CSS).
  baumG.selectAll('.daten-text').style('display', skala < 0.3 ? 'none' : null);

  aktualisiereBaumInfo();
}

// Orthogonale T-Verbindungen: Eltern → Sammellinie → Kinder (kein Bezier, keine Diagonalen).
function zeichneVerbindungen(wurzelNode) {
  const HH = 38; // halbe Kartenhöhe (Box 76px)

  // Links nach (Eltern-ID + FamilienIndex) gruppieren
  const gruppen = new Map();
  wurzelNode.links().forEach(link => {
    const src = link.source;
    const famIdx = link.target.data.familyIndex ?? 0;
    const key = src.data.person.id + '_' + famIdx;
    if (!gruppen.has(key)) gruppen.set(key, { src, famIdx, targets: [] });
    gruppen.get(key).targets.push(link.target);
  });

  gruppen.forEach(({ src, famIdx, targets }) => {
    // Abstiegspunkt: Mitte der Heiratslinie des Elternpaares
    const istMehrehe = !!(src.data.marriages && src.data.marriages.length >= 2);
    const descentX = istMehrehe ? src.x + (famIdx === 0 ? -81 : 81) : src.x;

    const srcBottom = src.y + HH;
    const childTop  = targets[0].y - HH;
    const midY      = (srcBottom + childTop) / 2;

    const xs       = targets.map(t => t.x);
    const collXMin = Math.min(descentX, ...xs);
    const collXMax = Math.max(descentX, ...xs);

    // 1. Vertikale Linie: Elternteil → Sammelpunkt
    baumG.append('line').attr('class', 'verbindung')
      .attr('x1', descentX).attr('y1', srcBottom)
      .attr('x2', descentX).attr('y2', midY);
    // 2. Horizontale Sammellinie bei midY
    baumG.append('line').attr('class', 'verbindung')
      .attr('x1', collXMin).attr('y1', midY)
      .attr('x2', collXMax).attr('y2', midY);
    // 3. Vertikale Stubs zu jedem Kind
    targets.forEach(t => {
      baumG.append('line').attr('class', 'verbindung')
        .attr('x1', t.x).attr('y1', midY)
        .attr('x2', t.x).attr('y2', childTop);
    });
  });
}

// Kollisions-Check: Warnung wenn zwei Knotengruppen in derselben Generation überlappen.
function kollisionsPrüfung(wurzelNode) {
  const CW = 157; // halber Paar-Fußabdruck (Person ±76 + Partner-Versatz 81)
  const MIN_GAP = 20;

  const genMap = new Map();
  wurzelNode.each(d => {
    const gy = Math.round(d.y / 10) * 10;
    if (!genMap.has(gy)) genMap.set(gy, []);
    genMap.get(gy).push(d);
  });

  genMap.forEach((nodes, gy) => {
    nodes.sort((a, b) => a.x - b.x);
    for (let i = 0; i < nodes.length - 1; i++) {
      const a = nodes[i], b = nodes[i + 1];
      const gap = (b.x - CW) - (a.x + CW);
      if (gap < MIN_GAP) {
        console.warn(`Überlapp y≈${gy}: ${a.data.person.given} ↔ ${b.data.person.given}, Abstand=${gap.toFixed(0)}px`);
      }
    }
  });
}

// Mehrreihige Anordnung: >4 Kinder → 2 Zeilen, >8 → 3 Zeilen.
// ROW = 100 > (130 − 2×30 = 70) → kein Kartenüberlapp mit Enkeln der Parallelzeile.
// Enthält eine Gruppe ein Blutlinien-Kind, wird diese Gruppe so positioniert,
// dass das Blutlinien-Kind exakt unter dem Elternteil liegt (x = node.x).
function applyMehrZeilen(node) {
  if (!node.children || node.children.length <= 4) {
    if (node.children) node.children.forEach(applyMehrZeilen);
    return;
  }
  const N = node.children.length;
  const rows = N > 8 ? 3 : 2;
  const COL = 280;
  const ROW = 100;

  const xs = node.children.map(c => c.x);
  const centerX = (Math.min(...xs) + Math.max(...xs)) / 2;
  const baseY = node.children[0].y;

  const groups = Array.from({length: rows}, () => []);
  node.children.forEach((child, i) => {
    groups[Math.min(rows - 1, Math.floor(i * rows / N))].push(child);
  });

  groups.forEach((group, ri) => {
    const n = group.length;
    const rowY = baseY - ri * ROW;
    // Blutlinien-Kind in dieser Gruppe? → es wird auf x = node.x gesetzt
    const blIdx = group.findIndex(c => c.data.blutlinie);
    const startX = blIdx >= 0
      ? node.x - blIdx * COL          // Blutlinien-Kind genau unter Elternteil
      : centerX - (n - 1) * COL / 2;  // sonst zentriert
    group.forEach((child, j) => {
      const dx = startX + j * COL - child.x;
      const dy = rowY - child.y;
      child.each(d => { d.x += dx; d.y += dy; });
    });
  });

  node.children.forEach(applyMehrZeilen);
}

// Zeichnet eine Personen-Box an xOffset relativ zum Gruppen-Ursprung.
function zeichneKnotenBox(g, p, xOffset, istFokus, istBlutlinie) {
  const sex = p.sex;
  const klasse = sex === 'M' ? 'male' : (sex === 'F' ? 'female' : 'unknown');
  const extra = (istFokus ? ' fokus' : '') + (istBlutlinie ? ' blutlinie' : '');

  const box = g.append('g')
    .attr('class', 'knoten ' + klasse + extra)
    .attr('transform', `translate(${xOffset},0)`)
    .style('cursor', 'pointer')
    .on('click', () => zeigeDetails(p.id));

  // Karte: 130×60 px
  // Karte: 152×76 px (Mitte = 0,0)
  box.append('rect')
    .attr('x', -76).attr('y', -38)
    .attr('width', 152).attr('height', 76)
    .attr('rx', 6);

  // Zeilen aufbauen: Vorname (umbruchfähig), Nachname (umbruchfähig), Mädchenname (eigene
  // Zeile, kursiv), Geburts-/Sterbedatum. Boxfeste Schrift -> sinnvolle Umbrüche statt "…".
  const zeilen = [];
  umbrucheNamen(nm(p.given || '?'), 17).forEach(l => zeilen.push({ t: l, c: 'name-text' }));
  const sn = nm(p.surname || '');
  if (sn) umbrucheNamen(sn, 18).forEach(l => zeilen.push({ t: l, c: 'name-text' }));
  const mn = nm((p.ehename || '').trim());   // Mädchenname (Djevojačko prezime), optional
  if (mn) zeilen.push({ t: '(' + (mn.length > 16 ? mn.substring(0, 15) + '…' : mn) + ')', c: 'maiden-text' });
  if (p.birth_date || p.death_date) {
    let dat = p.birth_date ? '* ' + formatDatumLang(p.birth_date) : '';
    if (p.deceased || p.death_date) dat += (dat ? '  ' : '') + '† ' + (formatDatumLang(p.death_date) || '?');
    zeilen.push({ t: dat, c: 'daten-text' });
  }
  const LH = 15;
  const startY = -((zeilen.length - 1) * LH) / 2;
  zeilen.forEach((z, i) => {
    box.append('text').attr('class', z.c)
      .attr('text-anchor', 'middle').attr('y', startY + i * LH + 4)
      .text(z.t);
  });
}

// Namen sinnvoll umbrechen (an Leerzeichen), max. 2 Zeilen, sonst hart kürzen.
function umbrucheNamen(s, max) {
  s = (s || '').trim();
  if (!s) return [''];
  if (s.length <= max) return [s];
  const woerter = s.split(/\s+/);
  const zeilen = [];
  let akt = '';
  for (const w of woerter) {
    const kand = akt ? akt + ' ' + w : w;
    if (!akt || kand.length <= max) akt = kand;
    else { zeilen.push(akt); akt = w; }
  }
  if (akt) zeilen.push(akt);
  if (zeilen.length > 2) zeilen.length = 2;
  return zeilen.map(l => l.length > max + 1 ? l.substring(0, max) + '…' : l);
}

// Blutlinie: Tanasije → Simo → Marko (direkte Abstammungslinie)
const BLUTLINIE_IDS = new Set(['I500009', 'I500007', 'I500003']);
const BLUTLINIE_KINDER = { 'I500009': 'I500007', 'I500007': 'I500003' };

function baueBaumDaten(rootId, tiefeNachUnten = 2, tiefeNachOben = 2) {
  if (!aktuelleDaten.persons[rootId]) return null;

  // Multi-Tree (B2): auf den gewählten Stammbaum begrenzen. Ohne Auswahl (oder
  // ohne _tree-Daten) verhält es sich wie früher (alles verbunden).
  const treeId = aktuellerStammbaumId;
  const sameTree = (id) => {
    if (!treeId) return true;
    const p = aktuelleDaten.persons[id];
    return !!(p && p._tree === treeId);
  };

  // Gleiche reale Person über Bäume (identitaet_id): alle Karten einer Gruppe sammeln,
  // damit ihre Beziehungen (Ehepartner + Kinder) baumübergreifend zusammengeführt werden.
  const identGruppen = {};
  Object.values(aktuelleDaten.persons).forEach(q => {
    if (q._ident) (identGruppen[q._ident] = identGruppen[q._ident] || []).push(q.id);
  });
  const twinExtIds = (id) => {
    const p = aktuelleDaten.persons[id];
    if (!p || !p._ident) return [id];
    return identGruppen[p._ident] || [id];
  };
  // Kanonische Identität: verknüpfte Karten = EINE Person; sonst die Karte selbst.
  const kanonId = (id) => {
    const p = aktuelleDaten.persons[id];
    return (p && p._ident) ? ('grp:' + p._ident) : (id || '');
  };
  // Kind-Schlüssel innerhalb derselben Ehe: verknüpft -> Gruppe; sonst VORNAME.
  // (Kinder desselben Paares mit gleichem Vornamen = dieselbe Person — unabhängig von
  //  abweichendem Nachnamen (Mädchen-/Ehename) oder Datumsformat.)
  const childKey = (id) => {
    const p = aktuelleDaten.persons[id];
    if (p && p._ident) return 'grp:' + p._ident;
    if (!p) return 'x:' + id;
    return 'gn:' + (p.given || '').trim().toLowerCase();
  };

  function findeWurzel(personId, tiefe) {
    if (tiefe <= 0) return personId;
    const p = aktuelleDaten.persons[personId];
    if (!p || !p.families_child.length) return personId;
    const fam = aktuelleDaten.families[p.families_child[0]];
    if (!fam) return personId;
    // Elternteil im selben Baum bevorzugen; gibt es keinen -> hier ist die Wurzel
    let elternId = null;
    if (fam.husband && sameTree(fam.husband)) elternId = fam.husband;
    else if (fam.wife && sameTree(fam.wife)) elternId = fam.wife;
    if (!elternId || !aktuelleDaten.persons[elternId]) return personId;
    return findeWurzel(elternId, tiefe - 1);
  }

  const wurzelId = findeWurzel(rootId, tiefeNachOben);
  const besucht = new Set();

  function baueKnoten(personId, tiefe, gebrueckt) {
    if (besucht.has(personId)) return null;
    const twins = twinExtIds(personId);
    twins.forEach(tid => besucht.add(tid));   // Person + alle Zwillinge gelten als verarbeitet
    const p = aktuelleDaten.persons[personId];
    if (!p) return null;
    const myTwins = new Set(twins);
    const twinsGeordnet = [personId, ...twins.filter(t => t !== personId)];

    // Ehe-Familien ALLER Zwillingskarten sammeln, nach PARTNER (Identität ODER Vorname)
    // gruppieren und Kinder GLOBAL entdoppeln -> die verknüpfte Person hat in JEDEM Baum
    // exakt dieselben Kinder (auch wenn pro Baum nur Teile erfasst sind).
    const partnerSchluessel = (pid) => {
      const pp = aktuelleDaten.persons[pid];
      if (!pp) return null;
      return pp._ident ? ('grp:' + pp._ident) : ('gn:' + (pp.given || '').trim().toLowerCase());
    };
    const eheMap = new Map();                    // partnerKey -> { partnerId, partner, kinderIds, bruecke }
    const ohnePartner = { kinderIds: [], bruecke: false };
    const globalKinder = new Set();
    let hauptKey = null;
    twinsGeordnet.forEach(tid => {
      const tp = aktuelleDaten.persons[tid];
      if (!tp) return;
      const famBruecke = gebrueckt || tid !== personId || !sameTree(tid);
      (tp.families_spouse || []).forEach(famId => {
        const fam = aktuelleDaten.families[famId];
        if (!fam) return;
        const partnerId = myTwins.has(fam.husband) ? fam.wife : fam.husband;
        const pk = (partnerId && aktuelleDaten.persons[partnerId]) ? partnerSchluessel(partnerId) : null;
        let ziel;
        if (pk) {
          let e = eheMap.get(pk);
          if (!e) {
            const partner = (!besucht.has(partnerId)) ? aktuelleDaten.persons[partnerId] : null;
            e = { partnerId, partner, kinderIds: [], bruecke: famBruecke };
            eheMap.set(pk, e);
            if (hauptKey === null) hauptKey = pk;
          } else { e.bruecke = e.bruecke || famBruecke; }
          ziel = e;
        } else {
          ohnePartner.bruecke = ohnePartner.bruecke || famBruecke;
          ziel = ohnePartner;
        }
        (fam.children || []).forEach(cid => {
          const ck = childKey(cid);
          if (globalKinder.has(ck)) return;     // global entdoppeln (überall dieselben Kinder)
          globalKinder.add(ck);
          ziel.kinderIds.push(cid);
        });
      });
    });
    // Kinder ohne erkennbaren Partner an die Hauptehe hängen
    if (ohnePartner.kinderIds.length) {
      if (hauptKey) {
        const h = eheMap.get(hauptKey);
        h.kinderIds.push(...ohnePartner.kinderIds);
        h.bruecke = h.bruecke || ohnePartner.bruecke;
      } else {
        eheMap.set('__np__', { partnerId: null, partner: null, kinderIds: ohnePartner.kinderIds, bruecke: ohnePartner.bruecke });
      }
    }
    const familien = [...eheMap.values()];
    familien.forEach(f => { if (f.partner) besucht.add(f.partnerId); });

    const partners = familien.map(f => f.partner).filter(Boolean);
    const marriages = familien.length >= 2 ? familien.map(f => ({ partner: f.partner })) : null;
    const blutlinie = BLUTLINIE_IDS.has(personId);

    const knoten = { person: p, partners, marriages, familyIndex: null, children: [], blutlinie };

    if (tiefe <= 0) return knoten;

    // Kind zeigen, wenn es im aktuellen Baum liegt ODER über eine Verknüpfungs-Brücke kommt.
    const zeigeKind = (cid, bruecke) => bruecke || sameTree(cid);

    if (familien.length >= 2) {
      familien.forEach((fam, famIdx) => {
        fam.kinderIds.forEach(cid => {
          if (!zeigeKind(cid, fam.bruecke)) return;
          const kindKnoten = baueKnoten(cid, tiefe - 1, fam.bruecke);
          if (kindKnoten) { kindKnoten.familyIndex = famIdx; knoten.children.push(kindKnoten); }
        });
      });
    } else {
      familien.forEach(fam => fam.kinderIds.forEach(cid => {
        if (!zeigeKind(cid, fam.bruecke)) return;
        const kindKnoten = baueKnoten(cid, tiefe - 1, fam.bruecke);
        if (kindKnoten) knoten.children.push(kindKnoten);
      }));
    }

    // Blutlinien-Kind in die Mitte stellen → Reingold-Tilford zentriert es unter dem Elternteil
    const blChild = BLUTLINIE_KINDER[personId];
    if (blChild && knoten.children.length > 1) {
      const blIdx = knoten.children.findIndex(c => c.person.id === blChild);
      if (blIdx >= 0) {
        const centerIdx = Math.floor(knoten.children.length / 2);
        const [bl] = knoten.children.splice(blIdx, 1);
        knoten.children.splice(centerIdx, 0, bl);
      }
    }

    return knoten;
  }

  return baueKnoten(wurzelId, tiefeNachOben + tiefeNachUnten, false);
}

// ============================================================
// GEDCOM-UPLOAD
// ============================================================
function handleGedcomUpload(event) {
  const datei = event.target.files[0];
  if (!datei) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const geparst = parseGedcom(e.target.result);
      aktuelleDaten = geparst;
      fokusPersonId = null;
      aktualisiereStats();
      zeigeKarten();
      const p = Object.keys(geparst.persons).length;
      const f = Object.keys(geparst.families).length;
      alert(t('upload_erfolg', {p, f}));
    } catch (err) {
      alert(t('upload_fehler') + err.message);
    }
  };
  reader.readAsText(datei, 'UTF-8');
}

function parseGedcom(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const persons = {};
  const families = {};
  let curId = null, curType = null, curSub = null;
  
  for (const line of lines) {
    const parts = line.split(' ');
    const level = parts[0];
    
    if (level === '0') {
      const m = line.match(/^0\s+@(\w+)@\s+(\w+)/);
      if (m) {
        curId = m[1]; curType = m[2]; curSub = null;
        if (curType === 'INDI') {
          persons[curId] = {
            id: curId, name: '', given: '', surname: '', sex: '',
            birth_date: '', birth_place: '', death_date: '', death_place: '',
            deceased: false, families_spouse: [], families_child: []
          };
        } else if (curType === 'FAM') {
          families[curId] = {
            id: curId, husband: null, wife: null, children: [],
            marriage_date: '', marriage_place: ''
          };
        }
      } else { curId = null; curType = null; }
    } else if (!curId) {
      continue;
    } else if (level === '1') {
      const tag = parts[1];
      const value = parts.slice(2).join(' ');
      curSub = tag;
      if (curType === 'INDI') {
        const p = persons[curId];
        if (tag === 'NAME') {
          const m = value.match(/(.*?)\/(.*?)\//);
          if (m) {
            p.given = m[1].trim(); p.surname = m[2].trim();
            p.name = `${p.given} ${p.surname}`.trim();
          } else { p.name = value.trim(); }
        } else if (tag === 'SEX') { p.sex = value.trim(); }
        else if (tag === 'DEAT') { p.deceased = true; }
        else if (tag === 'FAMS') { const m = value.match(/@(\w+)@/); if (m) p.families_spouse.push(m[1]); }
        else if (tag === 'FAMC') { const m = value.match(/@(\w+)@/); if (m) p.families_child.push(m[1]); }
      } else if (curType === 'FAM') {
        const f = families[curId];
        if (tag === 'HUSB') { const m = value.match(/@(\w+)@/); if (m) f.husband = m[1]; }
        else if (tag === 'WIFE') { const m = value.match(/@(\w+)@/); if (m) f.wife = m[1]; }
        else if (tag === 'CHIL') { const m = value.match(/@(\w+)@/); if (m) f.children.push(m[1]); }
      }
    } else if (level === '2') {
      const tag = parts[1];
      const value = parts.slice(2).join(' ');
      if (curType === 'INDI') {
        const p = persons[curId];
        if (curSub === 'BIRT') {
          if (tag === 'DATE') p.birth_date = value.trim();
          else if (tag === 'PLAC') p.birth_place = value.trim();
        } else if (curSub === 'DEAT') {
          if (tag === 'DATE') p.death_date = value.trim();
          else if (tag === 'PLAC') p.death_place = value.trim();
        }
      } else if (curType === 'FAM' && curSub === 'MARR') {
        const f = families[curId];
        if (tag === 'DATE') f.marriage_date = value.trim();
        else if (tag === 'PLAC') f.marriage_place = value.trim();
      }
    }
  }
  return { persons, families };
}
