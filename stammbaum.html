// KARTEN-ANSICHT
// ============================================================
function zeigeKarten() {
  const suche = document.getElementById('suche').value.trim().toLowerCase();
  const grid = document.getElementById('personen-grid');

  const gefiltert = Object.values(aktuelleDaten.persons).filter(p => {
    if (!suche) return true;
    // Echtzeit-Filter: Vorname, Nachname, vollständiger Name + Geburtsname (Mädchenname)
    const heu = [p.name, p.given, p.surname, p.ehename].filter(Boolean).join(' ').toLowerCase();
    return heu.includes(suche);
  }).sort((a,b) => {
    const ja = parseInt(a.birth_date) || 9999;
    const jb = parseInt(b.birth_date) || 9999;
    if (ja !== jb) return ja - jb;
    return a.name.localeCompare(b.name);
  });
  
  if (gefiltert.length === 0) {
    grid.innerHTML = `<div class="keine-treffer">${t('keine_treffer')}</div>`;
    return;
  }
  
  grid.innerHTML = '';
  gefiltert.forEach(p => {
    const karte = document.createElement('div');
    karte.className = 'person' + (p.deceased ? ' verstorben' : '');
    karte.onclick = () => zeigeDetails(p.id);
    
    const initialen = nm(((p.given[0] || '') + (p.surname[0] || '')).toUpperCase()) || '?';
    const avatarKlasse = p.sex === 'M' ? 'male' : (p.sex === 'F' ? 'female' : 'unknown');
    
    let lebensdaten = '';
    if (p.birth_date || p.death_date) {
      lebensdaten = `* ${formatDatumLang(p.birth_date) || '?'}`;
      if (p.deceased || p.death_date) lebensdaten += ` † ${formatDatumLang(p.death_date) || '?'}`;
    }
    
    karte.innerHTML = `
      <div class="avatar ${avatarKlasse}">${initialen}</div>
      <h3>${escapeHtml(nm(p.given || '?'))}</h3>
      <p class="nachname">${escapeHtml(nm(p.surname || ''))}${p.ehename ? ` <span class="maiden-name">(${escapeHtml(nm(p.ehename))})</span>` : ''}</p>
      ${lebensdaten ? `<div class="daten">${lebensdaten}</div>` : ''}
      ${p.birth_place ? `<div class="daten">📍 ${escapeHtml(uebersetzeOrt(p.birth_place))}</div>` : ''}
    `;
    grid.appendChild(karte);
  });
}

async function uploadEventMedia(eventId, file) {
  if (!file || !aktuellerUser) return { url: null, error: 'Keine Datei oder nicht authentifiziert.' };
  try {
    const bucket = 'events';
    const path = `${eventId}/${Date.now()}_${file.name}`;
    dbg('Upload starten:', { bucket, path, fileType: file.type, fileSize: file.size });
    
    const { data, error } = await sbClient.storage.from(bucket).upload(path, file, {
      cacheControl: '3600',
      upsert: false,
    });
    
    if (error) {
      console.error('Upload-Fehler:', error);
      return { url: null, error: error.message || 'Upload-Fehler' };
    }
    
    dbg('Upload erfolgreich:', data);
    dbg('Full upload response:', JSON.stringify(data));

    // Use the path returned by the upload response when available —
    // the client may normalize or alter the filename. Fall back to our
    // constructed `path` when upload response doesn't include it.
    let uploadedPath = (data && (data.path || data.Key || data.KeyName || data.name)) || path;

    // If the returned path accidentally contains the bucket name prefix,
    // strip it (e.g. "events/..." when we already pass the bucket separately).
    if (uploadedPath && uploadedPath.startsWith(bucket + '/')) {
      uploadedPath = uploadedPath.slice(bucket.length + 1);
      dbg('Stripped bucket prefix from uploadedPath, now:', uploadedPath);
    }

    dbg('Using path for signed URL:', uploadedPath);

    // Debug: list objects in the target folder to verify the object exists
    try {
      const { data: listData, error: listErr } = await sbClient.storage.from(bucket).list(eventId, { limit: 100 });
      dbg('List objects in folder', eventId, listData, listErr);
    } catch (listEx) {
      console.warn('List-exception:', listEx);
    }

    // Debug: get public URL (works for public buckets) to compare
    try {
      const publicRes = sbClient.storage.from(bucket).getPublicUrl(uploadedPath);
      dbg('Public URL result:', publicRes);
    } catch (pubEx) {
      console.warn('PublicUrl-exception:', pubEx);
    }

    // Try to create a signed URL first
    const { data: urlData, error: signError } = await sbClient.storage.from(bucket).createSignedUrl(uploadedPath, 60 * 60 * 24);
    if (!signError && urlData?.signedUrl) {
      dbg('Signed URL generiert:', urlData.signedUrl);
      return { url: urlData.signedUrl, error: null, storagePath: uploadedPath };
    }

    console.warn('Signed URL-Fehler:', signError);

    // Fallback 1: if the bucket is public, getPublicUrl will return a usable URL
    try {
      const publicRes = sbClient.storage.from(bucket).getPublicUrl(uploadedPath);
      if (publicRes && publicRes.data && publicRes.data.publicUrl) {
        dbg('Public URL result:', publicRes.data.publicUrl);
        return { url: publicRes.data.publicUrl, error: null, storagePath: uploadedPath };
      }
    } catch (pubEx) {
      console.warn('PublicUrl-exception:', pubEx);
    }

    // Fallback 2: try to download the object (requires auth) and create a blob URL
    try {
      const { data: downloadData, error: downloadError } = await sbClient.storage.from(bucket).download(uploadedPath);
      if (!downloadError && downloadData) {
        const blobUrl = URL.createObjectURL(downloadData);
        dbg('Erzeugt blob-URL für Anzeige');
        return { url: blobUrl, error: null, storagePath: uploadedPath, isBlob: true };
      } else {
        console.warn('Download-Fehler:', downloadError);
      }
    } catch (downloadEx) {
      console.warn('Download-exception:', downloadEx);
    }

    return { url: null, error: signError?.message || 'URL-Fehler', storagePath: uploadedPath };
  } catch (err) {
    console.error('Upload-Exception:', err);
    return { url: null, error: err.message || 'Unbekannter Fehler' };
  }
}

// Medien werden direkt aus dem geteilten Supabase-Storage gelesen, damit sie
// für ALLE eingeloggten User sichtbar sind (vorher nur im lokalen localStorage).
const EVENTS_BUCKET = 'events';

// Cache der zuletzt gerenderten Medienliste je Event – damit Löschen per Index
// den richtigen Storage-Pfad findet.
let letzteMedienListe = {};

async function renderEventMedia(eventId) {
  const { data: files, error } = await sbClient.storage
    .from(EVENTS_BUCKET)
    .list(eventId, { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });

  if (error) {
    console.warn('Medien-Liste konnte nicht geladen werden:', error);
    letzteMedienListe[eventId] = [];
    return [];
  }

  // Platzhalter-Objekte (leere Ordner) herausfiltern
  const realFiles = (files || []).filter(f => f.name && f.name !== '.emptyFolderPlaceholder');
  if (realFiles.length === 0) {
    letzteMedienListe[eventId] = [];
    return [];
  }

  const paths = realFiles.map(f => `${eventId}/${f.name}`);

  // Signierte URLs für alle Dateien in EINEM Aufruf (gültig 24h, bei jedem Öffnen neu erzeugt)
  const { data: signed, error: signErr } = await sbClient.storage
    .from(EVENTS_BUCKET)
    .createSignedUrls(paths, 60 * 60 * 24);
  if (signErr) console.warn('Signed-URL-Fehler:', signErr);

  const media = realFiles.map((f, i) => {
    const mimetype = (f.metadata && f.metadata.mimetype) || '';
    const type = mimetype || (/\.(mp4|webm|mov|m4v|ogg)$/i.test(f.name) ? 'video/mp4'
                  : /\.pdf$/i.test(f.name) ? 'application/pdf' : 'image/*');
    return {
      url:  signed && signed[i] ? signed[i].signedUrl : '',
      name: f.name.replace(/^\d+_/, ''),   // Zeitstempel-Präfix für die Anzeige entfernen
      type,
      path: `${eventId}/${f.name}`
    };
  });

  letzteMedienListe[eventId] = media;
  return media;
}

// Alle Medien eines Events aus dem Storage entfernen — beim Löschen aufrufen,
// damit keine verwaisten Dateien zurückbleiben (Integritätsregel CLAUDE.md).
async function loescheEventMedien(eventId) {
  if (!eventId) return;
  try {
    const { data: files, error } = await sbClient.storage.from(EVENTS_BUCKET).list(eventId, { limit: 100 });
    if (error) { console.warn('Medien-Liste (Löschen):', error); return; }
    const pfade = (files || [])
      .filter(f => f.name && f.name !== '.emptyFolderPlaceholder')
      .map(f => `${eventId}/${f.name}`);
    if (pfade.length) {
      const { error: rmErr } = await sbClient.storage.from(EVENTS_BUCKET).remove(pfade);
      if (rmErr) console.warn('Medien-Löschen:', rmErr);
    }
  } catch (e) { console.warn('Medien-Aufräumen fehlgeschlagen:', e); }
}

// Eigener Bestätigungs-Dialog statt Browser-confirm. Liefert ein Promise<boolean>.
function zeigeBestaetigung(text, opts) {
  opts = opts || {};
  const jaText   = opts.jaText   || t('ja');
  const neinText = opts.neinText || t('nein');
  const jaClass  = opts.gefahr ? 'confirm-ja confirm-gefahr' : 'confirm-ja';
  // Mehrzeilige Warnungen (\n) sollen als Absätze sichtbar bleiben.
  const textStyle = opts.gefahr ? ' style="white-space:pre-line;text-align:left"' : '';
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-text"${textStyle}>${escapeHtml(text)}</p>
        <div class="confirm-actions">
          <button type="button" class="${jaClass}">${escapeHtml(jaText)}</button>
          <button type="button" class="confirm-nein">${escapeHtml(neinText)}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const fertig = (wert) => { overlay.remove(); resolve(wert); };
    overlay.querySelector('.confirm-ja').addEventListener('click', () => fertig(true));
    overlay.querySelector('.confirm-nein').addEventListener('click', () => fertig(false));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) fertig(false); });
  });
}

// ============================================================
// TEILNEHMERVERWALTUNG / EVENT-SICHTBARKEIT (Phase 1)
// Wer darf das Event sehen? Standard = alle (unbeschränkt). Serverseitig in
// supabase_event_eingeladene.sql geprüft (darf_event_sehen). Echten Zugriff
// haben nur Personen mit verknüpftem Konto; Personen ohne Konto sind wählbar,
// bleiben aber wirkungslos. Benachrichtigungen folgen in Phase 2.
// ============================================================
let etnKandidaten = [];          // [{user_id, email, vorname, nachname, rolle, eingeladen}]
let etnAuswahl    = new Set();   // user_id -> ausgewählt
let etnSucheTimer = null;
let etnLimit      = 150;         // Render-Obergrenze (Performance) + "Mehr laden"

async function oeffneEventTeilnehmer() {
  const eventId = document.getElementById('ev-id').value;
  if (!eventId || !istAdmin()) return;
  document.getElementById('etn-event-id').value = eventId;
  document.getElementById('etn-suche').value = '';
  document.getElementById('etn-fehler').style.display = 'none';
  document.getElementById('etn-erfolg').style.display = 'none';
  etnLimit = 150;
  etnKandidaten = [];
  etnAuswahl = new Set();
  document.getElementById('etn-liste').innerHTML =
    `<div class="etn-empty">${escapeHtml(t('etn_laedt'))}</div>`;
  document.getElementById('etn-mehr-wrap').innerHTML = '';
  document.getElementById('etn-status').textContent = '';
  etnBindeListe();
  document.getElementById('event-teilnehmer-modal').classList.add('aktiv');

  // Kandidaten (Verbund) + aktuellen Einlade-Stand laden
  const [{ data: kand, error: kErr }, { data: stand, error: sErr }] = await Promise.all([
    sbClient.rpc('event_teilnehmer_kandidaten', { p_event: eventId }),
    sbClient.rpc('event_eingeladene_daten',     { p_event: eventId })
  ]);
  if (kErr || sErr) {
    document.getElementById('etn-liste').innerHTML =
      `<div class="etn-empty">${escapeHtml(t('reg_fehler') + ((kErr||sErr).message))}</div>`;
    return;
  }
  etnKandidaten = (kand || []).map(p => ({
    user_id: p.user_id, email: p.email || '', vorname: p.vorname || '', nachname: p.nachname || '',
    rolle: p.rolle || '', eingeladen: !!p.eingeladen
  }));

  // Invite-basiert: vorausgewählt sind die bereits eingeladenen Konten
  // (bei einem neuen Event: keine -> der Admin muss mind. eine Person wählen).
  const ids = new Set(((stand && stand.user_ids) || []).map(String));
  etnKandidaten.forEach(p => { if (ids.has(String(p.user_id))) etnAuswahl.add(p.user_id); });
  renderEtnListe();
}

function schliesseEventTeilnehmer() {
  document.getElementById('event-teilnehmer-modal').classList.remove('aktiv');
}

function etnSucheDebounce() {
  clearTimeout(etnSucheTimer);
  etnSucheTimer = setTimeout(() => { etnLimit = 150; renderEtnListe(); }, 300);
}

// Diakritik-/schrift-insensitiver Filter (nutzt ssFold aus den suchbaren Dropdowns).
function etnGefiltert() {
  const f = ssFold((document.getElementById('etn-suche').value || '').trim());
  if (f.length < 1) return etnKandidaten;
  return etnKandidaten.filter(p => ssFold(p.vorname + ' ' + p.nachname + ' ' + p.email).includes(f));
}

function renderEtnListe() {
  const liste = document.getElementById('etn-liste');
  const gefiltert = etnGefiltert();
  const total = etnKandidaten.length;
  const sel   = etnAuswahl.size;

  // Statuszeile: X von Y; bei "alle" der Hinweis, dass jeder sieht.
  const statusEl = document.getElementById('etn-status');
  statusEl.textContent = t('etn_status', { sel, total });

  if (gefiltert.length === 0) {
    liste.innerHTML = `<div class="etn-empty">${escapeHtml(t('etn_kein_treffer'))}</div>`;
    document.getElementById('etn-mehr-wrap').innerHTML = '';
    return;
  }

  const sichtbar = gefiltert.slice(0, etnLimit);
  liste.innerHTML = sichtbar.map(p => {
    const an = etnAuswahl.has(p.user_id);
    const voll = (p.vorname + ' ' + p.nachname).trim();
    const name = escapeHtml(voll ? nm(voll) : (p.email || '?'));
    const meta = voll ? escapeHtml(p.email || '') : '';   // E-Mail als Zweitzeile, wenn ein Name da ist
    const badge = p.rolle ? `<span class="etn-konto-badge">${escapeHtml(t('rolle_' + p.rolle))}</span>` : '';
    return `<div class="etn-row${an ? ' etn-an' : ''}" data-id="${escapeHtml(String(p.user_id))}">
      <span class="etn-check">${an ? '✓' : ''}</span>
      <span class="etn-info"><span class="etn-name">${name}</span>${meta ? `<div class="etn-meta">${meta}</div>` : ''}</span>
      ${badge}
    </div>`;
  }).join('');

  // "Mehr laden", falls die gefilterte Liste die Obergrenze übersteigt (Performance).
  const mehrWrap = document.getElementById('etn-mehr-wrap');
  if (gefiltert.length > etnLimit) {
    mehrWrap.innerHTML =
      `<button type="button" class="etn-mehr-btn" onclick="etnMehrLaden()">${escapeHtml(t('etn_mehr'))} (${gefiltert.length - etnLimit})</button>`;
  } else {
    mehrWrap.innerHTML = '';
  }
}

function etnMehrLaden() { etnLimit += 300; renderEtnListe(); }

// Touch-sichere Auswahl: Tap auf eine Zeile schaltet die Auswahl um (Wischen
// scrollt). tippAuswahl feuert auf pointerup -> vor Ghost-Click/Reflow. Einmalig
// per Delegation an den Container gebunden (überlebt innerHTML-Neuaufbau der Zeilen).
let etnListeGebunden = false;
function etnBindeListe() {
  if (etnListeGebunden) return;
  const container = document.getElementById('etn-liste');
  if (!container) return;
  tippAuswahl(container, '.etn-row', row => {
    const id = row.dataset.id; if (!id) return;
    if (etnAuswahl.has(id)) etnAuswahl.delete(id); else etnAuswahl.add(id);
    renderEtnListe();
  });
  etnListeGebunden = true;
}

function etnAlleWaehlen(an) {
  etnAuswahl = new Set(an ? etnKandidaten.map(p => p.user_id) : []);
  renderEtnListe();
}

function etnInvertieren() {
  const neu = new Set();
  etnKandidaten.forEach(p => { if (!etnAuswahl.has(p.user_id)) neu.add(p.user_id); });
  etnAuswahl = neu;
  renderEtnListe();
}

async function speichereEventTeilnehmer() {
  const eventId = document.getElementById('etn-event-id').value;
  if (!eventId || !istAdmin()) return;
  const fehlerEl = document.getElementById('etn-fehler');
  const erfolgEl = document.getElementById('etn-erfolg');
  const button   = document.getElementById('etn-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';

  // Einladungsbasiert: die Auswahl IST die Einladungsliste -> mindestens eine Person.
  const total = etnKandidaten.length;
  const ids = [...etnAuswahl];
  if (ids.length === 0) { fehlerEl.textContent = t('etn_min_eine'); fehlerEl.style.display = 'block'; return; }

  const alt = button.textContent; button.disabled = true; button.textContent = t('reg_senden_laeuft');
  const { data, error } = await sbClient.rpc('event_eingeladene_setzen', {
    p_event: eventId, p_eingeschraenkt: true, p_user_ids: ids
  });
  if (error) { button.disabled = false; button.textContent = alt; fehlerEl.textContent = t('reg_fehler') + error.message; fehlerEl.style.display = 'block'; return; }

  // Phase 2: NUR neu hinzugefügte Personen benachrichtigen (Delta = data.neu).
  // event_einladung_benachrichtige legt In-App-Benachrichtigungen an und liefert die
  // E-Mail-Empfänger (nur Personen mit verknüpftem Konto, ohne mich selbst).
  const neu = (data && data.neu) || [];
  if (Array.isArray(neu) && neu.length) {
    button.textContent = t('etn_benachrichtige');
    try {
      const { data: bn } = await sbClient.rpc('event_einladung_benachrichtige', { p_event: eventId, p_user_ids: neu });
      const empf = (bn && bn.empfaenger) || [];
      if (empf.length) {
        // E-Mail-Versand best-effort über die Edge Function (blockiert Speichern nicht).
        sbClient.functions.invoke('event-einladung-senden', { body: { event_id: eventId, empfaenger: empf } })
          .catch(e => console.warn('Einladungs-Mail:', e));
      }
    } catch (e) { console.warn('Benachrichtigung:', e); }
  }

  button.disabled = false; button.textContent = alt;

  // Kurzstatus im Event-Modal spiegeln
  const evStatus = document.getElementById('ev-teilnehmer-status');
  if (evStatus) evStatus.textContent = t('etn_status', { sel: ids.length, total });

  erfolgEl.textContent = t('etn_gespeichert'); erfolgEl.style.display = 'block';
  await zeigeShorts();   // Sichtbarkeit kann sich geändert haben -> Liste aktualisieren
  setTimeout(() => schliesseEventTeilnehmer(), 800);
}

// ============================================================
// BENACHRICHTIGUNGEN (Phase 2) — In-App-Liste im Profil + Ungelesen-Indikator
// Eigene Zeilen via RLS (auth.uid()=user_id). Erzeugt werden sie serverseitig
// (event_einladung_benachrichtige). Direktlink öffnet das zugehörige Event.
// ============================================================
let meineBenachrichtigungen = [];

async function ladeBenachrichtigungen() {
  if (!aktuellerUser || !sbClient) { meineBenachrichtigungen = []; aktualisiereBenachrBadge(); return; }
  const { data, error } = await sbClient
    .from('benachrichtigungen')
    .select('id, typ, titel, text, event_id, gelesen, created_at')
    .order('created_at', { ascending: false })
    .limit(50);
  if (error) { console.warn('Benachrichtigungen laden:', error); return; }
  meineBenachrichtigungen = data || [];
  aktualisiereBenachrBadge();
  if (document.getElementById('profil-modal')?.classList.contains('aktiv')) renderBenachrichtigungen();
}

function benachrUngelesen() {
  return meineBenachrichtigungen.filter(b => !b.gelesen).length;
}

function aktualisiereBenachrBadge() {
  const n = benachrUngelesen();
  const dot = document.getElementById('profil-dot');
  if (dot) dot.style.display = n > 0 ? '' : 'none';
  const badge = document.getElementById('prof-benachr-badge');
  if (badge) { badge.textContent = n > 99 ? '99+' : String(n); badge.style.display = n > 0 ? '' : 'none'; }
}

function renderBenachrichtigungen() {
  const box = document.getElementById('prof-benachr-liste');
  if (!box) return;
  if (!meineBenachrichtigungen.length) {
    box.innerHTML = `<div class="benachr-empty">${escapeHtml(t('benachr_keine'))}</div>`;
    document.getElementById('prof-benachr-alle').style.display = 'none';
    return;
  }
  box.innerHTML = meineBenachrichtigungen.map(b => {
    const titel = b.typ === 'event_einladung' ? t('benachr_event_einladung') : escapeHtml(b.titel || '');
    const text  = b.titel ? `« ${escapeHtml(nm(b.titel))} »` : escapeHtml(b.text || '');
    const zeit  = b.created_at ? new Date(b.created_at).toLocaleString() : '';
    return `<div class="benachr-item ${b.gelesen ? 'gelesen' : 'ungelesen'}" data-id="${escapeHtml(String(b.id))}"
                 data-event="${escapeHtml(String(b.event_id || ''))}" onclick="benachrOeffne(this)">
      <span class="bi-dot"></span>
      <span class="bi-body">
        <div class="bi-titel">${escapeHtml(titel)}</div>
        <div class="bi-text">${text}</div>
        <div class="bi-zeit">${escapeHtml(zeit)}</div>
      </span>
    </div>`;
  }).join('');
  document.getElementById('prof-benachr-alle').style.display = benachrUngelesen() > 0 ? '' : 'none';
}

function profilBenachrToggle() {
  const box = document.getElementById('prof-benachr-box');
  const tog = document.getElementById('prof-benachr-toggle');
  const offen = box.style.display !== 'none';
  box.style.display = offen ? 'none' : 'block';
  tog.classList.toggle('offen', !offen);
  tog.setAttribute('aria-expanded', String(!offen));
  if (!offen) renderBenachrichtigungen();
}

async function benachrOeffne(el) {
  const id = el.dataset.id;
  const eventId = el.dataset.event;
  // Als gelesen markieren (eigene Zeile, RLS)
  const b = meineBenachrichtigungen.find(x => String(x.id) === String(id));
  if (b && !b.gelesen) {
    b.gelesen = true;
    aktualisiereBenachrBadge();
    el.classList.remove('ungelesen'); el.classList.add('gelesen');
    sbClient.from('benachrichtigungen').update({ gelesen: true }).eq('id', id)
      .then(({ error }) => { if (error) console.warn('gelesen:', error); });
  }
  // Direktlink: Event öffnen. Events werden PRO Stammbaum geladen -> erst zum Baum
  // des Events wechseln (falls nötig), dessen Events laden, dann Detail öffnen.
  if (eventId) {
    schliesseProfil();
    let treeId = null;
    try {

async function speichereEvent() {
  if (!istAdmin() || !aktuellerStammbaumId) return;
  const v = id => document.getElementById(id).value.trim();
  const fehlerEl = document.getElementById('ev-fehler');
  const erfolgEl = document.getElementById('ev-erfolg');
  const button   = document.getElementById('ev-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';
  const titel = v('ev-titel');
  if (!titel) { fehlerEl.textContent = t('event_pflicht'); fehlerEl.style.display = 'block'; return; }

  const id = document.getElementById('ev-id').value || null;
  const alt = button.textContent; button.disabled = true; button.textContent = t('reg_senden_laeuft');
  const { data: gespeicherteId, error } = await sbClient.rpc('event_speichern', {
    p_id: id, p_tree: aktuellerStammbaumId, p_titel: titel,
    p_beschreibung: v('ev-beschreibung') || null, p_datum: datumWert(document.getElementById('ev-datum')) || null,
    p_ort: v('ev-ort') || null, p_typ: document.getElementById('ev-typ').value || null,
    p_sprache: aktuelleSprache, p_organisator: v('ev-organisator') || null
  });
  if (error) {
    button.disabled = false; button.textContent = alt;
    fehlerEl.textContent = t('reg_fehler') + error.message; fehlerEl.style.display = 'block'; return;
  }

  // Nach dem Speichern existiert eine id -> Teilnehmer/Sichtbarkeit verfügbar machen.
  if (gespeicherteId) {
    document.getElementById('ev-id').value = gespeicherteId;
    document.getElementById('ev-teilnehmer-section').style.display = '';
  }

  // Ausgewählte Medien in den geteilten Storage hochladen (Event-id = Ordner)
  const eventIdFuerMedien = id || gespeicherteId;
  const input = document.getElementById('ev-media-input');
  if (eventIdFuerMedien && input && input.files && input.files.length) {
    const statusEl = document.getElementById('ev-media-status');
    statusEl.textContent = t('event_uploading');
    let medienFehler = null;
    for (const file of [...input.files]) {
      const res = await uploadEventMedia(eventIdFuerMedien, file);
      if (res && res.error) { medienFehler = res.error; break; }
    }
    input.value = '';
    statusEl.textContent = medienFehler ? (t('event_uploading') + ' ' + medienFehler) : '';
    if (!medienFehler) await ladeEventMedienListe(eventIdFuerMedien);
  }

  button.disabled = false; button.textContent = alt;
  erfolgEl.textContent = t('event_gespeichert'); erfolgEl.style.display = 'block';
  await zeigeShorts();                       // Liste sofort aktualisieren
  // Neues Event: Einladung ist Pflicht (mind. 1 Person) -> Schritt direkt öffnen.
  if (!id && gespeicherteId) {
    schliesseEventModal();
    oeffneEventTeilnehmer();
  } else {
    setTimeout(() => schliesseEventModal(), 900);
  }
}

// ============================================================
// KOSTENÜBERSICHT / TROŠKOVI DOGAĐAJA (pro Event)
// Teilnehmer + Ausgaben in DB (event_teilnehmer/event_kosten via RPCs).
// Berechnung pro Währung GETRENNT, Cent-genau (Restcent verteilt -> Summe 0).
// "Bezahlt pro Person" = Summe der Ausgaben, die diese Person bezahlt hat.
// ============================================================
let kostenEventId = null;
let kostenDaten = { teilnehmer: [], kosten: [] };
let kostenEditId = null;

async function oeffneKosten(eventId) {
  kostenEventId = eventId;

async function ladeKostenDaten() {
  const { data, error } = await sbClient.rpc('event_kosten_daten', { p_event: kostenEventId });
  if (error) { kostenDaten = { teilnehmer: [], kosten: [] }; console.warn('Kostendaten:', error); return; }
  kostenDaten = { teilnehmer: (data && data.teilnehmer) || [], kosten: (data && data.kosten) || [] };
}

function formatGeld(cents, waehrung) {
  return (cents / 100).toFixed(2) + ' ' + (waehrung || 'EUR');
}

// Berechnung je Währung: Gesamt, Anteil/Person (Cent-genau verteilt), Salden, Ausgleich.
function berechneKosten() {
  const tn = kostenDaten.teilnehmer, ks = kostenDaten.kosten;
  const n = tn.length;
  const waehrungen = {};
  ks.forEach(k => {
    const w = k.waehrung || 'EUR';
    if (!waehrungen[w]) waehrungen[w] = { total: 0, paid: {} };
    const cents = Math.round((Number(k.betrag) || 0) * 100);
    waehrungen[w].total += cents;
    if (k.payer_id) waehrungen[w].paid[k.payer_id] = (waehrungen[w].paid[k.payer_id] || 0) + cents;
  });
  const ergebnis = [];
  Object.keys(waehrungen).sort().forEach(w => {
    const total = waehrungen[w].total, paid = waehrungen[w].paid;
    const base = n > 0 ? Math.floor(total / n) : 0;
    const rem  = n > 0 ? total - base * n : 0;   // Restcent gleichmäßig verteilen -> exakte 0-Summe
    const salden = tn.map((tp, i) => {
      const anteil  = base + (i < rem ? 1 : 0);
      const bezahlt = paid[tp.id] || 0;
      return { id: tp.id, name: tp.name, bezahlt, anteil, saldo: bezahlt - anteil };
    });
    ergebnis.push({ waehrung: w, total, proPerson: base, salden, ausgleich: berechneAusgleich(salden) });
  });
  return ergebnis;
}

// Greedy-Ausgleich (minimiert Überweisungen), arbeitet in Cent.
function berechneAusgleich(salden) {
  const glaeubiger = salden.filter(s => s.saldo > 0).map(s => ({ name: s.name, rest: s.saldo })).sort((a, b) => b.rest - a.rest);
  const schuldner  = salden.filter(s => s.saldo < 0).map(s => ({ name: s.name, rest: -s.saldo })).sort((a, b) => b.rest - a.rest);
  const transfers = [];
  let i = 0, j = 0;
  while (i < schuldner.length && j < glaeubiger.length) {
    const betrag = Math.min(schuldner[i].rest, glaeubiger[j].rest);
    if (betrag > 0) transfers.push({ von: schuldner[i].name, an: glaeubiger[j].name, betrag });
    schuldner[i].rest -= betrag; glaeubiger[j].rest -= betrag;
    if (schuldner[i].rest === 0) i++;
    if (glaeubiger[j].rest === 0) j++;
  }
  return transfers;
}

      <div style="display:flex;gap:6px">
        <input type="text" id="kosten-extern-input" class="login-feld" style="flex:1" placeholder="${escapeHtml(t('kosten_extern_ph'))}">
        <button class="mv-toggle" type="button" onclick="kostenTeilnehmerExtern()">${escapeHtml(t('kosten_extern'))}</button>

    h += `<div style="overflow-x:auto"><table class="kosten-tabelle"><thead><tr>
      <th>${escapeHtml(t('kosten_bezeichnung'))}</th>
      <th class="num">${escapeHtml(t('kosten_betrag'))}</th>
      <th>${escapeHtml(t('kosten_bezahlt_von'))}</th>
      ${adm ? '<th></th>' : ''}</tr></thead><tbody>`;
    h += ks.map(k => `<tr>
      <td>${escapeHtml(k.bezeichnung)}${k.beschreibung ? `<br><span style="font-size:11px;color:#8a7a5a">${escapeHtml(k.beschreibung)}</span>` : ''}</td>
      <td class="num">${escapeHtml(formatGeld(Math.round((Number(k.betrag) || 0) * 100), k.waehrung))}</td>
      <td>${escapeHtml(k.payer_id ? tnName(k.payer_id) : '—')}</td>
      ${adm ? `<td class="num kosten-print-hide" style="white-space:nowrap">
        <button class="kosten-chip" style="cursor:pointer" onclick="kostenAusgabeBearbeiten('${k.id}')">✎</button>
        <button class="kosten-chip" style="cursor:pointer" onclick="kostenAusgabeLoeschen('${k.id}')">×</button></td>` : ''}
    </tr>`).join('');
    h += `</tbody></table></div>`;
  } else {
    h += `<div class="event-media-empty">${escapeHtml(t('kosten_keine_ausgaben'))}</div>`;
  }
  if (adm) {
    const e = kostenEditId ? ks.find(x => x.id === kostenEditId) : null;
    const tnOpts = tn.map(p => `<option value="${escapeHtml(p.id)}" ${e && e.payer_id === p.id ? 'selected' : ''}>${escapeHtml(nm(p.name))}</option>`).join('');
    h += `<div class="kosten-form kosten-print-hide">
      <input type="text" id="kosten-bezeichnung" class="login-feld voll" placeholder="${escapeHtml(t('kosten_bezeichnung'))}" value="${e ? escapeHtml(e.bezeichnung) : ''}">
      <input type="number" step="0.01" id="kosten-betrag" class="login-feld" placeholder="${escapeHtml(t('kosten_betrag'))}" value="${e ? escapeHtml(String(e.betrag)) : ''}">

      </div>

  }
  h += `</div>`;

  // --- Zusammenfassung ---
  const summe = berechneKosten();
  h += `<div class="kosten-section"><h3>${escapeHtml(t('kosten_zusammenfassung'))}</h3>`;

      h += `<div style="overflow-x:auto"><table class="kosten-tabelle" style="margin-top:8px"><thead><tr>
        <th>${escapeHtml(t('kosten_person'))}</th>
        <th class="num">${escapeHtml(t('kosten_bezahlt'))}</th>
        <th class="num">${escapeHtml(t('kosten_anteil'))}</th>
        <th class="num">${escapeHtml(t('kosten_saldo'))}</th></tr></thead><tbody>`;
      h += blk.salden.map(s => {
        const cls = s.saldo > 0 ? 'kosten-saldo-plus' : (s.saldo < 0 ? 'kosten-saldo-minus' : '');
        const vorz = s.saldo > 0 ? '+' : '';
        return `<tr><td>${escapeHtml(nm(s.name))}</td>
          <td class="num">${escapeHtml(formatGeld(s.bezahlt, blk.waehrung))}</td>
          <td class="num">${escapeHtml(formatGeld(s.anteil, blk.waehrung))}</td>

      }).join('');
      h += `</tbody></table></div>`;
      h += `<div style="margin-top:10px"><strong style="font-size:13px;color:var(--gold)">${escapeHtml(t('kosten_ausgleich'))}</strong>`;
      h += blk.ausgleich.length
        ? blk.ausgleich.map(tr => `<div class="kosten-ausgleich-zeile">${escapeHtml(nm(tr.von))} <strong>${escapeHtml(t('kosten_zahlt'))}</strong> ${escapeHtml(nm(tr.an))}: <strong>${escapeHtml(formatGeld(tr.betrag, blk.waehrung))}</strong></div>`).join('')
        : `<div class="event-media-empty">${escapeHtml(t('kosten_ausgeglichen'))}</div>`;
      h += `</div></div>`;
    });
  }
  h += `</div>`;

  box.innerHTML = h;
  macheAlleSelectsSuchbar(box);   // Selects (Person/Bezahlt von) suchbar machen
  macheAlleDatumsfelder(box);     // Datumsfeld der Ausgabe mit Kalender
}

      const result = await uploadEventMedia(eventId, file);
      if (result?.error) {
        status.textContent = `${t('event_uploading')} ${result.error}`;
        button.disabled = false;
        return;
      }
    }

    // Text-Änderungen (Datum/Untertitel + Organisatoren) ebenfalls speichern –
    // sonst gingen sie beim automatischen Schließen verloren.
    wertSpeichern(eventId, {

    });

    button.disabled = false;

    setTimeout(() => schliesseModal(), 1000);
  });
}

function buildEventMediaHtml(media, eventId = null, showDelete = false, clickable = true) {
  // Ab mehr als 2 Dateien wird der Container scrollbar (siehe CSS)
  const scrollClass = media.length > 2 ? ' event-media-folder--scroll' : '';
  return `<div class="event-media-folder${scrollClass}">${media.map((m, idx) => {
    const istPdf = m.type === 'application/pdf' || /pdf/i.test(m.type);
    const thumb = m.type.startsWith('image/')
      ? `<img class="event-media-thumb" src="${m.url}" alt="${escapeHtml(m.name)}" />`
      : istPdf ? `<div class="event-media-thumb video-thumb">📄</div>`
      : `<div class="event-media-thumb video-thumb">🎥</div>`;
    const deleteBtn = showDelete && eventId ? `<button class="media-delete-btn" onclick="deleteEventMedia('${eventId}', ${idx})" title="${t('delete')}">×</button>` : '';
    // clickable=false (z.B. in der Edit-Maske über z-index:200) -> keine Slideshow, die sonst dahinter läge
    const istKlick = eventId && clickable;
    const klick = istKlick ? `zeigeMediaSlideshow('${eventId}', ${idx})` : 'return false;';
    return `<div class="event-media-item">${deleteBtn}<a href="javascript:void(0)" onclick="${klick}" style="cursor: ${istKlick ? 'pointer' : 'default'};">${thumb}<div class="event-media-info">${escapeHtml(m.name)}</div></a></div>`;
  }).join('')}</div>`;
}

async function deleteEventMedia(eventId, mediaIndex) {
  const eintrag = (letzteMedienListe[eventId] || [])[mediaIndex];
  if (!eintrag) return;

  const bestaetigt = await zeigeBestaetigung(t('confirm_delete'));
  if (!bestaetigt) return;

  // Datei SOFORT aus dem geteilten Storage löschen – damit für alle User wirksam
  const { error } = await sbClient.storage.from(EVENTS_BUCKET).remove([eintrag.path]);
  if (error) {
    console.error('Löschen fehlgeschlagen:', error);
    return;
  }
  console.log('Datei gelöscht:', eintrag.path);
  // Refresh kontextabhängig: neues Event-Modal offen -> dessen Liste; sonst alter Editor.
  if (document.getElementById('event-modal').classList.contains('aktiv')) {
    ladeEventMedienListe(eventId);
  } else if (document.getElementById('modal').classList.contains('aktiv') &&
             (eventsCache || []).some(e => e.id === eventId)) {
    zeigeEventDetail(eventId);   // Detailansicht eines DB-Events
  } else {
    zeigeEventEditor(eventId);   // altes Event-System
  }
}

async function zeigeMediaSlideshow(eventId, startIndex = 0) {
  const media = await renderEventMedia(eventId);
  if (media.length === 0) return;

  // Titel + Zurück-Ziel je nach Event-Quelle (DB-Event vs. altes statisches Event)
  const dbEv = (eventsCache || []).find(e => e.id === eventId);
  const titel = dbEv ? (dbEv.titel || '') : ((getEventConfig(eventId) || {}).title || '');
  const zurueckCall = dbEv ? `zeigeEventDetail('${eventId}')` : `zeigeShort('${eventId}')`;
  let currentIndex = startIndex;
  
  const updateSlideshow = () => {
    const m = media[currentIndex];
    const isImage = m.type.startsWith('image/');
    const istPdf  = m.type === 'application/pdf' || /pdf/i.test(m.type);
    const content = isImage
      ? `<img src="${m.url}" alt="${escapeHtml(m.name)}" style="max-width: 90vw; max-height: 70vh; object-fit: contain;" />`
      : istPdf
      ? `<iframe src="${m.url}" style="width: 90vw; height: 70vh; border: none; background: #fff;"></iframe>`
      : `<video style="max-width: 90vw; max-height: 70vh;" controls><source src="${m.url}" type="${m.type}">Browser nicht unterstützt</video>`;
    
    const navHtml = media.length > 1 ? `
      <div class="slideshow-nav">
        <button onclick="window.slideshowUpdate(${Math.max(0, currentIndex - 1)})" ${currentIndex === 0 ? 'disabled' : ''}>← ${t('prev') || 'Zurück'}</button>
        <span>${currentIndex + 1} / ${media.length}</span>
        <button onclick="window.slideshowUpdate(${Math.min(media.length - 1, currentIndex + 1)})" ${currentIndex === media.length - 1 ? 'disabled' : ''}>${t('next') || 'Weiter'} →</button>
      </div>
    ` : '';
    
    document.getElementById('modal-text').innerHTML = `
      <h2>${escapeHtml(nm(titel))}</h2>
      <div style="text-align: center; margin: 20px 0;">${content}</div>
      <div style="text-align: center; color: #666; margin: 10px 0;">${escapeHtml(m.name)}</div>
      ${navHtml}
      <div style="text-align: center; margin-top: 20px;">
        <button class="zurueck-btn" onclick="${zurueckCall}">${t('event_cancel')}</button>
      </div>
    `;
  };
  
  window.slideshowUpdate = (newIndex) => {
    if (newIndex >= 0 && newIndex < media.length) {
      currentIndex = newIndex;
      updateSlideshow();
    }
  };
  
  updateSlideshow();
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function zeigeDetails(personId) {
  if (document.getElementById('modal').classList.contains('aktiv') && aktuelleModalPersonId) {
    modalVerlauf.push(aktuelleModalPersonId);
  }
  aktuelleModalPersonId = personId;
  const p = aktuelleDaten.persons[personId];
  if (!p) return;
  
  // Gleiche reale Person über Bäume: Beziehungen aller Zwillingskarten zusammenführen,
  // damit die Detail-Karte überall dieselben Eltern/Kinder/Partner zeigt (entdoppelt).
  const gpTwins = p._ident
    ? Object.values(aktuelleDaten.persons).filter(q => q._ident === p._ident)
    : [p];
  const gpTwinIds = new Set(gpTwins.map(q => q.id));
  const persKey  = (q) => q._ident ? 'grp:' + q._ident : 'pn:' + ((q.given || '') + '|' + (q.surname || '') + '|' + (q.birth_date || '')).toLowerCase();
  const vornKey  = (q) => q._ident ? 'grp:' + q._ident : 'gn:' + (q.given || '').trim().toLowerCase();

  const eltern = []; const elternSeen = new Set();
  const geschwister = []; const geschSeen = new Set();
  gpTwins.forEach(tw => (tw.families_child || []).forEach(famId => {
    const fam = aktuelleDaten.families[famId]; if (!fam) return;
    [fam.husband, fam.wife].forEach(pid => {
      const e = pid && aktuelleDaten.persons[pid];
      if (e && !elternSeen.has(persKey(e))) { elternSeen.add(persKey(e)); eltern.push(e); }
    });
    (fam.children || []).forEach(cid => {
      const c = aktuelleDaten.persons[cid];
      if (c && !gpTwinIds.has(cid) && !geschSeen.has(vornKey(c))) { geschSeen.add(vornKey(c)); geschwister.push(c); }
    });
  }));

  // Ehen über alle Zwillinge, nach Partner gruppiert, Kinder GLOBAL entdoppelt
  const eheFamilien = []; const ehePartnerIdx = new Map(); const eheKinderGlobal = new Set();
  const ohnePartnerKinder = []; let hauptIdx = -1;
  gpTwins.forEach(tw => (tw.families_spouse || []).forEach(famId => {
    const fam = aktuelleDaten.families[famId]; if (!fam) return;
    const partnerId = fam.husband === tw.id ? fam.wife : fam.husband;
    const partner = partnerId ? aktuelleDaten.persons[partnerId] : null;
    let bucket;
    if (partner) {
      const pk = vornKey(partner);
      if (!ehePartnerIdx.has(pk)) { eheFamilien.push({ partner, kinder: [] }); ehePartnerIdx.set(pk, eheFamilien.length - 1); if (hauptIdx < 0) hauptIdx = eheFamilien.length - 1; }
      bucket = eheFamilien[ehePartnerIdx.get(pk)].kinder;
    } else bucket = ohnePartnerKinder;
    (fam.children || []).forEach(cid => {
      const c = aktuelleDaten.persons[cid]; if (!c) return;
      if (eheKinderGlobal.has(vornKey(c))) return; eheKinderGlobal.add(vornKey(c));
      bucket.push(c);
    });
  }));
  if (ohnePartnerKinder.length) {
    if (hauptIdx >= 0) eheFamilien[hauptIdx].kinder.push(...ohnePartnerKinder);
    else eheFamilien.push({ partner: null, kinder: ohnePartnerKinder });
  }

  const buildVerwandte = (liste) => liste.map(v =>
    `<span class="verwandter" onclick="zeigeDetails('${v.id}')">${escapeHtml(nm(v.name))}</span>`
  ).join('');

  const geschlechtText = p.sex === 'M' ? t('maennlich') : (p.sex === 'F' ? t('weiblich') : t('unbekannt'));

  // "＋"-Button je Abschnitt (nur Admins) — öffnet Person-hinzufügen mit vorbelegtem Typ.
  const addBtn = (typ) => istAdmin()
    ? `<button class="sec-add-btn" type="button" title="${escapeHtml(t('person_hinzufuegen'))}" onclick="personPlus('${p.id}','${typ}')">＋</button>`
    : '';
  // Abschnitt rendern: bei Admins immer (mit ＋), sonst nur wenn Inhalt vorhanden.
  const sektion = (titelKey, inhalt, typ) => (inhalt || istAdmin())
    ? `<div class="beziehungen"><h3>${t(titelKey)} ${addBtn(typ)}</h3>${inhalt || ''}</div>` : '';

  // Ehe-Block: Partner- + Kinder-Abschnitt je Ehe (mit ＋). Ohne Ehe für Admins leere Abschnitte.
  const eheBloecke = eheFamilien.length ? eheFamilien : (istAdmin() ? [{ partner: null, kinder: [] }] : []);
  const eheHtml = eheBloecke.map((ef, i) => {
    const ptitel = eheFamilien.length > 1 ? `${t('partner')} ${i + 1}` : t('partner');
    const partnerHtml = ef.partner ? `<span class="verwandter" onclick="zeigeDetails('${ef.partner.id}')">${escapeHtml(nm(ef.partner.name))}</span>` : '';
    const kinderHtml = ef.kinder.length ? buildVerwandte(ef.kinder) : '';
    return `<div class="beziehungen"><h3>${ptitel} ${addBtn('partner')}</h3>${partnerHtml}</div>
            <div class="beziehungen"><h3>${t('kinder')} ${addBtn('kind')}</h3>${kinderHtml}</div>`;
  }).join('');

  document.getElementById('modal-text').innerHTML = `
    ${modalVerlauf.length > 0 ? `<button class="zurueck-btn" onclick="geheZurueck()">← ${t('zurueck')}</button>` : ''}
    <h2>${escapeHtml(nm(p.given || '?'))}</h2>
    <p class="sub-name">${escapeHtml(nm(p.surname || ''))}</p>
    ${p.ehename ? `<div class="info-zeile"><strong>${t('pe_ehename')}:</strong> ${escapeHtml(nm(p.ehename))}</div>` : ''}

    ${p.birth_date ? `<div class="info-zeile"><strong>${t('geboren')}</strong> ${escapeHtml(formatDatumLang(p.birth_date))}</div>` : ''}
    ${p.birth_place ? `<div class="info-zeile"><strong>${t('geburtsort')}</strong> ${escapeHtml(uebersetzeOrt(p.birth_place))}</div>` : ''}
    ${p.deceased || p.death_date ? `<div class="info-zeile"><strong>${t('verstorben')}</strong> ${escapeHtml(formatDatumLang(p.death_date) || t('ja'))}</div>` : ''}
    ${p.death_place ? `<div class="info-zeile"><strong>${t('sterbeort')}</strong> ${escapeHtml(uebersetzeOrt(p.death_place))}</div>` : ''}
    <div class="info-zeile"><strong>${t('geschlecht')}</strong> ${geschlechtText}</div>
    ${istAdmin() ? `<div class="info-zeile" style="color:#8a7a5a">${p._hatKonto ? '🔗' : '🔓 ' + escapeHtml(t('kein_konto'))}</div>` : ''}
    ${p.geburtsland ? `<div class="info-zeile"><strong>${t('reg_geburtsland')}:</strong> ${escapeHtml(landAnzeige(p.geburtsland))}</div>` : ''}
    ${p.stadt ? `<div class="info-zeile"><strong>${t('fe_grad')}:</strong> ${escapeHtml(uebersetzeOrt(p.stadt))}</div>` : ''}
    ${p.gemeinde ? `<div class="info-zeile"><strong>${t('fe_opstina')}:</strong> ${escapeHtml(uebersetzeOrt(p.gemeinde))}</div>` : ''}
    ${p.getauft ? `<div class="info-zeile"><strong>${t('reg_getauft')}:</strong> ${escapeHtml(formatDatumLang(p.getauft))}</div>` : ''}
    ${(p.beziehung && p.beziehung !== 'unbekannt') ? `<div class="info-zeile"><strong>${t('pe_beziehung')}:</strong> ${escapeHtml(p.beziehung === 'sonstige' ? (p.beziehung_sonstige || t('bz_sonstige')) : t('bz_' + p.beziehung))}</div>` : ''}
    ${(p.hochzeit_standesamt || p.hochzeit_kirchlich || p.hochzeitsort) ? `<div class="info-zeile"><strong>${t('pe_hochzeit_standesamt')}:</strong> ${escapeHtml([formatDatumLang(p.hochzeit_standesamt), formatDatumLang(p.hochzeit_kirchlich), p.hochzeitsort].filter(Boolean).join(' · '))}</div>` : ''}
    ${p.beruf ? `<div class="info-zeile"><strong>${t('pe_beruf')}:</strong> ${escapeHtml(p.beruf)}</div>` : ''}
    ${p.ausbildung ? `<div class="info-zeile"><strong>${t('pe_ausbildung')}:</strong> ${escapeHtml(p.ausbildung)}</div>` : ''}
    ${(p.adresse || p.wohnort_stadt || p.wohnort_land) ? `<div class="info-zeile"><strong>${t('pe_g_wohnen')}:</strong> ${escapeHtml([uebersetzeOrt([p.adresse, p.wohnort_stadt].filter(Boolean).join(', ')), landAnzeige(p.wohnort_land)].filter(Boolean).join(', '))}</div>` : ''}
    ${(p.email || p.telefon || p.facebook || p.instagram) ? `<div class="info-zeile"><strong>${t('reg_kontakt')}:</strong> ${escapeHtml([p.email, p.telefon, p.facebook, p.instagram].filter(Boolean).join(' · '))}</div>` : ''}
    ${p.beschreibung ? `<div class="info-zeile"><strong>${t('pe_beschreibung')}:</strong> ${escapeHtml(p.beschreibung)}</div>` : ''}

    ${sektion('eltern', buildVerwandte(eltern), 'elternteil')}
    ${sektion('geschwister', buildVerwandte(geschwister), 'geschwister')}
    ${eheHtml}
    ${gpTwinHtml(p)}

    <button class="baum-zeigen" onclick="schliesseModalUndZeigeBaum('${p.id}')">${t('baum_zeigen')}</button>
    ${istAdmin() ? `<button class="baum-zeigen" style="margin-left:10px" onclick="zeigePersonBearbeiten('${p.id}')">${t('event_edit')}</button>` : ''}

// Zwillingskarten (gleiche reale Person, andere Karte) der Person p.
function findeZwillinge(p) {
  if (!p || !p._ident) return [];
  const out = [];
  Object.values(aktuelleDaten.persons).forEach(q => {
    if (q._uuid && q._uuid !== p._uuid && q._ident === p._ident) {
      out.push({ extId: q.id, uuid: q._uuid, name: q.name || q.given || '', treeId: q._tree,
                 treeName: (q._tree && stammbaeumeListe[q._tree]) || '' });
    }
  });
  return out;
}

// Hinweis: noch nicht verknüpfte Dubletten (gleicher Name + Geburtsdatum über Bäume)
let gpDubGruppen = [];
async function gpLadeDubletten() {
  const box = document.getElementById('gp-dubletten'); if (!box) return;
  box.innerHTML = '';
  const a = document.getElementById('gp-baum-a').value;
  const b = document.getElementById('gp-baum-b').value;
  if (!a || !b || a === b) return;   // erst vergleichen, wenn zwei verschiedene Bäume gewählt sind
  const { data, error } = await sbClient.rpc('offene_dubletten', { p_baum_a: a, p_baum_b: b });
  if (error) return;
  gpDubGruppen = data || [];
  if (!gpDubGruppen.length) { box.innerHTML = `<p class="mv-legende">${t('gp_keine_dubletten')}</p>`; return; }

        <input type="checkbox" class="gp-dub-cb" data-i="${i}">
        <span>${escapeHtml(nm(g.person || ''))}${g.geboren ? ` (* ${escapeHtml(formatDatumLang(g.geboren) || g.geboren)})` : ''} — ${escapeHtml(nm(g.baeume || ''))} · ${g.anzahl}×</span>

// Mehrere Gruppen ankreuzen -> mit EINEM Klick alle verknüpfen (Auto-Angleich: vollständigste gewinnt).
async function gpVerknuepfeAusgewaehlte() {
  const cbs = [...document.querySelectorAll('.gp-dub-cb:checked')];
  if (!cbs.length) { await zeigeHinweis(t('merge_keine_auswahl')); return; }
  for (const cb of cbs) {
    const g = gpDubGruppen[+cb.dataset.i];
    if (!g || !g.ids || g.ids.length < 2) continue;
    for (let k = 1; k < g.ids.length; k++) {
      const { error } = await sbClient.rpc('personen_verknuepfen', { p_a: g.ids[0], p_b: g.ids[k], p_aufloesung: {} });
      if (error) { await zeigeHinweis(t('reg_fehler') + error.message); return; }
    }
  }
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  await gpLadeDubletten();
  const erfolg = document.getElementById('gp-modal-erfolg');
  erfolg.textContent = t('gp_verknuepft_weiter'); erfolg.style.display = 'block';
}
// Hinweis-Gruppe -> Konflikt-Abfrage für die ersten zwei Karten (Rest wird mit derselben
// Auflösung angehängt). So wirst du auch bei den Kindern gefragt, welche Daten korrekt sind.
async function gpLinkGruppe(i) {
  const g = gpDubGruppen[i];
  if (!g || !g.ids || g.ids.length < 2) return;
  gpSameTree = false;   // Auto-Dubletten sind immer baumübergreifend -> Spiegel-Verknüpfung
  await gpStartKonflikt(g.ids[0], g.ids[1], g.ids.slice(2));
}
function gpZeigeSchritt(n) {
  document.getElementById('gp-step1').style.display = (n === 1) ? '' : 'none';
  document.getElementById('gp-step2').style.display = (n === 2) ? '' : 'none';
}

// Schritt 1 -> Feld-Diff der zwei Karten laden, Konflikte zeigen (analog Baum zusammenlegen)
// Konflikt-Schritt für ein Paar starten (+ optional weitere Karten der Gruppe = Auto-Angleich danach)
async function gpStartKonflikt(a, b, rest) {
  const fehler = document.getElementById('gp-modal-fehler'); fehler.style.display = 'none';
  document.getElementById('gp-modal-erfolg').style.display = 'none';
  const { data: diff, error } = await sbClient.rpc('personen_feld_diff', { p_a: a, p_b: b });
  if (error) { fehler.textContent = t('reg_fehler') + error.message; fehler.style.display = 'block'; return; }
  gpPairA = a; gpPairB = b; gpRest = rest || [];
  gpDiff = (diff || []).filter(d => !GP_NAME_FELDER.includes(d.feld));   // 'name' ausblenden (abgeleitet)
  gpRenderKonflikte();
  gpRenderAuto();
  gpZeigeSchritt(2);
}
function gpRenderKonflikte() {
  const box = document.getElementById('gp-konflikte');
  const konf = gpDiff.filter(d => d.status === 'konflikt');
  if (!konf.length) { box.innerHTML = `<p class="mv-legende">${t('gp_keine_konflikte')}</p>`; return; }
  let html = `<div class="reg-gruppe-titel">${t('merge_konflikt_titel')}</div>`;
  konf.forEach(d => {
    const f = d.feld;
    html += `<div class="mg-konflikt">
      <div class="mg-feld">${escapeHtml(mgFeldLabel(f))}</div>
      <div class="mg-opt"><label><input type="radio" name="gp-k-${f}" value="a" checked> ${t('merge_wert_a')}: ${escapeHtml(mgWertAnzeige(f, d.wert_a))}</label></div>
      <div class="mg-opt"><label><input type="radio" name="gp-k-${f}" value="b"> ${t('merge_wert_b')}: ${escapeHtml(mgWertAnzeige(f, d.wert_b))}</label></div>
      <div class="mg-opt"><label><input type="radio" name="gp-k-${f}" value="m"> ${t('merge_manuell')}</label>
        <input type="text" class="login-feld gp-man" data-feld="${f}" value="${escapeHtml(d.wert_a || '')}"></div>
    </div>`;
  });
  box.innerHTML = html;
}
function gpRenderAuto() {
  const box = document.getElementById('gp-auto');
  const auto = gpDiff.filter(d => d.status !== 'konflikt');
  if (!auto.length) { box.innerHTML = ''; return; }
  let html = `<div class="reg-gruppe-titel">${t('merge_auto_titel')}</div>`;
  auto.forEach(d => {
    const wert = d.status === 'nur_b' ? d.wert_b : d.wert_a;
    html += `<div class="mg-auto-row"><b>${escapeHtml(mgFeldLabel(d.feld))}:</b> ${escapeHtml(mgWertAnzeige(d.feld, wert))}</div>`;
  });
  box.innerHTML = html;
}

}
// Baum-Auswahl geändert -> Dubletten + manuelle Personenlisten neu laden.

// Manuelle Auswahl: alle Personen beider Bäume in zwei Dropdowns laden (auch ohne Auto-Treffer).
async function gpLadePersonen() {
  const wrap = document.getElementById('gp-manuell');
  const a = document.getElementById('gp-baum-a').value;
  const b = document.getElementById('gp-baum-b').value;
  if (!a || !b) { if (wrap) wrap.style.display = 'none'; return; }   // gleicher Baum (a===b) ist erlaubt -> Merge zweier Karten im selben Baum
  const [ra, rb] = await Promise.all([
    sbClient.rpc('personen_eines_baums', { p_baum: a }),
    sbClient.rpc('personen_eines_baums', { p_baum: b })
  ]);
  if (ra.error || rb.error) { if (wrap) wrap.style.display = 'none'; return; }
  gpFuellePersonenSelect('gp-person-a', ra.data || []);
  gpFuellePersonenSelect('gp-person-b', rb.data || []);
  // Hinweis: bei gleichem Baum werden die Karten zusammengeführt (eine bleibt), nicht gespiegelt.
  const hinweis = document.getElementById('gp-merge-hinweis');
  if (hinweis) hinweis.style.display = (a === b) ? '' : 'none';
  if (wrap) wrap.style.display = '';
  macheAlleSelectsSuchbar(document.getElementById('gp-modal'));
}
function gpFuellePersonenSelect(id, liste) {
  const s = document.getElementById(id); if (!s) return;
  // 🔗 markiert Karten, die bereits als gleiche Person verknüpft sind.
  s.innerHTML = '<option value=""></option>' + (liste || []).map(p =>
    `<option value="${escapeHtml(p.id)}">${escapeHtml(nm(p.name || ''))}${p.identitaet_id ? ' 🔗' : ''}</option>`).join('');
  s.value = '';
}
// Manuell gewähltes Paar -> in den Konflikt-/Bestätigungsschritt (wie bei Auto-Dubletten).
async function gpManuellWeiter() {
  const fehler = document.getElementById('gp-modal-fehler'); fehler.style.display = 'none';
  const a = document.getElementById('gp-person-a').value;
  const b = document.getElementById('gp-person-b').value;
  if (!a || !b) { fehler.textContent = t('gp_personen_waehlen'); fehler.style.display = 'block'; return; }
  if (a === b) { fehler.textContent = t('gp_gleiche_karte'); fehler.style.display = 'block'; return; }
  // Gleicher Baum links+rechts -> die zwei Karten werden ZUSAMMENGEFÜHRT (eine bleibt),
  // statt als gleiche Person gespiegelt (zwei Karten im selben Baum ergeben keinen Sinn).
  gpSameTree = (document.getElementById('gp-baum-a').value === document.getElementById('gp-baum-b').value);
  await gpStartKonflikt(a, b, []);
}

async function gpModalVerknuepfen() {
  const fehler = document.getElementById('gp-modal-fehler2'); fehler.style.display = 'none';
  const a = gpPairA, b = gpPairB;
  if (!a || !b) { fehler.textContent = t('merge_baeume_waehlen'); fehler.style.display = 'block'; return; }

  // Konfliktauflösung sammeln (gewählter Endwert je Konfliktfeld)
  const aufloesung = {};
  gpDiff.filter(d => d.status === 'konflikt').forEach(d => {
    const f = d.feld;
    const sel = document.querySelector(`input[name="gp-k-${f}"]:checked`);
    const wahl = sel ? sel.value : 'a';
    if (wahl === 'a') aufloesung[f] = d.wert_a || '';
    else if (wahl === 'b') aufloesung[f] = d.wert_b || '';
    else { const man = document.querySelector(`.gp-man[data-feld="${f}"]`); aufloesung[f] = man ? man.value.trim() : ''; }
  });

  if (gpSameTree) {
    // Gleicher Baum: ZUSAMMENFÜHREN (eine Karte bleibt). Survivor = vollständigere Karte
    // (mehr nur_x-Felder); Beziehungen/Konto wandern auf sie, die Dublette wird gelöscht.
    const nurA = gpDiff.filter(d => d.status === 'nur_a').length;
    const nurB = gpDiff.filter(d => d.status === 'nur_b').length;
    const behalten = (nurB > nurA) ? b : a;
    const dublette = (nurB > nurA) ? a : b;
    const { error } = await sbClient.rpc('person_merge_aufgeloest',
      { p_behalten: behalten, p_dublette: dublette, p_aufloesung: aufloesung });
    if (error) { fehler.textContent = t('reg_fehler') + error.message; fehler.style.display = 'block'; return; }
  } else {
    const { error } = await sbClient.rpc('personen_verknuepfen', { p_a: a, p_b: b, p_aufloesung: aufloesung });
    if (error) { fehler.textContent = t('reg_fehler') + error.message; fehler.style.display = 'block'; return; }
    // Weitere Karten derselben Gruppe (z. B. >2 Bäume) mit der gewählten Auflösung anhängen
    for (const id of (gpRest || [])) {
      const { error: e2 } = await sbClient.rpc('personen_verknuepfen', { p_a: a, p_b: id, p_aufloesung: aufloesung });
      if (e2) { fehler.textContent = t('reg_fehler') + e2.message; fehler.style.display = 'block'; return; }
    }
  }
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  const warSelberBaum = gpSameTree;
  gpPairA = gpPairB = null; gpRest = []; gpSameTree = false;
  gpZeigeSchritt(1);
  gpFuelleBaeume();    // Suchfelder oben leeren -> direkt weitere Personen verknüpfen/mergen
  gpLadeDubletten();   // Hinweis-Liste aktualisieren
  const erfolg = document.getElementById('gp-modal-erfolg');
  erfolg.textContent = warSelberBaum ? t('merge_fertig') : t('gp_verknuepft_weiter');
  erfolg.style.display = 'block';
}

}

// ============================================================
// PERSON BEARBEITEN (nur Admins)
// ============================================================
async function zeigePersonBearbeiten(personId) {
  if (!istAdmin()) return;
  const p = aktuelleDaten.persons[personId];
  if (!p) return;
  // P4 (Soft-Lock, exklusiv): Bearbeitet bereits ein ANDERER diese Person?
  const lock = presenceLocks[personId];
  if (lock && lock.user_id !== (aktuellerUser && aktuellerUser.id)) {
    if (!darfSperreUebernehmen(personId)) {        // normale Admins: gesperrt
      await zeigeHinweis(t('lock_blockiert', { name: nm(lock.name) }));
      return;
    }
    // Owner/Super-Admin: Sperre mit Warnung übernehmen
    const ok = await zeigeBestaetigung(t('lock_uebernehmen_frage', { name: nm(lock.name) }), { gefahr: true });
    if (!ok) return;
  }
  schliesseModal();   // Detail-Fenster schließen, bevor der Editor aufgeht
  // Länder-Dropdowns (Geburtsland / Wohnland) in aktueller Sprache füllen, BEVOR die
  // Werte gesetzt werden (zentrale Komponente; wie Registrier-/Familieneinstellungen-Modal).
  fuelleLandSelects(document.getElementById('person-edit-modal'));
  const set  = (id, v) => { document.getElementById(id).value = v ?? ''; };
  const setD = (id, v) => datumSetzen(document.getElementById(id), v);   // Datumsfelder
  document.getElementById('pe-id').value = personId;
  document.getElementById('pe-geschlecht').value = p.sex || '';
  document.getElementById('pe-status').value = (p.deceased || p.death_date) ? 'verstorben' : 'lebend';
  set('pe-vorname', p.given);        set('pe-nachname', p.surname);
  set('pe-titel', p.titel);          set('pe-namenszusatz', p.namenszusatz);
  set('pe-ehename', p.ehename);      setD('pe-geburtsdatum', p.birth_date);
  set('pe-geburtsort', p.birth_place); setLandSelect('pe-geburtsland', p.geburtsland);
  set('pe-stadt', p.stadt);          set('pe-gemeinde', p.gemeinde);
  setD('pe-getauft', p.getauft);
  setD('pe-sterbedatum', p.death_date);
  set('pe-hochzeitsort', p.hochzeitsort);
  setD('pe-hochzeit-standesamt', p.hochzeit_standesamt || p.hochzeitstag);
  setD('pe-hochzeit-kirchlich', p.hochzeit_kirchlich);
  set('pe-beziehung-sonstige', p.beziehung_sonstige);
  document.getElementById('pe-beziehung').value =
    ['unbekannt','verheiratet','verlobt','partner','getrennt','geschieden','verwitwet','sonstige']
      .includes(p.beziehung) ? p.beziehung : 'unbekannt';
  set('pe-email', p.email);          set('pe-telefon', p.telefon);
  set('pe-facebook', p.facebook);    set('pe-instagram', p.instagram);
  setLandSelect('pe-wohnland', p.wohnort_land); set('pe-wohnstadt', p.wohnort_stadt);
  set('pe-adresse', p.adresse);      set('pe-beruf', p.beruf);
  set('pe-ausbildung', p.ausbildung); set('pe-beschreibung', p.beschreibung);
  document.getElementById('pe-fehler').style.display = 'none';
  document.getElementById('pe-erfolg').style.display = 'none';
  pePruefeFelder();   // bedingte Felder (Sterbedatum / Hochzeit / Sonstige) anzeigen
  document.getElementById('person-edit-modal').classList.add('aktiv');
  // P3: Stand merken + evtl. alten Hinweis entfernen (Formular wurde frisch befüllt).
  editWatchId = personId; editWatchSig = personSignatur(personId);
  editBaselineUpdated = p._updated || null;   // P5: Stand beim Öffnen merken (Optimistic Locking)
  const ban = document.getElementById('sync-hinweis-edit'); if (ban) ban.remove();
  presenceTrack(personId);   // P4: Bearbeitungssperre für diese Person setzen
}

// Bedingte Felder im Editor ein-/ausblenden

async function speicherePerson(force) {
  if (!istAdmin()) return;
  const personId = document.getElementById('pe-id').value;
  const pObj     = aktuelleDaten.persons[personId];
  const fehlerEl = document.getElementById('pe-fehler');
  const erfolgEl = document.getElementById('pe-erfolg');
  const button   = document.getElementById('pe-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';
  if (!pObj || !pObj._uuid) { fehlerEl.textContent = 'Person nicht gefunden.'; fehlerEl.style.display = 'block'; return; }

  const v  = id => document.getElementById(id).value.trim();
  const vd = id => datumWert(document.getElementById(id));   // Datumsfelder -> ISO/Freitext
  // Kontakt-E-Mail (optional) muss gültig sein, falls gesetzt
  if (!pruefeEmailFeld(document.getElementById('pe-email'), false)) {
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('pe-email').focus(); return;
  }
  const altText = button.textContent;
  button.disabled = true; button.textContent = t('reg_senden_laeuft');

  // Pristine stammbaum_daten + aktuellen Stand (updated_at) holen
  const { data: row, error: lErr } = await sbClient.from('personen')
    .select('stammbaum_daten, updated_at').eq('id', pObj._uuid).single();
  if (lErr) {
    button.disabled = false; button.textContent = altText;
    fehlerEl.textContent = t('reg_fehler') + lErr.message; fehlerEl.style.display = 'block'; return;
  }
  const sd = row.stammbaum_daten || {};
  const verstorben = document.getElementById('pe-status').value === 'verstorben';
  const neu = {
    ...sd,
    sex: document.getElementById('pe-geschlecht').value || '',
    given: v('pe-vorname'), surname: v('pe-nachname'),
    titel: v('pe-titel'), namenszusatz: v('pe-namenszusatz'), ehename: v('pe-ehename'),
    birth_date: vd('pe-geburtsdatum'), birth_place: v('pe-geburtsort'), geburtsland: v('pe-geburtsland'),
    stadt: v('pe-stadt'), gemeinde: v('pe-gemeinde'),
    getauft: vd('pe-getauft'),
    hochzeitsort: v('pe-hochzeitsort'),
    hochzeit_standesamt: vd('pe-hochzeit-standesamt'),
    hochzeit_kirchlich: vd('pe-hochzeit-kirchlich'),
    hochzeitstag: '',                                    // altes Einzelfeld nicht mehr genutzt
    beziehung: document.getElementById('pe-beziehung').value,
    beziehung_sonstige: v('pe-beziehung-sonstige'),
    email: v('pe-email'), telefon: v('pe-telefon'), facebook: v('pe-facebook'), instagram: v('pe-instagram'),
    wohnort_land: v('pe-wohnland'), wohnort_stadt: v('pe-wohnstadt'), adresse: v('pe-adresse'),
    beruf: v('pe-beruf'), ausbildung: v('pe-ausbildung'), beschreibung: v('pe-beschreibung'),
    deceased: verstorben,
    death_date: verstorben ? vd('pe-sterbedatum') : ''
  };
  neu.name = (neu.given + ' ' + neu.surname).trim();

  // P5 (Konflikterkennung / Optimistic Locking): Hat jemand die Zeile seit dem Öffnen geändert?
  if (!force && editBaselineUpdated && row.updated_at && row.updated_at !== editBaselineUpdated) {
    button.disabled = false; button.textContent = altText;
    zeigeKonfliktDialog(personId, neu, row.stammbaum_daten || {});
    return;
  }

  const { error: uErr } = await sbClient.from('personen')
    .update({ stammbaum_daten: neu, vorname: neu.given, nachname: neu.surname }).eq('id', pObj._uuid);
  button.disabled = false; button.textContent = altText;
  if (uErr) { fehlerEl.textContent = t('reg_fehler') + uErr.message; fehlerEl.style.display = 'block'; return; }
  editBaselineUpdated = null;   // P5: gespeichert -> kein erneuter Konflikt-Check bis Wieder-Öffnen

  // In-memory aktualisieren + neu zeichnen (kein voller Reload, Baumkontext bleibt)
  Object.assign(pObj, {
    sex: neu.sex, given: neu.given, surname: neu.surname, name: neu.name,
    titel: neu.titel, namenszusatz: neu.namenszusatz, ehename: neu.ehename,
    birth_date: neu.birth_date, birth_place: neu.birth_place, geburtsland: neu.geburtsland,
    getauft: neu.getauft, hochzeitsort: neu.hochzeitsort,
    hochzeit_standesamt: neu.hochzeit_standesamt, hochzeit_kirchlich: neu.hochzeit_kirchlich,
    beziehung: neu.beziehung, beziehung_sonstige: neu.beziehung_sonstige,
    email: neu.email, telefon: neu.telefon, facebook: neu.facebook, instagram: neu.instagram,
    wohnort_land: neu.wohnort_land, wohnort_stadt: neu.wohnort_stadt, adresse: neu.adresse,
    beruf: neu.beruf, ausbildung: neu.ausbildung, beschreibung: neu.beschreibung,
    deceased: neu.deceased, death_date: neu.death_date
  });
  zeichneBaumNeu();
  erfolgEl.textContent = t('pe_gespeichert'); erfolgEl.style.display = 'block';

  // Verknüpfte Person (gleiche Person über Bäume): Biografie wurde per DB-Trigger auf alle
  // Zwillinge übertragen -> Baum neu laden, damit die anderen Karten sofort aktualisiert sind.
  if (pObj._ident && typeof ladeBaumDaten === 'function') await ladeBaumDaten();

  // DUBLETTEN-FRÜHERKENNUNG (Bearbeiten): mit den NEUEN Werten prüfen, eigene Karte ausschließen.
  // Treffer -> Verknüpfung (modus 'merge': die zwei Karten zu einer zusammenführen).
  const { data: matches } = await sbClient.rpc('dubletten_check_global', {
    p_vorname: neu.given, p_nachname: neu.surname, p_birth_date: neu.birth_date,
    p_land: neu.geburtsland, p_exclude_person: pObj._uuid
  });
  if (matches && matches.length) {
    zeigeDublettenDialog(matches, {
      modus: 'merge', kontext: pObj._uuid, typ: null, zweiter: null,
      proceed: () => schliessePersonEdit(),
      onLinked: async () => { schliessePersonEdit(); if (typeof ladeBaumDaten === 'function') await ladeBaumDaten(); }
    });
    return;
  }
  setTimeout(() => schliessePersonEdit(), 900);
}

// Felder, die im Vergleich gegenübergestellt werden (Schlüssel in stammbaum_daten -> i18n-Label).
const KONFLIKT_FELDER = [
  ['given','reg_vorname'], ['surname','reg_nachname'], ['titel','pe_titel'],
  ['namenszusatz','pe_namenszusatz'], ['ehename','pe_ehename'], ['sex','pe_geschlecht'],
  ['birth_date','reg_geburtsdatum'], ['birth_place','reg_geburtsort'], ['geburtsland','reg_geburtsland'],
  ['stadt','fe_grad'], ['gemeinde','fe_opstina'], ['getauft','reg_getauft'],
  ['beziehung','pe_beziehung'], ['beziehung_sonstige','pe_beziehung_sonstige'],
  ['hochzeitsort','pe_hochzeitsort'], ['hochzeit_standesamt','pe_hochzeit_standesamt'],
  ['hochzeit_kirchlich','pe_hochzeit_kirchlich'],
  ['email','reg_kontakt_email'], ['telefon','reg_telefon'], ['facebook','reg_facebook'], ['instagram','reg_instagram'],
  ['wohnort_land','pe_wohnland'], ['wohnort_stadt','pe_wohnstadt'], ['adresse','pe_adresse'],
  ['beruf','pe_beruf'], ['ausbildung','pe_ausbildung'], ['beschreibung','pe_beschreibung'],
  ['deceased','pe_status'], ['death_date','pe_sterbedatum']
];
let konfliktPersonId = null, konfliktNeu = null, konfliktTheirs = null;

// Werte menschenlesbar formatieren (Datum/Land/Geschlecht/Status/Beziehung).
function konfliktWert(key, val) {
  if (val === undefined || val === null || val === '') return key === 'deceased' ? t('nein') : '—';
  if (key === 'deceased') return val ? t('ja') : t('nein');
  if (['birth_date','death_date','getauft','hochzeit_standesamt','hochzeit_kirchlich'].includes(key)) return formatDatumLang(val) || String(val);
  if (['geburtsland','wohnort_land'].includes(key)) return landAnzeige(val) || String(val);
  if (key === 'sex') return val === 'M' ? t('maennlich') : (val === 'F' ? t('weiblich') : t('unbekannt'));
  if (key === 'beziehung') return t('bz_' + val);
  return String(val);
}

function konfliktOverlayBau(innerHtml) {
  let ov = document.getElementById('konflikt-overlay');
  if (!ov) { ov = document.createElement('div'); ov.id = 'konflikt-overlay'; ov.className = 'confirm-overlay'; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="confirm-box konflikt-box">${innerHtml}</div>`;
}
function konfliktSchliessen() {
  const ov = document.getElementById('konflikt-overlay'); if (ov) ov.remove();
  konfliktPersonId = null; konfliktNeu = null; konfliktTheirs = null;
}

function zeigeKonfliktDialog(personId, neu, theirs) {
  konfliktPersonId = personId; konfliktNeu = neu; konfliktTheirs = theirs;
  konfliktErsteAnsicht();
}
function konfliktErsteAnsicht() {
  konfliktOverlayBau(`
    <p class="confirm-text" style="text-align:left"><strong>${escapeHtml(t('konflikt_titel'))}</strong></p>
    <p class="confirm-text" style="text-align:left">${escapeHtml(t('konflikt_text'))}</p>
    <div class="konflikt-actions">
      <button type="button" class="confirm-ja confirm-gefahr" onclick="konfliktMeine()">${escapeHtml(t('konflikt_meine'))}</button>
      <button type="button" class="confirm-ja" onclick="konfliktAktuelle()">${escapeHtml(t('konflikt_aktuelle'))}</button>
      <button type="button" class="confirm-nein" onclick="konfliktVergleich()">${escapeHtml(t('konflikt_vergleich'))}</button>
    </div>`);
}

function konfliktVergleich() {
  if (!konfliktNeu || !konfliktTheirs) return;
  const gleich = (a, b) => String(a ?? '') === String(b ?? '');
  const zeilen = KONFLIKT_FELDER
    .filter(([k]) => !gleich(konfliktNeu[k], konfliktTheirs[k]))
    .map(([k, lk]) => `<tr><td class="kd-feld">${escapeHtml(t(lk))}</td><td>${escapeHtml(konfliktWert(k, konfliktNeu[k]))}</td><td>${escapeHtml(konfliktWert(k, konfliktTheirs[k]))}</td></tr>`)
    .join('');
  const tabelle = zeilen
    ? `<div class="konflikt-diff-wrap"><table class="konflikt-diff"><thead><tr>
        <th>${escapeHtml(t('konflikt_feld'))}</th><th>${escapeHtml(t('konflikt_spalte_meine'))}</th><th>${escapeHtml(t('konflikt_spalte_aktuell'))}</th>
        </tr></thead><tbody>${zeilen}</tbody></table></div>`
    : `<p class="confirm-text" style="text-align:left">${escapeHtml(t('konflikt_keine_diff'))}</p>`;
  konfliktOverlayBau(`
    <p class="confirm-text" style="text-align:left"><strong>${escapeHtml(t('konflikt_titel'))}</strong></p>
    ${tabelle}
    <div class="konflikt-actions">
      <button type="button" class="confirm-ja confirm-gefahr" onclick="konfliktMeine()">${escapeHtml(t('konflikt_meine'))}</button>
      <button type="button" class="confirm-ja" onclick="konfliktAktuelle()">${escapeHtml(t('konflikt_aktuelle'))}</button>
      <button type="button" class="confirm-nein" onclick="konfliktErsteAnsicht()">${escapeHtml(t('zurueck'))}</button>
    </div>`);
}

function konfliktMeine() {
  konfliktSchliessen();
  speicherePerson(true);   // Force: meine Werte schreiben, ohne erneuten Konflikt-Check
}
async function konfliktAktuelle() {
  const id = konfliktPersonId;
  konfliktSchliessen();
  schliessePersonEdit();                 // eigene (verworfene) Eingaben schließen + Lock freigeben
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  if (id && aktuelleDaten.persons[id]) zeigePersonBearbeiten(id);   // mit frischen Werten neu öffnen
  await zeigeHinweis(t('konflikt_aktuelle_geladen'));
}

// Ehepartner der aktiven Person (für die Zweit-Elternteil-Abfrage beim Kind)
let paSpouses = [];
let paVater = null;        // gewählter Vater  { uuid, name } oder null
let paMutter = null;       // gewählte Mutter { uuid, name } oder null
let paElternTimer = null;  // Debounce für die Eltern-Suche
let paElternTreffer = {};  // id -> Anzeigename der letzten Eltern-Suche (für sichere Auswahl)

// ============================================================
// ＋ : NEUE PERSON  ODER  BESTEHENDE PERSON VERKNÜPFEN (Blutlinie)
// ============================================================
let pcKontext = null;   // { personId, typ }
let vbKontext = null;   // { personId, uuid, typ }
let vbSpouses = [];     // Ehepartner des Kontexts (für Zweit-Elternteil bei 'kind')
let vbTimer   = null;   // Debounce-Timer für die Live-Suche

const BEZTYP_GUELTIG = ['kind','elternteil','partner','geschwister'];

// ＋ geklickt -> erst fragen: neue Person erstellen oder bestehende verknüpfen?
function personPlus(personId, vorTyp) {

function pcBestehend() {
