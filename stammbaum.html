// Live-Suche: Debounce 300 ms, ab 2 Zeichen in mind. einem Feld
function vbSucheDebounce() {
  if (vbTimer) clearTimeout(vbTimer);
  vbTimer = setTimeout(vbSuche, 300);
}
async function vbSuche() {
  const box = document.getElementById('vb-ergebnis'); if (!vbKontext || !box) return;
  const vor  = document.getElementById('vb-vorname').value.trim();
  const nach = document.getElementById('vb-nachname').value.trim();
  const geb  = document.getElementById('vb-geburt').value.trim();
  if (vor.length < 2 && nach.length < 2 && geb.length < 2) {
    box.innerHTML = `<p class="mv-legende">${t('vb_min_zeichen')}</p>`; return;
  }
  box.innerHTML = `<p class="mv-legende">…</p>`;
  const { data, error } = await sbClient.rpc('personen_suche', {
    p_vorname: vor || null, p_nachname: nach || null, p_geburt: geb || null, p_limit: 30, p_offset: 0
  });
  if (!vbKontext) return;   // Modal zwischenzeitlich geschlossen
  if (error) { box.innerHTML = `<p class="login-fehler" style="display:block">${escapeHtml(t('reg_fehler') + error.message)}</p>`; return; }
  // Sich selbst UND alle identitäts-verknüpften Zwillinge (= gleiche reale Person, 🔗) ausblenden —
  // sonst bietet die Suche die eigene Karte als Ziel an und das Verknüpfen scheitert mit
  // „Verbindung existiert bereits".
  const ctxP = aktuelleDaten.persons[vbKontext.personId];
  const ausschluss = new Set([vbKontext.uuid]);
  if (ctxP && ctxP._ident) {
    Object.values(aktuelleDaten.persons).forEach(x => {
      if (x._ident === ctxP._ident && x._uuid) ausschluss.add(x._uuid);
    });
  }
  // sich selbst + Zwillinge ausblenden UND gespiegelte Karten (gleiche identitaet_id) = 1 Person
  const liste = entdoppeltePersonen((data || []).filter(r => !ausschluss.has(r.id)));
  if (!liste.length) { box.innerHTML = `<p class="mv-legende">${t('vb_keine_treffer')}</p>`; return; }
  box.innerHTML = liste.map(vbErgebnisHtml).join('');
}
function vbErgebnisHtml(r) {
  const det = [];
  if (r.birth_date) det.push(`* ${escapeHtml(formatDatumLang(r.birth_date) || r.birth_date)}`);
  if (r.death_date) det.push(`† ${escapeHtml(formatDatumLang(r.death_date) || r.death_date)}`);
  if (r.baum)    det.push(`${escapeHtml(t('merge_info_baum'))}: ${escapeHtml(trefferBaumLabel(r))}`);
  if (r.eltern)  det.push(`${escapeHtml(t('merge_info_eltern'))}: ${escapeHtml(nm(r.eltern))}`);
  if (r.partner) det.push(`${escapeHtml(t('merge_info_partner'))}: ${escapeHtml(nm(r.partner))}`);
  return `<div class="mg-kandidat">
    <div class="mg-person"><span class="mg-namen">${escapeHtml(nm(r.name || ''))}${r.identitaet_id ? ' 🔗' : ''}</span>
      <span style="display:block;font-size:12px;opacity:.72;margin-top:2px">${det.join(' · ')}</span></div>
    <button class="mv-toggle" type="button" onclick="vbVerknuepfe('${r.id}')">${escapeHtml(t('vb_verknuepfen'))}</button>
  </div>`;
}
function vbFehlerText(msg) {
  msg = msg || '';
  if (/vkn_selbst/.test(msg))          return t('vkn_selbst');
  if (/vkn_zyklus/.test(msg))          return t('vkn_zyklus');
  if (/vkn_kante_existiert/.test(msg)) return t('vkn_kante_existiert');
  return t('reg_fehler') + msg;
}
// Bestehende Person als gewählten Beziehungstyp verknüpfen (Cycle/Dup prüft die RPC).
async function vbVerknuepfe(zielId) {
  if (!vbKontext) return;
  const fehler = document.getElementById('vb-fehler'); fehler.style.display = 'none';
  let kontext = vbKontext.uuid, typ = vbKontext.typ, zweiter = null;

  if (typ === 'geschwister') {
    // Geschwister = gleiche Eltern: ziel als Kind der Eltern des Kontexts hängen
    const p = aktuelleDaten.persons[vbKontext.personId];
    const elternUuids = [];
    ((p && p.families_child) || []).forEach(fid => {
      const fam = aktuelleDaten.families[fid]; if (!fam) return;
      [fam.husband, fam.wife].forEach(pe => {
        const par = pe && aktuelleDaten.persons[pe];
        if (par && par._uuid && !elternUuids.includes(par._uuid)) elternUuids.push(par._uuid);
      });
    });
    if (!elternUuids.length) {
      // Bezugsperson ohne Eltern -> Platzhalter-Elternteil ("Unbekannt") anlegen, Bezugsperson
      // daran hängen; das Ziel wird anschließend als weiteres Kind verknüpft (echte Geschwister).
      const famId2 = stammbaumZuFamilie[p && p._tree] || null;
      const ph = await erzeugePlatzhalterElternteil(famId2, p && p._tree);
      if (!ph) { fehler.textContent = t('reg_fehler') + '—'; fehler.style.display = 'block'; return; }
      const { error: bErr } = await sbClient.from('beziehungen')
        .insert({ person_a: ph, person_b: vbKontext.uuid, typ: 'elternteil', familie_id: famId2 });
      if (bErr) { fehler.textContent = vbFehlerText(bErr.message); fehler.style.display = 'block'; return; }
      elternUuids.push(ph);
    }
    kontext = elternUuids[0]; typ = 'kind'; zweiter = elternUuids[1] || null;
  } else if (typ === 'kind' && vbSpouses.length) {
    zweiter = (vbSpouses.length === 1) ? vbSpouses[0].uuid
            : (document.getElementById('vb-elternteil2').value || null);
  }

  const { data, error } = await sbClient.rpc('verknuepfung_anfragen', {
    p_modus: 'beziehung', p_kontext: kontext, p_ziel: zielId, p_typ: typ, p_zweiter: zweiter
  });
  if (error) { fehler.textContent = vbFehlerText(error.message); fehler.style.display = 'block'; return; }
  // Kind in alle Bäume beider Eltern spiegeln (Kind = ziel bei "kind", = kontext bei "elternteil").
  const childId = (typ === 'kind') ? zielId : (typ === 'elternteil') ? kontext : null;
  const fokus = vbKontext.personId;
  schliesseVerbinden();
  if (data === 'sofort') {
    if (childId) { try { await sbClient.rpc('kind_baeume_sync', { p_kind: childId }); } catch (e) { console.warn('kind_baeume_sync:', e); } }
    if (typeof reloadBaumBehalteFokus === 'function') await reloadBaumBehalteFokus(fokus);
  }
  await zeigeHinweis(t(data === 'sofort' ? 'vkn_sofort' : 'vkn_angefragt'));
}

// Aus dem Detail-Overlay heraus: neue Person im Kontext der aktiven Person anlegen.
// vorTyp (optional): Beziehung vorbelegen ('kind'|'elternteil'|'partner'|'geschwister') — änderbar.
function zeigePersonHinzufuegen(personId, vorTyp) {
  if (!istAdmin()) return;
  const p = aktuelleDaten.persons[personId];
  if (!p) return;
  schliesseModal();   // immer nur EIN Overlay aktiv
  // Länder-Dropdowns (Geburtsland / Wohnland) in aktueller Sprache füllen
  // (zentrale Komponente; wie Registrier-/Familieneinstellungen-Modal).
  fuelleLandSelects(document.getElementById('person-add-modal'));
  document.getElementById('pa-context-id').value = personId;
  // Kopf wird nach dem Setzen des Beziehungstyps über paAktualisiereKontext() (in
  // paPruefeFelder) befüllt — er zeigt die GEWÄHLTE Beziehung deutlich an.
  // Alle Eingabefelder leeren
  ['pa-vorname','pa-nachname','pa-geburtsdatum','pa-geburtsort','pa-geburtsland','pa-sterbedatum',
   'pa-stadt','pa-gemeinde',
   'pa-titel','pa-namenszusatz','pa-ehename','pa-getauft','pa-hochzeitsort',
   'pa-hochzeit-standesamt','pa-hochzeit-kirchlich','pa-beziehung-sonstige',
   'pa-email','pa-telefon','pa-facebook','pa-instagram',
   'pa-wohnland','pa-wohnstadt','pa-adresse','pa-beruf','pa-ausbildung','pa-beschreibung']
    .forEach(id => document.getElementById(id).value = '');
  ['pa-geburtsdatum','pa-sterbedatum','pa-getauft','pa-hochzeit-standesamt','pa-hochzeit-kirchlich']
    .forEach(id => datumSetzen(document.getElementById(id), ''));   // Datumsfelder + iso zurücksetzen
  document.getElementById('pa-geschlecht').value = '';
  document.getElementById('pa-status').value = 'lebend';
  document.getElementById('pa-beziehung').value = 'unbekannt';
  // Expliziter Typ (Sektions-＋) -> vorbelegen; generischer "＋ Person hinzufügen" (kein vorTyp)
  // -> LEER lassen, damit der Nutzer die Beziehung AKTIV wählen muss (kein stiller "Kind"-Default).
  document.getElementById('pa-beziehungstyp').value =
    ['kind','elternteil','partner','geschwister'].includes(vorTyp) ? vorTyp : '';

  // Ehepartner der aktiven Person ermitteln (für die Eltern-Vorbelegung bei "Kind")
  paSpouses = [];
  (p.families_spouse || []).forEach(fid => {
    const fam = aktuelleDaten.families[fid]; if (!fam) return;
    const partnerExt = fam.husband === personId ? fam.wife : fam.husband;
    const partner = partnerExt ? aktuelleDaten.persons[partnerExt] : null;
    if (partner && partner._uuid) paSpouses.push({ uuid: partner._uuid, name: nm(partner.name || partner.given || '?') });
  });
  // Vater/Mutter VORBELEGEN: Kontextperson nach Geschlecht (F -> Mutter, sonst Vater),
  // eindeutigen Ehepartner in den anderen Slot. Beides bleibt änderbar/entfernbar.
  paVater = null; paMutter = null;
  const ctxRolle = (p.sex || '').toUpperCase() === 'F' ? 'mutter' : 'vater';
  paSetzeElternteil(ctxRolle, p._uuid, nm(p.name || p.given || '?'));
  const andereRolle = ctxRolle === 'vater' ? 'mutter' : 'vater';
  if (paSpouses.length === 1) paSetzeElternteil(andereRolle, paSpouses[0].uuid, paSpouses[0].name);
  else paSetzeElternteil(andereRolle, null, null);

  document.getElementById('pa-fehler').style.display = 'none';
  document.getElementById('pa-erfolg').style.display = 'none';
  feldFehlerReset('person-add-modal');   // alte Feld-Fehler/Hinweise löschen
  paPflichtMarkierung();                  // Mädchenname-* je nach Geschlecht setzen
  paPruefeFelder();
  // Hilfe nur beim ersten Mal automatisch zeigen (dismissible)
  let gesehen = false;
  try { gesehen = localStorage.getItem('hasSeenTreeHelp') === 'true'; } catch (e) {}
  document.getElementById('pa-hilfe').style.display = gesehen ? 'none' : 'block';
  document.getElementById('person-add-modal').classList.add('aktiv');
}

function paPruefeFelder() {
  const verstorben = document.getElementById('pa-status').value === 'verstorben';
  document.getElementById('pa-row-sterbedatum').style.display = verstorben ? '' : 'none';
  // Beziehung (Ehe -> Hochzeitsfelder, Sonstige -> Freitext)
  const bez = document.getElementById('pa-beziehung').value;
  const ehe = bez === 'verheiratet';
  document.getElementById('pa-row-hochzeitsort').style.display = ehe ? '' : 'none';
  document.getElementById('pa-row-standesamt').style.display   = ehe ? '' : 'none';
  document.getElementById('pa-row-kirchlich').style.display    = ehe ? '' : 'none';
  document.getElementById('pa-row-sonstige').style.display     = (bez === 'sonstige') ? '' : 'none';
  // Vater/Mutter-Block nur bei "Kind"
  const typ = document.getElementById('pa-beziehungstyp').value;

// Kopf des Anlegen-Overlays: macht die GEWÄHLTE Beziehung deutlich sichtbar. Der prominente
// generische "＋ Person hinzufügen"-Button startet auf "Kind" — wer den Beziehungstyp nicht
// aktiv umstellt, legte sonst unbemerkt ein Kind statt z. B. eines Geschwisters an. Wird beim
// Öffnen UND bei JEDEM Dropdown-Wechsel (onchange="paPruefeFelder()") aufgerufen. Der
// Beziehungstyp wird gold hervorgehoben; sprach-/wortstellungssicher über Sentinel-Marker.
function paAktualisiereKontext() {
  const el = document.getElementById('pa-kontext'); if (!el) return;
  const p = aktuelleDaten.persons[document.getElementById('pa-context-id').value];
  if (!p) { el.textContent = ''; return; }
  const typ  = document.getElementById('pa-beziehungstyp').value;
  const name = nm(p.name || p.given || '?');
  // Noch KEINE Beziehung gewählt (generischer Button) -> klare Aufforderung statt Label.

    el.innerHTML = `<strong style="color:#9c7c3c">${escapeHtml(t('pa_kontext_bitte', { name }))}</strong>`;
    return;
  }

  el.innerHTML = escapeHtml(tpl)
    .replace('@@BEZ@@', `<strong style="color:#9c7c3c">${escapeHtml(t('beztyp_' + typ))}</strong>`)
    .replace('@@NAME@@', `<strong>${escapeHtml(name)}</strong>`);

// --- Vater/Mutter-Picker (durchsuchbar über aktuellen + verknüpfte Bäume) ---
// rolle = 'vater' | 'mutter'. Setzt/löscht die Auswahl und schaltet zwischen
// Such-Eingabe und gewählter "Chip"-Anzeige um.
function paSetzeElternteil(rolle, uuid, name) {
  const obj = uuid ? { uuid, name } : null;
  if (rolle === 'vater') paVater = obj; else paMutter = obj;
  const chip  = document.getElementById('pa-' + rolle + '-chip');
  const suche = document.getElementById('pa-' + rolle + '-suche');
  const erg   = document.getElementById('pa-' + rolle + '-erg');
  if (!chip || !suche || !erg) return;
  erg.innerHTML = ''; suche.value = '';
  if (obj) {
    document.getElementById('pa-' + rolle + '-name').textContent = name || '';
    chip.style.display = 'flex'; suche.style.display = 'none';
  } else {
    chip.style.display = 'none'; suche.style.display = '';
  }
}
function paEntferneElternteil(rolle) { paSetzeElternteil(rolle, null, null); }
function paElternSucheDebounce(rolle) {
  if (paElternTimer) clearTimeout(paElternTimer);
  paElternTimer = setTimeout(() => paElternSuche(rolle), 300);
}
async function paElternSuche(rolle) {
  const erg = document.getElementById('pa-' + rolle + '-erg');
  const q = document.getElementById('pa-' + rolle + '-suche').value.trim();
  if (q.length < 2) { erg.innerHTML = ''; return; }
  erg.innerHTML = `<div class="pa-elt-opt" style="cursor:default;opacity:.6">…</div>`;
  // personen_suche AND-et Vor-/Nachname -> für eine Box je eine Präfix-Suche und mergen.
  const [r1, r2] = await Promise.all([
    sbClient.rpc('personen_suche', { p_vorname: q, p_nachname: null, p_geburt: null, p_limit: 15, p_offset: 0 }),
    sbClient.rpc('personen_suche', { p_vorname: null, p_nachname: q, p_geburt: null, p_limit: 15, p_offset: 0 })
  ]);
  if (r1.error || r2.error) {
    erg.innerHTML = `<div class="pa-elt-opt" style="cursor:default;color:#b33">${escapeHtml((r1.error || r2.error).message)}</div>`; return;
  }
  const aktivUuid = (aktuelleDaten.persons[document.getElementById('pa-context-id').value] || {})._uuid;
  const andere = (rolle === 'vater' ? paMutter : paVater);
  const seen = new Set(); const vor = [];
  [...(r1.data || []), ...(r2.data || [])].forEach(rw => {
    if (seen.has(rw.id)) return; seen.add(rw.id);
    if (rw.id === aktivUuid) return;                 // Kontext (= Kind-Bezug) nicht als Elternteil
    if (andere && rw.id === andere.uuid) return;     // bereits als anderer Elternteil gewählt
    vor.push(rw);
  });
  // Gespiegelte Karten (gleiche identitaet_id) = EINE reale Person -> nur 1x anbieten.
  const liste = entdoppeltePersonen(vor);
  if (!liste.length) { erg.innerHTML = `<div class="pa-elt-opt" style="cursor:default;opacity:.6">${escapeHtml(t('vb_keine_treffer'))}</div>`; return; }
  // Namen NICHT durchs onclick-Attribut schleusen (Quote-Injection) -> Lookup über id.
  paElternTreffer = {};
  erg.innerHTML = liste.slice(0, 20).map(rw => {
    paElternTreffer[rw.id] = nm(rw.name || '');
    const det = [];
    if (rw.birth_date) det.push('* ' + escapeHtml(formatDatumLang(rw.birth_date) || rw.birth_date));
    if (rw.baum)       det.push(escapeHtml(trefferBaumLabel(rw)));
    return `<div class="pa-elt-opt" onclick="paWaehleErgebnis('${rolle}','${rw.id}')">${escapeHtml(nm(rw.name || ''))}${rw.identitaet_id ? ' 🔗' : ''}<span class="pa-elt-meta">${det.join(' · ')}</span></div>`;
  }).join('');
}
function paWaehleErgebnis(rolle, uuid) { paSetzeElternteil(rolle, uuid, paElternTreffer[uuid] || ''); }

// Legt einen Platzhalter-Elternteil ("Unbekannt") im angegebenen Baum an, an den Geschwister
// gehängt werden, wenn die Bezugsperson noch KEINE Eltern hat. So muss der Nutzer keine Eltern
// vorab manuell erfassen. Gibt die neue UUID zurück (oder null bei Fehler). Der Anzeigename ist
// sprachneutral markiert (stammbaum_daten.platzhalter) und wird beim Laden/Sprachwechsel lokalisiert.
async function erzeugePlatzhalterElternteil(familie_id, stammbaum_id) {
  if (!familie_id || !stammbaum_id) return null;
  const externeId = 'I' + Date.now() + 'P' + Math.floor(Math.random() * 1000);
  const label = t('pa_platzhalter_name');
  const stammbaum_daten = {
    id: externeId, given: label, surname: '', name: label, sex: '',
    platzhalter: true, angelegt_aus: 'geschwister-platzhalter'
  };
  const { data, error } = await sbClient.from('personen').insert({
    familie_id, stammbaum_id, externe_id: externeId,
    vorname: label, nachname: '',
    geburtsdatum: null, stammbaum_daten
  }).select('id').single();
  if (error || !data) { console.warn('Platzhalter-Elternteil:', error); return null; }
  return data.id;
}

async function speichereNeuePerson() {
  if (!istAdmin()) return;
  const fehlerEl = document.getElementById('pa-fehler');
  const erfolgEl = document.getElementById('pa-erfolg');
  const button   = document.getElementById('pa-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';
  feldFehlerReset('person-add-modal');   // alte Feld-Fehler zurücksetzen

  const aktivId = document.getElementById('pa-context-id').value;
  const aktiv   = aktuelleDaten.persons[aktivId];
  if (!aktiv || !aktiv._uuid) { fehlerEl.textContent = t('pa_kein_kontext'); fehlerEl.style.display = 'block'; return; }

  // Beziehung zur aktiven Person ist PFLICHT — der generische "＋ Person hinzufügen"-Button
  // startet ohne Vorauswahl, damit nicht unbemerkt ein "Kind" angelegt wird (Fehler am Feld).
  const typ = document.getElementById('pa-beziehungstyp').value;   // kind | elternteil | partner | geschwister
  if (!['kind','elternteil','partner','geschwister'].includes(typ))
    return feldFehler('pa-beziehungstyp', t('pa_bez_pflicht'));

  const v  = id => document.getElementById(id).value.trim();
  const vd = id => datumWert(document.getElementById(id));   // Datumsfelder -> ISO/Freitext
  const vorname  = v('pa-vorname');
  const nachname = v('pa-nachname') || aktiv.surname || '';
  const sex      = document.getElementById('pa-geschlecht').value || '';
  // Pflicht: Vorname + Nachname (alle) + Mädchenname bei Frauen — Fehler direkt am Feld
  if (!pruefeNamePflicht('pa', vorname, nachname, sex, v('pa-ehename'))) return;
  // Kontakt-E-Mail (optional) muss gültig sein, falls gesetzt (Hinweis steht am Feld)
  if (!pruefeEmailFeld(document.getElementById('pa-email'), false)) return feldFokus('pa-email');

  const verstorben = document.getElementById('pa-status').value === 'verstorben';

  const altText = button.textContent;
  button.disabled = true; button.textContent = t('reg_senden_laeuft');

  // familie_id + stammbaum_id der aktiven Person frisch holen (für Besitz/Baum)
  const { data: kontext, error: kErr } = await sbClient.from('personen')
    .select('familie_id, stammbaum_id').eq('id', aktiv._uuid).single();
  if (kErr || !kontext) {
    button.disabled = false; button.textContent = altText;
    fehlerEl.textContent = t('reg_fehler') + (kErr ? kErr.message : '—'); fehlerEl.style.display = 'block'; return;
  }

  const ehe = document.getElementById('pa-beziehung').value;
  const externeId = 'I' + Date.now();
  const name = (vorname + ' ' + nachname).trim();
  const land = v('pa-geburtsland');
  const geb  = vd('pa-geburtsdatum');
  const stammbaum_daten = {
    id: externeId, given: vorname, surname: nachname, name, sex,
    titel: v('pa-titel'), namenszusatz: v('pa-namenszusatz'), ehename: v('pa-ehename'),
    birth_date: geb, birth_place: v('pa-geburtsort'),
    geburtsland: land, stadt: v('pa-stadt'), gemeinde: v('pa-gemeinde'),
    getauft: vd('pa-getauft'),
    hochzeitsort: v('pa-hochzeitsort'),
    hochzeit_standesamt: vd('pa-hochzeit-standesamt'),
    hochzeit_kirchlich: vd('pa-hochzeit-kirchlich'),
    beziehung: ehe, beziehung_sonstige: v('pa-beziehung-sonstige'),
    email: v('pa-email'), telefon: v('pa-telefon'), facebook: v('pa-facebook'), instagram: v('pa-instagram'),
    wohnort_land: v('pa-wohnland'), wohnort_stadt: v('pa-wohnstadt'), adresse: v('pa-adresse'),
    beruf: v('pa-beruf'), ausbildung: v('pa-ausbildung'), beschreibung: v('pa-beschreibung'),
    deceased: verstorben, death_date: verstorben ? vd('pa-sterbedatum') : '',
    angelegt_aus: 'stammbaum-anlegen'
  };

  // Eltern (bei "Kind") aus den Vater/Mutter-Feldern. Mindestens ein Elternteil nötig;
  // anschließend wird das Kind über kind_baeume_sync in alle Bäume beider Eltern gespiegelt.
  let elternUuids = [];
  if (typ === 'kind') {
    if (paVater) elternUuids.push(paVater.uuid);
    if (paMutter && (!paVater || paMutter.uuid !== paVater.uuid)) elternUuids.push(paMutter.uuid);
    if (!elternUuids.length) {
      button.disabled = false; button.textContent = altText;
      fehlerEl.textContent = t('pa_eltern_pflicht'); fehlerEl.style.display = 'block'; return;
    }
  }

  // Tatsächliches Anlegen — ATOMAR (Person + alle Beziehungen in EINER Transaktion via
  // RPC person_anlegen_atomar, supabase_person_anlegen_atomar.sql). Schlägt eine Kante fehl,
  // wird die Person automatisch zurückgerollt -> es kann keine kanten-lose „lose Insel" mehr
  // entstehen (Audit Vorschlag 2). Wird ausgeführt, wenn keine Dublette ODER „Trotzdem anlegen".
  async function doInsert() {
    button.disabled = true; button.textContent = t('reg_senden_laeuft');
    const op = {
      familie_id:   kontext.familie_id,
      stammbaum_id: kontext.stammbaum_id,
      externe_id:   externeId,
      daten:        stammbaum_daten,
      edges:        []
    };
    if (typ === 'elternteil') {
      // neu = Elternteil (person_a), aktiv = Kind (person_b)
      op.edges.push({ other: aktiv._uuid, typ: 'elternteil', new_ist_a: true });
    } else if (typ === 'partner') {
      // aktiv = person_a, neu = person_b (ehepartner ist symmetrisch)
      op.edges.push({ other: aktiv._uuid, typ: 'ehepartner', new_ist_a: false });
    } else if (typ === 'geschwister') {
      // gleiche Eltern wie die aktive Person; hat sie keine, legt die RPC einen
      // Platzhalter-Elternteil an und hängt BEIDE Geschwister daran (im selben Transaktions-
      // schritt, daher kein loser Platzhalter mehr möglich).
      const geschwisterEltern = [];
      (aktiv.families_child || []).forEach(famId => {
        const fam = aktuelleDaten.families[famId]; if (!fam) return;
        [fam.husband, fam.wife].forEach(pe => {
          const par = pe && aktuelleDaten.persons[pe];
          if (par && par._uuid && !geschwisterEltern.includes(par._uuid)) geschwisterEltern.push(par._uuid);
        });
      });
      if (geschwisterEltern.length) {
        geschwisterEltern.forEach(pu => op.edges.push({ other: pu, typ: 'elternteil', new_ist_a: false }));
      } else {
        const phLabel = t('pa_platzhalter_name');
        const phExt   = 'I' + Date.now() + 'P' + Math.floor(Math.random() * 1000);
        op.platzhalter = {
          externe_id: phExt,
          daten: { id: phExt, given: phLabel, surname: '', name: phLabel, sex: '',
                   platzhalter: true, angelegt_aus: 'geschwister-platzhalter' },
          kinder: [aktiv._uuid]
        };
      }
    } else { // kind: an die gewählten Eltern (Vater/Mutter) hängen
      elternUuids.forEach(pu => op.edges.push({ other: pu, typ: 'elternteil', new_ist_a: false }));
    }

    const { data: res, error: aErr } = await sbClient.rpc('person_anlegen_atomar', { p_op: op });
    button.disabled = false; button.textContent = altText;
    if (aErr || !res || !res.ok) {
      fehlerEl.textContent = t('reg_fehler') + (aErr ? aErr.message : '—'); fehlerEl.style.display = 'block'; return;
    }
    const neuId = res.person_id;
    // Kind in ALLE Bäume beider Eltern spiegeln (Sichtbarkeit). Löschen ist identitätsbewusst
    // (loeschePerson entfernt alle Zwillinge) -> kein „zweimal löschen".
    if (typ === 'kind') {
      try { await sbClient.rpc('kind_baeume_sync', { p_kind: neuId }); }
      catch (e) { console.warn('kind_baeume_sync:', e); }
    }
    erfolgEl.textContent = t('pa_erfolg'); erfolgEl.style.display = 'block';
    // Fokus auf die NEU angelegte Person (nicht auf die Kontext-Person) — sonst liegt
    // sie ggf. außerhalb des 2-auf-2-Fensters (z. B. Kind mit anderen gewählten Eltern)
    // und ist erst nach einem Reload sichtbar.
    await reloadBaumBehalteFokus(externeId);
    // Abweichender Nachname (alle Beziehungstypen, nicht nur Heirat) -> Overlay mit
    // 3 Optionen (neuer Baum / verknüpfen / ohne). Übernimmt das frühere Heirats-Angebot.
    if (pruefeAbweichenderNachname(externeId, nachname, typ)) schliessePersonAdd();
    else setTimeout(() => schliessePersonAdd(), 800);
  }

  // DUBLETTEN-FRÜHERKENNUNG: existiert dieselbe Person (Vor/Nach/Geburtsdatum/Geburtsland) bereits?
  const { data: matches } = await sbClient.rpc('dubletten_check_global', {
    p_vorname: vorname, p_nachname: nachname, p_birth_date: geb, p_land: land, p_exclude_person: null
  });
  button.disabled = false; button.textContent = altText;
  if (matches && matches.length) {
    zeigeDublettenDialog(matches, {
      modus: 'beziehung',
      kontext: (typ === 'kind') ? (elternUuids[0] || aktiv._uuid) : aktiv._uuid,
      typ,
      zweiter: (typ === 'kind') ? (elternUuids[1] || null) : null,
      proceed: doInsert,
      onLinked: async () => { await reloadBaumBehalteFokus(aktivId); schliessePersonAdd(); }
    });
    return;
  }
  await doInsert();
}

// Ruft die RPC baum_integritaet_pruefen(aktueller Baum) und zeigt: unsichtbare INSELN
// (Zeile existiert, vom Render-Wurzelpunkt nicht erreichbar → im Diagramm nicht gezeichnet),

// Klickbare Personen-Chips (Klick öffnet die Detailkarte zur Identifikation).
function integPersonChips(liste) {
  if (!liste || !liste.length) return '';
  return '<div class="integ-chips">' + liste.map(p => {
    const name  = nm(p.name || p.externe_id || '?');
    const badge = p.platzhalter ? ` <span class="integ-badge">${escapeHtml(t('integ_platzhalter'))}</span>` : '';
    const ext   = escapeHtml(p.externe_id || '');
    return `<button type="button" class="integ-chip" onclick="integOeffnePerson('${ext}')">${escapeHtml(name)}${badge}</button>`;
  }).join('') + '</div>';
}

function renderIntegritaet(r) {
  const out = document.getElementById('integ-ergebnis');
  if (!out) return;
  const inselN  = r.inseln_personen || 0;
  const loseN   = (r.lose_personen || []).length;
  const waisenN = (r.verwaiste_kanten || []).length;
  const ohneN   = (r.ohne_stammbaum || []).length;
  let html = `<div class="integ-summary">${escapeHtml(t('integ_summary', {
    total: r.personen_gesamt || 0, main: r.hauptkomponente_groesse || 0, komp: r.komponenten || 0 }))}</div>`;

  if (!inselN && !loseN && !waisenN && !ohneN) {
    out.innerHTML = html + `<div class="integ-hinweis ok">${escapeHtml(t('integ_ok'))}</div>`;
    return;
  }
  if (r.inseln && r.inseln.length) {
    html += `<div class="integ-block"><div class="integ-h">${escapeHtml(t('integ_inseln', { n: inselN }))}</div>`;
    html += `<div class="integ-sub">${escapeHtml(t('integ_inseln_hint'))}</div>`;
    r.inseln.forEach(ins => { html += integPersonChips(ins.personen); });
    html += `</div>`;
  }
  if (loseN) {
    html += `<div class="integ-block"><div class="integ-h">${escapeHtml(t('integ_lose', { n: loseN }))}</div>`;
    html += `<div class="integ-sub">${escapeHtml(t('integ_lose_hint'))}</div>`;
    html += integPersonChips(r.lose_personen) + `</div>`;
  }
  if (ohneN) {
    html += `<div class="integ-block"><div class="integ-h warn">${escapeHtml(t('integ_ohnebaum', { n: ohneN }))}</div>`;
    html += integPersonChips(r.ohne_stammbaum) + `</div>`;
  }
  if (waisenN) {
    html += `<div class="integ-block"><div class="integ-h warn">${escapeHtml(t('integ_waisen', { n: waisenN }))}</div></div>`;
  }
  out.innerHTML = html;
}

function integOeffnePerson(ext) {
  if (!ext) return;
  schliesseIntegritaet();
  if (aktuelleDaten.persons[ext] && typeof zeigeDetails === 'function') zeigeDetails(ext);

// Nachname diakritik-/groß-klein-unempfindlich normalisieren (Frontend-Vorprüfung;
// die RPC-seitige Prüfung nutzt merge_norm und ist die verbindliche Instanz).
function zweigNachnameNorm(s) {
  // Schrift- UND diakritik-unempfindlich (analog ssFold/Backend-merge_norm): erst
  // Kyrillisch -> Latein (srCyr2Lat), dann klein + Diakritika falten. Sonst gilt der
  // GLEICHE Name in unterschiedlicher Schrift (z. B. Baum „Видовиц" vs. Eingabe
  // „Vidović"/„Vidovic") fälschlich als abweichend -> das Overlay erschien irrtümlich
  // und konnte (Option 1) eine lose Person in einem neuen Baum erzeugen.
  // ZUSÄTZLICH: ein Zusatz im BAUM-Namen zur Unterscheidung zweier gleichnamiger Bäume ist
  // KEIN Teil des Nachnamens. Zwei Muster kommen vor:
  //   • Klammer-Zusatz: „Pisarević (Desa)", „Stojanović (Nebojša)"  -> Klammer entfernen
  //   • Vorangestellter Zusatz mit Leerzeichen: „Stephen - Vidović", „Porodica Pisarević"
  // Der eigentliche Nachname ist in beiden Fällen das LETZTE buchstabenhaltige Wort. Sonst
  // matcht der Blutlinien-Vergleich (istBlutName/zielBaumFuer) den reinen Nachnamen/Mädchennamen
  // „Pisarević"/„Vidović" nicht gegen den Baumnamen und kappt die ganze Blutlinie dieses Baums
  // fälschlich als „auswärts" (eine geborene Vidović/Pisarević bekäme ein „→{Baum}"-Badge).
  // Echte zusammengesetzte Nachnamen mit Bindestrich OHNE Leerzeichen (z. B. „Mujkić-Vidović")
  // bleiben unangetastet, da nur an LEERZEICHEN getrennt wird.
  const v = srCyr2Lat((s || '').toString())
    .replace(/\([^)]*\)/g, ' ')   // geschlossene Klammer-Zusätze überall entfernen
    .replace(/\(.*$/, ' ')        // unvollständige Klammer (fehlendes ")") -> Rest bis Zeilenende
    .toLowerCase()
    .replace(/[čć]/g, 'c').replace(/š/g, 's').replace(/ž/g, 'z').replace(/đ/g, 'd');
  const toks = v.split(/\s+/).filter(w => /[a-z0-9]/.test(w));
  return toks.length ? toks[toks.length - 1] : '';
}

// Anzeige-Label eines Stammbaums: „Name (Zusatz)" — der Name ist nur der Nachname,
// der optionale Zusatz (eigenes Feld, z. B. „Desa") unterscheidet gleichnamige Familien
// und erscheint NUR in der Anzeige/Suche, nie im Blutlinien-Vergleich. nm() transliteriert
// bei SR nach Kyrillisch (Name + Zusatz).
function baumLabelNZ(name, zusatz) {
  const n = nm((name || '').toString().trim());
  const z = (zusatz || '').toString().trim();
  return z ? `${n} (${nm(z)})` : n;
}
function baumLabel(treeId) {
  return baumLabelNZ(stammbaeumeListe[treeId] || '?', stammbaeumeZusatz[treeId] || '');
}
// Baum-Label für ein Such-Trefferobjekt (personen_suche/karten_suche_admin liefern baum_id +
// baum): bevorzugt das lokale „Name (Zusatz)" über baum_id, sonst den RPC-Namen. So erscheint
// der Unterscheidungs-Zusatz auch in den Suchergebnissen gleichnamiger Bäume.
function trefferBaumLabel(r) {
  if (r && r.baum_id && stammbaeumeListe[r.baum_id]) return baumLabel(r.baum_id);
  return (r && r.baum) ? nm(r.baum) : '';
}

// Stammbaum-/Familienname darf NUR Buchstaben (inkl. Diakritika/Kyrillisch), Leerzeichen,
// Bindestrich und Apostroph enthalten — keine Ziffern, Klammern, Sonderzeichen. Zusatzinfos
// zur Unterscheidung gehören ins eigene „Zusatz"-Feld, nicht in den Namen.
const BAUMNAME_ERLAUBT = /[^\p{L} '’\-]/gu;          // global -> nur für replace/match (NICHT test)
function istGueltigerBaumName(s) {
  const v = (s || '').toString().trim();
  return v.length > 0 && !/[^\p{L} '’\-]/u.test(v) && /\p{L}/u.test(v);
}
// Live-Filter für Namensfelder: unerlaubte Zeichen direkt entfernen (Cursor-Position halten).
function filterBaumNameInput(el) {
  if (!el) return;
  const pos = el.selectionStart || 0;
  const entfernteDavor = (el.value.slice(0, pos).match(BAUMNAME_ERLAUBT) || []).length;
  el.value = el.value.replace(BAUMNAME_ERLAUBT, '');
  const np = Math.max(0, pos - entfernteDavor);
  try { el.setSelectionRange(np, np); } catch (e) {}
}

// Heirat mit NEUEM Nachnamen erkennen und – nach Bestätigung – einen eigenen
// Stammbaum für diese Linie anlegen (gleiche Familie/gleicher Verbund; Personen
// werden als gleiche Person gespiegelt). Der aktuell geöffnete Baum wird NICHT
// gewechselt (CLAUDE.md), die Baumliste/Dropdown aber aktualisiert.
async function pruefeHeiratsZweig(partnerUuid, ehePerson, partnerNachname) {
  if (!istAdmin()) return;
  const neuName = (partnerNachname || '').trim();
  if (!neuName) return;
  // Gleicher Nachname wie der/die Ehepartner:in -> kein neuer Zweig nötig
  if (zweigNachnameNorm(neuName) === zweigNachnameNorm(ehePerson && ehePerson.surname)) return;
  // Existiert im Verbund (geladene Baumliste) bereits ein Baum dieses Nachnamens? -> nicht anbieten
  const vorhanden = Object.values(stammbaeumeListe || {})
    .some(n => zweigNachnameNorm(n) === zweigNachnameNorm(neuName));
  if (vorhanden) return;

  const ok = await zeigeBestaetigung(t('zweig_frage', { name: nm(neuName) }));
  if (!ok) return;

  const { data, error } = await sbClient.rpc('stammbaum_zweig_aus_heirat', {
    p_wurzel:  partnerUuid,
    p_partner: ehePerson._uuid,
    p_name:    neuName
  });
  if (error) {
    // Verbund hatte den Baum schon (Race) oder anderer Fehler -> klare Meldung
    const msg = error.message && error.message.includes('zweig_existiert')
      ? t('zweig_existiert') : (t('reg_fehler') + (error.message || '—'));
    await zeigeHinweis(msg);
    return;
  }
  // Baumliste/Dropdown frisch ziehen; ladeBaumDaten behält den aktuellen Baum.
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  await zeigeHinweis(t('zweig_erstellt', { name: nm(neuName) }));
}

// ============================================================
// ABWEICHENDER NACHNAME -> Overlay mit 3 Optionen (neuer Baum / verknüpfen / ohne)
// Trigger: nach dem Anlegen ODER nach Bearbeiten (Nachname geändert) einer Person,
// deren Nachname vom Baum abweicht UND die noch keine baumübergreifende Verknüpfung
// (identitaet_id) hat. Import/automatische Anlagen lösen das Overlay NICHT aus.
// ============================================================
let abwKontext = null;

// Gate + Overlay öffnen. Gibt true zurück, wenn das Overlay gezeigt wird (Aufrufer
// schließt dann sein Add-/Edit-Overlay), sonst false.
function pruefeAbweichenderNachname(extId, nachname, defaultTyp) {
  if (!istAdmin()) return false;
  const p = aktuelleDaten.persons[extId];
  if (!p || !p._uuid) return false;
  const nn = (nachname || '').trim();
  if (!nn) return false;
  // Name des Baums, in dem die Person liegt
  const treeName = (p._tree && stammbaeumeListe[p._tree]) ? stammbaeumeListe[p._tree] : '';
  // Nachname == Baumname -> passt, kein Overlay
  if (zweigNachnameNorm(nn) === zweigNachnameNorm(treeName)) return false;
  // Bereits baumübergreifend verknüpft (identitaet_id) = bestehende Zuordnung -> kein Overlay
  if (p._ident) return false;
  // Existiert im Verbund schon ein Baum dieses Nachnamens? -> Option 1 (neuer Baum) ausblenden
  const sameName = Object.values(stammbaeumeListe || {})
    .some(n => zweigNachnameNorm(n) === zweigNachnameNorm(nn));
  abwKontext = { extId, uuid: p._uuid, nachname: nn,
    defaultTyp: BEZTYP_GUELTIG.includes(defaultTyp) ? defaultTyp : 'partner', sameName };
  oeffneAbwNachname();
  return true;
}

function oeffneAbwNachname() {
  if (!abwKontext) return;
  document.getElementById('abw-titel').textContent = t('abw_titel', { name: nm(abwKontext.nachname) });
  // Option 1 IMMER anbieten (Nutzerwunsch). Existiert im Verbund schon ein Baum dieses
  // Nachnamens, nur ein Info-Hinweis darunter — die RPC verhindert Duplikate und meldet das sauber.
  document.getElementById('abw-btn-neu').style.display = '';
  document.getElementById('abw-baum-existiert').style.display = abwKontext.sameName ? '' : 'none';
  document.getElementById('abw-verk-box').style.display = 'none';
  abwBefuelleBez();
  document.getElementById('abw-nachname-modal').classList.add('aktiv');
}

// Option 1: eigenen Stammbaum (+ Familie) für diese Linie anlegen (generische RPC,
// alle Beziehungstypen). Aktuell geöffneter Baum bleibt (CLAUDE.md), Dropdown wird aktualisiert.

  // und auf Bestätigung trotzdem anlegen (p_force=true überspringt die Existenzprüfung der RPC).

      { jaText: t('abw_trotzdem_anlegen'), neinText: t('abbrechen') });

// Person + zugehörige Beziehungen löschen (mit Bestätigung). Keine verwaisten Beziehungen.
async function loeschePerson(personId) {
  if (!istAdmin()) return;
  const p = aktuelleDaten.persons[personId];
  if (!p || !p._uuid) return;

  // IDENTITÄTSBEWUSST: Alle Karten DERSELBEN realen Person (identitaet_id-Zwillinge über
  // alle Bäume) werden GEMEINSAM gelöscht. So verschwindet die Person nach EINEM Löschen
  // NIRGENDWO mehr (Backend + alle Bäume + GUI) — kein „zweimal löschen" bei Spiegelkarten.
  const alleUuids = p._ident
    ? [...new Set(Object.values(aktuelleDaten.persons)
        .filter(x => x._ident === p._ident && x._uuid).map(x => x._uuid))]
    : [p._uuid];
  const delSet = new Set(alleUuids);

  // Welche Bäume würden durch das Löschen LEER? (Owner-Gate + kontoschonende Auto-Bereinigung)
  const betroffeneBaeume = [...new Set(Object.values(aktuelleDaten.persons)
    .filter(x => delSet.has(x._uuid) && x._tree).map(x => x._tree))];
  const leereBaeume = betroffeneBaeume.filter(tid =>
    Object.values(aktuelleDaten.persons).filter(x => x._tree === tid && !delSet.has(x._uuid)).length === 0);
  const leertBaum = leereBaeume.length > 0;

  if (leertBaum) {
    // Owner-Exklusivrecht: nur familien_owner / super_admin dürfen einen Baum (durch Löschen
    // seiner letzten Person) leeren. Server prüft zusätzlich (RPC).
    const darf = istSuperAdmin() || normalizeRolle(aktuelleRolle || '') === 'familien_owner';
    if (!darf) { await zeigeHinweis(t('auto_leer_nur_owner')); return; }
    const ok = await zeigeBestaetigung(t('auto_leer_warnung'),
      { jaText: t('auto_leer_ja'), neinText: t('abbrechen'), gefahr: true });
    if (!ok) return;
  } else {
    const ok = await zeigeBestaetigung(t('pa_loeschen_frage') + '\n\n' + nm(p.name || p.given || '?'));
    if (!ok) return;
  }

  // Fokus-Fallback bestimmen, bevor die Person verschwindet (nur relevant, wenn kein Baum geleert wird)
  let fallback = null;
  if (!leertBaum) {
    (p.families_spouse || []).forEach(fid => {
      const fam = aktuelleDaten.families[fid]; if (!fam) return;
      const partner = fam.husband === personId ? fam.wife : fam.husband;
      if (partner && aktuelleDaten.persons[partner]) fallback = fallback || partner;
      (fam.children || []).forEach(c => { if (aktuelleDaten.persons[c]) fallback = fallback || c; });
    });
    (p.families_child || []).forEach(fid => {
      const fam = aktuelleDaten.families[fid]; if (!fam) return;
      if (fam.husband && aktuelleDaten.persons[fam.husband]) fallback = fallback || fam.husband;
      if (fam.wife && aktuelleDaten.persons[fam.wife]) fallback = fallback || fam.wife;
    });
  }

  // 0) Galerie-Fotos im Storage abräumen (DB-Zeilen hängen per ON DELETE CASCADE an
  //    den Personen; Storage-Dateien NICHT -> hier entfernen, keine Waisen). Vor dem
  //    Personen-Delete, solange die personen_fotos-Zeilen noch existieren.
  await galerieLoescheFuerPersonen(alleUuids);
  await dokLoescheFuerPersonen(alleUuids);   // Dokument-Storage-Dateien (DB-Zeilen per CASCADE)

  // 1) Alle Beziehungen ALLER betroffenen Karten entfernen (keine verwaisten Kanten)
  let relErr = (await sbClient.from('beziehungen').delete().in('person_a', alleUuids)).error;
  if (!relErr) relErr = (await sbClient.from('beziehungen').delete().in('person_b', alleUuids)).error;
  if (relErr) { await zeigeHinweis(t('reg_fehler') + relErr.message); return; }

  // 2) Die Personen-Karten selbst löschen (alle Zwillinge auf einmal)
  const { error: pErr } = await sbClient.from('personen').delete().in('id', alleUuids);
  if (pErr) { await zeigeHinweis(t('reg_fehler') + pErr.message); return; }

  schliesseModal();

  if (leertBaum) {
    // 3) Leer gewordene Bäume kontoschonend auto-löschen (Sweep räumt ALLE leeren Bäume).
    let dErr = null;
    try { dErr = (await sbClient.rpc('auto_leere_baeume_aufraeumen')).error; }
    catch (e) { dErr = e; }
    if (dErr) {
      // z. B. 'wartung_aktiv' -> Personen sind weg, Baum bleibt (vorübergehend) leer.
      const msg = /wartung_aktiv/i.test(dErr.message || '') ? t('auto_leer_wartung') : (t('reg_fehler') + (dErr.message || ''));
      await reloadBaumBehalteFokus(null);
      await zeigeHinweis(msg);
      return;
    }
    // 4) Storage-Medien gelöschter Events abräumen (DB kann das nicht)
    await raeumeVerwaisteMedien();
    // 5) Navigation nur, wenn der AKTUELL geöffnete Baum geleert wurde
    if (leereBaeume.includes(aktuellerStammbaumId)) await navigiereNachBaumLoeschung(aktuellerStammbaumId);
    else await reloadBaumBehalteFokus(fallback);
    await zeigeHinweis(t('auto_leer_erfolg'));
  } else {
    await reloadBaumBehalteFokus(fallback);
    await zeigeHinweis(t('pa_geloescht'));
  }
}

// ============================================================
// BEZIEHUNG ÄNDERN / UMHÄNGEN (Admin) — Karte von einer Rolle in eine andere verschieben,
// ohne sie zu löschen. Serverseitig atomar + validiert (RPC beziehung_verschieben,
// supabase_beziehung_verschieben.sql); hier zusätzlich Client-Validierung fürs UI.
// ============================================================
let bezAendernCtx = null;   // { pId, vId, aktTyp, ziel }

// --- Relations-Helfer (über aktuelleDaten, identitätsbewusst) ---
function _bezTwinExt(ext) {
  const p = aktuelleDaten.persons[ext];
  if (!p || !p._ident) return [ext];
  return Object.values(aktuelleDaten.persons).filter(q => q._ident === p._ident).map(q => q.id);
}
function _sameIdent(aExt, bExt) {
  const a = aktuelleDaten.persons[aExt], b = aktuelleDaten.persons[bExt];
  if (!a || !b) return false;
  if (a._ident && b._ident) return a._ident === b._ident;
  return aExt === bExt;
}
function _bezElternExt(ext) {   // ext-IDs der Eltern (über alle Zwillinge der Person)
  const out = new Set();
  _bezTwinExt(ext).forEach(t => {
    const p = aktuelleDaten.persons[t];
    (p && p.families_child || []).forEach(fid => {
      const f = aktuelleDaten.families[fid]; if (!f) return;
      [f.husband, f.wife].forEach(e => { if (e) out.add(e); });
    });
  });
  return [...out];
}
function _bezVorfahre(aExt, bExt) {   // ist a Vorfahre von b?
  const ziel = new Set(_bezTwinExt(aExt));
  const seen = new Set(); const stack = [..._bezElternExt(bExt)];
  while (stack.length) {
    const cur = stack.pop(); if (seen.has(cur)) continue; seen.add(cur);
    if (ziel.has(cur)) return true;
    _bezElternExt(cur).forEach(e => { if (!seen.has(e)) stack.push(e); });
  }
  return false;
}
function _bezSibling(pExt, xExt) {    // teilen P und X einen Elternteil?
  const ep = new Set(); _bezElternExt(pExt).forEach(e => _bezTwinExt(e).forEach(x => ep.add(x)));
  if (!ep.size) return false;
  const ex = new Set(); _bezElternExt(xExt).forEach(e => _bezTwinExt(e).forEach(x => ex.add(x)));
  return [...ex].some(x => ep.has(x));
}
function _bezElternListe(pExt) {       // [{ext,uuid,name}] der Eltern (Zwilling-entdoppelt)
  const seen = new Set(); const out = [];
  _bezElternExt(pExt).forEach(e => {
    const p = aktuelleDaten.persons[e]; if (!p) return;
    const key = p._ident ? 'i:' + p._ident : 'u:' + (p._uuid || e);
    if (seen.has(key)) return; seen.add(key);
    if (p._uuid) out.push({ ext: e, uuid: p._uuid, name: p.name || p.given || '?' });
  });
  return out;
}

function schliesseBezAendern() {
  document.getElementById('bez-aendern-modal').classList.remove('aktiv');
  bezAendernCtx = null;
}

// Öffnet den „Beziehung ändern"-Dialog für die verwandte Person vId (aktuelle Rolle aktTyp).
function bezAendernOeffnen(aktTyp, vId) {
  if (!istAdmin()) return;
  const pId = aktuelleModalPersonId;
  const P = aktuelleDaten.persons[pId], X = aktuelleDaten.persons[vId];
  if (!P || !X) return;
  if (_sameIdent(pId, vId)) return;   // dieselbe Person -> kein Ändern
  bezAendernCtx = { pId, vId, aktTyp, ziel: null };
  document.getElementById('bez-aendern-info').textContent = t('bezv_info', { name: nm(X.name || X.given || '?') });
  const fehler = document.getElementById('bez-aendern-fehler'); fehler.style.display = 'none'; fehler.textContent = '';
  document.getElementById('bez-aendern-ersetzen').style.display = 'none';

  const sibling    = _bezSibling(pId, vId);
  const xVorfahre  = _bezVorfahre(vId, pId);   // X Vorfahre von P
  const xNachfahre = _bezVorfahre(pId, vId);   // X Nachfahre von P
  const rollen = [
    { typ: 'eltern',      ok: !sibling && !xNachfahre,            grund: sibling ? 'geschwister' : (xNachfahre ? 'zyklus' : '') },
    { typ: 'geschwister', ok: !xVorfahre && !xNachfahre,          grund: (xVorfahre || xNachfahre) ? 'zyklus' : '' },
    { typ: 'partner',     ok: !sibling && !xVorfahre && !xNachfahre, grund: sibling ? 'geschwister' : ((xVorfahre || xNachfahre) ? 'partner_inzest' : '') },
    { typ: 'kind',        ok: !xVorfahre,                          grund: xVorfahre ? 'zyklus' : '' }
  ];
  document.getElementById('bez-aendern-rollen').innerHTML = rollen.map(r => {
    const aktuell = r.typ === aktTyp;
    const disabled = aktuell || !r.ok;
    const grundTxt = aktuell ? t('bezv_grund_aktuell') : (!r.ok ? t('bezv_grund_' + r.grund) : '');
    return `<label class="ansicht-radio${disabled ? ' bez-deaktiviert' : ''}" ${disabled ? '' : `onclick="bezAendernWaehle('${r.typ}')"`}>
      <input type="radio" name="bez-ziel" value="${r.typ}" ${disabled ? 'disabled' : ''}>
      <span><b>${escapeHtml(t('bezv_rolle_' + r.typ))}</b>${grundTxt ? `<small>${escapeHtml(grundTxt)}</small>` : ''}</span>
    </label>`;
  }).join('');
  document.getElementById('bez-aendern-modal').classList.add('aktiv');
}

function bezAendernWaehle(typ) {
  if (!bezAendernCtx) return;
  bezAendernCtx.ziel = typ;
  document.querySelectorAll('#bez-aendern-rollen input[name="bez-ziel"]').forEach(r => { r.checked = (r.value === typ); });
  document.querySelectorAll('#bez-aendern-rollen .ansicht-radio').forEach(l => {
    const inp = l.querySelector('input'); l.classList.toggle('aktiv', !!(inp && inp.value === typ));
  });
  // Ersetzen-Schritt nur bei Ziel „Eltern", wenn P bereits 2 Eltern hat (≠ X)
  const wrap = document.getElementById('bez-aendern-ersetzen');
  if (typ === 'eltern') {
    const eltern = _bezElternListe(bezAendernCtx.pId).filter(e => !_sameIdent(e.ext, bezAendernCtx.vId));
    if (eltern.length >= 2) {
      document.getElementById('bez-ersetzt-elternteil').innerHTML =
        eltern.map(e => `<option value="${escapeHtml(e.uuid)}">${escapeHtml(nm(e.name))}</option>`).join('');
      wrap.style.display = '';
      if (typeof macheAlleSelectsSuchbar === 'function') macheAlleSelectsSuchbar(document.getElementById('bez-aendern-modal'));
      return;
    }
  }
  wrap.style.display = 'none';
}

function _bezFehler(msg) {
  const e = document.getElementById('bez-aendern-fehler'); e.textContent = msg; e.style.display = 'block';
}

async function bezAendernAnwenden() {
  if (!bezAendernCtx || !bezAendernCtx.ziel) return _bezFehler(t('bezv_kein_ziel'));
  const P = aktuelleDaten.persons[bezAendernCtx.pId], X = aktuelleDaten.persons[bezAendernCtx.vId];
  if (!P || !X || !P._uuid || !X._uuid) return;
  let ersetzt = null;
  if (bezAendernCtx.ziel === 'eltern' && document.getElementById('bez-aendern-ersetzen').style.display !== 'none') {
    ersetzt = document.getElementById('bez-ersetzt-elternteil').value || null;
  }
  const btn = document.getElementById('bez-aendern-btn'); const alt = btn.textContent;
  btn.disabled = true; btn.textContent = t('reg_senden_laeuft');
  const { data, error } = await sbClient.rpc('beziehung_verschieben', {
    p_person: P._uuid, p_other: X._uuid, p_neu_typ: bezAendernCtx.ziel, p_ersetzt_elternteil: ersetzt
  });
  btn.disabled = false; btn.textContent = alt;
  if (error) return _bezFehler(t('reg_fehler') + error.message);
  if (!data || !data.ok) {
    const known = ['bezv_self','bezv_zyklus','bezv_geschwister_konflikt','bezv_partner_inzest','bezv_zu_viele_eltern','bezv_kein_recht'];
    return _bezFehler(known.includes(data && data.fehler) ? t(data.fehler) : t('bezv_fehler'));
  }
  if (data.sync_kind) {
    try { await sbClient.rpc('kind_baeume_sync', { p_kind: data.sync_kind }); } catch (e) { console.warn('kind_baeume_sync', e); }
  }
  const pId = bezAendernCtx.pId;
  schliesseBezAendern();
  await reloadBaumBehalteFokus(pId);
  if (aktuelleDaten.persons[pId]) { aktuelleModalPersonId = null; zeigeDetails(pId); }
  await zeigeHinweis(t('bezv_erfolg'));
}

// EINE Verknüpfung (Kante) zwischen der offenen Person und einer verwandten Person lösen.
// Beide Personen BLEIBEN erhalten — nur die Beziehung in `beziehungen` wird entfernt
// (wie loeschePerson per Direct-Delete; RLS lässt das für editierbare Familien zu).
// IDENTITÄTSBEWUSST: berücksichtigt auf BEIDEN Seiten alle identitaet_id-Zwillinge,
// da die Detailkarte Beziehungen über alle Spiegelkarten zusammengeführt anzeigt.
//   typ: 'eltern' (v=Elternteil) | 'kind' (v=Kind) | 'partner' | 'geschwister'
async function beziehungLoesen(typ, vId) {
  if (!istAdmin()) return;
  const pId = aktuelleModalPersonId;
  const p = pId && aktuelleDaten.persons[pId];
  const v = aktuelleDaten.persons[vId];
  if (!p || !v) return;

  // Identitätsgruppe einer Person als Objekt-Liste / UUID-Liste / externe-ID-Set
  const twinObjs  = (obj) => obj._ident ? Object.values(aktuelleDaten.persons).filter(x => x._ident === obj._ident) : [obj];
  const twinUuids = (obj) => [...new Set(twinObjs(obj).map(x => x._uuid).filter(Boolean))];
  const twinExts  = (obj) => new Set(twinObjs(obj).map(x => x.id));
  const pUu = twinUuids(p);
  const vUu = twinUuids(v);
  if (!pUu.length || !vUu.length) return;

  // PARTNER mit GEMEINSAMEN KINDERN: eine „Partner"-Familie entsteht im Renderer auch
  // allein durch gemeinsame Elternschaft (nicht nur durch eine ehepartner-Kante). Damit der
  // Partner wirklich verschwindet, muss er zusätzlich von den gemeinsamen Kindern als
  // Elternteil getrennt werden. Diese Kinder vorab sammeln (für Warnung + Löschung).
  let sharedKidUuids = [], sharedKidNamen = [];
  if (typ === 'partner') {
    const vExt = twinExts(v); const seenKid = new Set();
    twinObjs(p).forEach(tw => (tw.families_spouse || []).forEach(fid => {
      const fam = aktuelleDaten.families[fid]; if (!fam) return;
      const partnerExt = fam.husband === tw.id ? fam.wife : fam.husband;
      if (partnerExt && vExt.has(partnerExt)) (fam.children || []).forEach(cid => {
        const c = aktuelleDaten.persons[cid];
        if (c && !seenKid.has(cid)) { seenKid.add(cid); twinUuids(c).forEach(u => sharedKidUuids.push(u)); sharedKidNamen.push(c.name || c.given || '?'); }
      });
    }));
    sharedKidUuids = [...new Set(sharedKidUuids)];
  }

  // Sicherheitsabfrage (Nutzerwunsch): beide Personen bleiben, nur Verbindung wird gelöst.
  let frage = t('rel_loesen_frage', { name: nm(v.name || v.given || '?') });
  if (sharedKidNamen.length) frage += '\n\n' + t('rel_partner_kinder_warnung',
    { name: nm(v.name || v.given || '?'), kinder: sharedKidNamen.map(n => nm(n)).join(', ') });
  const ok = await zeigeBestaetigung(frage,
    { jaText: t('rel_loesen_ja'), neinText: t('abbrechen'), gefahr: true });
  if (!ok) return;

  // Beziehungs-Kanten je Typ entfernen. .in(a).in(b) wirkt als UND-Verknüpfung.
  const del = (filter) => filter.then(r => r.error);
  let err = null;
  try {
    if (typ === 'partner') {
      // ehepartner ist symmetrisch -> beide Richtungen entfernen
      err = await del(sbClient.from('beziehungen').delete().eq('typ', 'ehepartner').in('person_a', pUu).in('person_b', vUu));
      if (!err) err = await del(sbClient.from('beziehungen').delete().eq('typ', 'ehepartner').in('person_a', vUu).in('person_b', pUu));
      // Partner von gemeinsamen Kindern trennen (sonst bleibt die Familie über die Elternschaft bestehen)
      if (!err && sharedKidUuids.length) err = await del(sbClient.from('beziehungen').delete().eq('typ', 'elternteil').in('person_a', vUu).in('person_b', sharedKidUuids));
    } else if (typ === 'eltern') {
      // v ist Elternteil -> Kante v(person_a) -> p(person_b)
      err = await del(sbClient.from('beziehungen').delete().eq('typ', 'elternteil').in('person_a', vUu).in('person_b', pUu));
    } else if (typ === 'kind') {
      // v ist Kind -> Kante p(person_a) -> v(person_b)
      err = await del(sbClient.from('beziehungen').delete().eq('typ', 'elternteil').in('person_a', pUu).in('person_b', vUu));
    } else if (typ === 'geschwister') {
      // Geschwister haben keine eigene Kante: sie sind über GEMEINSAME Eltern abgeleitet.
      // "Eltern bleiben" (Nutzerwunsch) -> wir lösen v von den Eltern DER offenen Person,
      // sodass beide nicht mehr Geschwister sind, p seine Eltern aber behält.
      const elternUuids = [];
      (p._ident ? Object.values(aktuelleDaten.persons).filter(x => x._ident === p._ident) : [p])
        .forEach(tw => (tw.families_child || []).forEach(fid => {
          const fam = aktuelleDaten.families[fid]; if (!fam) return;
          [fam.husband, fam.wife].forEach(par => {
            const e = par && aktuelleDaten.persons[par];
            if (e) twinUuids(e).forEach(u => elternUuids.push(u));
          });
        }));
      const eltUu = [...new Set(elternUuids)];
      if (!eltUu.length) { await zeigeHinweis(t('reg_fehler') + 'keine gemeinsamen Eltern'); return; }
      err = await del(sbClient.from('beziehungen').delete().eq('typ', 'elternteil').in('person_a', eltUu).in('person_b', vUu));
    }
  } catch (e) { err = e; }

  if (err) { await zeigeHinweis(t('reg_fehler') + (err.message || err)); return; }

  // Karte frisch laden, Fokus auf der offenen Person halten und Detail neu rendern.
  await reloadBaumBehalteFokus(pId);
  if (aktuelleDaten.persons[pId]) { aktuelleModalPersonId = null; zeigeDetails(pId); }
  else schliesseModal();
  await zeigeHinweis(t('rel_geloest'));
}

// Storage-Bucket `events` von Medien gelöschter Bäume befreien (Queue verwaiste_event_medien).
// Postgres kann den Storage nicht löschen -> DB merkt die Event-ids vor, hier wird abgeräumt.
async function raeumeVerwaisteMedien() {
  if (!aktuellerUser) return;
  let offen = [];
  try {
    const { data, error } = await sbClient.rpc('verwaiste_medien_offen');
    if (error) return;
    offen = data || [];
  } catch (e) { return; }
  for (const row of offen) {
    try { await loescheEventMedien(row.event_id); } catch (e) { /* Storage-Fehler ignorieren */ }
    try { await sbClient.rpc('verwaiste_medien_erledigt', { p_id: row.id }); } catch (e) {}
  }
}
