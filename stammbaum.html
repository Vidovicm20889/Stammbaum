// Schreibschutz umschalten (Mitglieder = nur Lesen)
function feSetReadonly(ro) {
  const modal = document.getElementById('familie-einst-modal');
  modal.querySelectorAll('input, textarea, select').forEach(el => {
    if (el.id === 'fe-stammbaum-id') return;
    el.disabled = ro;
  });
  document.getElementById('fe-readonly-hinweis').style.display = ro ? 'block' : 'none';
  document.getElementById('fe-submit').style.display = ro ? 'none' : '';
  ['foto','wappen'].forEach(a => {
    const del = document.getElementById('fe-' + a + '-del');
    if (del && ro) del.style.display = 'none';
  });
}

async function zeigeFamilieEinstellungen(stammbaumId) {
  if (!aktuellerUser) return;
  const fehlerEl = document.getElementById('fe-fehler');
  const erfolgEl = document.getElementById('fe-erfolg');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';
  feMedia = {}; feMediaOld = {};

  // Felder leeren + Länder-Dropdown füllen
  fuelleLandSelect('fe-land');
  document.getElementById('fe-land').value = '';
  ['fe-name','fe-opis','fe-stadt','fe-gemeinde', ...Object.values(FE_EINST_FELDER)]
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  ['foto','wappen'].forEach(a => {
    const img = document.getElementById('fe-' + a + '-preview'); if (img) { img.src = ''; img.style.display = 'none'; }
    const del = document.getElementById('fe-' + a + '-del'); if (del) del.style.display = 'none';
    const inp = document.getElementById('fe-' + a + '-input'); if (inp) inp.value = '';
  });
  document.getElementById('fe-stammbaum-id').value = stammbaumId || '';
  document.getElementById('fe-owner-block').style.display = 'none';   // erst nach Laden (Super-Admin) einblenden
  feSetReadonly(false);
  document.getElementById('familie-einst-modal').classList.add('aktiv');

  if (!stammbaumId) { fehlerEl.textContent = t('fe_keine_familie'); fehlerEl.style.display = 'block'; feSetReadonly(true); return; }

  const { data, error } = await sbClient.rpc('stammbaum_einstellungen_holen', { p_stammbaum_id: stammbaumId });
  if (error) {
    fehlerEl.textContent = feFehlerText(error.message);
    fehlerEl.style.display = 'block'; feSetReadonly(true); return;
  }
  const d = data || {};
  const e = d.einstellungen || {};
  document.getElementById('fe-name').value     = d.name     || '';
  document.getElementById('fe-opis').value     = d.opis     || '';
  document.getElementById('fe-land').value      = d.land     || '';
  document.getElementById('fe-stadt').value     = d.stadt    || '';
  document.getElementById('fe-gemeinde').value  = d.gemeinde || '';
  Object.entries(FE_EINST_FELDER).forEach(([key, id]) => {
    const el = document.getElementById(id); if (el) el.value = e[key] || '';
  });
  // Medien
  feMedia = { foto_url: e.foto_url || '', foto_path: e.foto_path || '',
              wappen_url: e.wappen_url || '', wappen_path: e.wappen_path || '' };
  feMediaOld = { foto_path: e.foto_path || '', wappen_path: e.wappen_path || '' };
  ['foto','wappen'].forEach(a => feMediaPreview(a));

  feSetReadonly(!d.can_edit);

// ============================================================
// DATENBEREINIGUNG (nur Super-Admin): verwaiste Personen einem Stammbaum
// zuordnen. Vorschlag (Diagnose) -> jeder Fall wird einzeln bestätigt.
// Backend: stammbaum_bereinigung_diagnose() + bereinigung_anwenden().
// ============================================================
let berDiagnose = null;

function zeigeBereinigungModal() {
  if (!istSuperAdmin()) return;
  const menu = document.getElementById('nav-menu'); if (menu) menu.classList.remove('offen');
  document.getElementById('bereinigung-modal').classList.add('aktiv');
  ladeBereinigung();
}
function schliesseBereinigungModal() {
  document.getElementById('bereinigung-modal').classList.remove('aktiv');
}

async function ladeBereinigung() {
  const box = document.getElementById('ber-inhalt'); if (!box) return;
  box.innerHTML = `<div class="event-media-empty">${escapeHtml(t('ber_laden'))}</div>`;
  const { data, error } = await sbClient.rpc('stammbaum_bereinigung_diagnose');
  if (error) {
    box.innerHTML = `<div class="login-fehler" style="display:block">${escapeHtml(t('reg_fehler') + error.message)}</div>`;
    return;
  }
  berDiagnose = data || {};
  renderBereinigung();
}

function renderBereinigung() {
  const box = document.getElementById('ber-inhalt'); if (!box) return;
  const d = berDiagnose || {};
  const z = d.zusammenfassung || {};
  const vorschlaege = Array.isArray(d.gruppen_vorschlag) ? d.gruppen_vorschlag : [];
  const leereFam = Array.isArray(d.familien_ohne_baum) ? d.familien_ohne_baum : [];
  const verwaist = (z.personen_baum_verwaist || 0) + (z.personen_familie_verwaist || 0) + (z.baeume_familie_verwaist || 0);

  // Zusammenfassung (Zähler)
  let html = `<div class="reg-gruppe-titel">${escapeHtml(t('ber_zus_titel'))}</div>
    <div class="obav-meta">
      <div><strong>${escapeHtml(t('ber_zus_personen_ohne_baum'))}:</strong> ${z.personen_ohne_baum || 0}</div>
      <div><strong>${escapeHtml(t('ber_zus_familien_ohne_baum'))}:</strong> ${z.familien_ohne_baum || 0}</div>
      <div><strong>${escapeHtml(t('ber_zus_verwaist'))}:</strong> ${verwaist}</div>
    </div>`;

  // Vorschläge (pro Gruppe ein „Anwenden")
  if (vorschlaege.length) {
    html += `<div class="reg-gruppe-titel" style="margin-top:16px">${escapeHtml(t('ber_vorschlaege_titel'))}</div>`;
    html += vorschlaege.map((g, i) => {
      const aktionLabel = g.vorschlag === 'zuordnen'
        ? t('ber_zuordnen', { baum: nm(g.ziel_baum_name || '') })
        : t('ber_neu_anlegen');
      return `<div class="obav-karte" id="ber-karte-${i}">
        <div class="obav-name">${escapeHtml(nm(g.beispiel_nachname || g.nachname_norm || '—'))}</div>
        <div class="obav-meta">
          <div><strong>${escapeHtml(t('ber_familie'))}:</strong> ${escapeHtml(nm(g.familie_name || '—'))}</div>
          <div><strong>${escapeHtml(t('ber_anzahl'))}:</strong> ${g.anzahl || 0}</div>
          <div><strong>${escapeHtml(t('ber_aktion'))}:</strong> ${escapeHtml(aktionLabel)}</div>
        </div>
        <div class="obav-aktionen">
          <button class="mv-toggle" type="button" onclick="berAnwenden(${i})">${escapeHtml(t('ber_anwenden'))}</button>
        </div>
      </div>`;
    }).join('');
  }

  // Leere Familien (nur Info — separates Thema, keine Auto-Aktion hier)
  if (leereFam.length) {
    html += `<div class="reg-gruppe-titel" style="margin-top:16px">${escapeHtml(t('ber_familien_ohne_baum_titel'))}</div>`;
    html += `<div class="obav-meta">` + leereFam.map(f => {
      const ort = [f.stadt, f.gemeinde, f.land].filter(Boolean).join(', ');
      return `<div>• ${escapeHtml(nm(f.name || '—'))}${ort ? ` <span style="opacity:.7">(${escapeHtml(ort)})</span>` : ''}</div>`;
    }).join('') + `</div>`;
  }

  // Nichts zu tun
  if (!vorschlaege.length && !leereFam.length) {
    html += `<div class="reg-erfolg" style="display:block;margin-top:14px">${escapeHtml(t('ber_keine'))}</div>`;
  }

  html += `<div class="fe-actions" style="margin-top:18px">
    <button class="login-submit fe-abbrechen" type="button" onclick="ladeBereinigung()">${escapeHtml(t('ber_aktualisieren'))}</button>
  </div>`;

  box.innerHTML = html;
}

async function berAnwenden(i) {
  const g = (berDiagnose && berDiagnose.gruppen_vorschlag || [])[i];
  if (!g) return;
  const ok = await zeigeBestaetigung(t('ber_anwenden_frage', {
    anzahl: g.anzahl || 0, nachname: nm(g.beispiel_nachname || '')
  }));
  if (!ok) return;
  const karte = document.getElementById('ber-karte-' + i);
  if (karte) { karte.style.opacity = '0.5'; karte.style.pointerEvents = 'none'; }
  const { data, error } = await sbClient.rpc('bereinigung_anwenden', {
    p_familie_id: g.familie_id, p_nachname: g.nachname_norm, p_ziel_baum_id: g.ziel_baum_id || null
  });
  if (error) {
    if (karte) { karte.style.opacity = ''; karte.style.pointerEvents = ''; }
    await zeigeHinweis(t('reg_fehler') + error.message); return;
  }
  await zeigeHinweis(t('ber_erfolg', { n: (data && data.zugeordnete_personen) || g.anzahl || 0 }));
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();   // Baum-Dropdown/Ansicht aktualisieren
  await ladeBereinigung();   // Diagnose neu laden (Vorschlag verschwindet)
}

// Vorschau + Entfernen-Button gemäß feMedia setzen
function feMediaPreview(art) {
  const url = feMedia[art + '_url'] || '';
  const img = document.getElementById('fe-' + art + '-preview');
  const del = document.getElementById('fe-' + art + '-del');
  if (img) { img.src = url; img.style.display = url ? '' : 'none'; }
  const ro = document.getElementById('fe-readonly-hinweis').style.display !== 'none';
  if (del) del.style.display = (url && !ro) ? '' : 'none';
}

async function feMediaUpload(art, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const sid = document.getElementById('fe-stammbaum-id').value;
  const fehlerEl = document.getElementById('fe-fehler'); fehlerEl.style.display = 'none';
  if (!sid) { fehlerEl.textContent = t('fe_keine_familie'); fehlerEl.style.display = 'block'; return; }
  try {
    const sauber = file.name.replace(/[^\w.\-]+/g, '_');
    const path = `${sid}/${art}_${Date.now()}_${sauber}`;
    const { data, error } = await sbClient.storage.from('familien').upload(path, file, { cacheControl: '3600', upsert: true });
    if (error) { fehlerEl.textContent = t('reg_fehler') + error.message; fehlerEl.style.display = 'block'; return; }
    let p = (data && (data.path || data.Key || data.name)) || path;
    if (p.startsWith('familien/')) p = p.slice('familien/'.length);
    const pub = sbClient.storage.from('familien').getPublicUrl(p);
    feMedia[art + '_url']  = (pub && pub.data && pub.data.publicUrl) || '';
    feMedia[art + '_path'] = p;
    feMediaPreview(art);
  } catch (e) {
    fehlerEl.textContent = t('reg_fehler') + (e.message || e); fehlerEl.style.display = 'block';
  }
}

function feMediaEntfernen(art) {
  // Datei wird erst beim Speichern endgültig aufgeräumt (siehe feMediaCleanup).
  feMedia[art + '_url'] = ''; feMedia[art + '_path'] = '';
  const inp = document.getElementById('fe-' + art + '-input'); if (inp) inp.value = '';
  feMediaPreview(art);
}

// Ersetzte/entfernte Storage-Dateien nach erfolgreichem Speichern abräumen (keine Waisen)
async function feMediaCleanup() {
  const weg = [];
  ['foto','wappen'].forEach(a => {
    const alt = feMediaOld[a + '_path'];
    if (alt && alt !== feMedia[a + '_path']) weg.push(alt);
  });
  if (weg.length) { try { await sbClient.storage.from('familien').remove(weg); } catch (e) { console.warn('feMediaCleanup:', e); } }
}

function feSammleEinstellungen() {
  const v = id => (document.getElementById(id).value || '').trim();
  const o = {};
  Object.entries(FE_EINST_FELDER).forEach(([key, id]) => { const w = v(id); if (w) o[key] = w; });
  ['foto','wappen'].forEach(a => {
    if (feMedia[a + '_url'])  o[a + '_url']  = feMedia[a + '_url'];
    if (feMedia[a + '_path']) o[a + '_path'] = feMedia[a + '_path'];
  });
  return o;
}

// RPC-Fehlercodes -> sprachabhängige Meldung
function feFehlerText(msg) {
  const m = (msg || '').toLowerCase();
  if (m.includes('fe_duplikat'))           return t('fe_duplikat');
  if (m.includes('fe_pflicht'))            return t('fe_pflicht');
  if (m.includes('fe_email_ungueltig'))    return t('email_ungueltig');
  if (m.includes('fe_keine_berechtigung')) return t('fe_keine_berechtigung');
  if (m.includes('fe_keine_familie'))      return t('fe_keine_familie');
  return t('reg_fehler') + (msg || '');
}

async function speichereFamilieEinstellungen() {
  if (!aktuellerUser) return;
  const fehlerEl = document.getElementById('fe-fehler');
  const erfolgEl = document.getElementById('fe-erfolg');
  const button   = document.getElementById('fe-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';

  const v = id => (document.getElementById(id).value || '').trim();
  const sid = document.getElementById('fe-stammbaum-id').value || null;
  const name = v('fe-name'), land = v('fe-land'), stadt = v('fe-stadt'), gemeinde = v('fe-gemeinde');
  const opis = v('fe-opis');

  if (!sid) { fehlerEl.textContent = t('fe_keine_familie'); fehlerEl.style.display = 'block'; return; }
  if (!name || !land || !stadt || !gemeinde) {
    fehlerEl.textContent = t('fe_pflicht'); fehlerEl.style.display = 'block'; return;
  }
  // Kontakt-E-Mail (optional) muss gültig sein, falls gesetzt
  const kontaktEmail = document.getElementById('fe-kontakt-email');
  if (kontaktEmail.value.trim() && !isValidEmail(kontaktEmail.value)) {
    markiereEmailFehler(kontaktEmail, true);
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    kontaktEmail.focus(); return;
  }

  const altText = button.textContent;
  button.disabled = true; button.textContent = t('reg_senden_laeuft');
  // Stadt/Gemeinde kyrillisch -> lateinisch (Orte lateinisch gespeichert; Land kanonisch aus Dropdown)
  const { error } = await sbClient.rpc('stammbaum_einstellungen_speichern', {
    p_stammbaum_id:  sid,
    p_name:          srCyr2Lat(name),
    p_opis:          opis || null,
    p_land:          land,
    p_stadt:         srCyr2Lat(stadt),
    p_gemeinde:      srCyr2Lat(gemeinde),
    p_einstellungen: feSammleEinstellungen()
  });
  button.disabled = false; button.textContent = altText;

  if (error) {
    fehlerEl.textContent = feFehlerText(error.message);
    fehlerEl.style.display = 'block'; return;
  }

  await feMediaCleanup();
  erfolgEl.textContent = t('fe_erfolg'); erfolgEl.style.display = 'block';
  await ladeBaumDaten();   // Dropdown/Kopf mit ggf. neuem Namen frisch
  setTimeout(() => schliesseFamilieEinstellungen(), 900);
}

// ============================================================
// EINMALIGE MIGRATION: eingebettetes FAMILY_DATA -> Supabase
// In der Konsole als Super-Admin aufrufen:  await migriereStammbaum()
// Idempotent (Personen per externe_id upserten; Beziehungen werden für die
// Familie neu aufgebaut). Rendert NICHTS um — füllt nur die Datenbank.
// ============================================================
async function migriereStammbaum() {
  console.log('%c⏳ Migration startet…', 'color:#7a2a2a;font-weight:bold');
  if (!aktuellerUser) { console.error('Bitte zuerst als Super-Admin einloggen.'); return { fehler: 'nicht eingeloggt' }; }

  // Familie (Baum-Container) des eingeloggten Admins ermitteln
  const { data: mit, error: mErr } = await sbClient
    .from('mitgliedschaften').select('familie_id, rolle').eq('user_id', aktuellerUser.id);
  if (mErr || !mit || mit.length === 0) { console.error('Keine Mitgliedschaft gefunden:', mErr); return { fehler: 'keine mitgliedschaft', mErr }; }
  const sa = mit.find(x => x.rolle === 'super_admin') || mit[0];
  const familie_id = sa.familie_id;
  console.log('%cMigriere in familie_id: ' + familie_id, 'color:#7a2a2a;font-weight:bold');

  // 1) Personen upserten (Spalten exakt wie im Import-Skript -> sicher vorhanden)
  const personen = Object.values(FAMILY_DATA.persons).map(p => ({
    familie_id,
    externe_id:  p.id,
    vorname:     p.given   || '',
    nachname:    p.surname || '',
    geburtsdatum: null,           // Rohdatum bleibt in stammbaum_daten (Freitext)
    sterbedatum:  null,
    geschlecht:  null,            // CHECK-Constraint erlaubt 'M'/'F' nicht -> sex bleibt in stammbaum_daten
    notizen:     null,
    stammbaum_daten: p            // komplettes Personen-Objekt (alle Felder, inkl. sex)
  }));
  const { data: insP, error: pErr } = await sbClient
    .from('personen').upsert(personen, { onConflict: 'familie_id,externe_id' })
    .select('id, externe_id');
  if (pErr) { console.error('Personen-Upsert-Fehler:', pErr); return { fehler: 'personen', pErr }; }
  const map = {};
  insP.forEach(r => { map[r.externe_id] = r.id; });
  console.log('Personen migriert:', insP.length);

  // 2) Beziehungen dieser Familie neu aufbauen (erst löschen, dann einfügen)
  await sbClient.from('beziehungen').delete().eq('familie_id', familie_id);
  const bez = [];
  Object.values(FAMILY_DATA.families).forEach(f => {
    const h = map[f.husband], w = map[f.wife];
    // Mann ↔ Frau
    if (h && w) bez.push({ familie_id, person_a: h, person_b: w, typ: 'ehepartner' });
    // Elternteil (person_a) → Kind (person_b)
    (f.children || []).forEach(cid => {
      const c = map[cid];
      if (!c) return;
      if (h) bez.push({ familie_id, person_a: h, person_b: c, typ: 'elternteil' });
      if (w) bez.push({ familie_id, person_a: w, person_b: c, typ: 'elternteil' });
    });
  });
  const { error: bErr } = await sbClient.from('beziehungen').insert(bez);
  if (bErr) { console.error('Beziehungen-Insert-Fehler:', bErr); return { fehler: 'beziehungen', bErr, personen: insP.length }; }
  console.log('Beziehungen migriert:', bez.length);
  console.log('%c✅ Migration abgeschlossen.', 'color:green;font-weight:bold;font-size:14px');
  return { ok: true, personen: insP.length, beziehungen: bez.length };
}

// ============================================================
// MULTI-TREE Phase B1: je Nachname einen Stammbaum anlegen und jede Person
// zuordnen (personen.stammbaum_id). Konsole als Super-Admin:  await migriereMultiTree()
// Idempotent (stammbaeume per (familie_id,name) upserten; personen-Update je Gruppe).
// ============================================================
async function migriereMultiTree() {
  console.log('%c⏳ Multi-Tree-Migration startet…', 'color:#7a2a2a;font-weight:bold');
  if (!aktuellerUser) { console.error('Bitte als Super-Admin einloggen.'); return { fehler: 'nicht eingeloggt' }; }

  const { data: mit, error: mErr } = await sbClient
    .from('mitgliedschaften').select('familie_id, rolle').eq('user_id', aktuellerUser.id);
  if (mErr || !mit || mit.length === 0) { console.error('Keine Mitgliedschaft:', mErr); return { fehler: 'mitgliedschaft' }; }
  const sa = mit.find(x => x.rolle === 'super_admin') || mit[0];
  const familie_id = sa.familie_id;

  const persons  = FAMILY_DATA.persons;
  const families = FAMILY_DATA.families;

  // Nachname je Person bestimmen; bei Leerwert aus Geburtsfamilie/Ehepartner ableiten
  const cache = {};
  function surnameOf(id, seen) {
    if (cache[id] !== undefined) return cache[id];
    const p = persons[id];
    if (!p) return null;
    if (p.surname && p.surname.trim()) return (cache[id] = p.surname.trim());
    seen = seen || new Set();
    if (seen.has(id)) return null;
    seen.add(id);
    for (const fid of (p.families_child || [])) {        // Geburtsfamilie -> Vater/Mutter
      const fam = families[fid]; if (!fam) continue;
      const s = (fam.husband && surnameOf(fam.husband, seen)) || (fam.wife && surnameOf(fam.wife, seen));
      if (s) return (cache[id] = s);
    }
    for (const fid of (p.families_spouse || [])) {       // sonst Ehepartner
      const fam = families[fid]; if (!fam) continue;
      const partner = fam.husband === id ? fam.wife : fam.husband;
      const s = partner && surnameOf(partner, seen);
      if (s) return (cache[id] = s);
    }
    return (cache[id] = null);
  }

  // 1) Distinct Nachnamen -> stammbaeume upserten
  const namen = new Set();
  Object.keys(persons).forEach(id => namen.add(surnameOf(id) || 'Unbekannt'));
  const { data: insB, error: bErr } = await sbClient.from('stammbaeume')
    .upsert([...namen].map(name => ({ familie_id, name })), { onConflict: 'familie_id,name' })
    .select('id, name');
  if (bErr) { console.error('Stammbäume-Upsert-Fehler:', bErr); return { fehler: 'stammbaeume', bErr }; }
  const name2tree = {};
  insB.forEach(r => { name2tree[r.name] = r.id; });
  console.log('Stammbäume:', insB.length, insB.map(b => b.name).join(', '));

  // 2) personen.stammbaum_id je Nachname-Gruppe setzen (nur diese Spalte)
  const gruppen = {};
  Object.values(persons).forEach(p => {
    const tid = name2tree[surnameOf(p.id) || 'Unbekannt'];
    (gruppen[tid] = gruppen[tid] || []).push(p.id);
  });
  let zugeordnet = 0;
  for (const [tid, exts] of Object.entries(gruppen)) {
    const { error } = await sbClient.from('personen')
      .update({ stammbaum_id: tid }).eq('familie_id', familie_id).in('externe_id', exts);
    if (error) { console.error('Personen-Update-Fehler:', error); return { fehler: 'personen', error }; }
    zugeordnet += exts.length;
  }
  console.log('%c✅ Multi-Tree fertig.', 'color:green;font-weight:bold',
    insB.length, 'Bäume,', zugeordnet, 'Personen zugeordnet.');
  return { ok: true, baeume: insB.length, personen: zugeordnet };
}
window.migriereMultiTree = migriereMultiTree;

// Nachname-Korrektur / Baum-Zusammenführung (Tippfehler-Dubletten).
// Verschiebt Personen vom falsch geschriebenen Baum in den richtigen,
// korrigiert surname+name, löscht den leeren Tippfehler-Baum.
// Konsole als Super-Admin:  await korrigiereNachnamen()
// ============================================================
async function korrigiereNachname(falsch, richtig) {
  const { data: mit } = await sbClient
    .from('mitgliedschaften').select('familie_id, rolle').eq('user_id', aktuellerUser.id);
  const sa = (mit || []).find(x => x.rolle === 'super_admin') || (mit || [])[0];
  if (!sa) { console.error('Keine Mitgliedschaft.'); return { fehler: 'mitgliedschaft' }; }
  const familie_id = sa.familie_id;

  const { data: baeume, error: bErr } = await sbClient.from('stammbaeume')
    .select('id, name').eq('familie_id', familie_id).in('name', [falsch, richtig]);
  if (bErr) { console.error(bErr); return { fehler: bErr }; }
  const falschBaum  = (baeume || []).find(b => b.name === falsch);
  const richtigBaum = (baeume || []).find(b => b.name === richtig);
  if (!falschBaum) { console.warn('Kein Baum namens', falsch, '– übersprungen.'); return { ok: true, korrigiert: 0 }; }

  // Zielbaum: vorhandener "richtiger" Baum; sonst den falschen einfach umbenennen
  let zielId = richtigBaum ? richtigBaum.id : falschBaum.id;
  if (!richtigBaum) {
    await sbClient.from('stammbaeume').update({ name: richtig }).eq('id', falschBaum.id);
  }

  const { data: personen, error: pErr } = await sbClient.from('personen')
    .select('id, stammbaum_daten').eq('stammbaum_id', falschBaum.id);
  if (pErr) { console.error(pErr); return { fehler: pErr }; }

  for (const row of (personen || [])) {
    const sd = row.stammbaum_daten || {};
    const neu = { ...sd };
    if (sd.surname) neu.surname = sd.surname.split(falsch).join(richtig);
    if (sd.name)    neu.name    = sd.name.split(falsch).join(richtig);
    const { error: uErr } = await sbClient.from('personen')
      .update({ stammbaum_daten: neu, stammbaum_id: zielId }).eq('id', row.id);
    if (uErr) { console.error('Update-Fehler:', uErr); return { fehler: uErr }; }
  }

  // Leeren Tippfehler-Baum löschen (nur wenn wir in einen anderen verschoben haben)
  if (richtigBaum) await sbClient.from('stammbaeume').delete().eq('id', falschBaum.id);

  console.log('%c✅ ' + falsch + ' → ' + richtig + ': ' + (personen || []).length + ' Personen korrigiert.',
    'color:green;font-weight:bold');
  return { ok: true, korrigiert: (personen || []).length };
}

// Schritt 1 -> Scan über beide Bäume
async function mgPruefen(){
  const fehler = document.getElementById('merge-fehler1'); fehler.style.display = 'none';
  const ba = document.getElementById('mg-baum-a').value, bb = document.getElementById('mg-baum-b').value;
  const pa = document.getElementById('mg-person-a').value, pb = document.getElementById('mg-person-b').value;
  if (!ba || !bb || !pa || !pb){ fehler.textContent = t('merge_baeume_waehlen'); fehler.style.display = 'block'; return; }
  if (ba === bb){ fehler.textContent = t('merge_gleicher_baum'); fehler.style.display = 'block'; return; }

  mgBaumA = ba; mgBaumB = bb;
  mgBaumAName = stammbaeumeListe[ba] || ''; mgBaumBName = stammbaeumeListe[bb] || '';

  const { data, error } = await sbClient.rpc('dubletten_scan', { p_baum_a: ba, p_baum_b: bb });
  if (error){ fehler.textContent = t('merge_fehler') + error.message; fehler.style.display = 'block'; return; }
  mgScanPaare = data || [];

  // Rohnamen des explizit gewählten A/B-Paares holen (für saubere nm()-Anzeige)
  const { data: fixP } = await sbClient.from('personen').select('id, vorname, nachname').in('id', [pa, pb]);
  const rohName = id => { const r = (fixP || []).find(x => x.id === id); return r ? mgRohName(r.vorname, r.nachname) : ''; };
  mgFixPaar = { a: pa, b: pb, name_a: rohName(pa), name_b: rohName(pb) };

  // Personen-Kontext (Baum, Geburtsdatum, Eltern, Partner, Kinder) für alle Beteiligten laden
  const ids = new Set([pa, pb]);
  mgScanPaare.forEach(p => { ids.add(p.id_a); ids.add(p.id_b); });
  await mgLadeInfo([...ids]);

  mgRenderKandidaten();
  mgZeigeSchritt(2);
}

async function mgLadeInfo(ids){
  mgInfo = {};
  if (!ids.length) return;
  const { data } = await sbClient.rpc('merge_person_info', { p_ids: ids });
  (data || []).forEach(r => { mgInfo[r.id] = r; });
}

// Eine Personenzeile mit Kontext (für Kandidatenliste): Baum · *Datum · Eltern · Partner · Kinder
function mgInfoZeile(id, fallbackName){
  const inf = mgInfo[id];
  const name = inf && inf.name ? inf.name : fallbackName;
  const det = [];
  if (inf){
    if (inf.baum)       det.push(`${t('merge_info_baum')}: ${escapeHtml(nm(inf.baum))}`);
    if (inf.geboren)    det.push(`* ${escapeHtml(formatDatumLang(inf.geboren) || inf.geboren)}`);
    if (inf.geburtsort) det.push(escapeHtml(inf.geburtsort));
    if (inf.eltern)     det.push(`${t('merge_info_eltern')}: ${escapeHtml(nm(inf.eltern))}`);
    if (inf.partner)    det.push(`${t('merge_info_partner')}: ${escapeHtml(nm(inf.partner))}`);
    if (inf.kinder)     det.push(`${t('merge_info_kinder')}: ${inf.kinder}`);
  }
  return `<span class="mg-person"><span class="mg-namen">${escapeHtml(nm(name))}</span>` +
    (det.length ? `<span class="mg-meta">${det.join(' · ')}</span>` : '') + `</span>`;
}

function mgRenderKandidaten(){

    html += `<p class="mv-legende">${t('merge_keine_kandidaten')}</p>`;

    weitere.forEach(p => { html += mgKandidatHtml({ a: p.id_a, b: p.id_b, name_a: p.name_a, name_b: p.name_b }, false, p); });

// Schritt 2 -> ausgewählte Paare übernehmen, Schritt 3 starten
function mgWeiterZuKonflikt(){
  const fehler = document.getElementById('merge-fehler2'); fehler.style.display = 'none';
  const cbs = [...document.querySelectorAll('#mg-kandidaten .mg-cb:checked')];
  if (cbs.length === 0){ fehler.textContent = t('merge_keine_auswahl'); fehler.style.display = 'block'; return; }
  mgAusgewaehlt = cbs.map(cb => {
    const a = cb.dataset.a, b = cb.dataset.b;
    if (mgFixPaar && a === mgFixPaar.a && b === mgFixPaar.b) return { a, b, name_a: mgFixPaar.name_a, name_b: mgFixPaar.name_b };
    const sc = mgScanPaare.find(p => p.id_a === a && p.id_b === b);
    return { a, b, name_a: sc ? sc.name_a : '', name_b: sc ? sc.name_b : '' };
  });
  mgIndex = 0;
  mgZeigeSchritt(3);
  mgRenderPaar();
}

async function mgRenderPaar(){
  const fehler = document.getElementById('merge-fehler3'); fehler.style.display = 'none';
  const paar = mgAusgewaehlt[mgIndex];
  document.getElementById('mg-paar-zaehler').textContent =
    t('merge_paar_von', { n: mgIndex + 1, gesamt: mgAusgewaehlt.length });

  const { data: diff, error } = await sbClient.rpc('personen_feld_diff', { p_a: paar.a, p_b: paar.b });
  if (error){
    // Eine Karte existiert evtl. nicht mehr (durch vorherigen Merge) -> Paar überspringen
    console.warn('Paar übersprungen:', error.message);
    if (mgIndex < mgAusgewaehlt.length - 1){ mgIndex++; return mgRenderPaar(); }
    return mgFertig();
  }
  mgDiff = diff || [];
  const nurA = mgDiff.filter(d => d.status === 'nur_a').length;
  const nurB = mgDiff.filter(d => d.status === 'nur_b').length;
  mgSurvivor = (nurB > nurA) ? 'b' : 'a';   // Default: vollständigere Karte bleibt
  mgRenderSurvivor(paar);
  mgRenderKonflikte();
  mgRenderAuto();
}
function mgSurvLabel(id, fallbackName){
  const inf = mgInfo[id];
  const name = inf && inf.name ? inf.name : fallbackName;
  const baum = inf && inf.baum ? ' (' + nm(inf.baum) + ')' : '';
  return escapeHtml(nm(name) + baum);
}
function mgRenderSurvivor(paar){
  document.getElementById('mg-survivor').innerHTML =
    `<label class="mg-survivor-opt"><input type="radio" name="mg-surv" value="a" ${mgSurvivor==='a'?'checked':''} onchange="mgSetSurvivor('a')"> ${mgSurvLabel(paar.a, paar.name_a)}</label>` +
    `<label class="mg-survivor-opt"><input type="radio" name="mg-surv" value="b" ${mgSurvivor==='b'?'checked':''} onchange="mgSetSurvivor('b')"> ${mgSurvLabel(paar.b, paar.name_b)}</label>`;

      <div class="mg-opt"><label><input type="radio" name="mg-k-${f}" value="b" ${def==='b'?'checked':''}> ${t('merge_wert_b')}: ${escapeHtml(mgWertAnzeige(f, d.wert_b))}</label></div>

function mgRenderAuto(){

async function mgMergeAktuelles(){
  const fehler = document.getElementById('merge-fehler3'); fehler.style.display = 'none';
  const btn = document.getElementById('mg-merge-btn'); const alt = btn.textContent;
  const paar = mgAusgewaehlt[mgIndex];
  const behalten = mgSurvivor === 'a' ? paar.a : paar.b;
  const dublette = mgSurvivor === 'a' ? paar.b : paar.a;

  // Konfliktauflösung sammeln (für jedes Konfliktfeld den gewählten Endwert)
  const aufloesung = {};
  mgDiff.filter(d => d.status === 'konflikt').forEach(d => {
    const f = d.feld;
    const sel = document.querySelector(`input[name="mg-k-${f}"]:checked`);
    const wahl = sel ? sel.value : mgSurvivor;
    let val;
    if (wahl === 'a') val = d.wert_a;
    else if (wahl === 'b') val = d.wert_b;
    else { const man = document.querySelector(`.mg-man[data-feld="${f}"]`); val = man ? man.value.trim() : ''; }
    aufloesung[f] = val || '';
  });

  btn.disabled = true; btn.textContent = t('merge_laeuft');
  const { error } = await sbClient.rpc('person_merge_aufgeloest',
    { p_behalten: behalten, p_dublette: dublette, p_aufloesung: aufloesung });
  btn.disabled = false; btn.textContent = alt;
  if (error){ fehler.textContent = t('merge_fehler') + error.message; fehler.style.display = 'block'; return; }

  if (mgIndex < mgAusgewaehlt.length - 1){ mgIndex++; mgRenderPaar(); }
  else { await mgFertig(); }
}

async function setzePasswort() {
  const pw       = document.getElementById('setpw-passwort').value;
  const pw2      = document.getElementById('setpw-passwort2').value;
  const fehlerEl = document.getElementById('setpw-fehler');
  const erfolgEl = document.getElementById('setpw-erfolg');
  const button   = document.querySelector('#setpw-modal .login-submit');
  fehlerEl.style.display = 'none';
  erfolgEl.style.display = 'none';

  // Bug 1: zwei Eingaben, müssen übereinstimmen
  if (!pw || pw.length < 6) {
    fehlerEl.textContent = t('setpw_fehler') + '≥ 6';
    fehlerEl.style.display = 'block'; return;
  }
  if (pw !== pw2) {
    fehlerEl.textContent = t('setpw_ungleich');
    fehlerEl.style.display = 'block'; return;
  }

  // Bug 2: sicherstellen, dass die Session aus dem Invite-/Recovery-Link aktiv ist
  const { data: { session } } = await sbClient.auth.getSession();
  if (!session) {
    fehlerEl.textContent = t('setpw_keine_session');
    fehlerEl.style.display = 'block'; return;
  }

  const altText = button ? button.textContent : '';
  if (button) { button.disabled = true; button.textContent = t('reg_senden_laeuft'); }

  const { error } = await sbClient.auth.updateUser({ password: pw });

  if (button) { button.disabled = false; button.textContent = altText; }

  if (error) {
    fehlerEl.textContent = t('setpw_fehler') + error.message;
    fehlerEl.style.display = 'block'; return;
  }

  // Erfolg: Passwort ist gesetzt und der User ist über diese Session eingeloggt.
  // App-Auth-Status explizit setzen (UI + Baum laden) und Token aus der URL entfernen.
  history.replaceState(null, '', window.location.pathname + window.location.search);
  erfolgEl.textContent = t('setpw_erfolg');
  erfolgEl.style.display = 'block';
  document.getElementById('setpw-passwort').value = '';
  document.getElementById('setpw-passwort2').value = '';
  const { data: { session: s2 } } = await sbClient.auth.getSession();
  if (s2) await setzeUser(s2.user);   // meldet den User in der Oberfläche an
  setTimeout(() => document.getElementById('setpw-modal').classList.remove('aktiv'), 1500);
}

// ---- Hintergrund-Prüfung: existiert dieser Stammbaum schon? -------------------
// Sobald Naziv stabla + Država + Grad/selo + Opština ausgefüllt sind, prüfen wir
// per RPC familie_finden_exakt (striktes 4-Felder-Matching, diakritik-/groß-klein-
// unempfindlich). Treffer -> Zugriffsanfrage (Info + Rolle). Kein Treffer -> der
// normale Erstellungsprozess (Self-Service) läuft beim Absenden.
let regMatchTimer = null;
let regMatchFamilie = null;   // { id, name } bei Treffer, sonst null
function pruefeBaumMatchDebounced() {
  clearTimeout(regMatchTimer);
  regMatchTimer = setTimeout(pruefeBaumMatch, 300);
}

async function pruefeBaumMatch() {
  const v = id => document.getElementById(id).value.trim();
  const name = v('reg-baum-name'), land = v('reg-land'),
        stadt = v('reg-stadt'), gemeinde = v('reg-gemeinde');
  // Erst prüfen, wenn ALLE vier Pflichtfelder gefüllt sind
  if (!name || !land || !stadt || !gemeinde) { aktualisiereRegMatchUI(null); return null; }

  // Orte werden lateinisch gespeichert -> kyrillische Eingaben vor dem Vergleich
  // nach Latein wandeln (Land kommt bereits kanonisch aus dem Dropdown).
  const { data, error } = await sbClient.rpc('familie_finden_exakt', {
    p_name:     srCyr2Lat(name),
    p_land:     land,
    p_stadt:    srCyr2Lat(stadt),
    p_gemeinde: srCyr2Lat(gemeinde)
  });
  if (error) { console.warn('familie_finden_exakt:', error.message); aktualisiereRegMatchUI(null); return null; }
  const hit = (data && data.length) ? data[0] : null;
  aktualisiereRegMatchUI(hit);
  return hit;
}

// UI an den Match-Status anpassen: Treffer zeigt Info + Rollen-Dropdown und
// schaltet den Button auf "Zugang beantragen"; sonst Self-Service-Anlegen.
function aktualisiereRegMatchUI(hit) {
  regMatchFamilie = hit ? { id: hit.id, name: hit.name } : null;
  document.getElementById('reg-familie').value = hit ? hit.id : '';
  const block = document.getElementById('reg-match-block');
  if (block) block.style.display = hit ? '' : 'none';
  if (hit) aktualisiereRegWahl();   // Hinweis + Rollen-Sichtbarkeit gemäß Auswahl
  aktualisiereRegSubmitButton();
}

}

function aktualisiereRegSubmitButton() {
  const btn = document.getElementById('reg-submit');
  if (!btn) return;
  // „Zugang beantragen" nur, wenn ein Baum gefunden wurde UND der User beitreten will;
  // sonst (kein Treffer oder „eigenen") wird ein eigenes Konto/Baum angelegt.

// Einfacher Hinweis-Dialog (nur OK-Button) – für klare Bestätigungen.
function zeigeHinweis(text) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-text">${escapeHtml(text)}</p>
        <div class="confirm-actions">
          <button type="button" class="confirm-ja">OK</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const fertig = () => { overlay.remove(); resolve(); };
    overlay.querySelector('.confirm-ja').addEventListener('click', fertig);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) fertig(); });
  });
}

// Alle Registrier-Felder leeren (nach erfolgreichem Absenden / beim Öffnen).
function regFelderLeeren() {

async function sendeRegistrierAnfrage() {
  const fehlerEl = document.getElementById('reg-fehler');
  const erfolgEl = document.getElementById('reg-erfolg');
  const button   = document.getElementById('reg-submit');
  fehlerEl.style.display = 'none';
  erfolgEl.style.display = 'none';

  const val  = id => document.getElementById(id).value.trim();
  const vald = id => datumWert(document.getElementById(id));   // Datumsfelder -> ISO/Freitext

  // Pflichtfelder: E-Mail + die vier Baum-Felder (Naziv/Država/Grad/Opština)
  const email = val('reg-email');
  if (!email || !val('reg-baum-name') || !val('reg-land') || !val('reg-stadt') || !val('reg-gemeinde')) {
    fehlerEl.textContent = t('reg_pflicht');
    fehlerEl.style.display = 'block';
    return;
  }
  // E-Mail-Format (Pflicht-E-Mail) + optionale Kontakt-E-Mail prüfen
  if (!isValidEmail(email)) {
    markiereEmailFehler(document.getElementById('reg-email'), true);
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('reg-email').focus();
    return;
  }
  if (!pruefeEmailFeld(document.getElementById('reg-kontakt-email'), false)) {
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('reg-kontakt-email').focus();
    return;
  }

  // Aktuellen Match-Status sicherstellen (falls der User vor dem Debounce absendet).
  await pruefeBaumMatch();

  // Eigenen Baum anlegen, wenn KEIN Treffer ODER der User sich bewusst dafür
  // entscheidet (Wahl „eigenen") trotz vorhandenem Baum.
  if (!regMatchFamilie || regMatchWahl() === 'eigenen') { await regNeueFamilieAnlegen(); return; }

  // Vorhandener Baum -> Zugriffsanfrage an die Admins (Entscheidung in der App).
  const familie_id = regMatchFamilie.id;
  const rolle      = document.getElementById('reg-rolle').value;
  if (!rolle) { fehlerEl.textContent = t('reg_pflicht'); fehlerEl.style.display = 'block'; return; }

  const altText = button.textContent;
  button.disabled = true;
  button.textContent = t('reg_senden_laeuft');

  // ID clientseitig erzeugen: So brauchen wir KEIN .select() nach dem Insert
  // (das würde ein RETURNING/SELECT auslösen, das anon per RLS nicht lesen darf -> 42501).
  const anfrageId = (crypto.randomUUID ? crypto.randomUUID() : ('' + Date.now() + Math.random()));
  const anfrage = {
    id:             anfrageId,
    email,
    familie_id,
    rolle,
    vorname:        val('reg-vorname')       || null,
    nachname:       val('reg-nachname')      || null,
    geburtsdatum:   vald('reg-geburtsdatum')  || null,
    geburtsort:     val('reg-geburtsort')    || null,
    geburtsland:    val('reg-geburtsland')   || null,   // Geburtsland der Person
    stadt:          val('reg-stadt')         || null,   // Familien-Finder: Stadt
    gemeinde:       val('reg-gemeinde')      || null,   // Familien-Finder: Gemeinde
    getauft_am:     vald('reg-getauft')       || null,
    verheiratet_am: vald('reg-verheiratet')   || null,
    telefon:        val('reg-telefon')       || null,
    kontakt_email:  val('reg-kontakt-email') || null,
    facebook:       val('reg-facebook')      || null,
    instagram:      val('reg-instagram')     || null,
    sprache:        aktuelleSprache,   // E-Mail-Sprache = GUI-Sprache beim Absenden
    status:         'offen'
  };

  const { error } = await sbClient
    .from('registrierungs_anfragen').insert(anfrage);   // KEIN .select() -> return=minimal

  if (error) {
    button.disabled = false;
    button.textContent = altText;
    console.error('Anfrage-Fehler:', error);
    fehlerEl.textContent = t('reg_fehler') + error.message;
    fehlerEl.style.display = 'block';
    return;
  }

  // Admins per E-Mail benachrichtigen (Edge Function). Schlägt der Versand fehl,
  // ist die Anfrage trotzdem gespeichert und für Admins sichtbar -> nicht kritisch.
  try {
    await sbClient.functions.invoke('anfrage-senden', { body: { id: anfrageId } });
  } catch (e) {
    console.warn('Benachrichtigung fehlgeschlagen:', e);
  }

  button.disabled = false;
  button.textContent = altText;

  // Felder leeren, Overlay schließen und eine klare Bestätigung anzeigen,
  // die der User selbst wegklickt (verschwindet nicht von allein).
  regFelderLeeren();
  schliesseRegistrierModal();
  await zeigeHinweis(t('reg_erfolg'));
}

// Kein vorhandener Baum gefunden: neuen, leeren Stammbaum selbst anlegen (ohne
// Admin-Freigabe). Edge Function legt Auth-User + Familie (mit Ortsfeldern fürs
// spätere Matching) + Stammbaum + erste Person + Owner-Mitgliedschaft an und
// verschickt eine Einladungs-Mail zum Passwort-Setzen.
async function regNeueFamilieAnlegen() {
  const fehlerEl = document.getElementById('reg-fehler');
  const erfolgEl = document.getElementById('reg-erfolg');
  const button   = document.getElementById('reg-submit');
  fehlerEl.style.display = 'none';
  erfolgEl.style.display = 'none';

  const val  = id => document.getElementById(id).value.trim();
  const vald = id => datumWert(document.getElementById(id));   // Datumsfelder -> ISO/Freitext
  const email        = val('reg-email');
  const familie_name = val('reg-baum-name');   // Naziv stabla = Name der neuen Familie/des Baums

  if (!email || !familie_name) {
    fehlerEl.textContent = t('reg_pflicht');
    fehlerEl.style.display = 'block';
    return;
  }
  if (!isValidEmail(email)) {
    markiereEmailFehler(document.getElementById('reg-email'), true);
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('reg-email').focus(); return;
  }
  if (!pruefeEmailFeld(document.getElementById('reg-kontakt-email'), false)) {
    fehlerEl.textContent = t('email_ungueltig'); fehlerEl.style.display = 'block';
    document.getElementById('reg-kontakt-email').focus(); return;
  }

  const altText = button.textContent;
  button.disabled = true;
  button.textContent = t('reg_senden_laeuft');

  const payload = {
    email,
    familie_name,
    // Ortsfelder der Familie (Država / Grad-selo / Opština) – lateinisch speichern,
    // damit das spätere strikte Matching (familie_finden_exakt) greift.
    land:     val('reg-land')              || null,
    stadt:    srCyr2Lat(val('reg-stadt'))    || null,
    gemeinde: srCyr2Lat(val('reg-gemeinde')) || null,
    sprache: aktuelleSprache,
    person: {
      vorname:        val('reg-vorname')       || null,
      nachname:       val('reg-nachname')      || familie_name,
      geburtsdatum:   vald('reg-geburtsdatum')  || null,
      geburtsort:     val('reg-geburtsort')    || null,
      geburtsland:    val('reg-geburtsland')   || null,
      getauft_am:     vald('reg-getauft')       || null,
      verheiratet_am: vald('reg-verheiratet')   || null,
      telefon:        val('reg-telefon')       || null,
      kontakt_email:  val('reg-kontakt-email') || null,
      facebook:       val('reg-facebook')      || null,
      instagram:      val('reg-instagram')     || null
    }
  };

  // Direkter fetch statt functions.invoke: so lesen wir den JSON-Body der
  // Function zuverlässig selbst (supabase-js verschluckt bei non-2xx sonst die
  // eigentliche Fehlermeldung im FunctionsHttpError).
  let ok = false, fnCode = null, fnMsg = null;
  try {
    const resp = await fetch(SUPABASE_URL + '/functions/v1/neue-familie-anlegen', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify(payload)
    });
    const body = await resp.json().catch(() => ({}));
    ok = resp.ok && !body.error;
    fnCode = body.code || null;
    fnMsg  = body.error || (!resp.ok ? ('HTTP ' + resp.status) : null);
  } catch (e) {
    fnMsg = e.message || String(e);
  }

  button.disabled = false;
  button.textContent = altText;

  if (!ok) {
    console.error('Neue-Familie-Fehler:', fnCode, fnMsg);
    const low = (fnMsg || '').toLowerCase();
    const emailExists = fnCode === 'email_exists'
      || low.includes('already') || low.includes('registered') || low.includes('exist');
    fehlerEl.textContent = emailExists ? t('reg_email_existiert') : (t('reg_fehler') + (fnMsg || ''));
    fehlerEl.style.display = 'block';
    fehlerEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  regFelderLeeren();
  schliesseRegistrierModal();
  await zeigeHinweis(t('reg_neue_erfolg'));
}

// Sprach-Ermittlung beim Start: 1) gespeicherte Benutzersprache  2) Browser-Sprache  3) Englisch.
function unterstuetzteSprache(code) {
  const map = { de: 'de', en: 'en', sr: 'sr', hr: 'hr', bs: 'ba', ba: 'ba' };   // Bosnisch ISO = 'bs'
  return map[(code || '').toLowerCase().slice(0, 2)] || null;
}
function ermittleStartsprache() {
  const sv = localStorage.getItem('vidovic_lang');
  if (sv && TEXTE[sv]) return sv;                          // gespeicherte Sprache hat Vorrang
  const navL = (navigator.languages && navigator.languages.length)
    ? navigator.languages : [navigator.language || navigator.userLanguage || ''];
  for (const l of navL) { const s = unterstuetzteSprache(l); if (s) return s; }   // Browser-Sprache
  return 'en';                                             // Fallback Englisch
}
const spracheWarGespeichert = !!(localStorage.getItem('vidovic_lang') && TEXTE[localStorage.getItem('vidovic_lang')]);
let aktuelleSprache = ermittleStartsprache();
let aktuelleDaten = FAMILY_DATA;
let fokusPersonId = null;
let aktuelleAnsicht = 'baum';
// Multi-Tree (B2): aktuell gewählter Stammbaum + Liste {id: name}
let aktuellerStammbaumId = null;
let stammbaeumeListe = {};
let stammbaumZuFamilie = {};   // stammbaum_id -> familie_id (für Podešavanje porodice)
let meineRollenProFamilie = {};   // familie_id -> Rolle des aktuellen Users (Standard-Stammbaum-Priorität)
let startBaumGewaehlt = false;    // Start-Stammbaum nach Login einmalig bestimmt?
let modalVerlauf = [];
let aktuelleModalPersonId = null;

function t(key, vars = {}) {
  let text = TEXTE[aktuelleSprache][key] || TEXTE.de[key] || key;
  Object.entries(vars).forEach(([k, v]) => {
    text = text.replace(`{${k}}`, v);
  });
  return text;
}

const SR_DIGRAFEN = [['Dž','Џ'],['DŽ','Џ'],['dž','џ'],['Lj','Љ'],['LJ','Љ'],['lj','љ'],['Nj','Њ'],['NJ','Њ'],['nj','њ']];
const SR_BUCHSTABEN = {
  'A':'А','B':'Б','C':'Ц','Č':'Ч','Ć':'Ћ','D':'Д','Đ':'Ђ','E':'Е','F':'Ф','G':'Г',
  'H':'Х','I':'И','J':'Ј','K':'К','L':'Л','M':'М','N':'Н','O':'О','P':'П','R':'Р',
  'S':'С','Š':'Ш','T':'Т','U':'У','V':'В','Z':'З','Ž':'Ж',
  'a':'а','b':'б','c':'ц','č':'ч','ć':'ћ','d':'д','đ':'ђ','e':'е','f':'ф','g':'г',
  'h':'х','i':'и','j':'ј','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','r':'р',
  's':'с','š':'ш','t':'т','u':'у','v':'в','z':'з','ž':'ж'
};
function srLat2Cyr(text) {
  if (!text) return text;
  let out = text;
  SR_DIGRAFEN.forEach(([lat, cyr]) => { out = out.split(lat).join(cyr); });
  let result = '';
  for (const ch of out) result += (SR_BUCHSTABEN[ch] !== undefined ? SR_BUCHSTABEN[ch] : ch);
  return result;
}
// Rückrichtung Kyrillisch -> Latein (für Suche: DB speichert Namen lateinisch).
// Latein-Eingaben bleiben unverändert (nur kyrillische Zeichen werden ersetzt).
const SR_CYR2LAT_DIGRAFEN = [['Џ','Dž'],['џ','dž'],['Љ','Lj'],['љ','lj'],['Њ','Nj'],['њ','nj']];
const SR_CYR2LAT = (() => {
  const m = {};
  Object.entries(SR_BUCHSTABEN).forEach(([lat, cyr]) => { if (!(cyr in m)) m[cyr] = lat; });
  return m;
})();
function srCyr2Lat(text) {
  if (!text) return text;
  let out = text;
  SR_CYR2LAT_DIGRAFEN.forEach(([cyr, lat]) => { out = out.split(cyr).join(lat); });
  let result = '';
  for (const ch of out) result += (SR_CYR2LAT[ch] !== undefined ? SR_CYR2LAT[ch] : ch);
  return result;
}

// Anzeigename: bei Auswahl "Српски" kyrillisch, sonst unverändert
function nm(text) {
  return aktuelleSprache === 'sr' ? srLat2Cyr(text) : text;
}

const ortLookup = (() => {
  const m = {};
  ORT_LEXIKON.forEach(e => ['de','sr','hr','ba','en'].forEach(l => { if (e[l]) m[e[l].toLowerCase()] = e; }));
  return m;

// Übersetzt bekannte Orte/Länder in die aktuelle GUI-Sprache (Teil-für-Teil bei
// kommagetrennten Werten); Unbekanntes bleibt im Original.
function uebersetzeOrt(text) {
  if (!text) return text;
  return String(text).split(/\s*,\s*/).map(teil => {
    const e = ortLookup[teil.trim().toLowerCase()];
    return e ? (e[aktuelleSprache] || e.de || teil) : teil;
  }).join(', ');
}

  const sel = document.getElementById(selId);

  const laender = ORT_LEXIKON
    .map(e => ({ wert: e.de, label: e[aktuelleSprache] || e.de }))

function wechselSprache(lang, speichern = true) {
  aktuelleSprache = lang;
  // Nur eine EXPLIZITE Auswahl (Willkommens-Modal / Sprach-Dropdown) wird persistiert.
  // Die beim Start automatisch erkannte Sprache wird NUR angewendet (speichern=false),
  // damit `vidovic_lang` leer bleibt und das Willkommens-Overlay bis zur echten Wahl
  // bei jedem Laden erscheint (sonst „verschwindet" es nach dem ersten Reload).
  if (speichern) localStorage.setItem('vidovic_lang', lang);
  document.documentElement.lang = lang;
  
  // Sprach-Dropdown aktualisieren (aktiver Eintrag + Anzeige im Toggle)
  const sprachInfo = SPRACHEN.find(s => s.code === lang);
  if (sprachInfo) {
    document.getElementById('aktive-flagge').innerHTML = FLAGGEN[sprachInfo.flag];
    document.getElementById('aktive-sprache').textContent = sprachInfo.label;
  }
  document.querySelectorAll('#sprach-menu li').forEach(li => {
    li.classList.toggle('aktiv', li.dataset.lang === lang);
  });

  // Alle Elemente mit data-i18n übersetzen
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  aktualisiereDatumsfelder();   // Datums-Platzhalter + Kurzformat an Sprache anpassen

  // Kopf (Titel/Untertitel/Zahlen) je nach Login + aktuellem Stammbaum
  aktualisiereKopf();

  // Dynamische Inhalte neu rendern
  aktualisiereStats();
  baueNachnameFilter();
  befuelleStammbaumAuswahl();    // Stammbaum-Dropdown: Namen je Sprache (sr -> kyrillisch)
  aktualisiereBaumHinweis();     // Orientierungs-Banner in neuer Sprache
  if (aktuelleAnsicht === 'karten') zeigeKarten();
  else if (aktuelleAnsicht === 'shorts') zeigeShorts();
  else aktualisiereBaumInfo();
  zeichneBaumNeu();
  aktualisiereAuthUI();
  // Bereits geöffnete Overlays mit dynamischen Inhalten in der neuen Sprache neu rendern
  const offen = id => document.getElementById(id)?.classList.contains('aktiv');
  if (offen('mitglieder-modal') && typeof ladeMitglieder  === 'function') ladeMitglieder();   // Familien-Dropdown + Liste neu (nm)
  if (offen('kosten-modal')     && typeof renderKosten     === 'function') renderKosten();
  if (offen('obav-modal')       && typeof renderObavListe  === 'function') renderObavListe();
  // Merge-Wizard: dynamische Inhalte des sichtbaren Schritts in neuer Sprache neu aufbauen
  if (offen('merge-modal')) {
    if (document.getElementById('merge-step2').style.display !== 'none' && mgFixPaar) mgRenderKandidaten();
    if (document.getElementById('merge-step3').style.display !== 'none' && mgAusgewaehlt[mgIndex]) {
      const paar = mgAusgewaehlt[mgIndex];
      document.getElementById('mg-paar-zaehler').textContent = t('merge_paar_von', { n: mgIndex + 1, gesamt: mgAusgewaehlt.length });
      mgRenderSurvivor(paar); mgRenderKonflikte(); mgRenderAuto();
    }
    if (document.getElementById('merge-step4').style.display !== 'none') mgRenderTreeMerge();
  }
  // Falls das Registrier-Overlay offen ist: Länder-Dropdown in neuer Sprache neu
  // füllen und den Submit-Button passend zum Match-Status (Anfrage vs. Anlegen) setzen.
  if (document.getElementById('registrier-modal')?.classList.contains('aktiv')) {
    if (typeof fuelleLandSelect === 'function') fuelleLandSelect();
    if (typeof aktualisiereRegWahl === 'function' && regMatchFamilie) aktualisiereRegWahl();
    if (typeof aktualisiereRegSubmitButton === 'function') aktualisiereRegSubmitButton();
  }
  // Podešavanje porodice offen: Länder-Dropdown in neuer Sprache (Auswahl bleibt erhalten)
  if (offen('familie-einst-modal') && typeof fuelleLandSelect === 'function') fuelleLandSelect('fe-land');

// ============================================================
// PHASE A2: Baum aus Supabase laden (Fallback: eingebettetes FAMILY_DATA)
// Rekonstruiert aus personen + beziehungen (ehepartner/elternteil) wieder die
// GEDCOM-artige Struktur { persons, families }. Personen-Schlüssel = externe_id
// (z.B. I500009) -> bleibt kompatibel zur bestehenden Render-Logik.
// ============================================================
async function ladeBaumAusSupabase() {
  const [pRes, bRes, sRes] = await Promise.all([
    sbClient.from('personen').select('id, externe_id, stammbaum_daten, pos_x, pos_y, stammbaum_id, user_id, identitaet_id'),
    sbClient.from('beziehungen').select('person_a, person_b, typ'),
    sbClient.from('stammbaeume').select('id, name, familie_id')
  ]);
  if (pRes.error || bRes.error) {
    console.warn('Supabase-Baum: Ladefehler, nutze eingebettete Daten.', pRes.error || bRes.error);
    return null;
  }
  // Baumliste merken (id -> name) für Auswahl & Kopf; id -> familie_id für Stammdaten
  stammbaeumeListe = {};
  stammbaumZuFamilie = {};
  (sRes.data || []).forEach(s => {
    stammbaeumeListe[s.id] = s.name;
    if (s.familie_id) stammbaumZuFamilie[s.id] = s.familie_id;
  });
  const rows = pRes.data || [];
  if (rows.length === 0) return null;   // nicht eingeloggt / keine Sichtbarkeit -> Fallback

  const uuid2ext = {};
  const persons  = {};
  rows.forEach(row => {
    const sd  = row.stammbaum_daten || {};
    const ext = row.externe_id || sd.id;
    if (!ext) return;
    uuid2ext[row.id] = ext;
    persons[ext] = {
      ...sd, id: ext, families_spouse: [], families_child: [],
      _uuid: row.id,
      _tree: row.stammbaum_id || null,
      _ident: row.identitaet_id || null,   // gleiche reale Person über Bäume (logische Verknüpfung)
      _hatKonto: !!row.user_id,
      _pos: (row.pos_x != null && row.pos_y != null) ? { x: row.pos_x, y: row.pos_y } : null
    };
  });

  // Beziehungen -> Ehepaare + Eltern-Mengen je Kind
  const ehe = [];
  const elternVon = {};
  (bRes.data || []).forEach(b => {
    const a = uuid2ext[b.person_a], c = uuid2ext[b.person_b];
    if (!a || !c) return;
    if (b.typ === 'ehepartner')      ehe.push([a, c]);
    else if (b.typ === 'elternteil') (elternVon[c] = elternVon[c] || new Set()).add(a);
  });

  // Familien-Einheiten rekonstruieren (Schlüssel = sortierte Eltern-IDs)
  const families = {};
  const keyToFam = {};
  let famN = 1;
  function holeFamilie(parents) {
    const key = parents.slice().sort().join('__');
    if (keyToFam[key]) return keyToFam[key];
    const fid = 'FAM' + (famN++);
    const fam = { id: fid, husband: null, wife: null, children: [] };
    parents.forEach(pid => {
      const sex = (persons[pid] && persons[pid].sex) || '';
      if (sex === 'M' && !fam.husband)      fam.husband = pid;
      else if (sex === 'F' && !fam.wife)    fam.wife = pid;
      else if (!fam.husband)                fam.husband = pid;
      else                                  fam.wife = pid;
    });
    families[fid] = fam;
    keyToFam[key] = fid;
    return fid;
  }
  ehe.forEach(([a, b]) => holeFamilie([a, b]));                 // auch kinderlose Paare
  Object.entries(elternVon).forEach(([child, set]) => {
    const fid = holeFamilie([...set]);
    if (!families[fid].children.includes(child)) families[fid].children.push(child);
  });

  // families_spouse / families_child an den Personen setzen
  Object.values(families).forEach(fam => {
    if (fam.husband && persons[fam.husband]) persons[fam.husband].families_spouse.push(fam.id);
    if (fam.wife    && persons[fam.wife])    persons[fam.wife].families_spouse.push(fam.id);
    fam.children.forEach(cid => { if (persons[cid]) persons[cid].families_child.push(fam.id); });
  });

  return { persons, families };
}

// Lädt die Baumdaten und rendert neu; bei Misserfolg bleibt das eingebettete FAMILY_DATA aktiv.
async function ladeBaumDaten() {
  const daten = await ladeBaumAusSupabase();
  if (!daten || Object.keys(daten.persons).length === 0) {
    console.log('Baum: eingebettete FAMILY_DATA aktiv (Supabase leer/nicht sichtbar).');
    return;
  }
  // Hinweis: KEIN Hardcode-Check auf die Vidović-Wurzel I500009 mehr.
  // Sonst würden Konten ohne diese Wurzel (eigene/andere Stammbäume) fälschlich
  // auf das eingebettete FAMILY_DATA zurückfallen und ihre echten Daten nicht sehen.
  aktuelleDaten = daten;
  console.log('Baum aus Supabase geladen:', Object.keys(daten.persons).length, 'Personen,',
    Object.keys(daten.families).length, 'Familien,', Object.keys(stammbaeumeListe).length, 'Stammbäume.');
  baueNachnameFilter();
  // Multi-Tree (B2): Auswahl befüllen.
  befuelleStammbaumAuswahl();
  // Aktuell geöffneten Stammbaum BEIBEHALTEN (z. B. nach Speichern/Bearbeiten/
  // Hochladen/Löschen). Beim ERSTEN Laden nach Login: Start-Stammbaum nach Priorität
  // (gespeicherter Standard > Owner > Admin; bei mehreren ohne Standard -> Willkommen-Overlay).
  const groessen = stammbaumGroessen();
  const gueltig = id => id && groessen[id];               // Baum existiert + hat Personen
  if (gueltig(aktuellerStammbaumId)) {
    waehleStammbaum(aktuellerStammbaumId);
  } else if (!startBaumGewaehlt) {
    startBaumGewaehlt = true;
    waehleStartStammbaum();
  } else {
    let standard = null;
    try { const s = localStorage.getItem('vidovic_tree'); if (gueltig(s)) standard = s; } catch (e) {}
    if (!standard) standard = groessterStammbaum();
    if (standard) waehleStammbaum(standard);
    else { aktualisiereStats(); zeichneBaumNeu(); }
  }
  if (aktuelleAnsicht === 'karten') zeigeKarten();
  else if (aktuelleAnsicht === 'shorts') zeigeShorts();
}

// Standard-Stammbaum (pro User, lokal dauerhaft gespeichert)
function standardBaumKey() { return aktuellerUser ? 'vidovic_standard_baum_' + aktuellerUser.id : null; }
function getStandardBaum() {
  const k = standardBaumKey(); if (!k) return null;
  const v = localStorage.getItem(k);
  return (v && stammbaeumeListe[v]) ? v : null;   // nur, wenn noch zugänglich
}
function setStandardBaum(id) { const k = standardBaumKey(); if (k && id) localStorage.setItem(k, id); }

// Bäume, für die der User verantwortlich ist (Owner/Admin; Super-Admin zählt wie Owner).
// Nur Bäume mit Personen. -> { owner:[ids], admin:[ids], verantwortlich:[ids] }
function meineVerantwortlichenBaeume() {
  const groessen = stammbaumGroessen();
  const owner = [], admin = [];
  Object.keys(stammbaeumeListe).forEach(id => {
    if (!groessen[id]) return;
    const fam = stammbaumZuFamilie[id];
    const rolle = fam ? meineRollenProFamilie[fam] : null;
    if (rolle === 'familien_owner' || rolle === 'super_admin') owner.push(id);
    else if (rolle === 'familien_admin') admin.push(id);
  });
  return { owner, admin, verantwortlich: [...owner, ...admin] };
}

// Start-Stammbaum nach Login wählen. Priorität:
// gespeicherter Standard > genau 1 Owner-Baum > genau 1 Admin-Baum >
// (mehrere Verantwortlichkeiten -> Willkommen-Overlay) > zuletzt geöffneter > größter.
function waehleStartStammbaum() {
  const saved = getStandardBaum();
  if (saved) { waehleStammbaum(saved); return; }   // explizite Wahl des Users hat Vorrang

  const { owner, admin, verantwortlich } = meineVerantwortlichenBaeume();
  const kandidaten = owner.length ? owner : admin;   // Owner vor Admin

  if (kandidaten.length === 1) { waehleStammbaum(kandidaten[0]); return; }
  if (verantwortlich.length > 1) { zeigeStandardWahl(verantwortlich); return; }

  // Keine (eindeutige) Owner/Admin-Verantwortung -> zuletzt geöffneter / größter Baum
  let standard = null;
  try { const s = localStorage.getItem('vidovic_tree'); if (stammbaeumeListe[s]) standard = s; } catch (e) {}
  if (!standard) standard = groessterStammbaum();
  if (standard) waehleStammbaum(standard);
  else { aktualisiereStats(); zeichneBaumNeu(); }
}

// Willkommen-Overlay: einmalige Wahl des Standard-Stammbaums (mehrere Verantwortlichkeiten)
function zeigeStandardWahl(ids) {
  if (!ids || !ids.length) { const g = groessterStammbaum(); if (g) waehleStammbaum(g); return; }
  waehleStammbaum(ids[0]);   // im Hintergrund schon etwas anzeigen, während der Nutzer wählt
  const sel = document.getElementById('sw-baum');
  if (!sel) return;
  const groessen = stammbaumGroessen();
  sel.innerHTML = ids.map(id =>
    `<option value="${escapeHtml(id)}">${escapeHtml(nm(stammbaeumeListe[id] || '?'))} (${groessen[id] || 0})</option>`).join('');
  sel.value = ids[0];
  document.getElementById('standard-wahl-modal').classList.add('aktiv');
  macheAlleSelectsSuchbar(document.getElementById('standard-wahl-modal'));
}
function schliesseStandardWahl() { document.getElementById('standard-wahl-modal').classList.remove('aktiv'); }
function speichereStandardWahl() {
  const id = document.getElementById('sw-baum').value;
  if (id) { setStandardBaum(id); waehleStammbaum(id); }
  schliesseStandardWahl();
}

// „Standard-Stammbaum"-Sektion im Einstellungs-Overlay befüllen (nur bei ≥2 Verantwortlichkeiten)
function feFuelleStandardSektion() {
  const block = document.getElementById('fe-standard-block');
  const sel   = document.getElementById('fe-standard-baum');
  if (!block || !sel) return;
  const { verantwortlich } = meineVerantwortlichenBaeume();
  if (verantwortlich.length < 2) { block.style.display = 'none'; return; }
  block.style.display = '';
  const groessen = stammbaumGroessen();
  sel.innerHTML = verantwortlich.map(id =>
    `<option value="${escapeHtml(id)}">${escapeHtml(nm(stammbaeumeListe[id] || '?'))} (${groessen[id] || 0})</option>`).join('');
  const aktuell = getStandardBaum() || aktuellerStammbaumId || verantwortlich[0];
  sel.value = verantwortlich.includes(aktuell) ? aktuell : verantwortlich[0];
}
function speichereStandardAusFe() {
  const id = document.getElementById('fe-standard-baum').value;
  if (!id) return;
  setStandardBaum(id);
  const erfolgEl = document.getElementById('fe-erfolg');
  erfolgEl.textContent = t('fe_standard_gespeichert'); erfolgEl.style.display = 'block';
  setTimeout(() => { if (erfolgEl) erfolgEl.style.display = 'none'; }, 2500);
}

// Personenzahl je Stammbaum
function stammbaumGroessen() {
  const z = {};
  Object.values(aktuelleDaten.persons).forEach(p => { if (p._tree) z[p._tree] = (z[p._tree] || 0) + 1; });
  return z;
}

function groessterStammbaum() {
  const z = stammbaumGroessen();
  let best = null, max = -1;
  Object.entries(z).forEach(([id, n]) => { if (n > max) { max = n; best = id; } });
  return best;
}

// Auswahl-Dropdown mit allen Bäumen (die Personen haben), nach Größe sortiert
function befuelleStammbaumAuswahl() {

  const z = stammbaumGroessen();
  const ids = Object.keys(stammbaeumeListe)
    .filter(id => z[id])
    .sort((a, b) => (z[b] || 0) - (z[a] || 0) || (stammbaeumeListe[a] || '').localeCompare(stammbaeumeListe[b] || ''));
  sel.innerHTML = ids.map(id =>

  ).join('');

// Wurzel eines Baums: Person ohne Eltern im selben Baum mit den meisten Nachkommen
function findeStammbaumWurzel(treeId) {
  const imBaum = id => { const p = aktuelleDaten.persons[id]; return p && p._tree === treeId; };
  const personen = Object.values(aktuelleDaten.persons).filter(p => p._tree === treeId);
  if (!personen.length) return null;
  const hatElternImBaum = p => (p.families_child || []).some(fid => {
    const fam = aktuelleDaten.families[fid]; if (!fam) return false;
    return (fam.husband && imBaum(fam.husband)) || (fam.wife && imBaum(fam.wife));
  });
  const kandidaten = personen.filter(p => !hatElternImBaum(p));
  const liste = kandidaten.length ? kandidaten : personen;
  function nachkommen(id, seen) {
    seen = seen || new Set(); if (seen.has(id)) return 0; seen.add(id);
    const p = aktuelleDaten.persons[id]; if (!p) return 0;
    let n = 0;
    (p.families_spouse || []).forEach(fid => {
      const fam = aktuelleDaten.families[fid]; if (!fam) return;
      (fam.children || []).forEach(cid => { if (imBaum(cid)) n += 1 + nachkommen(cid, seen); });
    });
    return n;
  }
  let best = liste[0], max = -1;
  liste.forEach(p => { const n = nachkommen(p.id); if (n > max) { max = n; best = p; } });
  return best.id;
}

// Einen Stammbaum auswählen und anzeigen
function waehleStammbaum(treeId) {
  if (!treeId) return;
  aktuellerStammbaumId = treeId;

  aktualisiereBaumHinweis();
}
