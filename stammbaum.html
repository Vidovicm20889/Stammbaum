function buildEventMediaHtml(media, eventId = null, showDelete = false, clickable = true) {
  // Ab mehr als 2 Dateien wird der Container scrollbar (siehe CSS)
  const scrollClass = media.length > 2 ? ' event-media-folder--scroll' : '';
  return `<div class="event-media-folder${scrollClass}">${media.map((m, idx) => {
    const istPdf = m.type === 'application/pdf' || /pdf/i.test(m.type);
    const thumb = m.type.startsWith('image/')
      ? `<img class="event-media-thumb" src="${m.url}" alt="${escapeHtml(m.name)}" />`
      : istPdf ? `<div class="event-media-thumb video-thumb">📄</div>`
      : `<div class="event-media-thumb video-thumb">🎥</div>`;
    const deleteBtn = showDelete && eventId ? `<button class="media-delete-btn" onclick="deleteEventMedia('${eventId}', ${idx})" title="${t('delete')}">×</button>` : '';
    // clickable=false (z.B. in der Edit-Maske über z-index:200) -> keine Slideshow, die sonst dahinter läge
    const istKlick = eventId && clickable;
    const klick = istKlick ? `zeigeMediaSlideshow('${eventId}', ${idx})` : 'return false;';
    return `<div class="event-media-item">${deleteBtn}<a href="javascript:void(0)" onclick="${klick}" style="cursor: ${istKlick ? 'pointer' : 'default'};">${thumb}<div class="event-media-info">${escapeHtml(m.name)}</div></a></div>`;
  }).join('')}</div>`;
}

async function deleteEventMedia(eventId, mediaIndex) {
  const eintrag = (letzteMedienListe[eventId] || [])[mediaIndex];
  if (!eintrag) return;

  const bestaetigt = await zeigeBestaetigung(t('confirm_delete'));
  if (!bestaetigt) return;

  // Datei SOFORT aus dem geteilten Storage löschen – damit für alle User wirksam
  const { error } = await sbClient.storage.from(EVENTS_BUCKET).remove([eintrag.path]);
  if (error) {
    console.error('Löschen fehlgeschlagen:', error);
    return;
  }
  console.log('Datei gelöscht:', eintrag.path);
  // Refresh kontextabhängig: neues Event-Modal offen -> dessen Liste; sonst alter Editor.
  if (document.getElementById('event-modal').classList.contains('aktiv')) {
    ladeEventMedienListe(eventId);
  } else if (document.getElementById('modal').classList.contains('aktiv') &&
             (eventsCache || []).some(e => e.id === eventId)) {
    zeigeEventDetail(eventId);   // Detailansicht eines DB-Events
  } else {
    zeigeEventEditor(eventId);   // altes Event-System
  }
}

async function zeigeMediaSlideshow(eventId, startIndex = 0) {
  const media = await renderEventMedia(eventId);
  if (media.length === 0) return;

  // Titel + Zurück-Ziel je nach Event-Quelle (DB-Event vs. altes statisches Event)
  const dbEv = (eventsCache || []).find(e => e.id === eventId);
  const titel = dbEv ? (dbEv.titel || '') : ((getEventConfig(eventId) || {}).title || '');
  const zurueckCall = dbEv ? `zeigeEventDetail('${eventId}')` : `zeigeShort('${eventId}')`;
  let currentIndex = startIndex;
  
  const updateSlideshow = () => {
    const m = media[currentIndex];
    const isImage = m.type.startsWith('image/');
    const istPdf  = m.type === 'application/pdf' || /pdf/i.test(m.type);
    const content = isImage
      ? `<img src="${m.url}" alt="${escapeHtml(m.name)}" style="max-width: 90vw; max-height: 70vh; object-fit: contain;" />`
      : istPdf
      ? `<iframe src="${m.url}" style="width: 90vw; height: 70vh; border: none; background: #fff;"></iframe>`
      : `<video style="max-width: 90vw; max-height: 70vh;" controls><source src="${m.url}" type="${m.type}">Browser nicht unterstützt</video>`;
    
    const navHtml = media.length > 1 ? `
      <div class="slideshow-nav">
        <button onclick="window.slideshowUpdate(${Math.max(0, currentIndex - 1)})" ${currentIndex === 0 ? 'disabled' : ''}>← ${t('prev') || 'Zurück'}</button>
        <span>${currentIndex + 1} / ${media.length}</span>
        <button onclick="window.slideshowUpdate(${Math.min(media.length - 1, currentIndex + 1)})" ${currentIndex === media.length - 1 ? 'disabled' : ''}>${t('next') || 'Weiter'} →</button>
      </div>
    ` : '';
    
    document.getElementById('modal-text').innerHTML = `
      <h2>${escapeHtml(nm(titel))}</h2>
      <div style="text-align: center; margin: 20px 0;">${content}</div>
      <div style="text-align: center; color: #666; margin: 10px 0;">${escapeHtml(m.name)}</div>
      ${navHtml}
      <div style="text-align: center; margin-top: 20px;">
        <button class="zurueck-btn" onclick="${zurueckCall}">${t('event_cancel')}</button>
      </div>
    `;
  };
  
  window.slideshowUpdate = (newIndex) => {
    if (newIndex >= 0 && newIndex < media.length) {
      currentIndex = newIndex;
      updateSlideshow();
    }
  };
  
  updateSlideshow();
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// DETAIL-FENSTER
// ============================================================
function zeigeDetails(personId) {
  if (document.getElementById('modal').classList.contains('aktiv') && aktuelleModalPersonId) {
    modalVerlauf.push(aktuelleModalPersonId);
  }
  aktuelleModalPersonId = personId;
  const p = aktuelleDaten.persons[personId];
  if (!p) return;
  
  // Gleiche reale Person über Bäume: Beziehungen aller Zwillingskarten zusammenführen,
  // damit die Detail-Karte überall dieselben Eltern/Kinder/Partner zeigt (entdoppelt).
  const gpTwins = p._ident
    ? Object.values(aktuelleDaten.persons).filter(q => q._ident === p._ident)
    : [p];
  const gpTwinIds = new Set(gpTwins.map(q => q.id));
  const persKey  = (q) => q._ident ? 'grp:' + q._ident : 'pn:' + ((q.given || '') + '|' + (q.surname || '') + '|' + (q.birth_date || '')).toLowerCase();
  const vornKey  = (q) => q._ident ? 'grp:' + q._ident : 'gn:' + (q.given || '').trim().toLowerCase();

  const eltern = []; const elternSeen = new Set();
  const geschwister = []; const geschSeen = new Set();
  gpTwins.forEach(tw => (tw.families_child || []).forEach(famId => {
    const fam = aktuelleDaten.families[famId]; if (!fam) return;
    [fam.husband, fam.wife].forEach(pid => {
      const e = pid && aktuelleDaten.persons[pid];
      if (e && !elternSeen.has(persKey(e))) { elternSeen.add(persKey(e)); eltern.push(e); }
    });
    (fam.children || []).forEach(cid => {
      const c = aktuelleDaten.persons[cid];
      if (c && !gpTwinIds.has(cid) && !geschSeen.has(vornKey(c))) { geschSeen.add(vornKey(c)); geschwister.push(c); }
    });
  }));

  // Ehen über alle Zwillinge, nach Partner gruppiert, Kinder GLOBAL entdoppelt
  const eheFamilien = []; const ehePartnerIdx = new Map(); const eheKinderGlobal = new Set();
  const ohnePartnerKinder = []; let hauptIdx = -1;
  gpTwins.forEach(tw => (tw.families_spouse || []).forEach(famId => {
    const fam = aktuelleDaten.families[famId]; if (!fam) return;
    const partnerId = fam.husband === tw.id ? fam.wife : fam.husband;
    const partner = partnerId ? aktuelleDaten.persons[partnerId] : null;
    let bucket;
    if (partner) {
      const pk = vornKey(partner);
      if (!ehePartnerIdx.has(pk)) { eheFamilien.push({ partner, kinder: [] }); ehePartnerIdx.set(pk, eheFamilien.length - 1); if (hauptIdx < 0) hauptIdx = eheFamilien.length - 1; }
      bucket = eheFamilien[ehePartnerIdx.get(pk)].kinder;
    } else bucket = ohnePartnerKinder;
    (fam.children || []).forEach(cid => {
      const c = aktuelleDaten.persons[cid]; if (!c) return;
      if (eheKinderGlobal.has(vornKey(c))) return; eheKinderGlobal.add(vornKey(c));
      bucket.push(c);
    });
  }));
  if (ohnePartnerKinder.length) {
    if (hauptIdx >= 0) eheFamilien[hauptIdx].kinder.push(...ohnePartnerKinder);

      : '';

  const eheHtml = eheBloecke.map((ef, i) => {
    const ptitel = eheFamilien.length > 1 ? `${t('partner')} ${i + 1}` : t('partner');
    const partnerHtml = ef.partner ? relChip(ef.partner, 'partner') : '';
    const kinderHtml = ef.kinder.length ? buildVerwandte(ef.kinder, 'kind') : '';

            <div class="beziehungen"><h3>${t('kinder')} ${addBtn('kind')}</h3>${kinderHtml}</div>`;

  document.getElementById('modal-text').innerHTML = `
    ${modalVerlauf.length > 0 ? `<button class="zurueck-btn" onclick="geheZurueck()">← ${t('zurueck')}</button>` : ''}
    <h2>${escapeHtml(nm(p.given || '?'))}</h2>
    <p class="sub-name">${escapeHtml(nm(p.surname || ''))}</p>
    ${p.ehename ? `<div class="info-zeile"><strong>${t('pe_ehename')}:</strong> ${escapeHtml(nm(p.ehename))}</div>` : ''}

    ${p.birth_date ? `<div class="info-zeile"><strong>${t('geboren')}</strong> ${escapeHtml(formatDatumLang(p.birth_date))}</div>` : ''}
    ${p.birth_place ? `<div class="info-zeile"><strong>${t('geburtsort')}</strong> ${escapeHtml(uebersetzeOrt(p.birth_place))}</div>` : ''}
    ${p.deceased || p.death_date ? `<div class="info-zeile"><strong>${t('verstorben')}</strong> ${escapeHtml(formatDatumLang(p.death_date) || t('ja'))}</div>` : ''}
    ${p.death_place ? `<div class="info-zeile"><strong>${t('sterbeort')}</strong> ${escapeHtml(uebersetzeOrt(p.death_place))}</div>` : ''}
    <div class="info-zeile"><strong>${t('geschlecht')}</strong> ${geschlechtText}</div>
    ${istAdmin() ? `<div class="info-zeile" style="color:#8a7a5a">${p._hatKonto ? '🔗' : '🔓 ' + escapeHtml(t('kein_konto'))}</div>` : ''}
    ${p.geburtsland ? `<div class="info-zeile"><strong>${t('reg_geburtsland')}:</strong> ${escapeHtml(landAnzeige(p.geburtsland))}</div>` : ''}
    ${p.stadt ? `<div class="info-zeile"><strong>${t('fe_grad')}:</strong> ${escapeHtml(uebersetzeOrt(p.stadt))}</div>` : ''}
    ${p.gemeinde ? `<div class="info-zeile"><strong>${t('fe_opstina')}:</strong> ${escapeHtml(uebersetzeOrt(p.gemeinde))}</div>` : ''}
    ${p.getauft ? `<div class="info-zeile"><strong>${t('reg_getauft')}:</strong> ${escapeHtml(formatDatumLang(p.getauft))}</div>` : ''}
    ${(p.beziehung && p.beziehung !== 'unbekannt') ? `<div class="info-zeile"><strong>${t('pe_beziehung')}:</strong> ${escapeHtml(p.beziehung === 'sonstige' ? (p.beziehung_sonstige || t('bz_sonstige')) : t('bz_' + p.beziehung))}</div>` : ''}
    ${(p.hochzeit_standesamt || p.hochzeit_kirchlich || p.hochzeitsort) ? `<div class="info-zeile"><strong>${t('pe_hochzeit_standesamt')}:</strong> ${escapeHtml([formatDatumLang(p.hochzeit_standesamt), formatDatumLang(p.hochzeit_kirchlich), p.hochzeitsort].filter(Boolean).join(' · '))}</div>` : ''}

    ${istAdmin() ? `<button class="baum-zeigen" style="margin-left:10px" onclick="zeigePersonBearbeiten('${p.id}')">${t('event_edit')}</button>` : ''}
    ${istAdmin() ? `<button class="baum-zeigen" style="margin-left:10px" onclick="oeffneMoveBaum('${p.id}')">↪ ${t('move_karte_btn')}</button>` : ''}
    ${istAdmin() ? `
      <div class="pa-aktionen">

  // P3: Stand dieser Person merken, um Live-Änderungen anderer zu erkennen.

// ============================================================
// GLEICHE PERSON ÜBER BÄUME (logische Verknüpfung)
// Karten mit gleicher _ident = dieselbe reale Person (in mehreren Bäumen).
// ============================================================
// Zwillingskarten (gleiche reale Person, andere Karte) der Person p.
function findeZwillinge(p) {
  if (!p || !p._ident) return [];
  const out = [];
  Object.values(aktuelleDaten.persons).forEach(q => {
    if (q._uuid && q._uuid !== p._uuid && q._ident === p._ident) {
      out.push({ extId: q.id, uuid: q._uuid, name: q.name || q.given || '', treeId: q._tree,
                 treeName: (q._tree && stammbaeumeListe[q._tree]) ? baumLabel(q._tree) : '' });
    }
  });
  return out;
}

// Detail-Block: "auch in Baum X" (Navigation) + (Super-Admin) Verknüpfung lösen.
function gpTwinHtml(p) {
  const tw = findeZwillinge(p);
  if (!tw.length) return '';
  const zeilen = tw.map(z =>
    `<div class="gp-zwilling">
       <span class="verwandter" onclick="springeZuBaumPerson('${z.extId}')">${escapeHtml(nm(z.name))}${z.treeName ? ' — ' + escapeHtml(nm(z.treeName)) : ''}</span>
       ${istSuperAdmin() ? `<button class="gp-loesen" type="button" title="${escapeHtml(t('gp_loesen'))}" onclick="personUnlink('${z.uuid}')">✕</button>` : ''}
     </div>`).join('');
  return `<div class="beziehungen"><h3>↔ ${t('gp_auch_in')}</h3>${zeilen}</div>`;
}

// In den Baum der Zwillingskarte springen und sie fokussieren.
function springeZuBaumPerson(extId) {
  const q = aktuelleDaten.persons[extId];
  if (!q) return;
  schliesseModal();
  if (q._tree) {
    aktuellerStammbaumId = q._tree;
    const sel = document.getElementById('tree-select'); if (sel) sel.value = q._tree;
    aktualisiereKopf(); aktualisiereBaumHinweis();
  }
  fokusPersonId = extId;
  const suche = document.getElementById('suche'); if (suche) suche.value = '';
  zeichneBaum(extId, 2, 2);
}

// ============================================================
// PERSON IN ANDEREN STAMMBAUM VERSCHIEBEN (Admin)
// Eine Karte kann im FALSCHEN Stammbaum liegen (taucht dann z. B. in der „Lose Karten"-
// Leiste auf). Hier wählt der Admin den Ziel-Stammbaum; die RPC person_baum_verschieben
// (supabase_person_baum_verschieben.sql) setzt stammbaum_id + familie_id neu. Der aktuell
// geöffnete Baum wird NICHT gewechselt (CLAUDE.md); nach Erfolg wird neu geladen.
// ============================================================
let moveExtId = null;

// Stammbäume, in die der aktuelle Nutzer verschieben DARF (eigene/verwaltete im Verbund;
// Super-Admin alle). Aktueller Baum der Person ausgenommen. -> [{ id, label }]
function verschiebbareZielBaeume(aktuellerTreeId) {
  const out = [];
  const superA = (typeof istSuperAdmin === 'function') && istSuperAdmin();
  Object.keys(stammbaeumeListe).forEach(tid => {
    if (tid === aktuellerTreeId) return;
    if (!superA) {
      const fam = stammbaumZuFamilie[tid];
      const rolle = fam ? normalizeRolle(meineRollenProFamilie[fam] || '') : '';
      if (!['familien_owner', 'familien_admin', 'super_admin'].includes(rolle)) return;
    }
    out.push({ id: tid, label: baumLabel(tid) });
  });
  out.sort((a, b) => a.label.localeCompare(b.label));
  return out;
}

async function oeffneMoveBaum(ext) {
  if (!istAdmin()) return;
  const p = aktuelleDaten.persons[ext];
  if (!p || !p._uuid) return;
  // Warnung, falls die Person Beziehungen hat (Verwandte ziehen NICHT mit -> sie würde im
  // Ziel-Baum zunächst lose erscheinen). Für lose Karten (keine Kanten) entfällt die Frage.
  const hatKanten = (p.families_child || []).length || (p.families_spouse || []).length;
  if (hatKanten) {
    const ok = await zeigeBestaetigung(t('move_warnung_kanten'));
    if (!ok) return;
  }
  const ziele = verschiebbareZielBaeume(p._tree);
  if (!ziele.length) { await zeigeHinweis(t('move_keine_ziele')); return; }
  moveExtId = ext;
  document.getElementById('move-person').textContent =
    nm(p.name || p.given || '?') + (p._tree && stammbaeumeListe[p._tree] ? ' — ' + baumLabel(p._tree) : '');
  const sel = document.getElementById('move-ziel');
  sel.innerHTML = ziele.map(z => `<option value="${escapeHtml(z.id)}">${escapeHtml(z.label)}</option>`).join('');
  document.getElementById('move-fehler').style.display = 'none';
  const modal = document.getElementById('move-modal');
  modal.classList.add('aktiv');
  macheAlleSelectsSuchbar(modal);   // searchable Dropdown (touch-sicher)
}

function schliesseMoveBaum() {
  document.getElementById('move-modal').classList.remove('aktiv');
  moveExtId = null;
}

async function moveBaumBestaetigen() {
  if (!moveExtId) return;
  const p = aktuelleDaten.persons[moveExtId];
  const ziel = document.getElementById('move-ziel').value;
  const fehlerEl = document.getElementById('move-fehler');
  fehlerEl.style.display = 'none';
  if (!p || !p._uuid || !ziel) { fehlerEl.textContent = t('reg_fehler'); fehlerEl.style.display = 'block'; return; }
  const btn = document.getElementById('move-submit');
  const altText = btn.textContent; btn.disabled = true; btn.textContent = t('reg_senden_laeuft');
  const { data, error } = await sbClient.rpc('person_baum_verschieben', { p_person: p._uuid, p_ziel_baum: ziel });
  btn.disabled = false; btn.textContent = altText;
  if (error || !data || !data.ok) {
    const msg = (error && error.message) || '';
    let txt = t('reg_fehler') + msg;
    if (/ziel_hat_zwilling/.test(msg)) txt = t('move_fehler_zwilling');
    else if (/keine_berechtigung/.test(msg)) txt = t('move_fehler_recht');
    fehlerEl.textContent = txt; fehlerEl.style.display = 'block'; return;
  }
  schliesseMoveBaum();
  schliesseModal();
  await reloadBaumBehalteFokus(null);   // neu laden -> Karte verlässt den aktuellen Baum, Lose-Leiste aktualisiert sich
  await zeigeHinweis(t('move_erfolg'));
}

// ----- Overlay "Gleiche Person verknüpfen" (Super-Admin), analog zu "Bäume verbinden" -----
let gpDiff = [];                                            // Feld-Diff der zwei gewählten Karten
let gpPairA = null, gpPairB = null, gpRest = [];           // aktuelles Paar (+ weitere Karten der Gruppe)
let gpSameTree = false;                                     // true = beide Karten im selben Baum -> Merge (eine bleibt) statt Spiegel-Verknüpfung
const GP_NAME_FELDER = ['name'];   // nur das abgeleitete Feld 'name' ausblenden (wird aus given+surname gebildet)

function zeigeGleichePersonModal() {
  if (!istSuperAdmin()) return;
  const menu = document.getElementById('nav-menu'); if (menu) menu.classList.remove('offen');
  document.getElementById('gp-modal-erfolg').style.display = 'none';

function schliesseGleichePersonModal() { document.getElementById('gp-modal').classList.remove('aktiv'); }

// Hinweis: noch nicht verknüpfte Dubletten (gleicher Name + Geburtsdatum über Bäume)
let gpDubGruppen = [];
async function gpLadeDubletten() {
  const box = document.getElementById('gp-dubletten'); if (!box) return;
  box.innerHTML = '';
  const a = document.getElementById('gp-baum-a').value;
  const b = document.getElementById('gp-baum-b').value;
  if (!a || !b || a === b) return;   // erst vergleichen, wenn zwei verschiedene Bäume gewählt sind
  const { data, error } = await sbClient.rpc('offene_dubletten', { p_baum_a: a, p_baum_b: b });
  if (error) return;
  gpDubGruppen = data || [];
  if (!gpDubGruppen.length) { box.innerHTML = `<p class="mv-legende">${t('gp_keine_dubletten')}</p>`; return; }
  box.innerHTML = `<div class="reg-gruppe-titel">${t('gp_dub_titel')}</div>` +
    gpDubGruppen.map((g, i) => `<div class="gp-kand">
      <label style="display:flex;gap:8px;align-items:center;flex:1;cursor:pointer">
        <input type="checkbox" class="gp-dub-cb" data-i="${i}">
        <span>${escapeHtml(nm(g.person || ''))}${g.geboren ? ` (* ${escapeHtml(formatDatumLang(g.geboren) || g.geboren)})` : ''} — ${escapeHtml(nm(g.baeume || ''))} · ${g.anzahl}×</span>
      </label>
      <button class="mv-toggle" type="button" onclick="gpLinkGruppe(${i})">${escapeHtml(t('gp_einzeln'))}</button>
    </div>`).join('') +
    `<button class="login-submit" type="button" style="margin-top:10px" onclick="gpVerknuepfeAusgewaehlte()">${escapeHtml(t('gp_alle_verknuepfen'))}</button>`;
}
// Mehrere Gruppen ankreuzen -> mit EINEM Klick alle verknüpfen (Auto-Angleich: vollständigste gewinnt).
async function gpVerknuepfeAusgewaehlte() {
  const cbs = [...document.querySelectorAll('.gp-dub-cb:checked')];
  if (!cbs.length) { await zeigeHinweis(t('merge_keine_auswahl')); return; }
  for (const cb of cbs) {
    const g = gpDubGruppen[+cb.dataset.i];
    if (!g || !g.ids || g.ids.length < 2) continue;
    for (let k = 1; k < g.ids.length; k++) {
      const { error } = await sbClient.rpc('personen_verknuepfen', { p_a: g.ids[0], p_b: g.ids[k], p_aufloesung: {} });
      if (error) { await zeigeHinweis(t('reg_fehler') + error.message); return; }
    }
  }
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  await gpLadeDubletten();
  const erfolg = document.getElementById('gp-modal-erfolg');
  erfolg.textContent = t('gp_verknuepft_weiter'); erfolg.style.display = 'block';
}
// Hinweis-Gruppe -> Konflikt-Abfrage für die ersten zwei Karten (Rest wird mit derselben
// Auflösung angehängt). So wirst du auch bei den Kindern gefragt, welche Daten korrekt sind.
async function gpLinkGruppe(i) {
  const g = gpDubGruppen[i];
  if (!g || !g.ids || g.ids.length < 2) return;
  gpSameTree = false;   // Auto-Dubletten sind immer baumübergreifend -> Spiegel-Verknüpfung
  await gpStartKonflikt(g.ids[0], g.ids[1], g.ids.slice(2));
}
function gpZeigeSchritt(n) {
  document.getElementById('gp-step1').style.display = (n === 1) ? '' : 'none';
  document.getElementById('gp-step2').style.display = (n === 2) ? '' : 'none';
}

// Schritt 1 -> Feld-Diff der zwei Karten laden, Konflikte zeigen (analog Baum zusammenlegen)
// Konflikt-Schritt für ein Paar starten (+ optional weitere Karten der Gruppe = Auto-Angleich danach)
async function gpStartKonflikt(a, b, rest) {
  const fehler = document.getElementById('gp-modal-fehler'); fehler.style.display = 'none';
  document.getElementById('gp-modal-erfolg').style.display = 'none';
  const { data: diff, error } = await sbClient.rpc('personen_feld_diff', { p_a: a, p_b: b });
  if (error) { fehler.textContent = t('reg_fehler') + error.message; fehler.style.display = 'block'; return; }
  gpPairA = a; gpPairB = b; gpRest = rest || [];
  gpDiff = (diff || []).filter(d => !GP_NAME_FELDER.includes(d.feld));   // 'name' ausblenden (abgeleitet)
  gpRenderKonflikte();
  gpRenderAuto();
  gpZeigeSchritt(2);
}
function gpRenderKonflikte() {
  const box = document.getElementById('gp-konflikte');
  const konf = gpDiff.filter(d => d.status === 'konflikt');
  if (!konf.length) { box.innerHTML = `<p class="mv-legende">${t('gp_keine_konflikte')}</p>`; return; }
  let html = `<div class="reg-gruppe-titel">${t('merge_konflikt_titel')}</div>`;
  konf.forEach(d => {
    const f = d.feld;
    html += `<div class="mg-konflikt">
      <div class="mg-feld">${escapeHtml(mgFeldLabel(f))}</div>
      <div class="mg-opt"><label><input type="radio" name="gp-k-${f}" value="a" checked> ${t('merge_wert_a')}: ${escapeHtml(mgWertAnzeige(f, d.wert_a))}</label></div>
      <div class="mg-opt"><label><input type="radio" name="gp-k-${f}" value="b"> ${t('merge_wert_b')}: ${escapeHtml(mgWertAnzeige(f, d.wert_b))}</label></div>
      <div class="mg-opt"><label><input type="radio" name="gp-k-${f}" value="m"> ${t('merge_manuell')}</label>
        <input type="text" class="login-feld gp-man" data-feld="${f}" value="${escapeHtml(d.wert_a || '')}"></div>
    </div>`;
  });
  box.innerHTML = html;
}
function gpRenderAuto() {
  const box = document.getElementById('gp-auto');
  const auto = gpDiff.filter(d => d.status !== 'konflikt');
  if (!auto.length) { box.innerHTML = ''; return; }
  let html = `<div class="reg-gruppe-titel">${t('merge_auto_titel')}</div>`;
  auto.forEach(d => {
    const wert = d.status === 'nur_b' ? d.wert_b : d.wert_a;
    html += `<div class="mg-auto-row"><b>${escapeHtml(mgFeldLabel(d.feld))}:</b> ${escapeHtml(mgWertAnzeige(d.feld, wert))}</div>`;
  });
  box.innerHTML = html;
}

function gpFuelleBaeume() {

async function gpModalVerknuepfen() {
  const fehler = document.getElementById('gp-modal-fehler2'); fehler.style.display = 'none';
  const a = gpPairA, b = gpPairB;
  if (!a || !b) { fehler.textContent = t('merge_baeume_waehlen'); fehler.style.display = 'block'; return; }

  // Konfliktauflösung sammeln (gewählter Endwert je Konfliktfeld)
  const aufloesung = {};
  gpDiff.filter(d => d.status === 'konflikt').forEach(d => {
    const f = d.feld;
    const sel = document.querySelector(`input[name="gp-k-${f}"]:checked`);
    const wahl = sel ? sel.value : 'a';
    if (wahl === 'a') aufloesung[f] = d.wert_a || '';
    else if (wahl === 'b') aufloesung[f] = d.wert_b || '';
    else { const man = document.querySelector(`.gp-man[data-feld="${f}"]`); aufloesung[f] = man ? man.value.trim() : ''; }
  });

  if (gpSameTree) {
    // Gleicher Baum: ZUSAMMENFÜHREN (eine Karte bleibt). Survivor = vollständigere Karte
    // (mehr nur_x-Felder); Beziehungen/Konto wandern auf sie, die Dublette wird gelöscht.
    const nurA = gpDiff.filter(d => d.status === 'nur_a').length;
    const nurB = gpDiff.filter(d => d.status === 'nur_b').length;
    const behalten = (nurB > nurA) ? b : a;
    const dublette = (nurB > nurA) ? a : b;
    const { error } = await sbClient.rpc('person_merge_aufgeloest',
      { p_behalten: behalten, p_dublette: dublette, p_aufloesung: aufloesung });
    if (error) {
      fehler.textContent = (error.message && error.message.includes('merge_zwillinge'))
        ? t('merge_zwillinge') : t('reg_fehler') + error.message;
      fehler.style.display = 'block'; return;
    }
  } else {
    const { error } = await sbClient.rpc('personen_verknuepfen', { p_a: a, p_b: b, p_aufloesung: aufloesung });
    if (error) { fehler.textContent = t('reg_fehler') + error.message; fehler.style.display = 'block'; return; }
    // Weitere Karten derselben Gruppe (z. B. >2 Bäume) mit der gewählten Auflösung anhängen
    for (const id of (gpRest || [])) {
      const { error: e2 } = await sbClient.rpc('personen_verknuepfen', { p_a: a, p_b: id, p_aufloesung: aufloesung });
      if (e2) { fehler.textContent = t('reg_fehler') + e2.message; fehler.style.display = 'block'; return; }
    }
  }
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
  const warSelberBaum = gpSameTree;
  gpPairA = gpPairB = null; gpRest = []; gpSameTree = false;
  gpZeigeSchritt(1);
  gpFuelleBaeume();    // Suchfelder oben leeren -> direkt weitere Personen verknüpfen/mergen
  gpLadeDubletten();   // Hinweis-Liste aktualisieren
  const erfolg = document.getElementById('gp-modal-erfolg');
  erfolg.textContent = warSelberBaum ? t('merge_fertig') : t('gp_verknuepft_weiter');
  erfolg.style.display = 'block';
}

// ============================================================
// FOTO-GALERIE pro Person (Tabelle personen_fotos + Bucket 'personen-fotos').
// Baut auf dem bestehenden Medien-Upload (feMediaUpload) + der Avatar-Canvas-
// Kompression auf. Read-only in der Detailkarte (#detail-galerie, alle Nutzer),
// Verwaltung im Editor (#pe-galerie, nur Bearbeiter — istAdmin/RLS).
// Hauptbild wird zusätzlich als Karten-Avatar in stammbaum_daten.foto gespiegelt,
// damit Baum-Karten/PDF-Export es ohne weitere Änderung anzeigen.
// ============================================================
const FOTO_BUCKET = 'personen-fotos';
let galerieFotos = [];   // aktuell geladene Fotos (gemeinsam für Editor & Lightbox)
let galerieCtx   = null; // { personUuid, personExt, stammbaumId, familieId, editierbar }
let galerieDrag  = null; // Pointer-Drag-Zustand (touch-sicher)
let lightboxIdx  = 0;

// Öffentliche URL eines Galerie-Pfades (public Bucket -> stabile URL, kein Ablauf)
function fotoUrl(pfad) {
  if (!pfad) return '';
  return sbClient.storage.from(FOTO_BUCKET).getPublicUrl(pfad).data.publicUrl;
}

// Fotos einer Person aus der DB laden, sortiert (sortierung, dann Anlagezeit).
async function ladePersonFotos(personUuid) {
  if (!personUuid) return [];
  const { data, error } = await sbClient.from('personen_fotos')
    .select('id, person_id, storage_pfad, beschriftung, ist_hauptbild, aufnahme_datum, sortierung')
    .eq('person_id', personUuid)
    .order('sortierung', { ascending: true })
    .order('erstellt_am', { ascending: true });
  if (error) { console.warn('Galerie laden:', error); return []; }
  return (data || []).map(r => ({ ...r, _url: fotoUrl(r.storage_pfad) }));
}

// Clientseitige Kompression: Seitenverhältnis erhalten, längste Kante begrenzen,
// WEBP (Fallback JPEG) — analog Avatar-Verarbeitung, aber ohne Quadrat-Zuschnitt.
function galerieKomprimiere(file, maxKante = 1600, q = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const skala = Math.min(1, maxKante / Math.max(w, h));
      w = Math.round(w * skala); h = Math.round(h * skala);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => { if (b) resolve(b);
        else c.toBlob(b2 => b2 ? resolve(b2) : reject(new Error('toBlob null')), 'image/jpeg', q); },
        'image/webp', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild laden fehlgeschlagen')); };
    img.src = url;
  });
}

function galerieFehler(msg) {
  const el = document.getElementById('pe-fehler');

// Hauptbild-URL als Karten-Avatar in stammbaum_daten.foto schreiben (oder löschen).
// Aktualisiert In-Memory-Modell + zeichnet neu; hält den Optimistic-Lock-Stand des
// offenen Editors konsistent (sonst meldet das nächste Speichern fälschlich Konflikt).
async function setKarteFoto(ctx, url) {
  try {
    const { data: row, error } = await sbClient.from('personen')
      .select('stammbaum_daten').eq('id', ctx.personUuid).single();
    if (error) { console.warn('Karten-Foto lesen:', error); return; }
    const sd = row.stammbaum_daten || {};
    if (url) sd.foto = url; else delete sd.foto;
    const { error: uErr } = await sbClient.from('personen')
      .update({ stammbaum_daten: sd }).eq('id', ctx.personUuid);
    if (uErr) { console.warn('Karten-Foto schreiben:', uErr); return; }
    const p = aktuelleDaten && aktuelleDaten.persons && aktuelleDaten.persons[ctx.personExt];
    if (p) { if (url) p.foto = url; else delete p.foto; }
    const fresh = await sbClient.from('personen').select('updated_at').eq('id', ctx.personUuid).single();
    if (fresh.data && editWatchId === ctx.personExt) editBaselineUpdated = fresh.data.updated_at || editBaselineUpdated;
    if (typeof zeichneBaumNeu === 'function') zeichneBaumNeu();
  } catch (e) { console.warn('setKarteFoto:', e); }
}

function galerieEditRender() {

  if (!grid) return;
  if (!galerieFotos.length) { grid.innerHTML = `<div class="galerie-leer">${escapeHtml(t('gal_leer'))}</div>`; return; }
  grid.innerHTML = galerieFotos.map((f, i) => `
    <div class="gal-karte${f.ist_hauptbild ? ' ist-haupt' : ''}" data-id="${f.id}">
      ${f.ist_hauptbild ? `<span class="gal-haupt-badge">${escapeHtml(t('gal_hauptbild'))}</span>` : ''}
      <span class="gal-drag" title="${escapeHtml(t('gal_sortier_hilfe'))}" aria-label="${escapeHtml(t('gal_sortier_hilfe'))}"
            onpointerdown="galerieDragStart(event,'${f.id}')">⠿</span>
      <img class="gal-thumb" src="${escapeHtml(f._url)}" alt="" onclick="oeffneLightbox(${i})" onerror="this.style.visibility='hidden'">
      <input class="gal-cap" type="text" maxlength="200" value="${escapeHtml(f.beschriftung || '')}"
             placeholder="${escapeHtml(t('gal_beschriftung_ph'))}" onchange="galerieBeschriftung('${f.id}', this.value)">
      <div class="gal-aktionen">
        <button type="button" onclick="galerieHauptbild('${f.id}')" ${f.ist_hauptbild ? 'disabled' : ''}>★ ${escapeHtml(t('gal_hauptbild_setzen'))}</button>
        <button type="button" class="gal-del" title="${escapeHtml(t('gal_loeschen'))}" aria-label="${escapeHtml(t('gal_loeschen'))}" onclick="galerieLoeschen('${f.id}')">🗑</button>
      </div>
    </div>`).join('');
}

async function galerieUpload(input) {
  const files = Array.from(input.files || []);
  input.value = '';   // erlaubt erneutes Wählen derselben Datei
  if (!files.length || !galerieCtx || !galerieCtx.editierbar) return;
  if (!galerieCtx.stammbaumId || !galerieCtx.familieId) { galerieFehler(t('reg_fehler') + 'kein Baum/Familie'); return; }
  const fehlerEl = document.getElementById('pe-fehler'); if (fehlerEl) fehlerEl.style.display = 'none';
  const btn = document.getElementById('pe-foto-btn'); const altTxt = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = t('reg_senden_laeuft'); }
  const erlaubt = ['image/jpeg', 'image/png', 'image/webp'];
  let sort = galerieFotos.reduce((m, f) => Math.max(m, f.sortierung || 0), 0);
  try {
    for (const file of files) {
      if (!erlaubt.includes(file.type)) { galerieFehler(t('gal_typ_fehler')); continue; }
      if (file.size > 15 * 1024 * 1024) { galerieFehler(t('gal_gross_fehler')); continue; }
      let blob; try { blob = await galerieKomprimiere(file); } catch (e) { galerieFehler(t('gal_upload_fehler') + (e.message || e)); continue; }
      const ext = blob.type === 'image/jpeg' ? 'jpg' : 'webp';
      const uuid = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36).slice(2));
      const pfad = `${galerieCtx.stammbaumId}/${galerieCtx.personUuid}/${uuid}.${ext}`;
      const up = await sbClient.storage.from(FOTO_BUCKET).upload(pfad, blob, { cacheControl: '3600', contentType: blob.type, upsert: false });
      if (up.error) { galerieFehler(t('gal_upload_fehler') + up.error.message); continue; }
      sort += 10;
      const istErstes = galerieFotos.length === 0;   // erstes Foto -> automatisch Hauptbild
      const { data: row, error: insErr } = await sbClient.from('personen_fotos').insert({
        person_id: galerieCtx.personUuid, familie_id: galerieCtx.familieId, stammbaum_id: galerieCtx.stammbaumId,
        storage_pfad: pfad, beschriftung: '', ist_hauptbild: istErstes, sortierung: sort
      }).select('id, person_id, storage_pfad, beschriftung, ist_hauptbild, aufnahme_datum, sortierung').single();
      if (insErr) { try { await sbClient.storage.from(FOTO_BUCKET).remove([pfad]); } catch (e) {} galerieFehler(t('gal_upload_fehler') + insErr.message); continue; }
      galerieFotos.push({ ...row, _url: fotoUrl(row.storage_pfad) });
      if (istErstes) await setKarteFoto(galerieCtx, fotoUrl(pfad));
    }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = altTxt || t('gal_hochladen'); }
  }
  galerieEditRender();
}

async function galerieHauptbild(fotoId) {
  if (!galerieCtx || !galerieCtx.editierbar) return;
  const foto = galerieFotos.find(f => f.id === fotoId); if (!foto) return;
  // 1 Hauptbild je Person: erst alle aufheben, dann dieses setzen (partieller Unique-Index)
  let r = await sbClient.from('personen_fotos').update({ ist_hauptbild: false })
    .eq('person_id', galerieCtx.personUuid).eq('ist_hauptbild', true);
  if (r.error) { galerieFehler(t('reg_fehler') + r.error.message); return; }
  r = await sbClient.from('personen_fotos').update({ ist_hauptbild: true }).eq('id', fotoId);
  if (r.error) { galerieFehler(t('reg_fehler') + r.error.message); return; }
  galerieFotos.forEach(f => f.ist_hauptbild = (f.id === fotoId));
  await setKarteFoto(galerieCtx, foto._url);
  galerieEditRender();
}

async function galerieBeschriftung(fotoId, text) {
  if (!galerieCtx || !galerieCtx.editierbar) return;
  const wert = (text || '').trim();
  const { error } = await sbClient.from('personen_fotos').update({ beschriftung: wert }).eq('id', fotoId);
  if (error) { galerieFehler(t('reg_fehler') + error.message); return; }
  const f = galerieFotos.find(x => x.id === fotoId); if (f) f.beschriftung = wert;
}

async function galerieLoeschen(fotoId) {
  if (!galerieCtx || !galerieCtx.editierbar) return;
  const foto = galerieFotos.find(f => f.id === fotoId); if (!foto) return;
  if (!await zeigeBestaetigung(t('gal_loeschen_frage'), { gefahr: true })) return;
  const { error } = await sbClient.from('personen_fotos').delete().eq('id', fotoId);
  if (error) { galerieFehler(t('reg_fehler') + error.message); return; }
  try { await sbClient.storage.from(FOTO_BUCKET).remove([foto.storage_pfad]); } catch (e) { console.warn('Foto-Storage löschen:', e); }
  const warHaupt = foto.ist_hauptbild;
  galerieFotos = galerieFotos.filter(f => f.id !== fotoId);
  if (warHaupt) {   // Hauptbild gelöscht -> nächstes übernehmen, sonst Karten-Foto entfernen
    if (galerieFotos.length) {
      const next = galerieFotos[0];
      await sbClient.from('personen_fotos').update({ ist_hauptbild: true }).eq('id', next.id);
      next.ist_hauptbild = true;
      await setKarteFoto(galerieCtx, next._url);
    } else {
      await setKarteFoto(galerieCtx, '');
    }
  }
  galerieEditRender();
}

// --- Reihenfolge per Drag&Drop (Pointer-Events -> Maus UND Touch) ----------
function galerieDragStart(ev, fotoId) {
  if (!galerieCtx || !galerieCtx.editierbar) return;
  ev.preventDefault();
  const karte = ev.target.closest('.gal-karte');
  const grid  = document.getElementById('pe-galerie');
  if (!karte || !grid) return;
  galerieDrag = { id: fotoId };
  karte.classList.add('gal-ziehe');
  try { ev.target.setPointerCapture(ev.pointerId); } catch (e) {}
  window.addEventListener('pointermove', galerieDragMove);
  window.addEventListener('pointerup', galerieDragEnd);
  window.addEventListener('pointercancel', galerieDragEnd);
}
function galerieKarteUnter(x, y) {
  const el = document.elementFromPoint(x, y);
  const k = el ? el.closest('.gal-karte') : null;
  return (k && document.getElementById('pe-galerie').contains(k)) ? k : null;
}
function galerieDragMove(ev) {
  if (!galerieDrag) return;
  const ziel = galerieKarteUnter(ev.clientX, ev.clientY);
  document.querySelectorAll('#pe-galerie .gal-karte.gal-ziel').forEach(k => k.classList.remove('gal-ziel'));
  if (ziel && ziel.dataset.id !== galerieDrag.id) ziel.classList.add('gal-ziel');
}
async function galerieDragEnd(ev) {
  window.removeEventListener('pointermove', galerieDragMove);
  window.removeEventListener('pointerup', galerieDragEnd);
  window.removeEventListener('pointercancel', galerieDragEnd);
  if (!galerieDrag) return;
  const dragId = galerieDrag.id;
  const ziel = galerieKarteUnter(ev.clientX, ev.clientY);
  galerieDrag = null;
  document.querySelectorAll('#pe-galerie .gal-karte').forEach(k => { k.classList.remove('gal-ziehe'); k.classList.remove('gal-ziel'); });
  if (!ziel) return;
  const zielId = ziel.dataset.id;
  if (!zielId || zielId === dragId) return;
  const from = galerieFotos.findIndex(f => f.id === dragId);
  const to   = galerieFotos.findIndex(f => f.id === zielId);
  if (from < 0 || to < 0) return;
  const [moved] = galerieFotos.splice(from, 1);
  galerieFotos.splice(to, 0, moved);
  galerieEditRender();
  await galerieReihenfolgeSpeichern();
}
async function galerieReihenfolgeSpeichern() {
  const updates = [];
  galerieFotos.forEach((f, i) => { const neu = (i + 1) * 10; if (f.sortierung !== neu) { f.sortierung = neu; updates.push(f); } });
  for (const f of updates) {
    const { error } = await sbClient.from('personen_fotos').update({ sortierung: f.sortierung }).eq('id', f.id);
    if (error) { console.warn('Reihenfolge speichern:', error); break; }
  }
}

// --- Read-only-Galerie in der Detailkarte (alle Nutzer) --------------------
async function galerieDetailRender(p) {
  const host = document.getElementById('detail-galerie');
  if (!host || !p || !p._uuid) return;
  galerieCtx = { personUuid: p._uuid, personExt: p.id, stammbaumId: p._tree || null,
                 familieId: stammbaumZuFamilie[p._tree] || null, editierbar: false };
  galerieFotos = await ladePersonFotos(p._uuid);
  if (aktuelleModalPersonId !== p.id) return;   // Modal inzwischen gewechselt -> nicht überschreiben

  host.innerHTML = `
    <div class="beziehungen"><h3>${escapeHtml(t('gal_titel'))}</h3>
      <div class="galerie-grid">
        ${galerieFotos.map((f, i) => `
          <div class="gal-karte${f.ist_hauptbild ? ' ist-haupt' : ''}">
            ${f.ist_hauptbild ? `<span class="gal-haupt-badge">${escapeHtml(t('gal_hauptbild'))}</span>` : ''}
            <img class="gal-thumb" src="${escapeHtml(f._url)}" alt="" onclick="oeffneLightbox(${i})" onerror="this.style.visibility='hidden'">
            ${f.beschriftung ? `<div class="gal-cap-view">${escapeHtml(f.beschriftung)}</div>` : ''}
          </div>`).join('')}
      </div>

// Storage-Dateien aller Fotos der gegebenen Personen entfernen (keine Waisen beim
// Personen-Löschen; die DB-Zeilen verschwinden per ON DELETE CASCADE).
async function galerieLoescheFuerPersonen(uuids) {
  if (!uuids || !uuids.length) return;
  try {
    const { data } = await sbClient.from('personen_fotos').select('storage_pfad').in('person_id', uuids);

// --- Lightbox (Vollbild) ---------------------------------------------------
function oeffneLightbox(idx) {
  if (!galerieFotos.length) return;
  lightboxIdx = Math.max(0, Math.min(idx, galerieFotos.length - 1));
  lightboxRender();
  document.getElementById('foto-lightbox').classList.add('aktiv');
}
function lightboxRender() {
  const f = galerieFotos[lightboxIdx]; if (!f) return;
  document.getElementById('lightbox-img').src = f._url;
  const datum = f.aufnahme_datum ? formatDatumLang(f.aufnahme_datum) : '';
  document.getElementById('lightbox-cap').innerHTML =
    `${escapeHtml(f.beschriftung || '')}${datum ? `<span class="lb-datum">${escapeHtml(datum)}</span>` : ''}`;
  const mehr = galerieFotos.length > 1;
  document.querySelector('#foto-lightbox .lb-prev').style.display = mehr ? '' : 'none';
  document.querySelector('#foto-lightbox .lb-next').style.display = mehr ? '' : 'none';
  document.getElementById('lightbox-zaehler').textContent = mehr ? `${lightboxIdx + 1} / ${galerieFotos.length}` : '';
}
function lightboxNav(d) {
  if (!galerieFotos.length) return;
  lightboxIdx = (lightboxIdx + d + galerieFotos.length) % galerieFotos.length;
  lightboxRender();
}
function schliesseLightbox() { document.getElementById('foto-lightbox').classList.remove('aktiv'); }

// Sprachwechsel: offene Galerie-Grids (Editor/Detail) mit neuen t()-Labels neu rendern.
function galerieSpracheUpdate() {
  const edit = document.getElementById('person-edit-modal');
  if (edit && edit.classList.contains('aktiv') && galerieCtx && galerieCtx.editierbar) galerieEditRender();
  const host  = document.getElementById('detail-galerie');
  const modal = document.getElementById('modal');
  if (modal && modal.classList.contains('aktiv') && host && host.innerHTML.trim()) {
    const p = aktuelleDaten && aktuelleDaten.persons && aktuelleDaten.persons[aktuelleModalPersonId];
    if (p) galerieDetailRender(p);
  }
}
// Tastatur: Esc schließt, Pfeile navigieren (nur wenn Lightbox offen).
document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('foto-lightbox');
  if (!lb || !lb.classList.contains('aktiv')) return;
  if (e.key === 'Escape') schliesseLightbox();
  else if (e.key === 'ArrowLeft') lightboxNav(-1);
  else if (e.key === 'ArrowRight') lightboxNav(1);
});

// ============================================================
// MEHRSPRACHIGE LEBENSGESCHICHTEN pro Person (Tabelle personen_geschichten).
// Erweitert das einfache Biografie-/Notiz-Feld (stammbaum_daten.beschreibung,
// dessen Verhalten/Sync unverändert bleibt) um strukturierte, mehrsprachige
// Geschichten mit Markdown. Verwaltung im Editor (#pe-geschichte, nur Bearbeiter),
// read-only-Anzeige in der Detailkarte (#detail-geschichte, alle Nutzer) in der
// aktuellen App-Sprache mit Fallback-Hinweis. Identitäts-Sync (Zwillinge) erfolgt
// serverseitig im Trigger geschichte_ident_sync — analog zum beschreibung-Feld.
// ============================================================
const GESCH_SPRACHEN = ['de', 'sr', 'hr', 'ba', 'en'];
let geschCtx    = null;   // { personUuid, personExt, stammbaumId, familieId }
let geschDaten  = {};     // sprache -> { id, sprache, titel, text, veroeffentlicht, _exists, _dirty }
let geschAktiv  = 'de';   // aktuell bearbeitete Sprache (Tab)

// --- Markdown -> sicheres HTML ---------------------------------------------
// Whitelist-Sanitizer (kein zweites Dependency wie DOMPurify): rendert Markdown
// per marked und entfernt anschließend alle nicht erlaubten Tags/Attribute, damit
// von Bearbeitern eingebettetes Roh-HTML kein Stored-XSS erzeugen kann.
const GESCH_TAGS_OK = new Set(['P','BR','HR','STRONG','EM','B','I','U','S','DEL','MARK',
  'H1','H2','H3','H4','H5','H6','UL','OL','LI','BLOCKQUOTE','CODE','PRE','A','IMG',
  'TABLE','THEAD','TBODY','TR','TH','TD','SPAN']);
const GESCH_TAGS_WEG = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','FORM','INPUT',
  'BUTTON','TEXTAREA','SELECT','SVG','MATH','LINK','META','BASE','TITLE','AUDIO','VIDEO','SOURCE']);

function geschCleanElement(el) {
  Array.from(el.children).forEach(kind => {
    const tag = kind.tagName;
    if (GESCH_TAGS_WEG.has(tag)) { kind.remove(); return; }
    if (!GESCH_TAGS_OK.has(tag)) {                 // unbekanntes Tag: Inhalt zuerst säubern, dann auspacken
      geschCleanElement(kind);
      const p = kind.parentNode;
      while (kind.firstChild) p.insertBefore(kind.firstChild, kind);
      p.removeChild(kind);
      return;
    }
    Array.from(kind.attributes).forEach(a => {     // nur sichere Attribute behalten
      const n = a.name.toLowerCase();
      const ok = (tag === 'A' && n === 'href') || (tag === 'IMG' && (n === 'src' || n === 'alt')) || n === 'title';
      if (!ok) kind.removeAttribute(a.name);
    });
    if (tag === 'A') {
      const h = kind.getAttribute('href') || '';
      if (!/^(https?:|mailto:)/i.test(h)) kind.removeAttribute('href');
      kind.setAttribute('target', '_blank');
      kind.setAttribute('rel', 'noopener noreferrer nofollow');
    }
    if (tag === 'IMG') {
      const s = kind.getAttribute('src') || '';
      if (!/^https?:/i.test(s)) { kind.remove(); return; }
      kind.setAttribute('loading', 'lazy');
    }
    geschCleanElement(kind);
  });
}

function geschMarkdownHtml(md) {
  const src = (md == null ? '' : String(md));
  if (!src.trim()) return '';
  if (window.marked && typeof marked.parse === 'function') {
    let roh = null;
    try { roh = marked.parse(src, { breaks: true, gfm: true }); } catch (e) { roh = null; }
    if (roh != null) {
      const tmpl = document.createElement('template');
      tmpl.innerHTML = roh;
      const tw = document.createTreeWalker(tmpl.content, NodeFilter.SHOW_COMMENT, null);
      const weg = []; while (tw.nextNode()) weg.push(tw.currentNode); weg.forEach(n => n.remove());
      geschCleanElement(tmpl.content);
      return tmpl.innerHTML;
    }
  }
  // Fallback ohne marked (z. B. CDN blockiert): escapter Klartext mit Zeilenumbrüchen.
  return escapeHtml(src).replace(/\n/g, '<br>');
}

// --- Laden ------------------------------------------------------------------
async function ladePersonGeschichten(personUuid) {
  if (!personUuid) return [];
  const { data, error } = await sbClient.from('personen_geschichten')
    .select('id, person_id, sprache, titel, text, veroeffentlicht, aktualisiert_am')
    .eq('person_id', personUuid);
  if (error) { console.warn('Geschichten laden:', error); return []; }
  return data || [];
}

// --- Verwaltung im Editor ---------------------------------------------------
async function geschEditOeffnen(p) {
  const box = document.getElementById('pe-geschichte');
  if (!box || !p || !p._uuid) return;
  const tree = p._tree || aktuellerStammbaumId || null;
  geschCtx = { personUuid: p._uuid, personExt: p.id, stammbaumId: tree,
               familieId: stammbaumZuFamilie[tree] || null };
  geschDaten = {};
  geschAktiv = GESCH_SPRACHEN.includes(aktuelleSprache) ? aktuelleSprache : 'de';
  geschStatus('', null);
  const rows = await ladePersonGeschichten(p._uuid);
  rows.forEach(r => { geschDaten[r.sprache] = {
    id: r.id, sprache: r.sprache, titel: r.titel || '', text: r.text || '',
    veroeffentlicht: r.veroeffentlicht !== false, _exists: true, _dirty: false }; });
  geschRenderTabs();
  geschFuelleFelder();
}

// In-Memory-Puffer der aktiven Sprache holen/anlegen (Default: veröffentlicht).
function geschPuffer(lang) {
  if (!geschDaten[lang]) geschDaten[lang] = {
    id: null, sprache: lang, titel: '', text: '', veroeffentlicht: true, _exists: false, _dirty: false };
  return geschDaten[lang];
}

function geschRenderTabs() {
  const wrap = document.getElementById('gesch-tabs');
  if (!wrap) return;
  wrap.innerHTML = GESCH_SPRACHEN.map(l => {
    const d = geschDaten[l];
    const hatInhalt = d && ((d.titel && d.titel.trim()) || (d.text && d.text.trim()));
    const entwurf = d && d._exists && d.veroeffentlicht === false;
    return `<button type="button" class="gesch-tab${l === geschAktiv ? ' aktiv' : ''}"
              onclick="geschTabWechsel('${l}')">${l.toUpperCase()}${hatInhalt ? '<span class="gesch-tab-dot" title="' + escapeHtml(t(entwurf ? 'gesch_entwurf_badge' : 'gesch_veroeffentlicht')) + '"></span>' : ''}</button>`;
  }).join('');
}

// Felder aus dem Puffer der aktiven Sprache befüllen + Vorschau aktualisieren.
function geschFuelleFelder() {
  const d = geschPuffer(geschAktiv);
  const ti = document.getElementById('gesch-titel-input');
  const tx = document.getElementById('gesch-text-input');
  const vb = document.getElementById('gesch-veroeffentlicht');
  if (ti) ti.value = d.titel || '';
  if (tx) tx.value = d.text || '';
  if (vb) vb.checked = d.veroeffentlicht !== false;
  geschVorschau();
}

// Eingaben live in den Puffer übernehmen (Tab-Wechsel verliert nichts) + Vorschau.
function geschFeldInput() {
  const d = geschPuffer(geschAktiv);
  d.titel = (document.getElementById('gesch-titel-input') || {}).value || '';
  d.text  = (document.getElementById('gesch-text-input')  || {}).value || '';
  const vb = document.getElementById('gesch-veroeffentlicht');
  d.veroeffentlicht = vb ? vb.checked : true;
  d._dirty = true;
  geschVorschau();
  geschRenderTabs();
}

function geschVorschau() {
  const host = document.getElementById('gesch-vorschau');
  if (!host) return;
  const tx = document.getElementById('gesch-text-input');
  host.innerHTML = geschMarkdownHtml(tx ? tx.value : '');
}

function geschTabWechsel(lang) {
  if (!GESCH_SPRACHEN.includes(lang)) return;
  geschFeldInput();      // aktuellen Stand sichern
  geschAktiv = lang;
  geschRenderTabs();
  geschFuelleFelder();
}

function geschStatus(msg, ok) {
  const el = document.getElementById('gesch-status');
  if (!el) return;
  if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
  el.textContent = msg;
  el.className = 'gesch-status' + (ok === false ? ' fehler' : ok === true ? ' ok' : '');
  el.style.display = 'block';
}

async function geschSpeichern() {
  if (!geschCtx) return;
  if (!geschCtx.familieId || !geschCtx.stammbaumId) { geschStatus(t('gesch_fehler') + 'Baum/Familie', false); return; }
  geschFeldInput();
  const d = geschPuffer(geschAktiv);
  const leer = !(d.titel && d.titel.trim()) && !(d.text && d.text.trim());
  if (leer) {   // leere Geschichte = vorhandene löschen bzw. nichts tun
    if (d._exists) return geschLoeschen(true);
    geschStatus('', null); return;
  }
  const payload = {
    person_id: geschCtx.personUuid, familie_id: geschCtx.familieId,
    stammbaum_id: geschCtx.stammbaumId, sprache: d.sprache,
    titel: d.titel.trim() || null, text: d.text.trim() || null,
    veroeffentlicht: d.veroeffentlicht !== false
  };
  const { data, error } = await sbClient.from('personen_geschichten')
    .upsert(payload, { onConflict: 'person_id,sprache' })
    .select('id, sprache, titel, text, veroeffentlicht').single();
  if (error) { geschStatus(t('gesch_fehler') + error.message, false); return; }
  geschDaten[d.sprache] = { id: data.id, sprache: data.sprache, titel: data.titel || '',
    text: data.text || '', veroeffentlicht: data.veroeffentlicht !== false, _exists: true, _dirty: false };
  geschRenderTabs();
  geschStatus(t('gesch_gespeichert'), true);
}

async function geschLoeschen(still) {
  if (!geschCtx) return;
  const d = geschDaten[geschAktiv];
  if (!d || !d._exists || !d.id) {   // nur Puffer leeren
    if (geschDaten[geschAktiv]) delete geschDaten[geschAktiv];
    geschRenderTabs(); geschFuelleFelder(); return;
  }
  if (!still) {
    const ok = await zeigeBestaetigung(t('gesch_loeschen_frage', { sprache: geschAktiv.toUpperCase() }), { gefahr: true });
    if (!ok) return;
  }
  const { error } = await sbClient.from('personen_geschichten').delete().eq('id', d.id);
  if (error) { geschStatus(t('gesch_fehler') + error.message, false); return; }
  delete geschDaten[geschAktiv];
  geschRenderTabs(); geschFuelleFelder();
  geschStatus(t('gesch_geloescht'), true);
}

// --- Read-only-Anzeige in der Detailkarte -----------------------------------
// Wählt die Geschichte in der aktuellen App-Sprache; sonst Fallback auf eine
// vorhandene Sprachversion mit Hinweis. Entwürfe sieht nur ein Bearbeiter (RLS
// filtert sie für andere ohnehin weg).
function geschWaehleAnzeige(rows) {
  const map = {}; rows.forEach(r => { map[r.sprache] = r; });
  const sichtbar = r => r && (r.veroeffentlicht !== false || istAdmin()) && ((r.text && r.text.trim()) || (r.titel && r.titel.trim()));
  if (sichtbar(map[aktuelleSprache])) return { row: map[aktuelleSprache], fallback: false };
  for (const l of [aktuelleSprache, 'de', 'en', 'sr', 'hr', 'ba']) {
    if (sichtbar(map[l])) return { row: map[l], fallback: true };
  }
  return { row: null, fallback: false };
}

async function geschDetailRender(p) {
  const host = document.getElementById('detail-geschichte');
  if (!host || !p || !p._uuid) return;
  const rows = await ladePersonGeschichten(p._uuid);
  if (aktuelleModalPersonId !== p.id) return;   // Modal inzwischen gewechselt
  const { row, fallback } = geschWaehleAnzeige(rows);
  if (!row) { host.innerHTML = ''; return; }
  // Kurze beschreibung-Zeile ausblenden, wenn eine (reichere) Geschichte erscheint.
  const bz = document.getElementById('detail-beschreibung-zeile'); if (bz) bz.style.display = 'none';
  const fb = fallback ? `<div class="gesch-fallback-hinweis">${escapeHtml(t('gesch_fallback', { sprache: row.sprache.toUpperCase() }))}</div>` : '';
  const entwurf = row.veroeffentlicht === false ? `<span class="gesch-entwurf-badge">${escapeHtml(t('gesch_entwurf_badge'))}</span>` : '';
  host.innerHTML = `
    <div class="beziehungen gesch-detail"><h3>${escapeHtml(t('gesch_titel'))} ${entwurf}</h3>
      ${fb}
      ${row.titel ? `<div class="gesch-detail-titel">${escapeHtml(row.titel)}</div>` : ''}
      <div class="markdown-body gesch-detail-text">${geschMarkdownHtml(row.text)}</div>
    </div>`;
}

// Sprachwechsel: offene Editor-Tabs/Vorschau + offene Detail-Anzeige neu aufbauen.
function geschSpracheUpdate() {
  const edit = document.getElementById('person-edit-modal');
  if (edit && edit.classList.contains('aktiv') && geschCtx) { geschRenderTabs(); geschVorschau(); }
  const modal = document.getElementById('modal');
  if (modal && modal.classList.contains('aktiv')) {
    const p = aktuelleDaten && aktuelleDaten.persons && aktuelleDaten.persons[aktuelleModalPersonId];
    if (p) geschDetailRender(p);
  }
}

// ============================================================
// DOKUMENTE & QUELLEN pro Person (Tabelle personen_dokumente + PRIVATER Bucket
// 'personen-dokumente'). Analog zur Foto-Galerie, aber für Belege (PDF/Bilder)
// mit Typ + Quellenangabe + Dokumentdatum. Privater Bucket -> Zugriff über
// signierte URLs (Urkunden sind sensibel). Read-only in der Detailkarte
// (#detail-dokumente, alle Nutzer mit Lesezugriff), Verwaltung im Editor
// (#pe-dok-liste/#pe-dok-form, nur Bearbeiter — istAdmin/RLS).
// ============================================================
const DOK_BUCKET = 'personen-dokumente';
let dokListe = [];        // aktuell geladene Dokumente (gemeinsam Editor & Detail & Viewer)
let dokCtx   = null;      // { personUuid, personExt, stammbaumId, familieId, editierbar }
const DOK_TYP_ICON = { geburtsurkunde:'📜', heiratsurkunde:'💍', kirchenbuch:'⛪', brief:'✉️', sonstiges:'📄' };
const DOK_SIGNED_SEK = 3600;   // signierte URL 1 h gültig (genug für Vorschau/Download)

function dokTypIcon(typ)  { return DOK_TYP_ICON[typ] || DOK_TYP_ICON.sonstiges; }
function dokTypLabel(typ) { return t('dok_typ_' + (DOK_TYP_ICON[typ] ? typ : 'sonstiges')); }
function dokIstPdf(d)     { return /\.pdf$/i.test((d && d.storage_pfad) || ''); }

// Signierte URL eines Dokument-Pfades (privater Bucket -> kein public URL).
async function dokSignedUrl(pfad) {
  if (!pfad) return '';
  const { data, error } = await sbClient.storage.from(DOK_BUCKET).createSignedUrl(pfad, DOK_SIGNED_SEK);
  if (error) { console.warn('Dok signierte URL:', error); return ''; }
  return data.signedUrl;
}

// Dokumente einer Person laden (sortiert) + signierte URLs (gebündelt) anhängen.
async function ladePersonDokumente(personUuid) {
  if (!personUuid) return [];
  const { data, error } = await sbClient.from('personen_dokumente')
    .select('id, person_id, storage_pfad, titel, dok_typ, quellenangabe, dok_datum, sortierung')
    .eq('person_id', personUuid)
    .order('sortierung', { ascending: true })
    .order('erstellt_am', { ascending: true });
  if (error) { console.warn('Dokumente laden:', error); return []; }
  const rows = data || [];
  const pfade = rows.map(r => r.storage_pfad).filter(Boolean);
  const urlMap = {};
  if (pfade.length) {
    const { data: signed } = await sbClient.storage.from(DOK_BUCKET).createSignedUrls(pfade, DOK_SIGNED_SEK);
    (signed || []).forEach(s => { if (s && s.path && s.signedUrl) urlMap[s.path] = s.signedUrl; });
  }
  return rows.map(r => ({ ...r, _url: urlMap[r.storage_pfad] || '' }));
}

async function dokUpload() {
  if (!dokCtx || !dokCtx.editierbar) return;
  if (!dokCtx.stammbaumId || !dokCtx.familieId) { dokFehler(t('reg_fehler') + 'kein Baum/Familie'); return; }
  const input  = document.getElementById('pe-dok-input');
  const file   = input && input.files && input.files[0];
  const titel  = document.getElementById('pe-dok-titel').value.trim();
  const typ    = document.getElementById('pe-dok-typ').value || 'sonstiges';
  const datum  = datumWert(document.getElementById('pe-dok-datum'));
  const quelle = document.getElementById('pe-dok-quelle').value.trim();
  if (!file)  { dokFehler(t('dok_datei_pflicht')); return; }
  if (!titel) { dokFehler(t('dok_titel_pflicht')); return; }
  const erlaubt = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'];
  if (!erlaubt.includes(file.type)) { dokFehler(t('dok_typ_fehler')); return; }
  if (file.size > 20 * 1024 * 1024) { dokFehler(t('dok_gross_fehler')); return; }
  // date-Spalte: nur kanonisches ISO speichern, sonst NULL (kein Freitext -> Fehler 22008)
  const datumIso = /^\d{4}-\d{2}-\d{2}$/.test(datum || '') ? datum : null;

  const fehlerEl = document.getElementById('pe-fehler'); if (fehlerEl) fehlerEl.style.display = 'none';
  const btn = document.getElementById('pe-dok-btn'); const altTxt = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = t('reg_senden_laeuft'); }
  try {
    // Bilder clientseitig komprimieren (wie Galerie); PDFs unverändert hochladen.
    let blob = file, ext = 'pdf';
    if (file.type !== 'application/pdf') {
      // Höhere Auflösung als die Foto-Galerie (2400 px): Urkunden-Feindruck muss lesbar bleiben.
      try { blob = await galerieKomprimiere(file, 2400, 0.88); } catch (e) { blob = file; }
      ext = blob.type === 'image/jpeg' ? 'jpg' : (blob.type === 'image/png' ? 'png' : 'webp');
    }
    const uuid = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36).slice(2));
    const pfad = `${dokCtx.stammbaumId}/${dokCtx.personUuid}/${uuid}.${ext}`;
    const up = await sbClient.storage.from(DOK_BUCKET).upload(pfad, blob,
      { cacheControl: '3600', contentType: blob.type || 'application/octet-stream', upsert: false });
    if (up.error) { dokFehler(t('dok_upload_fehler') + up.error.message); return; }
    const sort = dokListe.reduce((m, d) => Math.max(m, d.sortierung || 0), 0) + 10;
    const { data: row, error: insErr } = await sbClient.from('personen_dokumente').insert({
      person_id: dokCtx.personUuid, familie_id: dokCtx.familieId, stammbaum_id: dokCtx.stammbaumId,
      storage_pfad: pfad, titel, dok_typ: typ, quellenangabe: quelle || null, dok_datum: datumIso, sortierung: sort
    }).select('id, person_id, storage_pfad, titel, dok_typ, quellenangabe, dok_datum, sortierung').single();
    if (insErr) {
      try { await sbClient.storage.from(DOK_BUCKET).remove([pfad]); } catch (e) {}
      dokFehler(t('dok_upload_fehler') + insErr.message); return;
    }
    dokListe.push({ ...row, _url: await dokSignedUrl(pfad) });
    dokFormReset();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = altTxt || t('dok_hochladen'); }
  }
  dokEditRender();
}

async function dokLoeschen(id) {
  if (!dokCtx || !dokCtx.editierbar) return;
  const d = dokListe.find(x => x.id === id); if (!d) return;
  if (!await zeigeBestaetigung(t('dok_loeschen_frage'), { gefahr: true })) return;
  const { error } = await sbClient.from('personen_dokumente').delete().eq('id', id);
  if (error) { dokFehler(t('reg_fehler') + error.message); return; }
  try { await sbClient.storage.from(DOK_BUCKET).remove([d.storage_pfad]); } catch (e) { console.warn('Dok-Storage löschen:', e); }
  dokListe = dokListe.filter(x => x.id !== id);
  dokEditRender();
}

// Pflichtprüfung Namen (ab v11): Vorname + Nachname IMMER Pflicht; bei Frauen zusätzlich der
// Mädchenname (ehename) — nötig für die korrekte Blutlinien-Erkennung im Renderer (istBlutName).
// Zeigt den Fehler DIREKT am betroffenen Feld (feldFehler, scrollt+fokussiert) und gibt false
// zurück. `prefix` = 'pe' (Bearbeiten) bzw. 'pa' (Hinzufügen) adressiert die Feld-IDs.
function pruefeNamePflicht(prefix, vorname, nachname, sex, ehename) {
  if (!vorname)  return feldFehler(prefix + '-vorname',  t('pe_vorname_pflicht'));
  if (!nachname) return feldFehler(prefix + '-nachname', t('pe_nachname_pflicht'));
  if (sex === 'F' && !ehename) return feldFehler(prefix + '-ehename', t('pe_ehename_pflicht'));
  return true;
}
// Pflicht-* dynamisch umschalten: der Mädchenname ist NUR bei Frauen Pflicht.
function pflichtMarkierung(geschlechtId, ehenameLabelId) {

  const lab = document.getElementById(ehenameLabelId);

}
function pePflichtMarkierung() { pflichtMarkierung('pe-geschlecht', 'pe-ehename-label'); }
function paPflichtMarkierung() { pflichtMarkierung('pa-geschlecht', 'pa-ehename-label'); }

async function speicherePerson(force) {
  if (!istAdmin()) return;
  const personId = document.getElementById('pe-id').value;
  const pObj     = aktuelleDaten.persons[personId];
  const fehlerEl = document.getElementById('pe-fehler');
  const erfolgEl = document.getElementById('pe-erfolg');
  const button   = document.getElementById('pe-submit');
  fehlerEl.style.display = 'none'; erfolgEl.style.display = 'none';
  feldFehlerReset('person-edit-modal');   // alte Feld-Fehler zurücksetzen
  if (!pObj || !pObj._uuid) { fehlerEl.textContent = 'Person nicht gefunden.'; fehlerEl.style.display = 'block'; return; }

  const v  = id => document.getElementById(id).value.trim();
  const vd = id => datumWert(document.getElementById(id));   // Datumsfelder -> ISO/Freitext
  // Pflicht: Vorname + Nachname (alle) + Mädchenname bei Frauen — Fehler direkt am Feld
  const sexE = document.getElementById('pe-geschlecht').value || '';
  if (!pruefeNamePflicht('pe', v('pe-vorname'), v('pe-nachname'), sexE, v('pe-ehename'))) return;
  // Kontakt-E-Mail (optional) muss gültig sein, falls gesetzt (Hinweis steht am Feld)
  if (!pruefeEmailFeld(document.getElementById('pe-email'), false)) return feldFokus('pe-email');
  const altText = button.textContent;
  button.disabled = true; button.textContent = t('reg_senden_laeuft');

  // Pristine stammbaum_daten + aktuellen Stand (updated_at) holen
  const { data: row, error: lErr } = await sbClient.from('personen')
    .select('stammbaum_daten, updated_at').eq('id', pObj._uuid).single();
  if (lErr) {
    button.disabled = false; button.textContent = altText;
    fehlerEl.textContent = t('reg_fehler') + lErr.message; fehlerEl.style.display = 'block'; return;
  }
  const sd = row.stammbaum_daten || {};
  const verstorben = document.getElementById('pe-status').value === 'verstorben';
  const neu = {
    ...sd,
    sex: document.getElementById('pe-geschlecht').value || '',
    given: v('pe-vorname'), surname: v('pe-nachname'),
    titel: v('pe-titel'), namenszusatz: v('pe-namenszusatz'), ehename: v('pe-ehename'),
    birth_date: vd('pe-geburtsdatum'), birth_place: v('pe-geburtsort'), geburtsland: v('pe-geburtsland'),
    stadt: v('pe-stadt'), gemeinde: v('pe-gemeinde'),
    getauft: vd('pe-getauft'),
    hochzeitsort: v('pe-hochzeitsort'),
    hochzeit_standesamt: vd('pe-hochzeit-standesamt'),
    hochzeit_kirchlich: vd('pe-hochzeit-kirchlich'),
    hochzeitstag: '',                                    // altes Einzelfeld nicht mehr genutzt
    beziehung: document.getElementById('pe-beziehung').value,
    beziehung_sonstige: v('pe-beziehung-sonstige'),
    email: v('pe-email'), telefon: v('pe-telefon'), facebook: v('pe-facebook'), instagram: v('pe-instagram'),
    wohnort_land: v('pe-wohnland'), wohnort_stadt: v('pe-wohnstadt'), adresse: v('pe-adresse'),
    beruf: v('pe-beruf'), ausbildung: v('pe-ausbildung'), beschreibung: v('pe-beschreibung'),
    deceased: verstorben,
    death_date: verstorben ? vd('pe-sterbedatum') : ''
  };
  neu.name = (neu.given + ' ' + neu.surname).trim();

  // P5 (Konflikterkennung / Optimistic Locking): Hat jemand die Zeile seit dem Öffnen geändert?
  if (!force && editBaselineUpdated && row.updated_at && row.updated_at !== editBaselineUpdated) {
    button.disabled = false; button.textContent = altText;
    zeigeKonfliktDialog(personId, neu, row.stammbaum_daten || {});
    return;
  }

  const { error: uErr } = await sbClient.from('personen')
    .update({ stammbaum_daten: neu, vorname: neu.given, nachname: neu.surname }).eq('id', pObj._uuid);
  button.disabled = false; button.textContent = altText;
  if (uErr) { fehlerEl.textContent = t('reg_fehler') + uErr.message; fehlerEl.style.display = 'block'; return; }
  editBaselineUpdated = null;   // P5: gespeichert -> kein erneuter Konflikt-Check bis Wieder-Öffnen

  // In-memory aktualisieren + neu zeichnen (kein voller Reload, Baumkontext bleibt)
  Object.assign(pObj, {
    sex: neu.sex, given: neu.given, surname: neu.surname, name: neu.name,
    titel: neu.titel, namenszusatz: neu.namenszusatz, ehename: neu.ehename,
    birth_date: neu.birth_date, birth_place: neu.birth_place, geburtsland: neu.geburtsland,
    getauft: neu.getauft, hochzeitsort: neu.hochzeitsort,
    hochzeit_standesamt: neu.hochzeit_standesamt, hochzeit_kirchlich: neu.hochzeit_kirchlich,
    beziehung: neu.beziehung, beziehung_sonstige: neu.beziehung_sonstige,
    email: neu.email, telefon: neu.telefon, facebook: neu.facebook, instagram: neu.instagram,
    wohnort_land: neu.wohnort_land, wohnort_stadt: neu.wohnort_stadt, adresse: neu.adresse,
    beruf: neu.beruf, ausbildung: neu.ausbildung, beschreibung: neu.beschreibung,
    deceased: neu.deceased, death_date: neu.death_date
  });
  zeichneBaumNeu();
  erfolgEl.textContent = t('pe_gespeichert'); erfolgEl.style.display = 'block';

  // Verknüpfte Person (gleiche Person über Bäume): Biografie wurde per DB-Trigger auf alle
  // Zwillinge übertragen -> Baum neu laden, damit die anderen Karten sofort aktualisiert sind.
  if (pObj._ident && typeof ladeBaumDaten === 'function') await ladeBaumDaten();

  // DUBLETTEN-FRÜHERKENNUNG (Bearbeiten): mit den NEUEN Werten prüfen, eigene Karte ausschließen.
  // Treffer -> Verknüpfung (modus 'merge': die zwei Karten zu einer zusammenführen).
  const { data: matches } = await sbClient.rpc('dubletten_check_global', {
    p_vorname: neu.given, p_nachname: neu.surname, p_birth_date: neu.birth_date,
    p_land: neu.geburtsland, p_exclude_person: pObj._uuid
  });
  if (matches && matches.length) {
    zeigeDublettenDialog(matches, {
      modus: 'merge', kontext: pObj._uuid, typ: null, zweiter: null,
      proceed: () => schliessePersonEdit(),
      onLinked: async () => { schliessePersonEdit(); if (typeof ladeBaumDaten === 'function') await ladeBaumDaten(); }
    });
    return;
  }
  // Nachname geändert + weicht vom Baum ab -> Overlay (neuer Baum / verknüpfen / ohne).
  if (zweigNachnameNorm(sd.surname || '') !== zweigNachnameNorm(neu.surname)
      && pruefeAbweichenderNachname(personId, neu.surname, null)) {
    schliessePersonEdit();
    return;
  }
  setTimeout(() => schliessePersonEdit(), 900);
}

// ---- P5: Konflikterkennung (Optimistic Locking) + Feld-Diff ----------------
// Felder, die im Vergleich gegenübergestellt werden (Schlüssel in stammbaum_daten -> i18n-Label).
const KONFLIKT_FELDER = [
  ['given','reg_vorname'], ['surname','reg_nachname'], ['titel','pe_titel'],
  ['namenszusatz','pe_namenszusatz'], ['ehename','pe_ehename'], ['sex','pe_geschlecht'],
  ['birth_date','reg_geburtsdatum'], ['birth_place','reg_geburtsort'], ['geburtsland','reg_geburtsland'],
  ['stadt','fe_grad'], ['gemeinde','fe_opstina'], ['getauft','reg_getauft'],
  ['beziehung','pe_beziehung'], ['beziehung_sonstige','pe_beziehung_sonstige'],
  ['hochzeitsort','pe_hochzeitsort'], ['hochzeit_standesamt','pe_hochzeit_standesamt'],
  ['hochzeit_kirchlich','pe_hochzeit_kirchlich'],
  ['email','reg_kontakt_email'], ['telefon','reg_telefon'], ['facebook','reg_facebook'], ['instagram','reg_instagram'],
  ['wohnort_land','pe_wohnland'], ['wohnort_stadt','pe_wohnstadt'], ['adresse','pe_adresse'],
  ['beruf','pe_beruf'], ['ausbildung','pe_ausbildung'], ['beschreibung','pe_beschreibung'],
  ['deceased','pe_status'], ['death_date','pe_sterbedatum']
];
let konfliktPersonId = null, konfliktNeu = null, konfliktTheirs = null;

// Werte menschenlesbar formatieren (Datum/Land/Geschlecht/Status/Beziehung).
function konfliktWert(key, val) {
  if (val === undefined || val === null || val === '') return key === 'deceased' ? t('nein') : '—';
  if (key === 'deceased') return val ? t('ja') : t('nein');
  if (['birth_date','death_date','getauft','hochzeit_standesamt','hochzeit_kirchlich'].includes(key)) return formatDatumLang(val) || String(val);
  if (['geburtsland','wohnort_land'].includes(key)) return landAnzeige(val) || String(val);
  if (key === 'sex') return val === 'M' ? t('maennlich') : (val === 'F' ? t('weiblich') : t('unbekannt'));
  if (key === 'beziehung') return t('bz_' + val);
  return String(val);
}

function konfliktVergleich() {
  if (!konfliktNeu || !konfliktTheirs) return;
  const gleich = (a, b) => String(a ?? '') === String(b ?? '');
  const zeilen = KONFLIKT_FELDER
    .filter(([k]) => !gleich(konfliktNeu[k], konfliktTheirs[k]))
    .map(([k, lk]) => `<tr><td class="kd-feld">${escapeHtml(t(lk))}</td><td>${escapeHtml(konfliktWert(k, konfliktNeu[k]))}</td><td>${escapeHtml(konfliktWert(k, konfliktTheirs[k]))}</td></tr>`)
    .join('');
  const tabelle = zeilen
    ? `<div class="konflikt-diff-wrap"><table class="konflikt-diff"><thead><tr>
        <th>${escapeHtml(t('konflikt_feld'))}</th><th>${escapeHtml(t('konflikt_spalte_meine'))}</th><th>${escapeHtml(t('konflikt_spalte_aktuell'))}</th>
        </tr></thead><tbody>${zeilen}</tbody></table></div>`
    : `<p class="confirm-text" style="text-align:left">${escapeHtml(t('konflikt_keine_diff'))}</p>`;
  konfliktOverlayBau(`
    <p class="confirm-text" style="text-align:left"><strong>${escapeHtml(t('konflikt_titel'))}</strong></p>
    ${tabelle}
    <div class="konflikt-actions">

      <button type="button" class="confirm-ja" onclick="konfliktAktuelle()">${escapeHtml(t('konflikt_aktuelle'))}</button>
      <button type="button" class="confirm-nein" onclick="konfliktErsteAnsicht()">${escapeHtml(t('zurueck'))}</button>
    </div>`);
}
