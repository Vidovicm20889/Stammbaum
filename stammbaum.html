<script>
// ============================================================
// SUPABASE AUTH
// ============================================================
const SUPABASE_URL  = 'https://tybvzhifvufgvlgjpmyl.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5YnZ6aGlmdnVmZ3ZsZ2pwbXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDIyMDQsImV4cCI6MjA5NTgxODIwNH0.VL1Z5bZN4t73ArS-uKLC1tAkt1yhQqflKJZ7XU5vA5Y';
const sbClient      = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Diagnose-Logging nur lokal (localhost/127.0.0.1/file://). In Produktion (GitHub Pages)
// bleibt es still, damit keine internen Daten (Rollen, Signed-URLs, Storage-Pfade) in die
// Browser-Konsole gelangen. Echte Fehler laufen weiter über console.warn/console.error.
const IST_LOKAL = ['localhost', '127.0.0.1', ''].includes(location.hostname);
function dbg(...args) { if (IST_LOKAL) console.log(...args); }

let aktuellerUser  = null;
let aktuelleRolle  = null;

async function ladeAuth() {
  const { data: { session } } = await sbClient.auth.getSession();
  if (session) await setzeUser(session.user);

  // WICHTIG: Im onAuthStateChange-Callback KEINE weiteren Supabase-Aufrufe
  // synchron/await ausführen — der Callback hält die interne Auth-Sperre.
  // setzeUser()/ladeBaumDaten() rufen sbClient.from(...) auf und würden auf
  // denselben Lock warten -> Deadlock (jeder weitere Request hängt bis F5).
  // Daher: Arbeit per setTimeout aus dem Callback herauslösen (Lock ist dann frei),
  // und nur reagieren, wenn sich der User tatsächlich ändert (nicht bei jedem
  // TOKEN_REFRESHED, das sonst Baum/Overlay mitten in einer Aktion neu lädt).
  sbClient.auth.onAuthStateChange((_event, session) => {
    const neueUserId = session?.user?.id || null;
    setTimeout(() => {
      if (neueUserId) {
        if (!aktuellerUser || aktuellerUser.id !== neueUserId) setzeUser(session.user);
      } else if (aktuellerUser) {
        loescheUser();
      }
    }, 0);
  });
}

// Rang einer Rolle: je höher, desto mehr Rechte. Wird genutzt, um bei
// mehreren Mitgliedschaften (verschiedene Familien) die höchste zu wählen.
const ROLLEN_RANG = {
  super_admin: 4,
  familien_owner: 3,
  familien_admin: 2,
  familien_mitglied: 1
};

async function setzeUser(user) {
  // Login nach Auto-Logout (Inaktivität) -> harter Reload, damit die neueste
  // App-Version geladen wird (kein veralteter Cache). Flag wird einmalig verbraucht.
  if (sessionStorage.getItem('reloadNachLogin')) {
    sessionStorage.removeItem('reloadNachLogin');
    hardReload();
    return;
  }
  aktuellerUser = user;

  // Alle Mitgliedschaften des Users laden (User kann in mehreren Familien sein).
  // KEIN .limit(1) — sonst würde bei mehreren Familien evtl. die falsche
  // (niedrigere) Rolle gewählt. Wir suchen explizit die höchste Rolle.
  const { data, error } = await sbClient
    .from('mitgliedschaften')
    .select('familie_id, rolle')
    .eq('user_id', user.id);

  if (error) {
    console.warn('Fehler beim Laden der Rolle:', error);
  }

  // Aus allen geladenen Zeilen die Rolle mit dem höchsten Rang bestimmen
  // + Rolle je Familie merken (für Standard-Stammbaum-Priorität Owner>Admin).
  let rawRolle = null;
  let besterRang = 0;
  meineRollenProFamilie = {};
  (data || []).forEach(row => {
    if (!row.rolle) return;
    const norm = normalizeRolle(row.rolle);
    const rang = ROLLEN_RANG[norm] || 0;
    if (rang >= besterRang) {
      besterRang = rang;
      rawRolle   = row.rolle;
    }
    if (row.familie_id) {
      const vorhanden = meineRollenProFamilie[row.familie_id];
      if (!vorhanden || (ROLLEN_RANG[norm] || 0) > (ROLLEN_RANG[vorhanden] || 0)) {
        meineRollenProFamilie[row.familie_id] = norm;
      }
    }
  });

  // Fallback NUR für lokale Entwicklung (localhost/127.0.0.1/file://).
  // In Produktion (GitHub Pages) darf der localStorage-Wert NIEMALS die echte
  // DB-Rolle überschreiben — sonst würde jeder User mit leerer DB-Antwort
  // fälschlicherweise als 'super_admin' (o.ä.) angezeigt werden.
  const istLokal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
  if (!rawRolle && istLokal) {
    const debugRolle = localStorage.getItem('debug_rolle');
    if (debugRolle) {
      console.log('Debug-Modus (lokal): Nutze localStorage rolle:', debugRolle);
      rawRolle = debugRolle;
    }
  }

  // In Produktion: Wenn die DB 0 Zeilen lieferte, ist das ein echtes Problem
  // (meist RLS blockiert das Lesen der eigenen Mitgliedschaft) — sichtbar machen.
  if (!rawRolle && !istLokal && (data || []).length === 0) {
    console.warn('Keine Mitgliedschaft für eingeloggten User gelesen — ' +
      'vermutlich RLS-Policy "mitgliedschaften_select". User bleibt ohne Rolle (nur Lesezugriff).');
  }

  aktuelleRolle = rawRolle ? normalizeRolle(rawRolle) : null;
  dbg('aktuelleRolle gesetzt zu:', aktuelleRolle,
    '(raw:', rawRolle, ', Mitgliedschaften:', (data || []).length, ')');

  aktualisiereAuthUI();
  sessLetzteAktivitaet = Date.now();   // Startzeitpunkt für die Inaktivitäts-Messung
  resetInaktivTimer();                 // Inaktivitäts-Überwachung für den eingeloggten Nutzer starten

  // Phase A2: Sobald Session + Rolle stehen, Baum aus Supabase laden (Fallback bleibt FAMILY_DATA)
  // awaiten, damit Aufrufer (z.B. erstelleStammbaum) danach mit aktueller Baumliste arbeiten können.
  await ladeBaumDaten();

  // Live-Sync (P1): Baumänderungen anderer Nutzer ohne Reload empfangen.
  startRealtimeSync();

  // Profil (Konto-Stammdaten + Avatar) laden -> Badge/Presence/Sprache aktualisieren.
  await ladeMeinProfil();

  // Benachrichtigungen (z. B. Event-Einladungen) laden -> Ungelesen-Indikator.
  ladeBenachrichtigungen();
  startBenachrSync();   // + Live-Updates ohne Reload (Realtime)

  // Deep-Link aus der Event-Einladungs-Mail (?event=<id>) nach dem Login einlösen.
  verarbeiteEventDeepLink();
}

function normalizeRolle(rolle) {
  return rolle.toString().trim().toLowerCase().replace(/[\s-]+/g, '_');
}

// Zentrale Admin-Prüfung: nur super_admin und familien_admin dürfen bearbeiten/hochladen
function istAdmin() {
  return ['super_admin', 'familien_owner', 'familien_admin'].includes(normalizeRolle(aktuelleRolle || ''));
}
// Nur der Super-Admin (Betrieb/Wartung) — für GUI-Funktionen, die normalen Nutzern verborgen bleiben.
function istSuperAdmin() {
  return normalizeRolle(aktuelleRolle || '') === 'super_admin';
}

// DEBUG: Hilfsfunction zum Setzen der Debug-Rolle (nur für lokales Testen)
function setDebugRolle(rolle) {
  if (rolle) {
    localStorage.setItem('debug_rolle', rolle);
    console.log('Debug-Rolle gesetzt auf:', rolle, '- Seite neu laden zum Aktivieren');
  } else {
    localStorage.removeItem('debug_rolle');
    console.log('Debug-Rolle gelöscht');
  }
}

function getDebugRolle() {
  return localStorage.getItem('debug_rolle') || 'keine';
}

function loescheUser() {
  aktuellerUser = null;
  aktuelleRolle = null;
  meineRollenProFamilie = {};
  meinProfil = null;     // Profildaten verwerfen (ausgeloggt)
  meineBenachrichtigungen = [];   // Benachrichtigungen verwerfen + Indikator zurücksetzen
  aktualisiereBenachrBadge();
  profilAvatarPending = undefined;
  startBaumGewaehlt = false;   // nächster Login bestimmt den Start-Stammbaum neu
  stopObavPolling();     // Live-Updates beenden (ausgeloggt)
  stopRealtimeSync();    // Live-Sync der Baumdaten beenden (ausgeloggt)
  stopBenachrSync();     // Live-Benachrichtigungen beenden (ausgeloggt)
  stopPresence();        // Live-Indikator beenden (ausgeloggt)
  aktualisiereAuthUI();
  resetInaktivTimer();   // Inaktivitäts-Timer + Warnung stoppen (ausgeloggt)
}

function aktualisiereAuthUI() {
  const anmeldenBtn = document.getElementById('anmelden-btn');
  const badge       = document.getElementById('user-badge');
  const emailEl     = document.getElementById('user-email');
  const rolleEl     = document.getElementById('user-rolle');
  const uploadLabel = document.querySelector('label[for="gedcom-input"]');
  const shortsTab   = document.getElementById('tab-shorts');   // Events-Tab
  const accountBtn  = document.getElementById('account-btn');   // "Account anlegen" in der Leiste
  const adminBereich = document.getElementById('admin-bereich'); // "Admin-Einstellungen"
  const navMenu      = document.getElementById('nav-menu');       // ⚙ Einstellungs-Dropdown (nur Admins)

  if (aktuellerUser) {
    anmeldenBtn.style.display = 'none';
    badge.style.display       = 'flex';
    emailEl.textContent       = aktuellerUser.email;
    rolleEl.textContent       = aktuelleRolle ? t('rolle_' + aktuelleRolle) : '';
    // Upload nur für Admins sichtbar
    if (uploadLabel) uploadLabel.style.display = istAdmin() ? '' : 'none';
    if (shortsTab)   shortsTab.style.display = '';   // Events nur eingeloggt sichtbar
    if (accountBtn)  accountBtn.style.display = 'none';   // eingeloggt: kein "Account anlegen"
    const rolleNorm = normalizeRolle(aktuelleRolle || '');
    const istAdm = istAdmin();
    const istOwnerOderSuper = ['familien_owner','super_admin'].includes(rolleNorm);
    // tree-los = eingeloggt, aber (noch) keine Rolle/Familie -> darf einen Baum anlegen
    const treeLos = !!aktuellerUser && rolleNorm === '';
    // Panel für Admins ODER tree-lose User (zum Neu-Anlegen) zeigen
    if (adminBereich) adminBereich.style.display = (istAdm || treeLos) ? '' : 'none';
    const mvBtn  = document.getElementById('menu-mv-btn');
    const addBtn = document.getElementById('menu-add-btn');
    const baumDelBtn = document.getElementById('baum-loeschen-btn');
    const baumNeuBtn = document.getElementById('baum-anlegen-btn');
    if (mvBtn)  mvBtn.style.display  = istAdm ? '' : 'none';   // Verwalten: nur Admins
    if (addBtn) addBtn.style.display = istAdm ? '' : 'none';   // Hinzufügen: nur Admins
    if (baumDelBtn) baumDelBtn.style.display = istOwnerOderSuper ? '' : 'none';        // Löschen: Owner/Super
    if (baumNeuBtn) baumNeuBtn.style.display = (istOwnerOderSuper || treeLos) ? '' : 'none'; // Anlegen: Owner/Super/tree-los
    // Podešavanje porodice: sichtbar für Owner/Admin/Super (bearbeiten) UND Mitglieder (nur lesen),
    // nicht für tree-lose Nutzer (haben keine Familie). Server entscheidet über Bearbeitbarkeit.
    const istMitglied = rolleNorm === 'familien_mitglied';
    const porodicaBereich = document.getElementById('porodica-bereich');
    if (porodicaBereich) porodicaBereich.style.display = (istAdm || istMitglied) ? '' : 'none';
    // Profileinstellungen: für JEDEN eingeloggten Nutzer (auch lesende Mitglieder).
    const profilBereich = document.getElementById('profil-bereich');
    if (profilBereich) profilBereich.style.display = '';
    // Badge (Avatar + Name) live aktualisieren.
    aktualisiereBadgeProfil();
    // Das ⚙-Dropdown: für ALLE eingeloggten Nutzer sichtbar (enthält jetzt mind. die Profileinstellungen).
    const zeigeMenu = true;
    if (navMenu) { navMenu.style.display = zeigeMenu ? '' : 'none'; if (!zeigeMenu) navMenu.classList.remove('offen'); }
    // Obavještenja: nur Admins -> Button zeigen + offene Anfragen (Badge) laden
    const obavBtn = document.getElementById('menu-obav-btn');
    if (obavBtn) obavBtn.style.display = istAdm ? '' : 'none';
    // Bäume verbinden / Dubletten-Merge: ausschließlich Super-Admin (für normale Nutzer unsichtbar)
    const mergeBtn = document.getElementById('menu-merge-btn');
    if (mergeBtn) mergeBtn.style.display = istSuperAdmin() ? '' : 'none';
    const gpBtn = document.getElementById('menu-gp-btn');
    if (gpBtn) gpBtn.style.display = istSuperAdmin() ? '' : 'none';
    const berBtn = document.getElementById('menu-bereinigung-btn');
    if (berBtn) berBtn.style.display = istSuperAdmin() ? '' : 'none';
    if (istAdm) {
      // Deep-Link aus der Benachrichtigungs-Mail (?obav=1): nach dem Laden der
      // offenen Anfragen die Obavještenja-Liste automatisch öffnen (einmalig).
      ladeOffeneAnfragen().then(() => {
        if (deepLinkObav) { deepLinkObav = false; zeigeObavModal(); }
      });
      startObavPolling();   // Live-Updates ohne Reload
    } else { offeneAnfragenCache = []; renderObavBadges(); stopObavPolling(); }
  } else {
    anmeldenBtn.style.display = '';
    badge.style.display       = 'none';
    if (uploadLabel) uploadLabel.style.display = 'none';
    if (shortsTab)   shortsTab.style.display = 'none';
    if (accountBtn)  accountBtn.style.display = '';   // ausgeloggt: "Account anlegen" sichtbar
    if (adminBereich) adminBereich.style.display = 'none';
    const profilBereich = document.getElementById('profil-bereich');
    if (profilBereich) profilBereich.style.display = 'none';
    aktualisiereBadgeProfil();   // Avatar/Name aus der Leiste entfernen
    if (navMenu) { navMenu.style.display = 'none'; navMenu.classList.remove('offen'); }
    offeneAnfragenCache = []; renderObavBadges();   // Badges leeren (ausgeloggt)
    // Falls der ausgeloggte User gerade auf der Events-Ansicht war -> zurück auf Baum
    if (typeof aktuelleAnsicht !== 'undefined' && aktuelleAnsicht === 'shorts') aktuelleAnsicht = 'baum';
  }
  aktualisiereInhaltSichtbarkeit();
}

// Stammbaum/Daten sind privat: ohne Login nur ein Anmelde-Hinweis, sonst die Ansichten.
function aktualisiereInhaltSichtbarkeit() {
  const eingeloggt = !!aktuellerUser;
  aktualisiereKopf();   // Titel/Zahlen passend zum Login-Status
  const hinweis    = document.getElementById('login-hinweis');
  const tabGruppe  = document.querySelector('.tab-gruppe');
  const suche      = document.getElementById('suche');
  const treeSel    = document.getElementById('tree-select');

  if (eingeloggt) {
    if (hinweis)   hinweis.style.display   = 'none';
    if (tabGruppe) tabGruppe.style.display = '';
    if (suche)     suche.style.display     = '';
    if (treeSel)   treeSel.style.display   = treeSel.options.length ? '' : 'none';
    wechselAnsicht(aktuelleAnsicht || 'baum');   // aktuelle Ansicht wieder einblenden
  } else {
    ['ansicht-karten','ansicht-shorts','ansicht-baum'].forEach(id => {
      const el = document.getElementById(id); if (el) el.style.display = 'none';
    });
    if (tabGruppe) tabGruppe.style.display = 'none';
    if (suche)     suche.style.display     = 'none';
    if (treeSel)   treeSel.style.display   = 'none';
    if (hinweis)   hinweis.style.display   = 'block';
  }
}

// Menü-Dropdown auf-/zuklappen
function toggleNavMenu(e) {
  if (e) e.stopPropagation();
  const menu = document.getElementById('nav-menu');
  const offen = menu.classList.toggle('offen');
  document.getElementById('nav-menu-toggle').setAttribute('aria-expanded', offen ? 'true' : 'false');
}

// ============================================================
// MITGLIEDER-VERWALTUNG (Admins)
// ============================================================
let mvFamilien = {};
let mvAlle = [];
let mvNameZuId = {};
// Familienauswahl im Verwaltungs-Overlay (getrennt von der Add-Modal-Auswahl)
let mvVerwaltFamilien = {};   // familie_id -> name
let mvVerwaltNameZuId = {};   // name(lower) -> familie_id
let mvVerwaltFamilie = null;  // aktuell gewählte Familie
function zeigeMvFehler(msg) {
  document.getElementById('mv-info').style.display = 'none';
  const el = document.getElementById('mv-fehler');
  el.textContent = msg; el.style.display = 'block';
}
async function zeigeMitglieder() {
  if (!istAdmin()) return;
  const menu = document.getElementById('nav-menu'); if (menu) menu.classList.remove('offen');
  document.getElementById('mv-fehler').style.display = 'none';
  document.getElementById('mv-info').style.display = 'none';
  document.getElementById('mv-suche').value = '';
  mvVerwaltFamilie = null;   // bei jedem Öffnen Auswahl zurücksetzen
  document.getElementById('mitglieder-modal').classList.add('aktiv');
  await ladeMitglieder();
}
function schliesseMitglieder() {
  document.getElementById('mitglieder-modal').classList.remove('aktiv');
}
async function ladeMitglieder() {
  const liste = document.getElementById('mv-liste');
  liste.innerHTML = '…';
  // Familienliste UND Mitglieder parallel laden. Die Familienliste kommt aus der
  // berechtigungsbasierten RPC verwaltbare_familien (super_admin = ALLE Familien;
  // owner/admin = eigene) — NICHT mehr aus den Mitglieder-Zeilen abgeleitet, damit
  // auch Familien OHNE (sichtbare) Mitglieder im Dropdown erscheinen.
  const [rFam, rMit] = await Promise.all([
    sbClient.rpc('verwaltbare_familien'),
    sbClient.rpc('mitglieder_verwaltbar')
  ]);
  if (rMit.error) { liste.innerHTML = `<p class="login-fehler" style="display:block">${escapeHtml(rMit.error.message)}</p>`; mvAlle = []; return; }
  mvAlle = rMit.data || [];

  mvVerwaltFamilien = {};
  if (!rFam.error && rFam.data) {
    rFam.data.forEach(f => { if (f.familie_id) mvVerwaltFamilien[f.familie_id] = f.familie_name; });
  } else {
    // Fallback (RPC noch nicht eingespielt): wie früher aus den Mitgliedern ableiten.
    if (rFam.error) console.warn('verwaltbare_familien:', rFam.error.message);
    mvAlle.forEach(m => { if (m.familie_id) mvVerwaltFamilien[m.familie_id] = m.familie_name; });
  }
  mvVerwaltNameZuId = {};
  const eintraege = Object.entries(mvVerwaltFamilien)
    .sort((a, b) => nm(a[1] || '').localeCompare(nm(b[1] || '')));
  // <select>-Optionen (value = familie_id) -> bekommt automatisch dieselbe
  // suchbare Dropdown-Funktion wie alle anderen Selects der App.
  const mvSel = document.getElementById('mv-familie-filter');
  mvSel.innerHTML = eintraege.map(([fid, name]) =>
    `<option value="${escapeHtml(fid)}">${escapeHtml(nm(name))}</option>`).join('');

  // Auswahl bestimmen: bestehende behalten -> sonst bei genau 1 Familie automatisch
  if (mvVerwaltFamilie && !mvVerwaltFamilien[mvVerwaltFamilie]) mvVerwaltFamilie = null;
  if (!mvVerwaltFamilie && eintraege.length === 1) mvVerwaltFamilie = eintraege[0][0];

  // Dropdown nur zeigen, wenn es etwas zu wählen gibt (>1 Familie)
  document.getElementById('mv-familie-wrap').style.display = (eintraege.length > 1) ? '' : 'none';
  mvSel.value = mvVerwaltFamilie || '';
  macheAlleSelectsSuchbar(document.getElementById('mitglieder-modal'));

  renderMitglieder();
}

// Familie im Such-Dropdown wählen -> Liste neu filtern (value = familie_id)
function mvWaehleFamilie() {
  mvVerwaltFamilie = document.getElementById('mv-familie-filter').value || null;
  renderMitglieder();
}

// Mitgliederliste rendern — ausschließlich die gewählte Familie, ohne super_admin.
function renderMitglieder() {
  const liste   = document.getElementById('mv-liste');
  const aktivEl = document.getElementById('mv-familie-aktiv');
  const filter  = (document.getElementById('mv-suche').value || '').toLowerCase();

  // Keine Familie gewählt -> Hinweis (bei mehreren Familien)
  if (!mvVerwaltFamilie) {
    aktivEl.textContent = '';
    liste.innerHTML = `<p style="color:#8a7a5a">${t('mv_familie_waehlen')}</p>`;
    return;
  }

  aktivEl.textContent = t('mv_familie_aktiv', { name: nm(mvVerwaltFamilien[mvVerwaltFamilie] || '') });

  // Nur Mitglieder DIESER Familie, Super-Admin ausgeblendet
  const inFam = mvAlle.filter(m => m.familie_id === mvVerwaltFamilie && m.rolle !== 'super_admin');
  const gefiltert = inFam.filter(m =>
    !filter
    || (m.email || '').toLowerCase().includes(filter)
    || (m.name  || '').toLowerCase().includes(filter)
    || t('rolle_' + m.rolle).toLowerCase().includes(filter)
  );
  if (gefiltert.length === 0) {
    liste.innerHTML = `<p style="color:#8a7a5a">${t('mv_keine_in_familie')}</p>`;
    return;
  }
  liste.innerHTML = gefiltert.map(m => {
    // Owner ist geschützt: keine Rollenänderung/Deaktivierung/Entfernung über die GUI.
    const istOwner = m.rolle === 'familien_owner';
    return `
    <div class="mv-row${m.aktiv ? '' : ' inaktiv'}" id="mv-row-${m.user_id}">
      <span class="mv-email">${m.name ? `<strong>${escapeHtml(m.name)}</strong> · ` : ''}${escapeHtml(m.email)}${m.aktiv ? '' : ` <span class="mv-status">${escapeHtml(t('mv_inaktiv'))}</span>`}</span>
      ${istOwner ? `<span class="mv-rolle-text">${escapeHtml(t('rolle_familien_owner'))}</span>` : `
      <select onchange="aendereRolle('${m.mitgliedschaft_id}', this.value)">

// ---- Live-Sync der Baumdaten (P1, Supabase Realtime) -------------------------
// Abonniert INSERT/UPDATE/DELETE auf personen/beziehungen/stammbaeume und spielt
// Änderungen ohne Reload (kein F5) ein: bei einem Event wird DEBOUNCED der Baum
// neu geladen (ladeBaumDaten behält den offenen Baum + rendert Karten/Beziehungen/
// Dropdown/Statistiken neu). RLS liefert nur sichtbare Zeilen -> Isolation bleibt.
// WICHTIG: Der Realtime-Callback darf den Inaktivitäts-/Auto-Logout-Timer NICHT
// zurücksetzen (kein resetInaktivTimer/sessAktivitaet hier) — sonst kein Auto-Logout.
// Gilt für ALLE eingeloggten Nutzer (auch lesende Mitglieder), nicht nur Admins.
let realtimeChannel = null;
let realtimeReloadTimer = null;
let realtimeReloadLaeuft = false;
let realtimePendingReload = false;

function startRealtimeSync() {
  stopRealtimeSync();
  if (!aktuellerUser) return;
  try {
    const handler = () => realtimeReloadAnstossen();
    realtimeChannel = sbClient
      .channel('stammbaum-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'personen' },    handler)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'beziehungen' },  handler)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'stammbaeume' },  handler)
      .subscribe();
  } catch (e) {
    console.warn('Realtime-Live-Sync nicht verfügbar:', e);
    realtimeChannel = null;
  }
}

function stopRealtimeSync() {
  if (realtimeReloadTimer) { clearTimeout(realtimeReloadTimer); realtimeReloadTimer = null; }
  realtimePendingReload = false;
  if (realtimeChannel) {
    try { sbClient.removeChannel(realtimeChannel); } catch (e) {}
    realtimeChannel = null;
  }
}

// Debounced: erst ~700 ms nach dem LETZTEN Event neu laden (mehrere Änderungen
// einer Aktion = ein Reload). Bei verstecktem Tab aufschieben (visibilitychange holt nach).
function realtimeReloadAnstossen() {
  if (!aktuellerUser) return;
  if (document.visibilityState !== 'visible') { realtimePendingReload = true; return; }
  if (realtimeReloadTimer) clearTimeout(realtimeReloadTimer);
  realtimeReloadTimer = setTimeout(realtimeReloadAusfuehren, 700);
}

async function realtimeReloadAusfuehren() {
  realtimeReloadTimer = null;
  if (!aktuellerUser) return;
  if (realtimeReloadLaeuft) { realtimePendingReload = true; return; }  // kein paralleler Reload
  realtimeReloadLaeuft = true;
  realtimePendingReload = false;
  try {
    if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();
    pruefeOverlayAktualitaet();   // P3: offene Personen-Overlays auf Live-Änderungen prüfen
  } catch (e) {
    console.warn('Live-Sync-Reload fehlgeschlagen:', e);
  } finally {
    realtimeReloadLaeuft = false;
    if (realtimePendingReload) realtimeReloadAnstossen();   // während Reload kam neues Event
  }
}

// ---- Live-Benachrichtigungen (Realtime) -------------------------------------
// benachrichtigungen hat eine echte RLS-SELECT-Policy (eigene Zeilen) -> Supabase
// Realtime liefert NUR die eigenen Zeilen. Trifft eine neue Benachrichtigung ein
// (z. B. Event-Einladung), wird der Ungelesen-Indikator am Profilsymbol SOFORT
// aktualisiert — ohne Klick/Reload. Wie der Live-Sync: KEIN Zurücksetzen des
// Inaktivitäts-Timers (ladeBenachrichtigungen fasst sessAktivitaet nicht an);
// gilt für ALLE eingeloggten Nutzer. DB: benachrichtigungen muss in der Publication
// supabase_realtime liegen (supabase_benachrichtigungen_realtime.sql).
let benachrChannel     = null;
let benachrReloadTimer = null;
let benachrPending     = false;

function startBenachrSync() {
  stopBenachrSync();
  if (!aktuellerUser) return;
  try {
    benachrChannel = sbClient
      .channel('benachr-sync')
      .on('postgres_changes',
          { event: '*', schema: 'public', table: 'benachrichtigungen', filter: 'user_id=eq.' + aktuellerUser.id },
          () => benachrSyncAnstossen())
      .subscribe();
  } catch (e) {
    console.warn('Benachrichtigungs-Live-Sync nicht verfügbar:', e);
    benachrChannel = null;
  }
}

function stopBenachrSync() {
  if (benachrReloadTimer) { clearTimeout(benachrReloadTimer); benachrReloadTimer = null; }
  benachrPending = false;
  if (benachrChannel) {
    try { sbClient.removeChannel(benachrChannel); } catch (e) {}
    benachrChannel = null;
  }
}

function benachrSyncAnstossen() {
  if (!aktuellerUser) return;
  if (document.visibilityState !== 'visible') { benachrPending = true; return; }   // versteckter Tab: nachholen
  if (benachrReloadTimer) clearTimeout(benachrReloadTimer);
  benachrReloadTimer = setTimeout(() => { benachrReloadTimer = null; ladeBenachrichtigungen(); }, 400);
}

// ---- Live-Indikator (P2, Supabase Realtime Presence) ------------------------
// Zeigt, wer gerade DENSELBEN Stammbaum geöffnet hat. Eigener Channel je Baum
// (presence:tree:<id>) -> beim Baumwechsel wird umgeklinkt. Wie der Live-Sync:
// KEIN Zurücksetzen des Inaktivitäts-Timers; gilt für ALLE eingeloggten Nutzer.
let presenceChannel = null;
let presenceTreeId  = null;
let presenceUsers   = [];   // [{ user_id, name, email }] — eindeutige Nutzer am Baum
// P4 (Soft-Lock, exklusiv): wer bearbeitet gerade welche Person (über Presence-Broadcast).
let presenceLocks   = {};   // externe Personen-ID -> { user_id, name } (NUR fremde Sperren)
let meinLockPerson  = null; // externe ID der Person, die ICH gerade gesperrt habe (im Editor)

// Benutzer-Profil (Konto-Stammdaten + Avatar) des eingeloggten Nutzers (Phase 1).
let meinProfil = null;
// Ausstehende Avatar-Änderung im offenen Profil-Editor:
//   undefined = unverändert | null = beim Speichern löschen | { mainBlob, thumbBlob, previewUrl } = neu
let profilAvatarPending = undefined;
// Platzhalter-Avatar (kein Bild gesetzt) — dezentes goldenes Personen-Icon (SVG, kein Request).
const AVATAR_PLATZHALTER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
  '<rect width="100" height="100" fill="#f6f1e7"/>' +
  '<circle cx="50" cy="38" r="20" fill="#c8a44d"/>' +
  '<path d="M16 92c0-20 16-32 34-32s34 12 34 32z" fill="#c8a44d"/></svg>'
);

// Eigenen Presence-Stand setzen (inkl. evtl. aktiver Bearbeitungssperre). track() ersetzt die
// gesamte Nutzlast -> Standardfelder immer mitsenden.
async function presenceTrack(editing) {
  if (!presenceChannel || !aktuellerUser) return;
  meinLockPerson = editing || null;
  try {
    await presenceChannel.track({
      user_id: aktuellerUser.id,
      name:    nutzerAnzeigeName(),
      email:   aktuellerUser.email || '',
      // Avatar (Thumb) nur teilen, wenn nicht „privat" — Verbund/Familie sind am
      // selben Baum ohnehin im selben Verbund (Isolation bleibt gewahrt).
      avatar:  (meinProfil && meinProfil.avatar_sichtbarkeit !== 'privat')
                 ? (meinProfil.avatar_thumb_url || meinProfil.avatar_url || '') : '',
      editing: meinLockPerson
    });
  } catch (e) {}
}

// Freundlicher Anzeigename: bevorzugt den Profilnamen (Vor-/Nachname), sonst aus der
// E-Mail abgeleitet (vor dem @; Trenner -> Leerzeichen; Wortanfänge groß).
function nutzerAnzeigeName() {
  if (meinProfil && (meinProfil.vorname || meinProfil.nachname)) {
    const n = [meinProfil.vorname, meinProfil.nachname].filter(Boolean).join(' ').trim();
    if (n) return n;
  }
  const mail  = (aktuellerUser && aktuellerUser.email) || '';
  const lokal = mail.split('@')[0] || mail;
  const teile = lokal.split(/[._\-]+/).filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1));
  return teile.join(' ') || mail;
}

// ============================================================
// PROFILEINSTELLUNGEN (Phase 1): Konto-Stammdaten, Avatar, Passwort
// ============================================================

// Profil des eingeloggten Nutzers laden (eigene Zeile via RLS). Aktualisiert danach
// Badge/Presence und wendet eine gespeicherte Profil-Sprache an. Aufruf im Login-Flow.
async function ladeMeinProfil() {
  meinProfil = null;
  if (!aktuellerUser) { aktualisiereBadgeProfil(); return; }
  try {
    const { data, error } = await sbClient
      .from('profile').select('*').eq('user_id', aktuellerUser.id).maybeSingle();
    if (error) console.warn('Profil laden:', error.message);
    meinProfil = data || null;
  } catch (e) { console.warn('Profil laden (Ausnahme):', e); }

  // Gespeicherte Profil-Sprache anwenden (Profil steuert die App-Sprache), wenn gültig.
  const ps = meinProfil && meinProfil.sprache;
  if (ps && TEXTE[ps] && ps !== aktuelleSprache) wechselSprache(ps, true);

  aktualisiereBadgeProfil();
  if (presenceChannel) presenceTrack(meinLockPerson);   // Name/Avatar in Presence auffrischen
}

// Avatar-URL fürs eigene Badge/Presence (Thumb bevorzugt). '' = kein Bild.
function meinAvatarUrl() {
  if (!meinProfil) return '';
  return meinProfil.avatar_thumb_url || meinProfil.avatar_url || '';
}

// Benutzer-Leiste (Avatar + Name) ohne Reload aktualisieren.
function aktualisiereBadgeProfil() {
  const img  = document.getElementById('user-avatar');
  const name = document.getElementById('user-name');
  const mail = document.getElementById('user-email');
  const btn  = document.getElementById('profil-icon-btn');
  const url  = meinAvatarUrl();
  const hatName = !!(meinProfil && (meinProfil.vorname || meinProfil.nachname));
  const profilName = hatName ? [meinProfil.vorname, meinProfil.nachname].filter(Boolean).join(' ').trim() : '';
  // Avatar/Icon: immer rund sichtbar (eigenes Bild ODER dezenter Platzhalter).
  if (img) img.src = (aktuellerUser && url) ? url : AVATAR_PLATZHALTER;
  // Name nur bei vorhandenem Profilnamen (Vor-/Nachname).

// --- Avatar-Verarbeitung (clientseitig, Canvas — keine externe Library) ---
// Quadratischer, zentrierter Zuschnitt -> Zielgröße -> WEBP (Fallback JPEG).
function avatarBlob(img, size) {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const min = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = (img.naturalWidth - min) / 2;
    const sy = (img.naturalHeight - min) / 2;
    ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
    canvas.toBlob((b) => {
      if (b) resolve(b);
      else canvas.toBlob(resolve, 'image/jpeg', 0.85);   // sehr alte Browser ohne WEBP
    }, 'image/webp', 0.85);
  });
}
function verarbeiteAvatar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = async () => {
      try {
        const [mainBlob, thumbBlob] = await Promise.all([avatarBlob(img, 512), avatarBlob(img, 96)]);
        URL.revokeObjectURL(url);
        if (!mainBlob || !thumbBlob) reject(new Error('toBlob null')); else resolve({ mainBlob, thumbBlob });
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild laden fehlgeschlagen')); };
    img.src = url;
  });
}

async function profilAvatarWaehlen(input) {
  document.getElementById('prof-fehler').style.display = 'none';

  if (!erlaubt.includes(file.type)) { profilFehler(t('prof_err_typ')); return; }
  if (file.size > 8 * 1024 * 1024) { profilFehler(t('prof_err_gross')); return; }
  try {
    const { mainBlob, thumbBlob } = await verarbeiteAvatar(file);
    if (profilAvatarPending && profilAvatarPending.previewUrl) { try { URL.revokeObjectURL(profilAvatarPending.previewUrl); } catch (e) {} }

}

// Avatar (Haupt + Thumb) in den Bucket 'avatars' (eigener Ordner) laden -> Public-URLs.
async function ladeAvatarHoch(mainBlob, thumbBlob) {
  const uid  = aktuellerUser.id;
  const ext  = (mainBlob.type === 'image/jpeg') ? 'jpg' : 'webp';
  const mainPath  = `${uid}/avatar.${ext}`;
  const thumbPath = `${uid}/thumb.${ext}`;
  const up1 = await sbClient.storage.from('avatars').upload(mainPath, mainBlob, { upsert: true, cacheControl: '3600', contentType: mainBlob.type });
  if (up1.error) throw up1.error;
  const up2 = await sbClient.storage.from('avatars').upload(thumbPath, thumbBlob, { upsert: true, cacheControl: '3600', contentType: thumbBlob.type });
  if (up2.error) throw up2.error;
  const v = '?v=' + Date.now();   // Cache-Buster (gleicher Pfad bei upsert)
  return {
    url:   sbClient.storage.from('avatars').getPublicUrl(mainPath).data.publicUrl + v,
    thumb: sbClient.storage.from('avatars').getPublicUrl(thumbPath).data.publicUrl + v
  };
}
async function loescheAvatarDateien() {
  const uid = aktuellerUser.id;
  const pfade = [`${uid}/avatar.webp`, `${uid}/thumb.webp`, `${uid}/avatar.jpg`, `${uid}/thumb.jpg`];
  try { await sbClient.storage.from('avatars').remove(pfade); } catch (e) { console.warn('Avatar löschen:', e); }
}

async function speichereProfil() {
  if (!aktuellerUser) return;
  const fehler = document.getElementById('prof-fehler');
  const erfolg = document.getElementById('prof-erfolg');
  fehler.style.display = 'none'; erfolg.style.display = 'none';

  const vorname  = document.getElementById('prof-vorname').value.trim();
  const nachname = document.getElementById('prof-nachname').value.trim();
  const telefon  = document.getElementById('prof-telefon').value.trim();
  const sprache  = document.getElementById('prof-sprache').value || aktuelleSprache;
  const land     = document.getElementById('prof-land').value || '';
  const zeitzone = document.getElementById('prof-zeitzone').value || '';
  const sicht    = document.getElementById('prof-avatar-sicht').value || 'verbund';

  if (!vorname || !nachname) { profilFehler(t('prof_err_pflicht')); return; }

  const btn = document.getElementById('prof-submit');
  btn.disabled = true; btn.textContent = t('reg_senden_laeuft');
  try {
    // 1) Avatar-Änderung (falls vorgemerkt) anwenden
    let avatarUrl   = meinProfil ? (meinProfil.avatar_url || null) : null;
    let avatarThumb = meinProfil ? (meinProfil.avatar_thumb_url || null) : null;
    if (profilAvatarPending === null) {
      await loescheAvatarDateien(); avatarUrl = null; avatarThumb = null;
    } else if (profilAvatarPending && profilAvatarPending.mainBlob) {
      const res = await ladeAvatarHoch(profilAvatarPending.mainBlob, profilAvatarPending.thumbBlob);
      avatarUrl = res.url; avatarThumb = res.thumb;
    }

    // 2) Profil-Zeile upserten (eigene Zeile, RLS auth.uid() = user_id)
    const zeile = {
      user_id: aktuellerUser.id,
      vorname, nachname, telefon: telefon || null,
      sprache, land: land || null, zeitzone: zeitzone || null,
      avatar_url: avatarUrl, avatar_thumb_url: avatarThumb,
      avatar_sichtbarkeit: sicht
    };
    const { data, error } = await sbClient.from('profile').upsert(zeile, { onConflict: 'user_id' }).select().maybeSingle();
    if (error) throw error;
    meinProfil = data || zeile;
    profilAvatarPending = undefined;

    // 3) Live-Update überall (Badge, Presence, Sprache, Kopf)
    aktualisiereBadgeProfil();
    if (presenceChannel) presenceTrack(meinLockPerson);
    if (sprache && TEXTE[sprache] && sprache !== aktuelleSprache) wechselSprache(sprache, true);
    renderProfilKopf();

    erfolg.textContent = t('prof_gespeichert'); erfolg.style.display = 'block';
    // Nach erfolgreichem Speichern Overlay automatisch schließen (kurze Erfolgs-Anzeige).
    setTimeout(() => schliesseProfil(), 900);
  } catch (e) {
    console.warn('Profil speichern:', e);
    profilFehler((e && e.message) ? e.message : t('prof_err_speichern'));
  } finally {
    btn.disabled = false; btn.textContent = t('prof_speichern');
  }
}

// Datum + Uhrzeit lokalisiert (Sitzungen/Login). Fallback: ISO gekürzt.
function formatDatumZeit(iso) {
  if (!iso) return '—';
  try {
    const loc = (typeof isoLocale === 'function') ? isoLocale(aktuelleSprache) : undefined;
    return new Date(iso).toLocaleString(loc, { dateStyle: 'medium', timeStyle: 'short' });
  } catch (e) { return String(iso).slice(0, 16).replace('T', ' '); }
}

// Aus dem User-Agent ein freundliches „Browser · System" ableiten (best effort).
function geraetLabel(ua) {
  if (!ua) return t('sec_geraet_unbekannt');
  let br = 'Browser', os = '';
  if (/Edg\//.test(ua)) br = 'Edge';
  else if (/OPR\/|Opera/.test(ua)) br = 'Opera';
  else if (/Chrome\//.test(ua)) br = 'Chrome';
  else if (/Firefox\//.test(ua)) br = 'Firefox';
  else if (/Safari\//.test(ua)) br = 'Safari';
  if (/Windows/.test(ua)) os = 'Windows';
  else if (/iPhone|iPad|iOS/.test(ua)) os = 'iOS';
  else if (/Android/.test(ua)) os = 'Android';
  else if (/Mac OS X|Macintosh/.test(ua)) os = 'macOS';
  else if (/Linux/.test(ua)) os = 'Linux';
  return os ? (br + ' · ' + os) : br;
}

  document.getElementById('prof-sec-abmelden').style.display = 'none';

    profilSecCache = null;
    if (zeilen) zeilen.innerHTML = '';
    if (fehler) { fehler.textContent = t('sec_fehler'); fehler.style.display = 'block'; }

function renderSicherheit(d) {
  const zeilen = document.getElementById('prof-sec-zeilen');

    `<div class="prof-sec-zeile"><span class="lbl">${escapeHtml(t('sec_pw_geaendert'))}</span><span class="val">${escapeHtml(d.pw_geaendert ? formatDatumZeit(d.pw_geaendert) : t('sec_nie'))}</span></div>`;

  const sessions = Array.isArray(d.sitzungen) ? d.sitzungen : [];

    sessBox.innerHTML = `<div class="prof-sec-sess-titel">${escapeHtml(t('sec_sitzungen'))}</div><div class="prof-hint">${escapeHtml(t('sec_keine_sitzungen'))}</div>`;
  } else {

    sessions.sort((a, b) => (b.aktuell ? 1 : 0) - (a.aktuell ? 1 : 0));
    sessBox.innerHTML = `<div class="prof-sec-sess-titel">${escapeHtml(t('sec_sitzungen'))}</div>` +
      sessions.map(s => {
        const meta = [formatDatumZeit(s.letzte), s.ip].filter(Boolean).join(' · ');
        const badge = s.aktuell ? `<span class="prof-sess-badge">${escapeHtml(t('sec_aktuell'))}</span>` : '';
        return `<div class="prof-sess${s.aktuell ? ' aktuell' : ''}">

          </div>${badge}</div>`;
      }).join('');

  // „Andere abmelden" nur sinnvoll, wenn es außer der aktuellen weitere Sitzungen gibt.

async function profilPasswortAendern() {
  const f  = document.getElementById('prof-pw-fehler');
  const ok = document.getElementById('prof-pw-erfolg');
  f.style.display = 'none'; ok.style.display = 'none';
  const aktuell = document.getElementById('prof-pw-aktuell').value;
  const neu     = document.getElementById('prof-pw-neu').value;
  const neu2    = document.getElementById('prof-pw-neu2').value;

  if (!aktuell) { pwFehler(t('prof_pw_err_aktuell')); return; }
  if (!neu || neu.length < 8) { pwFehler(t('prof_pw_err_kurz')); return; }
  if (!/[A-Za-z]/.test(neu) || !/[0-9]/.test(neu)) { pwFehler(t('prof_pw_err_policy')); return; }
  if (neu !== neu2) { pwFehler(t('prof_pw_err_ungleich')); return; }
  if (neu === aktuell) { pwFehler(t('prof_pw_err_gleich')); return; }

  const btn = document.getElementById('prof-pw-submit');
  btn.disabled = true; btn.textContent = t('reg_senden_laeuft');
  try {
    // 1) Aktuelles Passwort verifizieren (Re-Login mit derselben E-Mail; ändert die
    //    User-ID nicht -> onAuthStateChange löst KEINEN Baum-Reload aus).
    const ver = await sbClient.auth.signInWithPassword({ email: aktuellerUser.email, password: aktuell });
    if (ver.error) { pwFehler(t('prof_pw_err_falsch')); return; }
    // 2) Neues Passwort setzen
    const { error } = await sbClient.auth.updateUser({ password: neu });
    if (error) { pwFehler(error.message); return; }
    ['prof-pw-aktuell','prof-pw-neu','prof-pw-neu2'].forEach(id => { document.getElementById(id).value = ''; });
    // Zeitpunkt der Passwortänderung selbst tracken (Supabase hat kein natives Feld) -> Sicherheitsbereich.
    const jetzt = new Date().toISOString();
    try {
      await sbClient.from('profile').upsert({ user_id: aktuellerUser.id, pw_geaendert_am: jetzt }, { onConflict: 'user_id' });
      if (meinProfil) meinProfil.pw_geaendert_am = jetzt;
      profilSecGeladen = false;   // Sicherheitsbereich beim nächsten Aufklappen frisch laden
    } catch (e) { console.warn('pw_geaendert_am setzen:', e); }
    ok.textContent = t('prof_pw_ok'); ok.style.display = 'block';
    setTimeout(() => { ok.style.display = 'none'; }, 3000);
  } catch (e) { pwFehler((e && e.message) || t('prof_pw_err_speichern')); }
  finally { btn.disabled = false; btn.textContent = t('prof_pw_btn'); }
}

function startPresence(treeId) {
  if (presenceTreeId === treeId && presenceChannel) return;   // schon auf diesem Baum aktiv
  stopPresence();
  if (!aktuellerUser || !treeId) { renderPresenceIndikator(); return; }
  presenceTreeId = treeId;
  try {
    presenceChannel = sbClient.channel('presence:tree:' + treeId, {
      config: { presence: { key: aktuellerUser.id } }
    });
    presenceChannel
      .on('presence', { event: 'sync' },  presenceAktualisieren)
      .on('presence', { event: 'join' },  presenceAktualisieren)
      .on('presence', { event: 'leave' }, presenceAktualisieren)
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED' && presenceChannel) {
          await presenceTrack(meinLockPerson);   // beim (Wieder-)Verbinden evtl. aktive Sperre erneut anmelden
        }
      });
  } catch (e) {
    console.warn('Live-Indikator (Presence) nicht verfügbar:', e);
    presenceChannel = null;
  }
}

function stopPresence() {
  if (presenceChannel) {
    try { presenceChannel.untrack(); } catch (e) {}
    try { sbClient.removeChannel(presenceChannel); } catch (e) {}
    presenceChannel = null;
  }
  presenceTreeId = null;
  presenceUsers  = [];
  presenceLocks  = {};
  meinLockPerson = null;
  renderPresenceIndikator();
}

// Presence-State -> eindeutige Nutzerliste + Karte fremder Bearbeitungssperren (P4).
function presenceAktualisieren() {
  const liste = [];
  const gesehen = new Set();
  const locks = {};
  const meId = aktuellerUser ? aktuellerUser.id : null;
  try {
    const state = presenceChannel ? presenceChannel.presenceState() : {};
    Object.values(state).forEach(metas => {
      (metas || []).forEach(m => {
        const uid = m.user_id || m.email || '';
        if (uid && !gesehen.has(uid)) {
          gesehen.add(uid);
          liste.push({ user_id: uid, name: m.name || m.email || '?', email: m.email || '', avatar: m.avatar || '' });
        }
        // Fremde Sperre vormerken (eigene zählt nicht als Blockade für mich selbst)
        if (m.editing && uid !== meId) locks[m.editing] = { user_id: uid, name: m.name || m.email || '?' };
      });
    });
  } catch (e) {}
  presenceUsers = liste;
  presenceLocks = locks;
  renderPresenceIndikator();
  pruefeLockBanner();   // offene Detailkarte: „wird gerade von X bearbeitet" live ein-/ausblenden
}

function renderPresenceIndikator() {
  const box   = document.getElementById('presence-indikator');
  const txt   = document.getElementById('presence-text');
  const panel = document.getElementById('presence-panel');
  if (!box || !txt || !panel) return;
  const n = presenceUsers.length;
  // Nur anzeigen, wenn AUSSER mir noch jemand am selben Baum ist (sonst kein Hinweis nötig)
  if (!aktuellerUser || n < 2) {
    box.style.display = 'none';
    box.classList.remove('offen');
    return;
  }
  box.style.display = '';
  txt.textContent = t('presence_aktiv', { n });
  const meId = aktuellerUser.id;
  const zeilen = presenceUsers.slice()
    .sort((a, b) => (a.user_id === meId ? -1 : b.user_id === meId ? 1 : 0))   // ich zuerst
    .map(u => {
      const selbst = u.user_id === meId;
      const name = escapeHtml(nm(u.name || u.email || '?'));
      const sie  = selbst ? `<span class="pp-sie">${escapeHtml(t('presence_sie'))}</span>` : '';
      // Avatar des Nutzers (über Presence geteilt; '' wenn privat/keiner) — sonst nur der Punkt.
      const ava  = u.avatar
        ? `<img class="pp-avatar" src="${escapeHtml(u.avatar)}" alt="" onerror="this.remove()">`
        : `<span class="pp-dot"></span>`;
      return `<li>${ava}<span>${name}</span>${sie}</li>`;
    }).join('');
  panel.innerHTML = `<div class="pp-titel">${escapeHtml(t('presence_titel'))}</div><ul>${zeilen}</ul>`;
}

function togglePresencePanel(e) {
  if (e) e.stopPropagation();
  const box = document.getElementById('presence-indikator');

  const offen = box.classList.toggle('offen');

// ---- Live-Aktualisierung offener Personen-Overlays (P3) ---------------------
// Wenn ein anderer Nutzer eine Person speichert/löscht, während man ihr Detail-
// oder Bearbeiten-Overlay offen hat: Hinweis-Banner einblenden (im Editor werden
// laufende Eingaben NICHT überschrieben — erst auf Klick „Neueste übernehmen").
// Erkennung über eine stabile Signatur (eigene Felder + Beziehungen via externe IDs;
// FAM-IDs/Positionen bleiben außen vor, da nicht inhaltlich relevant).
let detailWatchId = null, detailWatchSig = null;
let editWatchId   = null, editWatchSig   = null;
let editBaselineUpdated = null;   // P5: Stand (updated_at) der Person beim Öffnen des Editors

function personSignatur(personId) {
  const p = aktuelleDaten.persons[personId];
  if (!p) return null;   // Person existiert nicht mehr (gelöscht)
  const eigen = {};
  Object.keys(p)
    .filter(k => !k.startsWith('_') && k !== 'families_spouse' && k !== 'families_child')
    .sort()
    .forEach(k => { eigen[k] = p[k]; });
  // Beziehungen über STABILE externe IDs (Eltern/Partner/Kinder) — FAM-IDs sind je Reload neu.
  const rel = new Set();
  (p.families_child || []).forEach(fid => {
    const f = aktuelleDaten.families[fid]; if (!f) return;
    [f.husband, f.wife].forEach(x => { if (x && x !== personId) rel.add('E:' + x); });
  });
  (p.families_spouse || []).forEach(fid => {
    const f = aktuelleDaten.families[fid]; if (!f) return;
    const partner = f.husband === personId ? f.wife : f.husband;
    if (partner) rel.add('P:' + partner);
    (f.children || []).forEach(c => rel.add('K:' + c));
  });
  return JSON.stringify(eigen) + '||' + [...rel].sort().join(',');
}

function syncBannerEinfuegen(parent, id, geloescht, uebernehmenFn) {
  if (!parent) return;
  let el = document.getElementById(id);

    el.id = id;
    el.className = 'sync-hinweis';
    parent.insertBefore(el, parent.firstChild);
  }
  const txt = geloescht ? t('sync_geloescht') : t('sync_aktualisiert');
  const btnTxt = geloescht ? t('sync_schliessen') : t('sync_uebernehmen');
  el.innerHTML = `<span>${escapeHtml(txt)}</span>` +
    `<button type="button" class="sync-hinweis-btn" onclick="${uebernehmenFn}">${escapeHtml(btnTxt)}</button>`;
}

// Nach einem Live-Reload prüfen, ob eine offen angezeigte Person betroffen ist.
function pruefeOverlayAktualitaet() {
  if (document.getElementById('modal')?.classList.contains('aktiv') && detailWatchId) {
    const neu = personSignatur(detailWatchId);
    if (neu === null) syncBannerEinfuegen(document.getElementById('modal-text'), 'sync-hinweis-detail', true,  'detailUebernehmen()');
    else if (neu !== detailWatchSig) syncBannerEinfuegen(document.getElementById('modal-text'), 'sync-hinweis-detail', false, 'detailUebernehmen()');
  }
  if (document.getElementById('person-edit-modal')?.classList.contains('aktiv') && editWatchId) {
    const inhalt = document.querySelector('#person-edit-modal .modal-inhalt');
    const neu = personSignatur(editWatchId);
    if (neu === null) syncBannerEinfuegen(inhalt, 'sync-hinweis-edit', true,  'editUebernehmen()');
    else if (neu !== editWatchSig) syncBannerEinfuegen(inhalt, 'sync-hinweis-edit', false, 'editUebernehmen()');
  }
}

// Sprachwechsel: vorhandene Sync-Banner in der neuen Sprache neu beschriften.
function aktualisiereSyncBannerSprache() {
  if (document.getElementById('sync-hinweis-detail') && detailWatchId) {
    syncBannerEinfuegen(document.getElementById('modal-text'), 'sync-hinweis-detail',
      personSignatur(detailWatchId) === null, 'detailUebernehmen()');
  }
  if (document.getElementById('sync-hinweis-edit') && editWatchId) {
    syncBannerEinfuegen(document.querySelector('#person-edit-modal .modal-inhalt'), 'sync-hinweis-edit',
      personSignatur(editWatchId) === null, 'editUebernehmen()');
  }
}

async function dubVerknuepfen(matchId) {
  const k = dubKontext; if (!k) return;
  const fehler = document.getElementById('dub-fehler'); fehler.style.display = 'none';
  const { data, error } = await sbClient.rpc('verknuepfung_anfragen', {
    p_modus: k.modus, p_kontext: k.kontext, p_ziel: matchId, p_typ: k.typ || null, p_zweiter: k.zweiter || null

  dubKontext = null;
  schliesseDublettenModal();
  if (data === 'sofort') {

    if (k.typ === 'kind') { try { await sbClient.rpc('kind_baeume_sync', { p_kind: matchId }); } catch (e) { console.warn('kind_baeume_sync:', e); } }
    if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();

  const sel = document.getElementById('bd-auswahl');
  const treeId = sel.value || (bdBaeume[0] && bdBaeume[0].stammbaum_id);
  if (!treeId) return;
  const b = bdBaeume.find(x => x.stammbaum_id === treeId);

  const ok = await zeigeBestaetigung(t('bd_sicher', { name }));
  if (!ok) return;

  // Event-ids dieses Baums VORHER holen (DB-Zeilen fallen gleich per CASCADE weg),
  // damit wir danach deren Storage-Medien aufräumen können.
  let baumEventIds = [];
  try {
    const { data: evs } = await sbClient.rpc('events_fuer_stammbaum', { p_tree: treeId });
    baumEventIds = (evs || []).map(e => e.id);
  } catch (e) { console.warn('Event-ids für Storage-Aufräumen nicht ermittelbar:', e); }

  const { data, error } = await sbClient.rpc('stammbaum_loeschen', { p_tree: treeId });
  if (error) { await zeigeHinweis(t('reg_fehler') + error.message); return; }

  // Storage-Medien aller Events des gelöschten Baums entfernen (keine Waisen)
  for (const eid of baumEventIds) await loescheEventMedien(eid);

  schliesseBaumDel();
  aktuellerStammbaumId = null;
  await setzeUser(aktuellerUser);   // Rolle + Baum + Menü neu laden (ggf. jetzt tree-los)
  await zeigeHinweis(t('baum_geloescht'));

// ============================================================
// E-MAIL-VALIDIERUNG (global) — EINE zentrale Regel für ALLE E-Mail-Felder.
// Frontend-Guard; das Backend (Edge Functions / RPC ist_gueltige_email) prüft erneut.
// ------------------------------------------------------------
function isValidEmail(email) {
  const e = (email || '').trim();
  if (!e || /\s/.test(e)) return false;                  // keine Leerzeichen
  if ((e.match(/@/g) || []).length !== 1) return false;  // genau ein @
  if (e.includes('..')) return false;                    // keine doppelten Punkte
  // lokaler Teil @ Domain mit mind. einem Punkt + TLD, keine ungültigen Zeichen
  return /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(e);
}

// Feld optisch markieren + Hinweis darunter (oder entfernen)
function markiereEmailFehler(input, zeige) {
  if (!input) return;
  input.classList.toggle('input-fehler', !!zeige);
  const eltern = input.closest('label') || input.parentNode;
  let hint = eltern.querySelector('.feld-fehler-text.email-hint');
  if (zeige) {
    if (!hint) { hint = document.createElement('span'); hint.className = 'feld-fehler-text email-hint'; eltern.appendChild(hint); }
    hint.textContent = t('email_ungueltig');
  } else if (hint) { hint.remove(); }
}

// Ein E-Mail-Feld prüfen. pflicht=true -> leer ist Fehler; sonst ist leer ok (optionales Feld).
function pruefeEmailFeld(input, pflicht) {
  if (!input) return true;
  const val = (input.value || '').trim();
  if (!val) { markiereEmailFehler(input, !!pflicht); return !pflicht; }
  const ok = isValidEmail(val);
  markiereEmailFehler(input, !ok);
  return ok;
}

// Live-Validierung an alle E-Mail-Felder hängen (blur prüft, Tippen entschärft den Fehler)
function bindeEmailLiveCheck(root) {
  (root || document).querySelectorAll('input[type="email"], input.email-feld').forEach(inp => {
    if (inp._emailBound) return; inp._emailBound = true;
    inp.addEventListener('blur',  () => { if (inp.value.trim()) pruefeEmailFeld(inp, false); });
    inp.addEventListener('input', () => { if (inp.classList.contains('input-fehler')) markiereEmailFehler(inp, false); });
  });
}

async function ladeBereinigung() {
  const box = document.getElementById('ber-inhalt'); if (!box) return;
  box.innerHTML = `<div class="event-media-empty">${escapeHtml(t('ber_laden'))}</div>`;
  const { data, error } = await sbClient.rpc('stammbaum_bereinigung_diagnose');
  if (error) {
    box.innerHTML = `<div class="login-fehler" style="display:block">${escapeHtml(t('reg_fehler') + error.message)}</div>`;
    return;
  }
  berDiagnose = data || {};
  renderBereinigung();
}

function renderBereinigung() {
  const box = document.getElementById('ber-inhalt'); if (!box) return;
  const d = berDiagnose || {};
  const z = d.zusammenfassung || {};
  const vorschlaege = Array.isArray(d.gruppen_vorschlag) ? d.gruppen_vorschlag : [];
  const leereFam = Array.isArray(d.familien_ohne_baum) ? d.familien_ohne_baum : [];
  const verwaist = (z.personen_baum_verwaist || 0) + (z.personen_familie_verwaist || 0) + (z.baeume_familie_verwaist || 0);

  // Zusammenfassung (Zähler)
  let html = `<div class="reg-gruppe-titel">${escapeHtml(t('ber_zus_titel'))}</div>
    <div class="obav-meta">
      <div><strong>${escapeHtml(t('ber_zus_personen_ohne_baum'))}:</strong> ${z.personen_ohne_baum || 0}</div>
      <div><strong>${escapeHtml(t('ber_zus_familien_ohne_baum'))}:</strong> ${z.familien_ohne_baum || 0}</div>
      <div><strong>${escapeHtml(t('ber_zus_verwaist'))}:</strong> ${verwaist}</div>
    </div>`;

  // Vorschläge (pro Gruppe ein „Anwenden")
  if (vorschlaege.length) {
    html += `<div class="reg-gruppe-titel" style="margin-top:16px">${escapeHtml(t('ber_vorschlaege_titel'))}</div>`;
    html += vorschlaege.map((g, i) => {
      const aktionLabel = g.vorschlag === 'zuordnen'
        ? t('ber_zuordnen', { baum: nm(g.ziel_baum_name || '') })
        : t('ber_neu_anlegen');
      return `<div class="obav-karte" id="ber-karte-${i}">
        <div class="obav-name">${escapeHtml(nm(g.beispiel_nachname || g.nachname_norm || '—'))}</div>
        <div class="obav-meta">
          <div><strong>${escapeHtml(t('ber_familie'))}:</strong> ${escapeHtml(nm(g.familie_name || '—'))}</div>
          <div><strong>${escapeHtml(t('ber_anzahl'))}:</strong> ${g.anzahl || 0}</div>
          <div><strong>${escapeHtml(t('ber_aktion'))}:</strong> ${escapeHtml(aktionLabel)}</div>
        </div>
        <div class="obav-aktionen">
          <button class="mv-toggle" type="button" onclick="berAnwenden(${i})">${escapeHtml(t('ber_anwenden'))}</button>
        </div>
      </div>`;
    }).join('');
  }

  // Leere Familien (nur Info — separates Thema, keine Auto-Aktion hier)
  if (leereFam.length) {
    html += `<div class="reg-gruppe-titel" style="margin-top:16px">${escapeHtml(t('ber_familien_ohne_baum_titel'))}</div>`;
    html += `<div class="obav-meta">` + leereFam.map(f => {
      const ort = [f.stadt, f.gemeinde, f.land].filter(Boolean).join(', ');
      return `<div>• ${escapeHtml(nm(f.name || '—'))}${ort ? ` <span style="opacity:.7">(${escapeHtml(ort)})</span>` : ''}</div>`;
    }).join('') + `</div>`;
  }

  // Nichts zu tun
  if (!vorschlaege.length && !leereFam.length) {
    html += `<div class="reg-erfolg" style="display:block;margin-top:14px">${escapeHtml(t('ber_keine'))}</div>`;
  }

  html += `<div class="fe-actions" style="margin-top:18px">
    <button class="login-submit fe-abbrechen" type="button" onclick="ladeBereinigung()">${escapeHtml(t('ber_aktualisieren'))}</button>
  </div>`;

  box.innerHTML = html;
}

async function berAnwenden(i) {
  const g = (berDiagnose && berDiagnose.gruppen_vorschlag || [])[i];
  if (!g) return;
  const ok = await zeigeBestaetigung(t('ber_anwenden_frage', {
    anzahl: g.anzahl || 0, nachname: nm(g.beispiel_nachname || '')
  }));
  if (!ok) return;
  const karte = document.getElementById('ber-karte-' + i);
  if (karte) { karte.style.opacity = '0.5'; karte.style.pointerEvents = 'none'; }
  const { data, error } = await sbClient.rpc('bereinigung_anwenden', {
    p_familie_id: g.familie_id, p_nachname: g.nachname_norm, p_ziel_baum_id: g.ziel_baum_id || null
  });
  if (error) {
    if (karte) { karte.style.opacity = ''; karte.style.pointerEvents = ''; }
    await zeigeHinweis(t('reg_fehler') + error.message); return;
  }
  await zeigeHinweis(t('ber_erfolg', { n: (data && data.zugeordnete_personen) || g.anzahl || 0 }));
  // Datenbereinigung als Auslöser: evtl. leer gewordene Bäume aufräumen (Super-Admin-Sweep) + Storage
  try { await sbClient.rpc('auto_leere_baeume_aufraeumen'); } catch (e) {}
  await raeumeVerwaisteMedien();
  if (typeof ladeBaumDaten === 'function') await ladeBaumDaten();   // Baum-Dropdown/Ansicht aktualisieren
  await ladeBereinigung();   // Diagnose neu laden (Vorschlag verschwindet)
}

// Vorschau + Entfernen-Button gemäß feMedia setzen
function feMediaPreview(art) {
  const url = feMedia[art + '_url'] || '';
  const img = document.getElementById('fe-' + art + '-preview');
  const del = document.getElementById('fe-' + art + '-del');
  if (img) { img.src = url; img.style.display = url ? '' : 'none'; }
  const ro = document.getElementById('fe-readonly-hinweis').style.display !== 'none';
  if (del) del.style.display = (url && !ro) ? '' : 'none';
}

async function feMediaUpload(art, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const sid = document.getElementById('fe-stammbaum-id').value;
  const fehlerEl = document.getElementById('fe-fehler'); fehlerEl.style.display = 'none';
  if (!sid) { fehlerEl.textContent = t('fe_keine_familie'); fehlerEl.style.display = 'block'; return; }
  try {
    const sauber = file.name.replace(/[^\w.\-]+/g, '_');
    const path = `${sid}/${art}_${Date.now()}_${sauber}`;
    const { data, error } = await sbClient.storage.from('familien').upload(path, file, { cacheControl: '3600', upsert: true });
    if (error) { fehlerEl.textContent = t('reg_fehler') + error.message; fehlerEl.style.display = 'block'; return; }
    let p = (data && (data.path || data.Key || data.name)) || path;
    if (p.startsWith('familien/')) p = p.slice('familien/'.length);
    const pub = sbClient.storage.from('familien').getPublicUrl(p);
    feMedia[art + '_url']  = (pub && pub.data && pub.data.publicUrl) || '';
    feMedia[art + '_path'] = p;
    feMediaPreview(art);
  } catch (e) {
    fehlerEl.textContent = t('reg_fehler') + (e.message || e); fehlerEl.style.display = 'block';
  }
}

function feMediaEntfernen(art) {
  // Datei wird erst beim Speichern endgültig aufgeräumt (siehe feMediaCleanup).
  feMedia[art + '_url'] = ''; feMedia[art + '_path'] = '';
  const inp = document.getElementById('fe-' + art + '-input'); if (inp) inp.value = '';
  feMediaPreview(art);
}

// Ersetzte/entfernte Storage-Dateien nach erfolgreichem Speichern abräumen (keine Waisen)
async function feMediaCleanup() {
  const weg = [];
  ['foto','wappen'].forEach(a => {
    const alt = feMediaOld[a + '_path'];
    if (alt && alt !== feMedia[a + '_path']) weg.push(alt);
  });

}

// ============================================================
// EINMALIGE MIGRATION: eingebettetes FAMILY_DATA -> Supabase
// In der Konsole als Super-Admin aufrufen:  await migriereStammbaum()
// Idempotent (Personen per externe_id upserten; Beziehungen werden für die
// Familie neu aufgebaut). Rendert NICHTS um — füllt nur die Datenbank.
// ============================================================
async function migriereStammbaum() {
  console.log('%c⏳ Migration startet…', 'color:#7a2a2a;font-weight:bold');
  if (!aktuellerUser) { console.error('Bitte zuerst als Super-Admin einloggen.'); return { fehler: 'nicht eingeloggt' }; }

  // Familie (Baum-Container) des eingeloggten Admins ermitteln
  const { data: mit, error: mErr } = await sbClient
    .from('mitgliedschaften').select('familie_id, rolle').eq('user_id', aktuellerUser.id);
  if (mErr || !mit || mit.length === 0) { console.error('Keine Mitgliedschaft gefunden:', mErr); return { fehler: 'keine mitgliedschaft', mErr }; }
  const sa = mit.find(x => x.rolle === 'super_admin') || mit[0];
  const familie_id = sa.familie_id;
  console.log('%cMigriere in familie_id: ' + familie_id, 'color:#7a2a2a;font-weight:bold');

  // 1) Personen upserten (Spalten exakt wie im Import-Skript -> sicher vorhanden)
  const personen = Object.values(FAMILY_DATA.persons).map(p => ({
    familie_id,
    externe_id:  p.id,
    vorname:     p.given   || '',
    nachname:    p.surname || '',
    geburtsdatum: null,           // Rohdatum bleibt in stammbaum_daten (Freitext)
    sterbedatum:  null,
    geschlecht:  null,            // CHECK-Constraint erlaubt 'M'/'F' nicht -> sex bleibt in stammbaum_daten
    notizen:     null,
    stammbaum_daten: p            // komplettes Personen-Objekt (alle Felder, inkl. sex)
  }));
  const { data: insP, error: pErr } = await sbClient
    .from('personen').upsert(personen, { onConflict: 'familie_id,externe_id' })
    .select('id, externe_id');
  if (pErr) { console.error('Personen-Upsert-Fehler:', pErr); return { fehler: 'personen', pErr }; }
  const map = {};
  insP.forEach(r => { map[r.externe_id] = r.id; });
  console.log('Personen migriert:', insP.length);

  // 2) Beziehungen dieser Familie neu aufbauen (erst löschen, dann einfügen)
  await sbClient.from('beziehungen').delete().eq('familie_id', familie_id);
  const bez = [];
  Object.values(FAMILY_DATA.families).forEach(f => {
    const h = map[f.husband], w = map[f.wife];
    // Mann ↔ Frau
    if (h && w) bez.push({ familie_id, person_a: h, person_b: w, typ: 'ehepartner' });
    // Elternteil (person_a) → Kind (person_b)
    (f.children || []).forEach(cid => {
      const c = map[cid];
      if (!c) return;
      if (h) bez.push({ familie_id, person_a: h, person_b: c, typ: 'elternteil' });
      if (w) bez.push({ familie_id, person_a: w, person_b: c, typ: 'elternteil' });
    });
  });
  const { error: bErr } = await sbClient.from('beziehungen').insert(bez);
  if (bErr) { console.error('Beziehungen-Insert-Fehler:', bErr); return { fehler: 'beziehungen', bErr, personen: insP.length }; }
  console.log('Beziehungen migriert:', bez.length);
  console.log('%c✅ Migration abgeschlossen.', 'color:green;font-weight:bold;font-size:14px');
  return { ok: true, personen: insP.length, beziehungen: bez.length };
}
window.migriereStammbaum = migriereStammbaum;

// ============================================================
// MULTI-TREE Phase B1: je Nachname einen Stammbaum anlegen und jede Person
// zuordnen (personen.stammbaum_id). Konsole als Super-Admin:  await migriereMultiTree()
// Idempotent (stammbaeume per (familie_id,name) upserten; personen-Update je Gruppe).
// ============================================================
async function migriereMultiTree() {
  console.log('%c⏳ Multi-Tree-Migration startet…', 'color:#7a2a2a;font-weight:bold');
  if (!aktuellerUser) { console.error('Bitte als Super-Admin einloggen.'); return { fehler: 'nicht eingeloggt' }; }

  const { data: mit, error: mErr } = await sbClient
    .from('mitgliedschaften').select('familie_id, rolle').eq('user_id', aktuellerUser.id);
  if (mErr || !mit || mit.length === 0) { console.error('Keine Mitgliedschaft:', mErr); return { fehler: 'mitgliedschaft' }; }
  const sa = mit.find(x => x.rolle === 'super_admin') || mit[0];
  const familie_id = sa.familie_id;

  const persons  = FAMILY_DATA.persons;
  const families = FAMILY_DATA.families;

  // Nachname je Person bestimmen; bei Leerwert aus Geburtsfamilie/Ehepartner ableiten
  const cache = {};
  function surnameOf(id, seen) {
    if (cache[id] !== undefined) return cache[id];
    const p = persons[id];
    if (!p) return null;
    if (p.surname && p.surname.trim()) return (cache[id] = p.surname.trim());
    seen = seen || new Set();
    if (seen.has(id)) return null;
    seen.add(id);
    for (const fid of (p.families_child || [])) {        // Geburtsfamilie -> Vater/Mutter
      const fam = families[fid]; if (!fam) continue;
      const s = (fam.husband && surnameOf(fam.husband, seen)) || (fam.wife && surnameOf(fam.wife, seen));
      if (s) return (cache[id] = s);
    }
    for (const fid of (p.families_spouse || [])) {       // sonst Ehepartner
      const fam = families[fid]; if (!fam) continue;
      const partner = fam.husband === id ? fam.wife : fam.husband;
      const s = partner && surnameOf(partner, seen);
      if (s) return (cache[id] = s);
    }
    return (cache[id] = null);
  }

  // 1) Distinct Nachnamen -> stammbaeume upserten
  const namen = new Set();
  Object.keys(persons).forEach(id => namen.add(surnameOf(id) || 'Unbekannt'));
  const { data: insB, error: bErr } = await sbClient.from('stammbaeume')
    .upsert([...namen].map(name => ({ familie_id, name })), { onConflict: 'familie_id,name' })
    .select('id, name');
  if (bErr) { console.error('Stammbäume-Upsert-Fehler:', bErr); return { fehler: 'stammbaeume', bErr }; }
  const name2tree = {};
  insB.forEach(r => { name2tree[r.name] = r.id; });
  console.log('Stammbäume:', insB.length, insB.map(b => b.name).join(', '));

  // 2) personen.stammbaum_id je Nachname-Gruppe setzen (nur diese Spalte)
  const gruppen = {};
  Object.values(persons).forEach(p => {
    const tid = name2tree[surnameOf(p.id) || 'Unbekannt'];
    (gruppen[tid] = gruppen[tid] || []).push(p.id);
  });
  let zugeordnet = 0;
  for (const [tid, exts] of Object.entries(gruppen)) {
    const { error } = await sbClient.from('personen')
      .update({ stammbaum_id: tid }).eq('familie_id', familie_id).in('externe_id', exts);
    if (error) { console.error('Personen-Update-Fehler:', error); return { fehler: 'personen', error }; }
    zugeordnet += exts.length;
  }
  console.log('%c✅ Multi-Tree fertig.', 'color:green;font-weight:bold',
    insB.length, 'Bäume,', zugeordnet, 'Personen zugeordnet.');
  return { ok: true, baeume: insB.length, personen: zugeordnet };
}
window.migriereMultiTree = migriereMultiTree;

// ============================================================
// Nachname-Korrektur / Baum-Zusammenführung (Tippfehler-Dubletten).
// Verschiebt Personen vom falsch geschriebenen Baum in den richtigen,
// korrigiert surname+name, löscht den leeren Tippfehler-Baum.
// Konsole als Super-Admin:  await korrigiereNachnamen()
// ============================================================
async function korrigiereNachname(falsch, richtig) {
  const { data: mit } = await sbClient
    .from('mitgliedschaften').select('familie_id, rolle').eq('user_id', aktuellerUser.id);
  const sa = (mit || []).find(x => x.rolle === 'super_admin') || (mit || [])[0];
  if (!sa) { console.error('Keine Mitgliedschaft.'); return { fehler: 'mitgliedschaft' }; }
  const familie_id = sa.familie_id;

  const { data: baeume, error: bErr } = await sbClient.from('stammbaeume')
    .select('id, name').eq('familie_id', familie_id).in('name', [falsch, richtig]);
  if (bErr) { console.error(bErr); return { fehler: bErr }; }
  const falschBaum  = (baeume || []).find(b => b.name === falsch);
  const richtigBaum = (baeume || []).find(b => b.name === richtig);
  if (!falschBaum) { console.warn('Kein Baum namens', falsch, '– übersprungen.'); return { ok: true, korrigiert: 0 }; }

  // Zielbaum: vorhandener "richtiger" Baum; sonst den falschen einfach umbenennen
  let zielId = richtigBaum ? richtigBaum.id : falschBaum.id;
  if (!richtigBaum) {
    await sbClient.from('stammbaeume').update({ name: richtig }).eq('id', falschBaum.id);
  }

  const { data: personen, error: pErr } = await sbClient.from('personen')
    .select('id, stammbaum_daten').eq('stammbaum_id', falschBaum.id);
  if (pErr) { console.error(pErr); return { fehler: pErr }; }

  for (const row of (personen || [])) {
    const sd = row.stammbaum_daten || {};
    const neu = { ...sd };
    if (sd.surname) neu.surname = sd.surname.split(falsch).join(richtig);
    if (sd.name)    neu.name    = sd.name.split(falsch).join(richtig);
    const { error: uErr } = await sbClient.from('personen')
      .update({ stammbaum_daten: neu, stammbaum_id: zielId }).eq('id', row.id);
    if (uErr) { console.error('Update-Fehler:', uErr); return { fehler: uErr }; }
  }

  // Leeren Tippfehler-Baum löschen (nur wenn wir in einen anderen verschoben haben)
  if (richtigBaum) await sbClient.from('stammbaeume').delete().eq('id', falschBaum.id);

  console.log('%c✅ ' + falsch + ' → ' + richtig + ': ' + (personen || []).length + ' Personen korrigiert.',
    'color:green;font-weight:bold');
  return { ok: true, korrigiert: (personen || []).length };
}
