<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidović — Porodično stablo</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root {
  --bg: #f5ede0; --bg-soft: #ede0cc; --bg-card: #fffaf0;
  --paper: #fffaf0; --paper-soft: #f0e6d3;
  --ink: #2c2418; --akzent: #722f37; --akzent-hell: #9e4050;
  --gold: #9c7c3c; --gold-hell: #b8943f;
  --linie: #c4a882; --male: #3d6080; --female: #8b3d5a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Georgia','Times New Roman',serif;
  background: var(--bg); color: var(--ink); min-height: 100vh;
  padding-top: 58px;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(114,47,55,0.07) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(156,124,60,0.06) 0%, transparent 50%);
}
header {
  text-align: center; padding: 50px 20px 30px;
  border-bottom: 1px solid var(--linie);
}
header h1 {
  font-size: clamp(36px, 6vw, 64px);
  letter-spacing: 8px; font-weight: normal;
  color: var(--akzent); margin-bottom: 10px;
}
header .untertitel { font-style: italic; opacity: 0.7; letter-spacing: 2px; }
header .stats { margin-top: 20px; font-size: 13px; opacity: 0.6; letter-spacing: 2px; }

/* Fixe Navigationsleiste oben */
.top-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: var(--bg); border-bottom: 2px solid var(--linie);
  display: flex; align-items: center; justify-content: center;
  padding: 8px 20px;
  box-shadow: 0 2px 8px rgba(44,36,24,0.08);
}
.nav-controls {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  justify-content: center;
}
.sprach-leiste {
  position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
  display: flex; gap: 4px;
  background: var(--bg-soft); padding: 4px;
  border: 1px solid var(--linie);
}
.sprach-btn {
  background: transparent; color: var(--ink);
  border: none; padding: 6px 12px; cursor: pointer;
  font-family: inherit; font-size: 12px;
  letter-spacing: 1px; text-transform: uppercase;
  transition: all 0.2s;
}
.sprach-btn.aktiv { background: var(--akzent); color: var(--paper); }
.sprach-btn:hover:not(.aktiv) { color: var(--gold); }

.tab-gruppe {
  display: flex; background: var(--bg-soft);
  padding: 4px; border: 1px solid var(--linie);
}
.tab {
  background: transparent; color: var(--ink);
  border: none; padding: 10px 20px; cursor: pointer;
  font-family: inherit; font-size: 13px;
  letter-spacing: 2px; text-transform: uppercase;
  transition: all 0.3s;
}
.tab.aktiv { background: var(--akzent); color: var(--paper); }
.tab:hover:not(.aktiv) { color: var(--akzent); }

.suche, .filter, .upload-btn {
  background: var(--paper); color: var(--ink);
  border: 1px solid var(--linie);
  padding: 10px 15px; font-family: inherit; font-size: 14px;
}
.suche { min-width: 220px; }
.suche:focus, .filter:focus { outline: none; border-color: var(--gold); }
.upload-btn { cursor: pointer; letter-spacing: 1px; }
.upload-btn:hover { background: var(--akzent); border-color: var(--akzent); color: var(--paper); }
#gedcom-input { display: none; }

#ansicht-karten { display: none; max-width: 1400px; margin: 30px auto; padding: 0 20px; }
.personen {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 25px;
}
.person {
  background: var(--paper); color: var(--ink); padding: 18px;
  box-shadow: 0 2px 12px rgba(44,36,24,0.10), 0 0 0 1px rgba(156,124,60,0.3);
  transition: transform 0.25s, box-shadow 0.25s;
  cursor: pointer; position: relative;
}
.person:hover {
  transform: translateY(-4px) rotate(-0.5deg);
  box-shadow: 0 8px 24px rgba(44,36,24,0.15), 0 0 0 1px rgba(114,47,55,0.4);
}
.person.verstorben::before {
  content: '✝'; position: absolute; top: 8px; right: 12px;
  color: var(--akzent); font-size: 18px;
}
.person .avatar {
  width: 100%; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 56px; color: var(--paper);
  margin-bottom: 12px; font-family: serif; overflow: hidden;
}
.person .avatar.male { background: linear-gradient(135deg, var(--male), #2a4a65); }
.person .avatar.female { background: linear-gradient(135deg, var(--female), #6b2840); }
.person .avatar.unknown { background: linear-gradient(135deg, var(--gold), var(--akzent)); }
.person .avatar img { width: 100%; height: 100%; object-fit: cover; }
.person h3 { font-size: 17px; margin-bottom: 3px; }
.person .nachname { color: var(--akzent); font-style: italic; font-size: 13px; }
.person .daten {
  margin-top: 10px; font-size: 12px; color: #666;
  border-top: 1px solid #ddd; padding-top: 8px;
  font-family: 'Courier New', monospace;
}

#ansicht-baum { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
#baum-container {
  /* cover = füllt den Container vollständig; center 25% = Fokus auf die Krone */
  background: url('Bild4.jpg') center 25% / cover no-repeat, var(--bg-soft);
  border: 1px solid var(--linie);
  height: 820px; overflow: hidden; position: relative;
}
/* Gradient-Overlay: Krone kaum überlagert, Stamm/Boden etwas mehr → Personen lesbar */
#baum-bg {
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(20, 15, 5, 0.08)  0%,
    rgba(20, 15, 5, 0.15) 40%,
    rgba(20, 15, 5, 0.35) 75%,
    rgba(20, 15, 5, 0.55) 100%
  );
  pointer-events: none; z-index: 0;
}
#baum-svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: default; z-index: 1; }

.baum-info {
  position: absolute; top: 15px; left: 15px;
  background: rgba(255,250,240,0.96); padding: 12px 18px;
  border: 1px solid var(--linie); font-size: 13px;
  max-width: 320px; z-index: 5;
  box-shadow: 0 2px 10px rgba(44,36,24,0.10);
}
.baum-info strong { color: var(--akzent); }
.baum-zurueck-btn {
  display: block; margin-top: 12px;
  background: none; border: 1px solid var(--akzent);
  color: var(--akzent); cursor: pointer;
  font-family: inherit; font-size: 12px;
  padding: 5px 10px; letter-spacing: 1px;
  transition: all 0.2s;
}
.baum-zurueck-btn:hover { background: var(--akzent); border-color: var(--akzent); color: var(--paper); }
.baum-hinweis { text-align: center; margin-top: 15px; font-size: 13px; opacity: 0.6; font-style: italic; }

.knoten rect { stroke-width: 1.8; cursor: pointer; transition: stroke 0.2s; rx: 2; }
.knoten.male rect   { fill: rgba(221,234,243,0.92); stroke: #4a7fa8; }
.knoten.female rect { fill: rgba(243,221,229,0.92); stroke: #9e4060; }
.knoten.unknown rect { fill: rgba(255,250,240,0.92); stroke: var(--gold); }
.knoten.fokus rect  { stroke: #fff; stroke-width: 3; }
.knoten:hover rect  { stroke: #fff; stroke-width: 2.5; }
/* Schatten damit Boxen sich vom Hintergrundbild abheben */
.knoten { filter: drop-shadow(0 2px 5px rgba(0,0,0,0.55)); }
.knoten text { font-family: 'Georgia', serif; fill: #1a1008; pointer-events: none; }
.knoten .name-text  { font-size: 14px; font-weight: bold; }
.knoten .daten-text { font-size: 11px; fill: #3a2a10; }
/* Verbindungslinien: warm-weißes Leuchten – gut sichtbar auf Grün/Gold */
.verbindung { fill: none; stroke: rgba(255,248,220,0.88); stroke-width: 2.5; }
/* Ehelinien: Gold passend zum Sonnenuntergang im Bild */
.ehe-linie { stroke: #d4a030; stroke-width: 2.5; stroke-dasharray: 6 3; }

.modal {
  display: none; position: fixed; inset: 0;
  background: rgba(44,36,24,0.75); z-index: 100;
  justify-content: center; align-items: center; padding: 20px;
}
.modal.aktiv { display: flex; }
.modal-inhalt {
  background: var(--paper); color: var(--ink);
  max-width: 550px; width: 100%; padding: 40px;
  position: relative; max-height: 90vh; overflow-y: auto;
}
.modal-schliessen {
  position: absolute; top: 12px; right: 18px;
  background: none; border: none; font-size: 28px;
  cursor: pointer; color: var(--ink);
}
.modal h2 { color: var(--akzent); margin-bottom: 6px; font-size: 28px; }
.modal .sub-name { font-style: italic; color: #888; margin-bottom: 20px; }
.modal .info-zeile { margin: 8px 0; padding: 8px 0; border-bottom: 1px solid #ddd; font-size: 14px; }
.modal .info-zeile strong { display: inline-block; min-width: 130px; color: #555; }
.modal .beziehungen { margin-top: 20px; padding-top: 20px; border-top: 2px solid var(--akzent); }
.modal .beziehungen h3 { color: var(--akzent); margin-bottom: 12px; font-size: 16px; letter-spacing: 2px; }
.modal .verwandter {
  display: inline-block; padding: 6px 12px; margin: 4px 6px 4px 0;
  background: var(--paper-soft); border: 1px solid var(--linie);
  cursor: pointer; font-size: 13px; transition: background 0.2s;
}
.modal .verwandter:hover { background: var(--gold-hell); }
.modal .baum-zeigen {
  margin-top: 25px; background: var(--akzent); color: var(--paper);
  border: none; padding: 12px 24px; cursor: pointer;
  font-family: inherit; letter-spacing: 2px;
  text-transform: uppercase; font-size: 13px;
}
.modal .baum-zeigen:hover { background: var(--akzent-hell); }
.modal .zurueck-btn {
  background: none; border: none; color: var(--akzent);
  cursor: pointer; font-family: inherit; font-size: 13px;
  padding: 0 0 14px 0; letter-spacing: 1px; display: block;
}
.modal .zurueck-btn:hover { color: var(--akzent-hell); }

.keine-treffer { text-align: center; padding: 60px 20px; opacity: 0.5; font-style: italic; grid-column: 1 / -1; }

footer {
  text-align: center; padding: 40px 20px;
  opacity: 0.5; font-size: 13px; font-style: italic;
  border-top: 1px solid var(--linie); margin-top: 60px;
}

@media (max-width: 600px) {
  body { padding-top: 0; }
  .top-nav { position: static; padding: 8px 12px; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .sprach-leiste { position: static; transform: none; }
  .nav-controls { gap: 6px; }
  header { padding-top: 20px; }
}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-controls">
    <div class="tab-gruppe">
      <button class="tab" data-ansicht="karten" data-i18n="tab_karten"></button>
      <button class="tab aktiv" data-ansicht="baum" data-i18n="tab_baum"></button>
    </div>
    <input type="text" class="suche" id="suche" data-i18n-placeholder="suche_placeholder">
    <select class="filter" id="filter-nachname"></select>
    <label class="upload-btn" for="gedcom-input" data-i18n="upload_btn"></label>
    <input type="file" id="gedcom-input" accept=".ged">
  </div>
  <div class="sprach-leiste">
    <button class="sprach-btn" data-lang="de">DE</button>
    <button class="sprach-btn" data-lang="sr">SR</button>
    <button class="sprach-btn" data-lang="en">EN</button>
  </div>
</nav>

<header>
  <h1>VIDOVIĆ</h1>
  <p class="untertitel" data-i18n="untertitel"></p>
  <p class="stats" id="header-stats"></p>
</header>

<section id="ansicht-karten">
  <div class="personen" id="personen-grid"></div>
</section>

<section id="ansicht-baum">
  <div id="baum-container">
    <div id="baum-bg"></div>
    <div class="baum-info" id="baum-info"></div>
    <svg id="baum-svg"></svg>
  </div>
  <p class="baum-hinweis" data-i18n="baum_hinweis"></p>
</section>

<div class="modal" id="modal">
  <div class="modal-inhalt" onclick="event.stopPropagation()">
    <button class="modal-schliessen" onclick="schliesseModal()">×</button>
    <div id="modal-text"></div>
  </div>
</div>

<footer>
  <p data-i18n="footer"></p>
</footer>

// ============================================================
// SPRACH-SYSTEM
// ============================================================
let aktuelleSprache = localStorage.getItem('vidovic_lang') || 'sr';
let aktuelleDaten = FAMILY_DATA;
let fokusPersonId = null;
let aktuelleAnsicht = 'baum';
let modalVerlauf = [];
let aktuelleModalPersonId = null;

function t(key, vars = {}) {
  let text = TEXTE[aktuelleSprache][key] || TEXTE.de[key] || key;
  Object.entries(vars).forEach(([k, v]) => {
    text = text.replace(`{${k}}`, v);
  });
  return text;
}

function wechselSprache(lang) {
  aktuelleSprache = lang;
  localStorage.setItem('vidovic_lang', lang);
  document.documentElement.lang = lang;
  
  // Sprach-Button-Status
  document.querySelectorAll('.sprach-btn').forEach(b => {
    b.classList.toggle('aktiv', b.dataset.lang === lang);
  });
  
  // Alle Elemente mit data-i18n übersetzen
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  
  // Dynamische Inhalte neu rendern
  aktualisiereStats();
  baueNachnameFilter();
  zeigeKarten();
  aktualisiereBaumInfo();
}

// ============================================================
// INITIALISIERUNG
// ============================================================
function init() {
  document.querySelectorAll('.sprach-btn').forEach(b => {
    b.addEventListener('click', () => wechselSprache(b.dataset.lang));
  });
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => wechselAnsicht(t.dataset.ansicht));
  });
  document.getElementById('suche').addEventListener('input', handleSuche);
  document.getElementById('filter-nachname').addEventListener('change', zeigeKarten);
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') schliesseModal();
  });
  document.getElementById('gedcom-input').addEventListener('change', handleGedcomUpload);
  
  initBaum();
  wechselSprache(aktuelleSprache);
  wechselAnsicht('baum');
}

function aktualisiereStats() {
  const p = Object.keys(aktuelleDaten.persons).length;
  const f = Object.keys(aktuelleDaten.families).length;
  document.getElementById('header-stats').textContent = t('stats', {p, f});
}

function handleSuche() {
  const suche = document.getElementById('suche').value.trim();
  if (aktuelleAnsicht === 'karten') {
    zeigeKarten();
  } else {
    suchImBaum(suche);
  }
}

function suchImBaum(suche) {
  if (!suche) {
    fokusPersonId = null;
    zeichneBaum('I500009', 10, 0);
    return;
  }

  const treffer = Object.values(aktuelleDaten.persons).filter(p =>
    p.name.toLowerCase().includes(suche.toLowerCase())
  );

  if (treffer.length === 0) {
    document.getElementById('baum-info').innerHTML =
      `<strong style="color:var(--akzent-hell)">${t('keine_treffer')}</strong>`;
    return;
  }

  if (treffer.length === 1) {
    zentriereAufPerson(treffer[0].id);
    return;
  }

  zeigAuswahlDialog(treffer);
}

function zentriereAufPerson(personId) {
  fokusPersonId = personId;
  zeichneBaum(personId, 2, 2);
}

function zeigAuswahlDialog(treffer) {
  const liste = treffer.map(p => {
    const info = [p.birth_date ? '* ' + p.birth_date : '', p.birth_place].filter(Boolean).join(', ');
    return `<span class="verwandter" onclick="waehleAusBaum('${p.id}')">${escapeHtml(p.name)}${info ? ' <small style="color:#888">(' + escapeHtml(info) + ')</small>' : ''}</span>`;
  }).join('');

  document.getElementById('modal-text').innerHTML = `
    <h2>${t('auswahl_titel')}</h2>
    <p class="sub-name">${t('auswahl_hinweis')}</p>
    <div class="beziehungen" style="border-top:none;padding-top:0">${liste}</div>
  `;
  document.getElementById('modal').classList.add('aktiv');
}

function waehleAusBaum(personId) {
  schliesseModal();
  zentriereAufPerson(personId);
}

function aktualisiereBaumInfo() {
  if (fokusPersonId && aktuelleDaten.persons[fokusPersonId]) {
    const p = aktuelleDaten.persons[fokusPersonId];
    document.getElementById('baum-info').innerHTML =
      t('baum_zentriert', {name: escapeHtml(p.name)}) +
      `<button class="baum-zurueck-btn" onclick="zeigVollenBaum()">← ${t('zurueck')}</button>`;
  } else {
    document.getElementById('baum-info').innerHTML = t('baum_info_hinweis');
  }
}

function zeigVollenBaum() {
  fokusPersonId = null;
  zeichneBaum('I500009', 10, 0);
}

function baueNachnameFilter() {
  const nachnamen = {};
  Object.values(aktuelleDaten.persons).forEach(p => {
    const n = p.surname || t('filter_unbekannt');
    nachnamen[n] = (nachnamen[n] || 0) + 1;
  });
  const select = document.getElementById('filter-nachname');
  const aktuell = select.value;
  select.innerHTML = `<option value="">${t('filter_alle')}</option>`;
  Object.entries(nachnamen)
    .sort((a,b) => b[1] - a[1])
    .forEach(([n, c]) => {
      const o = document.createElement('option');
      o.value = n;
      o.textContent = `${n} (${c})`;
      select.appendChild(o);
    });
  if (aktuell) select.value = aktuell;
}

// ============================================================
// KARTEN-ANSICHT
// ============================================================
function zeigeKarten() {
  const suche = document.getElementById('suche').value.toLowerCase();
  const nachname = document.getElementById('filter-nachname').value;
  const grid = document.getElementById('personen-grid');
  
  const gefiltert = Object.values(aktuelleDaten.persons).filter(p => {
    if (suche && !p.name.toLowerCase().includes(suche)) return false;
    if (nachname) {
      const pn = p.surname || t('filter_unbekannt');
      if (pn !== nachname) return false;
    }
    return true;
  }).sort((a,b) => {
    const ja = parseInt(a.birth_date) || 9999;
    const jb = parseInt(b.birth_date) || 9999;
    if (ja !== jb) return ja - jb;
    return a.name.localeCompare(b.name);
  });
  
  if (gefiltert.length === 0) {
    grid.innerHTML = `<div class="keine-treffer">${t('keine_treffer')}</div>`;
    return;
  }
  
  grid.innerHTML = '';
  gefiltert.forEach(p => {
    const karte = document.createElement('div');
    karte.className = 'person' + (p.deceased ? ' verstorben' : '');
    karte.onclick = () => zeigeDetails(p.id);
    
    const initialen = ((p.given[0] || '') + (p.surname[0] || '')).toUpperCase() || '?';
    const avatarKlasse = p.sex === 'M' ? 'male' : (p.sex === 'F' ? 'female' : 'unknown');
    
    let lebensdaten = '';
    if (p.birth_date || p.death_date) {
      lebensdaten = `* ${p.birth_date || '?'}`;
      if (p.deceased || p.death_date) lebensdaten += ` † ${p.death_date || '?'}`;
    }
    
    karte.innerHTML = `
      <div class="avatar ${avatarKlasse}">${initialen}</div>
      <h3>${escapeHtml(p.given || '?')}</h3>
      <p class="nachname">${escapeHtml(p.surname || '')}</p>
      ${lebensdaten ? `<div class="daten">${lebensdaten}</div>` : ''}
      ${p.birth_place ? `<div class="daten">📍 ${escapeHtml(p.birth_place)}</div>` : ''}
    `;
    grid.appendChild(karte);
  });
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// DETAIL-FENSTER
// ============================================================
function zeigeDetails(personId) {
  if (document.getElementById('modal').classList.contains('aktiv') && aktuelleModalPersonId) {
    modalVerlauf.push(aktuelleModalPersonId);
  }
  aktuelleModalPersonId = personId;
  const p = aktuelleDaten.persons[personId];
  if (!p) return;
  
  const eltern = [];
  p.families_child.forEach(famId => {
    const fam = aktuelleDaten.families[famId];
    if (fam) {
      if (fam.husband && aktuelleDaten.persons[fam.husband]) eltern.push(aktuelleDaten.persons[fam.husband]);
      if (fam.wife && aktuelleDaten.persons[fam.wife]) eltern.push(aktuelleDaten.persons[fam.wife]);
    }
  });
  
  const geschwister = [];
  p.families_child.forEach(famId => {
    const fam = aktuelleDaten.families[famId];
    if (fam) {
      fam.children.forEach(cid => {
        if (cid !== personId && aktuelleDaten.persons[cid]) geschwister.push(aktuelleDaten.persons[cid]);
      });
    }
  });
  
  // Ehen mit je Partner und zugehörigen Kindern
  const eheFamilien = [];
  p.families_spouse.forEach(famId => {
    const fam = aktuelleDaten.families[famId];
    if (fam) {
      const partnerId = fam.husband === personId ? fam.wife : fam.husband;
      const partnerPerson = partnerId ? aktuelleDaten.persons[partnerId] : null;
      const famKinder = fam.children.filter(cid => aktuelleDaten.persons[cid]).map(cid => aktuelleDaten.persons[cid]);
      eheFamilien.push({ partner: partnerPerson, kinder: famKinder });
    }
  });

  const buildVerwandte = (liste) => liste.map(v =>
    `<span class="verwandter" onclick="zeigeDetails('${v.id}')">${escapeHtml(v.name)}</span>`
  ).join('');

  const geschlechtText = p.sex === 'M' ? t('maennlich') : (p.sex === 'F' ? t('weiblich') : t('unbekannt'));

  // Ehe-Block: bei mehreren Ehen pro Ehe gruppiert, sonst flach
  const eheHtml = eheFamilien.length > 1
    ? eheFamilien.map((ef, i) => `
        <div class="beziehungen">
          <h3>${t('partner')} ${i + 1}</h3>
          ${ef.partner ? `<span class="verwandter" onclick="zeigeDetails('${ef.partner.id}')">${escapeHtml(ef.partner.name)}</span>` : ''}
          ${ef.kinder.length ? `<div style="margin-top:8px"><strong style="font-size:12px;color:#777;letter-spacing:1px">${t('kinder')}:</strong><br>${buildVerwandte(ef.kinder)}</div>` : ''}
        </div>`).join('')
    : `${eheFamilien[0]?.partner ? `<div class="beziehungen"><h3>${t('partner')}</h3>${`<span class="verwandter" onclick="zeigeDetails('${eheFamilien[0].partner.id}')">${escapeHtml(eheFamilien[0].partner.name)}</span>`}</div>` : ''}
       ${eheFamilien[0]?.kinder?.length ? `<div class="beziehungen"><h3>${t('kinder')}</h3>${buildVerwandte(eheFamilien[0].kinder)}</div>` : ''}`;

  document.getElementById('modal-text').innerHTML = `
    ${modalVerlauf.length > 0 ? `<button class="zurueck-btn" onclick="geheZurueck()">← ${t('zurueck')}</button>` : ''}
    <h2>${escapeHtml(p.given || '?')}</h2>
    <p class="sub-name">${escapeHtml(p.surname || '')}</p>

    ${p.birth_date ? `<div class="info-zeile"><strong>${t('geboren')}</strong> ${escapeHtml(p.birth_date)}</div>` : ''}
    ${p.birth_place ? `<div class="info-zeile"><strong>${t('geburtsort')}</strong> ${escapeHtml(p.birth_place)}</div>` : ''}
    ${p.deceased || p.death_date ? `<div class="info-zeile"><strong>${t('verstorben')}</strong> ${escapeHtml(p.death_date || t('ja'))}</div>` : ''}
    ${p.death_place ? `<div class="info-zeile"><strong>${t('sterbeort')}</strong> ${escapeHtml(p.death_place)}</div>` : ''}
    <div class="info-zeile"><strong>${t('geschlecht')}</strong> ${geschlechtText}</div>

    ${eltern.length ? `<div class="beziehungen"><h3>${t('eltern')}</h3>${buildVerwandte(eltern)}</div>` : ''}
    ${eheHtml}
    ${geschwister.length ? `<div class="beziehungen"><h3>${t('geschwister')}</h3>${buildVerwandte(geschwister)}</div>` : ''}

    <button class="baum-zeigen" onclick="schliesseModalUndZeigeBaum('${p.id}')">${t('baum_zeigen')}</button>
  `;
  document.getElementById('modal').classList.add('aktiv');
}

function schliesseModal() {
  document.getElementById('modal').classList.remove('aktiv');
  modalVerlauf = [];
  aktuelleModalPersonId = null;
}

function geheZurueck() {
  if (modalVerlauf.length > 0) {
    const vorherige = modalVerlauf.pop();
    aktuelleModalPersonId = null;
    zeigeDetails(vorherige);
  }
}

function schliesseModalUndZeigeBaum(personId) {
  schliesseModal();
  fokusPersonId = personId;
  wechselAnsicht('baum');
  zeichneBaum(personId);
}

function wechselAnsicht(name) {
  aktuelleAnsicht = name;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('aktiv', t.dataset.ansicht === name);
  });
  document.getElementById('ansicht-karten').style.display = name === 'karten' ? 'block' : 'none';
  document.getElementById('ansicht-baum').style.display = name === 'baum' ? 'block' : 'none';

  if (name === 'baum') {
    const suche = document.getElementById('suche').value.trim();
    if (suche) {
      suchImBaum(suche);
    } else if (!fokusPersonId) {
      zeichneBaum('I500009', 10, 0);
    }
  }
}

// ============================================================
// STAMMBAUM (d3.js)
// ============================================================
let baumSvg, baumG, zoom;

function initBaum() {
  baumSvg = d3.select('#baum-svg');
  baumG = baumSvg.append('g');

  // Pan komplett deaktiviert – nur Scroll-Zoom erlaubt
  zoom = d3.zoom()
    .scaleExtent([0.1, 6])
    .filter(() => false) // alle Standard-Events deaktiviert
    .on('zoom', e => baumG.attr('transform', e.transform));
  baumSvg.call(zoom);

  // Scroll-Zoom zentriert auf die Baumkrone
  baumSvg.node().addEventListener('wheel', function(event) {
    event.preventDefault();
    const rect = this.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height * 0.35; // Kronenmitte vertikal
    const factor = event.deltaY < 0 ? 1.15 : 0.87;
    zoom.scaleBy(d3.select(this), factor, [cx, cy]);
  }, { passive: false });
}

function zeichneBaum(rootPersonId, tiefeUnten = 2, tiefeOben = 2) {
  baumG.selectAll('*').remove();

  const wurzel = baueBaumDaten(rootPersonId, tiefeUnten, tiefeOben);
  if (!wurzel) return;
  
  const containerB = document.getElementById('baum-container').getBoundingClientRect();
  const breite = containerB.width;
  const hoehe = containerB.height;
  
  // Mehr horizontaler Platz: Mehrehe-Paare brauchen Platz nebeneinander
  const treeLayout = d3.tree().nodeSize([200, 120]);
  const wurzelNode = d3.hierarchy(wurzel);
  treeLayout(wurzelNode);

  // y-Koordinaten negieren → Baum wächst von unten nach oben
  wurzelNode.each(d => { d.y = -d.y; });

  // Eltern-Kind-Linien: bei Mehrehe L-Pfad zum Ehe-Bindepunkt
  baumG.selectAll('.verbindung')
    .data(wurzelNode.links())
    .enter().append('path')
    .attr('class', 'verbindung')
    .attr('d', link => {
      const src = link.source;
      const tgt = link.target;
      if (src.data.marriages && src.data.marriages.length >= 2) {
        const famIdx = tgt.data.familyIndex ?? 0;
        // Bindepunkt: links für Ehe 0 (−65), rechts für Ehe 1 (+65)
        const tieX = src.x + (famIdx === 0 ? -63 : 63);
        // Elternteil liegt UNTER dem Kind (größeres y), daher Richtung umgekehrt
        const srcY = src.y - 26;  // Oberkante Elternbox (Richtung Kind)
        const tgtY = tgt.y + 26;  // Unterkante Kindbox (Richtung Elternteil)
        const midY = srcY + (tgtY - srcY) * 0.45;
        return `M ${tgt.x},${tgtY} V ${midY} H ${tieX} V ${srcY}`;
      }
      return d3.linkVertical().x(d => d.x).y(d => d.y)(link);
    });
  
  // Knoten: Hauptperson + ggf. Partner als zweite Box daneben
  const knoten = baumG.selectAll('.knoten')
    .data(wurzelNode.descendants())
    .enter().append('g')
    .attr('class', d => {
      const fokus = d.data.person.id === rootPersonId ? ' fokus' : '';
      return 'knoten-gruppe' + fokus;
    })
    .attr('transform', d => `translate(${d.x},${d.y})`);
  
  // === Hauptperson + alle Partner zeichnen ===
  knoten.each(function(d) {
    const g = d3.select(this);
    const p = d.data.person;

    if (d.data.marriages && d.data.marriages.length >= 2) {
      // Mehrehe: Frau1 LINKS — Mann MITTE — Frau2 RECHTS
      const wife1 = d.data.marriages[0].partner;
      const wife2 = d.data.marriages[1].partner;

      // Ehe-Linien: Mann-Mitte zu je einer Frau
      if (wife1) g.append('line').attr('class', 'ehe-linie')
        .attr('x1', -5).attr('y1', 0).attr('x2', -120).attr('y2', 0);
      if (wife2) g.append('line').attr('class', 'ehe-linie')
        .attr('x1', 5).attr('y1', 0).attr('x2', 120).attr('y2', 0);

      zeichneKnotenBox(g, p, 0, p.id === rootPersonId);       // Mann in der Mitte
      if (wife1) zeichneKnotenBox(g, wife1, -126, false);     // 1. Frau links
      if (wife2) zeichneKnotenBox(g, wife2, 126, false);      // 2. Frau rechts

    } else {
      // Eine Ehe oder keine: bisherige Logik
      const partners = d.data.partners;
      const N = partners.length;
      const offset = i => -63 * N + 126 * i;

      for (let i = 0; i < N; i++) {
        g.append('line').attr('class', 'ehe-linie')
          .attr('x1', offset(i) + 61).attr('y1', 0)
          .attr('x2', offset(i + 1) - 61).attr('y2', 0);
      }

      zeichneKnotenBox(g, p, offset(0), p.id === rootPersonId);
      partners.forEach((partner, i) => {
        zeichneKnotenBox(g, partner, offset(i + 1), false);
      });
    }
  });
  
  // Baum in Kronenbereich einpassen (15–85% Breite, 10–62% Höhe)
  const crownL = breite * 0.15, crownR = breite * 0.85;
  const crownT = hoehe * 0.10,  crownB = hoehe * 0.62;
  const crownW = crownR - crownL, crownH = crownB - crownT;

  const allX = wurzelNode.descendants().map(d => d.x);
  const allY = wurzelNode.descendants().map(d => d.y);
  // Puffer für Partner-Boxen (±126 Offset + ±60 Hälfte der Kartenbreite)
  const tXMin = Math.min(...allX) - 186;
  const tXMax = Math.max(...allX) + 186;
  const tYMin = Math.min(...allY) - 26;
  const tYMax = Math.max(...allY) + 26;
  const tW = tXMax - tXMin, tH = tYMax - tYMin;

  const skala = Math.min(crownW / tW, crownH / tH, 2.5);
  const tx = crownL + (crownW - tW * skala) / 2 - tXMin * skala;
  const ty = crownT + (crownH - tH * skala) / 2 - tYMin * skala;
  baumSvg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(skala));
  
  aktualisiereBaumInfo();
}

// Hilfsfunktion: Zeichnet eine Personen-Box an Position xOffset
function zeichneKnotenBox(g, p, xOffset, istFokus) {
  const sex = p.sex;
  const klasse = sex === 'M' ? 'male' : (sex === 'F' ? 'female' : 'unknown');
  const fokusKlasse = istFokus ? ' fokus' : '';
  
  const box = g.append('g')
    .attr('class', 'knoten ' + klasse + fokusKlasse)
    .attr('transform', `translate(${xOffset},0)`)
    .style('cursor', 'pointer')
    .on('click', () => zeigeDetails(p.id));
  
  box.append('rect')
    .attr('x', -60).attr('y', -26)
    .attr('width', 120).attr('height', 52);

  const gn = p.given || '?';
  box.append('text').attr('class', 'name-text')
    .attr('text-anchor', 'middle').attr('y', -10)
    .text(gn.length > 14 ? gn.substring(0, 12) + '…' : gn);

  const sn = p.surname || '';
  box.append('text').attr('class', 'name-text')
    .attr('text-anchor', 'middle').attr('y', 6)
    .text(sn.length > 14 ? sn.substring(0, 12) + '…' : sn);

  if (p.birth_date || p.death_date) {
    let dat = p.birth_date ? '* ' + p.birth_date : '';
    if (p.deceased || p.death_date) dat += (dat ? '  ' : '') + '† ' + (p.death_date || '?');
    box.append('text').attr('class', 'daten-text')
      .attr('text-anchor', 'middle').attr('y', 20)
      .text(dat);
  }
}

function baueBaumDaten(rootId, tiefeNachUnten = 2, tiefeNachOben = 2) {
  /* Baut einen Baum auf, in dem jeder Knoten EINE Person ist,
     und Partner als zusätzliches Feld 'partner' angehängt werden.
     So zeigen wir Ehefrauen UND Ehemänner sichtbar. */
  if (!aktuelleDaten.persons[rootId]) return null;
  
  function findeWurzel(personId, tiefe) {
    if (tiefe <= 0) return personId;
    const p = aktuelleDaten.persons[personId];
    if (!p || !p.families_child.length) return personId;
    const fam = aktuelleDaten.families[p.families_child[0]];
    if (!fam) return personId;
    // Bevorzugt männliche Linie für die Wurzel-Suche (klassische Stammbaum-Konvention),
    // aber wenn kein Vater, dann Mutter
    const elternId = fam.husband || fam.wife;
    if (!elternId || !aktuelleDaten.persons[elternId]) return personId;
    return findeWurzel(elternId, tiefe - 1);
  }
  
  const wurzelId = findeWurzel(rootId, tiefeNachOben);
  const besucht = new Set();
  
  function baueKnoten(personId, tiefe) {
    if (besucht.has(personId)) return null;
    besucht.add(personId);
    
    const p = aktuelleDaten.persons[personId];
    if (!p) return null;
    
    // Alle Ehen mit Partner und Kinder-IDs aufbauen
    const familien = [];
    p.families_spouse.forEach(famId => {
      const fam = aktuelleDaten.families[famId];
      if (!fam) return;
      const partnerId = fam.husband === personId ? fam.wife : fam.husband;
      const partner = (partnerId && aktuelleDaten.persons[partnerId] && !besucht.has(partnerId))
        ? aktuelleDaten.persons[partnerId] : null;
      if (partner) besucht.add(partnerId);
      familien.push({ partner, kinderIds: fam.children || [] });
    });

    const partners = familien.map(f => f.partner).filter(Boolean);
    // marriages nur bei ≥2 Ehen gesetzt → steuert Mehrehe-Rendering
    const marriages = familien.length >= 2
      ? familien.map(f => ({ partner: f.partner }))
      : null;

    const knoten = { person: p, partners, marriages, familyIndex: null, children: [] };

    if (tiefe <= 0) return knoten;

    if (familien.length >= 2) {
      // Mehrehe: Kinder nach Familie geordnet (Familie 0 zuerst → d3 positioniert links)
      familien.forEach((fam, famIdx) => {
        fam.kinderIds.forEach(cid => {
          const kindKnoten = baueKnoten(cid, tiefe - 1);
          if (kindKnoten) {
            kindKnoten.familyIndex = famIdx;
            knoten.children.push(kindKnoten);
          }
        });
      });
    } else {
      // Eine Ehe oder keine: Kinder normal sammeln
      const kinderIds = new Set();
      familien.forEach(fam => fam.kinderIds.forEach(c => kinderIds.add(c)));
      kinderIds.forEach(cid => {
        const kindKnoten = baueKnoten(cid, tiefe - 1);
        if (kindKnoten) knoten.children.push(kindKnoten);
      });
    }

    return knoten;
  }
  
  return baueKnoten(wurzelId, tiefeNachOben + tiefeNachUnten);
}

// ============================================================
// GEDCOM-UPLOAD
// ============================================================
function handleGedcomUpload(event) {
  const datei = event.target.files[0];
  if (!datei) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const geparst = parseGedcom(e.target.result);
      aktuelleDaten = geparst;
      fokusPersonId = null;
      baueNachnameFilter();
      aktualisiereStats();
      zeigeKarten();
      const p = Object.keys(geparst.persons).length;
      const f = Object.keys(geparst.families).length;
      alert(t('upload_erfolg', {p, f}));
    } catch (err) {
      alert(t('upload_fehler') + err.message);
    }
  };
  reader.readAsText(datei, 'UTF-8');
}

function parseGedcom(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const persons = {};
  const families = {};
  let curId = null, curType = null, curSub = null;
  
  for (const line of lines) {
    const parts = line.split(' ');
    const level = parts[0];
    
    if (level === '0') {
      const m = line.match(/^0\s+@(\w+)@\s+(\w+)/);
      if (m) {
        curId = m[1]; curType = m[2]; curSub = null;
        if (curType === 'INDI') {
          persons[curId] = {
            id: curId, name: '', given: '', surname: '', sex: '',
            birth_date: '', birth_place: '', death_date: '', death_place: '',
            deceased: false, families_spouse: [], families_child: []
          };
        } else if (curType === 'FAM') {
          families[curId] = {
            id: curId, husband: null, wife: null, children: [],
            marriage_date: '', marriage_place: ''
          };
        }
      } else { curId = null; curType = null; }
    } else if (!curId) {
      continue;
    } else if (level === '1') {
      const tag = parts[1];
      const value = parts.slice(2).join(' ');
      curSub = tag;
      if (curType === 'INDI') {
        const p = persons[curId];
        if (tag === 'NAME') {
          const m = value.match(/(.*?)\/(.*?)\//);
          if (m) {
            p.given = m[1].trim(); p.surname = m[2].trim();
            p.name = `${p.given} ${p.surname}`.trim();
          } else { p.name = value.trim(); }
        } else if (tag === 'SEX') { p.sex = value.trim(); }
        else if (tag === 'DEAT') { p.deceased = true; }
        else if (tag === 'FAMS') { const m = value.match(/@(\w+)@/); if (m) p.families_spouse.push(m[1]); }
        else if (tag === 'FAMC') { const m = value.match(/@(\w+)@/); if (m) p.families_child.push(m[1]); }
      } else if (curType === 'FAM') {
        const f = families[curId];
        if (tag === 'HUSB') { const m = value.match(/@(\w+)@/); if (m) f.husband = m[1]; }
        else if (tag === 'WIFE') { const m = value.match(/@(\w+)@/); if (m) f.wife = m[1]; }
        else if (tag === 'CHIL') { const m = value.match(/@(\w+)@/); if (m) f.children.push(m[1]); }
      }
    } else if (level === '2') {
      const tag = parts[1];
      const value = parts.slice(2).join(' ');
      if (curType === 'INDI') {
        const p = persons[curId];
        if (curSub === 'BIRT') {
          if (tag === 'DATE') p.birth_date = value.trim();
          else if (tag === 'PLAC') p.birth_place = value.trim();
        } else if (curSub === 'DEAT') {
          if (tag === 'DATE') p.death_date = value.trim();
          else if (tag === 'PLAC') p.death_place = value.trim();
        }
      } else if (curType === 'FAM' && curSub === 'MARR') {
        const f = families[curId];
        if (tag === 'DATE') f.marriage_date = value.trim();
        else if (tag === 'PLAC') f.marriage_place = value.trim();
      }
    }
  }
  return { persons, families };
}

init();
