<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="app-version" content="13.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidović — Porodično stablo</title>
<!-- Content-Security-Policy (Defense-in-Depth). Hinweis: script-src braucht 'unsafe-inline',
     weil die App durchgehend Inline-onclick-Handler + einen Inline-<script>-Block nutzt; eine
     strikte (XSS-dichte) CSP erforderte ein Refactoring aller Inline-Handler. Diese Policy
     blockiert dennoch injizierte EXTERNE Skripte, begrenzt Datenabfluss (connect-src) und
     unterbindet Plugins/<object>. (frame-ancestors/X-Frame-Options sind per <meta> nicht
     setzbar -> Klickjacking-Schutz nur über HTTP-Header möglich, auf GitHub Pages nicht.) -->
<!-- Leaflet-Karte: style-src braucht cdn.jsdelivr.net (leaflet.css), img-src die OSM-Tile-Server
     (*.tile.openstreetmap.org), connect-src Nominatim (Ortssuche/Geocoding, fetch). Marker sind
     CSS-DivIcons (kein externes Marker-Bild) -> keine weitere img-Quelle nötig. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.supabase.co https://*.tile.openstreetmap.org; media-src 'self' blob: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org; frame-src 'self' blob: https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- CDN-Skripte auf EXAKTE Versionen gepinnt + Subresource Integrity (Lieferketten-Schutz).
     Versionswechsel erfordert neuen integrity-Hash (sonst lädt der Browser die Datei nicht). -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
        integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0/dist/umd/supabase.js"
        integrity="sha384-CQbEv3UOeYwlaBLdPF5KqEagCP39Q1KpvJC6Gwa3UGjZAwMvpA+0TFxSSnrgb4MX"
        crossorigin="anonymous"></script>
<!-- PDF-/Druck-Export (nur für den Stammbaum-Export). jsPDF zuerst, dann svg2pdf
     (svg2pdf erweitert die jsPDF-Instanz um .svg()). Exakt gepinnt + SRI. -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"
        integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.1/dist/svg2pdf.umd.min.js"
        integrity="sha384-B3l2uNxzGBflyDLbL7qqONJYng+5kJd6tDEXetlgRA6b68u6pgeZYBRH5UAYiBZ3"
        crossorigin="anonymous"></script>
<!-- marked (Markdown -> HTML) NUR für die mehrsprachigen Lebensgeschichten. Vom User
     freigegeben. Exakt gepinnt + SRI (sha384), wie d3/jsPDF/svg2pdf. Output wird IMMER per
     geschCleanElement (Whitelist-Sanitizer im Haupt-Script) nachgesäubert, nie ungefiltert ins DOM. -->
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.5/lib/marked.umd.min.js"
        integrity="sha384-MU0bL51BF1u980ujv+Pk0Z0qCjhzfBIEHIFPkUq81289nkiAr+q1jSxEkdlIeHLJ"
        crossorigin="anonymous"></script>
<!-- Leaflet (Karten-Ansicht + Geocoding-Editor). Nur für die Event-Karte. OpenStreetMap-Tiles,
     KEIN API-Key (passt zu GitHub Pages). Exakt gepinnt + offizielle Leaflet-SRI-Hashes (sha256). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"></script>
<link rel="stylesheet" href="stammbaum.css?v=13.0">
</head>
<body>

<nav class="top-nav">
  <div class="nav-controls">
    <div class="tab-gruppe">
      <button class="tab" data-ansicht="karten" data-i18n="tab_karten"></button>
      <button class="tab" id="tab-shorts" data-ansicht="shorts" data-i18n="tab_shorts"></button>
      <button class="tab aktiv" data-ansicht="baum" data-i18n="tab_baum"></button>
    </div>
    <input type="text" class="suche" id="suche" inputmode="search" enterkeyhint="search" autocomplete="off" data-i18n-placeholder="suche_placeholder">
    <select class="filter" id="tree-select" title="Stammbaum wählen" onchange="waehleStammbaum(this.value)"></select>

    <!-- Chat — Icon-Button direkt in der Leiste (zwischen Stammbaum-Dropdown und Benutzer).
         Nur eingeloggt sichtbar (Steuerung in aktualisiereAuthUI). Schließen/Öffnen wie gehabt. -->
    <button class="chat-nav-btn" id="chat-nav-btn" type="button" onclick="oeffneChat()"
            data-i18n-title="chat_menu" data-i18n-aria="chat_menu" aria-label="Chat" style="display:none">
      <svg class="chat-nav-ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <!-- hintere Sprechblase -->
        <path d="M3 6.2A2.2 2.2 0 0 1 5.2 4h8.6A2.2 2.2 0 0 1 16 6.2v3.6A2.2 2.2 0 0 1 13.8 12H8.5L5 14.6V12h-.3A2.2 2.2 0 0 1 3 9.8z"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <!-- Punkte in der hinteren Blase -->
        <circle cx="6.5" cy="8" r="0.95" fill="currentColor"/>
        <circle cx="9.5" cy="8" r="0.95" fill="currentColor"/>
        <circle cx="12.5" cy="8" r="0.95" fill="currentColor"/>
        <!-- vordere Sprechblase (Gold-Akzent) -->
        <path d="M10 13.4A1.9 1.9 0 0 1 11.9 11.5h6.9A1.9 1.9 0 0 1 20.7 13.4v3.1A1.9 1.9 0 0 1 18.8 18.4H18v2.3l-3-2.3h-3.1A1.9 1.9 0 0 1 10 16.5z"
              fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="obav-badge chat-nav-badge" id="chat-nav-badge" style="display:none"></span>
    </button>

    <!-- Anmelden / Benutzer — direkt in der Leiste -->
    <div class="auth-bereich" id="auth-bereich">
      <button class="anmelden-btn" id="anmelden-btn" data-i18n="anmelden" onclick="zeigeLoginModal()"></button>
      <div class="user-badge" id="user-badge" style="display:none">
        <span class="user-name" id="user-name" onclick="toggleAvatarMenu(event)" style="cursor:pointer"></span>
        <span class="user-email" id="user-email"></span>
        <span class="user-rolle" id="user-rolle"></span>
        <!-- Zentraler Einstieg: Avatar öffnet ein Menü (Obavještenja + Profil bearbeiten) -->
        <div class="avatar-menu" id="avatar-menu">
          <button class="profil-icon-btn" id="profil-icon-btn" type="button" onclick="toggleAvatarMenu(event)"
                  aria-haspopup="true" aria-expanded="false" aria-label="Menü">
            <img class="user-avatar" id="user-avatar" alt="">
            <span class="obav-badge avatar-obav-badge" id="avatar-obav-badge" style="display:none"></span>
          </button>
          <div class="avatar-menu-panel" id="avatar-menu-panel">
            <button class="account-btn" type="button" id="avatar-obav-btn" onclick="oeffneObavZentral()">
              <span data-i18n="obav_zentral_titel"></span><span class="obav-badge" id="avatar-menu-obav-badge" style="display:none"></span>
            </button>
            <button class="account-btn" type="button" data-i18n="prof_bearbeiten" onclick="oeffneProfilAusMenu()"></button>
            <button class="account-btn" type="button" id="menu-standard-btn" data-i18n="std_menu" onclick="oeffneStandardBaumAusMenu()" style="display:none"></button>
            <button class="account-btn" type="button" data-i18n="prof_privacy_titel" onclick="oeffnePrivatnost()"></button>
            <button class="account-btn" type="button" data-i18n="prof_pw_titel" onclick="oeffnePasswort()"></button>
            <button class="account-btn" type="button" data-i18n="sec_titel" onclick="oeffneSicherheit()"></button>
            <button class="account-btn avatar-menu-abmelden" type="button" data-i18n="abmelden" onclick="abmeldenAusMenu()"></button>
          </div>
        </div>
      </div>
      <button class="account-btn" id="account-btn" data-i18n="account_anlegen" onclick="zeigeRegistrierModal()"></button>
    </div>

    <!-- Sprach-Dropdown — in der Leiste zwischen Profil und ⚙ Einstellungen -->
    <div class="sprach-dropdown" id="sprach-dropdown">
      <button class="sprach-toggle" id="sprach-toggle" aria-haspopup="listbox" aria-expanded="false">
        <span class="flagge" id="aktive-flagge"></span>
        <span id="aktive-sprache"></span>
        <span class="pfeil">▾</span>
      </button>
      <ul class="sprach-menu" id="sprach-menu" role="listbox"></ul>
    </div>

    <!-- Einstellungs-Dropdown: NUR administrative Funktionen (nur für Admins sichtbar) -->
    <div class="nav-menu" id="nav-menu" style="display:none">
      <button class="nav-menu-toggle" id="nav-menu-toggle" onclick="toggleNavMenu(event)"
              aria-haspopup="true" aria-expanded="false" aria-label="Admin-Einstellungen">
        <span class="nav-menu-icon">⚙</span><span class="pfeil">▾</span>
      </button>
      <div class="nav-menu-panel" id="nav-menu-panel">

        <!-- Admin-Einstellungen (nur Admins) -->
        <div class="admin-bereich" id="admin-bereich" style="display:none">
          <div class="admin-titel" data-i18n="admin_einstellungen"></div>
          <button class="account-btn" id="menu-mv-btn" data-i18n="mv_titel" onclick="zeigeMitglieder()"></button>
          <button class="account-btn" id="menu-add-btn" data-i18n="mv_add_titel" onclick="zeigeMitgliedHinzufuegen()"></button>
          <button class="account-btn" type="button" id="baum-anlegen-btn" data-i18n="admin_baum_anlegen" onclick="zeigeBaumNeu()"></button>
          <button class="account-btn admin-danger" type="button" id="baum-loeschen-btn" data-i18n="admin_baum_loeschen" onclick="loescheStammbaum()"></button>
          <button class="account-btn" type="button" id="menu-merge-btn" data-i18n="merge_titel" onclick="zeigeMergeModal()" style="display:none"></button>
          <button class="account-btn" type="button" id="menu-gp-btn" data-i18n="gp_verknuepfen_titel" onclick="zeigeGleichePersonModal()" style="display:none"></button>
          <button class="account-btn" type="button" id="menu-bereinigung-btn" data-i18n="ber_titel" onclick="zeigeBereinigungModal()" style="display:none"></button>
          <button class="account-btn" type="button" id="menu-integ-btn" data-i18n="integ_menu" onclick="oeffneIntegritaet()"></button>
          <button class="account-btn admin-bald" type="button" disabled data-i18n="admin_weitere"></button>
        </div>

        <!-- Podešavanje porodice: für Owner/Admin (bearbeiten) UND Mitglieder (nur lesen) -->
        <div class="porodica-bereich" id="porodica-bereich" style="display:none">
          <button class="account-btn" type="button" id="menu-fameinst-btn" data-i18n="admin_familieneinst" onclick="oeffneFamilieEinstellungen()"></button>
        </div>

        <!-- Profileinstellungen: für ALLE eingeloggten Nutzer -->
        <div class="profil-bereich" id="profil-bereich" style="display:none">
          <button class="account-btn" type="button" id="menu-profil-btn" data-i18n="prof_menu" onclick="oeffneProfil()"></button>
        </div>

        <!-- GEDCOM (Admin) -->
        <label class="upload-btn" for="gedcom-input" data-i18n="upload_btn"></label>
        <input type="file" id="gedcom-input" accept=".ged">
      </div>
    </div>
  </div>
</nav>

<header>
  <h1>VIDOVIĆ</h1>
  <p class="untertitel" data-i18n="untertitel"></p>
  <p class="stats" id="header-stats"></p>
  <!-- Live-Indikator (P2): wer bearbeitet gerade denselben Stammbaum (Presence) -->
  <div class="presence-indikator" id="presence-indikator" style="display:none">
    <button class="presence-toggle" id="presence-toggle" type="button" aria-haspopup="true" aria-expanded="false" onclick="togglePresencePanel(event)">
      <span class="presence-dot"></span>
      <span class="presence-text" id="presence-text"></span>
    </button>
    <div class="presence-panel" id="presence-panel"></div>
  </div>
</header>

<!-- Hinweis, solange nicht eingeloggt (Stammbaum ist privat) -->
<section id="login-hinweis" style="display:none">
  <div class="login-hinweis-box">
    <h2 data-i18n="login_hinweis_titel"></h2>
    <p data-i18n="login_hinweis_text"></p>
    <div class="login-hinweis-actions">
      <button class="login-hinweis-btn" data-i18n="anmelden" onclick="zeigeLoginModal()"></button>
      <button class="login-hinweis-btn sekundaer" data-i18n="account_anlegen" onclick="zeigeRegistrierModal()"></button>
    </div>
  </div>
</section>

<!-- Lade-Hinweis: zwischen Login und erstem Supabase-Laden sichtbar, damit NICHT das
     eingebettete FAMILY_DATA (Vidović) kurz aufblitzt, bis die echten Baumdaten da sind. -->
<section id="lade-hinweis" style="display:none">
  <div class="login-hinweis-box">
    <p data-i18n="lade_baum"></p>
  </div>
</section>

<!-- Leer-Zustand: eingeloggt, aber (nach Löschen) KEIN zugänglicher Stammbaum mehr.
     Zentrierter Button öffnet die Stammbaum-Anlage. -->
<section id="kein-baum-hinweis" style="display:none">
  <div class="login-hinweis-box">
    <h2 data-i18n="kein_baum_titel"></h2>
    <p data-i18n="kein_baum_text"></p>
    <div class="login-hinweis-actions">
      <button class="login-hinweis-btn" type="button" onclick="zeigeBaumNeu()" data-i18n="bn_titel"></button>
    </div>
  </div>
</section>

<section id="ansicht-karten">
  <div class="personen" id="personen-grid"></div>
</section>

<!-- EREIGNISSE: EIN Bereich, zwei Ansichten (Liste = Verwaltung | Zeitstrahl = rein lesend).
     Beide teilen DIESELBE Datenquelle (eventsCache aus events_fuer_mich); der Zeitstrahl
     ergänzt clientseitig abgeleitete Lebensdaten aus aktuelleDaten (keine neue RPC/Tabelle). -->
<section id="ansicht-shorts">
  <div class="shorts-header">
    <h2 data-i18n="shorts_titel"></h2>
    <p class="shorts-hinweis" data-i18n="shorts_hinweis"></p>
    <!-- Umschalter (segmented control) — touch-sicher: einfache Buttons, kein Außenklick nötig -->
    <div class="ev-modus" id="ev-modus" role="tablist">
      <button type="button" class="ev-modus-btn aktiv" id="ev-modus-liste" data-ev-modus="liste"
              role="tab" data-i18n="ev_modus_liste" onclick="evSetModus('liste')"></button>
      <button type="button" class="ev-modus-btn" id="ev-modus-zeit" data-ev-modus="zeit"
              role="tab" data-i18n="ev_modus_zeit" onclick="evSetModus('zeit')"></button>
      <button type="button" class="ev-modus-btn" id="ev-modus-karte" data-ev-modus="karte"
              role="tab" data-i18n="ev_modus_karte" onclick="evSetModus('karte')"></button>
    </div>
    <button class="pa-add-btn" id="event-neu-btn" style="display:none;margin:10px auto 0;max-width:280px"
      onclick="zeigeEventNeu()">＋ <span data-i18n="event_neu"></span></button>
  </div>

  <!-- Ansicht A: Liste/Verwaltung (unverändert) -->
  <div id="ev-liste-wrap">
    <div class="shorts-grid" id="shorts-grid"></div>
  </div>

  <!-- Ansicht B: Zeitstrahl (rein lesend, chronologisch) -->
  <div id="ev-zeit-wrap" style="display:none">
    <div class="zs-filter" id="zs-filter">
      <label class="zs-filter-feld"><span data-i18n="zs_filter_person"></span>
        <select id="zs-f-person" class="filter" onchange="zsRender()"></select>
      </label>
      <label class="zs-filter-feld"><span data-i18n="zs_filter_art"></span>
        <select id="zs-f-art" class="filter" onchange="zsRender()"></select>
      </label>
      <label class="zs-filter-feld"><span data-i18n="zs_filter_dekade"></span>
        <select id="zs-f-dekade" class="filter" onchange="zsRender()"></select>
      </label>
    </div>
    <div class="zs-bio-kopf" id="zs-bio-kopf" style="display:none"></div>
    <div class="zs-timeline" id="zs-timeline"></div>
  </div>

  <!-- Ansicht C: Karte (rein lesend; Leaflet/OpenStreetMap). Zwei Modi:
       (a) alle verorteten Events des aktiven Baums, (b) Migrationspfad EINER Person
       (ihre Events chronologisch, Polyline, Start grün/Ende rot). Scope = aktiver Baum. -->
  <div id="ev-karte-wrap" style="display:none">
    <div class="karte-toolbar">
      <div class="karte-modus" id="karte-modus" role="tablist">
        <button type="button" class="karte-modus-btn aktiv" data-karte-modus="alle"
                role="tab" data-i18n="karte_modus_alle" onclick="karteSetModus('alle')"></button>
        <button type="button" class="karte-modus-btn" data-karte-modus="person"
                role="tab" data-i18n="karte_modus_person" onclick="karteSetModus('person')"></button>
      </div>
      <label class="karte-person-feld" id="karte-person-wrap" style="display:none">
        <span data-i18n="karte_filter_person"></span>
        <select id="karte-f-person" class="filter" onchange="karteRender()"></select>
      </label>
    </div>
    <div id="karte-leer" class="keine-treffer" style="display:none"></div>
    <div id="event-karte" class="event-karte"></div>
    <div class="karte-legende" id="karte-legende" style="display:none">
      <span class="karte-leg-item"><span class="karte-leg-dot start"></span><span data-i18n="karte_start"></span></span>
      <span class="karte-leg-item"><span class="karte-leg-dot ende"></span><span data-i18n="karte_ende"></span></span>
    </div>
  </div>
</section>

<section id="ansicht-baum">
  <div id="baum-tree-hinweis" class="baum-tree-hinweis" style="display:none">
    <span id="baum-tree-hinweis-text"></span>
    <span id="baum-tree-hinweis-gen" class="baum-tree-hinweis-gen" style="display:none"></span>
  </div>
  <div id="baum-container">
    <div id="baum-bg"></div>
    <div class="baum-info" id="baum-info"></div>
    <svg id="baum-svg"></svg>
    <button type="button" id="baum-zentrieren-btn" class="baum-zentrieren-btn"
            onclick="zentriereBaumAnsicht()" data-i18n-title="baum_zentrieren"
            data-i18n-aria="baum_zentrieren" aria-label="Stammbaum zentrieren">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="12" y1="1.5" x2="12" y2="5.5" stroke="currentColor" stroke-width="2"/>
        <line x1="12" y1="18.5" x2="12" y2="22.5" stroke="currentColor" stroke-width="2"/>
        <line x1="1.5" y1="12" x2="5.5" y2="12" stroke="currentColor" stroke-width="2"/>
        <line x1="18.5" y1="12" x2="22.5" y2="12" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
      </svg>
    </button>
    <button type="button" id="anlaesse-btn" class="anlaesse-btn" style="display:none"
            onclick="oeffneAnlaesseModal()" data-i18n-title="anl_btn"
            data-i18n-aria="anl_btn" aria-label="Anstehende Anlässe">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <path d="M5 10.5h14v8a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 18.5z"
              fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M12 10.5V7m0 0a2 2 0 1 1 2-2c0 1.2-1 2-2 2m0 0a2 2 0 1 0-2-2c0 1.2 1 2 2 2"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="9" y1="13" x2="9" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="12" y1="13" x2="12" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="15" y1="13" x2="15" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="anlaesse-badge" id="anlaesse-badge">0</span>
    </button>
    <button type="button" id="ansicht-erweitern-btn" class="ansicht-erweitern-btn"
            onclick="oeffneAnsichtModal()" data-i18n-title="ansicht_btn"
            data-i18n-aria="ansicht_btn" aria-label="Erweiterte Ansicht">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <circle cx="12" cy="6" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="6" cy="17" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="17" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 8.6v3.4M12 12h-6v2.4M12 12h6v2.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" id="pdf-export-btn" class="pdf-export-btn"
            onclick="oeffnePdfExport()" data-i18n-title="pdf_btn"
            data-i18n-aria="pdf_btn" aria-label="Stammbaum als PDF exportieren">

<script src="i18n.js?v=13.0"></script>
<script>
// ============================================================
// SUPABASE AUTH
// ============================================================
const SUPABASE_URL  = 'https://tybvzhifvufgvlgjpmyl.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5YnZ6aGlmdnVmZ3ZsZ2pwbXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDIyMDQsImV4cCI6MjA5NTgxODIwNH0.VL1Z5bZN4t73ArS-uKLC1tAkt1yhQqflKJZ7XU5vA5Y';
const sbClient      = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Diagnose-Logging nur lokal (localhost/127.0.0.1/file://). In Produktion (GitHub Pages)
// bleibt es still, damit keine internen Daten (Rollen, Signed-URLs, Storage-Pfade) in die
// Browser-Konsole gelangen. Echte Fehler laufen weiter über console.warn/console.error.
const IST_LOKAL = ['localhost', '127.0.0.1', ''].includes(location.hostname);
function dbg(...args) { if (IST_LOKAL) console.log(...args); }

let aktuellerUser  = null;
let aktuelleRolle  = null;

async function ladeAuth() {
  const { data: { session } } = await sbClient.auth.getSession();
  if (session) await setzeUser(session.user);

  // WICHTIG: Im onAuthStateChange-Callback KEINE weiteren Supabase-Aufrufe
  // synchron/await ausführen — der Callback hält die interne Auth-Sperre.
  // setzeUser()/ladeBaumDaten() rufen sbClient.from(...) auf und würden auf
  // denselben Lock warten -> Deadlock (jeder weitere Request hängt bis F5).
  // Daher: Arbeit per setTimeout aus dem Callback herauslösen (Lock ist dann frei),
  // und nur reagieren, wenn sich der User tatsächlich ändert (nicht bei jedem
  // TOKEN_REFRESHED, das sonst Baum/Overlay mitten in einer Aktion neu lädt).
  sbClient.auth.onAuthStateChange((_event, session) => {
    const neueUserId = session?.user?.id || null;
    setTimeout(() => {
      if (neueUserId) {
        if (!aktuellerUser || aktuellerUser.id !== neueUserId) setzeUser(session.user);
      } else if (aktuellerUser) {
        loescheUser();
      }
    }, 0);
  });
}

// Rang einer Rolle: je höher, desto mehr Rechte. Wird genutzt, um bei
// mehreren Mitgliedschaften (verschiedene Familien) die höchste zu wählen.
const ROLLEN_RANG = {
  super_admin: 4,
  familien_owner: 3,
  familien_admin: 2,
  familien_mitglied: 1
};

async function setzeUser(user) {
  // Login nach Auto-Logout (Inaktivität) -> harter Reload, damit die neueste
  // App-Version geladen wird (kein veralteter Cache). Flag wird einmalig verbraucht.
  if (sessionStorage.getItem('reloadNachLogin')) {
    sessionStorage.removeItem('reloadNachLogin');
    hardReload();
    return;
  }
  aktuellerUser = user;
  baumDatenGeladen = false;   // bis die echten Baumdaten dieses Users geladen sind: Lade-Hinweis (kein Flash)

  // Alle Mitgliedschaften des Users laden (User kann in mehreren Familien sein).
  // KEIN .limit(1) — sonst würde bei mehreren Familien evtl. die falsche
  // (niedrigere) Rolle gewählt. Wir suchen explizit die höchste Rolle.
  const { data, error } = await sbClient
    .from('mitgliedschaften')
    .select('familie_id, rolle')
    .eq('user_id', user.id);

  if (error) {
    console.warn('Fehler beim Laden der Rolle:', error);
  }

  // Aus allen geladenen Zeilen die Rolle mit dem höchsten Rang bestimmen
  // + Rolle je Familie merken (für Standard-Stammbaum-Priorität Owner>Admin).
  let rawRolle = null;
  let besterRang = 0;
  meineRollenProFamilie = {};
  (data || []).forEach(row => {
    if (!row.rolle) return;
    const norm = normalizeRolle(row.rolle);
    const rang = ROLLEN_RANG[norm] || 0;
    if (rang >= besterRang) {
      besterRang = rang;
      rawRolle   = row.rolle;
    }
    if (row.familie_id) {
      const vorhanden = meineRollenProFamilie[row.familie_id];
      if (!vorhanden || (ROLLEN_RANG[norm] || 0) > (ROLLEN_RANG[vorhanden] || 0)) {
        meineRollenProFamilie[row.familie_id] = norm;
      }
    }
  });

  // Fallback NUR für lokale Entwicklung (localhost/127.0.0.1/file://).
  // In Produktion (GitHub Pages) darf der localStorage-Wert NIEMALS die echte
  // DB-Rolle überschreiben — sonst würde jeder User mit leerer DB-Antwort
  // fälschlicherweise als 'super_admin' (o.ä.) angezeigt werden.
  const istLokal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
  if (!rawRolle && istLokal) {
    const debugRolle = localStorage.getItem('debug_rolle');
    if (debugRolle) {
      console.log('Debug-Modus (lokal): Nutze localStorage rolle:', debugRolle);
      rawRolle = debugRolle;
    }
  }

  // In Produktion: Wenn die DB 0 Zeilen lieferte, ist das ein echtes Problem
  // (meist RLS blockiert das Lesen der eigenen Mitgliedschaft) — sichtbar machen.
  if (!rawRolle && !istLokal && (data || []).length === 0) {
    console.warn('Keine Mitgliedschaft für eingeloggten User gelesen — ' +
      'vermutlich RLS-Policy "mitgliedschaften_select". User bleibt ohne Rolle (nur Lesezugriff).');
  }

  aktuelleRolle = rawRolle ? normalizeRolle(rawRolle) : null;
  dbg('aktuelleRolle gesetzt zu:', aktuelleRolle,
    '(raw:', rawRolle, ', Mitgliedschaften:', (data || []).length, ')');

  aktualisiereAuthUI();
  sessLetzteAktivitaet = Date.now();   // Startzeitpunkt für die Inaktivitäts-Messung
  resetInaktivTimer();                 // Inaktivitäts-Überwachung für den eingeloggten Nutzer starten

  // Phase A2: Sobald Session + Rolle stehen, Baum aus Supabase laden (Fallback bleibt FAMILY_DATA)
  // awaiten, damit Aufrufer (z.B. erstelleStammbaum) danach mit aktueller Baumliste arbeiten können.
  // finally: Lade-Hinweis IMMER entfernen + Ansicht einblenden (auch bei Fehler -> kein
  // hängender Spinner; vorher wurde NICHT das eingebettete FAMILY_DATA gezeigt = kein Vidović-Flash).
  try {
    await ladeBaumDaten();
  } finally {
    baumDatenGeladen = true;
    aktualisiereInhaltSichtbarkeit();   // blendet die Ansicht ein (Container jetzt sichtbar)
    // ladeBaumDaten hat ggf. bei noch ausgeblendetem (0-Pixel-)Container gezeichnet ->
    // jetzt die AKTIVE Ansicht (Standard/Voll/…) sichtbar neu zeichnen, damit Fit/Zoom
    // stimmen und der Ausschnitts-Modus erhalten bleibt (nicht der volle Baum von wechselAnsicht).
    if (aktuelleAnsicht === 'baum') rendereAktuelleAnsicht();
  }

  // Live-Sync (P1): Baumänderungen anderer Nutzer ohne Reload empfangen.
  startRealtimeSync();

  // Profil (Konto-Stammdaten + Avatar) laden -> Badge/Presence/Sprache aktualisieren.
  await ladeMeinProfil();

  // Benachrichtigungen (z. B. Event-Einladungen) laden -> Ungelesen-Indikator.
  ladeBenachrichtigungen();
  startBenachrSync();   // + Live-Updates ohne Reload (Realtime)

  // Chat (1:1 + Gruppen, verbundweit): Nutzerliste/Chats laden + Realtime-Channel.
  startChat();

  // Deep-Link aus der Event-Einladungs-Mail (?event=<id>) nach dem Login einlösen.
  verarbeiteEventDeepLink();

  // "Meine Person im Stammbaum": bedingten Verknüpfungs-Hinweis prüfen (nach Baum + Profil).
  pruefeMeinePersonHinweis();
}

function normalizeRolle(rolle) {
  return rolle.toString().trim().toLowerCase().replace(/[\s-]+/g, '_');
}

// Zentrale Admin-Prüfung: nur super_admin und familien_admin dürfen bearbeiten/hochladen
function istAdmin() {
  return ['super_admin', 'familien_owner', 'familien_admin'].includes(normalizeRolle(aktuelleRolle || ''));
}
// Nur der Super-Admin (Betrieb/Wartung) — für GUI-Funktionen, die normalen Nutzern verborgen bleiben.
function istSuperAdmin() {
  return normalizeRolle(aktuelleRolle || '') === 'super_admin';
}

// DEBUG: Hilfsfunction zum Setzen der Debug-Rolle (nur für lokales Testen)
function setDebugRolle(rolle) {
  if (rolle) {
    localStorage.setItem('debug_rolle', rolle);
    console.log('Debug-Rolle gesetzt auf:', rolle, '- Seite neu laden zum Aktivieren');
  } else {
    localStorage.removeItem('debug_rolle');
    console.log('Debug-Rolle gelöscht');
  }
}

function getDebugRolle() {
  return localStorage.getItem('debug_rolle') || 'keine';
}

function loescheUser() {
  aktuellerUser = null;
  aktuelleRolle = null;
  baumDatenGeladen = false;   // nächster Login zeigt erst den Lade-Hinweis (kein FAMILY_DATA-Flash)
  meineRollenProFamilie = {};
  meinProfil = null;     // Profildaten verwerfen (ausgeloggt)
  meinePersonStatus = null;   // "Meine Person"-Status verwerfen (ausgeloggt)
  meineBenachrichtigungen = [];   // Benachrichtigungen verwerfen + Indikator zurücksetzen
  aktualisiereBenachrBadge();

    // Panel für Admins ODER tree-lose User (zum Neu-Anlegen) zeigen

    const istMitglied = rolleNorm === 'familien_mitglied';
    const porodicaBereich = document.getElementById('porodica-bereich');
    if (porodicaBereich) porodicaBereich.style.display = (istAdm || istMitglied) ? '' : 'none';
    // Profileinstellungen: für JEDEN eingeloggten Nutzer (auch lesende Mitglieder).
    const profilBereich = document.getElementById('profil-bereich');
    if (profilBereich) profilBereich.style.display = '';
    // Badge (Avatar + Name) live aktualisieren.

    // Das ⚙-Dropdown: für ALLE eingeloggten Nutzer sichtbar (enthält jetzt mind. die Profileinstellungen).

function aktualisiereInhaltSichtbarkeit() {
  const eingeloggt = !!aktuellerUser;
  aktualisiereKopf();   // Titel/Zahlen passend zum Login-Status
  const hinweis    = document.getElementById('login-hinweis');
  const tabGruppe  = document.querySelector('.tab-gruppe');

  // Eingeloggt, aber die echten Baumdaten sind noch nicht geladen: KEINE Ansicht zeigen
  // (sonst würde das eingebettete FAMILY_DATA = Vidović kurz aufblitzen) -> Lade-Hinweis.
  if (eingeloggt && !baumDatenGeladen) {
    ['ansicht-karten','ansicht-shorts','ansicht-baum'].forEach(id => {
      const el = document.getElementById(id); if (el) el.style.display = 'none';

  }

  // Eingeloggt, aber KEIN zugänglicher Stammbaum (z. B. nach Löschen des letzten Baums):
  // zentrierter „Stammbaum anlegen"-Button statt einer leeren Baum-Ansicht.
  const keinBaum = document.getElementById('kein-baum-hinweis');
  if (eingeloggt && Object.keys(stammbaeumeListe || {}).length === 0) {
    ['ansicht-karten','ansicht-shorts','ansicht-baum'].forEach(id => {
      const el = document.getElementById(id); if (el) el.style.display = 'none';
    });
    if (hinweis)   hinweis.style.display   = 'none';
    if (tabGruppe) tabGruppe.style.display = 'none';
    if (suche)     suche.style.display     = 'none';
    if (treeSel)   treeSel.style.display   = 'none';
    if (keinBaum)  keinBaum.style.display  = 'block';
    return;
  }
  if (keinBaum) keinBaum.style.display = 'none';

  if (eingeloggt) {
    if (hinweis)   hinweis.style.display   = 'none';
    if (tabGruppe) tabGruppe.style.display = '';
    if (suche)     suche.style.display     = '';
    if (treeSel)   treeSel.style.display   = treeSel.options.length ? '' : 'none';

    ['ansicht-karten','ansicht-shorts','ansicht-baum'].forEach(id => {
      const el = document.getElementById(id); if (el) el.style.display = 'none';
    });
    if (tabGruppe) tabGruppe.style.display = 'none';
    if (suche)     suche.style.display     = 'none';
    if (treeSel)   treeSel.style.display   = 'none';
    if (hinweis)   hinweis.style.display   = 'block';
  }
}

// MITGLIEDER-VERWALTUNG (Admins)
// ============================================================
let mvFamilien = {};
let mvAlle = [];
let mvNameZuId = {};
let mvFamilienBaeume = {};       // familie_id -> "Baum1, Baum2" (für das Such-Label)
// Familienauswahl im Verwaltungs-Overlay (getrennt von der Add-Modal-Auswahl)
let mvVerwaltFamilien = {};   // familie_id -> name
let mvVerwaltBaeume = {};      // familie_id -> "Baum1, Baum2" (für das Such-Label)
let mvVerwaltNameZuId = {};   // name(lower) -> familie_id
let mvVerwaltFamilie = null;  // aktuell gewählte Familie

// Such-Label für eine Familie im Porodica-Dropdown: Familienname + (falls abweichend)
// die Namen ihrer Stammbäume. Rollen sind familien-gebunden, aber ein Stammbaum kann
// anders heißen als seine Familie (z. B. ein bei Heirat entstandener Zweigbaum). Da der
// Such-Match über den sichtbaren Optionstext läuft (ssRender -> o.textContent), hängen
// wir die Baum-Namen ans Label, damit die Familie auch über den BAUM-Namen findbar ist.
function familienSuchLabel(name, baumNamen) {
  const fam = nm(name || '');
  const extra = String(baumNamen || '').split(',').map(s => nm(s.trim())).filter(Boolean)
    .filter(b => ssFold(b) !== ssFold(fam));
  const uniq = [...new Set(extra)];
  // Klammern statt Gedankenstrich: macht klar, dass die Bäume zur Familie GEHÖREN
  // (und nicht zwei gleichrangige Familien sind).
  return uniq.length ? `${fam} (${uniq.join(', ')})` : fam;
}
function zeigeMvFehler(msg) {
  document.getElementById('mv-info').style.display = 'none';
  const el = document.getElementById('mv-fehler');
  el.textContent = msg; el.style.display = 'block';
}
async function zeigeMitglieder() {
  if (!istAdmin()) return;
  const menu = document.getElementById('nav-menu'); if (menu) menu.classList.remove('offen');
  document.getElementById('mv-fehler').style.display = 'none';
  document.getElementById('mv-info').style.display = 'none';
  document.getElementById('mv-suche').value = '';
  mvVerwaltFamilie = null;   // bei jedem Öffnen Auswahl zurücksetzen
  document.getElementById('mitglieder-modal').classList.add('aktiv');
  await ladeMitglieder();
}
function schliesseMitglieder() {
  document.getElementById('mitglieder-modal').classList.remove('aktiv');
}
async function ladeMitglieder() {
  const liste = document.getElementById('mv-liste');
  liste.innerHTML = '…';
  // Familienliste UND Mitglieder parallel laden. Die Familienliste kommt aus der
  // berechtigungsbasierten RPC verwaltbare_familien (super_admin = ALLE Familien;
  // owner/admin = eigene) — NICHT mehr aus den Mitglieder-Zeilen abgeleitet, damit
  // auch Familien OHNE (sichtbare) Mitglieder im Dropdown erscheinen.
  const [rFam, rMit] = await Promise.all([
    sbClient.rpc('verwaltbare_familien'),
    sbClient.rpc('mitglieder_verwaltbar')
  ]);
  if (rMit.error) { liste.innerHTML = `<p class="login-fehler" style="display:block">${escapeHtml(rMit.error.message)}</p>`; mvAlle = []; return; }
  mvAlle = rMit.data || [];

  mvVerwaltFamilien = {}; mvVerwaltBaeume = {};
  if (!rFam.error && rFam.data) {
    rFam.data.forEach(f => {
      if (!f.familie_id) return;
      mvVerwaltFamilien[f.familie_id] = f.familie_name;
      mvVerwaltBaeume[f.familie_id] = f.baum_namen || '';
    });
  } else {
    // Fallback (RPC noch nicht eingespielt): wie früher aus den Mitgliedern ableiten.
    if (rFam.error) console.warn('verwaltbare_familien:', rFam.error.message);
    mvAlle.forEach(m => { if (m.familie_id) mvVerwaltFamilien[m.familie_id] = m.familie_name; });
  }
  mvVerwaltNameZuId = {};
  const eintraege = Object.entries(mvVerwaltFamilien)
    .sort((a, b) => nm(a[1] || '').localeCompare(nm(b[1] || '')));
  // <select>-Optionen (value = familie_id) -> bekommt automatisch dieselbe
  // suchbare Dropdown-Funktion wie alle anderen Selects der App. Label inkl.
  // Baum-Namen, damit die Familie auch über einen STAMMBAUM-Namen findbar ist.
  const mvSel = document.getElementById('mv-familie-filter');
  mvSel.innerHTML = eintraege.map(([fid, name]) =>
    `<option value="${escapeHtml(fid)}">${escapeHtml(familienSuchLabel(name, mvVerwaltBaeume[fid]))}</option>`).join('');

  // Auswahl bestimmen: bestehende behalten -> sonst bei genau 1 Familie automatisch
  if (mvVerwaltFamilie && !mvVerwaltFamilien[mvVerwaltFamilie]) mvVerwaltFamilie = null;
  if (!mvVerwaltFamilie && eintraege.length === 1) mvVerwaltFamilie = eintraege[0][0];

  // Dropdown nur zeigen, wenn es etwas zu wählen gibt (>1 Familie)
  document.getElementById('mv-familie-wrap').style.display = (eintraege.length > 1) ? '' : 'none';
  mvSel.value = mvVerwaltFamilie || '';
  macheAlleSelectsSuchbar(document.getElementById('mitglieder-modal'));

  renderMitglieder();
}

// Familie im Such-Dropdown wählen -> Liste neu filtern (value = familie_id)
function mvWaehleFamilie() {
  mvVerwaltFamilie = document.getElementById('mv-familie-filter').value || null;
  renderMitglieder();
}

// Mitgliederliste rendern — ausschließlich die gewählte Familie, ohne super_admin.
function renderMitglieder() {
  const liste   = document.getElementById('mv-liste');
  const aktivEl = document.getElementById('mv-familie-aktiv');
  const filter  = (document.getElementById('mv-suche').value || '').toLowerCase();

  // Keine Familie gewählt -> Hinweis (bei mehreren Familien)
  if (!mvVerwaltFamilie) {
    aktivEl.textContent = '';
    liste.innerHTML = `<p style="color:#8a7a5a">${t('mv_familie_waehlen')}</p>`;
    return;
  }

  aktivEl.textContent = t('mv_familie_aktiv', { name: nm(mvVerwaltFamilien[mvVerwaltFamilie] || '') });

  // Nur Mitglieder DIESER Familie, Super-Admin ausgeblendet
  const inFam = mvAlle.filter(m => m.familie_id === mvVerwaltFamilie && m.rolle !== 'super_admin');
  const gefiltert = inFam.filter(m =>
    !filter
    || (m.email || '').toLowerCase().includes(filter)
    || (m.name  || '').toLowerCase().includes(filter)
    || t('rolle_' + m.rolle).toLowerCase().includes(filter)
  );
  if (gefiltert.length === 0) {
    liste.innerHTML = `<p style="color:#8a7a5a">${t('mv_keine_in_familie')}</p>`;
    return;
  }
  liste.innerHTML = gefiltert.map(m => {
    // Owner ist geschützt: keine Rollenänderung/Deaktivierung/Entfernung über die GUI.
    const istOwner = m.rolle === 'familien_owner';
    // Zugeordnete Namenskarte (aus mitglieder_verwaltbar) bzw. Hinweis "noch keine Person"
    const karteTxt = m.verknuepfte_person_name
      ? `<span class="mv-karte">→ ${escapeHtml(nm(m.verknuepfte_person_name))}${m.verknuepfte_baum ? ` <span class="mv-karte-baum">(${escapeHtml(nm(m.verknuepfte_baum))})</span>` : ''}</span>`
      : `<span class="mv-karte mv-karte-leer">${escapeHtml(t('mv_keine_person'))}</span>`;
    return `
    <div class="mv-row${m.aktiv ? '' : ' inaktiv'}" id="mv-row-${m.user_id}">
      <span class="mv-email">${m.name ? `<strong>${escapeHtml(m.name)}</strong> · ` : ''}${escapeHtml(m.email)}${m.aktiv ? '' : ` <span class="mv-status">${escapeHtml(t('mv_inaktiv'))}</span>`}${karteTxt}</span>
      <button class="mv-toggle" type="button" title="${escapeHtml(t('mv_verknuepfung'))}" onclick="oeffneUserKarte('${m.user_id}')">🔗</button>
      ${istOwner ? `<span class="mv-rolle-text">${escapeHtml(t('rolle_familien_owner'))}</span>` : `
      <select onchange="aendereRolle('${m.mitgliedschaft_id}', this.value)">
        <option value="familien_mitglied" ${m.rolle === 'familien_mitglied' ? 'selected' : ''}>${escapeHtml(t('rolle_familien_mitglied'))}</option>
        <option value="familien_admin" ${m.rolle === 'familien_admin' ? 'selected' : ''}>${escapeHtml(t('rolle_familien_admin'))}</option>
      </select>
      <button class="mv-toggle" onclick="toggleAktiv('${m.mitgliedschaft_id}', ${m.aktiv ? 'false' : 'true'})">${escapeHtml(m.aktiv ? t('mv_deaktivieren') : t('mv_aktivieren'))}</button>
      <button class="mv-del" onclick="entferneMitglied('${m.mitgliedschaft_id}','${escapeHtml(m.email)}')">${escapeHtml(t('mv_entfernen'))}</button>`}
    </div>`;
  }).join('');
  macheAlleSelectsSuchbar(liste);   // neu erzeugte Rollen-Selects suchbar machen
}

function ukSucheDebounce() { if (ukTimer) clearTimeout(ukTimer); ukTimer = setTimeout(ukSuche, 300); }
async function ukSuche() {
  if (!ukState) return;
  const box = document.getElementById('uk-liste');
  const vor  = document.getElementById('uk-vorname').value.trim();
  const nach = document.getElementById('uk-nachname').value.trim();
  const geb  = document.getElementById('uk-geburt').value.trim();
  if (vor.length < 2 && nach.length < 2 && geb.length < 2) {
    box.innerHTML = `<div class="mp-pick-row"><span class="mp-pick-meta">${escapeHtml(t('uk_min_zeichen'))}</span></div>`; return;
  }
  box.innerHTML = `<div class="mp-pick-row"><span class="mp-pick-meta">…</span></div>`;
  const { data, error } = await sbClient.rpc('karten_suche_admin', {
    p_vorname: vor || null, p_nachname: nach || null, p_geburt: geb || null, p_limit: 30, p_offset: 0
  });
  if (!ukState) return;
  if (error) { box.innerHTML = `<div class="mp-pick-row"><span class="mp-pick-meta" style="color:#b33">${escapeHtml(error.message)}</span></div>`; return; }
  ukTreffer = {};
  const liste = data || [];
  if (!liste.length) { box.innerHTML = `<div class="mp-pick-row"><span class="mp-pick-meta">${escapeHtml(t('uk_kein_treffer'))}</span></div>`; return; }
  box.innerHTML = liste.map(r => {
    ukTreffer[r.id] = r;
    const det = [];
    if (r.birth_date) det.push('* ' + escapeHtml(formatDatumLang(r.birth_date) || r.birth_date));
    if (r.baum)       det.push(escapeHtml(trefferBaumLabel(r)));
    if (r.eltern)     det.push(escapeHtml(nm(r.eltern)));
    const belegt = r.belegt_user
      ? (r.belegt_user === ukState.userId
          ? `<div class="uk-badge uk-badge-mein">${escapeHtml(t('uk_belegt_mein'))}</div>`
          : `<div class="uk-badge uk-badge-belegt">${escapeHtml(t('uk_belegt_von', { email: r.belegt_email || '?' }))}</div>`)
      : `<div class="uk-badge uk-badge-frei">${escapeHtml(t('uk_frei'))}</div>`;
    return `<div class="mp-pick-row" data-id="${escapeHtml(r.id)}">
      <div><div class="mp-pick-name">${escapeHtml(nm(r.name || '?'))}</div>
        <div class="mp-pick-meta">${det.join(' · ')}</div>${belegt}</div>
      <button type="button" class="account-btn">${escapeHtml(t('uk_zuweisen'))}</button>
    </div>`;
  }).join('');
}

// Treffer wählen: belegte (fremde) Karte erst nach Warnung mit E-Mail übernehmen.
async function ukWaehle(personId) {
  if (!ukState || !personId) return;
  const r = ukTreffer[personId];
  if (r && r.belegt_user && r.belegt_user !== ukState.userId) {
    const ok = await zeigeBestaetigung(
      t('uk_warnung_belegt', { email: r.belegt_email || '?', name: nm(r.name || '?') }),
      { gefahr: true, jaText: t('uk_uebernehmen') });
    if (!ok) return;
    await ukZuweisen(personId, true);
  } else {
    await ukZuweisen(personId, false);
  }
}
async function ukZuweisen(personId, force) {
  const fehler = document.getElementById('uk-fehler'); fehler.style.display = 'none';
  const info   = document.getElementById('uk-info');   info.style.display = 'none';
  const { data, error } = await sbClient.rpc('karte_user_zuweisen',
    { p_person: personId, p_user: ukState.userId, p_force: !!force });
  if (error) { fehler.textContent = t('reg_fehler') + error.message; fehler.style.display = 'block'; return; }
  if (!data || !data.ok) {
    if (data && data.grund === 'belegt') {   // Sicherheitsnetz (sollte über ukWaehle abgefangen sein)
      const ok = await zeigeBestaetigung(
        t('uk_warnung_belegt', { email: data.belegt_email || '?', name: nm(data.person_name || '?') }),
        { gefahr: true, jaText: t('uk_uebernehmen') });
      if (ok) return ukZuweisen(personId, true);
      return;
    }
    fehler.textContent = t('uk_fehler'); fehler.style.display = 'block'; return;
  }
  info.textContent = t('uk_erfolg', { name: nm(data.person_name || '?') }); info.style.display = 'block';
  ukRenderAktuell(data.person_name, data.baum);
  await ladeMitglieder();   // Mitgliederliste (Karten-Spalte) aktualisieren
  setTimeout(() => schliesseUserKarte(), 900);
}
async function ukEntfernen() {
  if (!ukState) return;
  const fehler = document.getElementById('uk-fehler'); fehler.style.display = 'none';
  const { error } = await sbClient.rpc('person_user_loesen', { p_user: ukState.userId });
  if (error) { fehler.textContent = t('reg_fehler') + error.message; fehler.style.display = 'block'; return; }
  const info = document.getElementById('uk-info'); info.textContent = t('mv_aktualisiert'); info.style.display = 'block';
  ukRenderAktuell(null, null);
  await ladeMitglieder();
}
// Sprachwechsel bei offenem Overlay: Ziel/aktuell/Trefferliste neu beschriften.
function ukSpracheUpdate() {
  if (!document.getElementById('uk-modal')?.classList.contains('aktiv') || !ukState) return;
  document.getElementById('uk-ziel').textContent =
    t('uk_ziel', { wer: (ukState.name ? ukState.name + ' · ' : '') + (ukState.email || '') });

let maKarteTreffer = {};     // person_id -> Trefferzeile
let maKarteTimer   = null;

function maKarteSucheDebounce() { if (maKarteTimer) clearTimeout(maKarteTimer); maKarteTimer = setTimeout(maKarteSuche, 300); }
async function maKarteSuche() {
  const box = document.getElementById('ma-karte-erg');
  const q = document.getElementById('ma-karte-such').value.trim();
  if (q.length < 2) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="mp-pick-row"><span class="mp-pick-meta">…</span></div>`;
  // personen_suche/karten_suche_admin AND-en Vor-/Nachname -> je eine Präfix-Suche und mergen.
  const [r1, r2] = await Promise.all([
    sbClient.rpc('karten_suche_admin', { p_vorname: q, p_nachname: null, p_geburt: null, p_limit: 15, p_offset: 0 }),
    sbClient.rpc('karten_suche_admin', { p_vorname: null, p_nachname: q, p_geburt: null, p_limit: 15, p_offset: 0 })
  ]);
  if (r1.error || r2.error) {
    box.innerHTML = `<div class="mp-pick-row"><span class="mp-pick-meta" style="color:#b33">${escapeHtml((r1.error || r2.error).message)}</span></div>`; return;
  }
  maKarteTreffer = {}; const seen = new Set(); const liste = [];
  [...(r1.data || []), ...(r2.data || [])].forEach(r => { if (!seen.has(r.id)) { seen.add(r.id); liste.push(r); } });
  if (!liste.length) { box.innerHTML = `<div class="mp-pick-row"><span class="mp-pick-meta">${escapeHtml(t('uk_kein_treffer'))}</span></div>`; return; }
  if (!box._maInit) {
    tippAuswahl(box, '.mp-pick-row', el => { const id = el.getAttribute('data-id'); if (id) maKarteWaehle(id); });
    box._maInit = true;
  }
  box.innerHTML = liste.slice(0, 20).map(r => {
    maKarteTreffer[r.id] = r;
    const det = [];
    if (r.birth_date) det.push('* ' + escapeHtml(formatDatumLang(r.birth_date) || r.birth_date));
    if (r.baum)       det.push(escapeHtml(trefferBaumLabel(r)));
    const belegt = r.belegt_user
      ? `<div class="uk-badge uk-badge-belegt">${escapeHtml(t('uk_belegt_von', { email: r.belegt_email || '?' }))}</div>`
      : `<div class="uk-badge uk-badge-frei">${escapeHtml(t('uk_frei'))}</div>`;

      <div><div class="mp-pick-name">${escapeHtml(nm(r.name || '?'))}</div>
        <div class="mp-pick-meta">${det.join(' · ')}</div>${belegt}</div>
      <button type="button" class="account-btn">${escapeHtml(t('uk_zuweisen'))}</button>
    </div>`;
  }).join('');
}
function maKarteWaehle(personId) {

// Nur Familien laden, die der angemeldete Admin verwalten darf. Quelle ist die
// rollenbasierte RPC verwaltbare_familien (super_admin = ALLE Familien; owner/admin
// = eigene) — NICHT aus den Mitglieder-Zeilen ableiten, sonst fehlen Familien/Bäume
// OHNE (sichtbare) Mitglieder im Dropdown (z. B. ein Baum mit Personen, aber ohne
// verknüpfte Konten). Fallback auf mitglieder_verwaltbar, falls die RPC fehlt.
async function ladeAddFamilien() {
  const wrap = document.getElementById('ma-familie-wrap');
  const inp  = document.getElementById('ma-familie-input');   // jetzt <select>
  inp.innerHTML = '';
  const rFam = await sbClient.rpc('verwaltbare_familien');
  mvFamilien = {}; mvNameZuId = {}; mvFamilienBaeume = {};
  if (!rFam.error && rFam.data) {
    rFam.data.forEach(f => {
      if (!f.familie_id) return;
      mvFamilien[f.familie_id] = f.familie_name;
      mvFamilienBaeume[f.familie_id] = f.baum_namen || '';
    });
  } else {
    if (rFam.error) console.warn('verwaltbare_familien:', rFam.error.message);
    const { data, error } = await sbClient.rpc('mitglieder_verwaltbar');
    if (error) { zeigeMaFehler(error.message); return; }
    (data || []).forEach(m => { if (m.familie_id) mvFamilien[m.familie_id] = m.familie_name; });
  }
  // <select>-Optionen (value = familie_id) -> dieselbe suchbare Dropdown-Funktion.
  // Label = Familienname + (falls abweichend) Baum-Namen, damit die Familie auch
  // über einen STAMMBAUM-Namen gefunden wird (Such-Match läuft über den Optionstext).
  inp.innerHTML = Object.entries(mvFamilien)
    .sort((a, b) => nm(a[1] || '').localeCompare(nm(b[1] || '')))
    .map(([fid, name]) => `<option value="${escapeHtml(fid)}">${escapeHtml(familienSuchLabel(name, mvFamilienBaeume[fid]))}</option>`).join('');
  // Bei nur einer verwaltbaren Familie automatisch setzen + Feld ausblenden
  const keys = Object.keys(mvFamilien);
  if (keys.length <= 1) { wrap.style.display = 'none'; inp.value = keys[0] || ''; }
  else { wrap.style.display = ''; inp.value = ''; }
  macheAlleSelectsSuchbar(document.getElementById('mitglied-add-modal'));
}

function zeigeMaFehler(msg) {
  const el = document.getElementById('ma-fehler');
  el.textContent = msg; el.style.display = 'block';
}

// Legt einen neuen Benutzer an (falls nötig), verknüpft Rolle + Familie und
// verschickt eine Einladungs-Mail mit Registrierungslink (Edge Function).
async function fuegeMitgliedEinladen() {
  const email    = document.getElementById('ma-email').value.trim();
  const rolle    = document.getElementById('ma-rolle').value;
  const fehlerEl = document.getElementById('ma-fehler');
  const infoEl   = document.getElementById('ma-info');
  const button   = document.getElementById('ma-submit');
  fehlerEl.style.display = 'none'; infoEl.style.display = 'none';
  feldFehlerReset('mitglied-add-modal');

  // Familie aus dem <select> (value = familie_id; bei nur einer automatisch)
  let familie_id;
  if (Object.keys(mvFamilien).length <= 1) familie_id = Object.keys(mvFamilien)[0];
  else familie_id = document.getElementById('ma-familie-input').value || null;
  if (!email) return feldFehler('ma-email', t('feld_pflicht'));
  if (!familie_id) return feldFehler('ma-familie-input', t('feld_pflicht'));
  if (!isValidEmail(email)) { markiereEmailFehler(document.getElementById('ma-email'), true); return feldFokus('ma-email'); }

  // Optionale Namenskarten-Zuweisung vorab prüfen (Modus + Pflichtfelder)
  const karteModus = document.getElementById('ma-karte-modus').value;
  const vorname = document.getElementById('ma-vorname').value.trim();
  const nachname = document.getElementById('ma-nachname').value.trim();
  if (karteModus === 'bestehende' && !maKarteWahl) {
    fehlerEl.textContent = t('ma_karte_keine_gewaehlt'); fehlerEl.style.display = 'block'; return;
  }
  if (karteModus === 'neue') {
    if (!vorname && !nachname) return feldFehler('ma-vorname', t('ma_karte_name_pflicht'));
    if (!document.getElementById('ma-karte-baum').value) return feldFehler('ma-karte-baum', t('ma_karte_baum_pflicht'));
  }

  const altText = button.textContent;
  button.disabled = true; button.textContent = t('reg_senden_laeuft');

  let error = null, userId = null;
  try {
    const res = await sbClient.functions.invoke('mitglied-einladen', {
      body: { email, rolle, familie_id, sprache: aktuelleSprache },
    });
    error = res.error || (res.data && res.data.error) || null;
    userId = res.data && res.data.user_id;
  } catch (e) { error = e; }

  if (error) {
    button.disabled = false; button.textContent = altText;
    const msg = error.message || String(error);
    fehlerEl.textContent = /23505|bereits|already/i.test(msg) ? t('mv_bereits') : msg;
    fehlerEl.style.display = 'block'; return;
  }

  // Karte verknüpfen (User existiert nach dem Invite sofort -> user_id vorhanden)
  let karteName = null;
  if (userId && karteModus !== 'keine') {
    try {
      let personId = (karteModus === 'bestehende') ? maKarteWahl.id : null;
      if (karteModus === 'neue') {
        const baum = document.getElementById('ma-karte-baum').value;
        const { data: neuId, error: nErr } = await sbClient.rpc('namenskarte_anlegen',
          { p_stammbaum: baum, p_vorname: vorname, p_nachname: nachname, p_geburtsdatum: null });
        if (nErr) throw nErr;
        personId = neuId;
      }
      // belegte Karte (nur bei "bestehende" möglich) erst nach Warnung übernehmen
      let force = false;
      if (karteModus === 'bestehende' && maKarteWahl.belegt_user) {
        const ok = await zeigeBestaetigung(
          t('uk_warnung_belegt', { email: maKarteWahl.belegt_email || '?', name: nm(maKarteWahl.name || '?') }),
          { gefahr: true, jaText: t('uk_uebernehmen') });
        if (!ok) { button.disabled = false; button.textContent = altText; return; }
        force = true;
      }
      const { data: z, error: zErr } = await sbClient.rpc('karte_user_zuweisen',
        { p_person: personId, p_user: userId, p_force: force });
      if (zErr) throw zErr;
      if (z && z.ok) karteName = z.person_name;
      else if (z && z.grund === 'belegt') {
        const ok = await zeigeBestaetigung(
          t('uk_warnung_belegt', { email: z.belegt_email || '?', name: nm(z.person_name || '?') }),
          { gefahr: true, jaText: t('uk_uebernehmen') });
        if (ok) {
          const r2 = await sbClient.rpc('karte_user_zuweisen', { p_person: personId, p_user: userId, p_force: true });
          if (!r2.error && r2.data && r2.data.ok) karteName = r2.data.person_name;
        }
      }
    } catch (e) {
      button.disabled = false; button.textContent = altText;
      fehlerEl.textContent = t('ma_karte_link_fehler') + ' ' + (e.message || e); fehlerEl.style.display = 'block'; return;
    }
  }

  button.disabled = false; button.textContent = altText;
  ['ma-email','ma-vorname','ma-nachname','ma-karte-such'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  document.getElementById('ma-karte-modus').value = 'keine'; maKarteWahl = null; maRenderKarteChip(); maPruefeKarte();
  infoEl.textContent = karteName ? t('ma_erfolg_verknuepft', { name: nm(karteName) }) : t('ma_erfolg');
  infoEl.style.display = 'block';
}

// ============================================================
// OBAVJEŠTENJA / BENACHRICHTIGUNGEN — offene Zugangsanfragen (Admins)
// Liste via RPC offene_anfragen; Akzeptieren/Ablehnen via Edge Function
// anfrage-bearbeiten (Rechteprüfung + Mail + Protokoll). Badge = Anzahl.
// ============================================================
let offeneAnfragenCache = [];
let vknAnfragenCache = [];   // offene Verknüpfungs-Anträge (für den Ziel-Familie-Admin)
let deepLinkObav = false;    // ?obav=1 aus der Benachrichtigungs-Mail -> Liste nach Login öffnen
let deepLinkEvent = null;    // ?event=<id> aus der Event-Einladungs-Mail -> Event nach Login öffnen

// Deep-Link aus der Event-Einladungs-Mail: nach dem Laden der Eventliste das Event
// (best effort, falls im aktuellen Baum sichtbar) öffnen. Einmalig.
function verarbeiteEventDeepLink() {
  if (!deepLinkEvent) return;
  const ziel = deepLinkEvent; deepLinkEvent = null;
  wechselAnsicht('shorts');
  setTimeout(() => {
    if ((eventsCache || []).some(e => String(e.id) === String(ziel)) && typeof zeigeEventDetail === 'function') {
      zeigeEventDetail(ziel);
    }
  }, 300);
}

async function ladeOffeneAnfragen() {
  if (!aktuellerUser || !istAdmin()) { offeneAnfragenCache = []; vknAnfragenCache = []; renderObavBadges(); return; }
  const [r1, r2] = await Promise.all([
    sbClient.rpc('offene_anfragen'),
    sbClient.rpc('verknuepfungs_anfragen_offen')
  ]);
  if (r1.error) console.warn('offene_anfragen:', r1.error.message);
  if (r2.error) console.warn('verknuepfungs_anfragen_offen:', r2.error.message);
  offeneAnfragenCache = r1.error ? [] : (r1.data || []);
  vknAnfragenCache    = r2.error ? [] : (r2.data || []);
  renderObavBadges();
}

function renderObavBadges() {
  // Admin-Anfragen + persönliche Benachrichtigungen fließen in den gemeinsamen Avatar-Badge.
